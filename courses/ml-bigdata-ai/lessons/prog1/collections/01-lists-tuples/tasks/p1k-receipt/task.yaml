id: p1k-receipt
title: Чек с номерами строк
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите `receipt_lines(items)`: вернуть строки чека — каждую покупку с номером, а последней строкой итог.**

  `items` — покупки, строки вида `товар цена количество` (товар — одно слово, цена и количество — целые числа). Функция возвращает список строк: `N. товар: цена x количество = стоимость` (`x` — латинская буква) с номерами от 1, затем `Итого: S`. Если покупок нет, в списке одна строка `Чек пуст`. Список `items` функция не меняет.

  Пример 1
  ```call
  receipt_lines(["хлеб 45 2", "сыр 320 1", "чай 150 3"])
  ```
  ```return
  ['1. хлеб: 45 x 2 = 90', '2. сыр: 320 x 1 = 320', '3. чай: 150 x 3 = 450', 'Итого: 860']
  ```

  Пример 2
  ```call
  receipt_lines([])
  ```
  ```return
  ['Чек пуст']
  ```

  Ограничения: покупок от 0 до 50.
starter: |
  def receipt_lines(items):
      # План:
      # 1. Если покупок нет — вернуть список из одной строки «Чек пуст»
      # 2. Иначе перебрать покупки с номером (enumerate, start=1):
      #    распаковать название, цену и количество, посчитать стоимость,
      #    дописать строку чека и добавить стоимость к итогу
      # 3. После цикла дописать строку итога и вернуть список
      return []
solution: |
  def receipt_lines(items):
      if len(items) == 0:
          return ["Чек пуст"]
      lines = []
      total = 0
      for n, item in enumerate(items, start=1):
          name, price, count = item.split()
          cost = int(price) * int(count)
          total += cost
          lines.append(f"{n}. {name}: {price} x {count} = {cost}")
      lines.append(f"Итого: {total}")
      return lines
tests:
  function: receipt_lines
  no_mutate: true
  calls:
    - name: Пример 1
      args: [["хлеб 45 2", "сыр 320 1", "чай 150 3"]]
      expect: ["1. хлеб: 45 x 2 = 90", "2. сыр: 320 x 1 = 320", "3. чай: 150 x 3 = 450", "Итого: 860"]
    - name: Пример 2
      args: [[]]
      expect: ["Чек пуст"]
    - name: Одна покупка
      args: [["молоко 89 1"]]
      expect: ["1. молоко: 89 x 1 = 89", "Итого: 89"]
      hidden: true
    - name: Один товар в двух строках
      args: [["яблоки 120 2", "кефир 70 1", "яблоки 120 1"]]
      expect: ["1. яблоки: 120 x 2 = 240", "2. кефир: 70 x 1 = 70", "3. яблоки: 120 x 1 = 120", "Итого: 430"]
      hidden: true
    - name: Нулевое количество
      args: [["пакет 5 0", "хлеб 45 1"]]
      expect: ["1. пакет: 5 x 0 = 0", "2. хлеб: 45 x 1 = 45", "Итого: 45"]
      hidden: true
hints:
  - level: 1
    text: 'Что вернёт `"хлеб 45 2".split()` и как сразу разложить это по трём именам? Откуда взять номер строки, не заводя отдельный счётчик?'
  - level: 2
    text: '`name, price, count = item.split()` — после распаковки цена и количество ещё строки: для умножения их превращают в `int`. Номер даёт `for n, item in enumerate(items, start=1)`. Чтобы увидеть, что происходит внутри, добавьте `print` — он не влияет на проверку.'
  - level: 3
    text: 'В цикле: стоимость строки, прибавить её к итогу, дописать строку чека, собранную f-строкой. Строку итога дописывают один раз — после цикла.'
