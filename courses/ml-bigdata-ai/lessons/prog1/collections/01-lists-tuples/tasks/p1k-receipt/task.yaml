id: p1k-receipt
title: Чек с номерами строк
sandbox: python-browser
difficulty: 2
statement: |
  **Напечатайте чек: каждую покупку с номером, а последней строкой — итог.**

  Ввод — покупки по одной в строке: `товар цена количество` (товар — одно слово, цена и количество — целые числа), в конце пустая строка. Вывод — строки `N. товар: цена x количество = стоимость` с номерами от 1, затем `Итого: S`. Если покупок нет, выведите одну строку `Чек пуст`.

  Пример 1
  ```input
  хлеб 45 2
  сыр 320 1
  чай 150 3

  ```
  ```output
  1. хлеб: 45 x 2 = 90
  2. сыр: 320 x 1 = 320
  3. чай: 150 x 3 = 450
  Итого: 860
  ```
starter: |
  # План:
  # 1. Прочитать строки до пустой в список
  # 2. Если список пуст — вывести «Чек пуст»
  # 3. Иначе перебрать строки с номером (enumerate, start=1):
  #    распаковать название, цену и количество, посчитать стоимость,
  #    вывести строку чека и добавить стоимость к итогу
  # 4. Вывести итог
stdin: "хлеб 45 2\nсыр 320 1\nчай 150 3\n\n"
solution: |
  lines = []
  line = input()
  while line != "":
      lines.append(line)
      line = input()
  if len(lines) == 0:
      print("Чек пуст")
  else:
      total = 0
      for n, item in enumerate(lines, start=1):
          name, price, count = item.split()
          cost = int(price) * int(count)
          total += cost
          print(f"{n}. {name}: {price} x {count} = {cost}")
      print("Итого:", total)
tests:
  io:
    - name: Пример из условия
      stdin: "хлеб 45 2\nсыр 320 1\nчай 150 3\n\n"
      stdout: "1. хлеб: 45 x 2 = 90\n2. сыр: 320 x 1 = 320\n3. чай: 150 x 3 = 450\nИтого: 860"
    - name: Пустой чек
      stdin: "\n"
      stdout: "Чек пуст"
      hidden: true
    - name: Одна покупка
      stdin: "молоко 89 1\n\n"
      stdout: "1. молоко: 89 x 1 = 89\nИтого: 89"
      hidden: true
    - name: Один товар в двух строках
      stdin: "яблоки 120 2\nкефир 70 1\nяблоки 120 1\n\n"
      stdout: "1. яблоки: 120 x 2 = 240\n2. кефир: 70 x 1 = 70\n3. яблоки: 120 x 1 = 120\nИтого: 430"
      hidden: true
    - name: Нулевое количество
      stdin: "пакет 5 0\nхлеб 45 1\n\n"
      stdout: "1. пакет: 5 x 0 = 0\n2. хлеб: 45 x 1 = 45\nИтого: 45"
      hidden: true
hints:
  - level: 1
    text: 'Чтение до пустой строки вы уже делали шаблоном `while` и `append`. Что вернёт `"хлеб 45 2".split()` и как сразу разложить это по трём именам?'
  - level: 2
    text: '`name, price, count = item.split()` — после распаковки цена и количество ещё строки: для умножения их превращают в `int`. Номер даёт `for n, item in enumerate(lines, start=1)`.'
  - level: 3
    text: 'В цикле: стоимость строки, прибавить её к итогу, напечатать строку чека через f-строку. Итог печатают один раз — после цикла.'
