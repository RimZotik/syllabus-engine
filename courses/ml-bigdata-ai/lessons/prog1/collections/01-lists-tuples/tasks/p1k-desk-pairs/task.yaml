id: p1k-desk-pairs
title: Рассадка по партам
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите `desk_pairs(students)`: рассадите учеников по двое в порядке списка и верните список парт-кортежей.**

  Первый и второй ученик — за первую парту, третий и четвёртый — за вторую и так далее. Парта — кортеж из двух имён; если учеников нечётное число, последняя парта — кортеж из одного имени. Список `students` функция не меняет.

  Пример 1
  ```call
  desk_pairs(["Аня", "Борис", "Вера", "Глеб"])
  ```
  ```return
  [('Аня', 'Борис'), ('Вера', 'Глеб')]
  ```

  Пример 2
  ```call
  desk_pairs(["Аня", "Борис", "Вера"])
  ```
  ```return
  [('Аня', 'Борис'), ('Вера',)]
  ```

  Ограничения: учеников от 0 до 40.
starter: |
  def desk_pairs(students):
      # План:
      # 1. Пустой список парт
      # 2. Идти по индексам через один: 0, 2, 4, ...
      # 3. Если у ученика есть сосед справа — кортеж из двух имён, иначе кортеж из одного
      # 4. Дописать парту в список и после цикла вернуть его
      return []
solution: |
  def desk_pairs(students):
      desks = []
      for i in range(0, len(students), 2):
          if i + 1 < len(students):
              desks.append((students[i], students[i + 1]))
          else:
              desks.append((students[i],))
      return desks
tests:
  function: desk_pairs
  no_mutate: true
  strict_types: true
  calls:
    - name: Чётное число учеников
      args: [["Аня", "Борис", "Вера", "Глеб"]]
      expect_py: "[('Аня', 'Борис'), ('Вера', 'Глеб')]"
    - name: Последний сидит один
      args: [["Аня", "Борис", "Вера"]]
      expect_py: "[('Аня', 'Борис'), ('Вера',)]"
    - name: Каждая парта — кортеж
      args: [["Аня", "Борис", "Вера", "Глеб", "Дима"]]
      expect_py: "[('Аня', 'Борис'), ('Вера', 'Глеб'), ('Дима',)]"
    - name: Один ученик
      args: [["Аня"]]
      expect_py: "[('Аня',)]"
    - name: Пустой класс
      args: [[]]
      expect: []
hints:
  - level: 1
    text: '`range` умеет шагать через один — какой у него третий аргумент? Какие элементы стоят на местах `i` и `i + 1` и когда индекса `i + 1` уже нет?'
  - level: 2
    text: 'Пара — кортеж из элементов с индексами `i` и `i + 1`. Для одинокого ученика проверьте в редакторе `type(("Аня"))`: скобки ли делают кортеж кортежем?'
  - level: 3
    text: 'Идите по индексам `0, 2, 4, …` и для каждого `i` спросите: есть ли индекс `i + 1`? Кортеж из одного элемента пишут с запятой: `(x,)`.'
