id: p1k-desk-pairs
title: Рассадка по партам
sandbox: python-browser
difficulty: 2
statement: |
  Учитель рассаживает класс по двое в порядке списка: первый и второй ученик — за первую парту, третий и четвёртый — за вторую, и так далее. Если учеников нечётное число, последний сидит один.

  Напишите функцию `desk_pairs(students)`, которая возвращает список парт. Каждая парта — **кортеж**: из двух имён или, у последнего ученика без пары, из одного. Список `students` функция не меняет. Вводить и печатать ничего не нужно — проверки вызывают функцию сами:

  ```python
  desk_pairs(["Аня", "Борис", "Вера", "Глеб"])
  # [('Аня', 'Борис'), ('Вера', 'Глеб')]
  desk_pairs(["Аня", "Борис", "Вера"])
  # [('Аня', 'Борис'), ('Вера',)]
  ```
starter: |
  def desk_pairs(students):
      # План:
      # 1. Пустой список парт
      # 2. Идти по индексам через один: 0, 2, 4, ...
      # 3. Если у ученика есть сосед справа — кортеж из двух имён, иначе кортеж из одного
      # 4. Дописать парту в список и после цикла вернуть его
      return []
solution: |
  def desk_pairs(students):
      desks = []
      for i in range(0, len(students), 2):
          if i + 1 < len(students):
              desks.append((students[i], students[i + 1]))
          else:
              desks.append((students[i],))
      return desks
tests:
  asserts:
    - name: Чётное число учеников
      code: |
        assert desk_pairs(["Аня", "Борис", "Вера", "Глеб"]) == [("Аня", "Борис"), ("Вера", "Глеб")], "Для четырёх учеников — две парты: [('Аня', 'Борис'), ('Вера', 'Глеб')]"
    - name: Последний сидит один
      code: |
        desks = desk_pairs(["Аня", "Борис", "Вера"])
        assert len(desks) == 2, "Для трёх учеников должно быть две парты"
        assert desks[-1] == ("Вера",), "Последняя парта — кортеж из одного имени ('Вера',), а не строка и не список. Что делает кортеж кортежем?"
    - name: Каждая парта — кортеж
      code: |
        desks = desk_pairs(["Аня", "Борис", "Вера", "Глеб", "Дима"])
        assert all(type(d) == tuple for d in desks), "Каждая парта должна быть кортежем"
        assert desks == [("Аня", "Борис"), ("Вера", "Глеб"), ("Дима",)], "Для пяти учеников — [('Аня', 'Борис'), ('Вера', 'Глеб'), ('Дима',)]"
    - name: Один ученик
      code: |
        assert desk_pairs(["Аня"]) == [("Аня",)], "Один ученик — одна парта ('Аня',)"
    - name: Пустой класс
      code: |
        assert desk_pairs([]) == [], "Для пустого списка — пустой список парт"
    - name: Список учеников не меняется
      code: |
        cls = ["Аня", "Борис", "Вера"]
        desk_pairs(cls)
        assert cls == ["Аня", "Борис", "Вера"], "Функция не должна менять переданный список"
hints:
  - level: 1
    text: '`range` умеет шагать через один — какой у него третий аргумент? Какие элементы стоят на местах `i` и `i + 1` и когда индекса `i + 1` уже нет?'
  - level: 2
    text: 'Пара — кортеж из элементов с индексами `i` и `i + 1`. Для одинокого ученика проверьте в редакторе `type(("Аня"))`: скобки ли делают кортеж кортежем?'
  - level: 3
    text: '`for i in range(0, len(students), 2):` — если `i + 1 < len(students)`, дописать `(students[i], students[i + 1])`, иначе `(students[i],)`.'
