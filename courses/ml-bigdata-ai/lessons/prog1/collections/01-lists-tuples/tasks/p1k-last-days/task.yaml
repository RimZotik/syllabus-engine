id: p1k-last-days
title: Последние дни и первая половина
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите две функции: `last_n(temps, n)` возвращает новый список из последних `n` температур, `first_half(temps)` — новый список из первой половины дней.**

  Если `n` больше числа дней — все дни, если `n` равно 0 — пустой список. При нечётном числе дней средний день в первую половину не входит. Список `temps` функции не меняют.

  Пример 1
  ```input
  last_n([12, 15, 9, -2, 7], 2)
  first_half([12, 15, 9, -2, 7])
  ```
  ```output
  [-2, 7]
  [12, 15]
  ```

  Пример 2
  ```input
  last_n([12, 15, 9, -2, 7], 0)
  last_n([12, 15, 9, -2, 7], 10)
  ```
  ```output
  []
  [12, 15, 9, -2, 7]
  ```

  Ограничения: 0 ≤ `n`; список может быть пустым.
starter: |
  def last_n(temps, n):
      # План:
      # 1. Взять срез с конца списка длиной n
      # 2. Проверить, что получается при n = 0 и при n больше длины
      return []


  def first_half(temps):
      # План:
      # 1. Найти, сколько дней в первой половине (целочисленное деление)
      # 2. Вернуть срез от начала до этого места
      return []
solution: |
  def last_n(temps, n):
      return temps[len(temps) - n:]


  def first_half(temps):
      return temps[:len(temps) // 2]
tests:
  asserts:
    - name: Последние три дня
      code: |
        assert last_n([12, 15, 9, -2, 7], 3) == [9, -2, 7], "last_n([12, 15, 9, -2, 7], 3) должно вернуть [9, -2, 7]"
    - name: Ноль дней
      code: |
        assert last_n([12, 15, 9], 0) == [], "last_n([12, 15, 9], 0) должно вернуть []. Проверьте, что даёт срез temps[-0:]"
    - name: Дней меньше, чем просят
      code: |
        assert last_n([5, 6], 5) == [5, 6], "last_n([5, 6], 5) должно вернуть [5, 6]"
    - name: Пустой список
      code: |
        assert last_n([], 2) == [] and first_half([]) == [], "Для пустого списка обе функции возвращают []"
    - name: Чётное число дней
      code: |
        assert first_half([1, 2, 3, 4]) == [1, 2], "first_half([1, 2, 3, 4]) должно вернуть [1, 2]"
    - name: Нечётное число дней
      code: |
        assert first_half([1, 2, 3, 4, 5]) == [1, 2], "first_half([1, 2, 3, 4, 5]) должно вернуть [1, 2]: средний день не входит"
    - name: Один день
      code: |
        assert first_half([7]) == [] and last_n([7], 1) == [7], "first_half([7]) — [], last_n([7], 1) — [7]"
    - name: Исходный список не меняется
      code: |
        t = [3, 1, 2]
        a = last_n(t, 2)
        b = first_half(t)
        assert t == [3, 1, 2], "Функции не должны менять переданный список"
        assert a is not t and b is not t, "Функции должны возвращать новый список, а не тот же самый"
    - name: Новый список и при n больше числа дней
      code: |
        t = [3, 1, 2]
        c = last_n(t, 10)
        d = last_n(t, 3)
        assert c == t and c is not t and d is not t, "last_n должна возвращать новый список, даже если берёт все дни"
hints:
  - level: 1
    text: 'Запустите в редакторе `print([12, 15, 9][-0:])`. Что получилось и почему? Отрицательный индекс `-n` — это то же, что `len(temps) - n`?'
  - level: 2
    text: '`-0` — это просто 0, поэтому `temps[-0:]` — весь список. Начало среза удобнее считать явно, от длины списка: при `n = 0` срез должен начаться за последним элементом. А при `n` больше длины вспомните, что делает срез за границей. Для половины — целочисленное деление `//`.'
  - level: 3
    text: 'Для последних дней срез начинается с индекса `len(temps) - n`. Проверьте на бумаге, куда он указывает при `n = 0` и при `n` больше длины. Первая половина заканчивается на `len(temps) // 2`.'
