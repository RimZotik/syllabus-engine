title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: slice-step-end
  type: single
  q: |
    Что выведет программа?
    ```python
    days = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"]
    print(days[1:5:2], days[-2:])
    ```
  options:
  - "`['вт', 'чт'] ['сб', 'вс']`"
  - "`['вт', 'чт', 'сб'] ['сб', 'вс']`"
  - "`['вт', 'чт'] ['вс', 'сб']`"
  - "`['пн', 'ср', 'пт'] ['сб', 'вс']`"
  answer: 0
  explain: 'Срез `[1:5:2]` берёт индексы 1 и 3: индекс 5 — конец, он не входит. Индексы считаются с нуля, поэтому индекс 1 — это «вт». `days[-2:]` идёт от предпоследнего элемента до конца в обычном порядке; задом наперёд список идёт только при отрицательном шаге.'
- id: slice-vs-index
  type: single
  q: |
    Что произойдёт при запуске?
    ```python
    pulse = [80, 90, 85]
    print(pulse[1:10], pulse[5:])
    print(pulse[3])
    ```
  options:
  - 'Выведется `[90, 85] []`, затем — ошибка `IndexError`'
  - 'Ошибка `IndexError` сразу, на первом `print`: индексы 10 и 5 за границей списка'
  - 'Выведется `[90, 85] []`, затем — `None`'
  - 'Выведется `[90, 85] [85]`, затем — `85`: за границей берётся последний элемент'
  answer: 0
  explain: 'Срез за границей не падает, а берёт то, что есть: от индекса 1 до конца — `[90, 85]`, а начиная с индекса 5 нет ничего — пустой список. Обращение к одному элементу ведёт себя иначе: элемента с индексом 3 нет, и это ошибка, а не `None`. Последний элемент за границей Python не подставляет ни в срезе, ни при обращении по индексу.'
- id: append-then-extend
  type: single
  q: |
    Что выведет программа?
    ```python
    week = [[3, 5], [4]]
    week.append([2, 1])
    week.extend([2, 1])
    print(len(week), week[-1])
    ```
  options:
  - '`5 1`'
  - '`4 [2, 1]`'
  - '`6 1`'
  - '`5 [2, 1]`'
  answer: 0
  explain: '`append` дописывает свой аргумент одним элементом — список `[2, 1]` стал третьим элементом. `extend` дописывает элементы аргумента по одному — ещё 2 и 1. Получилось `[[3, 5], [4], [2, 1], 2, 1]`: пять элементов, последний — число 1. `4 [2, 1]` вышло бы, если бы оба метода работали как `append`, `6 1` — если бы оба работали как `extend`.'
- id: sort-none-fix
  type: multi
  q: |
    Программа должна вывести самую низкую оценку, но падает с `TypeError`. Чем заменить строку `marks = marks.sort()`, чтобы программа вывела `3`? Остальные строки не меняются.
    ```python
    marks = [4, 5, 3]
    marks = marks.sort()
    print(marks[0])
    ```
  options:
  - '`marks.sort()`'
  - '`marks = sorted(marks)`'
  - '`sorted(marks)`'
  - '`marks = marks.sort(reverse=True)`'
  answer:
  - 0
  - 1
  explain: '`sort` переставляет элементы в самом списке и возвращает `None`, поэтому `marks = marks.sort()` привязывает имя к `None`. Без присваивания список останется отсортированным. `sorted` возвращает новый список — его нужно привязать к имени, иначе результат пропадёт, а `marks` останется `[4, 5, 3]` и выведется 4. С `reverse=True` присваивание по-прежнему даёт `None`.'
- id: remove-pop
  type: single
  q: |
    Что выведет программа?
    ```python
    queue = ["Аня", "Борис", "Вера", "Борис"]
    queue.remove("Борис")
    gone = queue.pop()
    print(gone, queue)
    ```
  options:
  - "`Борис ['Аня', 'Вера']`"
  - "`Вера ['Аня']`"
  - "`Вера ['Аня', 'Борис']`"
  - "`None ['Аня', 'Вера']`"
  answer: 0
  explain: '`remove` убирает только **первый** элемент, равный аргументу: остаётся `["Аня", "Вера", "Борис"]`. `pop()` без аргумента убирает последний элемент и возвращает его — это второй Борис. В отличие от других методов, меняющих список, `pop` возвращает не `None`.'
- id: remove-in-loop
  type: single
  q: |
    Функция должна убрать из списка все отрицательные показания:
    ```python
    def drop_negative(values):
        for v in values:
            if v < 0:
                values.remove(v)
        return values
    ```
    На каком вызове она вернёт неверный ответ?
  options:
  - '`drop_negative([-1, -2, 5])`'
  - '`drop_negative([3, -1, 4])`'
  - '`drop_negative([-1, 3, -2])`'
  - '`drop_negative([5, 6])`'
  answer: 0
  explain: 'Цикл идёт по индексам. В `[-1, -2, 5]` после удаления `-1` число `-2` сдвигается на индекс 0, а цикл переходит к индексу 1 — это уже 5. Вернётся `[-2, 5]`. В остальных вызовах пропускается положительное число или не пропускается ничего, поэтому ответ случайно верный. Правильно — собрать подходящие элементы в новый список.'
- id: tuple-next-year
  type: multi
  q: Дата хранится кортежем `d = (12, 4, 2008)`. Какие варианты привяжут `d` к той же дате на год позже, `(12, 4, 2009)`?
  options:
  - '`d = (d[0], d[1], d[2] + 1)`'
  - '`day, month, year = d`, затем `d = (day, month, year + 1)`'
  - '`d[2] += 1`'
  - '`d = d[:2] + (d[2] + 1)`'
  answer:
  - 0
  - 1
  explain: 'Элементы кортежа заменить нельзя: `d[2] += 1` даёт `TypeError`. Новую дату собирают заново — из элементов по индексу или после распаковки. В варианте `d[:2] + (d[2] + 1)` выражение `(d[2] + 1)` — не кортеж, а число в скобках: кортеж делает запятая, `(d[2] + 1,)`. Сложить кортеж с числом нельзя — снова `TypeError`.'
  traps:
  - 3
- id: return-two
  type: multi
  q: |
    Какие строки кода выполнятся без ошибки после такого определения?
    ```python
    def stats(marks):
        return sum(marks), len(marks)
    ```
  options:
  - '`total, count = stats([5, 4])`'
  - '`result = stats([5, 4])`'
  - '`count = stats([5, 4])[1]`'
  - '`total, count, avg = stats([5, 4])`'
  - '`stats([5, 4]).append(3)`'
  answer:
  - 0
  - 1
  - 2
  explain: '`return` через запятую возвращает одно значение — кортеж `(9, 2)`. Его можно распаковать в два имени, привязать к одному имени или взять элемент по индексу. Имён для распаковки должно быть ровно два — с тремя будет `ValueError`. `append` у кортежа нет: это не список, а неизменяемая запись.'
- id: swap-three
  type: single
  q: |
    Что выведет программа?
    ```python
    a, b, c = 1, 2, 3
    a, b, c = c, a, b
    print(a, b, c)
    ```
  options:
  - '`3 1 2`'
  - '`3 3 3`'
  - '`2 3 1`'
  - 'Ошибку `ValueError`'
  answer: 0
  explain: 'Правая часть `c, a, b` — кортеж `(3, 1, 2)`, собранный до того, как имена привяжут заново. Затем он распаковывается по порядку: `a` — 3, `b` — 1, `c` — 2. Присваивания не идут по одному слева направо, поэтому `3 3 3` не получится.'
- id: zip-twice
  type: single
  q: |
    Что выведет программа?
    ```python
    names = ["Аня", "Борис", "Вера"]
    marks = [5, 4]
    pairs = zip(names, marks)
    for name, mark in pairs:
        print(name, mark)
    print(list(pairs))
    ```
  options:
  - '`Аня 5`, `Борис 4` и `[]` — каждое в своей строке'
  - '`Аня 5`, `Борис 4`, `Вера None` и `[]` — каждое в своей строке'
  - "`Аня 5`, `Борис 4` и `[('Аня', 5), ('Борис', 4)]` — каждое в своей строке"
  - '`Аня 5`, `Борис 4` и ошибку `IndexError` на Вере'
  answer: 0
  explain: '`zip` останавливается на коротком списке без ошибки и без `None` — Вера молча пропадает. Пары он выдаёт по одной, по мере перебора, и цикл забрал их все: второй перебор, `list(pairs)`, не получает ничего. Нужны пары дважды — сразу сохраняют `list(zip(...))`.'
- id: open-tuple-or-list
  type: open
  q: Программа учёта посещений хранит дату урока (день, месяц, год) и фамилии учеников, которые пришли. Что из этого вы сделаете кортежем, а что — списком? Объясните выбор.
  rubric:
  - дата — кортеж, потому что это запись из фиксированного числа полей (ровно три, у каждого свой смысл), добавлять и удалять в ней нечего, а неизменяемость защищает её от случайной правки; поля удобно получить распаковкой (достаточно одной верной причины — например, фиксированного набора полей)
  - фамилии — список, потому что это однородные значения, число которых меняется (пришёл ещё один ученик — append), и их перебирают в цикле
  wrong_answers:
  - всё — кортежами, потому что кортеж нельзя испортить
  - фамилии — кортежем, потому что их нельзя перебрать в for, если это список
  - дата — списком, потому что у кортежа нет индексов
  followups:
  - Что придётся сделать с кортежем фамилий, когда придёт опоздавший ученик?
