title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: slice-step-end
  type: single
  q: |
    Что выведет программа?
    ```python
    days = ["пн", "вт", "ср", "чт", "пт", "сб", "вс"]
    print(days[1:5:2], days[-2:])
    ```
  options:
  - "`['вт', 'чт'] ['сб', 'вс']`"
  - "`['вт', 'чт', 'сб'] ['сб', 'вс']`"
  - "`['вт', 'чт'] ['вс', 'сб']`"
  - "`['пн', 'ср', 'пт'] ['сб', 'вс']`"
  answer: 0
  explain: 'Срез `[1:5:2]` берёт индексы 1 и 3: индекс 5 — конец, он не входит. Индексы считаются с нуля, поэтому индекс 1 — это «вт». `days[-2:]` идёт от предпоследнего элемента до конца в обычном порядке; задом наперёд список идёт только при отрицательном шаге.'
- id: slice-vs-index
  type: single
  q: |
    Что произойдёт при запуске?
    ```python
    pulse = [80, 90, 85]
    print(pulse[1:10], pulse[5:])
    print(pulse[3])
    ```
  options:
  - 'Выведется `[90, 85] []`, затем — ошибка `IndexError`'
  - 'Ошибка `IndexError` сразу, на первом `print`: индексы 10 и 5 за границей списка'
  - 'Выведется `[90, 85] []`, затем — `None`'
  - 'Выведется `[90, 85] [85]`, затем — `85`: за границей берётся последний элемент'
  answer: 0
  explain: 'Срез за границей не падает, а берёт то, что есть: от индекса 1 до конца — `[90, 85]`, а начиная с индекса 5 нет ничего — пустой список. Обращение к одному элементу ведёт себя иначе: элемента с индексом 3 нет, и это ошибка, а не `None`. Последний элемент за границей Python не подставляет ни в срезе, ни при обращении по индексу.'
- id: append-then-extend
  type: single
  q: |
    Что выведет программа?
    ```python
    week = [[3, 5], [4]]
    week.append([2, 1])
    week.extend([2, 1])
    print(len(week), week[-1])
    ```
  options:
  - '`5 1`'
  - '`4 [2, 1]`'
  - '`6 1`'
  - '`5 [2, 1]`'
  answer: 0
  explain: '`append` дописывает свой аргумент одним элементом — список `[2, 1]` стал третьим элементом. `extend` дописывает элементы аргумента по одному — ещё 2 и 1. Получилось `[[3, 5], [4], [2, 1], 2, 1]`: пять элементов, последний — число 1. `4 [2, 1]` вышло бы, если бы оба метода работали как `append`, `6 1` — если бы оба работали как `extend`.'
- id: remove-pop
  type: single
  q: |
    Что выведет программа?
    ```python
    queue = ["Аня", "Борис", "Вера", "Борис"]
    queue.remove("Борис")
    gone = queue.pop()
    print(gone, queue)
    ```
  options:
  - "`Борис ['Аня', 'Вера']`"
  - "`Вера ['Аня']`"
  - "`Вера ['Аня', 'Борис']`"
  - "`None ['Аня', 'Вера']`"
  answer: 0
  explain: '`remove` убирает только **первый** элемент, равный аргументу: остаётся `["Аня", "Вера", "Борис"]`. `pop()` без аргумента убирает последний элемент и возвращает его — это второй Борис. В отличие от других методов, меняющих список, `pop` возвращает не `None`.'
- id: swap-three
  type: single
  q: |
    Что выведет программа?
    ```python
    a, b, c = 1, 2, 3
    a, b, c = c, a, b
    print(a, b, c)
    ```
  options:
  - '`3 1 2`'
  - '`3 3 3`'
  - '`2 3 1`'
  - 'Ошибку `ValueError`'
  answer: 0
  explain: 'Правая часть `c, a, b` — кортеж `(3, 1, 2)`, собранный до того, как имена привяжут заново. Затем он распаковывается по порядку: `a` — 3, `b` — 1, `c` — 2. Присваивания не идут по одному слева направо, поэтому `3 3 3` не получится.'
- id: zip-twice
  type: single
  q: |
    Что выведет программа?
    ```python
    names = ["Аня", "Борис", "Вера"]
    marks = [5, 4]
    pairs = zip(names, marks)
    for name, mark in pairs:
        print(name, mark)
    print(list(pairs))
    ```
  options:
  - '`Аня 5`, `Борис 4` и `[]` — каждое в своей строке'
  - '`Аня 5`, `Борис 4`, `Вера None` и `[]` — каждое в своей строке'
  - "`Аня 5`, `Борис 4` и `[('Аня', 5), ('Борис', 4)]` — каждое в своей строке"
  - '`Аня 5`, `Борис 4` и ошибку `IndexError` на Вере'
  answer: 0
  explain: '`zip` останавливается на коротком списке без ошибки и без `None` — Вера молча пропадает. Пары он выдаёт по одной, по мере перебора, и цикл забрал их все: второй перебор, `list(pairs)`, не получает ничего. Нужны пары дважды — сразу сохраняют `list(zip(...))`.'
- id: k1-complete-slices
  type: code
  q: |
    Во вводе — температуры по дням через пробел. Замените оба `...` срезами: **в первой строке — температуры чётных дней (2-го, 4-го, …), во второй — все в обратном порядке.**
    ```input
    1 2 3 4 5
    ```
    ```output
    2 4
    5 4 3 2 1
    ```
  starter: |
    temps = input().split()
    even_days = ...
    backwards = ...
    print(" ".join(even_days))
    print(" ".join(backwards))
  solution: |
    temps = input().split()
    even_days = temps[1::2]
    backwards = temps[::-1]
    print(" ".join(even_days))
    print(" ".join(backwards))
  tests:
    io:
    - name: Пять дней
      stdin: "1 2 3 4 5\n"
      stdout: "2 4\n5 4 3 2 1"
    - name: Два дня
      stdin: "-3 8\n"
      stdout: "8\n8 -3"
      hidden: true
    - name: Неделя
      stdin: "10 12 9 7 15 14 11\n"
      stdout: "12 7 14\n11 14 15 7 9 12 10"
      hidden: true
  explain: |
    Второй день — индекс 1, дальше через один: начало 1, конец не указан, шаг 2 — `temps[1::2]`. Отрицательный шаг идёт с конца: `temps[::-1]` — новый список задом наперёд, сам `temps` не меняется.
- id: k1-fix-sort-none
  type: code
  q: |
    Программа читает оценки через пробел и падает с `TypeError`. **Исправьте её: она выводит худшую и лучшую оценку.**
    ```input
    4 5 3
    ```
    ```output
    Худшая: 3
    Лучшая: 5
    ```
  starter: |
    marks = []
    for w in input().split():
        marks.append(int(w))
    marks = marks.sort()
    print("Худшая:", marks[0])
    print("Лучшая:", marks[-1])
  solution: |
    marks = []
    for w in input().split():
        marks.append(int(w))
    marks.sort()
    print("Худшая:", marks[0])
    print("Лучшая:", marks[-1])
  tests:
    io:
    - name: Три оценки
      stdin: "4 5 3\n"
      stdout: "Худшая: 3\nЛучшая: 5"
    - name: Одна оценка
      stdin: "4\n"
      stdout: "Худшая: 4\nЛучшая: 4"
      hidden: true
    - name: Повторы
      stdin: "5 2 3 5 2\n"
      stdout: "Худшая: 2\nЛучшая: 5"
      hidden: true
  explain: |
    `sort` переставляет элементы в самом списке и возвращает `None`, поэтому `marks = marks.sort()` привязывает имя к `None`, и `None[0]` — `TypeError`. Достаточно вызвать `marks.sort()` без присваивания. Подойдёт и `marks = sorted(marks)`: `sorted` возвращает новый список.
- id: k1-next-year
  type: code
  q: |
    Дата — кортеж `(день, месяц, год)`. **Напишите `next_year(date)`: вернуть ту же дату на год позже — тоже кортежем.**
    ```input
    next_year((12, 4, 2008))
    ```
    ```output
    (12, 4, 2009)
    ```
  starter: |
    def next_year(date):
        date[2] += 1
        return date
  solution: |
    def next_year(date):
        day, month, year = date
        return (day, month, year + 1)
  tests:
    asserts:
    - name: Двенадцатое апреля
      code: |
        r = next_year((12, 4, 2008))
        assert r == (12, 4, 2009), "next_year((12, 4, 2008)) должна вернуть (12, 4, 2009), а вернула " + repr(r)
    - name: Результат — кортеж
      code: |
        r = next_year((31, 12, 1999))
        assert type(r) == tuple, "Дата должна остаться кортежем, а вернулось значение типа " + type(r).__name__
        assert r == (31, 12, 2000), "next_year((31, 12, 1999)) должна вернуть (31, 12, 2000), а вернула " + repr(r)
    - name: Первое января
      code: |
        r = next_year((1, 1, 2024))
        assert r == (1, 1, 2025), "next_year((1, 1, 2024)) должна вернуть (1, 1, 2025), а вернула " + repr(r)
  explain: |
    Элемент кортежа заменить нельзя: `date[2] += 1` даёт `TypeError`. Новую дату собирают заново — после распаковки или из элементов по индексу: `(date[0], date[1], date[2] + 1)`.
- id: k1-fix-drop-negative
  type: code
  q: |
    **Исправьте `drop_negative(values)`: вернуть новый список показаний термометра без отрицательных, в прежнем порядке.** Сейчас на некоторых данных она ошибается.
    ```input
    drop_negative([3, -1, 4])
    ```
    ```output
    [3, 4]
    ```
    Переданный список не меняется.
  starter: |
    def drop_negative(values):
        for v in values:
            if v < 0:
                values.remove(v)
        return values
  solution: |
    def drop_negative(values):
        result = []
        for v in values:
            if v >= 0:
                result.append(v)
        return result
  tests:
    asserts:
    - name: Отрицательное в середине
      code: |
        r = drop_negative([3, -1, 4])
        assert r == [3, 4], "drop_negative([3, -1, 4]) должна вернуть [3, 4], а вернула " + repr(r)
    - name: Два отрицательных подряд
      code: |
        r = drop_negative([-1, -2, 5])
        assert r == [5], "drop_negative([-1, -2, 5]) должна вернуть [5], а вернула " + repr(r)
    - name: Список не меняется
      code: |
        data = [2, -7, -7, 0]
        r = drop_negative(data)
        assert r == [2, 0], "drop_negative([2, -7, -7, 0]) должна вернуть [2, 0], а вернула " + repr(r)
        assert data == [2, -7, -7, 0], "Переданный список не должен меняться, а стал " + repr(data)
    - name: Пустой список
      code: |
        r = drop_negative([])
        assert r == [], "drop_negative([]) должна вернуть [], а вернула " + repr(r)
  explain: |
    Цикл `for` идёт по индексам: после `remove` элементы сдвигаются, и следующий за удалённым пропускается — `[-1, -2, 5]` даёт `[-2, 5]`. К тому же `remove` портит переданный список. Пока идёт цикл, длину списка не меняют: нужные элементы собирают в новый список.
- id: k1-zip-excellent
  type: code
  q: |
    В первой строке — имена учеников, во второй — их оценки в том же порядке. **Выведите имена тех, у кого 5, каждое в своей строке.**
    ```input
    Аня Борис Вера
    5 4 5
    ```
    ```output
    Аня
    Вера
    ```
    Если имён и оценок разное число, выведите только `Списки разной длины`.
  starter: |
    names = input().split()
    marks = input().split()
  solution: |
    names = input().split()
    marks = input().split()
    if len(names) != len(marks):
        print("Списки разной длины")
    else:
        for name, mark in zip(names, marks):
            if mark == "5":
                print(name)
  tests:
    io:
    - name: Две пятёрки
      stdin: "Аня Борис Вера\n5 4 5\n"
      stdout: "Аня\nВера"
    - name: Оценка потерялась
      stdin: "Аня Борис Вера\n5 5\n"
      stdout: "Списки разной длины"
      hidden: true
    - name: Пятёрок нет
      stdin: "Глеб Дина\n3 4\n"
      stdout: ""
      hidden: true
    - name: Одна пятёрка в конце
      stdin: "Аня Борис Вера Глеб\n4 4 3 5\n"
      stdout: "Глеб"
      hidden: true
  explain: |
    `zip` идёт по двум спискам сразу и выдаёт пары «имя, оценка». На списках разной длины он молча останавливается на коротком, поэтому длины сравнивают заранее. Оценки после `split` — строки, их сравнивают со строкой `"5"` (или переводят в `int`).
- id: k1-change-extreme-days
  type: code
  q: |
    Функция `coldest_day` возвращает номер (с 1) самого холодного дня. **Переделайте её в `extreme_days(temps)`: вернуть два значения — номер самого холодного и номер самого тёплого дня.**
    ```input
    extreme_days([5, -2, 7, 3, 9])
    ```
    ```output
    (2, 5)
    ```
    При равных температурах — первый из таких дней. В списке хотя бы один день.
  starter: |
    def coldest_day(temps):
        best = 0
        for i in range(len(temps)):
            if temps[i] < temps[best]:
                best = i
        return best + 1
  solution: |
    def extreme_days(temps):
        cold = 0
        warm = 0
        for i in range(len(temps)):
            if temps[i] < temps[cold]:
                cold = i
            if temps[i] > temps[warm]:
                warm = i
        return cold + 1, warm + 1
  tests:
    asserts:
    - name: Неделя
      code: |
        cold, warm = extreme_days([5, -2, 7, 3, 9, 0, 1])
        assert (cold, warm) == (2, 5), "Для [5, -2, 7, 3, 9, 0, 1] нужно (2, 5), а получилось " + repr((cold, warm))
    - name: Равные дни — первый
      code: |
        r = extreme_days([4, 1, 8, 1, 8])
        assert r == (2, 3), "Для [4, 1, 8, 1, 8] нужно (2, 3): самые холодный и тёплый — первые из равных; получилось " + repr(r)
    - name: Один день
      code: |
        r = extreme_days([12])
        assert r == (1, 1), "Для одного дня нужно (1, 1), а получилось " + repr(r)
    - name: Холодный в конце, тёплый в начале
      code: |
        r = extreme_days([20, 15, 10])
        assert r == (3, 1), "Для [20, 15, 10] нужно (3, 1), а получилось " + repr(r)
  explain: |
    `return cold + 1, warm + 1` возвращает один кортеж, который при вызове раскладывают распаковкой. Строгое сравнение `<` и `>` оставляет первый из равных дней. Подойдёт и `temps.index(min(temps)) + 1`: `index` тоже находит первый такой элемент.
- id: k1-warmer-days
  type: code
  q: |
    **Напишите `warmer_days(temps)`: вернуть номера дней (с 1), когда было теплее, чем накануне.**
    ```input
    warmer_days([5, 7, 6, 8])
    ```
    ```output
    [2, 4]
    ```
    Первый день сравнивать не с чем. Список `temps` не меняется.
  starter: |
    def warmer_days(temps):
        result = []
        return result
  solution: |
    def warmer_days(temps):
        result = []
        for i in range(1, len(temps)):
            if temps[i] > temps[i - 1]:
                result.append(i + 1)
        return result
  tests:
    asserts:
    - name: Пример из условия
      code: |
        r = warmer_days([5, 7, 6, 8])
        assert r == [2, 4], "warmer_days([5, 7, 6, 8]) должна вернуть [2, 4], а вернула " + repr(r)
    - name: Та же температура — не теплее
      code: |
        r = warmer_days([4, 4, 5])
        assert r == [3], "warmer_days([4, 4, 5]) должна вернуть [3], а вернула " + repr(r)
    - name: Один день и ни одного
      code: |
        assert warmer_days([3]) == [], "Для одного дня — пустой список, а вернулось " + repr(warmer_days([3]))
        assert warmer_days([]) == [], "Для пустого списка — пустой список, а вернулось " + repr(warmer_days([]))
    - name: Холодает всю неделю
      code: |
        r = warmer_days([9, 7, 4, 1])
        assert r == [], "warmer_days([9, 7, 4, 1]) должна вернуть [], а вернула " + repr(r)
    - name: Список не меняется
      code: |
        data = [-3, -1, -2, 0]
        r = warmer_days(data)
        assert r == [2, 4], "warmer_days([-3, -1, -2, 0]) должна вернуть [2, 4], а вернула " + repr(r)
        assert data == [-3, -1, -2, 0], "Список не должен меняться, а стал " + repr(data)
  explain: |
    Индекс `i` идёт со второго дня, `range(1, len(temps))`, и каждый день сравнивается с предыдущим, `temps[i - 1]`; номер дня — `i + 1`. Можно и парами: `zip(temps, temps[1:])` даёт «вчера, сегодня» для каждой пары соседних дней. На одном дне и пустом списке пар нет, и вернётся пустой список.
