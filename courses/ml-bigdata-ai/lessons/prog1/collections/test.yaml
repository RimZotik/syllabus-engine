title: Контрольная раздела «Коллекции»
pass: 0.85
minutes: 40
questions:
- id: s-rank-enumerate
  type: single
  q: |
    Время трёх попыток спортсмена записано по порядку. Что выведет программа?
    ```python
    results = [12.5, 11.8, 12.1]
    ranked = sorted(enumerate(results, start=1), key=lambda p: p[1])
    print(ranked[0])
    ```
  options:
  - '`(2, 11.8)`'
  - '`(1, 11.8)`'
  - '`(1, 12.5)`'
  - '`11.8`'
  answer: 0
  explain: '`enumerate` сначала пронумеровал попытки: `(1, 12.5)`, `(2, 11.8)`, `(3, 12.1)`. Сортируются уже эти пары, по второму элементу — времени, поэтому номер попытки остаётся при своём времени. `(1, 11.8)` вышло бы, если бы нумерация шла после сортировки, а `(1, 12.5)` — если бы ключ не учитывался. Элемент результата — пара целиком, а не одно время.'
- id: s-vat-alias
  type: single
  q: |
    Что выведет программа?
    ```python
    def with_vat(prices):
        result = prices
        for i in range(len(result)):
            result[i] = result[i] * 120 // 100
        return result

    base = [100, 50]
    vat = with_vat(base)
    print(base, vat is base)
    ```
  options:
  - '`[120, 60] True`'
  - '`[100, 50] False`'
  - '`[120, 60] False`'
  - '`[100, 50] True`'
  answer: 0
  explain: '`result = prices` не копирует: `result`, `prices` и `base` — имена одного списка. Замена элементов по индексу меняет его, и функция возвращает тот же самый список. Нужна копия — `result = prices.copy()`, или собрать новый список.'
- id: s-lesson-tuple
  type: multi
  q: 'Урок записан кортежем: день и список пришедших, `lesson = ("пн", ["Аня", "Борис"])`. Какие строки кода выполнятся без ошибки, если каждую запускать сразу после этой записи?'
  options:
  - '`lesson[1].remove("Борис")`'
  - '`lesson = (lesson[0], lesson[1] + ["Вера"])`'
  - '`attended = {lesson[0]: lesson[1]}`'
  - '`seen = {lesson}`'
  - '`lesson[1] = ["Вера"]`'
  answer:
  - 0
  - 1
  - 2
  explain: '`remove` меняет сам список внутри кортежа, а это изменяемое значение — кортеж этому не мешает. Новый кортеж из дня и нового списка можно собрать и привязать к нему имя `lesson`. В словаре `{lesson[0]: lesson[1]}` ключ — строка «пн», а список стоит на месте значения, и это можно. Множество из такого кортежа не собрать: в кортеже список, он нехешируем — `TypeError: unhashable type: ''list''`. Заменить элемент кортежа нельзя, даже если элемент — список.'
- id: s-poll-ranked
  type: single
  q: |
    Что выведет программа?
    ```python
    answers = ["нет", "да", "да", "нет", "не знаю"]
    votes = {"да": 0, "нет": 0, "не знаю": 0}
    for a in answers:
        votes[a] += 1
    ranked = sorted(votes.items(), key=lambda p: p[1], reverse=True)
    print(ranked[0][0], ranked[-1])
    ```
  options:
  - "`да ('не знаю', 1)`"
  - "`нет ('не знаю', 1)`"
  - '`да не знаю`'
  - "`('да', 2) ('не знаю', 1)`"
  answer: 0
  explain: 'Все ключи заведены заранее, поэтому `+= 1` не падает: «да» 2, «нет» 2, «не знаю» 1. `items()` даёт пары, и они сортируются по числу голосов по убыванию. У «да» и «нет» голосов поровну, а сортировка устойчива и с `reverse=True`: равные остаются в порядке словаря, где «да» стоит первым. То, что в ответах «нет» встретилось раньше, на порядок ключей не влияет — его задал словарь. `ranked[0][0]` — первый элемент первой пары, название; `ranked[-1]` — последняя пара целиком.'
- id: s-tariffs
  type: multi
  q: |
    Какие выражения дают названия тарифов поездок дороже 280 рублей без повторов и по алфавиту?
    ```python
    rides = [
        {"tariff": "эконом", "price": 300},
        {"tariff": "комфорт", "price": 500},
        {"tariff": "эконом", "price": 250},
        {"tariff": "эконом", "price": 350},
    ]
    ```
  options:
  - '`sorted({r["tariff"] for r in rides if r["price"] > 280})`'
  - '`sorted(set(r["tariff"] for r in rides if r["price"] > 280))`'
  - '`sorted([r["tariff"] for r in rides if r["price"] > 280])`'
  - '`list(set(sorted(r["tariff"] for r in rides if r["price"] > 280)))`'
  answer:
  - 0
  - 1
  explain: 'Повторы убирает множество, порядок даёт `sorted`, и он же превращает множество в список. Отобранный список содержит «эконом» дважды. Если сортировать до множества, `set` выбросит повторы, но вместе с ними и порядок: `list(...)` от множества не обещает алфавита.'
- id: s-cant-assemble
  type: multi
  q: 'Заказ — список `order = ["хлеб", "сыр", "чай"]`, склад — словарь `stock = {"хлеб": 3, "сыр": 0}`: каких-то товаров на складе нет вовсе, каких-то осталось 0. Какие выражения дают список товаров заказа, которые нельзя собрать, в порядке заказа?'
  options:
  - '`[g for g in order if stock.get(g, 0) == 0]`'
  - '`[g for g in order if g not in stock or stock[g] == 0]`'
  - '`[g for g in order if not stock.get(g)]`'
  - '`[g for g in order if stock[g] == 0 or g not in stock]`'
  - '`list(set(order) - set(stock))`'
  answer:
  - 0
  - 1
  - 2
  explain: 'Чая на складе нет, сыра 0 — собрать нельзя оба. `get` с нулём по умолчанию сводит оба случая к одному. С `or` проверка `stock[g]` выполняется, только если ключ есть, — до `KeyError` не доходит. `get` без второго аргумента вернёт `None` для чая и 0 для сыра — оба ложны. Если поменять части `or` местами, первым выполняется `stock["чай"]` — и до проверки `not in` дело не доходит: `KeyError`. Разность множеств найдёт только товары, которых нет совсем, — сыр она пропустит, а порядок не сохранит.'
- id: s-grid-rows
  type: single
  q: |
    Что выведет программа?
    ```python
    row = [0, 0]
    grid1 = [row for _ in range(2)]
    grid2 = [row[:] for _ in range(2)]
    grid1[0][0] = 1
    grid2[1][1] = 2
    print(grid1, grid2, row)
    ```
  options:
  - '`[[1, 0], [1, 0]] [[0, 0], [0, 2]] [1, 0]`'
  - '`[[1, 0], [0, 0]] [[0, 0], [0, 2]] [0, 0]`'
  - '`[[1, 0], [1, 0]] [[1, 0], [1, 2]] [1, 0]`'
  - '`[[1, 0], [1, 0]] [[0, 2], [0, 2]] [1, 0]`'
  answer: 0
  explain: 'Включение вычисляет выражение на каждой итерации, но выражение `row` каждый раз даёт один и тот же список: обе строки `grid1` — псевдонимы `row`, и единица видна во всех трёх местах. `row[:]` на каждой итерации собирает новую копию, поэтому строки `grid2` независимы и от `row`, и друг от друга. Копии сняты до того, как в `row` появилась единица, — позже они её не получают.'
- id: s-fix-journal-lines
  type: code
  q: |
    Функция `journal(lines)` получает строки журнала `имя оценка` и возвращает словарь «имя → список оценок» (оценки — целые числа). Строку с одним именем (оценку забыли) пропускают. **Исправьте две ошибки:** сейчас функция падает на первой же строке.
    ```call
    journal(["Аня 5", "Борис", "Вера 3", "Аня 4"])
    ```
    ```return
    {'Аня': [5, 4], 'Вера': [3]}
    ```
  starter: |
    def journal(lines):
        marks = {}
        for line in lines:
            name, mark = line.split()
            marks[name].append(int(mark))
        return marks
  solution: |
    def journal(lines):
        marks = {}
        for line in lines:
            parts = line.split()
            if len(parts) == 2:
                name, mark = parts
                if name not in marks:
                    marks[name] = []
                marks[name].append(int(mark))
        return marks
  tests:
    function: journal
    no_mutate: true
    calls:
    - name: Пример из условия
      args: [["Аня 5", "Борис", "Вера 3", "Аня 4"]]
      expect: {"Аня": [5, 4], "Вера": [3]}
    - name: Два ученика
      args: [["Аня 5", "Борис 4", "Аня 4"]]
      expect: {"Аня": [5, 4], "Борис": [4]}
      hidden: true
    - name: Оценку забыли
      args: [["Аня 5", "Борис", "Вера 3", "Борис 5"]]
      expect: {"Аня": [5], "Вера": [3], "Борис": [5]}
      hidden: true
    - name: Первая строка без оценки
      args: [["Глеб", "Дина 4"]]
      expect: {"Дина": [4]}
      hidden: true
    - name: Пустой журнал
      args: [[]]
      expect: {}
      hidden: true
  explain: |
    Первая ошибка — `KeyError`: у нового имени ещё нет списка, и `append` дописывать некуда; ключ заводят с пустым списком. Вторая — `ValueError` при распаковке одного слова в два имени: число частей проверяют до распаковки. Подойдёт и `marks.setdefault(name, [])` вместо проверки `if name not in marks`.
- id: s-fix-new-user
  type: code
  q: |
    Настройки нового пользователя собираются из шаблона `defaults` — словаря, где у ключа `"избранное"` список. **Исправьте `new_user(defaults)`: вернуть настройки, которые можно менять, не трогая шаблон и других пользователей.** Сейчас избранное одного пользователя появляется у всех.
    ```python
    defaults = {"тема": "светлая", "избранное": []}
    anya = new_user(defaults)
    anya["избранное"].append("джаз")
    new_user(defaults)
    ```
    ```output
    {'тема': 'светлая', 'избранное': []}
    ```
    Метод `copy()` у словаря, как у списка, делает поверхностную копию.
  starter: |
    def new_user(defaults):
        return defaults.copy()
  solution: |
    import copy

    def new_user(defaults):
        return copy.deepcopy(defaults)
  tests:
    function: new_user
    no_mutate: true
    calls:
    - name: Настройки как в шаблоне
      args: [{"тема": "светлая", "избранное": []}]
      expect: {"тема": "светлая", "избранное": []}
    asserts:
    - name: Избранное у каждого своё
      code: |
        defaults = {"тема": "светлая", "избранное": []}
        anya = new_user(defaults)
        anya["избранное"].append("джаз")
        boris = new_user(defaults)
        assert boris["избранное"] == [], "У нового пользователя избранное пустое, а в нём " + repr(boris["избранное"])
        assert defaults["избранное"] == [], "Шаблон не должен меняться, а в его избранном " + repr(defaults["избранное"])
    - name: Тема у каждого своя
      code: |
        defaults = {"тема": "светлая", "избранное": ["новости"]}
        u = new_user(defaults)
        u["тема"] = "тёмная"
        assert defaults["тема"] == "светлая", "Тема шаблона должна остаться 'светлая', а стала " + repr(defaults["тема"])
  explain: |
    Поверхностная копия делает новый словарь, но значения в нём те же: список избранного — общий для шаблона и всех пользователей. Тему заменить безопасно — это присваивание по ключу в новом словаре, а `append` меняет общий список. Глубокая копия копирует и список.
- id: s-write-customers-of
  type: code
  q: |
    Заказы — список словарей с ключами `"name"` (покупатель) и `"items"` (список товаров). **Напишите `customers_of(orders, product)`: вернуть отсортированный список покупателей, которые хоть раз брали `product`, — каждого один раз.**
    ```call
    customers_of([
        {"name": "Вера", "items": ["чай", "мёд"]},
        {"name": "Аня", "items": ["сыр"]},
        {"name": "Вера", "items": ["чай"]},
        {"name": "Борис", "items": ["чай", "сыр"]},
    ], "чай")
    ```
    ```return
    ['Борис', 'Вера']
    ```
  starter: |
    def customers_of(orders, product):
        return [o["name"] for o in orders if product in o["items"]]
  solution: |
    def customers_of(orders, product):
        return sorted({o["name"] for o in orders if product in o["items"]})
  tests:
    function: customers_of
    no_mutate: true
    calls:
    - name: Повторный покупатель
      args: [[{"name": "Вера", "items": ["чай", "мёд"]}, {"name": "Аня", "items": ["сыр"]}, {"name": "Вера", "items": ["чай"]}, {"name": "Борис", "items": ["чай", "сыр"]}], "чай"]
      expect: ["Борис", "Вера"]
    - name: Никто не брал
      args: [[{"name": "Аня", "items": ["сыр"]}], "кофе"]
      expect: []
    - name: Товар дважды в заказе
      args: [[{"name": "Глеб", "items": ["хлеб", "хлеб"]}], "хлеб"]
      expect: ["Глеб"]
    - name: Нет заказов
      args: [[], "чай"]
      expect: []
  explain: |
    Повторы убирает множество — фигурные скобки во включении, порядок даёт `sorted`. `product in o["items"]` проверяет, есть ли товар в списке этого заказа. Сортировать до множества бесполезно: оно порядок не хранит.
- id: s-write-top-words
  type: code
  q: |
    **Напишите `top_words(text, k)`: вернуть `k` самых частых слов текста строчными буквами — от частых к редким, при равной частоте по алфавиту.**
    ```call
    top_words("кот пёс Кот мышь пёс кот", 2)
    ```
    ```return
    ['кот', 'пёс']
    ```
    Слова разделены пробелами, регистр не важен. Если разных слов меньше `k`, вернуть все.
  starter: |
    def top_words(text, k):
        return text.split()[:k]
  solution: |
    def top_words(text, k):
        counts = {}
        for w in text.lower().split():
            counts[w] = counts.get(w, 0) + 1
        ranked = sorted(counts, key=lambda w: (-counts[w], w))
        return ranked[:k]
  tests:
    function: top_words
    calls:
    - name: Пример из условия
      args: ["кот пёс Кот мышь пёс кот", 2]
      expect: ["кот", "пёс"]
    - name: Два самых частых
      args: ["кот пёс кот мышь пёс кот", 2]
      expect: ["кот", "пёс"]
    - name: Регистр не важен
      args: ["Да да нет", 1]
      expect: ["да"]
    - name: Равная частота — по алфавиту
      args: ["сыр чай мёд чай сыр мёд", 3]
      expect: ["мёд", "сыр", "чай"]
    - name: Слов меньше k
      args: ["один", 5]
      expect: ["один"]
    - name: Пустой текст
      args: ["", 3]
      expect: []
  explain: |
    Сначала словарь частот, потом сортировка его ключей. Ключ сортировки — кортеж: минус частота (чтобы частые шли первыми) и само слово (по алфавиту при равенстве). `reverse=True` здесь не подошёл бы: он развернул бы и алфавит. Срез за границей не падает, поэтому `[:k]` при малом числе слов вернёт все.
- id: s-write-round-robin
  type: code
  q: |
    В турнире каждая команда играет с каждой ровно один раз. **Напишите `matches(teams)`: вернуть список матчей — кортежей `(команда, соперник)`, где команда стоит в списке раньше соперника.**
    ```call
    matches(["Орлы", "Волки", "Лисы"])
    ```
    ```return
    [('Орлы', 'Волки'), ('Орлы', 'Лисы'), ('Волки', 'Лисы')]
    ```
    Сначала все матчи первой команды, потом новые матчи второй и так далее.
  starter: |
    def matches(teams):
        return [(a, b) for a in teams for b in teams]
  solution: |
    def matches(teams):
        return [(teams[i], teams[j]) for i in range(len(teams)) for j in range(i + 1, len(teams))]
  tests:
    function: matches
    calls:
    - name: Три команды
      args: [["Орлы", "Волки", "Лисы"]]
      expect_py: "[('Орлы', 'Волки'), ('Орлы', 'Лисы'), ('Волки', 'Лисы')]"
    - name: Четыре команды — шесть матчей
      args: [["А", "Б", "В", "Г"]]
      expect_py: "[('А', 'Б'), ('А', 'В'), ('А', 'Г'), ('Б', 'В'), ('Б', 'Г'), ('В', 'Г')]"
    - name: Одна команда
      args: [["Орлы"]]
      expect: []
    - name: Нет команд
      args: [[]]
      expect: []
  explain: |
    Два `for` идут как вложенные циклы, и внутренний может зависеть от внешнего: соперник берётся только из команд правее, `range(i + 1, len(teams))`. Перебор `for a in teams for b in teams` даёт и матч команды с собой, и каждую пару дважды. То же можно записать обычным циклом в цикле.
- id: s-fix-ai-merge
  type: code
  q: |
    Журнал — словарь «ученик → список оценок». ИИ-ассистент написал `merge(a, b)`, которая собирает общий журнал двух учительниц. Ответ верный, но после вызова журнал `a` испорчен, а правка общего журнала меняет и `b`. **Исправьте функцию: исходные журналы и их списки не меняются, у общего журнала списки свои.**
    ```call
    merge({"Аня": [5], "Борис": [3]}, {"Аня": [4], "Вера": [5, 5]})
    ```
    ```return
    {'Аня': [5, 4], 'Борис': [3], 'Вера': [5, 5]}
    ```
    Оценки из `a` идут раньше оценок из `b`.
  starter: |
    def merge(a, b):
        result = a.copy()
        for name, marks in b.items():
            if name in result:
                result[name] += marks
            else:
                result[name] = marks
        return result
  solution: |
    def merge(a, b):
        result = {}
        for name, marks in a.items():
            result[name] = marks.copy()
        for name, marks in b.items():
            result[name] = result.get(name, []) + marks
        return result
  tests:
    function: merge
    no_mutate: true
    calls:
    - name: Общий журнал
      args: [{"Аня": [5], "Борис": [3]}, {"Аня": [4], "Вера": [5, 5]}]
      expect: {"Аня": [5, 4], "Борис": [3], "Вера": [5, 5]}
    - name: Журнал a не меняется
      args: [{"Аня": [5]}, {"Аня": [4]}]
      expect: {"Аня": [5, 4]}
    asserts:
    - name: Правка результата не трогает b
      code: |
        b = {"Вера": [5]}
        r = merge({}, b)
        r["Вера"].append(2)
        assert b == {"Вера": [5]}, "Журнал b должен остаться {'Вера': [5]}, а стал " + repr(b)
    - name: Правка результата не трогает a
      code: |
        a = {"Глеб": [3]}
        r = merge(a, {})
        r["Глеб"].append(4)
        assert a == {"Глеб": [3]}, "Журнал a должен остаться {'Глеб': [3]}, а стал " + repr(a)
  explain: |
    `a.copy()` — поверхностная копия: словарь новый, а списки оценок те же, и `+=` дописывает прямо в список журнала `a`. Ветка `else` кладёт в результат сам список из `b` — псевдоним. Нужны новые списки: копии списков `a`, а для `b` — сложение `+`, которое собирает новый список.
- id: s-extend-library
  type: code
  q: |
    Журнал библиотеки — словарь «читатель → список книг на руках»; экземпляров одной книги может быть несколько. Прочитайте готовые функции `issue` и `give_back`. **Допишите две функции, готовые не меняйте:**
    - `who_has(journal, title)` — отсортированный список читателей, у которых сейчас есть книга `title`;
    - `busiest(journal)` — читатель, у которого на руках больше всего книг; при равенстве — первый по алфавиту; пустой журнал — `None`.

    ```python
    j = {}
    issue(j, "Вера", "Дубровский")
    issue(j, "Аня", "Дубровский")
    issue(j, "Аня", "Муму")
    who_has(j, "Дубровский"), busiest(j)
    ```
    ```output
    (['Аня', 'Вера'], 'Аня')
    ```
  starter: |
    def issue(journal, reader, title):
        if reader not in journal:
            journal[reader] = []
        journal[reader].append(title)

    def give_back(journal, reader, title):
        journal[reader].remove(title)
        if len(journal[reader]) == 0:
            del journal[reader]

    # Допишите who_has(journal, title) и busiest(journal)
  solution: |
    def issue(journal, reader, title):
        if reader not in journal:
            journal[reader] = []
        journal[reader].append(title)

    def give_back(journal, reader, title):
        journal[reader].remove(title)
        if len(journal[reader]) == 0:
            del journal[reader]

    def who_has(journal, title):
        return sorted(r for r in journal if title in journal[r])

    def busiest(journal):
        if len(journal) == 0:
            return None
        return min(journal, key=lambda r: (-len(journal[r]), r))
  tests:
    asserts:
    - name: Кто читает книгу
      code: |
        j = {}
        issue(j, "Вера", "Дубровский")
        issue(j, "Аня", "Дубровский")
        issue(j, "Борис", "Муму")
        r = who_has(j, "Дубровский")
        assert r == ["Аня", "Вера"], "Нужно ['Аня', 'Вера'], а вернулось " + repr(r)
    - name: После возврата
      code: |
        j = {}
        issue(j, "Аня", "Муму")
        issue(j, "Аня", "Дубровский")
        give_back(j, "Аня", "Муму")
        r = who_has(j, "Муму")
        assert r == [], "Аня вернула «Муму»: нужно [], а вернулось " + repr(r)
    - name: Больше всего книг
      code: |
        j = {}
        issue(j, "Борис", "Муму")
        issue(j, "Вера", "Муму")
        issue(j, "Вера", "Дубровский")
        r = busiest(j)
        assert r == "Вера", "У Веры две книги: нужно 'Вера', а вернулось " + repr(r)
    - name: Равенство — по алфавиту
      code: |
        j = {}
        issue(j, "Глеб", "Муму")
        issue(j, "Борис", "Дубровский")
        r = busiest(j)
        assert r == "Борис", "У обоих по одной книге — первый по алфавиту: нужно 'Борис', а вернулось " + repr(r)
    - name: Пустой журнал
      code: |
        j = {}
        issue(j, "Аня", "Муму")
        give_back(j, "Аня", "Муму")
        assert busiest(j) is None, "Все книги вернули — нужно None, а вернулось " + repr(busiest(j))
        assert who_has(j, "Муму") == [], "Нужно [], а вернулось " + repr(who_has(j, "Муму"))
  explain: |
    Из готового кода видно главное: в журнале только те, у кого есть книги, — `give_back` удаляет читателя с пустым списком. `who_has` перебирает ключи-читателей и отбирает тех, в чьём списке есть книга. Для `busiest` подходит `min` с ключом-кортежем: минус число книг (больше книг — меньше ключ) и имя для равенства. Можно и `max` с ключом `len(journal[r])` — но тогда при равенстве он вернёт того, кто раньше в словаре, а не по алфавиту.
- id: s-write-places
  type: code
  q: |
    Результаты забега — словарь «бегун → время в секундах». **Напишите `places(results)`: вернуть протокол — список строк `место. имя (время)` от быстрых к медленным.**
    ```call
    places({"Глеб": 50, "Дина": 52, "Борис": 50})
    ```
    ```return
    ['1. Борис (50)', '1. Глеб (50)', '3. Дина (52)']
    ```
    С равным временем бегуны делят место и идут по алфавиту, а следующее место пропускает занятые номера.
  starter: |
    def places(results):
        lines = []
        for n, name in enumerate(sorted(results), start=1):
            lines.append(f"{n}. {name} ({results[name]})")
        return lines
  solution: |
    def places(results):
        ranked = sorted(results.items(), key=lambda p: (p[1], p[0]))
        lines = []
        place = 0
        prev = None
        for i, pair in enumerate(ranked, start=1):
            name, t = pair
            if t != prev:
                place = i
                prev = t
            lines.append(f"{place}. {name} ({t})")
        return lines
  tests:
    function: places
    calls:
    - name: Без равенства
      args: [{"Вера": 61, "Аня": 58, "Борис": 64}]
      expect: ["1. Аня (58)", "2. Вера (61)", "3. Борис (64)"]
    - name: Делят первое место
      args: [{"Глеб": 50, "Дина": 52, "Борис": 50}]
      expect: ["1. Борис (50)", "1. Глеб (50)", "3. Дина (52)"]
    - name: Делят середину
      args: [{"А": 10, "Б": 12, "В": 12, "Г": 12, "Д": 15}]
      expect: ["1. А (10)", "2. Б (12)", "2. В (12)", "2. Г (12)", "5. Д (15)"]
    - name: Один бегун
      args: [{"Аня": 70}]
      expect: ["1. Аня (70)"]
    - name: Никого
      args: [{}]
      expect: []
  explain: |
    Сначала пары «имя, время» сортируются ключом-кортежем `(время, имя)`. Потом `enumerate` даёт номер строки протокола, а место меняется, только когда время отличается от предыдущего: тогда место — номер этой строки. Так при равенстве место повторяется, а следующее пропускает занятые номера.
- id: s-inventory
  type: code
  q: |
    `ops` — операции склада, строки `приход товар N` и `расход товар N` (N — целое больше нуля). **Напишите `stock_report(ops)`: вести остатки и вернуть отчёт — список строк.**

    Расход больше остатка не выполняется: вместо него в отчёт сразу добавляется строка `Не хватает: товар`. После всех операций в отчёт идут остатки по алфавиту строками `товар: N` — только товары, которых больше нуля; если на складе ничего нет — одна строка `Склад пуст`.
    ```call
    stock_report(["приход мёд 2", "расход мёд 5", "приход сыр 5", "расход сыр 2"])
    ```
    ```return
    ['Не хватает: мёд', 'мёд: 2', 'сыр: 3']
    ```
  starter: |
    def stock_report(ops):
        stock = {}
        report = []
        for line in ops:
            op, item, n = line.split()
        return report
  solution: |
    def stock_report(ops):
        stock = {}
        report = []
        for line in ops:
            op, item, n = line.split()
            n = int(n)
            if op == "приход":
                stock[item] = stock.get(item, 0) + n
            elif stock.get(item, 0) >= n:
                stock[item] -= n
            else:
                report.append(f"Не хватает: {item}")
        left = {item: n for item, n in stock.items() if n > 0}
        if len(left) == 0:
            report.append("Склад пуст")
        for item in sorted(left):
            report.append(f"{item}: {left[item]}")
        return report
  tests:
    function: stock_report
    no_mutate: true
    calls:
    - name: Пример из условия
      args: [["приход мёд 2", "расход мёд 5", "приход сыр 5", "расход сыр 2"]]
      expect: ["Не хватает: мёд", "мёд: 2", "сыр: 3"]
    - name: Приход и расход
      args: [["приход сыр 5", "приход чай 3", "расход сыр 2"]]
      expect: ["сыр: 3", "чай: 3"]
    - name: Не хватает товара
      args: [["приход мёд 2", "расход мёд 5", "расход хлеб 1", "расход мёд 2", "приход хлеб 4"]]
      expect: ["Не хватает: мёд", "Не хватает: хлеб", "хлеб: 4"]
      hidden: true
    - name: Всё распродано
      args: [["приход чай 1", "расход чай 1"]]
      expect: ["Склад пуст"]
      hidden: true
    - name: Нет операций
      args: [[]]
      expect: ["Склад пуст"]
      hidden: true
    - name: Алфавит, а не порядок прихода
      args: [["приход яблоки 10", "приход арбуз 1", "приход груши 3", "расход яблоки 4"]]
      expect: ["арбуз: 1", "груши: 3", "яблоки: 6"]
      hidden: true
  explain: |
    Остатки — словарь «товар → количество», и `get(item, 0)` нужен в обеих ветках: товара может не быть ни при первом приходе, ни при расходе неизвестного товара. Количество из строки — строка, её переводят в `int`. Товары с нулём отбирает включение, порядок по алфавиту даёт `sorted` по ключам. Отчёт — список строк: его легко проверить, а напечатать потом можно как угодно.
- id: s-open-choose-collection
  type: open
  q: 'Программа школьной библиотеки должна: (1) помнить, какие книги уже выдавались хотя бы раз, и быстро проверять, выдавалась ли очередная; (2) хранить для каждого читателя, сколько книг он взял; (3) держать очередь читателей на популярную книгу в порядке записи. Для каждой задачи выберите тип коллекции — список, кортеж, словарь или множество — и объясните выбор.'
  rubric:
  - (1) множество — повторы не нужны, а проверка in в множестве почти мгновенная, не перебирает все выдачи (список даст тот же ответ, но каждая проверка будет перебором)
  - (2) словарь — ключ читатель, значение число взятых книг; число находят и увеличивают по ключу
  - (3) список — важен порядок записи, и очередь меняется (новых дописывают, обслуженных убирают); объяснять, почему не подходят другие типы, не обязательно
  wrong_answers:
  - для очереди — множество, потому что один читатель не должен записаться дважды
  - для (2) — множество читателей, которые брали книги
  - для (1) — кортеж, потому что книги не меняются
  followups:
  - Почему для очереди не подходит множество, даже если повторные записи не нужны?
