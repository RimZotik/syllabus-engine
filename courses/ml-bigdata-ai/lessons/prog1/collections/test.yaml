title: Контрольная раздела «Коллекции»
pass: 0.85
minutes: 40
questions:
- id: s-playlist-slice
  type: multi
  q: '`songs` — плейлист, в нём не меньше десяти песен. Какие выражения дают три песни подряд, начиная со второй по счёту?'
  options:
  - '`songs[1:4]`'
  - '`songs[1:][:3]`'
  - '`songs[2:5]`'
  - '`songs[1:3]`'
  - '`songs[2:4]`'
  answer:
  - 0
  - 1
  explain: 'Вторая песня — индекс 1, конец среза не входит, поэтому `songs[1:4]` — индексы 1, 2, 3. Срез от среза тоже работает: `songs[1:]` начинается со второй песни, и из него берутся первые три. `songs[2:5]` начинается с третьей, а `songs[1:3]` даёт только две.'
- id: s-rank-enumerate
  type: single
  q: |
    Время трёх попыток спортсмена записано по порядку. Что выведет программа?
    ```python
    results = [12.5, 11.8, 12.1]
    ranked = sorted(enumerate(results, start=1), key=lambda p: p[1])
    print(ranked[0])
    ```
  options:
  - '`(2, 11.8)`'
  - '`(1, 11.8)`'
  - '`(1, 12.5)`'
  - '`11.8`'
  answer: 0
  explain: '`enumerate` сначала пронумеровал попытки: `(1, 12.5)`, `(2, 11.8)`, `(3, 12.1)`. Сортируются уже эти пары, по второму элементу — времени, поэтому номер попытки остаётся при своём времени. `(1, 11.8)` вышло бы, если бы нумерация шла после сортировки, а `(1, 12.5)` — если бы ключ не учитывался. Элемент результата — пара целиком, а не одно время.'
- id: s-split-missing-mark
  type: single
  q: 'Программа читает журнал строками вида `Аня 5` и для каждой строки выполняет `name, mark = line.split()`. В одной строке оценку забыли: там только `Борис`. Что произойдёт на этой строке?'
  options:
  - 'Ошибка `ValueError`: значений меньше, чем имён'
  - '`name` привяжется к «Борис», `mark` — к `None`'
  - '`name` привяжется к «Борис», а `mark` — к пустой строке `""`'
  - 'Ошибка `IndexError`: в списке слов нет элемента с индексом 1'
  answer: 0
  explain: '`split()` даёт список из одного слова, а имён слева два. Распаковка требует точного совпадения в обе стороны и ничего не подставляет вместо недостающего — ни `None`, ни пустую строку: `ValueError: not enough values to unpack (expected 2, got 1)`. `IndexError` был бы при обращении `line.split()[1]`, а распаковка индексы не использует.'
- id: s-vat-alias
  type: single
  q: |
    Что выведет программа?
    ```python
    def with_vat(prices):
        result = prices
        for i in range(len(result)):
            result[i] = result[i] * 120 // 100
        return result

    base = [100, 50]
    vat = with_vat(base)
    print(base, vat is base)
    ```
  options:
  - '`[120, 60] True`'
  - '`[100, 50] False`'
  - '`[120, 60] False`'
  - '`[100, 50] True`'
  answer: 0
  explain: '`result = prices` не копирует: `result`, `prices` и `base` — имена одного списка. Замена элементов по индексу меняет его, и функция возвращает тот же самый список. Нужна копия — `result = prices.copy()`, или собрать новый список.'
- id: s-lesson-tuple
  type: multi
  q: 'Урок записан кортежем: день и список пришедших, `lesson = ("пн", ["Аня", "Борис"])`. Какие строки кода выполнятся без ошибки, если каждую запускать сразу после этой записи?'
  options:
  - '`lesson[1].remove("Борис")`'
  - '`lesson = (lesson[0], lesson[1] + ["Вера"])`'
  - '`attended = {lesson[0]: lesson[1]}`'
  - '`seen = {lesson}`'
  - '`lesson[1] = ["Вера"]`'
  answer:
  - 0
  - 1
  - 2
  explain: '`remove` меняет сам список внутри кортежа, а это изменяемое значение — кортеж этому не мешает. Новый кортеж из дня и нового списка можно собрать и привязать к нему имя `lesson`. В словаре `{lesson[0]: lesson[1]}` ключ — строка «пн», а список стоит на месте значения, и это можно. Множество из такого кортежа не собрать: в кортеже список, он нехешируем — `TypeError: unhashable type: ''list''`. Заменить элемент кортежа нельзя, даже если элемент — список.'
- id: s-normalized-is
  type: single
  q: |
    Что выведет программа?
    ```python
    def normalized(names):
        return [n.strip() for n in names]

    a = ["Аня", "Борис"]
    b = normalized(a)
    print(a == b, a is b)
    ```
  options:
  - '`True False`'
  - '`True True`'
  - '`False False`'
  - '`False True`'
  answer: 0
  explain: 'Лишних пробелов не было, поэтому содержимое не изменилось — `==` даёт `True`. Но включение всегда собирает новый список, даже если элементы те же, поэтому `a` и `b` — разные значения. `True True` получилось бы, если бы функция возвращала сам переданный список.'
- id: s-zip-get
  type: single
  q: |
    Что выведет программа?
    ```python
    names = ["Аня", "Борис", "Вера"]
    scores = [7, 9]
    table = {n: s for n, s in zip(names, scores)}
    print(table.get("Вера", 0), len(table))
    ```
  options:
  - '`0 2`'
  - '`None 3`'
  - '`0 3`'
  - "Ошибку `KeyError: 'Вера'`"
  answer: 0
  explain: '`zip` остановился на коротком списке: пар две, и Веры в словаре нет совсем — даже с `None`. `get` для отсутствующего ключа возвращает свой второй аргумент, 0, и не падает. `KeyError` дало бы обращение `table["Вера"]`.'
- id: s-poll-ranked
  type: single
  q: |
    Что выведет программа?
    ```python
    answers = ["нет", "да", "да", "нет", "не знаю"]
    votes = {"да": 0, "нет": 0, "не знаю": 0}
    for a in answers:
        votes[a] += 1
    ranked = sorted(votes.items(), key=lambda p: p[1], reverse=True)
    print(ranked[0][0], ranked[-1])
    ```
  options:
  - "`да ('не знаю', 1)`"
  - "`нет ('не знаю', 1)`"
  - '`да не знаю`'
  - "`('да', 2) ('не знаю', 1)`"
  answer: 0
  explain: 'Все ключи заведены заранее, поэтому `+= 1` не падает: «да» 2, «нет» 2, «не знаю» 1. `items()` даёт пары, и они сортируются по числу голосов по убыванию. У «да» и «нет» голосов поровну, а сортировка устойчива и с `reverse=True`: равные остаются в порядке словаря, где «да» стоит первым. То, что в ответах «нет» встретилось раньше, на порядок ключей не влияет — его задал словарь. `ranked[0][0]` — первый элемент первой пары, название; `ranked[-1]` — последняя пара целиком.'
- id: s-tariffs
  type: multi
  q: |
    Какие выражения дают названия тарифов поездок дороже 280 рублей без повторов и по алфавиту?
    ```python
    rides = [
        {"tariff": "эконом", "price": 300},
        {"tariff": "комфорт", "price": 500},
        {"tariff": "эконом", "price": 250},
        {"tariff": "эконом", "price": 350},
    ]
    ```
  options:
  - '`sorted({r["tariff"] for r in rides if r["price"] > 280})`'
  - '`sorted(set(r["tariff"] for r in rides if r["price"] > 280))`'
  - '`sorted([r["tariff"] for r in rides if r["price"] > 280])`'
  - '`list(set(sorted(r["tariff"] for r in rides if r["price"] > 280)))`'
  answer:
  - 0
  - 1
  explain: 'Повторы убирает множество, порядок даёт `sorted`, и он же превращает множество в список. Отобранный список содержит «эконом» дважды. Если сортировать до множества, `set` выбросит повторы, но вместе с ними и порядок: `list(...)` от множества не обещает алфавита.'
- id: s-visits-get
  type: single
  q: |
    Что выведет программа?
    ```python
    visits = [("Аня", "пн"), ("Борис", "пн"), ("Аня", "ср")]
    days = {}
    for name, day in visits:
        days[name] = days.get(name, []) + [day]
    print(days["Аня"], len(days))
    ```
  options:
  - "`['пн', 'ср'] 2`"
  - "`['ср'] 2`"
  - "`['пн', 'ср'] 3`"
  - "Ошибку `KeyError: 'Аня'`"
  answer: 0
  explain: 'Каждая пара распаковывается в имя и день. Для нового имени `get` даёт пустой список, для знакомого — уже накопленный, и к нему прибавляется день: у Ани получится `["пн", "ср"]`. Ключей в словаре два — по одному на человека, а не на запись. Присваивание по ключу не падает, даже если ключа ещё не было.'
- id: s-stock-all-any
  type: multi
  q: 'Склад — словарь `stock = {"хлеб": 5, "молоко": 0, "сыр": 2}`. Какие выражения дают `True`?'
  options:
  - '`any(n == 0 for n in stock.values())`'
  - '`all(n >= 0 for n in stock.values())`'
  - '`all(stock.values())`'
  - '`all(n > 0 for n in stock)`'
  - '`any(n > 5 for n in stock.values())`'
  answer:
  - 0
  - 1
  explain: 'Молока 0, поэтому «есть нулевой остаток» — да, а «все остатки не меньше нуля» — тоже да. `all(stock.values())` проверяет истинность самих чисел, а 0 ложен — `False`. Перебор словаря без `values()` даёт названия, и сравнение строки с числом — `TypeError`. Остатка больше 5 нет: у хлеба ровно 5.'
- id: s-spread
  type: single
  q: |
    У кого из учеников самый большой разброс оценок? Что выведет программа?
    ```python
    def stats(marks):
        return min(marks), max(marks)

    journal = {"Аня": [5, 4], "Борис": [3, 5], "Вера": [4, 4]}
    spread = {}
    for name, marks in journal.items():
        low, high = stats(marks)
        spread[name] = high - low
    print(max(spread, key=lambda n: spread[n]))
    ```
  options:
  - '`Борис`'
  - '`2`'
  - '`Вера`'
  - "`('Борис', 2)`"
  answer: 0
  explain: '`stats` возвращает кортеж, распаковка раскладывает его на минимум и максимум: разброс у Ани 1, у Бориса 2, у Веры 0. `max` перебирает ключи словаря, сравнивает их по значению `spread[n]` и возвращает сам ключ — имя, а не число и не пару. «Вера» получилась бы без `key`: тогда имена сравнивались бы по алфавиту.'
- id: s-best-shortest
  type: multi
  q: |
    Какие вызовы вернут самое короткое слово списка `words`? Все слова не пустые.
    ```python
    def best(items, score):
        top = items[0]
        for it in items:
            if score(it) > score(top):
                top = it
        return top
    ```
  options:
  - '`best(words, lambda w: -len(w))`'
  - '`best(words, lambda w: 1 / len(w))`'
  - '`best(words, len)`'
  - '`best(words, -len)`'
  answer:
  - 0
  - 1
  explain: '`best` ищет элемент с наибольшим значением `score`. У самого короткого слова наибольшие и `-len(w)`, и `1 / len(w)`. `len` даст самое длинное слово. Запись `-len` пытается взять минус от самой функции, а не от её результата — `TypeError` ещё до вызова `best`.'
- id: s-events-by-date
  type: single
  q: |
    Что выведет программа?
    ```python
    # событие, месяц, день
    events = [("сдача", 5, 2), ("отпуск", 3, 15), ("встреча", 5, 1)]
    by_date = sorted(events, key=lambda e: (e[1], e[2]))
    print([e[0] for e in by_date])
    ```
  options:
  - "`['отпуск', 'встреча', 'сдача']`"
  - "`['отпуск', 'сдача', 'встреча']`"
  - "`['встреча', 'сдача', 'отпуск']`"
  - "`['встреча', 'отпуск', 'сдача']`"
  answer: 0
  explain: 'Ключ — кортеж «месяц, день», и кортежи сравниваются поэлементно: сначала месяц (март раньше мая), при равных месяцах — день (1-е раньше 2-го). Порядок «отпуск, сдача, встреча» получился бы при ключе только по месяцу, «встреча, сдача, отпуск» — только по дню, «встреча, отпуск, сдача» — по алфавиту названий.'
- id: s-cant-assemble
  type: multi
  q: 'Заказ — список `order = ["хлеб", "сыр", "чай"]`, склад — словарь `stock = {"хлеб": 3, "сыр": 0}`: каких-то товаров на складе нет вовсе, каких-то осталось 0. Какие выражения дают список товаров заказа, которые нельзя собрать, в порядке заказа?'
  options:
  - '`[g for g in order if stock.get(g, 0) == 0]`'
  - '`[g for g in order if g not in stock or stock[g] == 0]`'
  - '`[g for g in order if not stock.get(g)]`'
  - '`[g for g in order if stock[g] == 0 or g not in stock]`'
  - '`list(set(order) - set(stock))`'
  answer:
  - 0
  - 1
  - 2
  explain: 'Чая на складе нет, сыра 0 — собрать нельзя оба. `get` с нулём по умолчанию сводит оба случая к одному. С `or` проверка `stock[g]` выполняется, только если ключ есть, — до `KeyError` не доходит. `get` без второго аргумента вернёт `None` для чая и 0 для сыра — оба ложны. Если поменять части `or` местами, первым выполняется `stock["чай"]` — и до проверки `not in` дело не доходит: `KeyError`. Разность множеств найдёт только товары, которых нет совсем, — сыр она пропустит, а порядок не сохранит.'
- id: s-grid-rows
  type: single
  q: |
    Что выведет программа?
    ```python
    row = [0, 0]
    grid1 = [row for _ in range(2)]
    grid2 = [row[:] for _ in range(2)]
    grid1[0][0] = 1
    grid2[1][1] = 2
    print(grid1, grid2, row)
    ```
  options:
  - '`[[1, 0], [1, 0]] [[0, 0], [0, 2]] [1, 0]`'
  - '`[[1, 0], [0, 0]] [[0, 0], [0, 2]] [0, 0]`'
  - '`[[1, 0], [1, 0]] [[1, 0], [1, 2]] [1, 0]`'
  - '`[[1, 0], [1, 0]] [[0, 2], [0, 2]] [1, 0]`'
  answer: 0
  explain: 'Включение вычисляет выражение на каждой итерации, но выражение `row` каждый раз даёт один и тот же список: обе строки `grid1` — псевдонимы `row`, и единица видна во всех трёх местах. `row[:]` на каждой итерации собирает новую копию, поэтому строки `grid2` независимы и от `row`, и друг от друга. Копии сняты до того, как в `row` появилась единица, — позже они её не получают.'
- id: s-common-goods
  type: single
  q: |
    Что выведет программа?
    ```python
    orders = {"Аня": ["чай", "мёд"], "Борис": ["чай"], "Вера": ["сыр", "чай", "сыр"]}
    everyone = set(orders["Аня"])
    for goods in orders.values():
        everyone = everyone & set(goods)
    print(sorted(everyone), len({g for goods in orders.values() for g in goods}))
    ```
  options:
  - "`['чай'] 3`"
  - "`['мёд', 'сыр', 'чай'] 3`"
  - "`['чай'] 6`"
  - "`['мёд', 'сыр'] 3`"
  answer: 0
  explain: 'Пересечение оставляет то, что есть в обоих множествах, поэтому после цикла в `everyone` — только то, что заказал каждый: чай. Объединение дало бы все три товара. Во включении множества два `for` проходят все шесть записей, но повторы отбрасываются, и разных товаров три. Мёд и сыр — как раз товары, которые заказали не все.'
- id: s-open-choose-collection
  type: open
  q: 'Программа школьной библиотеки должна: (1) помнить, какие книги уже выдавались хотя бы раз, и быстро проверять, выдавалась ли очередная; (2) хранить для каждого читателя, сколько книг он взял; (3) держать очередь читателей на популярную книгу в порядке записи. Для каждой задачи выберите тип коллекции — список, кортеж, словарь или множество — и объясните выбор.'
  rubric:
  - (1) множество — повторы не нужны, а проверка in в множестве почти мгновенная, не перебирает все выдачи (список даст тот же ответ, но каждая проверка будет перебором)
  - (2) словарь — ключ читатель, значение число взятых книг; число находят и увеличивают по ключу
  - (3) список — важен порядок записи, и очередь меняется (новых дописывают, обслуженных убирают); объяснять, почему не подходят другие типы, не обязательно
  wrong_answers:
  - для очереди — множество, потому что один читатель не должен записаться дважды
  - для (2) — множество читателей, которые брали книги
  - для (1) — кортеж, потому что книги не меняются
  followups:
  - Почему для очереди не подходит множество, даже если повторные записи не нужны?
