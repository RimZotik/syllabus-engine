title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: add-replace-order
  type: single
  q: |
    Что выведет программа?
    ```python
    stock = {"чай": 3, "мёд": 1}
    stock["сахар"] = 2
    stock["чай"] = 5
    print(list(stock), stock["чай"])
    ```
  options:
  - "`['чай', 'мёд', 'сахар'] 5`"
  - "`['мёд', 'сахар', 'чай'] 5`"
  - "`['чай', 'мёд', 'сахар'] 8`"
  - "`['чай', 'мёд', 'сахар', 'чай'] 5`"
  answer: 0
  explain: 'Новый ключ «сахар» встаёт в конец. Ключ «чай» уже был, поэтому присваивание заменяет значение: не прибавляет к старому и не переносит пару в конец. Повторяться ключи не могут, а `list(stock)` — список ключей.'
- id: missing-key-safe
  type: multi
  q: '`phones = {"Аня": "111", "Борис": "222"}`. Какие выражения выполнятся без ошибки?'
  options:
  - '`phones.get("Вера")`'
  - '`"Вера" in phones`'
  - '`phones.get("Вера", "нет номера")`'
  - '`phones["Вера"]`'
  - '`phones[0]`'
  answer:
  - 0
  - 1
  - 2
  explain: '`get` на отсутствующем ключе возвращает `None` или второй аргумент, `in` просто отвечает `False`. Обращение в квадратных скобках к отсутствующему ключу — `KeyError`. `phones[0]` — это тоже поиск ключа `0`, а не первой пары, поэтому тоже `KeyError: 0`.'
- id: lookup-number
  type: single
  q: |
    Что выведет программа?
    ```python
    book = {"Аня": "111", "Борис": "222"}
    query = "222"
    if query in book:
        print("есть такое имя")
    elif query in book.values():
        print("есть такой номер")
    else:
        print("не найдено")
    ```
  options:
  - '`есть такой номер`'
  - '`есть такое имя`'
  - '`не найдено`'
  - 'Ошибку `KeyError: ''222''`'
  answer: 0
  explain: '`in` у словаря проверяет только ключи, а «222» — не имя, а номер, поэтому первое условие ложно. Среди значений его находит `book.values()`. `KeyError` бывает при обращении `book["222"]`, а проверка `in` никогда не падает — она просто отвечает `True` или `False`.'
- id: print-pairs
  type: multi
  q: 'Словарь `prices = {"хлеб": 45, "сыр": 320}`. Нужно вывести каждый товар и его цену в одной строке. Какие циклы это сделают?'
  options:
  - '`for name, price in prices.items(): print(name, price)`'
  - '`for name in prices: print(name, prices[name])`'
  - '`for name, price in prices: print(name, price)`'
  - '`for name, price in enumerate(prices): print(name, price)`'
  answer:
  - 0
  - 1
  explain: '`items()` выдаёт пары «ключ, значение», а цикл по самому словарю — ключи, по которым можно взять цену. Цикл по словарю без `items()` выдаёт только ключи-строки, и распаковать «хлеб» в два имени нельзя — `ValueError`. `enumerate` даст номер и ключ, а не ключ и цену.'
- id: fix-del-loop
  type: multi
  q: |
    Код должен убрать из корзины товары с нулевым количеством, но падает с `RuntimeError`. Какие замены строки `for item in cart:` его исправят? Тело цикла не меняется.
    ```python
    cart = {"хлеб": 1, "сыр": 0, "чай": 2}
    for item in cart:
        if cart[item] == 0:
            del cart[item]
    ```
  options:
  - '`for item in list(cart):`'
  - '`for item in sorted(cart):`'
  - '`for item in cart.keys():`'
  - '`for item in cart.values():`'
  answer:
  - 0
  - 1
  explain: 'Словарь нельзя менять в размере, пока по нему идёт перебор. `list(cart)` и `sorted(cart)` один раз собирают отдельный список ключей, и цикл идёт по нему, а удалять из самого словаря при этом можно. `cart.keys()` — не отдельный список: перебирая его, цикл всё равно идёт по самому словарю, и ошибка останется. `values()` даёт количества, а не названия, и `cart[1]` упадёт с `KeyError`.'
- id: counter-fix
  type: multi
  q: |
    Подсчёт слов падает с `KeyError` на первом же слове. Какие правки его исправят?
    ```python
    counts = {}
    for w in words:
        counts[w] = counts[w] + 1
    ```
  options:
  - 'Заменить строку в цикле на `counts[w] = counts.get(w, 0) + 1`'
  - 'Добавить в цикл перед этой строкой `if w not in counts: counts[w] = 0`'
  - 'Заменить строку в цикле на `counts[w] += 1`'
  - 'Заменить строку в цикле на `counts[w] = counts.get(w) + 1`'
  - 'Заменить строку в цикле на `if w in counts: counts[w] = counts[w] + 1`'
  answer:
  - 0
  - 1
  explain: 'Ошибка — в чтении `counts[w]` для слова, которого ещё нет. `get` с нулём по умолчанию и проверка `not in` перед чтением решают это двумя разными путями. `counts[w] += 1` выглядит короче, но сначала тоже читает `counts[w]` — та же ошибка. `get` без второго аргумента возвращает `None`, и `None + 1` — `TypeError`. Проверка `if w in counts` убирает падение, но новое слово в словарь так и не попадает: словарь останется пустым.'
- id: valid-keys
  type: multi
  q: Журнал посещений хранит отметку для каждой пары «ученик, дата». Какие значения подойдут ключом такого словаря?
  options:
  - '`("Аня", "12.04")`'
  - '`"Аня 12.04"`'
  - '`["Аня", "12.04"]`'
  - '`("Аня", ["12.04"])`'
  - '`{"Аня": "12.04"}`'
  answer:
  - 0
  - 1
  explain: 'Ключ — неизменяемое значение: кортеж из строк или одна строка подойдут. Список и словарь изменяемы — `TypeError: unhashable type`. Кортеж, внутри которого список, тоже не годится: список в нём может измениться.'
- id: group-without-check
  type: single
  q: |
    В группировке учеников по классам строку `if g not in by_group:` удалили, а присваивание под ней оставили на том же уровне, что `append`. Что выведет программа?
    ```python
    students = [
        {"name": "Аня", "group": "9А"},
        {"name": "Борис", "group": "9Б"},
        {"name": "Вера", "group": "9А"},
    ]
    by_group = {}
    for s in students:
        g = s["group"]
        by_group[g] = []
        by_group[g].append(s["name"])
    print(by_group)
    ```
  options:
  - "`{'9А': ['Вера'], '9Б': ['Борис']}`"
  - "`{'9А': ['Аня', 'Вера'], '9Б': ['Борис']}`"
  - "`{'9А': ['Аня'], '9Б': ['Борис']}`"
  - "Ошибку `KeyError: '9А'`"
  answer: 0
  explain: 'Теперь на каждой записи ключ группы связывается с новым пустым списком, и всё, что туда дописали раньше, теряется. Для 9А последней была Вера — её и видно. Ошибки нет: присваивание по ключу добавляет пару, если ключа не было.'
- id: record-new-field
  type: single
  q: Записи журнала — списки `["Аня", "9А", 5]`, и программа выводит оценку как `r[2]`. В начало каждой записи добавили номер ученика, теперь запись — `[17, "Аня", "9А", 5]`. Что выведет `print(r[2])` и что уберегло бы программу от такой поломки?
  options:
  - '`9А`; уберегли бы словари: `r["mark"]` не зависит от места поля'
  - '`5`: при вставке поля Python сдвигает индексы, и код продолжает выводить оценку'
  - '`9А`; уберегли бы кортежи: их поля не сдвигаются при добавлении нового'
  - 'Ошибку `IndexError`: полей в записи стало больше, чем ожидает код'
  answer: 0
  explain: 'В списке поле определяется местом: после вставки в начало индекс 2 указывает на группу. Ключ словаря от места не зависит, поэтому код, который берёт поле по названию столбца, переживает новые поля. Кортеж — та же последовательность с индексами, у него поля сдвинутся так же. Ошибки нет: индекс 2 в списке из четырёх элементов существует.'
- id: settings-alias
  type: single
  q: |
    Что выведет программа?
    ```python
    settings = {"тема": "светлая", "звук": True}
    default = {"звук": True, "тема": "светлая"}
    user = settings
    user["тема"] = "тёмная"
    print(settings == default, settings["тема"])
    ```
  options:
  - '`False тёмная`'
  - '`True светлая`'
  - '`False светлая`'
  - '`True тёмная`'
  answer: 0
  explain: '`user = settings` не копирует словарь: изменение через `user` видно через `settings`. До правки `settings == default` было бы `True` — порядок пар при сравнении не важен, — но теперь значения по ключу «тема» разные. `True светлая` вышло бы, если бы присваивание делало копию.'
- id: open-dict-vs-lists
  type: open
  q: Цены магазина можно хранить двумя списками — названия в `names`, цены в `prices` в том же порядке — или одним словарём «название → цена». Объясните, чем словарь удобнее, если цены часто ищут по названию, а товары добавляются.
  rubric:
  - поиск — в словаре цену получают сразу по названию (prices["хлеб"]), а с двумя списками нужно сначала найти индекс названия (names.index) и потом по нему взять цену
  - добавление — в словарь пара добавляется одним действием, а в два списка нужно дописывать отдельно, и если забыть один, данные разъедутся
  wrong_answers:
  - словарь сам сортирует товары по названию
  - в двух списках нельзя хранить одинаковые цены
  - словарь занимает меньше места, поэтому он удобнее
  followups:
  - Что случится с ценами, если в список названий дописали товар, а в список цен — забыли?
