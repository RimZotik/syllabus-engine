title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: add-replace-order
  type: single
  q: |
    Что выведет программа?
    ```python
    stock = {"чай": 3, "мёд": 1}
    stock["сахар"] = 2
    stock["чай"] = 5
    print(list(stock), stock["чай"])
    ```
  options:
  - "`['чай', 'мёд', 'сахар'] 5`"
  - "`['мёд', 'сахар', 'чай'] 5`"
  - "`['чай', 'мёд', 'сахар'] 8`"
  - "`['чай', 'мёд', 'сахар', 'чай'] 5`"
  answer: 0
  explain: 'Новый ключ «сахар» встаёт в конец. Ключ «чай» уже был, поэтому присваивание заменяет значение: не прибавляет к старому и не переносит пару в конец. Повторяться ключи не могут, а `list(stock)` — список ключей.'
- id: missing-key-safe
  type: multi
  q: '`phones = {"Аня": "111", "Борис": "222"}`. Какие выражения выполнятся без ошибки?'
  options:
  - '`phones.get("Вера")`'
  - '`"Вера" in phones`'
  - '`phones.get("Вера", "нет номера")`'
  - '`phones["Вера"]`'
  - '`phones[0]`'
  answer:
  - 0
  - 1
  - 2
  explain: '`get` на отсутствующем ключе возвращает `None` или второй аргумент, `in` просто отвечает `False`. Обращение в квадратных скобках к отсутствующему ключу — `KeyError`. `phones[0]` — это тоже поиск ключа `0`, а не первой пары, поэтому тоже `KeyError: 0`.'
- id: lookup-number
  type: single
  q: |
    Что выведет программа?
    ```python
    book = {"Аня": "111", "Борис": "222"}
    query = "222"
    if query in book:
        print("есть такое имя")
    elif query in book.values():
        print("есть такой номер")
    else:
        print("не найдено")
    ```
  options:
  - '`есть такой номер`'
  - '`есть такое имя`'
  - '`не найдено`'
  - 'Ошибку `KeyError: ''222''`'
  answer: 0
  explain: '`in` у словаря проверяет только ключи, а «222» — не имя, а номер, поэтому первое условие ложно. Среди значений его находит `book.values()`. `KeyError` бывает при обращении `book["222"]`, а проверка `in` никогда не падает — она просто отвечает `True` или `False`.'
- id: valid-keys
  type: multi
  q: Журнал посещений хранит отметку для каждой пары «ученик, дата». Какие значения подойдут ключом такого словаря?
  options:
  - '`("Аня", "12.04")`'
  - '`"Аня 12.04"`'
  - '`["Аня", "12.04"]`'
  - '`("Аня", ["12.04"])`'
  - '`{"Аня": "12.04"}`'
  answer:
  - 0
  - 1
  explain: 'Ключ — неизменяемое значение: кортеж из строк или одна строка подойдут. Список и словарь изменяемы — `TypeError: unhashable type`. Кортеж, внутри которого список, тоже не годится: список в нём может измениться.'
- id: group-without-check
  type: single
  q: |
    В группировке учеников по классам строку `if g not in by_group:` удалили, а присваивание под ней оставили на том же уровне, что `append`. Что выведет программа?
    ```python
    students = [
        {"name": "Аня", "group": "9А"},
        {"name": "Борис", "group": "9Б"},
        {"name": "Вера", "group": "9А"},
    ]
    by_group = {}
    for s in students:
        g = s["group"]
        by_group[g] = []
        by_group[g].append(s["name"])
    print(by_group)
    ```
  options:
  - "`{'9А': ['Вера'], '9Б': ['Борис']}`"
  - "`{'9А': ['Аня', 'Вера'], '9Б': ['Борис']}`"
  - "`{'9А': ['Аня'], '9Б': ['Борис']}`"
  - "Ошибку `KeyError: '9А'`"
  answer: 0
  explain: 'Теперь на каждой записи ключ группы связывается с новым пустым списком, и всё, что туда дописали раньше, теряется. Для 9А последней была Вера — её и видно. Ошибки нет: присваивание по ключу добавляет пару, если ключа не было.'
- id: settings-alias
  type: single
  q: |
    Что выведет программа?
    ```python
    settings = {"тема": "светлая", "звук": True}
    default = {"звук": True, "тема": "светлая"}
    user = settings
    user["тема"] = "тёмная"
    print(settings == default, settings["тема"])
    ```
  options:
  - '`False тёмная`'
  - '`True светлая`'
  - '`False светлая`'
  - '`True тёмная`'
  answer: 0
  explain: '`user = settings` не копирует словарь: изменение через `user` видно через `settings`. До правки `settings == default` было бы `True` — порядок пар при сравнении не важен, — но теперь значения по ключу «тема» разные. `True светлая` вышло бы, если бы присваивание делало копию.'
- id: k3-complete-get
  type: code
  q: |
    Функция `phone(name)` возвращает номер из записной книжки `BOOK`. **Замените `...` одним выражением: если имени в книжке нет, вернуть строку `"нет номера"`, а не упасть.**
    ```call
    phone("Борис")
    ```
    ```return
    "333-44"
    ```
  starter: |
    BOOK = {"Аня": "111-22", "Борис": "333-44", "Вера": "555-66"}

    def phone(name):
        return ...
  solution: |
    BOOK = {"Аня": "111-22", "Борис": "333-44", "Вера": "555-66"}

    def phone(name):
        return BOOK.get(name, "нет номера")
  tests:
    function: phone
    calls:
    - name: Имя есть
      args: ["Борис"]
      expect: "333-44"
    - name: Имени нет
      args: ["Глеб"]
      expect: "нет номера"
      hidden: true
    - name: Регистр важен
      args: ["аня"]
      expect: "нет номера"
      hidden: true
    - name: Последнее имя
      args: ["Вера"]
      expect: "555-66"
      hidden: true
  explain: |
    `BOOK[name]` на отсутствующем ключе даёт `KeyError`, а `get` возвращает второй аргумент. Ключи сравниваются точно: «аня» и «Аня» — разные строки. То же можно написать условием `if name in BOOK:`, но одним выражением — только `get`.
- id: k3-fix-items
  type: code
  q: |
    Функция `affordable(prices, limit)` падает с `ValueError`. **Исправьте её: вернуть список названий товаров прайса не дороже `limit`, в порядке прайса.**

    `prices` — словарь «товар → цена».
    ```call
    affordable({"хлеб": 45, "сыр": 320, "чай": 150, "мёд": 300}, 200)
    ```
    ```return
    ['хлеб', 'чай']
    ```
  starter: |
    def affordable(prices, limit):
        result = []
        for name, price in prices:
            if price <= limit:
                result.append(name)
        return result
  solution: |
    def affordable(prices, limit):
        result = []
        for name, price in prices.items():
            if price <= limit:
                result.append(name)
        return result
  tests:
    function: affordable
    no_mutate: true
    calls:
    - name: До 200 рублей
      args: [{"хлеб": 45, "сыр": 320, "чай": 150, "мёд": 300}, 200]
      expect: ["хлеб", "чай"]
    - name: Ровно по цене
      args: [{"хлеб": 45, "сыр": 320, "чай": 150, "мёд": 300}, 300]
      expect: ["хлеб", "чай", "мёд"]
      hidden: true
    - name: Ничего не подходит
      args: [{"хлеб": 45, "сыр": 320, "чай": 150, "мёд": 300}, 10]
      expect: []
      hidden: true
    - name: Всё подходит
      args: [{"хлеб": 45, "сыр": 320, "чай": 150, "мёд": 300}, 1000]
      expect: ["хлеб", "сыр", "чай", "мёд"]
      hidden: true
  explain: |
    Цикл по самому словарю выдаёт только ключи, и строку «хлеб» не разложить на два имени. Пары «ключ, значение» даёт `prices.items()`. Подойдёт и `for name in prices:` с ценой `prices[name]`.
- id: k3-fix-del-loop
  type: code
  q: |
    **Исправьте `drop_empty(cart)`: убрать из корзины-словаря «товар → количество» товары с количеством 0 — прямо в переданном словаре.** Сейчас она падает с `RuntimeError`.
    ```python
    cart = {"хлеб": 1, "сыр": 0, "чай": 2}
    drop_empty(cart)
    cart
    ```
    ```output
    {'хлеб': 1, 'чай': 2}
    ```
  starter: |
    def drop_empty(cart):
        for item in cart:
            if cart[item] == 0:
                del cart[item]
  solution: |
    def drop_empty(cart):
        for item in list(cart):
            if cart[item] == 0:
                del cart[item]
  tests:
    function: drop_empty
    calls:
    - name: Один пустой товар
      args: [{"хлеб": 1, "сыр": 0, "чай": 2}]
      expect: null
      after: [{"хлеб": 1, "чай": 2}]
    - name: Все пустые
      args: [{"сыр": 0, "мёд": 0}]
      expect: null
      after: [{}]
    - name: Пустых нет
      args: [{"хлеб": 3}]
      expect: null
      after: [{"хлеб": 3}]
    - name: Пустая корзина
      args: [{}]
      expect: null
      after: [{}]
  explain: |
    Словарь нельзя менять в размере, пока по нему идёт перебор. `list(cart)` один раз собирает отдельный список ключей, цикл идёт по нему, а удалять из словаря при этом можно.
- id: k3-write-from-lists
  type: code
  q: |
    **Напишите `price_book(names, prices)`: из списка названий и списка цен в том же порядке вернуть словарь «название → цена».**
    ```call
    price_book(["хлеб", "сыр", "хлеб"], [45, 320, 50])
    ```
    ```return
    {'хлеб': 50, 'сыр': 320}
    ```
    Списки одной длины. Если название повторяется, остаётся цена последнего вхождения.
  starter: |
    def price_book(names, prices):
        book = {}
        return book
  solution: |
    def price_book(names, prices):
        book = {}
        for name, price in zip(names, prices):
            book[name] = price
        return book
  tests:
    function: price_book
    calls:
    - name: Три товара
      args: [["хлеб", "сыр", "чай"], [45, 320, 150]]
      expect: {"хлеб": 45, "сыр": 320, "чай": 150}
    - name: Повтор названия
      args: [["хлеб", "сыр", "хлеб"], [45, 320, 50]]
      expect: {"хлеб": 50, "сыр": 320}
    - name: Пустые списки
      args: [[], []]
      expect: {}
    asserts:
    - name: Порядок ключей
      code: |
        r = price_book(["чай", "мёд"], [150, 300])
        assert list(r) == ["чай", "мёд"], "Ключи идут в порядке добавления: нужно ['чай', 'мёд'], а получилось " + repr(list(r))
  explain: |
    `zip` даёт пары «название, цена», а присваивание по ключу добавляет пару или заменяет значение, если ключ уже был, — поэтому остаётся последняя цена.
- id: k3-write-invert
  type: code
  q: |
    **Напишите `by_phone(book)`: по записной книжке «имя → номер» вернуть новый словарь «номер → имя».**
    ```call
    by_phone({"Аня": "111", "Борис": "222"})
    ```
    ```return
    {'111': 'Аня', '222': 'Борис'}
    ```
    Номера не повторяются. Исходный словарь не меняется.
  starter: |
    def by_phone(book):
        result = {}
        for name in book:
            result[name] = book[name]
        return result
  solution: |
    def by_phone(book):
        result = {}
        for name, phone in book.items():
            result[phone] = name
        return result
  tests:
    function: by_phone
    no_mutate: true
    calls:
    - name: Два контакта
      args: [{"Аня": "111", "Борис": "222"}]
      expect: {"111": "Аня", "222": "Борис"}
    - name: Книжка не меняется
      args: [{"Аня": "111"}]
      expect: {"111": "Аня"}
    - name: Пустая книжка
      args: [{}]
      expect: {}
    asserts:
    - name: Поиск по номеру
      code: |
        r = by_phone({"Вера": "555", "Глеб": "777", "Дина": "999"})
        assert r.get("777") == "Глеб", "По номеру '777' нужно найти 'Глеб', а нашлось " + repr(r.get("777"))
  explain: |
    `items()` даёт пары «имя, номер», и в новом словаре они меняются ролями: номер становится ключом. Это работает, только пока номера не повторяются: два одинаковых ключа быть не могут, и второе имя заменило бы первое.
- id: k3-write-merge-stock
  type: code
  q: |
    Остатки склада и поставка — словари «товар → количество». **Напишите `after_delivery(stock, delivery)`: вернуть новый словарь остатков после поставки.**
    ```call
    after_delivery({"хлеб": 3, "сыр": 1}, {"сыр": 4, "чай": 2})
    ```
    ```return
    {'хлеб': 3, 'сыр': 5, 'чай': 2}
    ```
    Товар, которого на складе не было, появляется в остатках. Исходные словари не меняются.
  starter: |
    def after_delivery(stock, delivery):
        result = stock
        for item in delivery:
            result[item] = result[item] + delivery[item]
        return result
  solution: |
    def after_delivery(stock, delivery):
        result = {}
        for item, count in stock.items():
            result[item] = count
        for item, count in delivery.items():
            result[item] = result.get(item, 0) + count
        return result
  tests:
    function: after_delivery
    no_mutate: true
    calls:
    - name: Знакомый и новый товар
      args: [{"хлеб": 3, "сыр": 1}, {"сыр": 4, "чай": 2}]
      expect: {"хлеб": 3, "сыр": 5, "чай": 2}
    - name: Склад не меняется
      args: [{"хлеб": 3}, {"хлеб": 2}]
      expect: {"хлеб": 5}
    - name: Пустой склад
      args: [{}, {"мёд": 6}]
      expect: {"мёд": 6}
    asserts:
    - name: Пустая поставка
      code: |
        stock = {"чай": 1}
        r = after_delivery(stock, {})
        assert r == {"чай": 1}, "Нужно {'чай': 1}, а вернулось " + repr(r)
        assert r is not stock, "Функция должна вернуть новый словарь, а вернула сам склад"
  explain: |
    В заготовке две ошибки. `result = stock` не копирует словарь, поэтому поставка портит склад: нужен новый словарь, куда сначала переписаны пары склада (у словаря, как у списка, есть и метод `copy()`). А `result[item]` для нового товара даёт `KeyError` — `get(item, 0)` начинает с нуля.
- id: k3-write-top-in-group
  type: code
  q: |
    Журнал — список словарей с ключами `"name"`, `"group"` и `"mark"`. **Напишите `best_in_groups(students)`: вернуть словарь «группа → имя ученика с самой высокой оценкой в группе».**
    ```call
    best_in_groups([
        {"name": "Аня", "group": "9А", "mark": 4},
        {"name": "Борис", "group": "9Б", "mark": 3},
        {"name": "Вера", "group": "9А", "mark": 5},
    ])
    ```
    ```return
    {'9А': 'Вера', '9Б': 'Борис'}
    ```
    При равных оценках — тот, кто стоит в журнале раньше.
  starter: |
    def best_in_groups(students):
        best = {}
        return best
  solution: |
    def best_in_groups(students):
        best = {}
        for s in students:
            g = s["group"]
            if g not in best or s["mark"] > best[g]["mark"]:
                best[g] = s
        result = {}
        for g, s in best.items():
            result[g] = s["name"]
        return result
  tests:
    function: best_in_groups
    calls:
    - name: Две группы
      args: [[{"name": "Аня", "group": "9А", "mark": 4}, {"name": "Борис", "group": "9Б", "mark": 3}, {"name": "Вера", "group": "9А", "mark": 5}]]
      expect: {"9А": "Вера", "9Б": "Борис"}
    - name: Равные оценки — кто раньше
      args: [[{"name": "Глеб", "group": "10А", "mark": 5}, {"name": "Дина", "group": "10А", "mark": 5}, {"name": "Егор", "group": "10А", "mark": 2}]]
      expect: {"10А": "Глеб"}
    - name: Лучший в конце
      args: [[{"name": "Аня", "group": "9А", "mark": 2}, {"name": "Борис", "group": "9А", "mark": 3}, {"name": "Вера", "group": "9А", "mark": 4}]]
      expect: {"9А": "Вера"}
    - name: Пустой журнал
      args: [[]]
      expect: {}
  explain: |
    Под каждым ключом-группой хранится лучшая на сей момент запись. Новая группа получает первую же запись, а дальше запись заменяется, только если оценка строго выше, — так при равенстве остаётся тот, кто раньше. Можно хранить и два словаря: «группа → лучшая оценка» и «группа → имя».
