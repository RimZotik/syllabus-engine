id: p1k-shop-check
title: Касса с каталогом
sandbox: python-browser
difficulty: 2
statement: |
  **Посчитайте сумму покупки по каталогу цен и перечислите товары, которых в каталоге нет.**

  Каталог — словарь `CATALOG` в редакторе, его не меняйте. Ввод — названия товаров по одному в строке (товар может повторяться), в конце пустая строка. Вывод — строка `Итого: S`, где `S` — сумма цен товаров из каталога. Если есть товары не из каталога, второй строкой выведите `Нет в каталоге: ` и их названия через запятую с пробелом — каждое один раз, в порядке первого появления; иначе второй строки нет.

  Пример 1
  ```input
  хлеб
  кофе
  молоко
  хлеб
  кофе

  ```
  ```output
  Итого: 179
  Нет в каталоге: кофе
  ```

  Пример 2
  ```input
  сыр
  чай

  ```
  ```output
  Итого: 470
  ```
starter: |
  CATALOG = {"хлеб": 45, "молоко": 89, "сыр": 320, "чай": 150}

  # План:
  # 1. Итог 0 и пустой список неизвестных товаров
  # 2. Читать названия до пустой строки:
  #    есть в каталоге — добавить цену к итогу,
  #    нет — дописать в список неизвестных, если его там ещё нет
  # 3. Вывести итог; если список неизвестных не пуст — вторую строку
solution: |
  CATALOG = {"хлеб": 45, "молоко": 89, "сыр": 320, "чай": 150}

  total = 0
  unknown = []
  name = input()
  while name != "":
      if name in CATALOG:
          total += CATALOG[name]
      elif name not in unknown:
          unknown.append(name)
      name = input()
  print("Итого:", total)
  if unknown:
      print("Нет в каталоге:", ", ".join(unknown))
tests:
  io:
    - name: Пример из условия
      stdin: "хлеб\nкофе\nмолоко\nхлеб\nкофе\n\n"
      stdout: "Итого: 179\nНет в каталоге: кофе"
    - name: Всё из каталога
      stdin: "сыр\nчай\n\n"
      stdout: "Итого: 470"
      hidden: true
    - name: Пустая лента
      stdin: "\n"
      stdout: "Итого: 0"
      hidden: true
    - name: Ничего из каталога
      stdin: "кофе\nторт\nкофе\n\n"
      stdout: "Итого: 0\nНет в каталоге: кофе, торт"
      hidden: true
    - name: Несколько неизвестных по порядку
      stdin: "торт\nхлеб\nкофе\nторт\nмёд\n\n"
      stdout: "Итого: 45\nНет в каталоге: торт, кофе, мёд"
      hidden: true
hints:
  - level: 1
    text: 'Как узнать, есть ли товар в каталоге, не получив `KeyError`? Где запоминать неизвестные товары, чтобы сохранить порядок и не повторяться?'
  - level: 2
    text: '`name in CATALOG` проверяет ключи. Неизвестные — в список, но дописывать только если `name not in unknown`. Вторую строку собирает `", ".join(unknown)`.'
  - level: 3
    text: 'В цикле три случая: товар есть в каталоге; товара нет и он встретился впервые; товара нет и он уже записан. Вторую строку печатайте, только если список неизвестных не пуст.'
