id: p1k-shop-check
title: Касса с каталогом
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите `shop_check(items)`: посчитать сумму покупки по каталогу цен и найти товары, которых в каталоге нет.**

  Каталог — словарь `CATALOG` в редакторе, его не меняйте. `items` — названия товаров, товар может повторяться. Функция возвращает два значения: сумму цен товаров из каталога и список товаров не из каталога — каждый один раз, в порядке первого появления.

  Пример 1
  ```call
  shop_check(["хлеб", "кофе", "молоко", "хлеб", "кофе"])
  ```
  ```return
  (179, ['кофе'])
  ```

  Пример 2
  ```call
  shop_check(["сыр", "чай"])
  ```
  ```return
  (470, [])
  ```
starter: |
  CATALOG = {"хлеб": 45, "молоко": 89, "сыр": 320, "чай": 150}

  def shop_check(items):
      # План:
      # 1. Итог 0 и пустой список неизвестных товаров
      # 2. Для каждого названия:
      #    есть в каталоге — добавить цену к итогу,
      #    нет — дописать в список неизвестных, если его там ещё нет
      # 3. Вернуть итог и список неизвестных
      return 0, []
solution: |
  CATALOG = {"хлеб": 45, "молоко": 89, "сыр": 320, "чай": 150}

  def shop_check(items):
      total = 0
      unknown = []
      for name in items:
          if name in CATALOG:
              total += CATALOG[name]
          elif name not in unknown:
              unknown.append(name)
      return total, unknown
tests:
  function: shop_check
  no_mutate: true
  calls:
    - name: Пример 1
      args: [["хлеб", "кофе", "молоко", "хлеб", "кофе"]]
      expect_py: "(179, ['кофе'])"
    - name: Пример 2
      args: [["сыр", "чай"]]
      expect_py: "(470, [])"
    - name: Пустая лента
      args: [[]]
      expect_py: "(0, [])"
      hidden: true
    - name: Ничего из каталога
      args: [["кофе", "торт", "кофе"]]
      expect_py: "(0, ['кофе', 'торт'])"
      hidden: true
    - name: Несколько неизвестных по порядку
      args: [["торт", "хлеб", "кофе", "торт", "мёд"]]
      expect_py: "(45, ['торт', 'кофе', 'мёд'])"
      hidden: true
  asserts:
    - name: Каталог не меняется
      code: |
        shop_check(["кофе", "хлеб"])
        assert CATALOG == {"хлеб": 45, "молоко": 89, "сыр": 320, "чай": 150}, "Каталог не должен меняться, а он " + repr(CATALOG)
hints:
  - level: 1
    text: 'Как узнать, есть ли товар в каталоге, не получив `KeyError`? Где запоминать неизвестные товары, чтобы сохранить порядок и не повторяться?'
  - level: 2
    text: '`name in CATALOG` проверяет ключи. Неизвестные — в список, но дописывать только если `name not in unknown`. Два значения возвращают через запятую: `return total, unknown`.'
  - level: 3
    text: 'В цикле три случая: товар есть в каталоге; товара нет и он встретился впервые; товара нет и он уже записан. Чтобы увидеть, что происходит внутри, добавьте `print` — он не влияет на проверку.'
