id: p1k-poll
title: Итоги опроса
sandbox: python-browser
difficulty: 2
statement: |
  **Подведите итоги опроса: для каждого ответа выведите, сколько раз его дали.**

  Ввод — ответы по одному в строке, в конце пустая строка. Ответы, которые различаются только регистром букв и пробелами по краям, считаются одним ответом: приведите каждый к строчным буквам без пробелов по краям. Вывод — строки `ответ: N` в порядке, в каком ответы впервые встретились; если ответов нет — `Нет ответов`.

  Пример 1
  ```input
  Яблоко
  банан
  яблоко
  Груша
  банан

  ```
  ```output
  яблоко: 2
  банан: 2
  груша: 1
  ```

  Ограничения: готовый `Counter` и метод `count` не используйте.
starter: |
  # План:
  # 1. Пустой словарь «ответ → сколько раз»
  # 2. Читать строки до пустой; каждую привести к одному виду (strip, lower)
  #    и увеличить счётчик этого ответа на 1
  # 3. Если словарь пуст — «Нет ответов», иначе вывести пары по порядку
stdin: "Яблоко\nбанан\nяблоко \nГруша\nбанан\n\n"
solution: |
  counts = {}
  line = input()
  while line != "":
      answer = line.strip().lower()
      counts[answer] = counts.get(answer, 0) + 1
      line = input()
  if not counts:
      print("Нет ответов")
  else:
      for answer, n in counts.items():
          print(f"{answer}: {n}")
tests:
  forbid: [Counter, collections, count]
  io:
    - name: Пример из условия
      stdin: "Яблоко\nбанан\nяблоко \nГруша\nбанан\n\n"
      stdout: "яблоко: 2\nбанан: 2\nгруша: 1"
    - name: Нет ответов
      stdin: "\n"
      stdout: "Нет ответов"
      hidden: true
    - name: Один ответ
      stdin: "Киви\n\n"
      stdout: "киви: 1"
      hidden: true
    - name: Все ответили одинаково
      stdin: "банан\nБАНАН\n  Банан\n\n"
      stdout: "банан: 3"
      hidden: true
    - name: Порядок первого появления, а не по алфавиту
      stdin: "слива\nарбуз\nслива\nарбуз\nслива\n\n"
      stdout: "слива: 3\nарбуз: 2"
      hidden: true
hints:
  - level: 1
    text: 'Это шаблон накопителя, только накопителей много — по одному на каждый ответ. Где их хранить, чтобы по ответу сразу находить его счётчик? Что делать, когда ответ встретился впервые?'
  - level: 2
    text: 'Словарь `counts`: ключ — ответ, значение — счётчик. `counts.get(answer, 0)` даёт 0 для нового ответа, и ошибки нет. Порядок первого появления словарь хранит сам.'
  - level: 3
    text: 'Приведите строку к одному виду до того, как искать её в словаре. После цикла пройдите пары «ответ, счётчик» методом `items()`.'
