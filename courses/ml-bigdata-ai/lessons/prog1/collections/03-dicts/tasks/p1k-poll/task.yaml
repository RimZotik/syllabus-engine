id: p1k-poll
title: Итоги опроса
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите `poll(answers)`: подвести итоги опроса — вернуть словарь «ответ → сколько раз его дали».**

  `answers` — ответы, строки. Ответы, которые различаются только регистром букв и пробелами по краям, считаются одним ответом: приведите каждый к строчным буквам без пробелов по краям — так он и попадает в словарь ключом. Ключи идут в порядке, в каком ответы впервые встретились. Если ответов нет — пустой словарь. Список `answers` функция не меняет.

  Пример 1
  ```call
  poll(["Яблоко", "банан", "яблоко ", "Груша", "банан"])
  ```
  ```return
  {'яблоко': 2, 'банан': 2, 'груша': 1}
  ```

  Пример 2
  ```call
  poll([])
  ```
  ```return
  {}
  ```

  Ограничения: готовый `Counter` и метод `count` не используйте.
starter: |
  def poll(answers):
      # План:
      # 1. Пустой словарь «ответ → сколько раз»
      # 2. Каждый ответ привести к одному виду (strip, lower)
      #    и увеличить его счётчик на 1
      # 3. Вернуть словарь
      return {}
solution: |
  def poll(answers):
      counts = {}
      for line in answers:
          answer = line.strip().lower()
          counts[answer] = counts.get(answer, 0) + 1
      return counts
tests:
  forbid: [Counter, collections, count]
  function: poll
  no_mutate: true
  calls:
    - name: Пример 1
      args: [["Яблоко", "банан", "яблоко ", "Груша", "банан"]]
      expect: {"яблоко": 2, "банан": 2, "груша": 1}
    - name: Пример 2
      args: [[]]
      expect: {}
    - name: Один ответ
      args: [["Киви"]]
      expect: {"киви": 1}
      hidden: true
    - name: Все ответили одинаково
      args: [["банан", "БАНАН", "  Банан"]]
      expect: {"банан": 3}
      hidden: true
  asserts:
    - name: Порядок первого появления, а не по алфавиту
      code: |
        r = poll(["слива", "арбуз", "слива", "арбуз", "слива"])
        assert list(r.items()) == [("слива", 3), ("арбуз", 2)], "Ключи должны идти в порядке первого появления: нужно {'слива': 3, 'арбуз': 2}, а вернулось " + repr(r)
hints:
  - level: 1
    text: 'Это шаблон накопителя, только накопителей много — по одному на каждый ответ. Где их хранить, чтобы по ответу сразу находить его счётчик? Что делать, когда ответ встретился впервые?'
  - level: 2
    text: 'Словарь `counts`: ключ — ответ, значение — счётчик. `counts.get(answer, 0)` даёт 0 для нового ответа, и ошибки нет. Порядок первого появления словарь хранит сам. Чтобы увидеть, что происходит внутри, добавьте `print(counts)` в цикл — он не влияет на проверку.'
  - level: 3
    text: 'Приведите строку к одному виду до того, как искать её в словаре, и только потом увеличивайте счётчик.'
