id: p1k-poll
title: Итоги опроса
sandbox: python-browser
difficulty: 2
statement: |
  В классе провели опрос «Какой фрукт взять на праздник?». Во вводе — ответы, по одному в строке, в конце — пустая строка. Ответы писали от руки, поэтому «Яблоко», «яблоко» и «яблоко » с лишним пробелом — один и тот же ответ: приведите каждый к строчным буквам и уберите пробелы по краям.

  Выведите для каждого ответа строку `ответ: N` — сколько раз его дали. Порядок — в каком ответы впервые встретились. Если ответов нет, выведите `Нет ответов`.

  ```input
  Яблоко
  банан
  яблоко
  Груша
  банан

  ```
  ```
  яблоко: 2
  банан: 2
  груша: 1
  ```

  (Последняя строка ввода пустая.) Посчитайте частоты словарём сами: готовый `Counter` и метод `count` не используйте.
starter: |
  # План:
  # 1. Пустой словарь «ответ → сколько раз»
  # 2. Читать строки до пустой; каждую привести к одному виду (strip, lower)
  #    и увеличить счётчик этого ответа на 1
  # 3. Если словарь пуст — «Нет ответов», иначе вывести пары по порядку
stdin: "Яблоко\nбанан\nяблоко \nГруша\nбанан\n\n"
solution: |
  counts = {}
  line = input()
  while line != "":
      answer = line.strip().lower()
      counts[answer] = counts.get(answer, 0) + 1
      line = input()
  if not counts:
      print("Нет ответов")
  else:
      for answer, n in counts.items():
          print(f"{answer}: {n}")
tests:
  forbid: [Counter, collections, count]
  io:
    - name: Пример из условия
      stdin: "Яблоко\nбанан\nяблоко \nГруша\nбанан\n\n"
      stdout: "яблоко: 2\nбанан: 2\nгруша: 1"
    - name: Нет ответов
      stdin: "\n"
      stdout: "Нет ответов"
      hidden: true
    - name: Один ответ
      stdin: "Киви\n\n"
      stdout: "киви: 1"
      hidden: true
    - name: Все ответили одинаково
      stdin: "банан\nБАНАН\n  Банан\n\n"
      stdout: "банан: 3"
      hidden: true
    - name: Порядок первого появления, а не по алфавиту
      stdin: "слива\nарбуз\nслива\nарбуз\nслива\n\n"
      stdout: "слива: 3\nарбуз: 2"
      hidden: true
hints:
  - level: 1
    text: 'Это шаблон накопителя, только накопителей много — по одному на каждый ответ. Где их хранить, чтобы по ответу сразу находить его счётчик? Что делать, когда ответ встретился впервые?'
  - level: 2
    text: 'Словарь `counts`: ключ — ответ, значение — счётчик. `counts.get(answer, 0)` даёт 0 для нового ответа, и ошибки нет. Порядок первого появления словарь хранит сам.'
  - level: 3
    text: 'В цикле: `answer = line.strip().lower()` и `counts[answer] = counts.get(answer, 0) + 1`. После цикла — `for answer, n in counts.items(): print(f"{answer}: {n}")`.'
