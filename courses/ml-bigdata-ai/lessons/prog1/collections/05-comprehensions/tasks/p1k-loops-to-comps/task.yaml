id: p1k-loops-to-comps
title: Циклы — в одну строку
sandbox: python-browser
difficulty: 2
statement: |
  В редакторе — четыре работающие функции, написанные шаблоном «пустая коллекция, цикл, дописать». Перепишите тело каждой одной строкой кода `return …` со включением: списка, словаря — какое подходит. Результат каждой функции должен остаться прежним:

  - `to_numbers(line)` — числа из строки через пробел: `to_numbers("89 45 320")` → `[89, 45, 320]`;
  - `frosty(temps)` — только температуры ниже нуля, в прежнем порядке;
  - `pass_marks(marks)` — для каждой оценки `"сдал"` (3 и выше) или `"не сдал"`, столько же элементов, сколько оценок;
  - `price_index(products)` — словарь «название → цена» из таблицы товаров, где у каждого товара есть ключи `"name"` и `"price"`.

  Каждое тело — одно включение, без циклов с `append` или присваиванием по ключу. Проверки смотрят не только на результат, но и на то, что функция собрана включением; `append`, `extend`, `update`, `map`, `filter`, `list` и `dict` в задаче запрещены. Вводить и печатать ничего не нужно — проверки вызывают функции сами.
starter: |
  def to_numbers(line):
      result = []
      for part in line.split():
          result.append(int(part))
      return result


  def frosty(temps):
      result = []
      for t in temps:
          if t < 0:
              result.append(t)
      return result


  def pass_marks(marks):
      result = []
      for m in marks:
          if m >= 3:
              result.append("сдал")
          else:
              result.append("не сдал")
      return result


  def price_index(products):
      result = {}
      for p in products:
          result[p["name"]] = p["price"]
      return result
solution: |
  def to_numbers(line):
      return [int(part) for part in line.split()]


  def frosty(temps):
      return [t for t in temps if t < 0]


  def pass_marks(marks):
      return ["сдал" if m >= 3 else "не сдал" for m in marks]


  def price_index(products):
      return {p["name"]: p["price"] for p in products}
tests:
  forbid: [append, extend, update, map, filter, list, dict]
  asserts:
    - name: Числа из строки
      code: |
        assert to_numbers("89 45 320") == [89, 45, 320] and to_numbers("") == [], 'to_numbers("89 45 320") — [89, 45, 320], для пустой строки — []'
    - name: Только морозные дни
      code: |
        assert frosty([3, -2, 0, -7, 1]) == [-2, -7] and frosty([1, 2]) == [], "frosty([3, -2, 0, -7, 1]) — [-2, -7]; ноль — не мороз"
    - name: Сдал или не сдал
      code: |
        assert pass_marks([5, 2, 3]) == ["сдал", "не сдал", "сдал"], "pass_marks([5, 2, 3]) — ['сдал', 'не сдал', 'сдал']: элементов столько же, сколько оценок"
    - name: Пустой журнал
      code: |
        assert pass_marks([]) == [], "Для пустого списка оценок — []"
    - name: Справочник цен
      code: |
        assert price_index([{"name": "чай", "price": 150}, {"name": "мёд", "price": 300}]) == {"чай": 150, "мёд": 300}, "Ожидался {'чай': 150, 'мёд': 300}"
    - name: Повтор названия — последняя цена
      code: |
        assert price_index([{"name": "чай", "price": 150}, {"name": "чай", "price": 170}]) == {"чай": 170}, "Если название повторяется, остаётся последняя цена, как в исходном цикле"
    - name: to_numbers — включение
      code: |
        import dis
        def _ops(f):
            ops, todo = set(), [f.__code__]
            while todo:
                c = todo.pop()
                ops.update(i.opname for i in dis.get_instructions(c))
                todo.extend(k for k in c.co_consts if hasattr(k, "co_code"))
            return ops
        assert "LIST_APPEND" in _ops(to_numbers), "to_numbers нужно записать списковым включением [… for …]"
    - name: frosty — включение
      code: |
        import dis
        def _ops(f):
            ops, todo = set(), [f.__code__]
            while todo:
                c = todo.pop()
                ops.update(i.opname for i in dis.get_instructions(c))
                todo.extend(k for k in c.co_consts if hasattr(k, "co_code"))
            return ops
        assert "LIST_APPEND" in _ops(frosty), "frosty нужно записать списковым включением с отбором [… for … if …]"
    - name: pass_marks — включение
      code: |
        import dis
        def _ops(f):
            ops, todo = set(), [f.__code__]
            while todo:
                c = todo.pop()
                ops.update(i.opname for i in dis.get_instructions(c))
                todo.extend(k for k in c.co_consts if hasattr(k, "co_code"))
            return ops
        assert "LIST_APPEND" in _ops(pass_marks), "pass_marks нужно записать списковым включением [… if … else … for …]"
    - name: price_index — включение словаря
      code: |
        import dis
        def _ops(f):
            ops, todo = set(), [f.__code__]
            while todo:
                c = todo.pop()
                ops.update(i.opname for i in dis.get_instructions(c))
                todo.extend(k for k in c.co_consts if hasattr(k, "co_code"))
            return ops
        assert "MAP_ADD" in _ops(price_index), "price_index нужно записать включением словаря {ключ: значение for …}, а не циклом с присваиванием"
    - name: Входные данные не меняются
      code: |
        t = [3, -2]
        frosty(t)
        assert t == [3, -2], "frosty не должна менять переданный список"
hints:
  - level: 1
    text: 'Для каждой функции ответьте: что дописывали в результат, откуда брали, каких брали? Это и есть три части включения, в том же порядке.'
  - level: 2
    text: '`frosty` — отбор (`if` в конце), `pass_marks` — замена (`… if … else …` в начале). Словарь собирают в фигурных скобках с двоеточием: `{ключ: значение for …}`.'
  - level: 3
    text: '`[int(part) for part in line.split()]`, `[t for t in temps if t < 0]`, `["сдал" if m >= 3 else "не сдал" for m in marks]`, `{p["name"]: p["price"] for p in products}`.'
