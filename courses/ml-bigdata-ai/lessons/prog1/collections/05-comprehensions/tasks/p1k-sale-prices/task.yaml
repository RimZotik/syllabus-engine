id: p1k-sale-prices
title: Распродажа
sandbox: python-browser
difficulty: 2
statement: |
  Прайс магазина — словарь «товар → цена в рублях». К распродаже нужны три функции. Каждую удобно записать одной строкой кода `return …` со включением или генераторным выражением:

  - `sale_prices(prices)` возвращает новый словарь с теми же товарами: на товары **дороже** 1000 рублей скидка 10 % (скидка — `price // 10`, то есть целые рубли с округлением вниз), остальные цены прежние;
  - `cheap_names(prices, limit)` возвращает список названий товаров с ценой не больше `limit`, по алфавиту;
  - `has_free(prices)` возвращает `True`, если хоть один товар стоит 0 рублей (подарок), иначе `False`.

  ```python
  prices = {"чайник": 2500, "кружка": 300, "ложка": 0, "плед": 1000}
  sale_prices(prices)       # {'чайник': 2250, 'кружка': 300, 'ложка': 0, 'плед': 1000}
  cheap_names(prices, 300)  # ['кружка', 'ложка']
  has_free(prices)          # True
  ```

  Сам словарь `prices` функции не меняют, `append` в задаче запрещён. Вводить и печатать ничего не нужно — проверки вызывают функции сами.
starter: |
  def sale_prices(prices):
      # Каждый товар остаётся, меняется только цена: замена, а не отбор
      return prices


  def cheap_names(prices, limit):
      # Отбор названий по цене, потом сортировка
      return []


  def has_free(prices):
      # Есть ли хоть одна нулевая цена
      return False
solution: |
  def sale_prices(prices):
      return {name: (p - p // 10 if p > 1000 else p) for name, p in prices.items()}


  def cheap_names(prices, limit):
      return sorted(name for name, p in prices.items() if p <= limit)


  def has_free(prices):
      return any(p == 0 for p in prices.values())
tests:
  forbid: [append]
  asserts:
    - name: Скидка только на дорогие
      code: |
        r = sale_prices({"чайник": 2500, "кружка": 300, "ложка": 0, "плед": 1000})
        assert r == {"чайник": 2250, "кружка": 300, "ложка": 0, "плед": 1000}, f"Ожидался {{'чайник': 2250, 'кружка': 300, 'ложка': 0, 'плед': 1000}}, получено {r}"
    - name: Округление скидки вниз
      code: |
        assert sale_prices({"лампа": 1999}) == {"лампа": 1800}, "Скидка с 1999 — 199 рублей (1999 // 10), цена — 1800"
    - name: Ровно 1000 — без скидки
      code: |
        assert sale_prices({"плед": 1000, "ковёр": 1001}) == {"плед": 1000, "ковёр": 901}, "Скидка — только дороже 1000: 1000 остаётся, 1001 → 901"
    - name: Прайс не меняется
      code: |
        p = {"чайник": 2500}
        sale_prices(p)
        assert p == {"чайник": 2500}, "sale_prices должна вернуть новый словарь, а не менять переданный"
    - name: Дешёвые по алфавиту
      code: |
        assert cheap_names({"чайник": 2500, "кружка": 300, "ложка": 0, "плед": 1000}, 300) == ["кружка", "ложка"], "cheap_names(..., 300) — ['кружка', 'ложка']: цена не больше 300, по алфавиту"
    - name: Порядок — алфавит, а не порядок в прайсе
      code: |
        assert cheap_names({"ящик": 50, "арбуз": 10, "мёд": 300}, 100) == ["арбуз", "ящик"], "cheap_names({'ящик': 50, 'арбуз': 10, 'мёд': 300}, 100) — ['арбуз', 'ящик']: названия по алфавиту"
    - name: Нет дешёвых
      code: |
        assert cheap_names({"чайник": 2500}, 100) == [] and cheap_names({}, 100) == [], "Если подходящих товаров нет — пустой список"
    - name: Есть подарок
      code: |
        assert has_free({"ложка": 0, "чашка": 200}) is True, "has_free — True, если есть цена 0"
    - name: Подарков нет
      code: |
        assert has_free({"чашка": 200}) is False and has_free({}) is False, "has_free — False, если нулевых цен нет"
hints:
  - level: 1
    text: 'Для каждой функции решите, что это: замена (все товары остаются), отбор (остаются не все) или вопрос «есть ли хоть один». Какой записи соответствует каждый случай?'
  - level: 2
    text: 'Замена в словаре: `{name: (… if … else …) for name, p in prices.items()}`. Отбор с сортировкой: `sorted(…)` от генераторного выражения с `if` в конце. «Есть ли хоть один» — `any(…)`.'
  - level: 3
    text: 'Цена со скидкой — `p - p // 10 if p > 1000 else p`. Дешёвые — `sorted(name for name, p in prices.items() if p <= limit)`. Подарок — `any(p == 0 for p in prices.values())`.'
