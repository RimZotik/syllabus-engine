id: p1k-transpose
title: Журнал — строки в столбцы
sandbox: python-browser
difficulty: 3
statement: |
  **Напишите `transpose(table)`: вернуть новую таблицу, в которой строки исходной стали столбцами.**

  Таблица — список строк одинаковой длины, строка — список. В журнале строка — оценки одного ученика за все контрольные, а после поворота строка — оценки всех учеников за одну контрольную. Таблицу `table` функция не меняет.

  Пример 1
  ```input
  transpose([[5, 4, 3], [3, 5, 4]])
  ```
  ```output
  [[5, 3], [4, 5], [3, 4]]
  ```

  Пример 2
  ```input
  transpose([[2, 3, 5]])
  ```
  ```output
  [[2], [3], [5]]
  ```

  Ограничения: в таблице хотя бы одна строка и один столбец. Соберите результат включением; `append`, `extend`, `insert` и `zip` не используйте.
starter: |
  def transpose(table):
      return table
solution: |
  def transpose(table):
      return [[row[j] for row in table] for j in range(len(table[0]))]
tests:
  forbid: [append, extend, insert, zip]
  asserts:
    - name: Пример 1
      code: |
        r = transpose([[5, 4, 3], [3, 5, 4]])
        assert r == [[5, 3], [4, 5], [3, 4]], f"transpose([[5, 4, 3], [3, 5, 4]]) должна вернуть [[5, 3], [4, 5], [3, 4]], а вернула {r}"
    - name: Одна строка
      code: |
        r = transpose([[2, 3, 5]])
        assert r == [[2], [3], [5]], f"Одна строка из трёх оценок — три строки по одной: [[2], [3], [5]], а вернулось {r}"
    - name: Один столбец
      code: |
        r = transpose([[4], [5], [3], [2]])
        assert r == [[4, 5, 3, 2]], f"Один столбец — одна строка: [[4, 5, 3, 2]], а вернулось {r}"
    - name: Одна оценка
      code: |
        r = transpose([[5]])
        assert r == [[5]], f"transpose([[5]]) — [[5]], а вернулось {r}"
    - name: Квадратная таблица
      code: |
        r = transpose([[1, 2, 3], [4, 5, 6], [7, 8, 9]])
        assert r == [[1, 4, 7], [2, 5, 8], [3, 6, 9]], f"Ожидалось [[1, 4, 7], [2, 5, 8], [3, 6, 9]], а вернулось {r}"
    - name: Столбцов больше, чем строк
      code: |
        r = transpose([[5, 4, 3, 5, 2], [3, 3, 4, 5, 5]])
        assert r == [[5, 3], [4, 3], [3, 4], [5, 5], [2, 5]], f"Две строки по пять — пять строк по две, а вернулось {r}"
    - name: Таблица не меняется, строки новые
      code: |
        t = [[5, 4], [3, 2]]
        r = transpose(t)
        assert t == [[5, 4], [3, 2]], "transpose не должна менять переданную таблицу"
        assert all(row is not old for row in r for old in t), "Строки результата должны быть новыми списками"
        r[0][0] = 1
        assert t == [[5, 4], [3, 2]], "Изменение результата не должно задевать исходную таблицу"
    - name: Результат собран включением
      code: |
        import dis
        def _ops(f):
            ops, todo = set(), [f.__code__]
            while todo:
                c = todo.pop()
                ops.update(i.opname for i in dis.get_instructions(c))
                todo.extend(k for k in c.co_consts if hasattr(k, "co_code"))
            return ops
        assert "LIST_APPEND" in _ops(transpose), "Соберите таблицу списковым включением [… for …]"
hints:
  - level: 1
    text: 'Сколько строк в новой таблице? Из каких элементов исходной таблицы состоит её первая строка?'
  - level: 2
    text: 'Строка номер `j` новой таблицы — это элемент `j` каждой строки исходной: `[row[j] for row in table]`. Индексы `j` пробегают столько значений, сколько в таблице столбцов.'
  - level: 3
    text: 'Включение может стоять внутри включения: внешнее перебирает номера столбцов, а его выражение — внутреннее включение из подсказки выше.'
