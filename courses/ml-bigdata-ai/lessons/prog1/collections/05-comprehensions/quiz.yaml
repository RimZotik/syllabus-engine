title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: loop-to-comp
  type: single
  q: |
    Какое включение собирает тот же список, что этот цикл?
    ```python
    result = []
    for p in prices:
        if p > 100:
            result.append(p // 2)
    ```
  options:
  - '`[p // 2 for p in prices if p > 100]`'
  - '`[p // 2 if p > 100 else p for p in prices]`'
  - '`[p for p in prices if p // 2 > 100]`'
  - '`[p // 2 if p > 100 for p in prices]`'
  answer: 0
  explain: 'Части цикла переходят во включение по порядку: что дописывали (`p // 2`), откуда брали (`for p in prices`), каких брали (`if p > 100`). Вариант с `if…else` в начале оставит и дешёвые цены, без деления. Вариант с `if p // 2 > 100` отбирает по другому условию и собирает цены без деления. `if` без `else` перед `for` — синтаксическая ошибка: отбор пишут в конце.'
- id: filter-vs-replace
  type: single
  q: |
    Что выведет программа?
    ```python
    temps = [2, -3, 0, -1]
    a = [t for t in temps if t < 0]
    b = [0 if t < 0 else t for t in temps]
    print(len(a), b)
    ```
  options:
  - '`2 [2, 0, 0, 0]`'
  - '`2 [2, 0]`'
  - '`4 [2, 0, 0, 0]`'
  - '`2 [0, -3, 0, -1]`'
  answer: 0
  explain: '`if` после `for` отбирает: в `a` попали только −3 и −1. `if…else` в начале заменяет: отрицательные стали нулями, остальные остались как были, длина та же — четыре.'
- id: retake-marks
  type: multi
  q: '`marks` — список оценок. Нужен список той же длины, где каждая двойка заменена строкой `"пересдача"`, а остальные оценки остались как были. Какие записи это сделают?'
  options:
  - '`["пересдача" if m == 2 else m for m in marks]`'
  - '`[m if m != 2 else "пересдача" for m in marks]`'
  - '`[m for m in marks if m != 2 else "пересдача"]`'
  - '`["пересдача" for m in marks if m == 2]`'
  - '`[m for m in marks if m != 2]`'
  answer:
  - 0
  - 1
  explain: 'Нужна замена: условное выражение стоит в начале, и для каждой оценки получается ровно одно значение — условие можно записать и через `==`, и через `!=`, поменяв местами ветви. `else` после `for` писать нельзя — это `SyntaxError`. `if` после `for` отбирает: `["пересдача" for m in marks if m == 2]` оставит только «пересдачи», а `[m for m in marks if m != 2]` просто выбросит двойки — длина списка изменится.'
- id: names-after
  type: single
  q: |
    Что выведет программа?
    ```python
    x = "старое"
    squares = [x * x for x in range(3)]
    for y in range(3):
        pass
    print(x, y)
    ```
  options:
  - '`старое 2`'
  - '`2 2`'
  - '`старое 3`'
  - 'Ошибку `NameError`: после цикла имени `y` нет'
  answer: 0
  explain: 'Имя `x` внутри включения живёт только пока включение работает и внешнее `x` не трогает. А переменная обычного цикла `for` после цикла остаётся — привязанной к последнему значению, которое выдал `range(3)`: это 2, а не 3.'
- id: last-action
  type: single
  q: |
    Что выведет программа?
    ```python
    log = ["вход Аня", "вход Борис", "выход Аня"]
    last_action = {line.split()[1]: line.split()[0] for line in log}
    print(last_action)
    ```
  options:
  - "`{'Аня': 'выход', 'Борис': 'вход'}`"
  - "`{'Аня': 'вход', 'Борис': 'вход'}`"
  - "`{'Аня': ['вход', 'выход'], 'Борис': ['вход']}`"
  - "`{'вход': 'Борис', 'выход': 'Аня'}`"
  answer: 0
  explain: 'Ключ — имя (второе слово строки), значение — действие (первое слово). Аня встречается дважды, и второе присваивание по тому же ключу заменяет значение: остаётся последнее действие, «выход». Первое значение сохранилось бы, только если бы ключи не перезаписывались, а список действий включение само не собирает — для этого нужна группировка.'
- id: braces-three-ways
  type: single
  q: |
    Что выведет программа?
    ```python
    words = ["Да", "да", "Нет"]
    a = {w.lower() for w in words}
    b = {w: len(w) for w in words}
    c = set(w.lower() for w in words)
    print(len(a), len(b), len(c))
    ```
  options:
  - '`2 3 2`'
  - '`3 3 3`'
  - '`2 2 2`'
  - 'Ошибку: внутри `set(...)` нужны квадратные скобки'
  answer: 0
  explain: 'Фигурные скобки без двоеточия собирают множество: «Да» и «да» после `lower()` совпали, осталось два слова. С двоеточием получается словарь, а его ключи — исходные слова, «Да» и «да» среди них разные, поэтому пар три. `set(...)` с генераторным выражением строит то же множество, что `a`: квадратные скобки, когда выражение — единственный аргумент функции, не нужны. `3 3 3` вышло бы, если бы `lower()` не влиял на повторы, `2 2 2` — если бы словарь тоже приводил ключи к нижнему регистру.'
- id: all-orders
  type: multi
  q: '`orders` — суммы заказов. Какие выражения отвечают на вопрос «все ли заказы не меньше 500»?'
  options:
  - '`all(o >= 500 for o in orders)`'
  - '`not any(o < 500 for o in orders)`'
  - '`any(o >= 500 for o in orders)`'
  - '`[o >= 500 for o in orders]`'
  answer:
  - 0
  - 1
  explain: '«Все не меньше 500» — то же, что «нет ни одного меньше 500». `any(o >= 500 ...)` спрашивает, есть ли хотя бы один такой заказ. Список из `True` и `False` ничего не проверяет: непустой список в условии всегда истинен.'
- id: any-stops
  type: single
  q: |
    Что выведет программа?
    ```python
    def positive(x):
        print("проверка", x)
        return x > 0

    print(any(positive(x) for x in [-1, 5, 7]))
    ```
  options:
  - '`проверка -1`, `проверка 5`, `True` — каждое в своей строке'
  - '`проверка -1`, `проверка 5`, `проверка 7`, `True` — каждое в своей строке'
  - 'Только `True`'
  - '`проверка -1`, `False` — каждое в своей строке'
  answer: 0
  explain: 'Генераторное выражение выдаёт значения по одному, и `any` останавливается на первом истинном: после 5 ответ уже известен, и 7 никто не проверяет. Только `True` вышло бы, если бы `any` не вызывал функцию для элементов. А ложное значение `any` не останавливает: на −1 ответ ещё неизвестен, и он смотрит дальше.'
- id: loop-better-code
  type: multi
  q: 'Коллега переписал программу, и теперь в ней всё — включения. `orders` — суммы заказов, `rows` — словари с ключом `"city"`. Какие строки стоит вернуть к обычному циклу?'
  options:
  - '`[cart.append(x) for x in extra]`'
  - '`first_big = [o for o in orders if o > 10000][0]`'
  - '`total = sum([p * c for p, c in zip(prices, counts)])`'
  - '`names = [n.strip().lower() for n in raw if n.strip()]`'
  - '`cities = {r["city"] for r in rows}`'
  answer:
  - 0
  - 1
  explain: 'Включение отвечает на вопрос «какую новую коллекцию получить». Строка с `cart.append` нужна ради побочного эффекта — изменить `cart`, а попутно собирает никому не нужный список из `None`: честнее цикл. Поиск первого большого заказа проходит все заказы, хотя нужен один, и падает с `IndexError`, если таких нет; цикл с `break` остановится на первом найденном. Сумма, очищенные имена и множество городов — новые значения, и каждое читается одной фразой: включение здесь уместно, даже если строка длинная.'
- id: two-for-order
  type: single
  q: |
    Что выведет программа?
    ```python
    pairs = [(a, b) for a in "АБ" for b in "12"]
    print(pairs)
    ```
  options:
  - "`[('А', '1'), ('А', '2'), ('Б', '1'), ('Б', '2')]`"
  - "`[('А', '1'), ('Б', '1'), ('А', '2'), ('Б', '2')]`"
  - "`[('А', '1'), ('Б', '2')]`"
  - "`[('А', 'Б'), ('1', '2')]`"
  answer: 0
  explain: 'Несколько `for` идут как вложенные циклы, внешний — первым: для «А» перебираются обе цифры, потом для «Б». Попарно, как `zip`, включение элементы не сцепляет.'
- id: open-comp-or-loop
  type: open
  q: Включение и цикл с `append` часто собирают один и тот же список. Для чего предназначено включение и в каких случаях вы всё-таки напишете обычный цикл?
  rubric:
  - включение — чтобы получить новую коллекцию (список, словарь, множество) из элементов другой; его выбирают ради читаемости, пока запись читается одной фразой
  - обычный цикл — когда цель не новая коллекция, а действие (печать, изменение другого списка), или когда логика не умещается в одну фразу (несколько действий, вложенные условия, остановка на первом найденном); достаточно одного верного случая с объяснением
  wrong_answers:
  - включение всегда работает заметно быстрее, поэтому цикл не нужен
  - включение нельзя писать с условием, для отбора нужен цикл
  - цикл нужен, когда результат — словарь или множество
  followups:
  - Почему `[print(x) for x in names]` — неудачная запись, хотя имена напечатаются?
