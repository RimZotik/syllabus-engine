title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: filter-vs-replace
  type: single
  q: |
    Что выведет программа?
    ```python
    temps = [2, -3, 0, -1]
    a = [t for t in temps if t < 0]
    b = [0 if t < 0 else t for t in temps]
    print(len(a), b)
    ```
  options:
  - '`2 [2, 0, 0, 0]`'
  - '`2 [2, 0]`'
  - '`4 [2, 0, 0, 0]`'
  - '`2 [0, -3, 0, -1]`'
  answer: 0
  explain: '`if` после `for` отбирает: в `a` попали только −3 и −1. `if…else` в начале заменяет: отрицательные стали нулями, остальные остались как были, длина та же — четыре.'
- id: names-after
  type: single
  q: |
    Что выведет программа?
    ```python
    x = "старое"
    squares = [x * x for x in range(3)]
    for y in range(3):
        pass
    print(x, y)
    ```
  options:
  - '`старое 2`'
  - '`2 2`'
  - '`старое 3`'
  - 'Ошибку `NameError`: после цикла имени `y` нет'
  answer: 0
  explain: 'Имя `x` внутри включения живёт только пока включение работает и внешнее `x` не трогает. А переменная обычного цикла `for` после цикла остаётся — привязанной к последнему значению, которое выдал `range(3)`: это 2, а не 3.'
- id: last-action
  type: single
  q: |
    Что выведет программа?
    ```python
    log = ["вход Аня", "вход Борис", "выход Аня"]
    last_action = {line.split()[1]: line.split()[0] for line in log}
    print(last_action)
    ```
  options:
  - "`{'Аня': 'выход', 'Борис': 'вход'}`"
  - "`{'Аня': 'вход', 'Борис': 'вход'}`"
  - "`{'Аня': ['вход', 'выход'], 'Борис': ['вход']}`"
  - "`{'вход': 'Борис', 'выход': 'Аня'}`"
  answer: 0
  explain: 'Ключ — имя (второе слово строки), значение — действие (первое слово). Аня встречается дважды, и второе присваивание по тому же ключу заменяет значение: остаётся последнее действие, «выход». Первое значение сохранилось бы, только если бы ключи не перезаписывались, а список действий включение само не собирает — для этого нужна группировка.'
- id: braces-three-ways
  type: single
  q: |
    Что выведет программа?
    ```python
    words = ["Да", "да", "Нет"]
    a = {w.lower() for w in words}
    b = {w: len(w) for w in words}
    c = set(w.lower() for w in words)
    print(len(a), len(b), len(c))
    ```
  options:
  - '`2 3 2`'
  - '`3 3 3`'
  - '`2 2 2`'
  - 'Ошибку: внутри `set(...)` нужны квадратные скобки'
  answer: 0
  explain: 'Фигурные скобки без двоеточия собирают множество: «Да» и «да» после `lower()` совпали, осталось два слова. С двоеточием получается словарь, а его ключи — исходные слова, «Да» и «да» среди них разные, поэтому пар три. `set(...)` с генераторным выражением строит то же множество, что `a`: квадратные скобки, когда выражение — единственный аргумент функции, не нужны. `3 3 3` вышло бы, если бы `lower()` не влиял на повторы, `2 2 2` — если бы словарь тоже приводил ключи к нижнему регистру.'
- id: any-stops
  type: single
  q: |
    Что выведет программа?
    ```python
    def positive(x):
        print("проверка", x)
        return x > 0

    print(any(positive(x) for x in [-1, 5, 7]))
    ```
  options:
  - '`проверка -1`, `проверка 5`, `True` — каждое в своей строке'
  - '`проверка -1`, `проверка 5`, `проверка 7`, `True` — каждое в своей строке'
  - 'Только `True`'
  - '`проверка -1`, `False` — каждое в своей строке'
  answer: 0
  explain: 'Генераторное выражение выдаёт значения по одному, и `any` останавливается на первом истинном: после 5 ответ уже известен, и 7 никто не проверяет. Только `True` вышло бы, если бы `any` не вызывал функцию для элементов. А ложное значение `any` не останавливает: на −1 ответ ещё неизвестен, и он смотрит дальше.'
- id: loop-better-code
  type: multi
  q: 'Коллега переписал программу, и теперь в ней всё — включения. `orders` — суммы заказов, `rows` — словари с ключом `"city"`. Какие строки стоит вернуть к обычному циклу?'
  options:
  - '`[cart.append(x) for x in extra]`'
  - '`report = [o * 2 if o > 0 else (0 if o == 0 else -o) for row in table for o in row if o != 5]`'
  - '`total = sum([p * c for p, c in zip(prices, counts)])`'
  - '`names = [n.strip().lower() for n in raw if n.strip()]`'
  - '`cities = {r["city"] for r in rows}`'
  answer:
  - 0
  - 1
  explain: 'Включение отвечает на вопрос «какую новую коллекцию получить». Строка с `cart.append` нужна ради побочного эффекта — изменить `cart`, а попутно собирает никому не нужный список из `None`: честнее цикл. Строку с `report` одной фразой не прочитать: два `for`, отбор и вложенное условное выражение — в цикле каждое действие встанет на свою строку. Сумма, очищенные имена и множество городов — новые значения, и каждое читается одной фразой: включение здесь уместно, даже если строка длинная.'
- id: k5-complete-seconds
  type: code
  q: |
    `minutes` — длительности упражнений в минутах. **Замените `...` списковым включением: функция `to_seconds(minutes)` возвращает новый список тех же длительностей в секундах.**
    ```call
    to_seconds([3, 5, 2])
    ```
    ```return
    [180, 300, 120]
    ```

    Ограничения: `append` не используйте.
  starter: |
    def to_seconds(minutes):
        seconds = ...
        return seconds
  solution: |
    def to_seconds(minutes):
        seconds = [m * 60 for m in minutes]
        return seconds
  tests:
    forbid: [append]
    function: to_seconds
    no_mutate: true
    calls:
    - name: Три упражнения
      args: [[3, 5, 2]]
      expect: [180, 300, 120]
    - name: Одно упражнение
      args: [[10]]
      expect: [600]
      hidden: true
    - name: С перерывом в ноль минут
      args: [[1, 0, 15]]
      expect: [60, 0, 900]
      hidden: true
    - name: Пустой список
      args: [[]]
      expect: []
      hidden: true
  explain: |
    Включение читается по порядку: что положить (`m * 60`), откуда брать (`for m in minutes`). Каждая длительность даёт ровно одно значение, поэтому длина списка та же.
- id: k5-fix-filter-syntax
  type: code
  q: |
    **Исправьте `passed(marks)`, оставив включение: вернуть оценки не ниже 3, в прежнем порядке.** Сейчас Python не может её прочитать: `SyntaxError`.
    ```call
    passed([5, 2, 3, 2, 4])
    ```
    ```return
    [5, 3, 4]
    ```
  starter: |
    def passed(marks):
        return [m if m >= 3 for m in marks]
  solution: |
    def passed(marks):
        return [m for m in marks if m >= 3]
  tests:
    asserts:
    - name: Есть двойки
      code: |
        r = passed([5, 2, 3, 2, 4])
        assert r == [5, 3, 4], "passed([5, 2, 3, 2, 4]) должна вернуть [5, 3, 4], а вернула " + repr(r)
    - name: Все сдали
      code: |
        r = passed([3, 4])
        assert r == [3, 4], "passed([3, 4]) должна вернуть [3, 4], а вернула " + repr(r)
    - name: Никто не сдал
      code: |
        r = passed([2, 1])
        assert r == [], "passed([2, 1]) должна вернуть [], а вернула " + repr(r)
  explain: |
    Отбор — `if` после `for`, в конце включения. В начале может стоять только условное выражение с `else` — оно заменяет, а не отбирает, и длина списка тогда не меняется.
- id: k5-fix-retake
  type: code
  q: |
    **Исправьте `journal_view(marks)`, оставив включение: вернуть список той же длины, где каждая двойка заменена строкой `"пересдача"`.** Сейчас она возвращает только «пересдачи».
    ```call
    journal_view([5, 2, 4])
    ```
    ```return
    [5, 'пересдача', 4]
    ```
  starter: |
    def journal_view(marks):
        return ["пересдача" for m in marks if m == 2]
  solution: |
    def journal_view(marks):
        return ["пересдача" if m == 2 else m for m in marks]
  tests:
    function: journal_view
    calls:
    - name: Одна двойка
      args: [[5, 2, 4]]
      expect: [5, "пересдача", 4]
    - name: Двоек нет
      args: [[3, 4]]
      expect: [3, 4]
    - name: Все двойки
      args: [[2, 2]]
      expect: ["пересдача", "пересдача"]
    - name: Пустой журнал
      args: [[]]
      expect: []
  explain: |
    `if` в конце отбирает элементы, поэтому остальные оценки пропали. Замена — условное выражение в начале: `"пересдача" if m == 2 else m`. Для каждой оценки получается ровно одно значение.
- id: k5-write-week-check
  type: code
  q: |
    **Напишите `week_check(temps)`: вернуть два значения — все ли дни были выше нуля и была ли хоть раз жара, больше 30 градусов.**
    ```call
    week_check([25, 31, 28])
    ```
    ```return
    (True, True)
    ```
    Используйте `all` и `any`, без отдельных списков.
  starter: |
    def week_check(temps):
        warm = True
        hot = False
        return warm, hot
  solution: |
    def week_check(temps):
        return all(t > 0 for t in temps), any(t > 30 for t in temps)
  tests:
    function: week_check
    calls:
    - name: Тёплая неделя с жарой
      args: [[25, 31, 28]]
      expect_py: "(True, True)"
    - name: Был мороз
      args: [[5, -2, 10]]
      expect_py: "(False, False)"
    - name: Ровно ноль и ровно 30
      args: [[0, 30, 12]]
      expect_py: "(False, False)"
    - name: Мороз и жара в одну неделю
      args: [[-1, 35]]
      expect_py: "(False, True)"
    - name: Ровно один градус
      args: [[1, 2]]
      expect_py: "(True, False)"
      hidden: true
  explain: |
    «Все» — `all`, «хоть один» — `any`, и обоим достаточно генераторного выражения без квадратных скобок. Граница важна: `t > 0` для нуля ложно, `t > 30` для тридцати — тоже.
- id: k5-write-stock-left
  type: code
  q: |
    `stock` — сколько товара было на складе, `sold` — сколько продали; проданы могли быть не все товары. **Напишите `left(stock, sold)` одной строкой со словарным включением: вернуть новый словарь «товар → сколько осталось» для всех товаров склада.**
    ```call
    left({"хлеб": 10, "сыр": 4}, {"хлеб": 3})
    ```
    ```return
    {'хлеб': 7, 'сыр': 4}
    ```
    Склад не меняется.
  starter: |
    def left(stock, sold):
        return {item: stock[item] - sold[item] for item in stock}
  solution: |
    def left(stock, sold):
        return {item: stock[item] - sold.get(item, 0) for item in stock}
  tests:
    function: left
    no_mutate: true
    calls:
    - name: Пример из условия
      args: [{"хлеб": 10, "сыр": 4}, {"хлеб": 3}]
      expect: {"хлеб": 7, "сыр": 4}
    - name: Часть товаров продана
      args: [{"хлеб": 10, "сыр": 4, "чай": 7}, {"хлеб": 3, "чай": 7}]
      expect: {"хлеб": 7, "сыр": 4, "чай": 0}
    - name: Ничего не продано
      args: [{"мёд": 2}, {}]
      expect: {"мёд": 2}
    - name: Склад не меняется
      args: [{"хлеб": 5}, {"хлеб": 1}]
      expect: {"хлеб": 4}
    - name: Пустой склад
      args: [{}, {"хлеб": 1}]
      expect: {}
  explain: |
    Ключи берутся из склада, значение — разность. Товара, который не продавали, в `sold` нет, и `sold[item]` дал бы `KeyError`; `sold.get(item, 0)` считает его продажи нулём. Включение собирает новый словарь, склад не меняется.
- id: k5-write-all-tags
  type: code
  q: |
    Посты блога — список словарей, у каждого ключ `"tags"` со списком меток. **Напишите `all_tags(posts)` одной строкой `return …`: вернуть отсортированный список всех разных меток строчными буквами.**
    ```call
    all_tags([{"tags": ["Python", "учёба"]}, {"tags": ["python", "SQL"]}])
    ```
    ```return
    ['python', 'sql', 'учёба']
    ```
  starter: |
    def all_tags(posts):
        return sorted([p["tags"] for p in posts])
  solution: |
    def all_tags(posts):
        return sorted({t.lower() for p in posts for t in p["tags"]})
  tests:
    function: all_tags
    calls:
    - name: Пример из условия
      args: [[{"tags": ["Python", "учёба"]}, {"tags": ["python", "SQL"]}]]
      expect: ["python", "sql", "учёба"]
    - name: Повторы и регистр
      args: [[{"tags": ["Python", "учёба"]}, {"tags": ["python", "SQL"]}, {"tags": []}]]
      expect: ["python", "sql", "учёба"]
    - name: Один пост
      args: [[{"tags": ["Кот", "кот", "КОТ"]}]]
      expect: ["кот"]
    - name: Нет постов
      args: [[]]
      expect: []
  explain: |
    Два `for` идут как вложенные циклы: для каждого поста — для каждой его метки. Фигурные скобки без двоеточия собирают множество, и оно убирает повторы, которые после `lower()` совпали. `sorted` превращает множество в упорядоченный список.
- id: k5-change-first-over
  type: code
  q: |
    Функция ищет первый крупный заказ включением: падает с `IndexError`, когда таких нет, и проверяет все заказы. **Перепишите её обычным циклом: вернуть первый заказ больше `limit` и сразу остановиться; если такого нет — `None`.**
    ```call
    first_over([500, 12000, 300, 15000], 10000)
    ```
    ```return
    12000
    ```
    Заказы после найденного функция не смотрит.
  starter: |
    def first_over(orders, limit):
        return [o for o in orders if o > limit][0]
  solution: |
    def first_over(orders, limit):
        for o in orders:
            if o > limit:
                return o
        return None
  tests:
    function: first_over
    calls:
    - name: Крупный заказ в середине
      args: [[500, 12000, 300, 15000], 10000]
      expect: 12000
    - name: Крупных нет
      args: [[500, 300], 10000]
      expect: null
    - name: Пустой список
      args: [[], 100]
      expect: null
    - name: Ровно лимит — не крупный
      args: [[10000, 12000], 10000]
      expect: 12000
      hidden: true
    asserts:
    - name: Останавливается на первом
      code: |
        try:
            r = first_over([200, "сумма не указана"], 100)
        except TypeError:
            r = "ошибку: функция сравнивала и заказы после найденного"
        assert r == 200, "Функция должна вернуть 200 и не смотреть на следующие заказы, а вернула " + repr(r)
  explain: |
    Включение всегда проходит последовательность до конца и не умеет остановиться на первом найденном. Цикл с `return` внутри выходит, как только заказ найден, а `return None` после цикла срабатывает, только если подходящего не нашлось.
