id: p1k-ai-shopping-list
title: ИИ-ассистент собирает список покупок
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте `shopping_list(recipes)`: вернуть общий список продуктов всех рецептов — каждый продукт один раз, в порядке, в каком он впервые встретился.**

  Рецепт — список продуктов, `recipes` — список рецептов; их функция не меняет. Код в редакторе написал ИИ-ассистент: повторов в ответе нет, но продукты идут в порядке множества, а множество порядка не хранит — удачный запуск ничего не доказывает.

  Пример 1
  ```input
  shopping_list([["мука", "яйца", "молоко"], ["яйца", "сыр"], ["молоко", "мука", "чай"]])
  ```
  ```output
  ['мука', 'яйца', 'молоко', 'сыр', 'чай']
  ```
starter: |
  # Решение от ИИ-ассистента
  def shopping_list(recipes):
      all_items = []
      for recipe in recipes:
          all_items += recipe
      return list(set(all_items))


  recipes = [["мука", "яйца", "молоко"], ["яйца", "сыр"], ["молоко", "мука", "чай"]]
  print(shopping_list(recipes))
solution: |
  def shopping_list(recipes):
      seen = set()
      result = []
      for recipe in recipes:
          for item in recipe:
              if item not in seen:
                  seen.add(item)
                  result.append(item)
      return result


  recipes = [["мука", "яйца", "молоко"], ["яйца", "сыр"], ["молоко", "мука", "чай"]]
  print(shopping_list(recipes))
tests:
  asserts:
    - name: Пример из условия
      code: |
        r = shopping_list([["мука", "яйца", "молоко"], ["яйца", "сыр"], ["молоко", "мука", "чай"]])
        assert r == ["мука", "яйца", "молоко", "сыр", "чай"], f"Ожидался ['мука', 'яйца', 'молоко', 'сыр', 'чай'], получено {r}"
    - name: Порядок первого появления
      code: |
        r = shopping_list([["соль", "рис", "лук", "морковь", "масло", "перец"], ["перец", "лук", "чеснок"]])
        assert r == ["соль", "рис", "лук", "морковь", "масло", "перец", "чеснок"], f"Порядок должен быть как при первом появлении, получено {r}"
    - name: Повторы внутри одного рецепта
      code: |
        r = shopping_list([["яблоко", "яблоко", "груша", "яблоко"]])
        assert r == ["яблоко", "груша"], f"Ожидался ['яблоко', 'груша'], получено {r}"
    - name: Нет рецептов и пустой рецепт
      code: |
        assert shopping_list([]) == [] and shopping_list([[], ["чай"]]) == ["чай"], "Без рецептов — пустой список; пустой рецепт ничего не добавляет"
    - name: Рецепты не меняются
      code: |
        rec = [["мука", "яйца"], ["яйца", "сыр"]]
        shopping_list(rec)
        assert rec == [["мука", "яйца"], ["яйца", "сыр"]], "Функция не должна менять списки рецептов"
hints:
  - level: 1
    text: 'Что `set` делает с порядком элементов? Если вывод выглядит правильно, доказывает ли это что-нибудь? Что из двух — список или множество — помнит порядок, а что быстро отвечает «уже было?»'
  - level: 2
    text: 'Порядок пусть хранит список-результат, а проверку «уже было?» — множество. Перебирайте рецепты и продукты в них двумя циклами и дописывайте продукт, только если его ещё не встречали.'
  - level: 3
    text: 'Заведите пустое множество «уже видели» и пустой список-результат. Продукт, которого ещё нет во множестве, добавьте и туда, и туда.'
