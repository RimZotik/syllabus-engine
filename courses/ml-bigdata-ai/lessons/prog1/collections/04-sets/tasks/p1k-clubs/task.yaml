id: p1k-clubs
title: Шахматы и футбол
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите `clubs(chess, football)`: сравнить составы двух кружков — кто ходит в оба, кто только в один и сколько всего разных детей.**

  `chess` и `football` — списки имён детей в шахматном и футбольном кружке; имя может повторяться, список может быть пустым. Функция возвращает четыре значения: множество тех, кто ходит в оба кружка, множество тех, кто ходит только в шахматы, множество тех, кто ходит только в футбол, и число разных детей, которые ходят хотя бы в один кружок. Списки функция не меняет.

  Пример 1
  ```call
  clubs(["Аня", "Борис", "Вера", "Глеб", "Аня"], ["Борис", "Глеб", "Дима"])
  ```
  ```return
  ({'Борис', 'Глеб'}, {'Аня', 'Вера'}, {'Дима'}, 5)
  ```

  Пример 2
  ```call
  clubs(["Аня", "Вера"], ["Дима"])
  ```
  ```return
  (set(), {'Аня', 'Вера'}, {'Дима'}, 3)
  ```

  Множество выводится в случайном порядке — проверка сравнивает множества, а не их запись.
starter: |
  def clubs(chess, football):
      # План:
      # 1. Сделать из каждого списка множество имён
      # 2. Найти пересечение, две разности и объединение
      # 3. Вернуть три множества и число детей
      return set(), set(), set(), 0
solution: |
  def clubs(chess, football):
      chess = set(chess)
      football = set(football)
      return chess & football, chess - football, football - chess, len(chess | football)
tests:
  function: clubs
  no_mutate: true
  calls:
    - name: Пример 1
      args: [["Аня", "Борис", "Вера", "Глеб", "Аня"], ["Борис", "Глеб", "Дима"]]
      expect_py: "({'Борис', 'Глеб'}, {'Аня', 'Вера'}, {'Дима'}, 5)"
    - name: Пример 2
      args: [["Аня", "Вера"], ["Дима"]]
      expect_py: "(set(), {'Аня', 'Вера'}, {'Дима'}, 3)"
    - name: В футбол никто не записан
      args: [["Вера", "Аня", "Вера"], []]
      expect_py: "(set(), {'Аня', 'Вера'}, set(), 2)"
      hidden: true
    - name: Одинаковые составы
      args: [["Глеб", "Аня"], ["Аня", "Глеб", "Глеб"]]
      expect_py: "({'Аня', 'Глеб'}, set(), set(), 2)"
      hidden: true
    - name: Много имён
      args: [["Яна", "Ира", "Глеб", "Борис", "Аня", "Олег"], ["Яна", "Дима", "Ира", "Аня", "Юля", "Егор"]]
      expect_py: "({'Аня', 'Ира', 'Яна'}, {'Борис', 'Глеб', 'Олег'}, {'Дима', 'Егор', 'Юля'}, 9)"
      hidden: true
    - name: Оба кружка пустые
      args: [[], []]
      expect_py: "(set(), set(), set(), 0)"
      hidden: true
hints:
  - level: 1
    text: 'Повторы и порядок здесь не нужны, зато нужны «в обоих», «только в одном» и «хотя бы в одном». Какой тип коллекции умеет это одной операцией?'
  - level: 2
    text: '`set(chess)` — множество имён списка; пустой список даст пустое множество. Пересечение `&`, разность `-`, объединение `|`. Чтобы увидеть, что происходит внутри, добавьте `print` — он не влияет на проверку.'
  - level: 3
    text: 'Четыре значения возвращают через запятую в одном `return`. Число детей — длина объединения, а не сумма длин списков.'
