id: p1k-clubs
title: Шахматы и футбол
sandbox: python-browser
difficulty: 2
statement: |
  В школе два кружка. В первой строке ввода — имена детей, записанных в шахматы, во второй — в футбол, через пробел. Списки вели небрежно: одно имя в строке может повторяться, а строка может оказаться пустой, если в кружок пока никто не записался.

  Выведите четыре строки:

  - `Оба кружка: ...` — кто ходит и в шахматы, и в футбол;
  - `Только шахматы: ...`;
  - `Только футбол: ...`;
  - `Всего детей: N` — сколько разных детей ходит хотя бы в один кружок.

  Имена в первых трёх строках — по алфавиту, через запятую с пробелом; если никого нет, вместо имён — `нет`.

  ```input
  Аня Борис Вера Глеб Аня
  Борис Глеб Дима
  ```
  ```
  Оба кружка: Борис, Глеб
  Только шахматы: Аня, Вера
  Только футбол: Дима
  Всего детей: 5
  ```
starter: |
  # План:
  # 1. Прочитать две строки и сделать из каждой множество имён
  # 2. Найти пересечение, две разности и объединение
  # 3. Вывести три строки с именами по алфавиту (или «нет») и число детей
stdin: "Аня Борис Вера Глеб Аня\nБорис Глеб Дима\n"
solution: |
  def names_line(names):
      if not names:
          return "нет"
      return ", ".join(sorted(names))


  chess = set(input().split())
  football = set(input().split())
  print("Оба кружка:", names_line(chess & football))
  print("Только шахматы:", names_line(chess - football))
  print("Только футбол:", names_line(football - chess))
  print("Всего детей:", len(chess | football))
tests:
  io:
    - name: Пример из условия
      stdin: "Аня Борис Вера Глеб Аня\nБорис Глеб Дима\n"
      stdout: "Оба кружка: Борис, Глеб\nТолько шахматы: Аня, Вера\nТолько футбол: Дима\nВсего детей: 5"
    - name: Общих нет
      stdin: "Аня Вера\nДима\n"
      stdout: "Оба кружка: нет\nТолько шахматы: Аня, Вера\nТолько футбол: Дима\nВсего детей: 3"
      hidden: true
    - name: В футбол никто не записан
      stdin: "Вера Аня Вера\n\n"
      stdout: "Оба кружка: нет\nТолько шахматы: Аня, Вера\nТолько футбол: нет\nВсего детей: 2"
      hidden: true
    - name: Одинаковые составы
      stdin: "Глеб Аня\nАня Глеб Глеб\n"
      stdout: "Оба кружка: Аня, Глеб\nТолько шахматы: нет\nТолько футбол: нет\nВсего детей: 2"
      hidden: true
    - name: Много имён не по алфавиту
      stdin: "Яна Ира Глеб Борис Аня Олег\nЯна Дима Ира Аня Юля Егор\n"
      stdout: "Оба кружка: Аня, Ира, Яна\nТолько шахматы: Борис, Глеб, Олег\nТолько футбол: Дима, Егор, Юля\nВсего детей: 9"
      hidden: true
    - name: Оба кружка пустые
      stdin: "\n\n"
      stdout: "Оба кружка: нет\nТолько шахматы: нет\nТолько футбол: нет\nВсего детей: 0"
      hidden: true
hints:
  - level: 1
    text: 'Повторы и порядок здесь не нужны, зато нужны «в обоих», «только в одном» и «хотя бы в одном». Какой тип коллекции умеет это одной операцией?'
  - level: 2
    text: '`set(input().split())` — множество имён строки; пустая строка даст пустое множество. Пересечение `&`, разность `-`, объединение `|`. Порядок для вывода даёт `sorted`, а строку из имён собирает `", ".join(...)`. Одинаковое оформление трёх строк удобно вынести в функцию.'
  - level: 3
    text: 'Функция `names_line(names)`: если множество пустое — `"нет"`, иначе `", ".join(sorted(names))`. Выводы: `names_line(chess & football)`, `names_line(chess - football)`, `names_line(football - chess)`, `len(chess | football)`.'
