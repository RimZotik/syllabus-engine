title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: distinct-visitors
  type: single
  q: |
    Что выведет программа?
    ```python
    visits = ["Аня", "аня", "Борис", "Аня", "Борис "]
    print(len(visits), len(set(visits)))
    ```
  options:
  - '`5 4`'
  - '`5 2`'
  - '`5 3`'
  - '`4 4`'
  answer: 0
  explain: 'Множество отбрасывает только равные значения. «Аня» и «аня» — разные строки (регистр различается), «Борис» и «Борис » тоже (пробел в конце). Повторяется лишь «Аня», поэтому разных значений четыре. Чтобы считать их одним человеком, строки сначала приводят к одному виду — например, `lower()` и `strip()`.'
- id: set-methods-run
  type: multi
  q: '`s = {1, 2}`. Какие строки кода выполнятся без ошибки?'
  options:
  - '`s.add(2)`'
  - '`s.discard(5)`'
  - '`print(s == {2, 1, 1})`'
  - '`s.remove(5)`'
  - '`print(s[0])`'
  answer:
  - 0
  - 1
  - 2
  explain: 'Добавить элемент, который уже есть, можно — ничего не изменится. `discard` убирает молча, даже если элемента нет, а `remove` на отсутствующем элементе даёт `KeyError`. Сравнение множеств не зависит от порядка и повторов в записи. Индексов у множества нет — `TypeError`.'
  traps:
  - 3
- id: other-order
  type: multi
  q: 'Программа печатает `print(set(names))`. У вас при каждом запуске порядок имён одинаковый, а коллега запустил ту же программу с теми же данными и получил другой порядок. Что из этого верно?'
  options:
  - 'Обе программы отработали правильно: любой порядок вывода множества допустим'
  - 'Одинаковый у всех вывод даст `print(sorted(set(names)))`'
  - 'У коллеги другая версия Python: на одной версии порядок множества всегда один'
  - 'Порядок станет одинаковым у всех, если добавлять имена в множество по одному через `add`'
  answer:
  - 0
  - 1
  explain: 'Множество порядка не хранит, и язык не обещает никакого порядка вывода — ни на одной версии, ни при добавлении через `add`. То, что у вас он повторяется, — случайность, на которую нельзя опираться. Одинаковый у всех результат даёт только упорядоченный список — `sorted`.'
- id: exactly-one-month
  type: multi
  q: 'Записавшиеся на курсы в июне — множество `june`, в июле — `july`. Какие выражения дают тех, кто записывался ровно в одном из этих месяцев?'
  options:
  - '`june ^ july`'
  - '`(june | july) - (june & july)`'
  - '`(june - july) | (july - june)`'
  - '`june - july`'
  - '`june | july`'
  answer:
  - 0
  - 1
  - 2
  explain: 'Симметрическая разность — это и есть «ровно в одном». То же получится, если из всех записавшихся убрать тех, кто был в оба месяца, или объединить «только июнь» и «только июль». `june - july` — только июньские, `june | july` — все вместе.'
- id: ops-predict
  type: single
  q: |
    Что выведет программа?
    ```python
    a = {"чай", "сок", "кофе"}
    b = {"сок", "вода"}
    print(sorted(a - b), len(a | b))
    ```
  options:
  - "`['кофе', 'чай'] 4`"
  - "`['вода', 'кофе', 'чай'] 4`"
  - "`['кофе', 'чай'] 5`"
  - "`['вода'] 4`"
  answer: 0
  explain: '`a - b` — элементы `a`, которых нет в `b`: кофе и чай. В объединении «сок» один, повторы отбрасываются, поэтому элементов четыре. Тройка с «водой» — это `a ^ b`, а «вода» одна — это `b - a`.'
- id: k4-complete-distinct
  type: code
  q: |
    `cars` — номера машин, проехавших через шлагбаум; одна машина могла проехать несколько раз. **Замените `...`: функция `distinct_cars(cars)` возвращает, сколько было разных машин.**
    ```call
    distinct_cars(["А111", "В222", "А111", "С333"])
    ```
    ```return
    3
    ```
  starter: |
    def distinct_cars(cars):
        return ...
  solution: |
    def distinct_cars(cars):
        return len(set(cars))
  tests:
    function: distinct_cars
    calls:
    - name: Пример из условия
      args: [["А111", "В222", "А111", "С333"]]
      expect: 3
    - name: С повторами
      args: [["А111", "В222", "А111", "С333", "В222", "А111"]]
      expect: 3
      hidden: true
    - name: Все разные
      args: [["А111", "В222", "С333", "Е444"]]
      expect: 4
      hidden: true
    - name: Одна машина много раз
      args: [["К777", "К777", "К777"]]
      expect: 1
      hidden: true
  explain: |
    Множество хранит каждое значение один раз, поэтому `len(set(cars))` — число разных номеров. `len(cars)` посчитал бы проезды, а не машины.
- id: k4-fix-discard
  type: code
  q: |
    **Исправьте `unsubscribe(subs, email)`: убрать адрес из множества подписчиков, а если адреса нет — ничего не делать.** Сейчас в этом случае она падает с `KeyError`.
    ```python
    subs = {"a@mail.ru", "b@mail.ru"}
    unsubscribe(subs, "b@mail.ru")
    unsubscribe(subs, "z@mail.ru")
    subs
    ```
    ```output
    {'a@mail.ru'}
    ```
  starter: |
    def unsubscribe(subs, email):
        subs.remove(email)
  solution: |
    def unsubscribe(subs, email):
        subs.discard(email)
  tests:
    asserts:
    - name: Адрес есть
      code: |
        subs = {"a@mail.ru", "b@mail.ru"}
        unsubscribe(subs, "a@mail.ru")
        assert subs == {"b@mail.ru"}, "Должен остаться {'b@mail.ru'}, а осталось " + repr(subs)
    - name: Адреса нет
      code: |
        subs = {"a@mail.ru"}
        unsubscribe(subs, "z@mail.ru")
        assert subs == {"a@mail.ru"}, "Множество не должно измениться, а стало " + repr(subs)
    - name: Пустая рассылка
      code: |
        subs = set()
        unsubscribe(subs, "a@mail.ru")
        assert subs == set(), "Пустое множество должно остаться пустым, а стало " + repr(subs)
  explain: |
    `remove` на отсутствующем элементе даёт `KeyError`, а `discard` убирает молча. Можно и с проверкой: `if email in subs: subs.remove(email)`.
- id: k4-write-can-cook
  type: code
  q: |
    **Напишите `can_cook(recipe, fridge)`: вернуть `True`, если в холодильнике есть все продукты рецепта, иначе `False`.**
    ```call
    can_cook(["мука", "яйца", "яйца"], ["яйца", "сыр", "мука"])
    ```
    ```return
    True
    ```
    Оба аргумента — списки, в них бывают повторы; количество не важно.
  starter: |
    def can_cook(recipe, fridge):
        return recipe == fridge
  solution: |
    def can_cook(recipe, fridge):
        return set(recipe) <= set(fridge)
  tests:
    function: can_cook
    calls:
    - name: Пример из условия
      args: [["мука", "яйца", "яйца"], ["яйца", "сыр", "мука"]]
      expect: true
    - name: Всё есть
      args: [["мука", "яйца", "молоко"], ["молоко", "сыр", "яйца", "мука"]]
      expect: true
    - name: Чего-то нет
      args: [["мука", "яйца", "сахар"], ["мука", "яйца", "молоко"]]
      expect: false
    - name: Повторы в рецепте
      args: [["яйца", "яйца", "мука"], ["мука", "яйца"]]
      expect: true
    - name: Пустой холодильник
      args: [["чай"], []]
      expect: false
    - name: Пустой рецепт
      args: [[], []]
      expect: true
  explain: |
    «Всё нужное есть» — это проверка подмножества: `set(recipe) <= set(fridge)`. Множества убирают повторы и не зависят от порядка. Подойдёт и `set(recipe) - set(fridge) == set()`: докупать нечего.
- id: k4-fix-visited
  type: code
  q: |
    Маршрут робота-пылесоса — список клеток, клетка — список `[столбец, строка]`. **Исправьте `cleaned(path)`: вернуть, сколько разных клеток он убрал.** Сейчас она падает с `TypeError`.
    ```call
    cleaned([[0, 0], [0, 1], [0, 0]])
    ```
    ```return
    2
    ```
    `[1, 2]` и `[2, 1]` — разные клетки. Маршрут не меняется.
  starter: |
    def cleaned(path):
        visited = set()
        for cell in path:
            visited.add(cell)
        return len(visited)
  solution: |
    def cleaned(path):
        visited = set()
        for cell in path:
            visited.add((cell[0], cell[1]))
        return len(visited)
  tests:
    function: cleaned
    no_mutate: true
    calls:
    - name: Пример из условия
      args: [[[0, 0], [0, 1], [0, 0]]]
      expect: 2
    - name: Туда и обратно
      args: [[[0, 0], [0, 1], [0, 2], [0, 1], [0, 0]]]
      expect: 3
    - name: Столбец и строка — не одно и то же
      args: [[[1, 2], [2, 1]]]
      expect: 2
    - name: Пустой маршрут
      args: [[]]
      expect: 0
    - name: Маршрут не меняется
      args: [[[3, 3], [3, 3]]]
      expect: 1
    - name: Одна строка, разные столбцы
      args: [[[1, 5], [2, 5]]]
      expect: 2
      hidden: true
  explain: |
    Список изменяем и нехешируем, поэтому элементом множества быть не может: `unhashable type: 'list'`. Клетку превращают в кортеж `(cell[0], cell[1])` — он неизменяем. В кортеже порядок важен, поэтому `(1, 2)` и `(2, 1)` — разные клетки; множество `{1, 2}` их бы склеило.
- id: k4-write-first-repeat
  type: code
  q: |
    Контролёр проверяет билеты по очереди. **Напишите `first_repeat(tickets)`: вернуть номер билета, который первым предъявили повторно, или `None`, если повторов нет.**
    ```call
    first_repeat([7, 8, 8, 7])
    ```
    ```return
    8
    ```
    «Первым» — по моменту второго появления: 8 показали снова раньше, чем 7. Билетов может быть очень много: проверка «был ли уже такой» должна быть быстрой.
  starter: |
    def first_repeat(tickets):
        for t in tickets:
            if tickets.count(t) > 1:
                return t
  solution: |
    def first_repeat(tickets):
        seen = set()
        for t in tickets:
            if t in seen:
                return t
            seen.add(t)
        return None
  tests:
    function: first_repeat
    calls:
    - name: Один повтор
      args: [[101, 205, 333, 205, 400]]
      expect: 205
    - name: Важен момент второго появления
      args: [[7, 8, 8, 7]]
      expect: 8
    - name: Повторов нет
      args: [[1, 2, 3]]
      expect: null
    - name: Пустая очередь
      args: [[]]
      expect: null
  explain: |
    Множество `seen` помнит уже проверенные билеты, и `in` у множества не перебирает все элементы. Заготовка ошибается и в ответе: `count` находит первый билет, у которого вообще есть повтор, — для `[7, 8, 8, 7]` это 7, хотя повторно первым показали 8. Кроме того, `count` каждый раз проходит весь список.
- id: k4-change-common-all
  type: code
  q: |
    `common(order_a, order_b)` находит товары, которые есть в обоих заказах. **Переделайте её в `common_all(orders)`: вернуть отсортированный список товаров, которые есть в каждом заказе списка.**
    ```call
    common_all([["чай", "мёд", "сыр"], ["сыр", "чай"], ["чай", "хлеб", "сыр"]])
    ```
    ```return
    ['сыр', 'чай']
    ```
    Заказ — список товаров, повторы возможны. Нет заказов — пустой список.
  starter: |
    def common(order_a, order_b):
        return sorted(set(order_a) & set(order_b))
  solution: |
    def common_all(orders):
        if len(orders) == 0:
            return []
        result = set(orders[0])
        for order in orders:
            result = result & set(order)
        return sorted(result)
  tests:
    asserts:
    - name: Три заказа
      code: |
        r = common_all([["чай", "мёд", "сыр"], ["сыр", "чай"], ["чай", "хлеб", "сыр", "чай"]])
        assert r == ["сыр", "чай"], "Нужно ['сыр', 'чай'], а вернулось " + repr(r)
    - name: Общего нет
      code: |
        r = common_all([["чай"], ["кофе"]])
        assert r == [], "Нужно [], а вернулось " + repr(r)
    - name: Один заказ
      code: |
        r = common_all([["мёд", "чай", "мёд"]])
        assert r == ["мёд", "чай"], "Для одного заказа — его товары без повторов: ['мёд', 'чай'], а вернулось " + repr(r)
    - name: Нет заказов
      code: |
        r = common_all([])
        assert r == [], "Для пустого списка заказов нужно [], а вернулось " + repr(r)
  explain: |
    Начинают с товаров первого заказа и по очереди пересекают с каждым следующим: после пересечения остаётся только то, что было и там, и там. Начать с пустого множества нельзя — пересечение с пустым всегда пусто. `sorted` даёт порядок, которого у множества нет.
- id: k4-write-only-one-day
  type: code
  q: |
    Посещения кружка — список дней, день — список имён пришедших. **Напишите `only_once(days)`: вернуть отсортированный список тех, кто пришёл ровно в один из дней.**
    ```call
    only_once([["Аня", "Борис"], ["Аня", "Вера"], ["Аня", "Глеб"]])
    ```
    ```return
    ['Борис', 'Вера', 'Глеб']
    ```
    Внутри одного дня имя может повторяться — это всё равно один день.
  starter: |
    def only_once(days):
        names = set()
        for day in days:
            names = names ^ set(day)
        return sorted(names)
  solution: |
    def only_once(days):
        once = set()
        more = set()
        for day in days:
            for name in set(day):
                if name in once:
                    once.discard(name)
                    more.add(name)
                elif name not in more:
                    once.add(name)
        return sorted(once)
  tests:
    function: only_once
    calls:
    - name: Два дня
      args: [[["Аня", "Борис"], ["Борис", "Вера"]]]
      expect: ["Аня", "Вера"]
    - name: Три дня
      args: [[["Аня", "Борис"], ["Аня", "Вера"], ["Аня", "Глеб"]]]
      expect: ["Борис", "Вера", "Глеб"]
    - name: Повтор внутри дня
      args: [[["Дина", "Дина"], ["Егор"]]]
      expect: ["Дина", "Егор"]
    - name: Пустой журнал
      args: [[]]
      expect: []
    - name: Пустые дни
      args: [[[], []]]
      expect: []
  explain: |
    Симметрическая разность подходит только для двух дней: на трёх `^` вернёт Аню обратно — она «ровно в одном» из пар, а была трижды. Надёжнее два множества: `once` — встречены в одном дне, `more` — в нескольких. Каждый день сначала превращают в множество, чтобы повтор внутри дня не считался вторым днём. Можно и словарём «имя → число дней».
- id: open-why-no-lists
  type: open
  q: 'Почему список не может быть элементом множества, а кортеж из строк — может? Что пошло бы не так, если бы Python разрешил `s.add(route)` для списка `route`, а потом выполнили `route.append("Самара")`?'
  rubric:
  - место элемента в множестве выбирается по хешу, который вычисляется из содержимого значения; кортеж из строк изменить нельзя, поэтому его хеш постоянен, а список можно изменить на месте
  - после append содержимое списка, а с ним и хеш, стали бы другими, и проверка route in s искала бы элемент не в том месте, куда он попал при добавлении, — элемент «потерялся» бы в множестве
  wrong_answers:
  - множество хранит копию списка, поэтому изменения ему не страшны
  - списки нельзя, потому что у них есть порядок, а у множества нет
  - в списке могут быть повторы, а множество повторов не допускает
  followups:
  - Может ли элементом множества быть кортеж ("Казань", ["Самара"])? Почему?
