title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: distinct-visitors
  type: single
  q: |
    Что выведет программа?
    ```python
    visits = ["Аня", "аня", "Борис", "Аня", "Борис "]
    print(len(visits), len(set(visits)))
    ```
  options:
  - '`5 4`'
  - '`5 2`'
  - '`5 3`'
  - '`4 4`'
  answer: 0
  explain: 'Множество отбрасывает только равные значения. «Аня» и «аня» — разные строки (регистр различается), «Борис» и «Борис » тоже (пробел в конце). Повторяется лишь «Аня», поэтому разных значений четыре. Чтобы считать их одним человеком, строки сначала приводят к одному виду — например, `lower()` и `strip()`.'
- id: set-methods-run
  type: multi
  q: '`s = {1, 2}`. Какие строки кода выполнятся без ошибки?'
  options:
  - '`s.add(2)`'
  - '`s.discard(5)`'
  - '`print(s == {2, 1, 1})`'
  - '`s.remove(5)`'
  - '`print(s[0])`'
  answer:
  - 0
  - 1
  - 2
  explain: 'Добавить элемент, который уже есть, можно — ничего не изменится. `discard` убирает молча, даже если элемента нет, а `remove` на отсутствующем элементе даёт `KeyError`. Сравнение множеств не зависит от порядка и повторов в записи. Индексов у множества нет — `TypeError`.'
  traps:
  - 3
- id: other-order
  type: multi
  q: 'Программа печатает `print(set(names))`. У вас при каждом запуске порядок имён одинаковый, а коллега запустил ту же программу с теми же данными и получил другой порядок. Что из этого верно?'
  options:
  - 'Обе программы отработали правильно: любой порядок вывода множества допустим'
  - 'Одинаковый у всех вывод даст `print(sorted(set(names)))`'
  - 'У коллеги другая версия Python: на одной версии порядок множества всегда один'
  - 'Порядок станет одинаковым у всех, если добавлять имена в множество по одному через `add`'
  answer:
  - 0
  - 1
  explain: 'Множество порядка не хранит, и язык не обещает никакого порядка вывода — ни на одной версии, ни при добавлении через `add`. То, что у вас он повторяется, — случайность, на которую нельзя опираться. Одинаковый у всех результат даёт только упорядоченный список — `sorted`.'
- id: visited-cells
  type: multi
  q: 'Игра запоминает клетки поля, где уже побывал герой. Клетка — пара координат: столбец 3, строка 5. Какие способы запомнить клетку сработают без ошибки?'
  options:
  - '`visited = set()`, затем `visited.add((3, 5))`'
  - '`visited = set()`, затем `visited.add("3,5")`'
  - '`visited = []`, затем `visited.append([3, 5])`'
  - '`visited = set()`, затем `visited.add([3, 5])`'
  - '`visited = set()`, затем `visited.add({3, 5})`'
  answer:
  - 0
  - 1
  - 2
  explain: 'В множество кладут хешируемые значения — кортеж из чисел и строку можно. Список и множество изменяемы и в множество не попадут: `TypeError: unhashable type`. А в список класть можно что угодно, в том числе списки: правило о хеше касается только множеств и ключей словаря. Список просто медленнее отвечает «была ли здесь клетка».'
- id: open-why-no-lists
  type: open
  q: 'Почему список нельзя положить в множество, а кортеж из строк — можно? Что пошло бы не так, если бы Python разрешил `s.add(route)` для списка `route`, а потом выполнили `route.append("Самара")`?'
  rubric:
  - место элемента в множестве выбирается по хешу, который вычисляется из содержимого значения; кортеж из строк изменить нельзя, поэтому его хеш постоянен, а список можно изменить на месте
  - после append содержимое списка, а с ним и хеш, стали бы другими, и проверка route in s искала бы элемент не в том месте, куда он попал при добавлении, — элемент «потерялся» бы в множестве
  wrong_answers:
  - множество хранит копию списка, поэтому изменения ему не страшны
  - списки нельзя, потому что у них есть порядок, а у множества нет
  - в списке могут быть повторы, а множество повторов не допускает
  followups:
  - Можно ли положить в множество кортеж ("Казань", ["Самара"])? Почему?
- id: tickets-to-set
  type: multi
  q: 'В списке `queue` — 50 000 номеров талонов электронной очереди в порядке выдачи, без повторов. Программа много раз в минуту проверяет, выдан ли талон. Коллега предлагает хранить талоны множеством `set(queue)`. Что программа при этом потеряет?'
  options:
  - 'Порядок, в котором выдавали талоны'
  - 'Возможность узнать, кто первый в очереди, через `queue[0]`'
  - 'Скорость проверки «выдан ли талон»'
  - 'Часть талонов: множество отбрасывает повторы'
  - 'Возможность проверять, выдан ли талон, записью `номер in талоны`'
  answer:
  - 0
  - 1
  explain: 'У множества нет порядка и индексов — «первый в очереди» и порядок выдачи пропадут. Скорость проверки, наоборот, вырастет: `in` у множества смотрит по хешу, а не перебирает все 50 000 номеров. Повторов в списке не было, так что ни один талон не потеряется, а `in` работает и у множества.'
- id: exactly-one-month
  type: multi
  q: 'Записавшиеся на курсы в июне — множество `june`, в июле — `july`. Какие выражения дают тех, кто записывался ровно в одном из этих месяцев?'
  options:
  - '`june ^ july`'
  - '`(june | july) - (june & july)`'
  - '`(june - july) | (july - june)`'
  - '`june - july`'
  - '`june | july`'
  answer:
  - 0
  - 1
  - 2
  explain: 'Симметрическая разность — это и есть «ровно в одном». То же получится, если из всех записавшихся убрать тех, кто был в оба месяца, или объединить «только июнь» и «только июль». `june - july` — только июньские, `june | july` — все вместе.'
- id: hike-buy
  type: multi
  q: 'Для похода нужны вещи `need = {"палатка", "спальник", "фонарик"}`. У Ани есть `have = {"фонарик", "котелок", "палатка"}`. Какие выражения дают то, что Ане нужно докупить?'
  options:
  - '`need - have`'
  - '`need - (need & have)`'
  - '`have - need`'
  - '`need ^ have`'
  - '`need & have`'
  answer:
  - 0
  - 1
  explain: 'Докупить — то, что нужно, но чего нет: `need - have`, спальник. Убрать из нужного то, что у Ани уже есть (`need & have`), — то же самое. `have - need` — лишнее для похода (котелок), `need & have` — то, что уже есть. `need ^ have` смешивает и то, чего не хватает, и лишнее: спальник и котелок.'
- id: ops-predict
  type: single
  q: |
    Что выведет программа?
    ```python
    a = {"чай", "сок", "кофе"}
    b = {"сок", "вода"}
    print(sorted(a - b), len(a | b))
    ```
  options:
  - "`['кофе', 'чай'] 4`"
  - "`['вода', 'кофе', 'чай'] 4`"
  - "`['кофе', 'чай'] 5`"
  - "`['вода'] 4`"
  answer: 0
  explain: '`a - b` — элементы `a`, которых нет в `b`: кофе и чай. В объединении «сок» один, повторы отбрасываются, поэтому элементов четыре. Тройка с «водой» — это `a ^ b`, а «вода» одна — это `b - a`.'
- id: seen-replaced
  type: single
  q: В функции «убрать повторы, сохранив порядок» множество `seen` убрали, а проверку записали как `if name not in result:` — по самому списку результата. Что изменится?
  options:
  - 'Ответ тот же, но на длинных данных функция станет медленнее'
  - 'Порядок первого появления перестанет сохраняться'
  - 'Повторы останутся: `result` заполняется в том же цикле, где его проверяют'
  - 'Функция упадёт: `not in` работает только с множествами'
  answer: 0
  explain: 'В `result` уже есть все встреченные имена, поэтому проверка по нему даёт тот же ответ, а порядок по-прежнему хранит список. Но `in` у списка — перебор, и с ростом списка каждая проверка становится дольше. Множество `seen` нужно ради скорости.'
