id: p1k-repeat
title: Повторить действие n раз
sandbox: python-browser
difficulty: 2
statement: |
  Вклад в банке каждый год растёт на 10 % (копейки отбрасываются), абонемент каждый месяц дешевеет на 50 рублей, бактерии каждый час удваиваются. Всё это — одно и то же: взять значение и `n` раз применить к нему одно действие.

  Напишите функцию `repeat(f, x, n)`: она применяет функцию `f` к `x` ровно `n` раз подряд — к результату предыдущего шага — и возвращает итог. При `n = 0` возвращается сам `x`.

  ```python
  repeat(lambda s: s + s // 10, 1000, 2)   # 1210: 1000 → 1100 → 1210
  repeat(lambda c: c * 2, 1, 5)            # 32
  repeat(lambda c: c * 2, 7, 0)            # 7
  ```

  Вводить и печатать ничего не нужно — проверки вызывают функцию сами и передают в неё разные функции.
starter: |
  def repeat(f, x, n):
      # План:
      # 1. Начать с текущего значения x
      # 2. n раз: вызвать f от текущего значения и запомнить результат
      # 3. Вернуть то, что получилось
      return f(x)
solution: |
  def repeat(f, x, n):
      value = x
      for i in range(n):
          value = f(value)
      return value
tests:
  asserts:
    - name: Вклад за два года
      code: |
        assert repeat(lambda s: s + s // 10, 1000, 2) == 1210, "repeat(lambda s: s + s // 10, 1000, 2) должно вернуть 1210"
    - name: Удвоение
      code: |
        assert repeat(lambda c: c * 2, 1, 5) == 32, "repeat(lambda c: c * 2, 1, 5) должно вернуть 32"
    - name: Ноль повторов
      code: |
        assert repeat(lambda c: c * 2, 7, 0) == 7, "При n = 0 функция возвращает сам x"
    - name: Функция с именем и строки
      code: |
        def add_star(s):
            return s + "*"
        assert repeat(add_star, "", 3) == "***", 'repeat(add_star, "", 3) должно вернуть "***"'
    - name: Функция вызывается ровно n раз
      code: |
        calls = []
        def cheaper(price):
            calls.append(price)
            return price - 50
        assert repeat(cheaper, 1000, 4) == 800, "Абонемент за 1000 через 4 месяца — 800"
        assert len(calls) == 4, f"f должна вызываться ровно n раз, а вызвана {len(calls)}"
hints:
  - level: 1
    text: 'Это накопитель: что в нём до цикла, что меняется на каждом шаге? Внутри `repeat` имя `f` указывает на переданную функцию — как её вызвать?'
  - level: 2
    text: 'Начальное значение накопителя — `x`. На каждом из `n` шагов его заменяют результатом `f(текущее значение)`. При `n = 0` цикл не выполнится ни разу.'
  - level: 3
    text: '`value = x`; `for i in range(n): value = f(value)`; `return value`.'
