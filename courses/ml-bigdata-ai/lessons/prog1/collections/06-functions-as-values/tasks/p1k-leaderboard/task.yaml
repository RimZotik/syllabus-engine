id: p1k-leaderboard
title: Таблица лидеров
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите `leaders(players, k)`: вернуть имена `k` лучших игроков — по убыванию очков, а при равных очках по алфавиту.**

  Игрок — словарь с ключами `"name"` и `"score"`. Если игроков меньше `k`, верните имена всех. Список `players` функция не меняет.

  Пример 1
  ```call
  leaders([
      {"name": "Глеб", "score": 80},
      {"name": "Аня", "score": 95},
      {"name": "Вера", "score": 80},
      {"name": "Борис", "score": 70},
  ], 3)
  ```
  ```return
  ['Аня', 'Вера', 'Глеб']
  ```

  Ограничения: 1 ≤ `k`; список может быть пустым.
starter: |
  def leaders(players, k):
      # План:
      # 1. Отсортировать игроков новым списком: ключ — очки по убыванию, при равенстве имя
      # 2. Взять первых k
      # 3. Вернуть их имена
      return []
solution: |
  def leaders(players, k):
      ranking = sorted(players, key=lambda p: (-p["score"], p["name"]))
      return [p["name"] for p in ranking[:k]]
tests:
  function: leaders
  no_mutate: true
  calls:
    - name: Пример из условия
      args: [[{"name": "Глеб", "score": 80}, {"name": "Аня", "score": 95}, {"name": "Вера", "score": 80}, {"name": "Борис", "score": 70}], 3]
      expect: ["Аня", "Вера", "Глеб"]
    - name: Равные очки — по алфавиту, а не по порядку в списке
      args: [[{"name": "Яна", "score": 50}, {"name": "Дима", "score": 50}, {"name": "Ира", "score": 50}], 3]
      expect: ["Дима", "Ира", "Яна"]
    - name: Больше k, чем игроков
      args: [[{"name": "Аня", "score": 10}], 5]
      expect: ["Аня"]
    - name: Пустой список
      args: [[], 3]
      expect: []
    - name: Лучший — по наибольшим очкам
      args: [[{"name": "Аня", "score": 9}, {"name": "Борис", "score": 100}, {"name": "Вера", "score": 20}], 1]
      expect: ["Борис"]
    - name: Исходный список не меняется
      args: [[{"name": "Глеб", "score": 80}, {"name": "Аня", "score": 95}], 2]
      expect: ["Аня", "Глеб"]
hints:
  - level: 1
    text: 'Сначала порядок, потом срез первых `k`, потом имена. Как объяснить `sorted`, по чему сравнивать словари? Как задать два критерия сразу?'
  - level: 2
    text: 'Ключ сортировки — кортеж: первый элемент решает, второй нужен только при равенстве. Очки должны идти по убыванию, а имена по возрастанию, поэтому `reverse=True` не подходит — подумайте про минус перед числом.'
  - level: 3
    text: 'Ключ — `lambda`, которая для игрока возвращает кортеж из двух значений, первое — очки со знаком минус. Из отсортированного списка возьмите срез первых `k` и соберите из него имена.'
