id: p1k-contacts
title: Телефонная книга по алфавиту
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите `sort_contacts(contacts)`: вернуть новый список строк «Фамилия Имя», упорядоченный по фамилии, а при равной фамилии — по имени, без учёта регистра.**

  Строки в результате — в точности как в исходном списке, регистр не меняется. Список `contacts` функция не меняет.

  Пример 1
  ```call
  sort_contacts(["петров Иван", "Алексеева Ольга", "Петров Андрей", "борисов Глеб"])
  ```
  ```return
  ['Алексеева Ольга', 'борисов Глеб', 'Петров Андрей', 'петров Иван']
  ```
starter: |
  def sort_contacts(contacts):
      # План:
      # 1. Придумать ключ сортировки: что взять из строки «Фамилия Имя» и в каком виде
      # 2. Вернуть sorted с этим ключом
      return sorted(contacts)
solution: |
  def sort_contacts(contacts):
      return sorted(contacts, key=lambda c: (c.split()[0].lower(), c.split()[1].lower()))
tests:
  function: sort_contacts
  no_mutate: true
  calls:
    - name: Пример из условия
      args: [["петров Иван", "Алексеева Ольга", "Петров Андрей", "борисов Глеб"]]
      expect: ["Алексеева Ольга", "борисов Глеб", "Петров Андрей", "петров Иван"]
    - name: Регистр не важен
      args: [["Яковлев Пётр", "андреев Ян"]]
      expect: ["андреев Ян", "Яковлев Пётр"]
    - name: Одна фамилия — по имени
      args: [["Иванова мария", "Иванова Анна", "иванова Вера"]]
      expect: ["Иванова Анна", "иванова Вера", "Иванова мария"]
    - name: Фамилия важнее имени
      args: [["Сидоров Антон", "Котов Яков"]]
      expect: ["Котов Яков", "Сидоров Антон"]
    - name: Одна фамилия — начало другой
      args: [["Петров Иван", "Петр Ровиван"]]
      expect: ["Петр Ровиван", "Петров Иван"]
    - name: Пустая книга
      args: [[]]
      expect: []
    - name: Строки и список не меняются
      args: [["петров Иван", "Алексеева Ольга"]]
      expect: ["Алексеева Ольга", "петров Иван"]
hints:
  - level: 1
    text: 'Без ключа строки сравниваются по номерам символов: заглавные буквы раньше всех строчных. По каким двум значениям нужно сравнивать контакт и в каком виде их взять?'
  - level: 2
    text: 'Ключ — функция, которая для строки контакта возвращает кортеж «фамилия строчными, имя строчными». Фамилия и имя — это `split()` строки. В результат попадут исходные строки, не ключи.'
  - level: 3
    text: 'Проверьте ключ отдельно: вызовите свою `lambda` для строки `"петров Иван"` и напечатайте результат — должно получиться `(''петров'', ''иван'')`.'
