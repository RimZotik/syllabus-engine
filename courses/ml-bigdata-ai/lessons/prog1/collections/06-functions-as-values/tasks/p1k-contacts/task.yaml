id: p1k-contacts
title: Телефонная книга по алфавиту
sandbox: python-browser
difficulty: 2
statement: |
  Контакты в телефоне записаны строками «Фамилия Имя», но вводили их кто как: с заглавной буквы и без. Напишите функцию `sort_contacts(contacts)`, которая возвращает **новый** список тех же строк, расставленных по фамилии без учёта регистра, а при одинаковой фамилии — по имени без учёта регистра. Сами строки не меняются: как записано, так и остаётся.

  ```python
  sort_contacts(["петров Иван", "Алексеева Ольга", "Петров Андрей", "борисов Глеб"])
  # ['Алексеева Ольга', 'борисов Глеб', 'Петров Андрей', 'петров Иван']
  ```

  Исходный список функция не меняет. Вводить и печатать ничего не нужно — проверки вызывают функцию сами.
starter: |
  def sort_contacts(contacts):
      # План:
      # 1. Придумать ключ сортировки: что взять из строки «Фамилия Имя» и в каком виде
      # 2. Вернуть sorted с этим ключом
      return sorted(contacts)
solution: |
  def sort_contacts(contacts):
      return sorted(contacts, key=lambda c: (c.split()[0].lower(), c.split()[1].lower()))
tests:
  asserts:
    - name: Пример из условия
      code: |
        r = sort_contacts(["петров Иван", "Алексеева Ольга", "Петров Андрей", "борисов Глеб"])
        assert r == ["Алексеева Ольга", "борисов Глеб", "Петров Андрей", "петров Иван"], f"Ожидалось ['Алексеева Ольга', 'борисов Глеб', 'Петров Андрей', 'петров Иван'], получено {r}"
    - name: Регистр не важен
      code: |
        r = sort_contacts(["Яковлев Пётр", "андреев Ян"])
        assert r == ["андреев Ян", "Яковлев Пётр"], f"Строчная «андреев» идёт раньше «Яковлев»: ожидалось ['андреев Ян', 'Яковлев Пётр'], получено {r}"
    - name: Одна фамилия — по имени
      code: |
        r = sort_contacts(["Иванова мария", "Иванова Анна", "иванова Вера"])
        assert r == ["Иванова Анна", "иванова Вера", "Иванова мария"], f"Однофамильцы — по имени без учёта регистра, получено {r}"
    - name: Фамилия важнее имени
      code: |
        r = sort_contacts(["Сидоров Антон", "Котов Яков"])
        assert r == ["Котов Яков", "Сидоров Антон"], "Сначала сравниваются фамилии: Котов раньше Сидорова, хотя Антон раньше Якова"
    - name: Одна фамилия — начало другой
      code: |
        r = sort_contacts(["Петров Иван", "Петр Ровиван"])
        assert r == ["Петр Ровиван", "Петров Иван"], f"Фамилия «Петр» короче и идёт раньше «Петров»: ожидалось ['Петр Ровиван', 'Петров Иван'], получено {r}. Сравниваются ли фамилии отдельно от имён?"
    - name: Пустая книга
      code: |
        assert sort_contacts([]) == [], "Для пустого списка — пустой список"
    - name: Строки и список не меняются
      code: |
        book = ["петров Иван", "Алексеева Ольга"]
        r = sort_contacts(book)
        assert book == ["петров Иван", "Алексеева Ольга"], "Функция не должна менять переданный список"
        assert "петров Иван" in r, "Строки в результате — как в исходном списке, без изменения регистра"
hints:
  - level: 1
    text: 'Без ключа строки сравниваются по номерам символов: заглавные буквы раньше всех строчных. По каким двум значениям нужно сравнивать контакт и в каком виде их взять?'
  - level: 2
    text: 'Ключ — функция, которая для строки контакта возвращает кортеж «фамилия строчными, имя строчными». Фамилия и имя — это `split()` строки. В результат попадут исходные строки, не ключи.'
  - level: 3
    text: '`sorted(contacts, key=lambda c: (c.split()[0].lower(), c.split()[1].lower()))`.'
