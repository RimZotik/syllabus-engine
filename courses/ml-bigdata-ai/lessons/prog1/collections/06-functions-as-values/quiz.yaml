title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: tariff-table
  type: single
  q: |
    Что выведет программа?
    ```python
    def economy(km):
        return 100 + 20 * km

    def comfort(km):
        return 200 + 30 * km

    tariffs = {"эконом": economy, "комфорт": comfort}
    choice = "комфорт"
    print(tariffs[choice](10), tariffs["эконом"])
    ```
  options:
  - '`500` и `<function economy at 0x…>`'
  - '`500 300`'
  - '`<function comfort at 0x…>(10)` и `<function economy at 0x…>`'
  - 'Ошибку: функцию нельзя сделать значением словаря'
  answer: 0
  explain: 'Значение словаря может быть любым, в том числе функцией. `tariffs[choice]` — функция `comfort`, а скобки `(10)` после неё — её вызов: 200 + 300 = 500. `tariffs["эконом"]` без скобок — сама функция, её никто не вызывал, и `print` показывает её как значение. Число 300 получилось бы только при вызове `tariffs["эконом"](10)`.'
- id: pick-predict
  type: single
  q: |
    Что выведет программа?
    ```python
    def pick(values, test):
        return [v for v in values if test(v)]

    def is_cold(t):
        return t < 0

    print(pick([3, -1, -5, 2], is_cold), pick([1, 2], lambda x: x > 5))
    ```
  options:
  - '`[-1, -5] []`'
  - '`[False, True, True, False] [False, False]`'
  - '`[-1, -5] [1, 2]`'
  - 'Ошибку: `is_cold` передана без скобок'
  answer: 0
  explain: '`test(v)` вызывает переданную функцию, и её ответ решает, попадёт ли элемент в список: это отбор, а не замена. Во втором вызове ни одно число не больше 5, поэтому список пуст. Имя без скобок — правильный способ передать функцию.'
- id: lambda-as-key
  type: multi
  q: 'Товары — кортежи `(название, цена)`. Какие функции подойдут как `key` в `sorted(goods, key=...)`, чтобы расставить товары по возрастанию цены?'
  options:
  - '`lambda g: g[1]`'
  - '`lambda item: item[1]`'
  - '`lambda name, price: price`'
  - '`lambda g: return g[1]`'
  - '`lambda g: -g[1]`'
  answer:
  - 0
  - 1
  explain: 'Ключ — функция одного аргумента: `sorted` передаёт ей элемент целиком, кортеж, и имя параметра может быть любым. Функция с двумя параметрами упадёт при первом вызове: распаковывать кортеж за вас `sorted` не будет. `return` внутри `lambda` — синтаксическая ошибка: значение выражения возвращается само. Минус развернёт порядок — дорогие окажутся первыми.'
- id: key-keeps-elements
  type: single
  q: |
    Что выведет программа?
    ```python
    words = ["Сыр", "чай", "Мёд"]
    result = sorted(words, key=lambda w: w.lower())
    print(result, words[0])
    ```
  options:
  - "`['Мёд', 'Сыр', 'чай'] Сыр`"
  - "`['мёд', 'сыр', 'чай'] Сыр`"
  - "`['Мёд', 'Сыр', 'чай'] Мёд`"
  - "`['мёд', 'сыр', 'чай'] сыр`"
  answer: 0
  explain: 'Сравниваются ключи «сыр», «чай», «мёд», а в результат попадают исходные слова, с заглавными буквами. `sorted` собирает новый список, поэтому `words` не меняется.'
- id: stable-ties
  type: single
  q: |
    Что выведет программа?
    ```python
    orders = [("Аня", 2), ("Борис", 1), ("Вера", 2), ("Глеб", 1)]
    print([name for name, n in sorted(orders, key=lambda o: o[1])])
    ```
  options:
  - "`['Борис', 'Глеб', 'Аня', 'Вера']`"
  - "`['Глеб', 'Борис', 'Вера', 'Аня']`"
  - "`['Аня', 'Борис', 'Вера', 'Глеб']`"
  - 'Порядок Бориса и Глеба, Ани и Веры при каждом запуске может быть разным'
  answer: 0
  explain: 'Ключ — второй элемент кортежа: сначала заказы с одним товаром, потом с двумя. Сортировка устойчива: при равных ключах элементы остаются в исходном порядке — Борис перед Глебом, Аня перед Верой, при каждом запуске.'
- id: race-key
  type: single
  q: 'Результаты забега — список словарей с ключами `"name"` и `"time"` (секунды, меньше — лучше). Какой вызов расставит бегунов от быстрого к медленному, а при равном времени — по алфавиту?'
  options:
  - '`sorted(runs, key=lambda r: (r["time"], r["name"]))`'
  - '`sorted(runs, key=lambda r: (r["time"], r["name"]), reverse=True)`'
  - '`sorted(runs, key=lambda r: (-r["time"], r["name"]))`'
  - '`sorted(runs, key=lambda r: r["time"])`'
  answer: 0
  explain: 'Кортежи сравниваются поэлементно: сначала время по возрастанию, при равенстве — имя. `reverse=True` развернёт оба критерия, минус — только время, и первыми окажутся медленные. Без имени в ключе бегуны с равным временем останутся в исходном порядке, а не по алфавиту.'
  traps:
  - 2
- id: cheapest-product
  type: multi
  q: '`products` — список словарей с ключами `"name"` и `"price"`. Какие выражения дают самый дешёвый товар — словарь целиком?'
  options:
  - '`min(products, key=lambda p: p["price"])`'
  - '`sorted(products, key=lambda p: p["price"])[0]`'
  - '`min(p["price"] for p in products)`'
  - '`min(products)`'
  answer:
  - 0
  - 1
  explain: '`min` с `key` сравнивает цены, а возвращает сам элемент — словарь. Отсортировать и взять первый — тот же результат, только дольше. Генераторное выражение с `p["price"]` вернёт число, а не товар. Без `key` Python не знает, как сравнить два словаря, — `TypeError`.'
- id: dict-sort-keys
  type: single
  q: |
    Что выведет программа?
    ```python
    stock = {"чай": 5, "мёд": 2, "сыр": 5}
    print(sorted(stock, key=lambda k: stock[k]))
    ```
  options:
  - "`['мёд', 'чай', 'сыр']`"
  - '`[2, 5, 5]`'
  - "`[('мёд', 2), ('чай', 5), ('сыр', 5)]`"
  - "`['мёд', 'сыр', 'чай']`"
  answer: 0
  explain: 'Перебор словаря даёт ключи, поэтому сортируются названия, а `stock[k]` — ключ сортировки, остаток. Чай и сыр с равным остатком остаются в порядке добавления в словарь. Пары получились бы из `stock.items()`.'
- id: max-by-price
  type: multi
  q: |
    Какие выражения дают самый дорогой товар, `("мёд", 300)`?
    ```python
    def by_price(item):
        return item[1]

    goods = [("чай", 150), ("мёд", 300), ("сыр", 220)]
    ```
  options:
  - '`max(goods, key=by_price)`'
  - '`sorted(goods, key=by_price)[-1]`'
  - '`max(goods, key=lambda g: by_price(g))`'
  - '`max(goods, key=by_price())`'
  - '`max(goods)`'
  answer:
  - 0
  - 1
  - 2
  explain: 'Ключом передают саму функцию: по имени или обёрнутую в `lambda`, которая её вызывает. Отсортировать по цене и взять последний — тоже самый дорогой. `by_price()` вызывается ещё до `max`, без аргумента, — `TypeError`. Без ключа кортежи сравниваются по первому элементу, названию, и победит «чай», а не самый дорогой.'
- id: ranking-spoils
  type: single
  q: |
    ИИ-ассистент написал функцию «таблица лидеров». Что в ней не так?
    ```python
    def ranking(players):
        players.sort(key=lambda p: p["score"], reverse=True)
        return players
    ```
  options:
  - 'Она меняет порядок в списке, который ей передали'
  - 'Она всегда возвращает `None`, потому что `sort` возвращает `None`'
  - 'При равных очках игроки будут идти в случайном порядке'
  - 'Аргумент `key` не работает вместе с `reverse=True`, и он будет пропущен'
  answer: 0
  explain: '`players` — псевдоним аргумента, и `sort` меняет этот самый список — побочный эффект, о котором по имени функции не догадаться. Возвращается сам список, а не результат `sort`, поэтому не `None`. Равные очки сохраняют исходный порядок. Чистая версия — `return sorted(players, key=..., reverse=True)`.'
- id: open-key-len
  type: open
  q: Объясните, что происходит в вызове `sorted(words, key=len)`. Какую роль играет `len`, почему он записан без скобок и что окажется в результате?
  rubric:
  - роль len — функция-ключ сортировки, sorted вызывает её для каждого слова по разу и сравнивает слова по полученным значениям (длинам)
  - без скобок, потому что передаётся сама функция как значение, а вызывает её sorted (можно, но не обязательно, добавить, что len() вызвал бы её сразу, без аргумента, и была бы ошибка)
  - в результате — список из тех же исходных слов (не длин), расставленных по возрастанию длины
  wrong_answers:
  - результат — список длин слов
  - len без скобок означает, что ключ не используется
  - sorted меняет words на месте
  followups:
  - Что окажется в результате, если в words два слова одной длины?
