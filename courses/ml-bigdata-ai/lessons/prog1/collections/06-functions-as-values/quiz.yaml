title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: tariff-table
  type: single
  q: |
    Что выведет программа?
    ```python
    def economy(km):
        return 100 + 20 * km

    def comfort(km):
        return 200 + 30 * km

    tariffs = {"эконом": economy, "комфорт": comfort}
    choice = "комфорт"
    print(tariffs[choice](10), tariffs["эконом"])
    ```
  options:
  - '`500` и `<function economy at 0x…>`'
  - '`500 300`'
  - '`<function comfort at 0x…>(10)` и `<function economy at 0x…>`'
  - 'Ошибку: функцию нельзя сделать значением словаря'
  answer: 0
  explain: 'Значение словаря может быть любым, в том числе функцией. `tariffs[choice]` — функция `comfort`, а скобки `(10)` после неё — её вызов: 200 + 300 = 500. `tariffs["эконом"]` без скобок — сама функция, её никто не вызывал, и `print` показывает её как значение. Число 300 получилось бы только при вызове `tariffs["эконом"](10)`.'
- id: pick-predict
  type: single
  q: |
    Что выведет программа?
    ```python
    def pick(values, test):
        return [v for v in values if test(v)]

    def is_cold(t):
        return t < 0

    print(pick([3, -1, -5, 2], is_cold), pick([1, 2], lambda x: x > 5))
    ```
  options:
  - '`[-1, -5] []`'
  - '`[False, True, True, False] [False, False]`'
  - '`[-1, -5] [1, 2]`'
  - 'Ошибку: `is_cold` передана без скобок'
  answer: 0
  explain: '`test(v)` вызывает переданную функцию, и её ответ решает, попадёт ли элемент в список: это отбор, а не замена. Во втором вызове ни одно число не больше 5, поэтому список пуст. Имя без скобок — правильный способ передать функцию.'
- id: key-keeps-elements
  type: single
  q: |
    Что выведет программа?
    ```python
    words = ["Сыр", "чай", "Мёд"]
    result = sorted(words, key=lambda w: w.lower())
    print(result, words[0])
    ```
  options:
  - "`['Мёд', 'Сыр', 'чай'] Сыр`"
  - "`['мёд', 'сыр', 'чай'] Сыр`"
  - "`['Мёд', 'Сыр', 'чай'] Мёд`"
  - "`['мёд', 'сыр', 'чай'] сыр`"
  answer: 0
  explain: 'Сравниваются ключи «сыр», «чай», «мёд», а в результат попадают исходные слова, с заглавными буквами. `sorted` собирает новый список, поэтому `words` не меняется.'
- id: stable-ties
  type: single
  q: |
    Что выведет программа?
    ```python
    orders = [("Аня", 2), ("Борис", 1), ("Вера", 2), ("Глеб", 1)]
    print([name for name, n in sorted(orders, key=lambda o: o[1])])
    ```
  options:
  - "`['Борис', 'Глеб', 'Аня', 'Вера']`"
  - "`['Глеб', 'Борис', 'Вера', 'Аня']`"
  - "`['Аня', 'Борис', 'Вера', 'Глеб']`"
  - 'Порядок Бориса и Глеба, Ани и Веры при каждом запуске может быть разным'
  answer: 0
  explain: 'Ключ — второй элемент кортежа: сначала заказы с одним товаром, потом с двумя. Сортировка устойчива: при равных ключах элементы остаются в исходном порядке — Борис перед Глебом, Аня перед Верой, при каждом запуске.'
- id: dict-sort-keys
  type: single
  q: |
    Что выведет программа?
    ```python
    stock = {"чай": 5, "мёд": 2, "сыр": 5}
    print(sorted(stock, key=lambda k: stock[k]))
    ```
  options:
  - "`['мёд', 'чай', 'сыр']`"
  - '`[2, 5, 5]`'
  - "`[('мёд', 2), ('чай', 5), ('сыр', 5)]`"
  - "`['мёд', 'сыр', 'чай']`"
  answer: 0
  explain: 'Перебор словаря даёт ключи, поэтому сортируются названия, а `stock[k]` — ключ сортировки, остаток. Чай и сыр с равным остатком остаются в порядке добавления в словарь. Пары получились бы из `stock.items()`.'
- id: ranking-spoils
  type: single
  q: |
    ИИ-ассистент написал функцию «таблица лидеров». Что в ней не так?
    ```python
    def ranking(players):
        players.sort(key=lambda p: p["score"], reverse=True)
        return players
    ```
  options:
  - 'Она меняет порядок в списке, который ей передали'
  - 'Она всегда возвращает `None`, потому что `sort` возвращает `None`'
  - 'При равных очках игроки будут идти в случайном порядке'
  - 'Аргумент `key` не работает вместе с `reverse=True`, и он будет пропущен'
  answer: 0
  explain: '`players` — псевдоним аргумента, и `sort` меняет этот самый список — побочный эффект, о котором по имени функции не догадаться. Возвращается сам список, а не результат `sort`, поэтому не `None`. Равные очки сохраняют исходный порядок. Чистая версия — `return sorted(players, key=..., reverse=True)`.'
- id: k6-fix-key-parens
  type: code
  q: |
    Функция `by_length(words)` падает с `TypeError`. **Исправьте её: вернуть новый список слов от коротких к длинным.**
    ```call
    by_length(["молоко", "чай", "хлеб"])
    ```
    ```return
    ['чай', 'хлеб', 'молоко']
    ```
    Слова одной длины остаются в прежнем порядке.
  starter: |
    def by_length(words):
        return sorted(words, key=len())
  solution: |
    def by_length(words):
        return sorted(words, key=len)
  tests:
    function: by_length
    no_mutate: true
    calls:
    - name: Разная длина
      args: [["молоко", "чай", "хлеб"]]
      expect: ["чай", "хлеб", "молоко"]
    - name: Равная длина — прежний порядок
      args: [["сыр", "мёд", "чай"]]
      expect: ["сыр", "мёд", "чай"]
      hidden: true
    - name: Длинное слово первым
      args: [["апельсин", "кот", "дом", "сок"]]
      expect: ["кот", "дом", "сок", "апельсин"]
      hidden: true
  explain: |
    `key` ждёт саму функцию, и вызывает её `sorted` — для каждого слова. `len()` вызывается сразу, ещё до сортировки, без аргумента — отсюда `TypeError`. Сортировка устойчива, поэтому слова одной длины не переставляются.
- id: k6-complete-price-key
  type: code
  q: |
    Товар — кортеж `(название, цена)`. **Замените `...` функцией-ключом: `by_price(goods)` возвращает новый список товаров от дешёвых к дорогим.**
    ```call
    by_price([("сыр", 320), ("хлеб", 45), ("чай", 150)])
    ```
    ```return
    [('хлеб', 45), ('чай', 150), ('сыр', 320)]
    ```
    При равной цене порядок прежний.
  starter: |
    def by_price(goods):
        return sorted(goods, key=...)
  solution: |
    def by_price(goods):
        return sorted(goods, key=lambda g: g[1])
  tests:
    function: by_price
    calls:
    - name: Три товара
      args_py: "([('сыр', 320), ('хлеб', 45), ('чай', 150)],)"
      expect_py: "[('хлеб', 45), ('чай', 150), ('сыр', 320)]"
    - name: Не по названию
      args_py: "([('арбуз', 300), ('яблоко', 90)],)"
      expect_py: "[('яблоко', 90), ('арбуз', 300)]"
    - name: Равные цены
      args_py: "([('мёд', 300), ('кофе', 300), ('соль', 20)],)"
      expect_py: "[('соль', 20), ('мёд', 300), ('кофе', 300)]"
  explain: |
    Ключ — функция одного аргумента: `sorted` передаёт ей товар целиком, кортеж, а она возвращает то, по чему сравнивать, — цену `g[1]`. Без ключа кортежи сравнивались бы по первому элементу, названию.
- id: k6-fix-cheapest
  type: code
  q: |
    Товары — список словарей с ключами `"name"` и `"price"`. **Исправьте `cheapest(products)`: вернуть самый дешёвый товар — словарь целиком, а не цену.**
    ```call
    cheapest([{"name": "сыр", "price": 320}, {"name": "хлеб", "price": 45}])
    ```
    ```return
    {'name': 'хлеб', 'price': 45}
    ```
    При равной цене — первый из таких.
  starter: |
    def cheapest(products):
        return min(p["price"] for p in products)
  solution: |
    def cheapest(products):
        return min(products, key=lambda p: p["price"])
  tests:
    function: cheapest
    calls:
    - name: Пример из условия
      args: [[{"name": "сыр", "price": 320}, {"name": "хлеб", "price": 45}]]
      expect: {"name": "хлеб", "price": 45}
    - name: Три товара
      args: [[{"name": "сыр", "price": 320}, {"name": "хлеб", "price": 45}, {"name": "чай", "price": 150}]]
      expect: {"name": "хлеб", "price": 45}
    - name: Равная цена — первый
      args: [[{"name": "соль", "price": 20}, {"name": "спички", "price": 20}]]
      expect: {"name": "соль", "price": 20}
    - name: Один товар
      args: [[{"name": "мёд", "price": 300}]]
      expect: {"name": "мёд", "price": 300}
  explain: |
    Генераторное выражение подаёт в `min` уже цены, и товар теряется. `min` с `key` сравнивает элементы по ключу, а возвращает сам элемент — словарь.
- id: k6-write-count-if
  type: code
  q: |
    **Напишите `count_if(values, test)`: вернуть, для скольких элементов `values` функция `test` вернула `True`.**
    ```python
    count_if([3, -1, -5, 2], lambda t: t < 0)
    ```
    ```output
    2
    ```
  starter: |
    def count_if(values, test):
        return len(values)
  solution: |
    def count_if(values, test):
        count = 0
        for v in values:
            if test(v):
                count += 1
        return count
  tests:
    asserts:
    - name: Морозные дни
      code: |
        r = count_if([3, -1, -5, 2], lambda t: t < 0)
        assert r == 2, "count_if([3, -1, -5, 2], lambda t: t < 0) должна вернуть 2, а вернула " + repr(r)
    - name: Функция с именем
      code: |
        def is_long(w):
            return len(w) > 4
        r = count_if(["кот", "собака", "попугай"], is_long)
        assert r == 2, "Слов длиннее четырёх букв два, а вернулось " + repr(r)
    - name: Никто не подошёл
      code: |
        r = count_if([1, 2, 3], lambda x: x > 10)
        assert r == 0, "Нужно 0, а вернулось " + repr(r)
    - name: Пустой список
      code: |
        r = count_if([], lambda x: True)
        assert r == 0, "Для пустого списка нужно 0, а вернулось " + repr(r)
  explain: |
    `test` — обычное имя параметра, к которому привязана функция; `test(v)` вызывает её для элемента. Подойдёт и одна строка: `sum(1 for v in values if test(v))`.
- id: k6-write-apply-all
  type: code
  q: |
    Касса применяет к цене правила по очереди: скидку, округление, доставку. **Напишите `apply_all(price, rules)`: применить функции из списка `rules` по порядку — каждую к результату предыдущей — и вернуть итог.**
    ```python
    apply_all(1000, [lambda p: p - p // 10, lambda p: p + 200])
    ```
    ```output
    1100
    ```
    Без правил цена не меняется.
  starter: |
    def apply_all(price, rules):
        for rule in rules:
            result = rule(price)
        return result
  solution: |
    def apply_all(price, rules):
        for rule in rules:
            price = rule(price)
        return price
  tests:
    asserts:
    - name: Скидка, затем доставка
      code: |
        r = apply_all(1000, [lambda p: p - p // 10, lambda p: p + 200])
        assert r == 1100, "1000 → 900 → 1100, а вернулось " + repr(r)
    - name: Порядок важен
      code: |
        r = apply_all(1000, [lambda p: p + 200, lambda p: p - p // 10])
        assert r == 1080, "1000 → 1200 → 1080, а вернулось " + repr(r)
    - name: Одно правило
      code: |
        r = apply_all(450, [lambda p: p // 100 * 100])
        assert r == 400, "Нужно 400, а вернулось " + repr(r)
    - name: Без правил
      code: |
        r = apply_all(700, [])
        assert r == 700, "Без правил цена та же: нужно 700, а вернулось " + repr(r)
  explain: |
    В заготовке каждое правило применяется к исходной цене, и выживает только последнее; а без правил имя `result` так и не получит значения, и `return` упадёт с ошибкой. Результат шага нужно привязывать к тому же имени, `price = rule(price)`, тогда следующее правило получает уже изменённую цену.
- id: k6-write-sort-dates
  type: code
  q: |
    **Напишите `chronological(dates)`: вернуть новый список дат-строк `"дд.мм.гггг"` от ранних к поздним.**
    ```call
    chronological(["02.01.2025", "15.12.2024"])
    ```
    ```return
    ['15.12.2024', '02.01.2025']
    ```
    Обычная сортировка строк здесь ошибается. Исходный список не меняется.
  starter: |
    def chronological(dates):
        return sorted(dates)
  solution: |
    def chronological(dates):
        return sorted(dates, key=lambda d: (int(d.split(".")[2]), int(d.split(".")[1]), int(d.split(".")[0])))
  tests:
    function: chronological
    no_mutate: true
    calls:
    - name: Разные годы
      args: [["02.01.2025", "15.12.2024"]]
      expect: ["15.12.2024", "02.01.2025"]
    - name: Один год, разные месяцы
      args: [["01.10.2024", "30.09.2024", "05.10.2024"]]
      expect: ["30.09.2024", "01.10.2024", "05.10.2024"]
    - name: Строки не меняются
      args: [["10.05.2023", "09.05.2023"]]
      expect: ["09.05.2023", "10.05.2023"]
    - name: Пустой список
      args: [[]]
      expect: []
  explain: |
    Ключ превращает строку в кортеж `(год, месяц, день)` из чисел, а кортежи сравниваются поэлементно: сначала год, при равенстве — месяц, потом день. В результат попадают исходные строки. Ключ удобнее записать обычной функцией: `day, month, year = d.split(".")`, затем `return int(year), int(month), int(day)`.
- id: k6-write-sort-by-rule
  type: code
  q: |
    **Напишите `sort_by_rule(words, rule)`: вернуть новый список слов, отсортированный по правилу пользователя:**
    - `"алфавит"` — по алфавиту без учёта регистра;
    - `"длина"` — от коротких к длинным;
    - `"конец"` — по последней букве.

    ```call
    sort_by_rule(["кот", "лиса", "ёж"], "конец")
    ```
    ```return
    ['лиса', 'ёж', 'кот']
    ```
    Неизвестное правило — копия списка в прежнем порядке. Ключи храните в словаре «правило → функция», без цепочки `if`. Исходный список не меняется.
  starter: |
    def sort_by_rule(words, rule):
        rules = {"алфавит": lambda w: w.lower(), "длина": len}
        return sorted(words, key=rules[rule]())
  solution: |
    def sort_by_rule(words, rule):
        rules = {
            "алфавит": lambda w: w.lower(),
            "длина": len,
            "конец": lambda w: w[-1],
        }
        if rule not in rules:
            return words.copy()
        return sorted(words, key=rules[rule])
  tests:
    function: sort_by_rule
    no_mutate: true
    calls:
    - name: По алфавиту
      args: [["сыр", "Арбуз", "мёд"], "алфавит"]
      expect: ["Арбуз", "мёд", "сыр"]
    - name: По длине
      args: [["молоко", "чай", "хлеб"], "длина"]
      expect: ["чай", "хлеб", "молоко"]
    - name: По последней букве
      args: [["кот", "лиса", "ёж"], "конец"]
      expect: ["лиса", "ёж", "кот"]
    - name: Исходный список не меняется
      args: [["сыр", "чай", "Арбуз"], "длина"]
      expect: ["сыр", "чай", "Арбуз"]
    asserts:
    - name: Неизвестное правило
      code: |
        words = ["б", "а"]
        r = sort_by_rule(words, "случайно")
        assert r == ["б", "а"], "Для неизвестного правила порядок прежний: нужно ['б', 'а'], а вернулось " + repr(r)
        assert r is not words, "Нужна копия списка, а вернулся сам список"
  explain: |
    Значением словаря может быть функция: `rules[rule]` — сама функция-ключ, без скобок, её вызывает `sorted`. Неизвестное правило проверяют через `in` до обращения по ключу, иначе `KeyError`. Буква «ж» стоит в алфавите раньше «т», а «а» — раньше обеих.
