id: p1k-ai-without-worst
title: ИИ-ассистент считает балл без худшей оценки
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте `average_without_worst(marks)`: вернуть среднее всех оценок, кроме одной самой низкой, и не менять переданный список.**

  В списке не меньше двух оценок; если самых низких несколько, не учитывается только одна. Код в редакторе написал ИИ-ассистент: среднее он считает верно, но после вызова журнал испорчен, а повторный вызов даёт другой ответ.

  Пример 1
  ```call
  average_without_worst([5, 4, 2])
  ```
  ```return
  4.5
  ```

  Пример 2
  ```call
  average_without_worst([5, 2, 2])
  ```
  ```return
  3.5
  ```
starter: |
  # Решение от ИИ-ассистента
  def average_without_worst(marks):
      marks.remove(min(marks))
      return sum(marks) / len(marks)


  journal = [5, 4, 2]
  print(average_without_worst(journal))
  print(average_without_worst(journal))
  print(journal)
solution: |
  def average_without_worst(marks):
      return (sum(marks) - min(marks)) / (len(marks) - 1)


  journal = [5, 4, 2]
  print(average_without_worst(journal))
  print(average_without_worst(journal))
  print(journal)
tests:
  function: average_without_worst
  no_mutate: true
  calls:
    - name: Среднее без худшей
      args: [[5, 4, 2]]
      expect: 4.5
    - name: Журнал не меняется
      args: [[5, 4, 2]]
      expect: 4.5
    - name: Убирается только одна худшая
      args: [[5, 2, 2]]
      expect: 3.5
    - name: Все оценки одинаковые
      args: [[3, 3]]
      expect: 3.0
  asserts:
    - name: Повторный вызов — тот же ответ
      code: |
        j = [3, 5, 4, 3]
        first = average_without_worst(j)
        second = average_without_worst(j)
        assert first == second == 4.0, "Оба вызова для [3, 5, 4, 3] должны вернуть 4.0"
hints:
  - level: 1
    text: '`marks` внутри функции и `journal` снаружи — сколько здесь списков? Что делает с этим списком `remove`?'
  - level: 2
    text: '`remove` меняет сам переданный список — это побочный эффект. Можно не убирать оценку вовсе: среднее без одной худшей — это сумма без неё, делённая на число оценок без неё. Или работать с копией.'
  - level: 3
    text: 'Без худшей оценки сумма равна `sum(marks) - min(marks)`, а оценок на одну меньше. Другой путь — вызывать `remove` у копии списка, а не у самого `marks`.'
