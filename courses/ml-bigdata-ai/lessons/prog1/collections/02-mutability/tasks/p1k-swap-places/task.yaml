id: p1k-swap-places
title: Поменяться местами в очереди
sandbox: python-browser
difficulty: 2
statement: |
  Очередь к кассе — список имён. Двое могут поменяться местами. Напишите две функции, которые делают это по-разному:

  - `swap_in_place(queue, i, j)` меняет местами элементы с индексами `i` и `j` **в самом списке** и ничего не возвращает (то есть возвращает `None`), как `sort`;
  - `swapped(queue, i, j)` **возвращает новый список**, где эти элементы поменялись местами, а `queue` не меняет, как `sorted`.

  Вводить и печатать ничего не нужно — проверки вызывают функции сами:

  ```python
  q = ["Аня", "Борис", "Вера"]
  preview = swapped(q, 0, 2)   # preview — ['Вера', 'Борис', 'Аня'], q не изменилась
  swap_in_place(q, 0, 1)       # теперь q — ['Борис', 'Аня', 'Вера']
  ```
starter: |
  def swap_in_place(queue, i, j):
      # План: поменять местами queue[i] и queue[j] в самом списке; return не нужен
      pass


  def swapped(queue, i, j):
      # План:
      # 1. Сделать копию списка
      # 2. Поменять местами элементы в копии
      # 3. Вернуть копию
      return queue
solution: |
  def swap_in_place(queue, i, j):
      queue[i], queue[j] = queue[j], queue[i]


  def swapped(queue, i, j):
      result = queue.copy()
      result[i], result[j] = result[j], result[i]
      return result
tests:
  asserts:
    - name: Обмен на месте
      code: |
        q = ["Аня", "Борис", "Вера"]
        r = swap_in_place(q, 0, 1)
        assert q == ["Борис", "Аня", "Вера"], "После swap_in_place(q, 0, 1) список должен стать ['Борис', 'Аня', 'Вера']"
        assert r is None, "swap_in_place меняет список на месте и возвращает None, как sort"
    - name: Новый список
      code: |
        q = ["Аня", "Борис", "Вера"]
        r = swapped(q, 0, 2)
        assert r == ["Вера", "Борис", "Аня"], "swapped(q, 0, 2) должно вернуть ['Вера', 'Борис', 'Аня']"
    - name: Исходная очередь цела
      code: |
        q = ["Аня", "Борис", "Вера"]
        r = swapped(q, 0, 2)
        assert q == ["Аня", "Борис", "Вера"], "swapped не должна менять переданный список"
        assert r is not q, "swapped должна вернуть новый список, а не тот же самый"
    - name: Отрицательные индексы
      code: |
        q = ["Аня", "Борис", "Вера"]
        swap_in_place(q, 0, -1)
        assert q == ["Вера", "Борис", "Аня"], "swap_in_place(q, 0, -1) меняет первого и последнего"
    - name: Тот же индекс
      code: |
        q = ["Аня", "Борис"]
        assert swapped(q, 1, 1) == ["Аня", "Борис"], "Если i == j, очередь не меняется"
hints:
  - level: 1
    text: 'Как поменять местами два значения одной строкой кода — помните обмен `a, b = b, a`? Работает ли он с `queue[i]` и `queue[j]`? И для второй функции: что меняется, если `result = queue`, а что — если `result = queue.copy()`?'
  - level: 2
    text: 'Обмен через распаковку работает и с элементами списка: правая часть собирается в кортеж до присваивания. Во второй функции `result = queue` даст лишь второе имя того же списка — нужна копия.'
  - level: 3
    text: 'Первая функция: `queue[i], queue[j] = queue[j], queue[i]`. Вторая: `result = queue.copy()`, тот же обмен для `result`, `return result`.'
