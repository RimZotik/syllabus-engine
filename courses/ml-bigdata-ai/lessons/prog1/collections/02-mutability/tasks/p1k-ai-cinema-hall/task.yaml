id: p1k-ai-cinema-hall
title: ИИ-ассистент строит зал кинотеатра
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте `empty_hall(rows, seats)`: вернуть пустой зал — список из `rows` рядов по `seats` мест `"."`, где каждый ряд — отдельный список.**

  Место продают присваиванием `hall[r][s] = "X"`. Код в редакторе написал ИИ-ассистент: пустой зал выглядит правильно, но после первой же продажи место занято во всех рядах сразу.

  Пример 1
  ```call
  empty_hall(2, 3)
  ```
  ```return
  [['.', '.', '.'], ['.', '.', '.']]
  ```

  Пример 2 — продажа одного места
  ```python
  hall = empty_hall(3, 4)
  hall[0][1] = "X"
  print(hall)
  ```
  ```output
  [['.', 'X', '.', '.'], ['.', '.', '.', '.'], ['.', '.', '.', '.']]
  ```

  Ограничения: `rows` и `seats` — целые от 0 до 30.
starter: |
  # Решение от ИИ-ассистента
  def empty_hall(rows, seats):
      return [["."] * seats] * rows


  hall = empty_hall(3, 4)
  hall[0][1] = "X"
  print(hall)
solution: |
  def empty_hall(rows, seats):
      hall = []
      for r in range(rows):
          hall.append(["."] * seats)
      return hall


  hall = empty_hall(3, 4)
  hall[0][1] = "X"
  print(hall)
tests:
  function: empty_hall
  calls:
    - name: Пустой зал нужного размера
      args: [2, 3]
      expect: [[".", ".", "."], [".", ".", "."]]
    - name: Зал без рядов
      args: [0, 5]
      expect: []
    - name: Один ряд
      args: [1, 4]
      expect: [[".", ".", ".", "."]]
      hidden: true
  asserts:
    - name: Продажа занимает одно место
      code: |
        h = empty_hall(3, 4)
        h[0][1] = "X"
        assert h == [[".", "X", ".", "."], [".", ".", ".", "."], [".", ".", ".", "."]], "После h[0][1] = 'X' занято должно быть только одно место в первом ряду"
    - name: У каждого ряда свой список
      code: |
        h = empty_hall(4, 2)
        for a in range(4):
            for b in range(a + 1, 4):
                assert h[a] is not h[b], "Ряды должны быть разными списками, а не псевдонимами одного"
    - name: Два зала независимы
      code: |
        a = empty_hall(1, 2)
        b = empty_hall(1, 2)
        a[0][0] = "X"
        assert b == [[".", "."]], "Каждый вызов строит свой зал"
hints:
  - level: 1
    text: 'Сколько разных внутренних списков создаёт выражение `[["."] * seats] * rows`? Сравните в редакторе: `hall[0] is hall[1]`.'
  - level: 2
    text: 'Умножение внешнего списка повторяет один и тот же ряд — все ряды стали псевдонимами. Каждый ряд нужно создавать заново: `["."] * seats` должно выполниться столько раз, сколько рядов.'
  - level: 3
    text: 'Соберите зал циклом по рядам: на каждой итерации создавайте новый ряд и дописывайте его в зал.'
