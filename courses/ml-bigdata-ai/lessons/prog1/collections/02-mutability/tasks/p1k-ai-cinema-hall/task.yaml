id: p1k-ai-cinema-hall
title: ИИ-ассистент строит зал кинотеатра
sandbox: python-browser
difficulty: 2
statement: |
  Касса кинотеатра хранит зал как список рядов, а ряд — как список мест: `"."` — место свободно, `"X"` — занято. Функция `empty_hall(rows, seats)` возвращает пустой зал из `rows` рядов по `seats` мест.

  ```python
  hall = empty_hall(3, 4)
  hall[0][1] = "X"     # продали место 2 в первом ряду
  print(hall)
  # [['.', 'X', '.', '.'], ['.', '.', '.', '.'], ['.', '.', '.', '.']]
  ```

  Функцию написал ИИ-ассистент. Пустой зал выглядит правильно, но после первой же продажи место оказывается занятым во всех рядах сразу. Выясните, сколько разных списков-рядов в этом зале, найдите причину и исправьте функцию.
starter: |
  # Решение от ИИ-ассистента
  def empty_hall(rows, seats):
      return [["."] * seats] * rows


  hall = empty_hall(3, 4)
  hall[0][1] = "X"
  print(hall)
solution: |
  def empty_hall(rows, seats):
      hall = []
      for r in range(rows):
          hall.append(["."] * seats)
      return hall


  hall = empty_hall(3, 4)
  hall[0][1] = "X"
  print(hall)
tests:
  asserts:
    - name: Пустой зал нужного размера
      code: |
        assert empty_hall(2, 3) == [[".", ".", "."], [".", ".", "."]], "empty_hall(2, 3) — два ряда по три свободных места"
    - name: Продажа занимает одно место
      code: |
        h = empty_hall(3, 4)
        h[0][1] = "X"
        assert h == [[".", "X", ".", "."], [".", ".", ".", "."], [".", ".", ".", "."]], "После h[0][1] = 'X' занято должно быть только одно место в первом ряду"
    - name: У каждого ряда свой список
      code: |
        h = empty_hall(4, 2)
        for a in range(4):
            for b in range(a + 1, 4):
                assert h[a] is not h[b], "Ряды должны быть разными списками, а не псевдонимами одного"
    - name: Зал без рядов
      code: |
        assert empty_hall(0, 5) == [], "empty_hall(0, 5) — пустой список рядов"
    - name: Два зала независимы
      code: |
        a = empty_hall(1, 2)
        b = empty_hall(1, 2)
        a[0][0] = "X"
        assert b == [[".", "."]], "Каждый вызов строит свой зал"
hints:
  - level: 1
    text: 'Сколько разных внутренних списков создаёт выражение `[["."] * seats] * rows`? Сравните в редакторе: `hall[0] is hall[1]`.'
  - level: 2
    text: 'Умножение внешнего списка повторяет один и тот же ряд — все ряды стали псевдонимами. Каждый ряд нужно создавать заново: `["."] * seats` должно выполниться столько раз, сколько рядов.'
  - level: 3
    text: '`hall = []`, затем `for r in range(rows):` и в теле `hall.append(["."] * seats)`; после цикла `return hall`.'
