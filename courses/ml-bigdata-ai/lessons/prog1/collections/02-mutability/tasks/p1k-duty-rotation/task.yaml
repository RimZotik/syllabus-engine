id: p1k-duty-rotation
title: Дежурные по кругу
sandbox: python-browser
difficulty: 3
statement: |
  **Напишите две функции, которые сдвигают очередь дежурных на `k` дней: `rotate(duty, k)` меняет сам список и возвращает `None`, а `rotated(duty, k)` возвращает новый список и `duty` не меняет.**

  Сдвиг на один день: первый дежурный уходит в конец списка. Сдвиг на `k` дней — `k` таких шагов подряд.

  Пример 1
  ```input
  rotated(["Аня", "Борис", "Вера", "Глеб"], 1)
  ```
  ```output
  ['Борис', 'Вера', 'Глеб', 'Аня']
  ```

  Пример 2
  ```input
  duty = ["Аня", "Борис", "Вера"]
  rotate(duty, 5)
  print(duty)
  ```
  ```output
  ['Вера', 'Аня', 'Борис']
  ```

  Ограничения: 0 ≤ `k` ≤ 10⁹; список может быть пустым.
starter: |
  def rotate(duty, k):
      pass


  def rotated(duty, k):
      return duty
solution: |
  def rotate(duty, k):
      if not duty:
          return
      for _ in range(k % len(duty)):
          duty.append(duty.pop(0))


  def rotated(duty, k):
      if not duty:
          return []
      k = k % len(duty)
      return duty[k:] + duty[:k]
tests:
  asserts:
    - name: Новый список — пример 1
      code: |
        q = ["Аня", "Борис", "Вера", "Глеб"]
        r = rotated(q, 1)
        assert r == ["Борис", "Вера", "Глеб", "Аня"], f"rotated(q, 1) должна вернуть ['Борис', 'Вера', 'Глеб', 'Аня'], а вернула {r}"
        assert q == ["Аня", "Борис", "Вера", "Глеб"], "rotated не должна менять переданный список"
    - name: Новый список — это другой список
      code: |
        q = ["Аня", "Борис", "Вера"]
        r = rotated(q, 0)
        assert r == ["Аня", "Борис", "Вера"], f"rotated(q, 0) — та же очередь, а вернулось {r}"
        assert r is not q, "rotated должна вернуть новый список, даже если сдвига нет"
    - name: Сдвиг больше длины
      code: |
        r = rotated(["Аня", "Борис", "Вера"], 5)
        assert r == ["Вера", "Аня", "Борис"], f"Сдвиг на 5 в очереди из трёх — то же, что на 2: ['Вера', 'Аня', 'Борис'], а вернулось {r}"
    - name: На месте — пример 2
      code: |
        q = ["Аня", "Борис", "Вера"]
        r = rotate(q, 5)
        assert q == ["Вера", "Аня", "Борис"], f"После rotate(q, 5) очередь должна стать ['Вера', 'Аня', 'Борис'], а она {q}"
        assert r is None, "rotate меняет список на месте и возвращает None, как sort"
    - name: На месте — полный круг
      code: |
        q = ["Аня", "Борис", "Вера", "Глеб"]
        rotate(q, 4)
        assert q == ["Аня", "Борис", "Вера", "Глеб"], f"Сдвиг на 4 в очереди из четырёх возвращает её к началу, а получилось {q}"
        rotate(q, 2)
        assert q == ["Вера", "Глеб", "Аня", "Борис"], f"После rotate(q, 2) ожидалось ['Вера', 'Глеб', 'Аня', 'Борис'], а получилось {q}"
    - name: Пустая очередь
      code: |
        q = []
        assert rotated(q, 3) == [], "rotated([], 3) — пустой список"
        rotate(q, 3)
        assert q == [], "rotate([], 3) оставляет список пустым"
    - name: Очень большой сдвиг
      code: |
        q = ["Аня", "Борис", "Вера", "Глеб"]
        assert rotated(q, 10**9 + 1) == ["Борис", "Вера", "Глеб", "Аня"], "rotated(q, 10**9 + 1) — то же, что сдвиг на 1"
        rotate(q, 10**9 + 1)
        assert q == ["Борис", "Вера", "Глеб", "Аня"], "rotate(q, 10**9 + 1) — то же, что сдвиг на 1"
hints:
  - level: 1
    text: 'Во что превратится очередь из четырёх человек после сдвига на 4 дня? А на 5? Сколько шагов на самом деле нужно сделать при `k = 10**9`?'
  - level: 2
    text: 'Лишние полные круги убирает остаток `k % len(duty)`. Но у пустого списка длина 0 — его обработайте отдельно. Один шаг на месте: убрать первого методом, который возвращает убранный элемент, и дописать его в конец.'
  - level: 3
    text: 'Для новой функции подумайте о срезах: какая часть очереди после сдвига окажется впереди, а какая — в конце? Склеить два списка можно через `+`.'
