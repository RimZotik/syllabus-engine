title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: duty-through-alias
  type: multi
  q: 'Дежурные: `team = ["Аня", "Борис"]`, затем `duty = team`. После какой следующей строки кода `print(team)` выведет три имени?'
  options:
  - '`duty.append("Вера")`'
  - '`duty += ["Вера"]`'
  - '`team = duty + ["Вера"]`'
  - '`duty = duty + ["Вера"]`'
  - '`duty = ["Аня", "Борис", "Вера"]`'
  answer:
  - 0
  - 1
  - 2
  explain: '`append` и `+=` у списка меняют сам общий список, поэтому правку через `duty` видно и через `team`. `team = duty + ["Вера"]` собирает новый список из трёх имён и привязывает к нему как раз `team` — его и печатают. `duty = duty + ["Вера"]` и `duty = ["Аня", "Борис", "Вера"]` привязывают к новому списку только `duty`, а `team` по-прежнему указывает на список из двух имён.'
- id: str-vs-list-plus-assign
  type: single
  q: |
    Что выведет программа?
    ```python
    s = "ко"
    t = s
    s += "т"
    nums = [1]
    m = nums
    nums += [2]
    print(t, m)
    ```
  options:
  - '`ко [1, 2]`'
  - '`кот [1, 2]`'
  - '`ко [1]`'
  - '`кот [1]`'
  answer: 0
  explain: 'Строка неизменяема, поэтому `s += "т"` собирает новую строку и привязывает к ней только `s`; `t` указывает на старую «ко». У списка `+=` меняет сам список, как `extend`, и изменение видно через `m`.'
- id: carts-is-equal
  type: multi
  q: |
    Какие выражения дают `True` после выполнения этого кода?
    ```python
    cart_a = ["хлеб", "сыр"]
    cart_b = ["хлеб", "сыр"]
    shared = cart_a
    shared.append("чай")
    ```
  options:
  - '`cart_a == shared`'
  - '`cart_a is shared`'
  - '`len(cart_b) == 2`'
  - '`cart_a == cart_b`'
  - '`cart_b is ["хлеб", "сыр"]`'
  answer:
  - 0
  - 1
  - 2
  explain: '`shared` — второе имя корзины `cart_a`, поэтому чай дописан в неё, и это одно и то же значение: и `is`, и `==` дают `True`. `cart_b` — отдельный список, его не трогали: в нём по-прежнему два товара, а значит, с `cart_a` он больше не равен, хотя в начале был равен. Запись `["хлеб", "сыр"]` справа от `is` создаёт ещё один новый список — с `cart_b` это не одно значение, даже при равном содержимом.'
- id: shallow-replace-vs-mutate
  type: single
  q: |
    Что выведет программа?
    ```python
    shelf = [["молоко"], ["хлеб"]]
    copy1 = list(shelf)
    copy1[0] = ["кефир"]
    copy1[1].append("батон")
    print(shelf)
    ```
  options:
  - "`[['молоко'], ['хлеб', 'батон']]`"
  - "`[['кефир'], ['хлеб', 'батон']]`"
  - "`[['молоко'], ['хлеб']]`"
  - "`[['кефир'], ['хлеб']]`"
  answer: 0
  explain: '`list(shelf)` — поверхностная копия: новый внешний список, но внутренние списки общие. `copy1[0] = ...` заменяет элемент только в новом внешнем списке. А `copy1[1].append(...)` меняет внутренний список, на который указывают оба внешних.'
- id: seats-rows
  type: multi
  q: Какие варианты создают зал из двух рядов по три свободных места `"."` так, что бронь места в одном ряду не появится в другом?
  options:
  - '`seats = []`, затем два раза `seats.append(["."] * 3)`'
  - '`seats = [["."] * 3, ["."] * 3]`'
  - '`row = ["."] * 3`, затем `seats = [row, row.copy()]`'
  - '`seats = [["."] * 3] * 2`'
  - '`seats = []`, `row = ["."] * 3`, затем два раза `seats.append(row)`'
  answer:
  - 0
  - 1
  - 2
  explain: 'Когда `["."] * 3` вычисляется дважды (два `append` или две такие записи в списке) или второй ряд — копия `row.copy()`, у каждого ряда свой список. Умножение `[...] * 2` даёт два псевдонима одного ряда. Два `append(row)` выглядят как два отдельных ряда, но `row` вычислен один раз, и дописан дважды один и тот же список — бронь `seats[0][1] = "X"` появится в обоих.'
- id: k2-fix-backup
  type: code
  q: |
    В первой строке — цены, во второй — новая цена первого товара. **Программа должна вывести цены до и после изменения, а сейчас обе строки одинаковые. Исправьте одну строку.**
    ```input
    100 250 40
    90
    ```
    ```output
    Было: [100, 250, 40]
    Стало: [90, 250, 40]
    ```
  starter: |
    prices = []
    for w in input().split():
        prices.append(int(w))
    backup = prices
    prices[0] = int(input())
    print("Было:", backup)
    print("Стало:", prices)
  solution: |
    prices = []
    for w in input().split():
        prices.append(int(w))
    backup = prices.copy()
    prices[0] = int(input())
    print("Было:", backup)
    print("Стало:", prices)
  tests:
    io:
    - name: Три товара
      stdin: "100 250 40\n90\n"
      stdout: "Было: [100, 250, 40]\nСтало: [90, 250, 40]"
    - name: Один товар
      stdin: "500\n450\n"
      stdout: "Было: [500]\nСтало: [450]"
      hidden: true
    - name: Цена выросла
      stdin: "70 70\n85\n"
      stdout: "Было: [70, 70]\nСтало: [85, 70]"
      hidden: true
  explain: |
    `backup = prices` не копирует список, а даёт ему второе имя, и замена элемента видна через оба. Копию делает `prices.copy()` (или `prices[:]`, `list(prices)`): для списка чисел поверхностной копии достаточно.
- id: k2-write-same-or-copy
  type: code
  q: |
    **Напишите `relation(a, b)` для двух списков: `"один список"`, если это одно и то же значение; `"копия"`, если это разные списки с равным содержимым; иначе `"разные"`.**
    ```python
    cart = ["хлеб", "сыр"]
    relation(cart, cart), relation(cart, cart.copy()), relation(cart, ["сыр"])
    ```
    ```output
    ('один список', 'копия', 'разные')
    ```
  starter: |
    def relation(a, b):
        if a == b:
            return "один список"
        return "разные"
  solution: |
    def relation(a, b):
        if a is b:
            return "один список"
        if a == b:
            return "копия"
        return "разные"
  tests:
    function: relation
    calls:
    - name: Разное содержимое
      args: [["хлеб"], ["сыр"]]
      expect: "разные"
    - name: Порядок важен
      args: [[1, 2], [2, 1]]
      expect: "разные"
    - name: Два пустых списка
      args: [[], []]
      expect: "копия"
    asserts:
    - name: Второе имя
      code: |
        cart = ["хлеб", "сыр"]
        other = cart
        r = relation(cart, other)
        assert r == "один список", "Для cart и other = cart нужно 'один список', а вернулось " + repr(r)
    - name: Копия
      code: |
        cart = ["хлеб", "сыр"]
        r = relation(cart, cart.copy())
        assert r == "копия", "Для cart и cart.copy() нужно 'копия', а вернулось " + repr(r)
  explain: |
    `is` отвечает, одно ли это значение, `==` — равно ли содержимое. Порядок проверок важен: один и тот же список всегда равен сам себе, поэтому сначала проверяют `is`, и только потом `==`.
- id: k2-change-delivery
  type: code
  q: |
    `with_delivery(cart)` добавляет в корзину `"доставка"`, но доставка появляется и в корзине покупателя. **Измените функцию: вернуть новый список, а переданную корзину не трогать.**
    ```python
    cart = ["хлеб"]
    with_delivery(cart), cart
    ```
    ```output
    (['хлеб', 'доставка'], ['хлеб'])
    ```
  starter: |
    def with_delivery(cart):
        cart += ["доставка"]
        return cart
  solution: |
    def with_delivery(cart):
        return cart + ["доставка"]
  tests:
    function: with_delivery
    no_mutate: true
    calls:
    - name: Результат
      args: [["хлеб", "сыр"]]
      expect: ["хлеб", "сыр", "доставка"]
    - name: Корзина покупателя не меняется
      args: [["чай"]]
      expect: ["чай", "доставка"]
    - name: Пустая корзина
      args: [[]]
      expect: ["доставка"]
  explain: |
    `cart` в функции — псевдоним списка покупателя, а `+=` у списка меняет сам список, как `extend`. `cart + ["доставка"]` собирает новый список, исходный остаётся прежним.
- id: k2-fix-upper-in-place
  type: code
  q: |
    **Исправьте `shout_all(words)`: заменить каждое слово в самом списке на то же слово заглавными буквами и ничего не возвращать, как `sort`.** Сейчас список после вызова не меняется.
    ```python
    words = ["стоп", "внимание"]
    shout_all(words)
    words
    ```
    ```output
    ['СТОП', 'ВНИМАНИЕ']
    ```
  starter: |
    def shout_all(words):
        for w in words:
            w = w.upper()
  solution: |
    def shout_all(words):
        for i in range(len(words)):
            words[i] = words[i].upper()
  tests:
    function: shout_all
    calls:
    - name: Список изменился
      args: [["стоп", "внимание"]]
      expect: null
      after: [["СТОП", "ВНИМАНИЕ"]]
    - name: Возвращает None
      args: [["да"]]
      expect: null
      after: [["ДА"]]
    - name: Пустой список
      args: [[]]
      expect: null
      after: [[]]
    asserts:
    - name: Тот же список, а не новый
      code: |
        words = ["а", "б", "в"]
        alias = words
        shout_all(words)
        assert alias == ["А", "Б", "В"], "Изменение должно быть видно через все имена списка, а через второе имя видно " + repr(alias)
  explain: |
    Строка неизменяема: `w.upper()` собирает новую строку, а `w = ...` привязывает к ней только имя цикла — элемент списка остаётся прежним. Менять нужно сам список, заменяя элементы по индексу: длина при этом не меняется, поэтому в цикле так можно.
- id: k2-fix-default-journal
  type: code
  q: |
    `add_mark(mark, journal)` дописывает оценку в журнал и возвращает его, а без журнала начинает новый. **Исправьте её: каждый вызов без журнала начинает новый журнал.** Сейчас второй вызов возвращает `[5, 3]`.
    ```python
    add_mark(5)
    add_mark(3)
    ```
    ```output
    [5]
    [3]
    ```
    Переданный журнал функция по-прежнему дописывает.
  starter: |
    def add_mark(mark, journal=[]):
        journal.append(mark)
        return journal
  solution: |
    def add_mark(mark, journal=None):
        if journal is None:
            journal = []
        journal.append(mark)
        return journal
  tests:
    function: add_mark
    calls:
    - name: Свой журнал
      args: [2, [4]]
      expect: [4, 2]
      after: [2, [4, 2]]
    asserts:
    - name: Два новых журнала
      code: |
        a = add_mark(5)
        b = add_mark(3)
        assert a == [5], "Первый вызов должен вернуть [5], а вернул " + repr(a)
        assert b == [3], "Второй вызов без журнала должен вернуть [3], а вернул " + repr(b)
    - name: Три вызова подряд
      code: |
        add_mark(5)
        add_mark(4)
        r = add_mark(3)
        assert r == [3], "Каждый вызов без журнала начинает новый: нужно [3], а вернулось " + repr(r)
  explain: |
    Значение по умолчанию вычисляется один раз, при выполнении `def`, поэтому все вызовы без журнала получают один и тот же список. Правильно — `None` по умолчанию и новый список внутри функции; проверяют `None` через `is`.
- id: k2-fix-student-tuple
  type: code
  q: |
    Ученик — кортеж `(имя, список оценок)`. **Исправьте `with_mark(student, mark)`: вернуть новый кортеж с дописанной оценкой, а переданного ученика не менять.** Сейчас оценка появляется и у исходного ученика.
    ```python
    anya = ("Аня", [5, 4])
    with_mark(anya, 3), anya
    ```
    ```output
    (('Аня', [5, 4, 3]), ('Аня', [5, 4]))
    ```
    Список оценок у нового кортежа свой: его правка не меняет исходного ученика.
  starter: |
    def with_mark(student, mark):
        student[1].append(mark)
        return student
  solution: |
    def with_mark(student, mark):
        name, marks = student
        return (name, marks + [mark])
  tests:
    function: with_mark
    no_mutate: true
    strict_types: true
    calls:
    - name: Оценка дописана
      args_py: "(('Аня', [5, 4]), 3)"
      expect_py: "('Аня', [5, 4, 3])"
    - name: Исходный ученик не меняется
      args_py: "(('Аня', [5]), 4)"
      expect_py: "('Аня', [5, 4])"
    asserts:
    - name: Список оценок у результата свой
      code: |
        boris = ("Борис", [])
        r = with_mark(boris, 5)
        r[1].append(2)
        assert boris == ("Борис", []), "Правка результата не должна менять исходного ученика, а он стал " + repr(boris)
    - name: Два вызова подряд
      code: |
        vera = ("Вера", [3])
        a = with_mark(vera, 4)
        b = with_mark(vera, 5)
        assert a == ("Вера", [3, 4]) and b == ("Вера", [3, 5]), "Нужно ('Вера', [3, 4]) и ('Вера', [3, 5]), а вернулось " + repr(a) + " и " + repr(b)
  explain: |
    Кортеж неизменяем — его элементы нельзя заменить, — но список внутри него меняться может: `append` дописал оценку в тот самый список, который виден и через исходный кортеж. `marks + [mark]` собирает новый список, а из имени и этого списка собирают новый кортеж.
- id: k2-write-move-task
  type: code
  q: |
    План — список списков дел по дням. **Напишите `move_task(plan, task, src, dst)`: вернуть новый план, где дело `task` убрано из дня с индексом `src` и дописано в конец дня `dst`.**
    ```call
    move_task([["зарядка", "уборка"], ["кино"]], "уборка", 0, 1)
    ```
    ```return
    [['зарядка'], ['кино', 'уборка']]
    ```
    Исходный план и его списки не меняются, а списки по дням у нового плана свои. Дело `task` в дне `src` точно есть; если таких несколько, переносится одно.
  starter: |
    def move_task(plan, task, src, dst):
        plan[src].remove(task)
        plan[dst].append(task)
        return plan
  solution: |
    import copy

    def move_task(plan, task, src, dst):
        result = copy.deepcopy(plan)
        result[src].remove(task)
        result[dst].append(task)
        return result
  tests:
    function: move_task
    no_mutate: true
    calls:
    - name: Перенос дела
      args: [[["зарядка", "уборка"], ["кино"]], "уборка", 0, 1]
      expect: [["зарядка"], ["кино", "уборка"]]
    - name: Повторяющееся дело
      args: [[["бег", "бег"], []], "бег", 0, 1]
      expect: [["бег"], ["бег"]]
    asserts:
    - name: Правка результата не видна в плане
      code: |
        plan = [["чтение"], [], ["бег"]]
        r = move_task(plan, "бег", 2, 1)
        r[0].append("кино")
        assert plan == [["чтение"], [], ["бег"]], "Списки дней результата не должны быть общими с планом, а план стал " + repr(plan)
        assert r == [["чтение", "кино"], ["бег"], []], "Нужно [['чтение', 'кино'], ['бег'], []], а получилось " + repr(r)
  explain: |
    Сначала нужна глубокая копия: с поверхностной `remove` и `append` поменяли бы списки дней, общие с исходным планом. Потом правки делаются уже в копии. `remove` убирает только первое такое дело.
- id: open-append-vs-plus
  type: open
  q: После `b = a` (где `a` — список) строка `a.append(5)` меняет и то, что видно через `b`, а строка `a = a + [5]` — нет. Объясните, почему так.
  rubric:
  - b = a не копирует список, а привязывает к тому же списку второе имя — псевдоним
  - append меняет сам этот единственный список, поэтому изменение видно через оба имени
  - a + [5] собирает новый список, и присваивание привязывает к нему только имя a; b по-прежнему указывает на старый список
  wrong_answers:
  - b = a создаёт копию, но append копирует изменения в обе копии
  - a = a + [5] меняет список, а append — нет
  - после a = a + [5] список b удаляется
  followups:
  - Что выведет print(b), если вместо a = a + [5] написать a += [5]?
