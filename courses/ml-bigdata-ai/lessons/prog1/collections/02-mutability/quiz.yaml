title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: rebind-then-append
  type: single
  q: |
    Что выведет программа?
    ```python
    week = [0, 0]
    plan = week
    plan = [5, 5]
    plan.append(1)
    print(week)
    ```
  options:
  - '`[0, 0]`'
  - '`[5, 5, 1]`'
  - '`[0, 0, 1]`'
  - '`[5, 5]`'
  answer: 0
  explain: 'Сначала `plan` — псевдоним `week`. Но `plan = [5, 5]` привязывает имя `plan` к новому списку, и связь со старым пропадает. `append` меняет уже новый список, а `week` указывает на прежний `[0, 0]`.'
- id: duty-through-alias
  type: multi
  q: 'Дежурные: `team = ["Аня", "Борис"]`, затем `duty = team`. После какой следующей строки кода `print(team)` выведет три имени?'
  options:
  - '`duty.append("Вера")`'
  - '`duty += ["Вера"]`'
  - '`team = duty + ["Вера"]`'
  - '`duty = duty + ["Вера"]`'
  - '`duty = ["Аня", "Борис", "Вера"]`'
  answer:
  - 0
  - 1
  - 2
  explain: '`append` и `+=` у списка меняют сам общий список, поэтому правку через `duty` видно и через `team`. `team = duty + ["Вера"]` собирает новый список из трёх имён и привязывает к нему как раз `team` — его и печатают. `duty = duty + ["Вера"]` и `duty = ["Аня", "Борис", "Вера"]` привязывают к новому списку только `duty`, а `team` по-прежнему указывает на список из двух имён.'
- id: str-vs-list-plus-assign
  type: single
  q: |
    Что выведет программа?
    ```python
    s = "ко"
    t = s
    s += "т"
    nums = [1]
    m = nums
    nums += [2]
    print(t, m)
    ```
  options:
  - '`ко [1, 2]`'
  - '`кот [1, 2]`'
  - '`ко [1]`'
  - '`кот [1]`'
  answer: 0
  explain: 'Строка неизменяема, поэтому `s += "т"` собирает новую строку и привязывает к ней только `s`; `t` указывает на старую «ко». У списка `+=` меняет сам список, как `extend`, и изменение видно через `m`.'
- id: carts-is-equal
  type: multi
  q: |
    Какие выражения дают `True` после выполнения этого кода?
    ```python
    cart_a = ["хлеб", "сыр"]
    cart_b = ["хлеб", "сыр"]
    shared = cart_a
    shared.append("чай")
    ```
  options:
  - '`cart_a == shared`'
  - '`cart_a is shared`'
  - '`len(cart_b) == 2`'
  - '`cart_a == cart_b`'
  - '`cart_b is ["хлеб", "сыр"]`'
  answer:
  - 0
  - 1
  - 2
  explain: '`shared` — второе имя корзины `cart_a`, поэтому чай дописан в неё, и это одно и то же значение: и `is`, и `==` дают `True`. `cart_b` — отдельный список, его не трогали: в нём по-прежнему два товара, а значит, с `cart_a` он больше не равен, хотя в начале был равен. Запись `["хлеб", "сыр"]` справа от `is` создаёт ещё один новый список — с `cart_b` это не одно значение, даже при равном содержимом.'
- id: clean-same-list
  type: single
  q: |
    Что выведет программа?
    ```python
    def clean(lines):
        while "" in lines:
            lines.remove("")
        return lines

    notes = ["купить хлеб", "", "позвонить"]
    result = clean(notes)
    expected = ["купить хлеб", "позвонить"]
    print(result is notes, result == expected, expected is notes)
    ```
  options:
  - '`True True False`'
  - '`False True False`'
  - '`True True True`'
  - '`False False False`'
  answer: 0
  explain: '`clean` удаляет пустые строки из самого переданного списка и возвращает его же, поэтому `result` и `notes` — одно значение. Содержимое совпадает с `expected`, но `expected` — отдельный список: равные списки не становятся одним значением. `False True False` получилось бы, если бы функция собирала новый список.'
- id: shallow-replace-vs-mutate
  type: single
  q: |
    Что выведет программа?
    ```python
    shelf = [["молоко"], ["хлеб"]]
    copy1 = list(shelf)
    copy1[0] = ["кефир"]
    copy1[1].append("батон")
    print(shelf)
    ```
  options:
  - "`[['молоко'], ['хлеб', 'батон']]`"
  - "`[['кефир'], ['хлеб', 'батон']]`"
  - "`[['молоко'], ['хлеб']]`"
  - "`[['кефир'], ['хлеб']]`"
  answer: 0
  explain: '`list(shelf)` — поверхностная копия: новый внешний список, но внутренние списки общие. `copy1[0] = ...` заменяет элемент только в новом внешнем списке. А `copy1[1].append(...)` меняет внутренний список, на который указывают оба внешних.'
- id: protect-backup
  type: multi
  q: |
    После правки меню испортилась и резервная копия. Чем заменить строку `backup = menu.copy()`, чтобы правка `menu[0].append("хлеб")` не была видна через `backup`?
    ```python
    import copy

    menu = [["суп", "салат"], ["каша"]]
    backup = menu.copy()
    menu[0].append("хлеб")
    ```
  options:
  - '`backup = copy.deepcopy(menu)`'
  - '`backup = [menu[0].copy(), menu[1].copy()]`'
  - '`backup = menu[:]`'
  - '`backup = list(menu)`'
  - '`backup = [menu.copy()[0], menu.copy()[1]]`'
  answer:
  - 0
  - 1
  explain: 'Правка меняет внутренний список, поэтому копировать нужно и внутренние списки. Это делает `deepcopy`, и то же самое вручную — новый внешний список из копий обеих строк. Срез и `list(...)` — такие же поверхностные копии, как `copy()`: внешний список новый, а строки меню общие. В записи `menu.copy()[0]` копируется внешний список, а из копии берётся тот же самый внутренний — строки меню снова общие.'
- id: seats-rows
  type: multi
  q: Какие варианты создают зал из двух рядов по три свободных места `"."` так, что бронь места в одном ряду не появится в другом?
  options:
  - '`seats = []`, затем два раза `seats.append(["."] * 3)`'
  - '`seats = [["."] * 3, ["."] * 3]`'
  - '`row = ["."] * 3`, затем `seats = [row, row.copy()]`'
  - '`seats = [["."] * 3] * 2`'
  - '`seats = []`, `row = ["."] * 3`, затем два раза `seats.append(row)`'
  answer:
  - 0
  - 1
  - 2
  explain: 'Когда `["."] * 3` вычисляется дважды (два `append` или две такие записи в списке) или второй ряд — копия `row.copy()`, у каждого ряда свой список. Умножение `[...] * 2` даёт два псевдонима одного ряда. Два `append(row)` выглядят как два отдельных ряда, но `row` вычислен один раз, и дописан дважды один и тот же список — бронь `seats[0][1] = "X"` появится в обоих.'
- id: which-spoil
  type: multi
  q: |
    Вызовы каких функций изменят список, переданный им аргументом?
    ```python
    def two_cheapest(prices):
        return sorted(prices)[:2]

    def first_two_sorted(prices):
        prices.sort()
        return prices[:2]

    def lowest_with_gift(prices):
        prices = prices + [0]
        return min(prices)

    def lowest_including_gift(prices):
        prices += [0]
        return min(prices)
    ```
  options:
  - '`two_cheapest`'
  - '`first_two_sorted`'
  - '`lowest_with_gift`'
  - '`lowest_including_gift`'
  answer:
  - 1
  - 3
  explain: '`prices` — псевдоним аргумента. `sort` и `+=` у списка меняют сам этот список — изменение увидит тот, кто вызвал функцию. `sorted` и `prices + [0]` собирают новые списки, и исходный не трогают.'
- id: shared-default-reveal
  type: single
  q: |
    Какие два вызова подряд (в новой программе) покажут ошибку этой функции — один из них вернёт список, где есть чужая оценка?
    ```python
    def add_mark(mark, journal=[]):
        journal.append(mark)
        return journal
    ```
  options:
  - '`add_mark(5)`, затем `add_mark(3)`'
  - '`add_mark(5, [])`, затем `add_mark(3, [])`'
  - '`add_mark(5)`, затем `add_mark(3, [4])`'
  - '`add_mark(5, [4])`, затем `add_mark(3)`'
  answer: 0
  explain: 'Список по умолчанию создан один раз, при выполнении `def`, и общим он становится только для вызовов без второго аргумента. Ошибку видно, когда таких вызовов два: второй вернёт `[5, 3]`. Если хотя бы в одном вызове передан свой список, этот вызов с общим списком не встречается: `add_mark(3, [4])` вернёт `[4, 3]`, а `add_mark(3)` после `add_mark(5, [4])` — `[3]`.'
- id: open-append-vs-plus
  type: open
  q: После `b = a` (где `a` — список) строка `a.append(5)` меняет и то, что видно через `b`, а строка `a = a + [5]` — нет. Объясните, почему так.
  rubric:
  - b = a не копирует список, а привязывает к тому же списку второе имя — псевдоним
  - append меняет сам этот единственный список, поэтому изменение видно через оба имени
  - a + [5] собирает новый список, и присваивание привязывает к нему только имя a; b по-прежнему указывает на старый список
  wrong_answers:
  - b = a создаёт копию, но append копирует изменения в обе копии
  - a = a + [5] меняет список, а append — нет
  - после a = a + [5] список b удаляется
  followups:
  - Что выведет print(b), если вместо a = a + [5] написать a += [5]?
