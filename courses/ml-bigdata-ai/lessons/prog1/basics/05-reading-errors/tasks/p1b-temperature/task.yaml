id: p1b-temperature
title: Градусы Цельсия в Фаренгейты
sandbox: python-browser
difficulty: 2
statement: |
  **Переведите температуру из градусов Цельсия в градусы Фаренгейта.**

  На вход подаётся одна строка — температура в градусах Цельсия: целое или дробное число через точку. В конце может стоять латинская буква `C`, например `36.6C`. Формула: `F = C * 9 / 5 + 32`. Выведите F ровно с одним знаком после точки — формат `:.1f`.

  Пример 1

  ```input
  100
  ```
  ```output
  212.0
  ```

  Пример 2

  ```input
  36.6C
  ```
  ```output
  97.9
  ```

  Стартовый код падает на примере 2: прочитайте сообщение об ошибке и исправьте то, на что оно указывает.
starter: |
  celsius = float(input())
  fahrenheit = celsius * 9 / 5 + 32
  print(f"{fahrenheit:.1f}")
stdin: "36.6C\n"
solution: |
  celsius = float(input().replace("C", ""))
  fahrenheit = celsius * 9 / 5 + 32
  print(f"{fahrenheit:.1f}")
tests:
  io:
    - name: Пример 1
      stdin: "100\n"
      stdout: "212.0"
    - name: Пример 2
      stdin: "36.6C\n"
      stdout: "97.9"
    - name: Дробное без буквы
      stdin: "36.6\n"
      stdout: "97.9"
      hidden: true
    - name: Отрицательная температура с буквой C
      stdin: "-12.5C\n"
      stdout: "9.5"
      hidden: true
    - name: Ноль с буквой C
      stdin: "0C\n"
      stdout: "32.0"
      hidden: true
    - name: Минус сорок
      stdin: "-40\n"
      stdout: "-40.0"
      hidden: true
hints:
  - level: 1
    text: Сообщение — `ValueError` в строке 1. Что в его тексте сказано о строке `'36.6C'`?
  - level: 2
    text: '`float` понимает только запись числа, а буква `C` в неё не входит. Её нужно убрать до того, как передать строку в `float`. Каким методом строки заменяют один кусок текста на другой?'
  - level: 3
    text: '`replace` умеет заменять кусок текста на пустую строку `""`, то есть удалять его. Вызовите его у результата `input()` ещё до `float`.'
