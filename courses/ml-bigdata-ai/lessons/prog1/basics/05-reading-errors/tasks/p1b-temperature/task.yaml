id: p1b-temperature
title: Градусы Цельсия в Фаренгейты
sandbox: python-browser
difficulty: 2
statement: |
  На вход подаётся показание термометра в градусах Цельсия — целое или дробное число (через точку). Старые термометры пишут только число, а новые добавляют в конце латинскую букву `C`, например `36.6C`. Переведите температуру в градусы Фаренгейта: умножить на 9, разделить на 5 и прибавить 32. Выведите результат с одним знаком после точки — формат `:.1f`, как `:.2f`, только с одним знаком.

  ```input
  100
  ```
  ```
  212.0
  ```

  Второй пример:

  ```input
  36.6C
  ```
  ```
  97.9
  ```

  Стартовый код проходит первый пример, но на втором падает. Запустите его на вводе `36.6C`, прочитайте сообщение об ошибке — что за тип, в какой строке, о каком значении речь — и исправьте.
starter: |
  celsius = float(input())
  fahrenheit = celsius * 9 / 5 + 32
  print(f"{fahrenheit:.1f}")
stdin: "36.6C\n"
solution: |
  celsius = float(input().replace("C", ""))
  fahrenheit = celsius * 9 / 5 + 32
  print(f"{fahrenheit:.1f}")
tests:
  io:
    - name: Целое число без буквы
      stdin: "100\n"
      stdout: "212.0"
    - name: Дробное с буквой C
      stdin: "36.6C\n"
      stdout: "97.9"
    - name: Дробное без буквы
      stdin: "36.6\n"
      stdout: "97.9"
      hidden: true
    - name: Отрицательная температура с буквой C
      stdin: "-12.5C\n"
      stdout: "9.5"
      hidden: true
    - name: Ноль с буквой C
      stdin: "0C\n"
      stdout: "32.0"
      hidden: true
    - name: Минус сорок
      stdin: "-40\n"
      stdout: "-40.0"
      hidden: true
hints:
  - level: 1
    text: Сообщение — `ValueError` в строке 1. Что в его тексте сказано о строке `'36.6C'`?
  - level: 2
    text: '`float` понимает только запись числа, а буква `C` в неё не входит. Её нужно убрать до того, как передать строку в `float`. Каким методом строки заменяют один кусок текста на другой?'
  - level: 3
    text: '`replace` умеет заменять кусок текста на пустую строку `""`, то есть удалять его. Вызовите его у результата `input()` ещё до `float`.'
