id: p1b-temperature
title: Градусы Цельсия в Фаренгейты
sandbox: python-browser
difficulty: 2
statement: |
  На вход подаётся температура в градусах Цельсия. Это может быть целое или дробное число, причём дробная часть отделена точкой или запятой — данные пишут разные люди. Переведите её в градусы Фаренгейта по формуле: умножить на 9, разделить на 5 и прибавить 32. Выведите результат с одним знаком после точки.

  Пример. Ввод: `100`. Вывод: `212.0`

  Второй пример. Ввод: `36,6`. Вывод: `97.9`

  Стартовый код проходит первый пример, но на втором падает. Запустите его на вводе `36,6`, прочитайте сообщение об ошибке — что за тип, в какой строке, о каком значении речь — и исправьте.
starter: |
  celsius = float(input())
  fahrenheit = celsius * 9 / 5 + 32
  print(f"{fahrenheit:.1f}")
stdin: "36,6\n"
solution: |
  celsius = float(input().replace(",", "."))
  fahrenheit = celsius * 9 / 5 + 32
  print(f"{fahrenheit:.1f}")
tests:
  io:
    - name: Целое число
      stdin: "100\n"
      stdout: "212.0"
    - name: Дробное через запятую
      stdin: "36,6\n"
      stdout: "97.9"
    - name: Дробное через точку
      stdin: "36.6\n"
      stdout: "97.9"
      hidden: true
    - name: Отрицательная температура с запятой
      stdin: "-12,5\n"
      stdout: "9.5"
      hidden: true
    - name: Минус сорок
      stdin: "-40\n"
      stdout: "-40.0"
      hidden: true
hints:
  - level: 1
    text: Сообщение — ValueError в строке 1. Что в его тексте сказано о строке '36,6'?
  - level: 2
    text: float понимает только точку. Строку нужно привести к правильному виду до того, как передать её в float. Каким методом строки заменяют один символ на другой?
  - level: 3
    text: celsius = float(input().replace(",", ".")).
