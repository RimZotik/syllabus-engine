id: p1b-fix-run
title: Почините программу по сообщениям об ошибках
sandbox: python-browser
difficulty: 2
statement: |
  Программа читает имя и возраст и должна вывести три строки: `Привет, <имя>!`, затем `Через 10 лет вам будет <возраст + 10>`, затем `Пока!`.

  ```input
  Аня
  20
  ```
  ```
  Привет, Аня!
  Через 10 лет вам будет 30
  Пока!
  ```

  В коде несколько ошибок, и Python показывает их по одной. Нажимайте «Запустить», читайте сообщение — тип, номер строки и текст, — исправляйте ровно то, на что оно указывает, и запускайте снова. Логику программы менять не нужно.
starter: |
  name = input("Имя: ")
  age = int(input("Возраст: ")
  print("Привет, " + name + "!")
    print("Через 10 лет вам будет", age + 10)
  prnt("Пока!")
stdin: "Аня\n20\n"
solution: |
  name = input("Имя: ")
  age = int(input("Возраст: "))
  print("Привет, " + name + "!")
  print("Через 10 лет вам будет", age + 10)
  print("Пока!")
tests:
  io:
    - name: Пример из условия
      stdin: "Аня\n20\n"
      stdout: "Привет, Аня!\nЧерез 10 лет вам будет 30\nПока!"
    - name: Другой возраст
      stdin: "Борис\n7\n"
      stdout: "Привет, Борис!\nЧерез 10 лет вам будет 17\nПока!"
    - name: Возраст ноль
      stdin: "Ю\n0\n"
      stdout: "Привет, Ю!\nЧерез 10 лет вам будет 10\nПока!"
      hidden: true
hints:
  - level: 1
    text: Первое сообщение — `SyntaxError` в строке 2. Что в нём сказано про скобку? Посчитайте открывающие и закрывающие скобки в этой строке.
  - level: 2
    text: После скобки придёт `IndentationError` — `unexpected indent`. Строки кода в этой программе должны начинаться с самого края.
  - level: 3
    text: Последнее сообщение — `NameError` — `name 'prnt' is not defined`. Это опечатка в имени функции вывода.
