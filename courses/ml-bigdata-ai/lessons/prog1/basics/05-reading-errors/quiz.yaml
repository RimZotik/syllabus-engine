title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: read-first
  type: single
  q: Какое утверждение о сообщении об ошибке (traceback) НЕВЕРНО?
  options:
  - Тип ошибки стоит в последней строке сообщения, перед двоеточием
  - Номер строки кода указан над последней строкой, после слова `line`
  - Первая строка `Traceback (most recent call last)` говорит, что ошибка в первой строке программы
  - Значки `~` и `^` под строкой кода показывают, на каком выражении программа упала
  answer: 2
  explain: '`Traceback (most recent call last)` значит «последний вызов — внизу»: это заголовок, а не адрес ошибки. Что случилось — в последней строке, где — в строке с `line` над ней.'
- id: name-typo
  type: multi
  q: Какие из этих ситуаций приведут к `NameError`? Выберите все.
  options:
  - В коде написано `totl` вместо `total`
  - Имя используется в строке выше той, где его создают
  - Вызвали `math.sqrt(2)`, забыв `import math`
  - К строке из `input()` прибавили число
  - '`int` получил строку `"abc"`'
  answer:
  - 0
  - 1
  - 2
  explain: '`NameError` — Python не знает имени: опечатка, имя ещё не создано или не подключён модуль, и тогда неизвестно имя `math`. Строка плюс число — это `TypeError`, а `int("abc")` — `ValueError`.'
- id: syntax-nothing-runs
  type: single
  q: |
    Что увидит пользователь, запустив эту программу?
    ```python
    print("Старт")
    a = 1
    b = 2
    print(a + b
    print("Конец")
    ```
  options:
  - '`Старт`, а потом сообщение `SyntaxError`'
  - Только сообщение `SyntaxError` — программа не запустится
  - '`Старт` и ничего больше'
  - Программа выполнится, пропустив строку 4
  answer: 1
  explain: Синтаксические ошибки Python находит, прежде чем выполнить первую строку кода, поэтому не выполняется ничего.
  traps: [0]
- id: type-concat
  type: single
  q: |
    Что случится при запуске?
    ```python
    age = "18"
    print("Вам " + age + " лет")
    print("Через год: " + age + 1)
    ```
  options:
  - Выведется `Вам 18 лет`, затем `TypeError` в строке 3
  - Сразу `TypeError` в строке 2 — строки с числами не склеивают
  - 'Выведутся `Вам 18 лет` и `Через год: 181`'
  - Только `SyntaxError` — программа не запустится
  answer: 0
  explain: '`age` — строка `"18"`, поэтому вторая строка кода склеивает три строки и работает. В третьей к строке прибавляют число `1` — это `TypeError`. Записана программа правильно, так что `SyntaxError` нет.'
- id: value-int
  type: single
  q: |
    Пользователь ввёл `12a`. Что случится?
    ```python
    n = int(input())
    ```
  options:
  - '`n` укажет на `12`, а буква отбросится'
  - Остановится с `ValueError`, потому что в строке не запись целого числа
  - Остановится с `TypeError`, потому что `int` не принимает строки
  - '`n` укажет на строку `12a`'
  answer: 1
  explain: Тип правильный — строка, — но значение не годится для `int`. Это `ValueError`.
- id: eof-cause
  type: single
  q: При проверке задачи программа упала с `EOFError`. Что это почти наверняка значит?
  options:
  - В программе опечатка в имени `input`
  - Программа вызывает `input()` больше раз, чем строк ввода в тесте
  - Пользователь ввёл буквы вместо цифр
  - Тест подал пустую строку, а `int` её не понимает
  answer: 1
  explain: '`EOFError` — ввод закончился, а программа ждёт ещё строку. Обычно это значит, что ввод читается не так, как сказано в условии.'
- id: run-time-errors
  type: multi
  q: Какие из этих ошибок Python обнаруживает только во время работы программы, а не до запуска? Выберите все.
  options:
  - '`NameError`'
  - "`SyntaxError: '(' was never closed`"
  - '`TypeError`'
  - '`IndentationError: unexpected indent`'
  - '`ValueError`'
  answer:
  - 0
  - 2
  - 4
  explain: '`SyntaxError` и `IndentationError` находятся при чтении программы, до запуска. Остальные — исключения во время работы.'
- id: hint-guess
  type: single
  q: |
    Программа:
    ```python
    total = price * 3
    price = 100
    ```
    Python пишет:
    ```
    NameError: name 'price' is not defined. Did you mean: 'print'?
    ```
    Что делать?
  options:
  - 'Заменить `price` на `print`: Python сам нашёл, какое имя здесь имелось в виду'
  - 'Не верить подсказке: создать `price` раньше строки, где оно используется'
  - 'Переименовать `price` в `Price`: имя с маленькой буквы совпало со встроенным'
  - 'Добавить `import price`: Python не нашёл имя, потому что модуль не подключён'
  answer: 1
  explain: Подсказка лишь нашла похожее по написанию имя. Программа идёт сверху вниз, и в первой строке кода имени `price` ещё нет.
- id: line-number
  type: single
  q: |
    Сообщение об ошибке:
    ```
    Traceback (most recent call last):
      File "main.py", line 3, in <module>
        print("Итого: " + total)
              ~~~~~~~~~~^~~~~~~
    TypeError: can only concatenate str (not "int") to str
    ```
    Где искать ошибку?
  options:
  - В строке кода 3 — `total` указывает на число, а его склеивают со строкой
  - В строке кода 3 — `total` указывает на строку, а к ней прибавляют число
  - В строке кода 2 — Python показывает строку, следующую за ошибочной
  - В строке кода 3 — в ней не хватает закрывающей кавычки
  answer: 0
  explain: '`line 3` — номер строки кода, где случилась ошибка. Текст «склеивать можно только str (не int) со str» говорит, что к строке `"Итого: "` пытаются прибавить `int` — значит, `total` указывает на число. Незакрытая кавычка дала бы `SyntaxError`.'
- id: open-traceback
  type: open
  q: |
    Программа:
    ```python
    age = input()
    print(age + 1)
    ```
    Python сообщает:
    ```
    Traceback (most recent call last):
      File "main.py", line 2, in <module>
        print(age + 1)
              ~~~~^~~
    TypeError: can only concatenate str (not "int") to str
    ```
    Расскажите по шагам, как вы читаете это сообщение, в чём причина и как исправить.
  rubric:
  - начинает с последней строки — тип TypeError и текст о склеивании строки с целым числом
  - находит место — строка кода 2, выражение age + 1
  - называет причину — input() вернул строку, а к строке прибавляют число 1
  - предлагает исправление — age = int(input()) (или int(age) + 1)
  wrong_answers:
  - нужно поставить кавычки вокруг 1, чтобы получилось сложение
  - ошибка в строке 1, потому что input написан неправильно
  followups:
  - Что выведет программа, если исправить её на print(age + "1") при вводе 20?
