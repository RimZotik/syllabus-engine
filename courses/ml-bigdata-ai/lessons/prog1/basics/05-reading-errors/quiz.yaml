title: Проверка темы
pass: 0.85
minutes: 25
questions:
- id: read-first
  type: single
  q: Какое утверждение о сообщении об ошибке (traceback) НЕВЕРНО?
  options:
  - Тип ошибки стоит в последней строке сообщения, перед двоеточием
  - Номер строки кода указан над последней строкой, после слова `line`
  - Первая строка `Traceback (most recent call last)` говорит, что ошибка в первой строке программы
  - Значки `~` и `^` под строкой кода показывают, на каком выражении программа упала
  answer: 2
  explain: '`Traceback (most recent call last)` значит «последний вызов — внизу»: это заголовок, а не адрес ошибки. Что случилось — в последней строке, где — в строке с `line` над ней.'
- id: name-typo
  type: multi
  q: Какие из этих ситуаций приведут к `NameError`? Выберите все.
  options:
  - В коде написано `totl` вместо `total`
  - Имя используется в строке выше той, где его создают
  - Вызвали `math.sqrt(2)`, забыв `import math`
  - К строке из `input()` прибавили число
  - '`int` получил строку `"abc"`'
  answer:
  - 0
  - 1
  - 2
  explain: '`NameError` — Python не знает имени: опечатка, имя ещё не создано или не подключён модуль, и тогда неизвестно имя `math`. Строка плюс число — это `TypeError`, а `int("abc")` — `ValueError`.'
- id: syntax-nothing-runs
  type: single
  q: |
    Что увидит пользователь, запустив эту программу?
    ```python
    print("Старт")
    a = 1
    b = 2
    print(a + b
    print("Конец")
    ```
  options:
  - '`Старт`, а потом сообщение `SyntaxError`'
  - Только сообщение `SyntaxError` — программа не запустится
  - '`Старт` и ничего больше'
  - Программа выполнится, пропустив строку 4
  answer: 1
  explain: Синтаксические ошибки Python находит, прежде чем выполнить первую строку кода, поэтому не выполняется ничего.
  traps: [0]
- id: fix-type-concat
  type: code
  q: |
    Программа читает возраст и должна вывести `Через 5 лет вам будет <возраст + 5>`. Она падает:
    ```
    TypeError в строке 2: can only concatenate str (not "int") to str
    ```
    Исправьте её.
  starter: |
    age = int(input())
    print("Через 5 лет вам будет " + age + 5)
  solution: |
    age = int(input())
    print("Через 5 лет вам будет", age + 5)
  tests:
    io:
      - name: Пример
        stdin: "20\n"
        stdout: "Через 5 лет вам будет 25"
      - name: Новорождённый
        stdin: "0\n"
        stdout: "Через 5 лет вам будет 5"
      - name: Сто лет
        stdin: "95\n"
        stdout: "Через 5 лет вам будет 100"
        hidden: true
  explain: 'Сообщение говорит: к строке пытаются прибавить `int`. `+` выполняется слева направо, и первым идёт `"Через 5 лет вам будет " + age` — текст плюс число. Сначала нужно сложить числа `age + 5`, а потом вывести через запятую в `print`, через `str(age + 5)` или f-строкой. `str(age) + str(5)` дало бы `205`.'
- id: hint-guess
  type: code
  q: |
    Программа читает цену товара и количество — целые числа, каждое в своей строке — и должна вывести `Стоимость: <цена × количество>`. На компьютере она упала:
    ```
    Traceback (most recent call last):
      File "C:\work\shop.py", line 1, in <module>
        total = price * count
                ^^^^^
    NameError: name 'price' is not defined. Did you mean: 'print'?
    ```
    Исправьте её.
  starter: |
    total = price * count
    price = int(input())
    count = int(input())
    print("Стоимость:", total)
  solution: |
    price = int(input())
    count = int(input())
    total = price * count
    print("Стоимость:", total)
  tests:
    io:
      - name: Пример
        stdin: "250\n3\n"
        stdout: "Стоимость: 750"
      - name: Одна штука
        stdin: "99\n1\n"
        stdout: "Стоимость: 99"
      - name: Ноль штук
        stdin: "120\n0\n"
        stdout: "Стоимость: 0"
        hidden: true
  explain: 'Подсказка «Did you mean: ''print''?» — только догадка по похожему написанию: с `print` вместо `price` программа упала бы уже с `TypeError`. Программа идёт сверху вниз, и в строке 1 имени `price` ещё нет — его создают строкой ниже. Считать стоимость нужно после того, как прочитаны оба числа.'
- id: fix-eof
  type: code
  q: |
    Условие задачи: на вход подаются длина и ширина комнаты в метрах — целые числа, каждое в своей строке; выведите площадь. Программу переделали из задачи про объём комнаты, и на тесте она падает:
    ```
    EOFError в строке 3: входные данные закончились: программа ждёт больше строк, чем ей дали
    ```
    Исправьте её.
  starter: |
    length = int(input())
    width = int(input())
    height = int(input())
    area = length * width
    print(area)
  solution: |
    length = int(input())
    width = int(input())
    area = length * width
    print(area)
  tests:
    io:
      - name: Пример
        stdin: "5\n4\n"
        stdout: "20"
      - name: Квадратная комната
        stdin: "3\n3\n"
        stdout: "9"
      - name: Коридор
        stdin: "10\n1\n"
        stdout: "10"
        hidden: true
  explain: '`EOFError` в строке 3 — третий `input()` ждёт строку, которой во вводе нет: по условию строк две. Высота для площади не нужна, лишнее чтение убирают.'
- id: fix-value-space
  type: code
  q: |
    Программа читает сумму покупки и выводит ежемесячный платёж при рассрочке на 4 месяца — с двумя знаками после точки. Банк присылает суммы с пробелами между тысячами, и на вводе `12 500.40` программа упала:
    ```
    ValueError в строке 1: could not convert string to float: '12 500.40'
    ```
    Исправьте её, чтобы она принимала и такие суммы, и обычные, например `900`.
  starter: |
    amount = float(input())
    print(f"{amount / 4:.2f}")
  solution: |
    amount = float(input().replace(" ", ""))
    print(f"{amount / 4:.2f}")
  tests:
    io:
      - name: Пример из условия
        stdin: "12 500.40\n"
        stdout: "3125.10"
      - name: Сумма без пробелов
        stdin: "900\n"
        stdout: "225.00"
      - name: Миллион
        stdin: "1 000 000\n"
        stdout: "250000.00"
        hidden: true
  explain: '`ValueError` — тип верный, строка, но такую строку `float` не разбирает: пробел посреди числа ему мешает (пробелы по краям он простил бы). Пробелы убирают до преобразования — `input().replace(" ", "")`.'
- id: fix-three-errors
  type: code
  q: |
    Программа считает стоимость заправки. На вход подаются литры (число через точку) и цена литра в рублях (целое), каждое в своей строке. Вывод — `Итого: <сумма> руб.`, сумма — ровно с двумя знаками после точки. Для `12.5` и `56` — `Итого: 700.00 руб.` В программе три ошибки разных типов. Запускайте её на этом примере, читайте сообщения и исправляйте по одной.
  starter: |
    liters = int(input())
    price = int(input())
      total = liters * Price
    print(f"Итого: {total:.2f} руб.")
  solution: |
    liters = float(input())
    price = int(input())
    total = liters * price
    print(f"Итого: {total:.2f} руб.")
  tests:
    io:
      - name: Пример из условия
        stdin: "12.5\n56\n"
        stdout: "Итого: 700.00 руб."
      - name: Целое число литров
        stdin: "40\n55\n"
        stdout: "Итого: 2200.00 руб."
      - name: Поллитра
        stdin: "0.5\n61\n"
        stdout: "Итого: 30.50 руб."
        hidden: true
  explain: 'Первым придёт `IndentationError` в строке 3: синтаксические ошибки Python находит до запуска. Потом `ValueError` в строке 1: `int` не разбирает `"12.5"`, литры дробные, нужен `float`. Последним — `NameError`: имени `Price` с большой буквы нет, регистр важен.'
