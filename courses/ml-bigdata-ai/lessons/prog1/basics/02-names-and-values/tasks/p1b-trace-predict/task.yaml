id: p1b-trace-predict
title: Трассировка вручную
sandbox: python-browser
difficulty: 1
statement: |
  Вот программа:
  ```python
  a = 3
  b = a * 2
  a = a + b
  b = b - a
  print(a, b)
  ```

  Не запуская её, выпишите на бумаге, на что указывают `a` и `b` после каждой строки кода. Потом напишите свою программу из одной строки: `print` с готовым ответом в кавычках — ровно тем, что вывела бы программа выше.

  Имена `a` и `b` в вашем решении использовать нельзя: задача — проследить код самому, а не переписать его.
starter: |
  print("")
solution: |
  print("9 -3")
tests:
  forbid: [a, b]
  io:
    - name: Вывод совпадает
      stdin: ""
      stdout: "9 -3"
hints:
  - level: 1
    text: После строки `b = a * 2` имя `a` всё ещё указывает на 3. На что указывает `b`?
  - level: 2
    text: В строке `a = a + b` сначала вычисляется правая часть со старыми значениями — `3 + 6`. После неё `a` указывает на 9, а `b` не изменилось.
  - level: 3
    text: В последнем присваивании `b = b - a` используется уже новое `a`. Вычислите `6 - 9`.
