id: p1b-trace-predict
title: Трассировка вручную
sandbox: python-browser
difficulty: 2
statement: |
  Вот программа:
  ```python
  a = int(input())
  b = a * 2
  a = a + b
  b = b - a
  print(a, b)
  ```

  Сначала предскажите на бумаге, что она выведет для ввода `3`: выпишите, на что указывают `a` и `b` после каждой строки кода. Потом проверьте себя кнопкой «По шагам». Затем повторите для ввода `5` и заметьте закономерность: как выведенные числа связаны с введённым?

  Напишите свою короткую программу, которая для любого целого числа на входе выводит ровно то же, что программа выше, — но без имён `a` и `b` и без повторения её шагов: прочитайте число и сразу выведите ответ по найденной закономерности.

  ```input
  3
  ```
  ```
  9 -3
  ```
starter: |
  n = int(input())
  print(n, n)
stdin: "3\n"
solution: |
  n = int(input())
  print(n * 3, -n)
tests:
  forbid: [a, b]
  io:
    - name: Пример из условия
      stdin: "3\n"
      stdout: "9 -3"
    - name: Другое число
      stdin: "5\n"
      stdout: "15 -5"
      hidden: true
    - name: Ноль
      stdin: "0\n"
      stdout: "0 0"
      hidden: true
    - name: Отрицательное число
      stdin: "-2\n"
      stdout: "-6 2"
      hidden: true
hints:
  - level: 1
    text: Обозначьте введённое число буквой n. После строки `b = a * 2` имя `a` указывает на n, а на что указывает `b`?
  - level: 2
    text: В строке `a = a + b` правая часть вычисляется со старыми значениями — n + 2n. Значит, `a` указывает на 3n. Что тогда даёт `b = b - a`?
  - level: 3
    text: Программа выводит 3n и −n — `print(n * 3, -n)`.
