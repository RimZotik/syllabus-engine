id: p1b-rotate-three
title: Карусель из трёх имён
sandbox: python-browser
difficulty: 2
statement: |
  Программа читает три строки и называет их `a`, `b` и `c`. Нужно сдвинуть значения по кругу: `a` должно указывать на то, на что указывало `b`, `b` — на прежнее `c`, а `c` — на прежнее `a`. Потом программа выводит `a`, `b` и `c` через пробел.

  Пример. Ввод — три строки: `1`, `2`, `3`. Вывод: `2 3 1`.

  В стартовом коде ошибка: на примере он выводит `2 3 2`. Пройдите его по шагам, найдите, где теряется значение, и исправьте.
starter: |
  a = input()
  b = input()
  c = input()
  a = b
  b = c
  c = a
  print(a, b, c)
stdin: "1\n2\n3\n"
solution: |
  a = input()
  b = input()
  c = input()
  temp = a
  a = b
  b = c
  c = temp
  print(a, b, c)
tests:
  io:
    - name: Пример из условия
      stdin: "1\n2\n3\n"
      stdout: "2 3 1"
    - name: Слова
      stdin: "кот\nпёс\nёж\n"
      stdout: "пёс ёж кот"
    - name: Два одинаковых значения
      stdin: "x\nx\ny\n"
      stdout: "x y x"
      hidden: true
    - name: Другие числа
      stdin: "10\n-5\n0\n"
      stdout: "-5 0 10"
      hidden: true
hints:
  - level: 1
    text: Нажмите «По шагам». На что указывает a после строки a = b? Указывает ли ещё хоть одно имя на старое значение a?
  - level: 2
    text: Старое значение a теряется в первой же перепривязке. Его нужно заранее привязать к ещё одному, временному имени.
  - level: 3
    text: Перед a = b добавьте temp = a, а в последнем присваивании используйте temp вместо a.
