title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: copy-then-change
  type: single
  q: |
    Что выведет программа?
    ```python
    a = 10
    b = a
    a = 20
    print(b)
    ```
  options:
  - '`10`'
  - '`20`'
  - '`30`'
  - Ошибку — `b` нельзя привязать к другому имени
  answer: 0
  explain: '`b = a` привязывает `b` к значению, на которое в тот момент указывало `a`, — к 10. Новое присваивание `a` на `b` не влияет.'
  traps: [1]
- id: x-times-two
  type: single
  q: |
    Что выведет программа?
    ```python
    x = 3
    x = x * 2
    x = x + 1
    print(x)
    ```
  options:
  - '`7`'
  - '`3`'
  - '`6`'
  - Ошибку — `x` не может быть равно `x * 2`
  answer: 0
  explain: Каждое присваивание сначала вычисляет правую часть со старым `x`, потом привязывает `x` к результату — 3, затем 6, затем 7.
- id: read-assignment
  type: single
  q: Как правильно прочитать строку кода `total = price * count`?
  options:
  - Проверить, равно ли `total` произведению `price * count`
  - Вычислить `price * count` и привязать имя `total` к результату
  - Запомнить, что `total` — это формула `price * count`, которая пересчитывается сама
  - Привязать имена `price` и `count` к значению `total`
  answer: 1
  explain: Знак `=` в Python — присваивание. Сначала вычисляется правая часть, потом имя слева привязывается к готовому значению.
- id: float-comma
  type: single
  q: |
    Что произойдёт при выполнении программы?
    ```python
    x = float("3,5")
    print(x)
    ```
  options:
  - Выведется `3.5`
  - Выведется `3,5`
  - Ошибка `ValueError` — Python не понимает запятую в записи дробного числа
  - Выведется `35.0` — запятая просто пропадёт
  answer: 2
  explain: '`float` понимает только точку. Строка `"3,5"` — не запись числа для Python, поэтому `ValueError: could not convert string to float: ''3,5''`.'
- id: swap-naive
  type: single
  q: |
    Что выведет программа?
    ```python
    x = "кот"
    y = "пёс"
    x = y
    y = x
    print(x, y)
    ```
  options:
  - '`пёс кот`'
  - '`кот пёс`'
  - '`пёс пёс`'
  - '`кот кот`'
  answer: 2
  explain: После `x = y` на `"кот"` не указывает ни одно имя, он потерян. Затем `y = x` привязывает `y` к тому же `"пёс"`.
- id: valid-names
  type: multi
  q: Какие имена Python допустит? Выберите все.
  options:
  - '`user_name`'
  - '`2nd_place`'
  - '`totalSum`'
  - '`my-name`'
  - '`_count`'
  - '`class`'
  answer:
  - 0
  - 2
  - 4
  explain: Имя не может начинаться с цифры, содержать дефис или совпадать с ключевым словом (`class`). `totalSum` допустимо, хотя в Python принят snake_case.
- id: shadow-builtin
  type: single
  q: Почему `sum = 0` в начале программы — плохая идея, хотя Python её не запрещает?
  options:
  - Имена из трёх букв Python путает с ключевыми словами и может выполнить не то
  - Имя `sum` перестанет указывать на встроенную функцию, и вызвать её будет нельзя
  - Python запомнит `sum` как константу 0 и не даст потом привязать его к другому значению
  - Число 0 к имени привязывать нельзя — Python сочтёт имя пустым
  answer: 1
  explain: '`sum` — встроенное имя. После `sum = 0` оно указывает на число, и вызов настоящей функции `sum` упадёт с `TypeError`.'
- id: types-int
  type: multi
  q: Какие из этих значений имеют тип `int`? Выберите все.
  options:
  - '`-3`'
  - '`"5"`'
  - '`5.0`'
  - '`0`'
  - '`12`'
  answer:
  - 0
  - 3
  - 4
  explain: '`"5"` — строка (`str`), `5.0` — дробное число (`float`), хотя по величине оно целое: тип определяется записью — точка делает число дробным.'
- id: int-input
  type: single
  q: |
    Пользователь ввёл `21`. Что выведет программа?
    ```python
    n = int(input())
    print(n + n)
    ```
  options:
  - '`2121`'
  - '`42`'
  - '`21 21`'
  - '`ValueError`'
  answer: 1
  explain: '`int` превращает текст `''21''` в число 21, поэтому `+` складывает числа.'
- id: open-x-plus-one
  type: open
  q: |
    До этой строки кода `x` указывало на `5`:
    ```python
    x = x + 1
    ```
    Объясните своими словами, что происходит, когда Python её выполняет. Почему в математике такое равенство невозможно, а в Python строка работает?
  rubric:
  - сначала вычисляется правая часть — x + 1 со старым значением x, получается 6
  - потом имя x привязывается к новому значению 6 (старая привязка к 5 пропадает)
  - знак = в Python — присваивание, а не утверждение о равенстве; для сравнения есть ==
  wrong_answers:
  - x одновременно равно 5 и 6
  - Python хранит в x формулу x + 1 и пересчитывает её
  followups:
  - Что выведет программа x = 5; y = x; x = x + 1; print(y) — и почему?
