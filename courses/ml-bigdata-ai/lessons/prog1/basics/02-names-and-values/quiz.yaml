title: Проверка темы
pass: 0.85
minutes: 25
questions:
- id: convert-errors
  type: multi
  q: Какие из этих строк кода остановят программу с `ValueError`? Выберите все.
  options:
  - '`x = float("3,5")`'
  - '`n = int(" 42 ")`'
  - '`n = int("3.5")`'
  - '`x = float("2.5")`'
  - '`n = int("1 000")`'
  answer:
  - 0
  - 2
  - 4
  explain: '`float` понимает в дробях только точку, поэтому `"3,5"` для него не число. `int` прощает пробелы по краям, но не внутри: `"1 000"` — уже не запись целого числа. `"3.5"` — запись дробного числа, а `int` ждёт целое. `int(" 42 ")` даёт `42`, `float("2.5")` — `2.5`.'
- id: valid-names
  type: multi
  q: Какие имена Python допустит? Выберите все.
  options:
  - '`user_name`'
  - '`2nd_place`'
  - '`totalSum`'
  - '`my-name`'
  - '`_count`'
  - '`class`'
  - '`цена`'
  answer:
  - 0
  - 2
  - 4
  - 6
  explain: Имя не может начинаться с цифры, содержать дефис или совпадать с ключевым словом (`class`). `totalSum` и `цена` допустимы, хотя в Python приняты snake_case и латиница.
- id: int-input
  type: single
  q: |
    Пользователь ввёл `21`. Что выведет программа?
    ```python
    s = input()
    n = int(s)
    print(n + n, s + s)
    ```
  options:
  - '`42 2121`'
  - '`42 42`'
  - '`2121 2121`'
  - '`2121 42`'
  answer: 0
  explain: '`int(s)` создаёт новое значение — число 21, а `s` по-прежнему указывает на строку `''21''`. Числа складываются, строки склеиваются.'
- id: fix-lost-sum
  type: code
  q: |
    **Копилка.** На вход — два целых числа в отдельных строках: сколько было в копилке и новый взнос. Выведите, сколько стало.

    Сейчас на вводе `500` и `150` программа выводит `500`, а должна `650`. Исправьте её.
  starter: |
    total = int(input())
    deposit = int(input())
    total + deposit
    print(total)
  solution: |
    total = int(input())
    deposit = int(input())
    total = total + deposit
    print(total)
  tests:
    io:
      - name: Пример из условия
        stdin: "500\n150\n"
        stdout: "650"
      - name: Пустая копилка
        stdin: "0\n30\n"
        stdout: "30"
      - name: Взнос в один рубль
        stdin: "99\n1\n"
        stdout: "100"
        hidden: true
  explain: '`total + deposit` — выражение: Python вычисляет 650, но результат ни к какому имени не привязан и сразу пропадает. Чтобы `total` указывало на новую сумму, нужно присваивание: `total = total + deposit`.'
- id: fix-shadow-print
  type: code
  q: |
    Программа читает цену и количество (целые числа, каждое в своей строке) и должна вывести `Итого: <стоимость>`. Но она падает в последней строке с `TypeError: 'str' object is not callable`. Исправьте её, не меняя расчёт.
  starter: |
    price = int(input())
    count = int(input())
    print = "Итого:"
    total = price * count
    print(print, total)
  solution: |
    price = int(input())
    count = int(input())
    label = "Итого:"
    total = price * count
    print(label, total)
  tests:
    io:
      - name: Пример
        stdin: "250\n3\n"
        stdout: "Итого: 750"
      - name: Одна штука
        stdin: "99\n1\n"
        stdout: "Итого: 99"
      - name: Ноль штук
        stdin: "120\n0\n"
        stdout: "Итого: 0"
        hidden: true
  explain: Третья строка кода перепривязала встроенное имя `print` к строке `"Итого:"`. Python это разрешает, поэтому ошибка видна только при вызове — строку вызвать нельзя. Тексту нужно своё имя, например `label`, а `print` пусть указывает на функцию вывода.
- id: fix-formula-order
  type: code
  q: |
    Программа читает цену билета и число билетов (целые числа, каждое в своей строке) и должна вывести стоимость покупки. Её дописывали в спешке: сначала она считала один билет, потом добавили ввод количества. На вводе `300` и `4` она выводит `300`. Исправьте её.
  starter: |
    price = int(input())
    count = 1
    total = price * count
    count = int(input())
    print(total)
  solution: |
    price = int(input())
    count = int(input())
    total = price * count
    print(total)
  tests:
    io:
      - name: Пример из условия
        stdin: "300\n4\n"
        stdout: "1200"
      - name: Один билет
        stdin: "250\n1\n"
        stdout: "250"
      - name: Десять билетов
        stdin: "120\n10\n"
        stdout: "1200"
        hidden: true
      - name: Ни одного билета
        stdin: "50\n0\n"
        stdout: "0"
        hidden: true
  explain: '`total` привязано к числу, посчитанному в момент присваивания, — `300 * 1`. Когда потом `count` перепривязывают к 4, `total` сам не пересчитывается: имя указывает на готовое значение, а не на формулу. Считать нужно после того, как прочитаны все данные.'
- id: write-water
  type: code
  q: |
    Счётчик воды. На вход подаются три целых числа, каждое в своей строке: показание счётчика в начале месяца, показание в конце месяца и цена одного кубометра в рублях. Выведите две строки: `Расход: <кубометры>` и `К оплате: <рубли>`. Например, для `120`, `132` и `40`:
    ```
    Расход: 12
    К оплате: 480
    ```
  solution: |
    start = int(input())
    end = int(input())
    price = int(input())
    used = end - start
    print("Расход:", used)
    print("К оплате:", used * price)
  tests:
    io:
      - name: Пример из условия
        stdin: "120\n132\n40\n"
        stdout: "Расход: 12\nК оплате: 480"
      - name: Новый счётчик
        stdin: "0\n5\n50\n"
        stdout: "Расход: 5\nК оплате: 250"
      - name: Воду не расходовали
        stdin: "77\n77\n40\n"
        stdout: "Расход: 0\nК оплате: 0"
        hidden: true
      - name: Большие показания
        stdin: "999\n1015\n38\n"
        stdout: "Расход: 16\nК оплате: 608"
        hidden: true
  explain: Все три строки ввода — текст, поэтому каждую превращают в число через `int(input())`. Расход — разность показаний; его удобно назвать отдельным именем, чтобы не вычислять дважды и чтобы код читался.
- id: open-x-plus-one
  type: open
  q: |
    До этой строки кода `x` указывало на `5`:
    ```python
    x = x + 1
    ```
    Объясните своими словами, что происходит, когда Python её выполняет. Почему в математике такое равенство невозможно, а в Python строка работает?
  rubric:
  - сначала вычисляется правая часть — x + 1 со старым значением x, получается 6
  - потом имя x привязывается к новому значению 6 (старая привязка к 5 пропадает)
  - знак = в Python — присваивание (команда «вычисли и привяжи»), а не утверждение о равенстве, поэтому противоречия нет
  wrong_answers:
  - x одновременно равно 5 и 6
  - Python хранит в x формулу x + 1 и пересчитывает её
  followups:
  - Что выведет программа x = 5; y = x; x = x + 1; print(y) — и почему?
