id: p1b-hypotenuse
title: Диагональ экрана
sandbox: python-browser
difficulty: 2
statement: |
  На вход подаются ширина и высота экрана в сантиметрах — два числа, каждое в отдельной строке; они могут быть дробными (через точку). Выведите длину диагонали, округлённую функцией `round` до двух знаков после точки. Формат вывода — такой, как печатает `print(round(...))`: например, `5.0`, а не `5.00`.

  Диагональ прямоугольника по теореме Пифагора — квадратный корень из суммы квадратов сторон. Квадратный корень возьмите функцией `sqrt` из модуля `math`.

  ```input
  3
  4
  ```
  ```
  5.0
  ```

  Второй пример:

  ```input
  1
  1
  ```
  ```
  1.41
  ```
starter: |
  width = float(input())
  height = float(input())
  print(width + height)
stdin: "3\n4\n"
solution: |
  import math

  width = float(input())
  height = float(input())
  diagonal = math.sqrt(width ** 2 + height ** 2)
  print(round(diagonal, 2))
tests:
  io:
    - name: Пример из условия
      stdin: "3\n4\n"
      stdout: "5.0"
    - name: Квадрат
      stdin: "1\n1\n"
      stdout: "1.41"
    - name: Дробные стороны
      stdin: "34.5\n19.4\n"
      stdout: "39.58"
      hidden: true
    - name: Большой экран
      stdin: "121.8\n68.5\n"
      stdout: "139.74"
      hidden: true
    - name: Тройка 5-12-13
      stdin: "5\n12\n"
      stdout: "13.0"
      hidden: true
hints:
  - level: 1
    text: Что нужно подключить, чтобы пользоваться функцией `sqrt`? Где обычно пишут эту инструкцию?
  - level: 2
    text: Сначала вычислите сумму квадратов сторон — `width ** 2 + height ** 2`, — потом возьмите из неё корень `math.sqrt(...)`.
  - level: 3
    text: Привяжите корень к имени `diagonal` и выведите `print(round(diagonal, 2))`.
