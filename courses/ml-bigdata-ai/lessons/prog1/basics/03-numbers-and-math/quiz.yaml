title: Проверка темы
pass: 0.85
minutes: 25
questions:
- id: div-float
  type: single
  q: |
    Что выведет программа?
    ```python
    print(8 / 4, 7.0 // 2, 2 + 3.0)
    ```
  options:
  - '`2.0 3.0 5.0`'
  - '`2 3 5`'
  - '`2.0 3 5.0`'
  - '`2.0 3.5 5.0`'
  answer: 0
  explain: '`/` всегда даёт `float`. `//` с дробным числом тоже даёт `float` — `3.0`, а не `3.5`: это всё ещё целочисленное деление. В `2 + 3.0` участвует дробное число, поэтому и результат дробный.'
- id: floor-negative
  type: single
  q: |
    Что выведет программа?
    ```python
    print(-9 // 2)
    ```
  options:
  - '`-4`'
  - '`-5`'
  - '`-4.5`'
  - '`4`'
  answer: 1
  explain: '`//` округляет вниз, к меньшему числу. Обычное деление даёт -4,5, вниз от него — -5.'
  traps: [0]
- id: minus-power
  type: single
  q: |
    Что выведет программа?
    ```python
    print(-3 ** 2)
    ```
  options:
  - '`9`'
  - '`-9`'
  - '`6`'
  - '`-6`'
  answer: 1
  explain: Степень сильнее минуса перед числом — сначала `3 ** 2 = 9`, потом минус. Для квадрата -3 нужны скобки `(-3) ** 2`.
- id: aug-assign
  type: single
  q: |
    Что выведет программа?
    ```python
    n = 7
    n //= 2
    n *= n
    n -= 1
    print(n)
    ```
  options:
  - '`8`'
  - '`11.25`'
  - '`48`'
  - '`5`'
  answer: 0
  explain: 'Каждая короткая запись — то же присваивание: `n //= 2` привязывает `n` к `7 // 2 = 3`, `n *= n` — к `3 * 3 = 9`, `n -= 1` — к 8. `11.25` получилось бы с обычным делением `/`, а `48` — если бы `n //= 2` не изменил `n`.'
- id: fix-perimeter
  type: code
  q: |
    Сколько метров плинтуса нужно для комнаты? Это периметр прямоугольника — удвоенная сумма длины и ширины. На вход подаются длина и ширина в метрах (целые числа, каждое в своей строке). На вводе `5` и `3` программа выводит `13`, а должна `16`. Исправьте её.
  starter: |
    length = int(input())
    width = int(input())
    print(2 * length + width)
  solution: |
    length = int(input())
    width = int(input())
    print(2 * (length + width))
  tests:
    io:
      - name: Пример из условия
        stdin: "5\n3\n"
        stdout: "16"
      - name: Квадратная комната
        stdin: "4\n4\n"
        stdout: "16"
      - name: Узкий коридор
        stdin: "1\n10\n"
        stdout: "22"
        hidden: true
  explain: Умножение сильнее сложения, поэтому `2 * length + width` удваивает только длину. Чтобы удвоить сумму, её берут в скобки — `2 * (length + width)`.
- id: fix-bill-split
  type: code
  q: |
    Друзья делят счёт в кафе поровну, по целым рублям, а то, что не делится поровну, оставляют на чай. На вход подаются сумма счёта и число друзей (целые числа, каждое в своей строке). Программа должна вывести через пробел, сколько платит каждый и сколько остаётся на чай. На вводе `1300` и `3` нужно `433 1`, а программа выводит `433.3333333333333 1`. Исправьте её.
  starter: |
    total = int(input())
    friends = int(input())
    each = total / friends
    tip = total % friends
    print(each, tip)
  solution: |
    total = int(input())
    friends = int(input())
    each = total // friends
    tip = total % friends
    print(each, tip)
  tests:
    io:
      - name: Пример из условия
        stdin: "1300\n3\n"
        stdout: "433 1"
      - name: Делится без остатка
        stdin: "1200\n4\n"
        stdout: "300 0"
      - name: Остаток побольше
        stdin: "999\n10\n"
        stdout: "99 9"
        hidden: true
      - name: Друзей больше, чем рублей
        stdin: "5\n7\n"
        stdout: "0 5"
        hidden: true
  explain: '`/` — обычное деление, его результат всегда `float`, даже когда делится нацело (`300.0`). Сколько целых рублей достаётся каждому, говорит целочисленное деление `//`, а остаток `%` — как раз то, что не делится поровну.'
- id: fix-isclose
  type: code
  q: |
    Кассир проверяет чек. На вход подаются цены трёх товаров и итог, напечатанный в чеке, — четыре дробных числа через точку, каждое в своей строке. Программа выводит `True`, если итог равен сумме цен, и `False`, если нет. На вводе `0.1`, `0.2`, `0.3` и `0.6` она выводит `False`, хотя чек верный. Исправьте её.
  starter: |
    a = float(input())
    b = float(input())
    c = float(input())
    total = float(input())
    print(a + b + c == total)
  solution: |
    import math

    a = float(input())
    b = float(input())
    c = float(input())
    total = float(input())
    print(math.isclose(a + b + c, total))
  tests:
    io:
      - name: Пример из условия
        stdin: "0.1\n0.2\n0.3\n0.6\n"
        stdout: "True"
      - name: Чек с ошибкой
        stdin: "1.5\n2.5\n1.0\n5.5\n"
        stdout: "False"
      - name: Другой верный чек
        stdin: "0.7\n0.1\n0.2\n1.0\n"
        stdout: "True"
        hidden: true
      - name: Итог отличается на 10 копеек
        stdin: "10.1\n0.2\n0.3\n10.7\n"
        stdout: "False"
        hidden: true
  explain: '`0.1`, `0.2` и `0.3` хранятся в двоичном виде с крошечной погрешностью, и их сумма — `0.6000000000000001`, а не `0.6`. Поэтому дробные числа не сравнивают через `==`, а проверяют, достаточно ли они близки: `math.isclose`. Не забудьте `import math`.'
- id: write-deposit
  type: code
  q: |
    Вклад с капитализацией: каждый год к сумме прибавляются проценты, и на следующий год проценты начисляются уже на новую сумму. Через `n` лет вклад равен `S · (1 + p/100)ⁿ`, где `S` — начальная сумма, `p` — ставка в процентах. На вход подаются `S`, `p` и `n` — целые числа, каждое в своей строке. Выведите итоговую сумму, округлённую функцией `round` до двух знаков после точки, в том виде, как её печатает `print(round(...))`. Для `10000`, `5` и `2` — `11025.0`, для `5000`, `7` и `10` — `9835.76`.
  starter: |
    s = int(input())
    p = int(input())
    n = int(input())
  solution: |
    s = int(input())
    p = int(input())
    n = int(input())
    print(round(s * (1 + p / 100) ** n, 2))
  tests:
    io:
      - name: Пример из условия
        stdin: "10000\n5\n2\n"
        stdout: "11025.0"
      - name: Десять лет
        stdin: "5000\n7\n10\n"
        stdout: "9835.76"
      - name: Три года под 10 %
        stdin: "1000\n10\n3\n"
        stdout: "1331.0"
        hidden: true
      - name: Нулевая ставка
        stdin: "100\n0\n5\n"
        stdout: "100.0"
        hidden: true
      - name: Один год
        stdin: "250000\n12\n1\n"
        stdout: "280000.0"
        hidden: true
  explain: 'Степень `**` сильнее умножения и деления, поэтому множитель `1 + p / 100` берут в скобки: без них `1 + p / 100 ** n` возвела бы в степень только `100`. А `p / 100` скобок не требует — деление и так выполняется раньше сложения. Результат дробный, потому что `/` всегда даёт `float`.'
- id: write-flat
  type: code
  q: |
    В доме 9 этажей, на каждом этаже каждого подъезда по 4 квартиры, нумерация сквозная: в первом подъезде квартиры 1–36, во втором 37–72 и так далее. На вход подаётся номер квартиры. Выведите через пробел номер подъезда и номер этажа. Например, квартира `1` — `1 1`, квартира `40` — `2 1`, квартира `36` — `1 9`.
  starter: |
    n = int(input())
  solution: |
    n = int(input())
    k = n - 1
    entrance = k // 36 + 1
    floor = k % 36 // 4 + 1
    print(entrance, floor)
  tests:
    io:
      - name: Первая квартира
        stdin: "1\n"
        stdout: "1 1"
      - name: Второй подъезд
        stdin: "40\n"
        stdout: "2 1"
      - name: Последняя квартира подъезда
        stdin: "36\n"
        stdout: "1 9"
      - name: Первая квартира второго подъезда
        stdin: "37\n"
        stdout: "2 1"
        hidden: true
      - name: Последняя квартира этажа
        stdin: "8\n"
        stdout: "1 2"
        hidden: true
      - name: Третий подъезд
        stdin: "100\n"
        stdout: "3 7"
        hidden: true
  explain: 'Удобнее нумеровать квартиры с нуля: `k = n - 1`. Тогда в каждом подъезде 36 квартир подряд, `k // 36` — номер подъезда с нуля, `k % 36` — номер квартиры внутри подъезда с нуля, а `// 4` от него — этаж с нуля; к обоим прибавляют 1. Без сдвига ломаются последние квартиры: для 36 вышло бы `2 1` вместо `1 9`.'
