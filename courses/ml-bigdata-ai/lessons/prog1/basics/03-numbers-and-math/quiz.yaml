title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: div-float
  type: single
  q: |
    Что выведет программа?
    ```python
    print(8 / 4, 7.0 // 2, 2 + 3.0)
    ```
  options:
  - '`2.0 3.0 5.0`'
  - '`2 3 5`'
  - '`2.0 3 5.0`'
  - '`2.0 3.5 5.0`'
  answer: 0
  explain: '`/` всегда даёт `float`. `//` с дробным числом тоже даёт `float` — `3.0`, а не `3.5`: это всё ещё целочисленное деление. В `2 + 3.0` участвует дробное число, поэтому и результат дробный.'
- id: floor-mod
  type: single
  q: |
    Что выведет программа?
    ```python
    print(17 // 5, 17 % 5)
    ```
  options:
  - '`3 2`'
  - '`3.4 2`'
  - '`3 15`'
  - '`2 3`'
  answer: 0
  explain: 5 целиком помещается в 17 три раза (15), остаётся 2.
- id: floor-negative
  type: single
  q: |
    Что выведет программа?
    ```python
    print(-9 // 2)
    ```
  options:
  - '`-4`'
  - '`-5`'
  - '`-4.5`'
  - '`4`'
  answer: 1
  explain: '`//` округляет вниз, к меньшему числу. Обычное деление даёт -4,5, вниз от него — -5.'
  traps: [0]
- id: precedence
  type: single
  q: |
    Что выведет программа?
    ```python
    print(2 + 3 * 2 ** 2)
    ```
  options:
  - '`14`'
  - '`100`'
  - '`20`'
  - '`38`'
  answer: 0
  explain: Сначала степень `2 ** 2 = 4`, потом умножение `3 * 4 = 12`, потом сложение `2 + 12 = 14`.
- id: minus-power
  type: single
  q: |
    Что выведет программа?
    ```python
    print(-3 ** 2)
    ```
  options:
  - '`9`'
  - '`-9`'
  - '`6`'
  - '`-6`'
  answer: 1
  explain: Степень сильнее минуса перед числом — сначала `3 ** 2 = 9`, потом минус. Для квадрата -3 нужны скобки `(-3) ** 2`.
- id: last-digit
  type: multi
  q: '`n` — целое положительное число, например `347`. Какие выражения дают его последнюю цифру? Выберите все.'
  options:
  - '`n % 10`'
  - '`n // 10`'
  - '`n - n // 10 * 10`'
  - '`n % 100 // 10`'
  answer:
  - 0
  - 2
  explain: '`n % 10` — остаток от деления на 10, то есть последняя цифра. `n // 10 * 10` — число с нулём вместо последней цифры (340), и разность с `n` даёт ту же цифру. `n // 10` — число без последней цифры (34), а `n % 100 // 10` — предпоследняя цифра (4).'
- id: aug-assign
  type: single
  q: |
    Что выведет программа?
    ```python
    n = 7
    n //= 2
    n *= n
    n -= 1
    print(n)
    ```
  options:
  - '`8`'
  - '`11.25`'
  - '`48`'
  - '`5`'
  answer: 0
  explain: 'Каждая короткая запись — то же присваивание: `n //= 2` привязывает `n` к `7 // 2 = 3`, `n *= n` — к `3 * 3 = 9`, `n -= 1` — к 8. `11.25` получилось бы с обычным делением `/`, а `48` — если бы `n //= 2` не изменил `n`.'
- id: round-half
  type: single
  q: |
    Что выведет программа?
    ```python
    print(round(4.5), round(5.5))
    ```
  options:
  - '`5 6`'
  - '`4 6`'
  - '`4 5`'
  - '`5 5`'
  answer: 1
  explain: Половинки округляются к ближайшему чётному — 4.5 к 4, 5.5 к 6.
- id: import-sqrt
  type: single
  q: |
    Что выведет программа?
    ```python
    import math
    print(sqrt(9))
    ```
  options:
  - '`3.0`'
  - '`3`'
  - Остановится с `NameError`, потому что имени `sqrt` Python не знает
  - Остановится с `NameError`, потому что `import math` нужно писать перед каждым вызовом
  answer: 2
  explain: После `import math` известно только имя `math`, а функции из модуля вызываются через точку — `math.sqrt(9)`. Само имя `sqrt` не создано. Один `import` в начале программы действует на всю программу.
- id: open-float-compare
  type: open
  q: |
    Коллега выводит
    ```python
    print(total == 0.3)
    ```
    где `total` — сумма нескольких дробных чисел, которая по расчёту на бумаге равна 0,3, и удивляется, что получил `False`. Объясните ему, в чём дело и как сравнивать правильно.
  rubric:
  - дробные числа (float) хранятся в двоичном виде с погрешностью, большинство десятичных дробей нельзя записать точно
  - поэтому результат вычислений может отличаться от ожидаемого в последних знаках, и == даёт False
  - правильно проверять близость — math.isclose(total, 0.3)
  wrong_answers:
  - надо писать 0.30 вместо 0.3
  - нужно округлить total до целого через round
  followups:
  - А с целыми числами такая проблема бывает? Почему?
