title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: div-float
  type: single
  q: Что выведет print(8 / 4)?
  options:
  - '2'
  - '2.0'
  - '2.00'
  - '0.5'
  answer: 1
  explain: Деление / в Python всегда даёт float — даже если делится нацело.
- id: floor-mod
  type: single
  q: Что выведет print(17 // 5, 17 % 5)?
  options:
  - 3 2
  - 3.4 2
  - 3 3.4
  - 2 3
  answer: 0
  explain: 5 целиком помещается в 17 три раза (15), остаётся 2.
- id: floor-negative
  type: single
  q: Что выведет print(-9 // 2)?
  options:
  - '-4'
  - '-5'
  - '-4.5'
  - '4'
  answer: 1
  explain: // округляет вниз, к меньшему числу. Обычное деление даёт -4,5, вниз от него — -5.
  traps: [0]
- id: precedence
  type: single
  q: Что выведет print(2 + 3 * 2 ** 2)?
  options:
  - '14'
  - '100'
  - '20'
  - '38'
  answer: 0
  explain: Сначала степень 2 ** 2 = 4, потом умножение 3 * 4 = 12, потом сложение 2 + 12 = 14.
- id: minus-power
  type: single
  q: Что выведет print(-3 ** 2)?
  options:
  - '9'
  - '-9'
  - '6'
  - '-6'
  answer: 1
  explain: Степень сильнее минуса перед числом — сначала 3 ** 2 = 9, потом минус. Для квадрата -3 нужны скобки (-3) ** 2.
- id: last-digit
  type: single
  q: n — целое положительное число. Какое выражение даёт его последнюю цифру?
  options:
  - n // 10
  - n % 10
  - n / 10
  - n ** 10
  answer: 1
  explain: Остаток от деления на 10 — это последняя цифра. n // 10 даёт число без последней цифры.
- id: float-eq
  type: single
  q: Почему print(0.1 + 0.2 == 0.3) выводит False?
  options:
  - В Python сложение дробных чисел работает с ошибкой, её исправят в новой версии
  - Числа 0.1, 0.2 и 0.3 хранятся в двоичном виде с крошечной погрешностью, и сумма не совпадает с хранимым 0.3
  - Знак == нельзя применять к числам
  - 0.1 + 0.2 даёт int, а 0.3 — float
  answer: 1
  explain: Большинство десятичных дробей нельзя точно записать двоичными. Поэтому дробные числа сравнивают через math.isclose.
- id: round-half
  type: single
  q: Что выведет print(round(4.5), round(5.5))?
  options:
  - 5 6
  - 4 6
  - 4 5
  - 5 5
  answer: 1
  explain: Половинки округляются к ближайшему чётному — 4.5 к 4, 5.5 к 6.
- id: import-sqrt
  type: single
  q: 'Что выведет программа import math; print(math.sqrt(9))?'
  options:
  - '3'
  - '3.0'
  - '81'
  - NameError
  answer: 1
  explain: math.sqrt всегда возвращает float, даже для полного квадрата. Модуль подключён, поэтому ошибки нет.
- id: open-float-compare
  type: open
  q: Коллега выводит print(total == 0.3), где total — сумма нескольких дробных чисел, которая по расчёту на бумаге равна 0,3, и удивляется, что получил False. Объясните ему, в чём дело и как сравнивать правильно.
  rubric:
  - дробные числа (float) хранятся в двоичном виде с погрешностью, большинство десятичных дробей нельзя записать точно
  - поэтому результат вычислений может отличаться от ожидаемого в последних знаках, и == даёт False
  - правильно проверять близость — math.isclose(total, 0.3)
  wrong_answers:
  - надо писать 0.30 вместо 0.3
  - нужно округлить total до целого через round
  followups:
  - А с целыми числами такая проблема бывает? Почему?
