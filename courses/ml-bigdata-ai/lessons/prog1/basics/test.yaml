title: Контрольная раздела «Основы языка»
pass: 0.85
minutes: 30
questions:
- id: s-mod-negative
  type: single
  q: |
    Что выведет программа?
    ```python
    print(-10 % 3)
    ```
  options:
  - '`-1`'
  - '`2`'
  - '`1`'
  - '`-2`'
  answer: 1
  explain: '`-10 // 3` равно `-4` (округление вниз). Проверка — частное × делитель + остаток = делимое: −4 · 3 + 2 = −10. Остаток получает знак делителя.'
- id: s-kopecks
  type: single
  q: |
    Пользователь ввёл `1205` — цену в копейках. Что выведет программа?
    ```python
    kop = int(input())
    print(f"{kop // 100} руб. {kop % 100} коп.")
    ```
  options:
  - '`12 руб. 5 коп.`'
  - '`12 руб. 05 коп.`'
  - '`12.05 руб. 5 коп.`'
  - '`{kop // 100} руб. {kop % 100} коп.`'
  answer: 0
  explain: '`//` с целыми числами даёт целое — 12, `%` — остаток, число 5. f-строка подставляет само число, а у числа 5 нет ведущего нуля, поэтому `05` не появится. Буква `f` перед кавычками есть, поэтому выражения в скобках вычисляются.'
- id: s-input-index
  type: single
  q: |
    Пользователь ввёл `19`. Что выведет программа?
    ```python
    s = input()
    print(s + s[-1], int(s) + 1)
    ```
  options:
  - '`199 20`'
  - '`28 20`'
  - '`1919 20`'
  - '`199 191`'
  answer: 0
  explain: '`s` — строка `"19"`, `s[-1]` — её последний символ `"9"`, и `+` склеивает их в `199`. `int(s)` создаёт новое значение — число 19, и к нему прибавляется 1. Сама `s` при этом остаётся строкой.'
- id: s-names-strip
  type: single
  q: |
    Что выведет программа?
    ```python
    a = "  Да "
    b = a
    a = a.strip()
    print(len(a), len(b))
    ```
  options:
  - '`2 5`'
  - '`2 2`'
  - '`5 5`'
  - '`5 2`'
  answer: 0
  explain: '`b = a` привязывает `b` к той же строке из пяти символов. `strip()` её не меняет, а возвращает новую строку `"Да"`, и к ней перепривязывают только `a`. `b` по-прежнему указывает на исходную строку.'
- id: s-digits
  type: multi
  q: '`n = 507`. Какие выражения дают число `5` типа `int`? Выберите все.'
  options:
  - '`n // 100`'
  - '`str(n)[0]`'
  - '`int(str(n)[0])`'
  - '`n / 100`'
  - '`int(str(n)[-3])`'
  - '`n % 100`'
  answer:
  - 0
  - 2
  - 4
  explain: '`n // 100` — сколько раз 100 целиком помещается в 507, это 5. `str(n)[0]` — первый символ строки `"507"`, но это текст `"5"`, а не число; `int(...)` превращает его в число. Индекс `-3` у строки из трёх символов — тот же первый символ. `n / 100` даёт дробное `5.07`, а `n % 100` — остаток `7`.'
- id: s-float-format
  type: single
  q: |
    Пользователь ввёл `0.1` и `0.2`, каждое число отдельной строкой. Что выведет программа?
    ```python
    a = float(input())
    b = float(input())
    print(a + b, f"{a + b:.2f}")
    ```
  options:
  - '`0.3 0.30`'
  - '`0.30000000000000004 0.30`'
  - '`0.30000000000000004 0.30000000000000004`'
  - '`0.3 0.3`'
  answer: 1
  explain: 'Сумма дробных чисел неточна в последних знаках, и `print` выводит её как есть. Формат `:.2f` меняет только вывод: показывает два знака после точки. Само значение суммы он не исправляет — поэтому сравнивать его с `0.3` через `==` всё равно нельзя.'
- id: s-index-error
  type: single
  q: |
    Пользователь ввёл `кот`, и программа
    ```python
    word = input()
    print(word[len(word)])
    ```
    остановилась с `IndexError: string index out of range` во второй строке кода. В чём причина?
  options:
  - '`len(word)` на единицу больше самого большого индекса строки'
  - '`len` нельзя вызывать внутри квадратных скобок'
  - Строки неизменяемы, поэтому символ по индексу взять нельзя
  - '`input()` вернул строку, а индекс бывает только у чисел'
  answer: 0
  explain: 'В слове `кот` три символа с индексами 0, 1 и 2, а `len(word)` равно 3 — такого индекса нет. Последний символ — `word[len(word) - 1]` или `word[-1]`. Брать символ по индексу у строки можно: неизменяемость запрещает только менять его.'
- id: s-before-start
  type: multi
  q: Из-за каких ошибок программа не выполнит ни одной строки кода? Выберите все.
  options:
  - Не закрыта кавычка в строке 5
  - Лишний отступ перед строкой 3
  - Опечатка `prnt` в строке 4
  - '`int("abc")` в строке 2'
  - Имя используется в строке 3, а создаётся только в строке 4
  answer:
  - 0
  - 1
  explain: Синтаксические ошибки, включая `IndentationError`, находятся до запуска. `NameError` и `ValueError` возникают, когда выполнение доходит до этих строк кода, — в том числе имя, которое ещё не создано.
- id: s-checker-diff
  type: single
  q: |
    Задача — вывести сумму двух целых чисел в формате `Сумма: 12`. Проверка показывает:
    ```
    Ожидалось: Сумма: 12
    Получено:  Сумма: 12.0
    ```
    Что, скорее всего, не так в решении?
  options:
  - Числа прочитаны через `float(input())`, а не `int(input())`
  - Сложение `+` всегда даёт дробное число
  - Числа остались строками и склеились
  - '`print` выводит сумму любых двух чисел с `.0` на конце'
  answer: 0
  explain: Вывод сравнивается посимвольно, а `float` печатается с `.0`. Целые числа при сложении дают целое, а склеенные строки дали бы цифры подряд (для 5 и 7 — `57`), а не `12.0`. `print` выводит целое число без `.0`.
- id: s-ai-precedence
  type: single
  q: |
    ИИ-ассистент написал для среднего двух чисел:
    ```python
    average = a + b / 2
    ```
    При `a = 4` и `b = 6` программа выводит `7.0` вместо `5.0`. В чём ошибка?
  options:
  - Деление сильнее сложения, поэтому на 2 делится только `b`
  - Python считает строго слева направо, и скобки здесь не помогут
  - '`/` даёт дробное число, а с `//` получилось бы `5`'
  - '`a` и `b` — строки из `input()`, их не превратили в числа'
  answer: 0
  explain: Приоритет `/` выше, чем у `+`, поэтому считается `4 + 6 / 2 = 4 + 3.0`. С `//` вышло бы `7`, а строки дали бы ошибку, а не `7.0`. Исправление — скобки `(a + b) / 2`.
- id: s-open-program
  type: open
  q: |
    Задача: прочитать цену (дробное число) и количество (целое) и вывести сумму с двумя знаками после точки. Ученик написал:
    ```python
    price = input()
    count = input()
    print(f"{price * count:.2f}")
    ```
    Программа падает. Какая будет ошибка, почему, и как исправить решение? Проверьте исправленное решение на вводе `89.9` и `2`.
  rubric:
  - программа упадёт с TypeError — две строки нельзя перемножить
  - причина — input() возвращает строки, числа никто не преобразовал
  - исправление — price = float(input()) и count = int(input()); формат :.2f оставить
  - ученик проверяет исправление на примере, например 89.9 и 2 дают 179.80
  wrong_answers:
  - нужно убрать f у строки
  - достаточно написать round вместо :.2f
  followups:
  - Что изменится, если цену вводят с запятой, например 89,9?
