title: Контрольная раздела «Основы языка»
pass: 0.85
minutes: 30
questions:
- id: s-division
  type: single
  q: |
    Что выведет программа?
    ```python
    print(10 // 3, 10 / 4)
    ```
  options:
  - '`3 2.5`'
  - '`3.33 2.5`'
  - '`3 2`'
  - '`3.0 2.5`'
  answer: 0
  explain: '`//` с целыми числами даёт целое — `3`, а `/` всегда даёт `float` — `2.5`.'
- id: s-assign-chain
  type: single
  q: |
    Что выведет программа?
    ```python
    a = 2
    b = a + 3
    a = b * 2
    print(a, b)
    ```
  options:
  - '`10 5`'
  - '`10 13`'
  - '`4 5`'
  - '`2 5`'
  answer: 0
  explain: '`b` вычисляется один раз и указывает на 5. Потом `a` привязывается к `5 * 2 = 10`, а `b` не пересчитывается.'
  traps: [1]
- id: s-input-type
  type: single
  q: |
    Пользователь ввёл `3.5`. Что выведет программа?
    ```python
    x = input()
    print(type(x))
    ```
  options:
  - "`<class 'float'>`"
  - "`<class 'str'>`"
  - "`<class 'int'>`"
  - '`3.5`'
  answer: 1
  explain: '`input()` всегда возвращает строку, даже если пользователь набрал число.'
- id: s-int-float-text
  type: single
  q: |
    Пользователь ввёл `7.0`. Что случится?
    ```python
    n = int(input())
    ```
  options:
  - '`n` будет указывать на `7`'
  - '`n` будет указывать на `7.0`'
  - '`ValueError` — `int` не может разобрать строку `7.0` как целое число'
  - '`TypeError` — `input` вернул `float`'
  answer: 2
  explain: '`int` принимает только строки с записью целого числа. Чтобы прочитать `7.0`, нужен `float(input())`.'
- id: s-mod-negative
  type: single
  q: |
    Что выведет программа?
    ```python
    print(-10 % 3)
    ```
  options:
  - '`-1`'
  - '`2`'
  - '`1`'
  - '`-2`'
  answer: 1
  explain: '`-10 // 3` равно `-4` (округление вниз), и -4 · 3 + 2 = -10. Остаток получает знак делителя.'
- id: s-slice-len
  type: single
  q: |
    Что выведет программа?
    ```python
    s = "данные"
    print(s[:3], len(s))
    ```
  options:
  - '`дан 6`'
  - '`данн 6`'
  - '`дан 5`'
  - '`ные 6`'
  answer: 0
  explain: '`s[:3]` — символы с индексами 0, 1, 2. В слове шесть букв.'
- id: s-fstring
  type: single
  q: |
    Что выведет программа?
    ```python
    name = "Ли"
    score = 9.456
    print(f"{name}: {score:.1f}")
    ```
  options:
  - '`Ли: 9.5`'
  - '`Ли: 9.4`'
  - '`Ли: 9.456`'
  - '`{name}: 9.5`'
  answer: 0
  explain: f-строка подставляет значения, а формат `:.1f` оставляет один знак после точки с округлением.
- id: s-method-new
  type: single
  q: |
    Что выведет программа?
    ```python
    t = "Привет"
    u = t.lower()
    print(t, u)
    ```
  options:
  - '`Привет привет`'
  - '`привет привет`'
  - '`Привет Привет`'
  - '`привет Привет`'
  answer: 0
  explain: '`lower()` не меняет исходную строку, а возвращает новую — её и привязали к `u`.'
- id: s-traceback-link
  type: single
  q: |
    Программа:
    ```python
    price = input()
    total = price * 2 + 50
    print(total)
    ```
    Пользователь ввёл `100`, и Python сообщает:
    ```
    TypeError: can only concatenate str (not "int") to str
    ```
    Где ошибка и в чём причина?
  options:
  - В строке кода 2 — `price` указывает на строку, и к строке прибавляют число `50`
  - В строке кода 3 — `print` не умеет выводить числа
  - В строке кода 1 — `input` не принимает числа
  - Ошибки нет, Python ошибся
  answer: 0
  explain: '`input()` вернул строку, поэтому в выражении `price * 2 + 50` к строке прибавляется целое число. Исправление — `price = int(input())`.'
- id: s-before-start
  type: multi
  q: Из-за каких ошибок программа не выполнит ни одной строки кода? Выберите все.
  options:
  - Не закрыта кавычка в строке 5
  - Лишний отступ перед строкой 3
  - Опечатка `prnt` в строке 4
  - '`int("abc")` в строке 2'
  answer:
  - 0
  - 1
  explain: Синтаксические ошибки, включая `IndentationError`, находятся до запуска. `NameError` и `ValueError` возникают, когда выполнение доходит до этих строк кода.
- id: s-checker-diff
  type: single
  q: |
    Задача — вывести сумму двух целых чисел в формате `Сумма: 12`. Проверка показывает:
    ```
    Ожидалось: Сумма: 12
    Получено:  Сумма: 12.0
    ```
    Что, скорее всего, не так в решении?
  options:
  - Числа прочитаны через `float(input())` вместо `int(input())`
  - Лишний пробел после двоеточия
  - Забыт `input()`
  - Проверка сломана — `12` и `12.0` одно и то же
  answer: 0
  explain: Вывод сравнивается посимвольно, а `float` печатается с `.0`. Для целых чисел нужен `int`.
- id: s-ai-precedence
  type: single
  q: |
    ИИ-ассистент написал для среднего двух чисел:
    ```python
    average = a + b / 2
    ```
    При `a = 4` и `b = 6` программа выводит `7.0` вместо `5.0`. В чём ошибка?
  options:
  - Деление выполняется раньше сложения — нужны скобки `(a + b) / 2`
  - Нужно делить через `//` вместо `/`
  - '`a` и `b` надо сначала превратить в строки'
  - Нужно подключить модуль `math`
  answer: 0
  explain: Приоритет `/` выше, чем у `+`, поэтому считается `4 + 3`. Скобки меняют порядок действий.
- id: s-isclose
  type: single
  q: '`x = 1.1 * 3`. Как правильно проверить, что `x` равно `3.3`?'
  options:
  - '`print(x == 3.3)`'
  - '`print(math.isclose(x, 3.3))` после `import math`'
  - '`print(x // 1 == 3.3)`'
  - '`print(str(x) == "3.3")`'
  answer: 1
  explain: '`1.1 * 3` даёт `3.3000000000000003`, поэтому `==` и сравнение строк дадут `False`. Дробные числа сравнивают через `math.isclose`.'
- id: s-open-program
  type: open
  q: |
    Задача: прочитать цену (дробное число) и количество (целое) и вывести сумму с двумя знаками после точки. Ученик написал:
    ```python
    price = input()
    count = input()
    print(f"{price * count:.2f}")
    ```
    Программа падает. Какая будет ошибка, почему, и как исправить решение?
  rubric:
  - программа упадёт с TypeError в строке кода 3 — две строки нельзя перемножить
  - причина — input() возвращает строки, числа никто не преобразовал
  - исправление — price = float(input()) и count = int(input()); формат :.2f оставить
  - ученик проверяет исправление на примере, например 89.9 и 2 дают 179.80
  wrong_answers:
  - нужно убрать f у строки
  - достаточно написать round вместо :.2f
  followups:
  - Что изменится, если цену вводят с запятой, например 89,9?
