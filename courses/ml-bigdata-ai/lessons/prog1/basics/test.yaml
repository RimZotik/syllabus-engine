title: Контрольная раздела «Основы языка»
pass: 0.85
minutes: 45
questions:
- id: s-names-strip
  type: single
  q: |
    Что выведет программа?
    ```python
    a = "  Да "
    b = a
    a = a.strip()
    print(len(a), len(b))
    ```
  options:
  - '`2 5`'
  - '`2 2`'
  - '`5 5`'
  - '`5 2`'
  answer: 0
  explain: '`b = a` привязывает `b` к той же строке из пяти символов. `strip()` её не меняет, а возвращает новую строку `"Да"`, и к ней перепривязывают только `a`. `b` по-прежнему указывает на исходную строку.'
- id: s-before-start
  type: multi
  q: Из-за каких ошибок программа не выполнит ни одной строки кода? Выберите все.
  options:
  - Не закрыта кавычка в строке 5
  - Лишний отступ перед строкой 3
  - Опечатка `prnt` в строке 4
  - '`int("abc")` в строке 2'
  - Имя используется в строке 3, а создаётся только в строке 4
  answer:
  - 0
  - 1
  explain: Синтаксические ошибки, включая `IndentationError`, находятся до запуска. `NameError` и `ValueError` возникают, когда выполнение доходит до этих строк кода, — в том числе имя, которое ещё не создано.
- id: s-checker-diff
  type: single
  q: |
    Задача — вывести сумму двух целых чисел в формате `Сумма: 12`. Проверка показывает:
    ```
    Ожидалось: Сумма: 12
    Получено:  Сумма: 12.0
    ```
    Что, скорее всего, не так в решении?
  options:
  - Числа прочитаны через `float(input())`, а не `int(input())`
  - Сложение `+` всегда даёт дробное число
  - Числа остались строками и склеились
  - '`print` выводит сумму любых двух чисел с `.0` на конце'
  answer: 0
  explain: Вывод сравнивается посимвольно, а `float` печатается с `.0`. Целые числа при сложении дают целое, а склеенные строки дали бы цифры подряд (для 5 и 7 — `57`), а не `12.0`. `print` выводит целое число без `.0`.
- id: s-kopecks
  type: code
  q: |
    Касса хранит цены в копейках. На вход подаётся цена — целое неотрицательное число копеек. Выведите её в виде `<рубли> руб. <копейки> коп.`, где копейки всегда записаны двумя цифрами: для `1205` — `12 руб. 05 коп.`, для `1250` — `12 руб. 50 коп.`
  solution: |
    kop = int(input())
    rub = kop // 100
    rest = kop % 100
    print(f"{rub} руб. {rest // 10}{rest % 10} коп.")
  tests:
    io:
      - name: Пример из условия
        stdin: "1205\n"
        stdout: "12 руб. 05 коп."
      - name: Копейки без нуля
        stdin: "1250\n"
        stdout: "12 руб. 50 коп."
      - name: Меньше рубля
        stdin: "7\n"
        stdout: "0 руб. 07 коп."
        hidden: true
      - name: Ровно рубли
        stdin: "300\n"
        stdout: "3 руб. 00 коп."
        hidden: true
      - name: Большая сумма
        stdin: "123456\n"
        stdout: "1234 руб. 56 коп."
        hidden: true
  explain: 'Рубли — `kop // 100`, копейки — остаток `kop % 100`. Но f-строка выводит число 5 как `5`, без ведущего нуля. Две цифры копеек можно вывести по отдельности: десятки `rest // 10` и единицы `rest % 10`, вплотную друг к другу. Другой путь — собрать строку `f"{kop / 100:.2f}"`, например `12.05`, и разрезать её срезами по точке.'
- id: s-marks-string
  type: code
  q: |
    Электронный журнал выгружает три оценки ученика одной строкой, без пробелов, например `545`. Выведите их среднее арифметическое ровно с двумя знаками после точки: для `545` — `4.67`.
  solution: |
    marks = input()
    a = int(marks[0])
    b = int(marks[1])
    c = int(marks[2])
    print(f"{(a + b + c) / 3:.2f}")
  tests:
    io:
      - name: Пример из условия
        stdin: "545\n"
        stdout: "4.67"
      - name: Одни пятёрки
        stdin: "555\n"
        stdout: "5.00"
      - name: Среднее не целое
        stdin: "211\n"
        stdout: "1.33"
        hidden: true
      - name: Другие оценки
        stdin: "324\n"
        stdout: "3.00"
        hidden: true
  explain: 'Цифры достают индексами, но `marks[0]` — это текст `"5"`, и `+` его склеил бы; каждую цифру превращают в число через `int`. Делят обычным `/` — `//` дал бы `1` вместо `1.33`, а скобки нужны, потому что деление сильнее сложения.'
- id: s-stopwatch
  type: code
  q: |
    Секундомер показывает время в виде `<минуты>:<секунды>`: секунд всегда две цифры, а минут может быть сколько угодно — `5:07`, `12:30`, `125:00`. Выведите, сколько это всего секунд. Для `5:07` — `307`.
  solution: |
    t = input()
    minutes = int(t[:-3])
    seconds = int(t[-2:])
    print(minutes * 60 + seconds)
  tests:
    io:
      - name: Пример из условия
        stdin: "5:07\n"
        stdout: "307"
      - name: Двузначные минуты
        stdin: "12:30\n"
        stdout: "750"
      - name: Трёхзначные минуты
        stdin: "125:00\n"
        stdout: "7500"
        hidden: true
      - name: Меньше минуты
        stdin: "0:59\n"
        stdout: "59"
        hidden: true
  explain: 'Длина минут заранее неизвестна, зато хвост всегда одинаковый: две цифры секунд и двоеточие перед ними. Поэтому считают с конца: `t[-2:]` — секунды, `t[:-3]` — всё до двоеточия. `int("07")` даёт 7 — ведущий ноль не мешает.'
- id: s-parking
  type: code
  q: |
    Программу для парковки начал коллега. Она читает время въезда и время выезда в виде `ЧЧ:ММ` (в пределах одних суток) и выводит, сколько минут машина стояла. Разберитесь в ней и допишите вторую строку вывода — `К оплате: <сумма> руб.`: каждый начатый час стоит 50 рублей. 61 минута — уже два часа, ровно 60 минут — один, 0 минут — бесплатно. Для `09:15` и `10:16`:
    ```
    Минут: 61
    К оплате: 100 руб.
    ```
  starter: |
    start = input()
    end = input()
    start_min = int(start[:2]) * 60 + int(start[3:])
    end_min = int(end[:2]) * 60 + int(end[3:])
    minutes = end_min - start_min
    print("Минут:", minutes)
  solution: |
    start = input()
    end = input()
    start_min = int(start[:2]) * 60 + int(start[3:])
    end_min = int(end[:2]) * 60 + int(end[3:])
    minutes = end_min - start_min
    print("Минут:", minutes)
    hours = (minutes + 59) // 60
    print("К оплате:", hours * 50, "руб.")
  tests:
    io:
      - name: Пример из условия
        stdin: "09:15\n10:16\n"
        stdout: "Минут: 61\nК оплате: 100 руб."
      - name: Ровно час
        stdin: "08:00\n09:00\n"
        stdout: "Минут: 60\nК оплате: 50 руб."
      - name: Одна минута
        stdin: "23:00\n23:01\n"
        stdout: "Минут: 1\nК оплате: 50 руб."
        hidden: true
      - name: Сразу уехал
        stdin: "12:00\n12:00\n"
        stdout: "Минут: 0\nК оплате: 0 руб."
        hidden: true
      - name: Целый день
        stdin: "07:45\n18:05\n"
        stdout: "Минут: 620\nК оплате: 550 руб."
        hidden: true
  explain: '`minutes // 60` считает только полные часы и для 61 минуты даст 1. Число начатых часов — деление с округлением вверх: `(minutes + 59) // 60` (добавка 59 переносит любую неполную часть в следующий час, а ровные часы не трогает) или `-(-minutes // 60)` — `//` округляет вниз, а у отрицательного числа «вниз» значит дальше от нуля.'
- id: s-login-fix
  type: code
  q: |
    ИИ-ассистент написал генератор логинов: первая буква имени, затем фамилия — всё маленькими латинскими буквами, — затем две последние цифры года рождения. Имя и фамилию вводят как попало: с пробелами по краям и большими буквами. Для `Anna`, `  PETROVA ` и `2007` нужно `apetrova07`. В коде несколько ошибок — найдите и исправьте все.
  starter: |
    name = input()
    surname = input()
    year = int(input())
    login = name[1] + surname.lower() + year[-2:]
    print(login.strip())
  solution: |
    name = input().strip().lower()
    surname = input().strip().lower()
    year = input().strip()
    login = name[0] + surname + year[-2:]
    print(login)
  tests:
    io:
      - name: Пример из условия
        stdin: "Anna\n  PETROVA \n2007\n"
        stdout: "apetrova07"
      - name: Без лишних пробелов
        stdin: "boris\nIvanov\n1999\n"
        stdout: "bivanov99"
      - name: Пробел перед именем
        stdin: " Vera\nsidorova\n2010\n"
        stdout: "vsidorova10"
        hidden: true
      - name: Год с нулями в конце
        stdin: "Ivan\nOrlov\n2000\n"
        stdout: "iorlov00"
        hidden: true
  explain: 'Ошибок четыре. У числа нет индексов — `year[-2:]` падает с `TypeError`, год оставляют строкой (а `int(year) % 100` для 2000 дал бы `0`, а не `00`). Первая буква — `name[0]`, а не `name[1]`. Имя тоже переводят в нижний регистр. А `strip()` в конце убирает пробелы только по краям всего логина — пробелы вокруг фамилии оказались внутри, поэтому чистить нужно каждую строку ввода сразу.'
