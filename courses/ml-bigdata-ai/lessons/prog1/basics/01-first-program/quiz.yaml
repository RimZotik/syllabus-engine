title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: print-quoted
  type: single
  q: |
    Что выведет программа?
    ```python
    print("7 * 3")
    ```
  options:
  - '`21`'
  - '`7 * 3`'
  - '`"7 * 3"`'
  - Программа остановится с ошибкой
  answer: 1
  explain: В кавычках — текст, а не вычисление. `print` выводит его как есть, без самих кавычек.
- id: print-several
  type: single
  q: |
    Что выведет программа?
    ```python
    print("Итого:", 4 + 6, "шт.")
    ```
  options:
  - '`Итого: 10 шт.`'
  - '`Итого:10шт.`'
  - '`Итого: 4 + 6 шт.`'
  - '`Итого:, 10, шт.`'
  answer: 0
  explain: Значения через запятую `print` выводит в одну строку через пробел, а выражение `4 + 6` без кавычек сначала вычисляется.
- id: order
  type: single
  q: |
    Сколько строк выведет эта программа и что будет во второй?
    ```python
    print("один", "два")
    print("три")
    print("четыре" + "пять")
    ```
  options:
  - Три строки, во второй — `три`
  - Четыре строки, во второй — `два`
  - Три строки, во второй — `два три`
  - Две строки, во второй — `три четырепять`
  answer: 0
  explain: Каждый `print` начинает новую строку вывода, а значения через запятую выводит в одну строку через пробел. Поэтому вывод — `один два`, `три`, `четырепять`.
- id: input-type
  type: single
  q: Пользователь набрал `42` и нажал Enter. Что вернул вызов `input()`?
  options:
  - Целое число 42 — ведь набраны только цифры
  - Строку из двух символов — `4` и `2`
  - Число или строку — Python решает по тому, что набрано
  - Дробное число 42.0 — так Python хранит любое введённое число
  answer: 1
  explain: '`input()` всегда возвращает текст — даже если пользователь набрал одни цифры.'
- id: input-plus
  type: single
  q: |
    Пользователь ввёл `1`, а потом `0`, каждое отдельной строкой. Что выведет программа?
    ```python
    a = input()
    b = input()
    print(b + a)
    ```
  options:
  - '`1`'
  - '`10`'
  - '`01`'
  - '`0 1`'
  answer: 2
  explain: '`a` — текст `''1''`, `b` — текст `''0''`. Для текста `+` означает склеивание в том порядке, в каком записано: сначала `b`, потом `a` — получится `01`.'
- id: compare-exact
  type: multi
  q: 'Условие требует вывести `Ответ: 12`. Какие варианты вывода НЕ пройдут проверку? Выберите все.'
  options:
  - '`ответ: 12` — с маленькой буквы'
  - '`Ответ: 12` с лишним пробелом в конце строки'
  - '`Ответ:12` — без пробела после двоеточия'
  - '`Ответ: 12` и пустая строка в самом конце вывода'
  - '`Ответ: 12!` — с восклицательным знаком'
  answer:
  - 0
  - 2
  - 4
  explain: Вывод сравнивается посимвольно — регистр, пробелы внутри строки и знаки препинания важны. Не важны только пробелы в конце строк и пустые строки в самом конце.
- id: prompt-in-check
  type: single
  q: |
    Программа:
    ```python
    name = input("Ваше имя: ")
    print("Привет,", name)
    ```
    Тест подаёт на вход `Аня` и ждёт вывод `Привет, Аня`. Пройдёт ли тест?
  options:
  - Да — при проверке текст подсказки в вывод не попадает
  - 'Нет — в выводе окажется лишний текст `Ваше имя:`'
  - Нет — при проверке `input()` нельзя передавать подсказку
  - Да, но только если подсказка пустая
  answer: 0
  explain: При «Проверить» подсказка из `input()` в вывод не попадает. При «Запустить» вы её увидите — как в терминале.
- id: assert-pass
  type: multi
  q: |
    Тест к задаче:
    ```python
    assert triple(2) == 6, "triple(2) должно вернуть 6"
    ```
    Какие утверждения о нём верны? Выберите все.
  options:
  - Если функция вернула 6, проверка проходит и ничего не выводит
  - Если функция вернула 6, выводится сообщение `triple(2) должно вернуть 6` как подтверждение
  - Знак `==` здесь спрашивает «равно ли?», а не запоминает значение под именем
  - Без текста после запятой `assert` перестанет что-либо проверять
  - Текст после запятой ученик увидит, только если тест провален
  answer:
  - 0
  - 2
  - 4
  explain: Верное утверждение `assert` пропускает молча, а сообщение после запятой показывает только при провале. Без сообщения проверка работает так же, просто при провале видно одно `AssertionError`. `==` — вопрос «равно ли?».
- id: assert-fail
  type: single
  q: |
    Тот же тест:
    ```python
    assert triple(2) == 6, "triple(2) должно вернуть 6"
    ```
    но функция вернула `5`. Что увидит ученик в результатах проверки?
  options:
  - Тест пройден, а сообщение `triple(2) должно вернуть 6` просто выведется на экран
  - Тест не пройден с сообщением `triple(2) должно вернуть 6`
  - Программа выведет `5`
  - Тест не пройден, но без пояснения — только слово `AssertionError`
  answer: 1
  explain: Утверждение ложно — `assert` останавливает проверку с `AssertionError` и показывает текст после запятой.
- id: open-input
  type: open
  q: |
    Программа на вводе `2` и `3` выводит `23`, а не `5`:
    ```python
    a = input()
    b = input()
    print(a + b)
    ```
    Объясните своими словами, почему так происходит и что нужно сделать с введённым, чтобы программа вывела `5`. Как именно это делается, разберём в следующей теме, — сейчас достаточно сказать, что нужно сделать.
  rubric:
  - input() всегда возвращает текст (строку), даже если введены цифры
  - для текста знак + означает склеивание, поэтому '2' и '3' дают '23'
  - чтобы сложить числа, текст нужно сначала превратить в число (достаточно упомянуть, что это делается отдельно — способ разбирается в следующей теме)
  wrong_answers:
  - Python неправильно складывает маленькие числа
  - input() возвращает число, а print склеивает его с другим
  followups:
  - А что выведет эта программа, если ввести кот и ёж?
