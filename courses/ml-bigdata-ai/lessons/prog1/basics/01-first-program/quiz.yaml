title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: print-quoted
  type: single
  q: |
    Что выведет программа?
    ```python
    print("7 * 3")
    ```
  options:
  - '`21`'
  - '`7 * 3`'
  - '`"7 * 3"`'
  - Программа остановится с ошибкой
  answer: 1
  explain: В кавычках — текст, а не вычисление. `print` выводит его как есть, без самих кавычек.
- id: print-several
  type: single
  q: |
    Что выведет программа?
    ```python
    print("Итого:", 4 + 6, "шт.")
    ```
  options:
  - '`Итого: 10 шт.`'
  - '`Итого:10шт.`'
  - '`Итого: 4 + 6 шт.`'
  - '`Итого:, 10, шт.`'
  answer: 0
  explain: Значения через запятую `print` выводит в одну строку через пробел, а выражение `4 + 6` без кавычек сначала вычисляется.
- id: order
  type: single
  q: |
    Сколько строк выведет эта программа и что будет во второй?
    ```python
    print("один", "два")
    print("три")
    print("четыре" + "пять")
    ```
  options:
  - Три строки, во второй — `три`
  - Четыре строки, во второй — `два`
  - Три строки, во второй — `два три`
  - Две строки, во второй — `три четырепять`
  answer: 0
  explain: Каждый `print` начинает новую строку вывода, а значения через запятую выводит в одну строку через пробел. Поэтому вывод — `один два`, `три`, `четырепять`.
- id: input-one-line
  type: single
  q: |
    Пользователь набрал в одной строке `2 3` и нажал Enter. Что выведет программа?
    ```python
    a = input()
    print(a + a)
    ```
  options:
  - '`10`'
  - '`2 32 3`'
  - '`4 6`'
  - Программа будет ждать вторую строку ввода
  answer: 1
  explain: '`input()` забирает всю строку ввода целиком, вместе с пробелом, и возвращает текст `''2 3''`. Для текста `+` — склеивание, поэтому получится `2 32 3`. Чисел здесь нет, так что ни `10`, ни `4 6` не появятся, а второго вызова `input()` в программе нет.'
- id: input-plus
  type: single
  q: |
    Пользователь ввёл `1`, а потом `0`, каждое отдельной строкой. Что выведет программа?
    ```python
    a = input()
    b = input()
    print(b + a)
    ```
  options:
  - '`1`'
  - '`10`'
  - '`01`'
  - '`0 1`'
  answer: 2
  explain: '`a` — текст `''1''`, `b` — текст `''0''`. Для текста `+` означает склеивание в том порядке, в каком записано: сначала `b`, потом `a` — получится `01`.'
- id: assert-which-fail
  type: multi
  q: |
    Каждую из этих строк запускают отдельно. Какие из них остановят программу с `AssertionError`? Выберите все.
  options:
  - '`assert 2 * 3 == 6`'
  - '`assert "2" + "3" == "5"`'
  - '`assert 10 - 4 == 6, "ошибка"`'
  - '`assert "ab" + "c" == "abc"`'
  - '`assert "Привет, " + "Аня" == "Привет,Аня"`'
  answer:
  - 1
  - 4
  explain: 'Верные утверждения `assert` пропускает молча, а сообщение после запятой ничего не меняет. `"2" + "3"` — склеивание текста, получится `"23"`, а не `"5"`. В `"Привет, " + "Аня"` пробел после запятой сохраняется, а справа его нет — строки не равны. Остальные утверждения верны: `2 * 3` — это 6, `10 - 4` — 6, `"ab" + "c"` — `"abc"`.'
- id: assert-fail
  type: single
  q: |
    Тест к задаче:
    ```python
    assert triple(2) == 6, "triple(2) должно вернуть 6"
    ```
    Функция вернула `5`. Что произойдёт?
  options:
  - Проверка пройдёт, а сообщение `triple(2) должно вернуть 6` просто выведется на экран
  - Проверка остановится с `AssertionError` и сообщением `triple(2) должно вернуть 6`
  - Программа выведет `5`
  - Проверка остановится с `AssertionError`, а сообщение покажется только при верном утверждении
  answer: 1
  explain: Утверждение ложно — `assert` останавливает проверку с `AssertionError` и показывает текст после запятой. При верном утверждении `assert` ничего не выводит. Сам `assert` значение `5` не выводит — он только сравнивает.
- id: open-input
  type: open
  q: |
    Программа на вводе `4` и `4` (каждое число отдельной строкой) выводит `44`, а не `8`:
    ```python
    a = input()
    b = input()
    print(a + b)
    ```
    Объясните своими словами, почему так происходит и что нужно сделать с введённым, чтобы программа вывела `8`. Как именно это делается, разберём в следующей теме, — сейчас достаточно сказать, что нужно сделать.
  rubric:
  - input() всегда возвращает текст (строку), даже если введены цифры
  - для текста знак + означает склеивание, поэтому '4' и '4' дают '44'
  - чтобы сложить числа, текст нужно сначала превратить в число (достаточно упомянуть, что это делается отдельно — способ разбирается в следующей теме)
  wrong_answers:
  - Python неправильно складывает маленькие числа
  - input() возвращает число, а print склеивает его с другим
  followups:
  - А что выведет эта программа, если ввести кот и ёж?
