title: Проверка темы
pass: 0.85
minutes: 20
questions:
- id: print-several
  type: single
  q: |
    Что выведет программа?
    ```python
    print("Итого:", 4 + 6, "шт.")
    ```
  options:
  - '`Итого: 10 шт.`'
  - '`Итого:10шт.`'
  - '`Итого: 4 + 6 шт.`'
  - '`Итого:, 10, шт.`'
  answer: 0
  explain: Значения через запятую `print` выводит в одну строку через пробел, а выражение `4 + 6` без кавычек сначала вычисляется.
- id: input-one-line
  type: single
  q: |
    Пользователь набрал в одной строке `2 3` и нажал Enter. Что выведет программа?
    ```python
    a = input()
    print(a + a)
    ```
  options:
  - '`10`'
  - '`2 32 3`'
  - '`4 6`'
  - Программа будет ждать вторую строку ввода
  answer: 1
  explain: '`input()` забирает всю строку ввода целиком, вместе с пробелом, и возвращает текст `''2 3''`. Для текста `+` — склеивание, поэтому получится `2 32 3`. Чисел здесь нет, так что ни `10`, ни `4 6` не появятся, а второго вызова `input()` в программе нет.'
- id: assert-which-fail
  type: multi
  q: |
    Каждую из этих строк запускают отдельно. Какие из них остановят программу с `AssertionError`? Выберите все.
  options:
  - '`assert 2 * 3 == 6`'
  - '`assert "2" + "3" == "5"`'
  - '`assert 10 - 4 == 6, "ошибка"`'
  - '`assert "ab" + "c" == "abc"`'
  - '`assert "Привет, " + "Аня" == "Привет,Аня"`'
  answer:
  - 1
  - 4
  explain: 'Верные утверждения `assert` пропускает молча, а сообщение после запятой ничего не меняет. `"2" + "3"` — склеивание текста, получится `"23"`, а не `"5"`. В `"Привет, " + "Аня"` пробел после запятой сохраняется, а справа его нет — строки не равны. Остальные утверждения верны: `2 * 3` — это 6, `10 - 4` — 6, `"ab" + "c"` — `"abc"`.'
- id: fix-input-order
  type: code
  q: |
    На вход подаются две строки: сначала имя, потом город. Программа должна вывести `<имя> живёт в городе <город>`, но на вводе `Аня` и `Казань` выводит `Казань живёт в городе Аня`. Исправьте её.
  starter: |
    city = input()
    name = input()
    print(name, "живёт в городе", city)
  solution: |
    name = input()
    city = input()
    print(name, "живёт в городе", city)
  tests:
    io:
      - name: Пример из условия
        stdin: "Аня\nКазань\n"
        stdout: "Аня живёт в городе Казань"
      - name: Другие данные
        stdin: "Борис\nОмск\n"
        stdout: "Борис живёт в городе Омск"
      - name: Город из двух слов
        stdin: "Вера\nНижний Новгород\n"
        stdout: "Вера живёт в городе Нижний Новгород"
        hidden: true
  explain: Каждый вызов `input()` забирает следующую строку ввода, строго по порядку. Первая строка — имя, поэтому первый `input()` и нужно назвать `name`, а второй — `city`. Поменять местами имена в `print` тоже сработает, но тогда `city` будет указывать на имя, а `name` — на город, и такой код легко прочитать неправильно.
- id: complete-date
  type: code
  q: |
    На вход подаются три строки: день, месяц и год, например `05`, `03` и `2026`. Допишите программу, чтобы она выводила дату через точки, без пробелов: `05.03.2026`.
  starter: |
    day = input()
    month = input()
    print(day + "." + month)
  solution: |
    day = input()
    month = input()
    year = input()
    print(day + "." + month + "." + year)
  tests:
    io:
      - name: Пример из условия
        stdin: "05\n03\n2026\n"
        stdout: "05.03.2026"
      - name: Конец года
        stdin: "31\n12\n1999\n"
        stdout: "31.12.1999"
      - name: Начало года
        stdin: "01\n01\n2000\n"
        stdout: "01.01.2000"
        hidden: true
  explain: Год — третья строка ввода, для неё нужен третий вызов `input()`. Склеивать надо знаком `+`, он соединяет текст вплотную; `print` с запятыми поставил бы пробелы вокруг точек.
- id: glue-input
  type: code
  q: |
    Напишите программу, которая показывает, что делает `+` с тем, что пришло из `input()`. Пользователь вводит одну строку; для ввода `7` программа выводит `7 + 7 = 77`, для `12` — `12 + 12 = 1212`.
  starter: |
    a = input()
  solution: |
    a = input()
    print(a, "+", a, "=", a + a)
  tests:
    io:
      - name: Пример из условия
        stdin: "7\n"
        stdout: "7 + 7 = 77"
      - name: Двузначное число
        stdin: "12\n"
        stdout: "12 + 12 = 1212"
      - name: Ноль
        stdin: "0\n"
        stdout: "0 + 0 = 00"
        hidden: true
      - name: Слово
        stdin: "кот\n"
        stdout: "кот + кот = коткот"
        hidden: true
  explain: '`input()` возвращает текст, даже если введены цифры, поэтому `a + a` склеивает две копии. Знаки `+` и `=` в выводе — тоже текст, их передают `print` в кавычках, через запятую: так между частями встают пробелы.'
- id: greet-two
  type: code
  q: |
    На вход подаются два имени, каждое в своей строке. Выведите одной строкой `Привет, <имя1> и <имя2>!` — с запятой после «Привет», пробелами вокруг «и» и восклицательным знаком вплотную ко второму имени. Для `Аня` и `Борис` — `Привет, Аня и Борис!`
  solution: |
    first = input()
    second = input()
    print("Привет,", first, "и", second + "!")
  tests:
    io:
      - name: Пример из условия
        stdin: "Аня\nБорис\n"
        stdout: "Привет, Аня и Борис!"
      - name: Другие имена
        stdin: "Вера\nГлеб\n"
        stdout: "Привет, Вера и Глеб!"
      - name: Имена из одной буквы
        stdin: "Я\nЮ\n"
        stdout: "Привет, Я и Ю!"
        hidden: true
      - name: Имя из двух слов
        stdin: "Анна Мария\nПётр\n"
        stdout: "Привет, Анна Мария и Пётр!"
        hidden: true
  explain: 'Где нужен пробел, удобно передать значения `print` через запятую; где пробела быть не должно — склеить знаком `+`: `second + "!"`. Можно собрать и всю строку одним `+`, тогда пробелы вписывают в кавычки сами: `"Привет, " + first + " и " + second + "!"`.'
