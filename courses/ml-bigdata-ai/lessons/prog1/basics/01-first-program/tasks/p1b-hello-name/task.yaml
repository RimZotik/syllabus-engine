id: p1b-hello-name
title: Приветствие
sandbox: python-browser
difficulty: 1
statement: |
  Прочитайте имя через `input()` и выведите приветствие в точности в таком виде: `Привет, <имя>!` — с запятой после «Привет», пробелом и восклицательным знаком сразу после имени, без пробела перед ним.

  ```input
  Аня
  ```
  ```
  Привет, Аня!
  ```
starter: |
  name = input()
  print("Привет,", name)
stdin: "Аня\n"
solution: |
  name = input()
  print("Привет, " + name + "!")
tests:
  io:
    - name: Пример из условия
      stdin: "Аня\n"
      stdout: "Привет, Аня!"
    - name: Другое имя
      stdin: "Борис\n"
      stdout: "Привет, Борис!"
    - name: Имя из одной буквы
      stdin: "Я\n"
      stdout: "Привет, Я!"
      hidden: true
    - name: Имя из двух слов
      stdin: "Анна Мария\n"
      stdout: "Привет, Анна Мария!"
      hidden: true
hints:
  - level: 1
    text: Запустите стартовый код и сравните его вывод с примером посимвольно. Чего не хватает?
  - level: 2
    text: Если передать `print` несколько значений через запятую, она ставит между ними пробел. Поэтому, если добавить `"!"` третьим значением в `print`, между именем и знаком появится пробел. Нужно, чтобы знак стоял вплотную к имени.
  - level: 3
    text: Соберите текст знаком `+` — так же, как в теории склеились `"2"` и `"3"`. При склеивании пробелы сами не появляются, поэтому пробел после запятой придётся вписать в кавычки самому.
