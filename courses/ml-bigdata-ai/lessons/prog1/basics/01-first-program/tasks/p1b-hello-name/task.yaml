id: p1b-hello-name
title: Приветствие
sandbox: python-browser
difficulty: 1
statement: |
  Прочитайте имя через `input()` и выведите приветствие в точности в таком виде: `Привет, <имя>!` — с запятой после «Привет», пробелом и восклицательным знаком сразу после имени, без пробела перед ним.

  Пример. Ввод: `Аня`. Вывод: `Привет, Аня!`
starter: |
  name = input()
  print("Привет,", name)
stdin: "Аня\n"
solution: |
  name = input()
  print("Привет, " + name + "!")
tests:
  io:
    - name: Пример из условия
      stdin: "Аня\n"
      stdout: "Привет, Аня!"
    - name: Другое имя
      stdin: "Борис\n"
      stdout: "Привет, Борис!"
    - name: Имя из одной буквы
      stdin: "Я\n"
      stdout: "Привет, Я!"
      hidden: true
    - name: Имя из двух слов
      stdin: "Анна Мария\n"
      stdout: "Привет, Анна Мария!"
      hidden: true
hints:
  - level: 1
    text: Запустите стартовый код и сравните его вывод с примером посимвольно. Чего не хватает?
  - level: 2
    text: Если передать print несколько значений через запятую, она ставит между ними пробел — в том числе перед восклицательным знаком. Нужно, чтобы знак стоял вплотную к имени.
  - level: 3
    text: Склейте текст знаком +, как склеивались строки "2" и "3" в теории — "Привет, " + name + "!".
