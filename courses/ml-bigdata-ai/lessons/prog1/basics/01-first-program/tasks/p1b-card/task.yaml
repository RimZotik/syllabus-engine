id: p1b-card
title: Анкета
sandbox: python-browser
difficulty: 1
statement: |
  На вход подаются две строки: в первой — имя, во второй — город. Выведите две строки: в первой `Имя: <имя>`, во второй `Город: <город>`.

  Пример. Ввод — две строки: `Аня` и `Казань`.

  Вывод — тоже две строки: `Имя: Аня` и `Город: Казань`.
starter: |
  name = input()
  print("Имя:", name)
stdin: "Аня\nКазань\n"
solution: |
  name = input()
  city = input()
  print("Имя:", name)
  print("Город:", city)
tests:
  io:
    - name: Пример из условия
      stdin: "Аня\nКазань\n"
      stdout: "Имя: Аня\nГород: Казань"
    - name: Другие данные
      stdin: "Пётр\nСанкт-Петербург\n"
      stdout: "Имя: Пётр\nГород: Санкт-Петербург"
    - name: Короткие строки
      stdin: "Ю\nОрёл\n"
      stdout: "Имя: Ю\nГород: Орёл"
      hidden: true
hints:
  - level: 1
    text: Сколько строк ввода в условии? Столько же раз нужно вызвать input().
  - level: 2
    text: Сначала прочитайте обе строки ввода под разными именами, например name и city, потом выводите.
  - level: 3
    text: Каждый print выводит текст с новой строки — понадобятся два print, второй — print("Город:", city).
