id: p1b-initials
title: Фамилия и инициалы
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте программу: она выводит фамилию и инициалы в формате `Фамилия И. О.`**

  На вход подаются три строки: фамилия, имя и отчество. Выведите фамилию, затем через пробел первую букву имени с точкой и через пробел первую букву отчества с точкой.

  Пример 1

  ```input
  Иванова
  Анна
  Сергеевна
  ```
  ```output
  Иванова А. С.
  ```

  Пример 2

  ```input
     Ким
   Ян
  Ильич
  ```
  ```output
  Ким Я. И.
  ```

  Ограничения: в начале и в конце любой строки могут стоять лишние пробелы.
starter: |
  surname = input()
  name = input()
  patronymic = input()
  print(f"{surname} {name[1]}. {patronymic[1]}.")
stdin: "Иванова\nАнна\nСергеевна\n"
solution: |
  surname = input().strip()
  name = input().strip()
  patronymic = input().strip()
  print(f"{surname} {name[0]}. {patronymic[0]}.")
tests:
  io:
    - name: Пример 1
      stdin: "Иванова\nАнна\nСергеевна\n"
      stdout: "Иванова А. С."
    - name: Пример 2
      stdin: "   Ким\n Ян\nИльич\n"
      stdout: "Ким Я. И."
    - name: Другое имя
      stdin: "Петров\nИгорь\nНиколаевич\n"
      stdout: "Петров И. Н."
      hidden: true
    - name: Пробелы с обеих сторон
      stdin: "  Орлова \n Вера  \n  Павловна  \n"
      stdout: "Орлова В. П."
      hidden: true
    - name: Имя из одной буквы
      stdin: "Лю\nЮ\nОлегович\n"
      stdout: "Лю Ю. О."
      hidden: true
hints:
  - level: 1
    text: С какого номера начинаются индексы в строке? Какой символ даёт `name[1]`?
  - level: 2
    text: Первая буква — под индексом 0. Но если перед именем стоит пробел, `name[0]` — это пробел. Какой метод убирает пробелы по краям?
  - level: 3
    text: Метод можно вызвать прямо у результата `input()` — у всех трёх строк, включая фамилию.
