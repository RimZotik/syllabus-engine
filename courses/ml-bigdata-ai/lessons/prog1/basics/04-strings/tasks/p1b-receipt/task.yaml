id: p1b-receipt
title: Кассовый чек
sandbox: python-browser
difficulty: 3
statement: |
  **Напечатайте кассовый чек: товар, расчёт суммы и сдачу.**

  На вход подаются четыре строки: название товара, цена за штуку, количество и сколько денег дал покупатель. Выведите три строки:

  ```
  Товар: <название>
  <количество> x <цена> = <сумма> руб.
  Сдача: <сдача> руб.
  ```

  Название — без пробелов по краям. `x` — латинская буква, вокруг неё и вокруг `=` по одному пробелу. Цена, сумма и сдача — ровно с двумя знаками после точки.

  Пример 1

  ```input
  Молоко
  89.9
  2
  200
  ```
  ```output
  Товар: Молоко
  2 x 89.90 = 179.80 руб.
  Сдача: 20.20 руб.
  ```

  Ограничения: цена и деньги покупателя — числа через точку, количество — целое число от 1. Покупатель даёт не меньше, чем стоит покупка.
starter: |
  name = input()
  price = float(input())
  count = int(input())
  paid = float(input())
  print("Товар:", name)
stdin: "Молоко\n89.9\n2\n200\n"
solution: |
  name = input().strip()
  price = float(input())
  count = int(input())
  paid = float(input())
  total = price * count
  change = paid - total
  print(f"Товар: {name}")
  print(f"{count} x {price:.2f} = {total:.2f} руб.")
  print(f"Сдача: {change:.2f} руб.")
tests:
  io:
    - name: Пример 1
      stdin: "Молоко\n89.9\n2\n200\n"
      stdout: "Товар: Молоко\n2 x 89.90 = 179.80 руб.\nСдача: 20.20 руб."
    - name: Одна штука
      stdin: "Хлеб бородинский\n45\n1\n50\n"
      stdout: "Товар: Хлеб бородинский\n1 x 45.00 = 45.00 руб.\nСдача: 5.00 руб."
    - name: Пробелы вокруг названия
      stdin: "   Сыр  \n650.5\n3\n2000\n"
      stdout: "Товар: Сыр\n3 x 650.50 = 1951.50 руб.\nСдача: 48.50 руб."
      hidden: true
    - name: Неточная сумма дробных
      stdin: "Спички\n0.1\n3\n1\n"
      stdout: "Товар: Спички\n3 x 0.10 = 0.30 руб.\nСдача: 0.70 руб."
      hidden: true
    - name: Без сдачи
      stdin: "Гвоздь\n12.5\n1000\n12500\n"
      stdout: "Товар: Гвоздь\n1000 x 12.50 = 12500.00 руб.\nСдача: 0.00 руб."
      hidden: true
    - name: Сдача в копейках
      stdin: "Тетрадь\n99.99\n3\n300\n"
      stdout: "Товар: Тетрадь\n3 x 99.99 = 299.97 руб.\nСдача: 0.03 руб."
      hidden: true
hints:
  - level: 1
    text: Разбейте задачу на части — прочитать четыре значения, посчитать сумму и сдачу, вывести три строки. Какие части стартовый код ещё не делает?
  - level: 2
    text: Сумма — цена, умноженная на количество, сдача — деньги покупателя минус сумма. Пробелы по краям убирает `strip()`.
  - level: 3
    text: Каждую строку чека удобно собрать одной f-строкой. Формат `:.2f` нужен у каждого из трёх чисел — цены, суммы и сдачи.
