id: p1b-receipt
title: Кассовый чек
sandbox: python-browser
difficulty: 3
statement: |
  Маленькая настоящая программа для кассы. На вход подаются три строки: название товара, цена за штуку (дробное число через точку) и количество (целое число). Продавец мог случайно поставить пробелы вокруг названия.

  Выведите две строки чека. Первая: `Товар: <название>` — название без лишних пробелов по краям. Вторая: `<количество> x <цена> = <сумма> руб.` — цена и сумма ровно с двумя знаками после точки, между частями по одному пробелу, `x` — латинская буква.

  Пример. Ввод — три строки: `Молоко`, `89.9`, `2`.

  Вывод — две строки: `Товар: Молоко` и `2 x 89.90 = 179.80 руб.`
starter: |
  name = input()
  price = float(input())
  count = int(input())
  print("Товар:", name)
stdin: "Молоко\n89.9\n2\n"
solution: |
  name = input().strip()
  price = float(input())
  count = int(input())
  total = price * count
  print(f"Товар: {name}")
  print(f"{count} x {price:.2f} = {total:.2f} руб.")
tests:
  io:
    - name: Пример из условия
      stdin: "Молоко\n89.9\n2\n"
      stdout: "Товар: Молоко\n2 x 89.90 = 179.80 руб."
    - name: Одна штука
      stdin: "Хлеб бородинский\n45\n1\n"
      stdout: "Товар: Хлеб бородинский\n1 x 45.00 = 45.00 руб."
    - name: Пробелы вокруг названия
      stdin: "   Сыр  \n650.5\n3\n"
      stdout: "Товар: Сыр\n3 x 650.50 = 1951.50 руб."
      hidden: true
    - name: Неточная сумма дробных
      stdin: "Спички\n0.1\n3\n"
      stdout: "Товар: Спички\n3 x 0.10 = 0.30 руб."
      hidden: true
    - name: Большое количество
      stdin: "Гвоздь\n12.5\n1000\n"
      stdout: "Товар: Гвоздь\n1000 x 12.50 = 12500.00 руб."
      hidden: true
hints:
  - level: 1
    text: Разбейте задачу на части — прочитать три значения, посчитать сумму, вывести две строки. Какую часть стартовый код ещё не делает?
  - level: 2
    text: Пробелы убирает strip(), а два знака после точки даёт формат :.2f в f-строке — его нужно применить и к цене, и к сумме.
  - level: 3
    text: Вторая строка — print(f"{count} x {price:.2f} = {total:.2f} руб."), где total = price * count.
