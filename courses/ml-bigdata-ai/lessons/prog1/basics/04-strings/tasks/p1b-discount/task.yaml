id: p1b-discount
title: Цена со скидкой
sandbox: python-browser
difficulty: 2
statement: |
  На вход подаются две строки: цена товара в рублях и скидка в процентах (целое число от 0 до 100). Цена может быть дробной, причём дробная часть отделена либо точкой, либо запятой — как пришло из старой кассы.

  Выведите `Цена со скидкой: <цена> руб.`, где цена записана ровно с двумя знаками после точки.

  ```input
  1000
  15
  ```
  ```
  Цена со скидкой: 850.00 руб.
  ```

  Второй пример:

  ```input
  199,9
  10
  ```
  ```
  Цена со скидкой: 179.91 руб.
  ```
starter: |
  price = float(input())
  discount = int(input())
  new_price = price * (100 - discount) / 100
  print("Цена со скидкой:", new_price, "руб.")
stdin: "1000\n15\n"
solution: |
  price = float(input().replace(",", "."))
  discount = int(input())
  new_price = price * (100 - discount) / 100
  print(f"Цена со скидкой: {new_price:.2f} руб.")
tests:
  io:
    - name: Пример из условия
      stdin: "1000\n15\n"
      stdout: "Цена со скидкой: 850.00 руб."
    - name: Цена с запятой
      stdin: "199,9\n10\n"
      stdout: "Цена со скидкой: 179.91 руб."
    - name: Без скидки
      stdin: "500\n0\n"
      stdout: "Цена со скидкой: 500.00 руб."
      hidden: true
    - name: Скидка 100 %
      stdin: "750.5\n100\n"
      stdout: "Цена со скидкой: 0.00 руб."
      hidden: true
    - name: Много знаков после точки
      stdin: "99.99\n33\n"
      stdout: "Цена со скидкой: 66.99 руб."
      hidden: true
hints:
  - level: 1
    text: Запустите стартовый код на обоих примерах. Какая ошибка во втором? А чем отличается вывод в первом?
  - level: 2
    text: '`float` понимает только точку — запятую нужно заменить до преобразования. А два знака после точки даёт формат `:.2f` в f-строке.'
  - level: 3
    text: Вызовите `replace` у строки, которую вернул `input()`, ещё до `float`. Вывод соберите одной f-строкой — текст, цена с форматом `:.2f` и `руб.`.
