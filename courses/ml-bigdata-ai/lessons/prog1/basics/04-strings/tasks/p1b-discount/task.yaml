id: p1b-discount
title: Цена со скидкой
sandbox: python-browser
difficulty: 2
statement: |
  **Выведите цену товара после скидки.**

  На вход подаются две строки: цена в рублях и скидка в процентах. Дробная часть цены отделена точкой или запятой. Вывод — `Цена со скидкой: <цена> руб.`, цена ровно с двумя знаками после точки.

  Пример 1

  ```input
  1000
  15
  ```
  ```output
  Цена со скидкой: 850.00 руб.
  ```

  Пример 2

  ```input
  199,9
  10
  ```
  ```output
  Цена со скидкой: 179.91 руб.
  ```

  Ограничения: скидка — целое число от 0 до 100.
starter: |
  price = float(input())
  discount = int(input())
  new_price = price * (100 - discount) / 100
  print("Цена со скидкой:", new_price, "руб.")
stdin: "199,9\n10\n"
solution: |
  price = float(input().replace(",", "."))
  discount = int(input())
  new_price = price * (100 - discount) / 100
  print(f"Цена со скидкой: {new_price:.2f} руб.")
tests:
  io:
    - name: Пример 1
      stdin: "1000\n15\n"
      stdout: "Цена со скидкой: 850.00 руб."
    - name: Пример 2
      stdin: "199,9\n10\n"
      stdout: "Цена со скидкой: 179.91 руб."
    - name: Без скидки
      stdin: "500\n0\n"
      stdout: "Цена со скидкой: 500.00 руб."
      hidden: true
    - name: Скидка 100 %
      stdin: "750.5\n100\n"
      stdout: "Цена со скидкой: 0.00 руб."
      hidden: true
    - name: Цена с точкой и копейками
      stdin: "99.99\n33\n"
      stdout: "Цена со скидкой: 66.99 руб."
      hidden: true
    - name: Цена с запятой и копейками
      stdin: "1234,56\n25\n"
      stdout: "Цена со скидкой: 925.92 руб."
      hidden: true
hints:
  - level: 1
    text: Запустите стартовый код на обоих примерах. Что идёт не так во втором? Чем отличается вывод в первом?
  - level: 2
    text: '`float` понимает только точку — запятую нужно заменить ещё до преобразования. Два знака после точки даёт формат `:.2f` в f-строке.'
  - level: 3
    text: Вызовите `replace` у строки, которую вернул `input()`, а уже результат передайте в `float`. Вывод соберите одной f-строкой.
