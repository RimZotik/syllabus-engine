id: p1b-ai-average
title: ИИ-ассистент посчитал средний балл
sandbox: python-browser
difficulty: 2
statement: |
  Задача: на вход подаются три целые оценки, каждая в отдельной строке. Выведите их среднее арифметическое ровно с двумя знаками после точки.

  ```input
  3
  4
  5
  ```
  ```
  4.00
  ```

  Решение в редакторе написал ИИ-ассистент. На примере из условия оно выводит правильный ответ, но часть тестов не проходит. Проследите код вручную на таком вводе (правильный ответ — `1.67`), найдите ошибку и исправьте её:
  ```
  1
  2
  2
  ```
starter: |
  # Решение от ИИ-ассистента
  a = int(input())
  b = int(input())
  c = int(input())
  average = (a + b + c) // 3
  print(f"{average:.2f}")
stdin: "3\n4\n5\n"
solution: |
  a = int(input())
  b = int(input())
  c = int(input())
  average = (a + b + c) / 3
  print(f"{average:.2f}")
tests:
  io:
    - name: Пример из условия
      stdin: "3\n4\n5\n"
      stdout: "4.00"
    - name: Среднее не целое
      stdin: "1\n2\n2\n"
      stdout: "1.67"
    - name: Пятёрки и четвёрка
      stdin: "5\n5\n4\n"
      stdout: "4.67"
      hidden: true
    - name: Отрицательные числа
      stdin: "-1\n0\n0\n"
      stdout: "-0.33"
      hidden: true
    - name: Одинаковые оценки
      stdin: "2\n2\n2\n"
      stdout: "2.00"
      hidden: true
hints:
  - level: 1
    text: Чему равно `(1 + 2 + 2) // 3`? А сколько должно получиться?
  - level: 2
    text: Знак `//` округляет вниз ещё до форматирования, и `:.2f` показывает уже округлённое число. Какое деление даёт дробный результат?
  - level: 3
    text: Из трёх видов деления дробный результат всегда даёт только один. В строке с `average` нужно поменять ровно один знак.
