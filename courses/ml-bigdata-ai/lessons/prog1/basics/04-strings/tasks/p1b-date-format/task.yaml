id: p1b-date-format
title: Дата в русском формате
sandbox: python-browser
difficulty: 2
statement: |
  **Переведите дату из формата `ГГГГ-ММ-ДД` в формат `ДД.ММ.ГГГГ`.**

  На вход подаётся одна строка — дата. Выведите ту же дату: день, точка, месяц, точка, год. Ведущие нули сохраняются: `08`, а не `8`.

  Пример 1

  ```input
  2025-03-08
  ```
  ```output
  08.03.2025
  ```

  Пример 2

  ```input
  1999-12-31
  ```
  ```output
  31.12.1999
  ```

  Ограничения: год — ровно четыре цифры, месяц и день — ровно по две.
starter: |
  date = input()
stdin: "2025-03-08\n"
solution: |
  date = input()
  print(f"{date[8:]}.{date[5:7]}.{date[:4]}")
tests:
  io:
    - name: Пример 1
      stdin: "2025-03-08\n"
      stdout: "08.03.2025"
    - name: Пример 2
      stdin: "1999-12-31\n"
      stdout: "31.12.1999"
    - name: Нули в дне и месяце
      stdin: "2000-01-01\n"
      stdout: "01.01.2000"
      hidden: true
    - name: Ноль только в дне
      stdin: "2024-10-05\n"
      stdout: "05.10.2024"
      hidden: true
    - name: Ноль только в месяце
      stdin: "1987-07-20\n"
      stdout: "20.07.1987"
      hidden: true
hints:
  - level: 1
    text: Выпишите строку `2025-03-08` и подпишите под каждым символом его индекс. С какого индекса начинается месяц? А день?
  - level: 2
    text: Год — срез от начала до индекса 4. Помните, что конец среза не включается. Какие срезы дадут месяц и день?
  - level: 3
    text: Не превращайте части даты в числа — `int("08")` даст `8`, и ноль пропадёт. Склейте три среза и две точки одной f-строкой.
