title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: index-first
  type: single
  q: 'Что выведет программа s = "Москва"; print(s[1])?'
  options:
  - М
  - о
  - с
  - IndexError
  answer: 1
  explain: Индексы начинаются с нуля — s[0] это М, а s[1] — второй символ, о.
  traps: [0]
- id: index-negative
  type: single
  q: 'Что выведет программа s = "Москва"; print(s[-2])?'
  options:
  - в
  - о
  - а
  - IndexError
  answer: 0
  explain: -1 — последний символ а, -2 — предпоследний в.
- id: slice
  type: single
  q: 'Что выведет программа word = "программа"; print(word[3:6])?'
  options:
  - гра
  - грам
  - огр
  - рам
  answer: 0
  explain: Срез берёт индексы 3, 4 и 5 — г, р, а. Индекс 6 не включается.
- id: immutable
  type: single
  q: 'Что произойдёт при выполнении s = "кот"; s[0] = "К"?'
  options:
  - s станет указывать на Кот
  - Ошибка TypeError — строку нельзя изменить на месте
  - Первая буква заменится, но только при выводе
  - Ошибка IndexError — индекса 0 нет
  answer: 1
  explain: Строки неизменяемы. Чтобы получить Кот, нужно собрать новую строку — "К" + s[1:].
- id: strip-result
  type: single
  q: 'Что выведет программа s = "  да  "; s.strip(); print(len(s))?'
  options:
  - '2'
  - '6'
  - '4'
  - '0'
  answer: 1
  explain: strip() вернул новую строку да, но её не привязали к имени. s по-прежнему указывает на исходную строку из шести символов.
- id: fstring-format
  type: single
  q: 'Что выведет программа price = 7.5; print(f"{price * 2:.2f}")?'
  options:
  - '15.0'
  - '15.00'
  - '7.50 * 2'
  - '{price * 2:.2f}'
  answer: 1
  explain: f-строка вычисляет выражение в скобках — 15.0 — и выводит его с двумя знаками после точки.
- id: concat-int
  type: single
  q: 'Что произойдёт при выполнении print("Итого: " + 10)?'
  options:
  - 'Выведется Итого: 10'
  - Ошибка TypeError — строку нельзя склеить с числом
  - 'Выведется Итого: 10.0'
  - 'Выведется Итого:'
  answer: 1
  explain: 'Python не превращает число в текст сам. Нужно str(10) или f-строка: f"Итого: {10}".'
- id: in-case
  type: single
  q: 'Что выведет print("кот" in "Котлета")?'
  options:
  - 'True'
  - 'False'
  - '0'
  - Котлета
  answer: 1
  explain: Регистр важен — в строке есть Кот с большой буквы, а кот с маленькой не встречается.
- id: greeting-variants
  type: multi
  q: 'name = "Аня". Какие строки кода выведут ровно Привет, Аня! ? Выберите все.'
  options:
  - 'print(f"Привет, {name}!")'
  - 'print("Привет, " + name + "!")'
  - 'print("Привет, {name}!")'
  - 'print("Привет,", name, "!")'
  answer:
  - 0
  - 1
  explain: Без буквы f фигурные скобки выводятся как есть. print с запятыми ставит пробел и перед восклицательным знаком.
- id: open-upper
  type: open
  q: Ученик пишет name = input(), потом name.upper(), потом print(name) — и удивляется, что имя вывелось маленькими буквами. Объясните, что происходит, и как исправить.
  rubric:
  - строки неизменяемы — метод upper не меняет исходную строку
  - upper() возвращает новую строку, но её результат никуда не привязан и теряется
  - исправление — привязать результат к имени, name = name.upper() (или сразу print(name.upper()))
  wrong_answers:
  - upper работает только с латиницей
  - нужно вызвать upper до input
  followups:
  - Что выведет print(name.strip().lower()) для ввода "  АнЯ "?
