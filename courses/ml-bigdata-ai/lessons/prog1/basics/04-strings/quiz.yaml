title: Проверка темы
pass: 0.85
minutes: 30
questions:
- id: index-negative
  type: single
  q: |
    Что выведет программа?
    ```python
    s = "Москва"
    print(s[len(s) - 1], s[-6])
    ```
  options:
  - '`а М`'
  - '`в М`'
  - '`а о`'
  - Остановится с `IndexError`
  answer: 0
  explain: 'В слове 6 букв, поэтому `s[len(s) - 1]` — это `s[5]`, последняя буква `а`. Отрицательные индексы идут от `-1` до `-6`, и `s[-6]` — первая буква `М`.'
- id: slice-rebuild
  type: single
  q: |
    Что выведет программа?
    ```python
    s = "кошка"
    s = s[:2] + "р" + s[3:]
    print(s)
    ```
  options:
  - '`корка`'
  - '`кошка` — строки неизменяемы'
  - '`коршка`'
  - Остановится с `TypeError` — строки неизменяемы
  answer: 0
  explain: 'Строку `"кошка"` никто не меняет: из её кусков `"ко"` и `"ка"` и буквы `"р"` собирается новая строка, и имя `s` привязывается к ней. Срез `s[:2]` не включает индекс 2, а `s[3:]` начинается с индекса 3, поэтому буква `ш` выпадает. `TypeError` был бы при попытке `s[2] = "р"`.'
- id: in-case
  type: multi
  q: '`text = "Котлета по-киевски"`. Какие выражения дадут `True`? Выберите все.'
  options:
  - '`"кот" in text`'
  - '`"кот" in text.lower()`'
  - '`"Кот" in text`'
  - '`"Котлета по-Киевски" in text`'
  - '`"лета по" in text`'
  answer:
  - 1
  - 2
  - 4
  explain: '`in` ищет кусок текста с точностью до регистра. `кот` с маленькой буквы есть только в `text.lower()`, а `Киевски` с большой в строке нет. Кусок может захватывать и пробел: `лета по` встречается внутри строки.'
- id: greeting-variants
  type: multi
  q: '`name = "Аня"`. Какие строки кода выведут ровно `Привет, Аня!`? Выберите все.'
  options:
  - '`print(f"Привет, {name}!")`'
  - '`print("Привет, " + name + "!")`'
  - '`print("Привет, {name}!")`'
  - '`print("Привет,", name, "!")`'
  - '`print(f"Привет, {name}" + "!")`'
  answer:
  - 0
  - 1
  - 4
  explain: Без буквы `f` фигурные скобки выводятся как есть. `print` с запятыми ставит пробел и перед восклицательным знаком. f-строку можно склеить с другой строкой, как любую строку.
- id: fix-coupon
  type: code
  q: |
    Покупатель вводит код купона как получится: с пробелами по краям и маленькими буквами. Программа должна вывести код без пробелов по краям и большими буквами: для `  sale20 ` — `SALE20`. Сейчас она выводит код таким, каким его ввели. Исправьте её.
  starter: |
    code = input()
    code.strip()
    code.upper()
    print(code)
  solution: |
    code = input()
    code = code.strip()
    code = code.upper()
    print(code)
  tests:
    io:
      - name: Пример из условия
        stdin: "  sale20 \n"
        stdout: "SALE20"
      - name: Без пробелов
        stdin: "winter\n"
        stdout: "WINTER"
      - name: Пробелы и смешанный регистр
        stdin: "  a1B2  \n"
        stdout: "A1B2"
        hidden: true
  explain: Строки неизменяемы, поэтому `strip()` и `upper()` не меняют строку, на которую указывает `code`, а возвращают новую. Её надо привязать к имени — `code = code.strip()`, иначе результат теряется. Можно и в одну строку — `code = input().strip().upper()`.
- id: fix-card-slice
  type: code
  q: |
    Программа скрывает номер карты: из 16 цифр показывает только последние четыре, в виде `**** 5678`. На вводе `1234567812345678` она выводит `**** 567`. Исправьте её.
  starter: |
    card = input()
    last = card[len(card) - 4:len(card) - 1]
    print("****", last)
  solution: |
    card = input()
    last = card[-4:]
    print("****", last)
  tests:
    io:
      - name: Пример из условия
        stdin: "1234567812345678\n"
        stdout: "**** 5678"
      - name: Другая карта
        stdin: "4276000011112222\n"
        stdout: "**** 2222"
      - name: Нули в конце номера
        stdin: "1111222233330009\n"
        stdout: "**** 0009"
        hidden: true
  explain: Срез `s[a:b]` не включает символ с индексом `b`, поэтому конец `len(card) - 1` отрезает последнюю цифру. Нужно `card[len(card) - 4:len(card)]` или короче `card[-4:]` — без конца срез идёт до самого конца строки.
- id: write-fuel
  type: code
  q: |
    Расход топлива считают в литрах на 100 км. На вход подаются пройденный путь в километрах и потраченные литры — числа через точку, каждое в своей строке. Выведите `Расход: <число> л/100 км`, где число — ровно с двумя знаками после точки. Для `400` и `29` — `Расход: 7.25 л/100 км`.
  starter: |
    km = float(input())
    liters = float(input())
  solution: |
    km = float(input())
    liters = float(input())
    print(f"Расход: {liters / km * 100:.2f} л/100 км")
  tests:
    io:
      - name: Пример из условия
        stdin: "400\n29\n"
        stdout: "Расход: 7.25 л/100 км"
      - name: Ровно пять литров
        stdin: "100\n5\n"
        stdout: "Расход: 5.00 л/100 км"
      - name: Дробные значения
        stdin: "123.4\n9.8\n"
        stdout: "Расход: 7.94 л/100 км"
        hidden: true
      - name: Короткая поездка
        stdin: "12\n1.5\n"
        stdout: "Расход: 12.50 л/100 км"
        hidden: true
  explain: Литры на 100 км — литры на один километр, умноженные на 100. Формат `:.2f` внутри f-строки выводит ровно два знака после точки, даже если это нули (`5.00`), а само значение при этом не округляется.
- id: change-name-case
  type: code
  q: |
    Программа здоровается: `Привет, <имя>!`. Но имя вводят как попало: `аНЯ`, `  БОРИС`. Измените программу так, чтобы имя выводилось без пробелов по краям, первая буква — большая, остальные — маленькие: для `  аНЯ ` — `Привет, Аня!`.
  starter: |
    name = input()
    print(f"Привет, {name}!")
  solution: |
    name = input().strip()
    name = name[0].upper() + name[1:].lower()
    print(f"Привет, {name}!")
  tests:
    io:
      - name: Пример из условия
        stdin: "  аНЯ \n"
        stdout: "Привет, Аня!"
      - name: Всё большими
        stdin: "БОРИС\n"
        stdout: "Привет, Борис!"
      - name: Имя из одной буквы
        stdin: "я\n"
        stdout: "Привет, Я!"
        hidden: true
      - name: Пробелы только слева
        stdin: "   вера\n"
        stdout: "Привет, Вера!"
        hidden: true
  explain: 'Сначала убирают пробелы — иначе `name[0]` окажется пробелом. Строку нельзя поправить на месте, поэтому собирают новую: первый символ `name[0].upper()` плюс остаток `name[1:].lower()`. Для имени из одной буквы `name[1:]` — пустая строка, и всё работает.'
- id: write-phone
  type: code
  q: |
    Телефоны в анкетах записаны по-разному: `8 (912) 345-67-89`, `8-912-345-67-89`, `89123456789`. Все номера российские и начинаются с `8`. Напишите программу, которая приводит номер к виду `+79123456789`: без пробелов, скобок и дефисов, а `8` в начале заменена на `+7`.
  solution: |
    phone = input()
    phone = phone.replace(" ", "").replace("(", "").replace(")", "").replace("-", "")
    print("+7" + phone[1:])
  tests:
    io:
      - name: Со скобками и пробелами
        stdin: "8 (912) 345-67-89\n"
        stdout: "+79123456789"
      - name: С дефисами
        stdin: "8-912-345-67-89\n"
        stdout: "+79123456789"
      - name: Уже без разделителей
        stdin: "89123456789\n"
        stdout: "+79123456789"
      - name: Восьмёрки внутри номера
        stdin: "8 (800) 888-88-88\n"
        stdout: "+78008888888"
        hidden: true
      - name: Скобки без пробелов
        stdin: "8(495)1234567\n"
        stdout: "+74951234567"
        hidden: true
  explain: '`replace` заменяет каждое вхождение, поэтому разделители убирают четырьмя заменами на пустую строку. А первую `8` так менять нельзя: `replace("8", "+7")` заменит и восьмёрки внутри номера. Её отрезают срезом `phone[1:]` и приклеивают `+7` спереди.'
