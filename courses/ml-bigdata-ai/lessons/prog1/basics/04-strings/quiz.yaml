title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: index-first
  type: single
  q: |
    Что выведет программа?
    ```python
    s = "Москва"
    print(s[1])
    ```
  options:
  - '`М`'
  - '`о`'
  - '`с`'
  - '`IndexError`'
  answer: 1
  explain: Индексы начинаются с нуля — `s[0]` это `М`, а `s[1]` — второй символ, `о`.
  traps: [0]
- id: index-negative
  type: single
  q: |
    Что выведет программа?
    ```python
    s = "Москва"
    print(s[len(s) - 1], s[-6])
    ```
  options:
  - '`а М`'
  - '`в М`'
  - '`а о`'
  - Остановится с `IndexError`
  answer: 0
  explain: 'В слове 6 букв, поэтому `s[len(s) - 1]` — это `s[5]`, последняя буква `а`. Отрицательные индексы идут от `-1` до `-6`, и `s[-6]` — первая буква `М`.'
- id: slice
  type: single
  q: |
    Что выведет программа?
    ```python
    word = "программа"
    print(word[3:6])
    ```
  options:
  - '`гра`'
  - '`грам`'
  - '`огр`'
  - '`рам`'
  answer: 0
  explain: Срез берёт индексы 3, 4 и 5 — `г`, `р`, `а`. Индекс 6 не включается.
- id: immutable
  type: single
  q: |
    Что произойдёт при выполнении программы?
    ```python
    s = "кот"
    s[0] = "К"
    ```
  options:
  - '`s` станет указывать на `"Кот"`'
  - Остановится с `TypeError`, потому что менять символы строки нельзя
  - Ошибки не будет, но `s` останется `"кот"` — как после `s.upper()`
  - Остановится с `IndexError`, потому что индексы начинаются с 1
  answer: 1
  explain: Строки неизменяемы. Чтобы получить `"Кот"`, нужно собрать новую строку — `"К" + s[1:]`.
- id: slice-rebuild
  type: single
  q: |
    Что выведет программа?
    ```python
    s = "кошка"
    s = s[:2] + "р" + s[3:]
    print(s)
    ```
  options:
  - '`корка`'
  - '`кошка` — строки неизменяемы'
  - '`коршка`'
  - Остановится с `TypeError` — строки неизменяемы
  answer: 0
  explain: 'Строку `"кошка"` никто не меняет: из её кусков `"ко"` и `"ка"` и буквы `"р"` собирается новая строка, и имя `s` привязывается к ней. Срез `s[:2]` не включает индекс 2, а `s[3:]` начинается с индекса 3, поэтому буква `ш` выпадает. `TypeError` был бы при попытке `s[2] = "р"`.'
- id: fstring-format
  type: single
  q: |
    Что выведет программа?
    ```python
    price = 7.5
    print(f"{price * 2:.2f}")
    ```
  options:
  - '`15.0`'
  - '`15.00`'
  - '`15`'
  - '`{price * 2:.2f}`'
  answer: 1
  explain: f-строка вычисляет выражение в скобках — `15.0` — и выводит его с двумя знаками после точки.
- id: concat-int
  type: single
  q: |
    Что произойдёт при выполнении программы?
    ```python
    print("Итого: " + 10)
    ```
  options:
  - 'Выведется `Итого: 10`'
  - Остановится с `TypeError`
  - 'Выведется `Итого: 10.0`'
  - 'Остановится с `ValueError` — строку `"Итого: "` не превратить в число'
  answer: 1
  explain: 'Python не превращает ни число в текст, ни текст в число сам: строку и число просто нельзя сложить, это `TypeError`. `ValueError` бывает, когда `int` или `float` получили неподходящую строку, а здесь их нет. Нужно `str(10)` или f-строка: `f"Итого: {10}"`.'
- id: in-case
  type: multi
  q: '`text = "Котлета по-киевски"`. Какие выражения дадут `True`? Выберите все.'
  options:
  - '`"кот" in text`'
  - '`"кот" in text.lower()`'
  - '`"Кот" in text`'
  - '`"Котлета по-Киевски" in text`'
  - '`"лета по" in text`'
  answer:
  - 1
  - 2
  - 4
  explain: '`in` ищет кусок текста с точностью до регистра. `кот` с маленькой буквы есть только в `text.lower()`, а `Киевски` с большой в строке нет. Кусок может захватывать и пробел: `лета по` встречается внутри строки.'
- id: greeting-variants
  type: multi
  q: '`name = "Аня"`. Какие строки кода выведут ровно `Привет, Аня!`? Выберите все.'
  options:
  - '`print(f"Привет, {name}!")`'
  - '`print("Привет, " + name + "!")`'
  - '`print("Привет, {name}!")`'
  - '`print("Привет,", name, "!")`'
  - '`print(f"Привет, {name}" + "!")`'
  answer:
  - 0
  - 1
  - 4
  explain: Без буквы `f` фигурные скобки выводятся как есть. `print` с запятыми ставит пробел и перед восклицательным знаком. f-строку можно склеить с другой строкой, как любую строку.
- id: open-upper
  type: open
  q: |
    Ученик удивляется, что имя вывелось маленькими буквами:
    ```python
    name = input()
    name.upper()
    print(name)
    ```
    Объясните, что происходит, и как исправить.
  rubric:
  - upper() не меняет строку, на которую указывает name (строки неизменяемы), а возвращает новую — её ни к чему не привязали, и она потерялась
  - исправление — привязать результат к имени, name = name.upper() (или сразу print(name.upper()))
  wrong_answers:
  - upper работает только с латиницей
  - нужно вызвать upper до input
  followups:
  - Что выведет print(name.strip().lower()) для ввода "  АнЯ "?
