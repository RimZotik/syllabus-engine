id: p1f-ai-piggy
title: Копилка без global
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте программу-копилку от ИИ-ассистента без `global`: функция `deposit(balance, amount)` должна возвращать новую сумму.**

  Ввод — суммы пополнений, целые числа по одному в строке, в конце пустая строка. В начале в копилке 0 рублей. Выведите `В копилке: N`, где `N` — итоговая сумма. `deposit` получает текущую сумму и пополнение, возвращает новую сумму и глобальных имён не меняет: `deposit(100, 50)` должна вернуть `150`.

  Пример 1
  ```input
  100
  250
  50

  ```
  ```output
  В копилке: 400
  ```

  Ограничения: пополнений от 0 до 50, каждое — целое от 0. Последняя строка ввода всегда пустая.
starter: |
  # Решение от ИИ-ассистента
  balance = 0

  def deposit(amount):
      balance += amount
      return balance

  line = input()
  while line != "":
      deposit(int(line))
      line = input()
  print("В копилке:", balance)
stdin: "100\n250\n50\n\n"
solution: |
  def deposit(balance, amount):
      return balance + amount

  balance = 0
  line = input()
  while line != "":
      balance = deposit(balance, int(line))
      line = input()
  print("В копилке:", balance)
tests:
  io:
    - name: Пример из условия
      stdin: "100\n250\n50\n\n"
      stdout: "В копилке: 400"
    - name: Без пополнений
      stdin: "\n"
      stdout: "В копилке: 0"
      hidden: true
    - name: Одно пополнение
      stdin: "1000\n\n"
      stdout: "В копилке: 1000"
      hidden: true
    - name: Нулевые пополнения
      stdin: "0\n70\n0\n\n"
      stdout: "В копилке: 70"
      hidden: true
  stdin: "100\n50\n\n"
  asserts:
    - name: Функция возвращает новую сумму
      code: assert deposit(100, 50) == 150, "deposit(100, 50) должно вернуть 150"
    - name: Пополнение на ноль
      code: assert deposit(0, 0) == 0, "deposit(0, 0) должно вернуть 0"
    - name: Глобальные имена не меняются
      code: |
        if "balance" in globals():
            balance = -1
            deposit(10, 5)
            assert balance == -1, "Вызов deposit не должен менять глобальное balance: новую сумму программа получает из return"
hints:
  - level: 1
    text: 'Строка `balance += amount` — это присваивание. Каким Python делает имя, которому присваивают в теле функции? Где он тогда ищет его значение в правой части?'
  - level: 2
    text: 'Пусть функция получает текущую сумму аргументом и возвращает новую, ничего не присваивая глобальному имени. А присваивает программа — результат вызова.'
  - level: 3
    text: 'Строка с `def` — `def deposit(balance, amount):`, тело — один `return`. В цикле результат вызова сохраняют в `balance`, иначе он пропадёт.'
