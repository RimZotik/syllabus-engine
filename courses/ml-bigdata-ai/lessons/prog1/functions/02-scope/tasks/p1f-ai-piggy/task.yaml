id: p1f-ai-piggy
title: Копилка без global
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте копилку от ИИ-ассистента без `global`: функция `deposit(balance, amount)` должна возвращать новую сумму.**

  `deposit` получает текущую сумму в копилке и пополнение — целые числа — и возвращает новую сумму, не меняя глобальных имён. Под функцией — пример: копилку пополняют суммами из списка и печатают итог. Сейчас пример падает с `UnboundLocalError`. Строку с `def` придётся изменить: у функции станет два параметра. Поправьте и пример под функцией: после трёх пополнений в `balance` должно оказаться `400`. Проверка вызывает `deposit` сама и смотрит на `balance` после примера.

  Пример: `deposit(100, 50)` возвращает `150`, `deposit(0, 0)` — `0`.

  Ограничения: суммы — целые от 0.
starter: |
  # Решение от ИИ-ассистента
  balance = 0

  def deposit(amount):
      balance += amount
      return balance

  for amount in [100, 250, 50]:
      deposit(amount)
  print("В копилке:", balance)
solution: |
  def deposit(balance, amount):
      return balance + amount

  balance = 0
  for amount in [100, 250, 50]:
      balance = deposit(balance, amount)
  print("В копилке:", balance)
tests:
  asserts:
    - name: Функция возвращает новую сумму
      code: |
        r = deposit(100, 50)
        assert r == 150, "deposit(100, 50) должна вернуть 150, а вернула " + repr(r)
    - name: Пополнение на ноль
      code: |
        r = deposit(0, 0)
        assert r == 0, "deposit(0, 0) должна вернуть 0, а вернула " + repr(r)
    - name: Пополнение пустой копилки
      code: |
        r = deposit(0, 1000)
        assert r == 1000, "deposit(0, 1000) должна вернуть 1000, а вернула " + repr(r)
    - name: Пример под функцией
      code: |
        assert balance == 400, "После трёх пополнений 100, 250 и 50 в balance должно быть 400, а там " + repr(balance) + ". Сохраняете ли вы результат вызова в balance?"
    - name: Глобальные имена не меняются
      code: |
        if "balance" in globals():
            balance = -1
            deposit(10, 5)
            assert balance == -1, "Вызов deposit не должен менять глобальное balance: новую сумму программа получает из return"
hints:
  - level: 1
    text: 'Строка `balance += amount` — это присваивание. Каким Python делает имя, которому присваивают в теле функции? Где он тогда ищет его значение в правой части?'
  - level: 2
    text: 'Пусть функция получает текущую сумму аргументом и возвращает новую, ничего не присваивая глобальному имени. А присваивает программа — результат вызова. Чтобы увидеть, что происходит внутри, добавьте `print` — он не влияет на проверку.'
  - level: 3
    text: 'Строка с `def` — `def deposit(balance, amount):`, тело — один `return`. В цикле результат вызова сохраняют в `balance`, иначе он пропадёт.'
