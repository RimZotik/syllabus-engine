id: p1f-cart-preview
title: Корзина «а если добавить»
sandbox: python-browser
difficulty: 2
statement: |
  Интернет-магазин показывает покупателю, как будет выглядеть корзина, если добавить в неё ещё один товар. Настоящая корзина при этом меняться не должна: покупатель ещё ничего не решил.

  Напишите функцию `with_item(cart, item)`, которая **возвращает новый список**: все товары из `cart` и в конце `item`. Сам список `cart` функция не меняет. Вводить и печатать ничего не нужно — проверки вызывают функцию сами:

  ```python
  my_cart = ["хлеб"]
  preview = with_item(my_cart, "молоко")
  # preview — ["хлеб", "молоко"], а my_cart по-прежнему ["хлеб"]
  ```
starter: |
  def with_item(cart, item):
      # План:
      # 1. Собрать новый список: товары из cart и item в конце
      # 2. Вернуть новый список; cart не менять
      return cart
solution: |
  def with_item(cart, item):
      return cart + [item]
tests:
  asserts:
    - name: Товар добавлен в конец
      code: assert with_item(["хлеб"], "молоко") == ["хлеб", "молоко"], 'with_item(["хлеб"], "молоко") должно вернуть ["хлеб", "молоко"]'
    - name: Настоящая корзина не изменилась
      code: |
        my_cart = ["хлеб"]
        preview = with_item(my_cart, "молоко")
        assert my_cart == ["хлеб"], "После вызова my_cart должен остаться ['хлеб']: функция не должна менять переданный список"
    - name: Пустая корзина
      code: assert with_item([], "сыр") == ["сыр"], 'with_item([], "сыр") должно вернуть ["сыр"]'
    - name: Два варианта от одной корзины
      code: |
        base = ["чай"]
        a = with_item(base, "мёд")
        b = with_item(base, "сахар")
        assert a == ["чай", "мёд"] and b == ["чай", "сахар"], "Каждый вызов собирает свой вариант от той же корзины: ['чай', 'мёд'] и ['чай', 'сахар']"
hints:
  - level: 1
    text: 'Если вызвать `cart.append(item)`, какой список изменится — только тот, что внутри функции, или и `my_cart` снаружи? Сколько тут списков?'
  - level: 2
    text: '`append` меняет сам переданный список. Нужен другой способ: собрать новый список из старого и ещё одного элемента — так, как это делает `+` для списков.'
  - level: 3
    text: 'Сложите `cart` со списком из одного элемента `[item]` и верните результат через `return`.'
