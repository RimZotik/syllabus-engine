id: p1f-cart-preview
title: Корзина «а если добавить»
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите функцию `with_item(cart, item)`, которая возвращает новый список — товары из `cart` и `item` в конце, — а сам `cart` не меняет.**

  `cart` — список названий товаров, `item` — название. Проверка сравнивает `cart` до вызова и после: он должен остаться прежним.

  Пример 1
  ```call
  with_item(["хлеб"], "молоко")
  ```
  ```return
  ["хлеб", "молоко"]
  ```

  Пример 2
  ```call
  with_item([], "сыр")
  ```
  ```return
  ["сыр"]
  ```

  Ограничения: в корзине от 0 до 20 товаров.
starter: |
  def with_item(cart, item):
      # План:
      # 1. Собрать новый список: товары из cart и item в конце
      # 2. Вернуть новый список; cart не менять
      return cart
solution: |
  def with_item(cart, item):
      return cart + [item]
tests:
  function: with_item
  no_mutate: true
  calls:
    - name: Товар добавлен в конец
      args: [["хлеб"], "молоко"]
      expect: ["хлеб", "молоко"]
    - name: Пустая корзина
      args: [[], "сыр"]
      expect: ["сыр"]
    - name: Корзина побольше
      args: [["чай", "мёд", "сахар"], "лимон"]
      expect: ["чай", "мёд", "сахар", "лимон"]
      hidden: true
    - name: Такой товар уже есть
      args: [["чай"], "чай"]
      expect: ["чай", "чай"]
      hidden: true
  asserts:
    - name: Два варианта от одной корзины
      code: |
        base = ["чай"]
        a = with_item(base, "мёд")
        b = with_item(base, "сахар")
        assert a == ["чай", "мёд"] and b == ["чай", "сахар"], "Каждый вызов собирает свой вариант от той же корзины: ['чай', 'мёд'] и ['чай', 'сахар'], а вернулись " + repr(a) + " и " + repr(b)
hints:
  - level: 1
    text: 'Если вызвать `cart.append(item)`, какой список изменится — только тот, что внутри функции, или и корзина снаружи? Сколько тут списков?'
  - level: 2
    text: '`append` меняет сам переданный список. Нужен другой способ: собрать новый список из старого и ещё одного элемента — так, как это делает `+` для списков.'
  - level: 3
    text: '`+` для двух списков собирает третий, новый. Какой второй список нужен, чтобы в конце оказался `item`?'
