id: p1f-ai-warm-days
title: ИИ-ассистент считает тёплые дни
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте функцию `warm_days(temps, limit)` от ИИ-ассистента: она должна возвращать число дней теплее `limit` и зависеть только от аргументов.**

  `temps` — температуры по дням, целые числа; день ровно `limit` градусов тёплым не считается. Под функцией ассистент оставил пример: две недели, порог 10 градусов. Первая строка вывода верна, вторая — нет: `3` вместо `1`. Проверка вызывает `warm_days` много раз, в том числе два раза подряд.

  Пример 1
  ```call
  warm_days([5, 12, 14], 10)
  ```
  ```return
  2
  ```

  Пример 2
  ```call
  warm_days([9, 11, 3], 10)
  ```
  ```return
  1
  ```

  Ограничения: в списке от 0 до 7 дней, температуры от −40 до 40.
starter: |
  # Решение от ИИ-ассистента
  count = 0

  def warm_days(temps, limit):
      global count
      for t in temps:
          if t > limit:
              count += 1
      return count

  print(warm_days([5, 12, 14], 10))
  print(warm_days([9, 11, 3], 10))
solution: |
  def warm_days(temps, limit):
      count = 0
      for t in temps:
          if t > limit:
              count += 1
      return count

  print(warm_days([5, 12, 14], 10))
  print(warm_days([9, 11, 3], 10))
tests:
  function: warm_days
  calls:
    - name: Первая неделя
      args: [[5, 12, 14], 10]
      expect: 2
    - name: Вторая неделя
      args: [[9, 11, 3], 10]
      expect: 1
    - name: Ровно 10 — не тёплый
      args: [[10, 10, 11], 10]
      expect: 1
      hidden: true
    - name: Пустой список
      args: [[], 10]
      expect: 0
      hidden: true
    - name: Другой порог
      args: [[0, -3, 1], 0]
      expect: 1
      hidden: true
  asserts:
    - name: Тот же вызов два раза подряд
      code: |
        first = warm_days([12, 14], 10)
        second = warm_days([12, 14], 10)
        assert first == 2 and second == 2, "Два одинаковых вызова warm_days([12, 14], 10) должны вернуть 2 и 2, а вернули " + str(first) + " и " + str(second)
    - name: Глобальные имена не меняются
      code: |
        if "count" in globals():
            count = -1
            warm_days([12, 14], 10)
            assert count == -1, "Вызов warm_days не должен менять глобальное count: счётчик — локальное имя вызова"
hints:
  - level: 1
    text: 'Вторая строка вывода в примере — 3 вместо 1. Откуда счётчик второго вызова начал считать: с нуля или с того, на чём остановился первый?'
  - level: 2
    text: '`count` — глобальное имя, и `global` разрешает функции менять его между вызовами. Счётчик — это накопитель одного вызова: его начальное значение должно задаваться в начале каждого вызова. Чтобы увидеть, что происходит внутри, добавьте `print(count)` в начало функции — он не влияет на проверку.'
  - level: 3
    text: 'Перенесите обнуление счётчика внутрь функции, до цикла. После этого `global` и глобальное `count` больше не нужны.'
