title: Проверка темы
pass: 0.85
minutes: 40
questions:
- id: same-name-total
  type: single
  q: |
    Что выведет программа?
    ```python
    total = 0

    def receipt(prices):
        total = 0
        for p in prices:
            total += p
        return total

    print(receipt([100, 250]), total)
    ```
  options:
  - '`350 0`'
  - '`350 350`'
  - '`0 0`'
  - 'Ошибку `UnboundLocalError`'
  answer: 0
  explain: 'В теле `receipt` имени `total` присваивают, поэтому оно локальное — своё у каждого вызова. Глобальный `total` никто не трогал, он по-прежнему 0. Ошибки нет: локальный `total` получил значение до первого чтения.'
- id: which-unbound
  type: single
  q: |
    Вызов какой из функций закончится ошибкой `UnboundLocalError`?
    ```python
    count = 5

    def a():
        print(count)

    def b():
        count = 1
        print(count)

    def c():
        print(count)
        count = 1

    def d():
        return count + 1
    ```
  options:
  - '`a`'
  - '`b`'
  - '`c`'
  - '`d`'
  answer: 2
  explain: 'В `c` имени `count` присваивают ниже, поэтому оно локальное во всём теле — и в строке с `print`, где ещё ни к чему не привязано. `a` и `d` только читают глобальный `count`, а `b` сначала присваивает, потом читает.'
- id: when-local
  type: single
  q: |
    Что выведет программа?
    ```python
    bonus = 100

    def salary(base, good):
        if good:
            bonus = 500
        return base + bonus

    print(salary(1000, True))
    print(salary(1000, False))
    ```
  options:
  - '`1500`, потом ошибку `UnboundLocalError`'
  - '`1500`, потом `1100`'
  - 'Ошибку `UnboundLocalError` уже при первом вызове'
  - '`1500`, потом `1500`'
  answer: 0
  explain: 'Локальное ли имя, Python решает, когда читает определение, а не по ходу выполнения. В теле есть `bonus = 500`, поэтому `bonus` локальное во всём теле — даже если ветка `if` не выполнится. В первом вызове ветка выполнилась, `bonus` привязано к 500. Во втором — не выполнилась, локальный `bonus` ни к чему не привязан, а к глобальному Python не обращается. Значение 500 из первого вызова не сохраняется: каждый вызов начинает со своего набора имён.'
- id: pure-which
  type: multi
  q: |
    Какие из функций чистые? Остальная программа имена `UNITS` и `history` заново не привязывает. Выберите все.
    ```python
    UNITS = "°C"
    history = []

    def to_fahrenheit(c):
        return c * 9 / 5 + 32

    def label(t):
        return f"{t}{UNITS}"

    def remember(t):
        history.append(t)
        return t

    def show(t):
        print(t, UNITS)
    ```
  options:
  - '`to_fahrenheit`'
  - '`label`'
  - '`remember`'
  - '`show`'
  answer:
  - 0
  - 1
  explain: '`label` читает глобальное `UNITS`, но его никто не меняет, поэтому при одном аргументе результат всегда один. `remember` меняет список `history`, `show` печатает — это побочные эффекты, даже если `remember` возвращает правильное значение.'
- id: code-fix-lost-result
  type: code
  q: |
    **Исправьте программу, чтобы она перестала падать с `NameError`; функцию `trip_minutes` не меняйте.**

    Программа читает расстояние в километрах — целое число — и выводит `В пути: N мин`, где `N` — время в пути со скоростью 40 км/ч, округлённое до целых.

    Пример 1
    ```input
    30
    ```
    ```output
    В пути: 45 мин
    ```
  starter: |
    def trip_minutes(km):
        minutes = km / 40 * 60
        return round(minutes)

    km = int(input())
    trip_minutes(km)
    print("В пути:", minutes, "мин")
  solution: |
    def trip_minutes(km):
        minutes = km / 40 * 60
        return round(minutes)

    km = int(input())
    minutes = trip_minutes(km)
    print("В пути:", minutes, "мин")
  tests:
    io:
    - name: 30 километров
      stdin: "30\n"
      stdout: "В пути: 45 мин"
    - name: 10 километров
      stdin: "10\n"
      stdout: "В пути: 15 мин"
      hidden: true
    - name: 100 километров
      stdin: "100\n"
      stdout: "В пути: 150 мин"
      hidden: true
    - name: Никуда не едем
      stdin: "0\n"
      stdout: "В пути: 0 мин"
      hidden: true
  explain: |
    `minutes` — локальное имя вызова `trip_minutes`: когда вызов закончился, оно исчезло. Наружу попадает только возвращённое значение, а программа его выбросила. Его нужно сохранить: `minutes = trip_minutes(km)`. Глобальное `minutes` — уже другое имя, которое просто пишется так же.
- id: code-fix-sum-shadow
  type: code
  q: |
    **Исправьте функцию `average_check(checks)` от ИИ-ассистента: её вызов падает с `UnboundLocalError`.**

    Функция получает список сумм покупок (хотя бы одну) и возвращает средний чек.

    Пример 1
    ```call
    average_check([300, 500])
    ```
    ```return
    400.0
    ```
  starter: |
    def average_check(checks):
        total = sum(checks)
        sum = total / len(checks)
        return sum
  solution: |
    def average_check(checks):
        total = sum(checks)
        avg = total / len(checks)
        return avg
  tests:
    function: average_check
    calls:
    - name: Два чека
      args: [[300, 500]]
      expect: 400.0
    - name: Один чек
      args: [[120]]
      expect: 120.0
    - name: Три чека
      args: [[100, 200, 600]]
      expect: 300.0
  explain: |
    В теле есть присваивание `sum = …`, поэтому `sum` локальное во всём теле — и в первой строке, где его вызывают как встроенную функцию, а локальное `sum` ещё ни к чему не привязано. Своё имя не должно совпадать со встроенным: назовите результат, например, `avg`.
- id: plus-assign-global
  type: code
  q: |
    **Исправьте тело функции `add_entry(name)` без `global`: она должна дописывать имя в конец глобального списка `log`.**

    Программа читает имена по одному в строке, в конце пустая строка, и печатает журнал. Сейчас она падает с `UnboundLocalError`. `add_entry` должна менять сам список `log`, а не создавать новый.

    Пример 1
    ```input
    Аня
    Борис

    ```
    ```output
    Журнал: ['Аня', 'Борис']
    ```
  starter: |
    log = []

    def add_entry(name):
        log += [name]

    line = input()
    while line != "":
        add_entry(line)
        line = input()
    print("Журнал:", log)
  solution: |
    log = []

    def add_entry(name):
        log.append(name)

    line = input()
    while line != "":
        add_entry(line)
        line = input()
    print("Журнал:", log)
  tests:
    stdin: "Аня\n\n"
    io:
    - name: Два входа
      stdin: "Аня\nБорис\n\n"
      stdout: "Журнал: ['Аня', 'Борис']"
    - name: Один вход
      stdin: "Вера\n\n"
      stdout: "Журнал: ['Вера']"
      hidden: true
    - name: Три входа
      stdin: "Аня\nБорис\nАня\n\n"
      stdout: "Журнал: ['Аня', 'Борис', 'Аня']"
      hidden: true
    asserts:
    - name: Тот же список, а не новый
      code: |
        before = log
        add_entry("Гоша")
        assert log is before, "add_entry должна дописывать имя в сам список log, а имя log теперь указывает на другой список"
        assert log[-1] == "Гоша", "после add_entry('Гоша') последним в log должно быть 'Гоша', а log — " + repr(log)
  explain: |
    `log += [name]` — присваивание, поэтому имя `log` в теле функции локальное, и прочитать его до присваивания нельзя. `log = log + [name]` — тоже присваивание, ошибка останется. А `log.append(name)` имени ничего не присваивает: Python находит глобальное `log` и меняет сам список. `global` для этого не нужен — он нужен, только чтобы привязать глобальное имя к другому значению.
- id: code-change-global-rate
  type: code
  q: |
    **Измените программу так, чтобы функция `with_tax(price, rate)` получала ставку налога аргументом и не читала глобальных имён.**

    Программа читает регион (`юг` или `север`) и цену — целое число — и выводит `К оплате: X`, где `X` — цена с налогом: на юге 20%, на севере 10%. `with_tax` получает ставку в процентах и возвращает цену с налогом, а ставку региона выбирает основная программа. Вывод не должен измениться.

    Пример 1
    ```input
    юг
    1000
    ```
    ```output
    К оплате: 1200.0
    ```

    Пример 2
    ```input
    север
    1000
    ```
    ```output
    К оплате: 1100.0
    ```
  starter: |
    tax_rate = 20

    def with_tax(price):
        return price + price * tax_rate / 100

    region = input()
    price = int(input())
    if region == "север":
        tax_rate = 10
    print("К оплате:", with_tax(price))
  solution: |
    def with_tax(price, rate):
        return price + price * rate / 100

    region = input()
    price = int(input())
    rate = 20
    if region == "север":
        rate = 10
    print("К оплате:", with_tax(price, rate))
  tests:
    stdin: "север\n1000\n"
    io:
    - name: Юг
      stdin: "юг\n1000\n"
      stdout: "К оплате: 1200.0"
    - name: Север
      stdin: "север\n1000\n"
      stdout: "К оплате: 1100.0"
      hidden: true
    - name: Север, другая цена
      stdin: "север\n500\n"
      stdout: "К оплате: 550.0"
      hidden: true
    - name: Юг, бесплатно
      stdin: "юг\n0\n"
      stdout: "К оплате: 0.0"
      hidden: true
    asserts:
    - name: Ставка юга
      code: |
        r = with_tax(1000, 20)
        assert r == 1200.0, "with_tax(1000, 20) должна вернуть 1200.0, а вернула " + repr(r)
    - name: Ставка по имени
      code: |
        r = with_tax(200, rate=5)
        assert r == 210.0, "with_tax(200, rate=5) должна вернуть 210.0, а вернула " + repr(r)
    - name: Глобальное имя не влияет
      code: |
        tax_rate = 99
        r = with_tax(1000, 20)
        assert r == 1200.0, "with_tax(1000, 20) должна зависеть только от аргументов: при глобальном tax_rate = 99 она вернула " + repr(r)
  explain: |
    Пока ставка приходит из глобального имени, результат `with_tax(1000)` зависит не только от аргумента, но и от того, что программа успела сделать до вызова: выбрали север — и та же проверка падает. Когда ставка — параметр, функция зависит только от аргументов, и проверка `assert with_tax(1000, 20) == 1200` проходит при любом регионе. Выбор ставки остаётся в основной программе. Инструкция `global` тут не помогла бы: функция и так видит глобальное имя, беда как раз в том, что она от него зависит.
- id: code-fix-rebind-list
  type: code
  q: |
    **Исправьте функцию `raise_prices(prices, amount)`: она должна прибавить `amount` к каждой цене прямо в переданном списке.**

    Функция меняет сам список `prices` и ничего не возвращает. Сейчас после вызова список остаётся прежним.

    Пример 1
    ```python
    shelf = [100, 250]
    raise_prices(shelf, 10)
    print(shelf)
    ```
    ```output
    [110, 260]
    ```
  starter: |
    def raise_prices(prices, amount):
        new_prices = []
        for p in prices:
            new_prices.append(p + amount)
        prices = new_prices
  solution: |
    def raise_prices(prices, amount):
        for i in range(len(prices)):
            prices[i] = prices[i] + amount
  tests:
    function: raise_prices
    calls:
    - name: Список изменился
      args: [[100, 250], 10]
      expect: null
      after: [[110, 260], 10]
    - name: Снижение цен
      args: [[100, 80, 300], -20]
      expect: null
      after: [[80, 60, 280], -20]
      hidden: true
    - name: Пустая полка
      args: [[], 10]
      expect: null
      after: [[], 10]
      hidden: true
  explain: |
    `prices = new_prices` привязывает к новому списку только локальное имя `prices`, а список, на который указывает имя снаружи, остаётся прежним. Чтобы изменение было видно снаружи, меняют сам этот список — присваиванием по индексу: `prices[i] = prices[i] + amount`. Функция работает ради побочного эффекта, поэтому возвращает `None`.
- id: code-fix-spoiled-list
  type: code
  q: |
    **Исправьте функцию `with_vat(prices)`: она должна возвращать новый список цен с НДС 20%, не меняя переданный.**

    Программа читает цены — целые числа через пробел — и выводит их сумму без НДС и с НДС. Сейчас сумма без НДС выводится неверно.

    Пример 1
    ```input
    100 250 50
    ```
    ```output
    Без НДС: 400
    С НДС: 480.0
    ```
  starter: |
    def with_vat(prices):
        for i in range(len(prices)):
            prices[i] = prices[i] * 1.2
        return prices

    prices = input().split()
    for i in range(len(prices)):
        prices[i] = int(prices[i])
    vat_prices = with_vat(prices)
    print("Без НДС:", sum(prices))
    print("С НДС:", round(sum(vat_prices), 2))
  solution: |
    def with_vat(prices):
        result = []
        for p in prices:
            result.append(p * 1.2)
        return result

    prices = input().split()
    for i in range(len(prices)):
        prices[i] = int(prices[i])
    vat_prices = with_vat(prices)
    print("Без НДС:", sum(prices))
    print("С НДС:", round(sum(vat_prices), 2))
  tests:
    stdin: "100 250 50\n"
    io:
    - name: Три товара
      stdin: "100 250 50\n"
      stdout: "Без НДС: 400\nС НДС: 480.0"
    - name: Один товар
      stdin: "1000\n"
      stdout: "Без НДС: 1000\nС НДС: 1200.0"
      hidden: true
    - name: Два товара
      stdin: "15 35\n"
      stdout: "Без НДС: 50\nС НДС: 60.0"
      hidden: true
    asserts:
    - name: Список программы не изменился
      code: |
        assert prices == [100, 250, 50], "для ввода 100 250 50 список prices после вызова with_vat должен остаться [100, 250, 50], а он " + repr(prices)
    - name: Функция не меняет переданный список
      code: |
        p = [10, 20]
        r = with_vat(p)
        assert p == [10, 20], "with_vat не должна менять переданный список: [10, 20] стал " + repr(p)
        assert r == [12.0, 24.0], "with_vat([10, 20]) должна вернуть [12.0, 24.0], а вернула " + repr(r)
    - name: Пустой список
      code: |
        r = with_vat([])
        assert r == [], "with_vat([]) должна вернуть [], а вернула " + repr(r)
  explain: |
    `prices` в функции и `prices` в программе — два имени одного списка. Присваивание по индексу меняет сам этот список, поэтому после вызова в программе остаются цены уже с НДС, и `sum(prices)` считает не то. Ошибка видна не в функции, а дальше — там, где список используют снова. Функция должна собирать новый список через `append` и возвращать его; тогда она чистая, а список программы не меняется.
