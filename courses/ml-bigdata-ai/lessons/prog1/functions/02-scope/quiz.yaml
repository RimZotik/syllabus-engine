title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: same-name-total
  type: single
  q: |
    Что выведет программа?
    ```python
    total = 0

    def receipt(prices):
        total = 0
        for p in prices:
            total += p
        return total

    print(receipt([100, 250]), total)
    ```
  options:
  - '`350 0`'
  - '`350 350`'
  - '`0 0`'
  - 'Ошибку `UnboundLocalError`'
  answer: 0
  explain: 'В теле `receipt` имени `total` присваивают, поэтому оно локальное — своё у каждого вызова. Глобальный `total` никто не трогал, он по-прежнему 0. Ошибки нет: локальный `total` получил значение до первого чтения.'
- id: local-gone
  type: single
  q: |
    Что произойдёт при запуске?
    ```python
    def to_fahrenheit(celsius):
        fahrenheit = celsius * 9 / 5 + 32
        return fahrenheit

    def report(celsius):
        to_fahrenheit(celsius)
        return f"{celsius} °C = {fahrenheit} °F"

    print(report(20))
    ```
  options:
  - 'Ошибка `NameError`'
  - 'Выведется `20 °C = 68.0 °F`'
  - 'Выведется `20 °C = None °F`'
  - 'Ошибка `UnboundLocalError`'
  answer: 0
  explain: '`fahrenheit` — локальное имя вызова `to_fahrenheit`: когда вызов закончился, оно исчезло, и другой функции его не видно. В `report` имени `fahrenheit` ничего не присваивают, значит, оно не локальное — Python ищет его среди глобальных и встроенных, не находит и выдаёт `NameError`, а не `UnboundLocalError`. Возвращённое значение `68.0` никуда не сохранили; нужно `f = to_fahrenheit(celsius)`.'
- id: which-unbound
  type: single
  q: |
    Вызов какой из функций закончится ошибкой `UnboundLocalError`?
    ```python
    count = 5

    def a():
        print(count)

    def b():
        count = 1
        print(count)

    def c():
        print(count)
        count = 1

    def d():
        return count + 1
    ```
  options:
  - '`a`'
  - '`b`'
  - '`c`'
  - '`d`'
  answer: 2
  explain: 'В `c` имени `count` присваивают ниже, поэтому оно локальное во всём теле — и в строке с `print`, где ещё ни к чему не привязано. `a` и `d` только читают глобальный `count`, а `b` сначала присваивает, потом читает.'
- id: shadow-max-local
  type: single
  q: |
    Что выведет программа?
    ```python
    def best_mark(marks):
        max = marks[0]
        for m in marks:
            if m > max:
                max = m
        return max

    print(best_mark([3, 5, 4]), max([1, 2]))
    ```
  options:
  - '`5 2`'
  - '`5 5`'
  - "Ошибку `TypeError: 'int' object is not callable`"
  - 'Ошибку `UnboundLocalError`'
  answer: 0
  explain: 'Локальный `max` перекрывает встроенный только внутри вызова `best_mark`. Когда вызов закончился, имя исчезло, и `max([1, 2])` вне функции — снова встроенная функция. Так называть имена всё равно не стоит.'
- id: append-inside
  type: single
  q: |
    Что выведет программа? А что — если строку `marks.append(5)` заменить на `marks = marks + [5]`?
    ```python
    def add_bonus(marks):
        marks.append(5)
        return len(marks)

    journal = [4, 3]
    n = add_bonus(journal)
    print(n, journal)
    ```
  options:
  - '`3 [4, 3, 5]`, а после замены — `3 [4, 3]`'
  - '`3 [4, 3, 5]` в обоих случаях'
  - '`3 [4, 3, 5]`, а после замены — ошибку `UnboundLocalError`'
  - '`2 [4, 3]`, а после замены — `3 [4, 3, 5]`'
  answer: 0
  explain: '`marks` и `journal` — два имени одного списка. `append` меняет сам этот список, и изменение видно снаружи. `marks + [5]` собирает новый список, и к нему привязывается только локальное `marks`: длина нового списка — 3, а `journal` остаётся прежним. Ошибки нет: `marks` — параметр, он привязан к значению с начала вызова.'
- id: rebind-param
  type: single
  q: |
    Что выведет программа?
    ```python
    def clear(marks):
        marks = []

    journal = [4, 3]
    clear(journal)
    print(journal)
    ```
  options:
  - '`[4, 3]`'
  - '`[]`'
  - '`None`'
  - 'Ошибку `UnboundLocalError`'
  answer: 0
  explain: 'Присваивание привязывает к новому пустому списку только локальное имя `marks`. Сам список `[4, 3]` никто не менял, и `journal` по-прежнему на него указывает.'
- id: plus-assign-global
  type: single
  q: |
    Программа падает с `UnboundLocalError`. Какая правка тела `add_entry` без инструкции `global` сделает так, что программа выведет `['вход']`?
    ```python
    log = []

    def add_entry(name):
        log += [name]

    add_entry("вход")
    print(log)
    ```
  options:
  - '`log.append(name)` вместо `log += [name]`'
  - '`log = log + [name]` вместо `log += [name]`'
  - '`log = [name]` вместо `log += [name]`'
  - 'Строка `log = []` первой в теле функции'
  answer: 0
  explain: '`log += [name]` — присваивание, поэтому `log` в функции локальное. `log = log + [name]` — тоже присваивание, и ошибка останется. `log = [name]` и `log = []` в теле ошибку уберут, но создадут свой, локальный список: глобальный `log` останется пустым, и выведется `[]`. А `append` имени ничего не присваивает — он меняет сам глобальный список.'
- id: when-local
  type: single
  q: |
    Что выведет программа?
    ```python
    bonus = 100

    def salary(base, good):
        if good:
            bonus = 500
        return base + bonus

    print(salary(1000, True))
    print(salary(1000, False))
    ```
  options:
  - '`1500`, потом ошибку `UnboundLocalError`'
  - '`1500`, потом `1100`'
  - 'Ошибку `UnboundLocalError` уже при первом вызове'
  - '`1500`, потом `1500`'
  answer: 0
  explain: 'Локальное ли имя, Python решает, когда читает определение, а не по ходу выполнения. В теле есть `bonus = 500`, поэтому `bonus` локальное во всём теле — даже если ветка `if` не выполнится. В первом вызове ветка выполнилась, `bonus` привязано к 500. Во втором — не выполнилась, локальный `bonus` ни к чему не привязан, а к глобальному Python не обращается. Значение 500 из первого вызова не сохраняется: каждый вызов начинает со своего набора имён.'
- id: pure-which
  type: multi
  q: |
    Какие из функций чистые? Остальная программа имена `UNITS` и `history` заново не привязывает. Выберите все.
    ```python
    UNITS = "°C"
    history = []

    def to_fahrenheit(c):
        return c * 9 / 5 + 32

    def label(t):
        return f"{t}{UNITS}"

    def remember(t):
        history.append(t)
        return t

    def show(t):
        print(t, UNITS)
    ```
  options:
  - '`to_fahrenheit`'
  - '`label`'
  - '`remember`'
  - '`show`'
  answer:
  - 0
  - 1
  explain: '`label` читает глобальное `UNITS`, но его никто не меняет, поэтому при одном аргументе результат всегда один. `remember` меняет список `history`, `show` печатает — это побочные эффекты, даже если `remember` возвращает правильное значение.'
- id: why-none
  type: single
  q: |
    Что выведет программа?
    ```python
    name = "анна"
    cart = ["хлеб"]
    a = name.upper()
    b = cart.append("сыр")
    print(name, a, b)
    ```
  options:
  - '`анна АННА None`'
  - "`анна АННА ['хлеб', 'сыр']`"
  - '`АННА АННА None`'
  - "`АННА АННА ['хлеб', 'сыр']`"
  answer: 0
  explain: '`upper` не меняет строку `name`, а возвращает новую — её и получает `a`. `append` работает иначе: меняет сам список `cart` — это побочный эффект, ради него метод и вызывают, — а отдавать ему нечего, поэтому `b` указывает на `None`. Список `[''хлеб'', ''сыр'']` можно увидеть через `print(cart)`.'
- id: open-global-rate
  type: open
  q: |
    Функция `with_tax(price)` возвращает цену с налогом и берёт ставку из глобального имени `tax_rate`, которое программа меняет, когда пользователь выбирает регион. Проверка `assert with_tax(1000) == 1200` то проходит, то падает. Объясните, почему так происходит и как переделать функцию.
  rubric:
  - результат зависит не только от аргумента, но и от глобального tax_rate, которое программа меняет, поэтому при одном и том же аргументе функция возвращает разные значения — проверка проходит или нет в зависимости от того, какая ставка выбрана к моменту вызова
  - переделать — сделать ставку параметром, например with_tax(price, tax_rate), и передавать её при вызове; тогда функция зависит только от аргументов
  wrong_answers:
  - добавить в функцию инструкцию global tax_rate
  - переименовать tax_rate в TAX_RATE — тогда значение перестанет меняться
  - Python не видит глобальные имена изнутри функции
  followups:
  - Как после переделки записать ту же проверку с assert, чтобы она не зависела от выбранного региона?
