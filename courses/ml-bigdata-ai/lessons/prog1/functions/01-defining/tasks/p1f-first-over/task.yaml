id: p1f-first-over
title: Первый день сверх лимита
sandbox: python-browser
difficulty: 2
statement: |
  В дневнике расходов — список трат по дням. Напишите функцию `first_over(expenses, limit)`, которая возвращает номер первого дня, когда расход был **больше** лимита (дни нумеруются с 1). Если такого дня нет, функция возвращает `0`.

  Поиск напишите через `return` внутри цикла — лучше без флага и `break`. Вводить и печатать ничего не нужно — проверки вызывают функцию сами:

  ```python
  first_over([300, 1200, 1500], 1000)  # должно вернуть 2
  first_over([300, 900], 1000)         # должно вернуть 0
  ```
starter: |
  def first_over(expenses, limit):
      # План:
      # 1. Пройти по номерам дней: range и len
      # 2. Расход больше лимита — сразу вернуть номер дня
      # 3. Цикл закончился, а дня не нашлось — ...
      return 0
solution: |
  def first_over(expenses, limit):
      for i in range(len(expenses)):
          if expenses[i] > limit:
              return i + 1
      return 0
tests:
  asserts:
    - name: Пример из условия
      code: assert first_over([300, 1200, 1500], 1000) == 2, "first_over([300, 1200, 1500], 1000) должно вернуть 2"
    - name: Нет превышений
      code: assert first_over([300, 900], 1000) == 0, "first_over([300, 900], 1000) должно вернуть 0"
    - name: Превышение в первый день
      code: assert first_over([1001, 10], 1000) == 1, "first_over([1001, 10], 1000) должно вернуть 1"
    - name: Превышение в последний день
      code: assert first_over([10, 20, 3000], 1000) == 3, "first_over([10, 20, 3000], 1000) должно вернуть 3"
    - name: Несколько превышений
      code: assert first_over([5, 1500, 2000], 1000) == 2, "first_over([5, 1500, 2000], 1000) должно вернуть 2 — номер первого такого дня"
    - name: Ровно лимит — не превышение
      code: assert first_over([500, 1000], 1000) == 0, "first_over([500, 1000], 1000) должно вернуть 0"
    - name: Пустой дневник
      code: assert first_over([], 1000) == 0, "first_over([], 1000) должно вернуть 0"
hints:
  - level: 1
    text: 'Что должна вернуть функция для `[300, 1200, 1500]`: номер дня или сам расход? Индекс в списке и номер дня — одно и то же число?'
  - level: 2
    text: '`return` внутри цикла завершает и цикл, и вызов. Поэтому на первой находке можно сразу вернуть номер дня, а «не нашлось» сказать только после цикла.'
  - level: 3
    text: '`for i in range(len(expenses)):` — `if expenses[i] > limit: return i + 1`; а после цикла, на уровне `for`, — `return 0`.'
