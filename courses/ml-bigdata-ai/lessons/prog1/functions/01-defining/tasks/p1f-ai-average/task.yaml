id: p1f-ai-average
title: ИИ-ассистент считает средний балл
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте функцию `average(marks)` от ИИ-ассистента: она должна возвращать средний балл, а не печатать его.**

  Программа читает оценки — целые числа через пробел — и выводит `отлично`, если средний балл не меньше 4.5, иначе `стоит подтянуть`. Сейчас она печатает лишнее число и падает. Проверки запускают программу и отдельно вызывают функцию: `average([5, 4, 3])` должна вернуть `4.0`.

  Пример 1
  ```input
  5 4 5
  ```
  ```output
  отлично
  ```

  Пример 2
  ```input
  4 5
  ```
  ```output
  отлично
  ```

  Ограничения: от 1 до 20 оценок, каждая от 2 до 5.
starter: |
  # Решение от ИИ-ассистента
  def average(marks):
      total = 0
      for m in marks:
          total += m
      print(total / len(marks))

  marks = []
  for p in input().split():
      marks.append(int(p))
  avg = average(marks)
  if avg >= 4.5:
      print("отлично")
  else:
      print("стоит подтянуть")
stdin: "5 4 5\n"
solution: |
  def average(marks):
      total = 0
      for m in marks:
          total += m
      return total / len(marks)

  marks = []
  for p in input().split():
      marks.append(int(p))
  avg = average(marks)
  if avg >= 4.5:
      print("отлично")
  else:
      print("стоит подтянуть")
tests:
  io:
    - name: Пример из условия
      stdin: "5 4 5\n"
      stdout: "отлично"
    - name: Средний ниже порога
      stdin: "3 4 4\n"
      stdout: "стоит подтянуть"
    - name: Ровно 4.5
      stdin: "4 5\n"
      stdout: "отлично"
      hidden: true
    - name: Одна оценка
      stdin: "5\n"
      stdout: "отлично"
      hidden: true
    - name: Чуть ниже порога
      stdin: "4 4 5 5 4\n"
      stdout: "стоит подтянуть"
      hidden: true
  stdin: "5 4 3\n"
  asserts:
    - name: Функция возвращает среднее
      code: assert average([5, 4, 3]) == 4.0, "average([5, 4, 3]) должно вернуть 4.0"
    - name: Среднее из одной оценки
      code: assert average([5]) == 5.0, "average([5]) должно вернуть 5.0"
    - name: Дробное среднее
      code: assert average([4, 5]) == 4.5, "average([4, 5]) должно вернуть 4.5"
hints:
  - level: 1
    text: 'В последней строке сообщения об ошибке сказано, что сравнивают `NoneType` и `float`. Откуда в `avg` взялось `None`? Что возвращает функция, в которой нет `return`?'
  - level: 2
    text: '`print` внутри функции показывает среднее на экране — отсюда лишняя строка, — но программе ничего не отдаёт. Отдать значение туда, где функцию вызвали, может только `return`.'
  - level: 3
    text: 'Правка одна — в последней строке тела `average`: выражение остаётся тем же, меняется инструкция перед ним. Лишнее число на экране после этого тоже исчезнет.'
