id: p1f-ai-average
title: ИИ-ассистент считает средний балл
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте функцию `average(marks)` от ИИ-ассистента: она должна возвращать средний балл, а не печатать его.**

  `marks` — список оценок, целые числа. Под функцией ассистент оставил пример вызова. Сейчас пример печатает лишнее число, а вместо балла — `None`. Проверка вызывает `average` сама и сравнивает то, что функция вернула.

  Пример 1
  ```call
  average([5, 4, 3])
  ```
  ```return
  4.0
  ```

  Пример 2
  ```call
  average([4, 5])
  ```
  ```return
  4.5
  ```

  Ограничения: от 1 до 20 оценок, каждая от 2 до 5. Результат — дробное число; проверка сравнивает его с допуском, округлять не нужно.
starter: |
  # Решение от ИИ-ассистента
  def average(marks):
      total = 0
      for m in marks:
          total += m
      print(total / len(marks))

  avg = average([5, 4, 5])
  print("Средний балл:", avg)
solution: |
  def average(marks):
      total = 0
      for m in marks:
          total += m
      return total / len(marks)

  avg = average([5, 4, 5])
  print("Средний балл:", avg)
tests:
  function: average
  tol: 1e-9
  calls:
    - name: Три оценки
      args: [[5, 4, 3]]
      expect: 4.0
    - name: Дробное среднее
      args: [[4, 5]]
      expect: 4.5
    - name: Одна оценка
      args: [[5]]
      expect: 5.0
      hidden: true
    - name: Средний с бесконечной дробью
      args: [[5, 5, 4]]
      expect: 4.666666666666667
      hidden: true
    - name: Пять оценок
      args: [[4, 4, 5, 5, 4]]
      expect: 4.4
      hidden: true
hints:
  - level: 1
    text: 'Пример под функцией печатает `Средний балл: None`. Откуда в `avg` взялось `None`? Что возвращает функция, в которой нет `return`?'
  - level: 2
    text: '`print` внутри функции показывает среднее на экране — отсюда лишняя строка, — но тому, кто вызвал функцию, ничего не отдаёт. Отдать значение может только `return`.'
  - level: 3
    text: 'Правка одна — в последней строке тела `average`: выражение остаётся тем же, меняется инструкция перед ним. Лишнее число на экране после этого тоже исчезнет.'
