id: p1f-ai-average
title: ИИ-ассистент считает средний балл
sandbox: python-browser
difficulty: 2
statement: |
  Задача: в строке ввода — оценки ученика, целые числа через пробел (хотя бы одна). Программа выводит `отлично`, если средний балл не меньше 4.5, иначе — `стоит подтянуть`. Средний балл считает функция `average(marks)`: она получает список чисел и **возвращает** их среднее. Проверки вызывают и программу целиком, и саму функцию: `average([5, 4, 3])` должно вернуть `4.0`.

  ```input
  5 4 5
  ```
  ```
  отлично
  ```

  Решение в редакторе написал ИИ-ассистент. Запустите его: сначала появляется лишняя строка с числом, а потом программа падает. Прочитайте сообщение об ошибке снизу вверх, найдите, почему `avg` не число, и исправьте функцию.
starter: |
  # Решение от ИИ-ассистента
  def average(marks):
      total = 0
      for m in marks:
          total += m
      print(total / len(marks))

  marks = []
  for p in input().split():
      marks.append(int(p))
  avg = average(marks)
  if avg >= 4.5:
      print("отлично")
  else:
      print("стоит подтянуть")
stdin: "5 4 5\n"
solution: |
  def average(marks):
      total = 0
      for m in marks:
          total += m
      return total / len(marks)

  marks = []
  for p in input().split():
      marks.append(int(p))
  avg = average(marks)
  if avg >= 4.5:
      print("отлично")
  else:
      print("стоит подтянуть")
tests:
  io:
    - name: Пример из условия
      stdin: "5 4 5\n"
      stdout: "отлично"
    - name: Средний ниже порога
      stdin: "3 4 4\n"
      stdout: "стоит подтянуть"
    - name: Ровно 4.5
      stdin: "4 5\n"
      stdout: "отлично"
      hidden: true
    - name: Одна оценка
      stdin: "5\n"
      stdout: "отлично"
      hidden: true
    - name: Чуть ниже порога
      stdin: "4 4 5 5 4\n"
      stdout: "стоит подтянуть"
      hidden: true
  stdin: "5 4 3\n"
  asserts:
    - name: Функция возвращает среднее
      code: assert average([5, 4, 3]) == 4.0, "average([5, 4, 3]) должно вернуть 4.0"
    - name: Среднее из одной оценки
      code: assert average([5]) == 5.0, "average([5]) должно вернуть 5.0"
    - name: Дробное среднее
      code: assert average([4, 5]) == 4.5, "average([4, 5]) должно вернуть 4.5"
hints:
  - level: 1
    text: 'В последней строке сообщения об ошибке сказано, что сравнивают `NoneType` и `float`. Откуда в `avg` взялось `None`? Что возвращает функция, в которой нет `return`?'
  - level: 2
    text: '`print` внутри функции показывает среднее на экране — отсюда лишняя строка, — но программе ничего не отдаёт. Отдать значение туда, где функцию вызвали, может только `return`.'
  - level: 3
    text: 'В последней строке тела `average` замените `print(...)` на `return ...`: `return total / len(marks)`.'
