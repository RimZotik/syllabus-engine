id: p1f-taxi-fare
title: Тариф такси
sandbox: python-browser
difficulty: 1
statement: |
  Такси берёт 100 рублей за посадку и ещё `rate` рублей за каждый километр. Обычный тариф — 25 рублей за километр, но бывают и другие.

  Напишите функцию `fare(km, rate=25)`, которая **возвращает** стоимость поездки. Вводить и печатать ничего не нужно: проверки сами вызовут функцию и сравнят то, что она вернула, с правильным ответом. Например:

  ```python
  fare(10)      # должно вернуть 350
  fare(10, 40)  # должно вернуть 500
  ```
starter: |
  def fare(km, rate):
      # План:
      # 1. Посадка — 100 рублей
      # 2. Плюс километры, умноженные на тариф
      # 3. Отдать результат через return, а не print
      return 0
solution: |
  def fare(km, rate=25):
      return 100 + km * rate
tests:
  asserts:
    - name: Обычный тариф
      code: assert fare(10) == 350, "fare(10) должно вернуть 350"
    - name: Другой тариф
      code: assert fare(10, 40) == 500, "fare(10, 40) должно вернуть 500"
    - name: Только посадка
      code: assert fare(0) == 100, "fare(0) должно вернуть 100"
    - name: Аргументы по имени
      code: assert fare(rate=30, km=2) == 160, "fare(rate=30, km=2) должно вернуть 160"
    - name: Дробные километры
      code: assert fare(2.5) == 162.5, "fare(2.5) должно вернуть 162.5"
hints:
  - level: 1
    text: Проверка вызывает `fare(10)` — с одним аргументом. Что сейчас скажет Python о таком вызове, если у `rate` нет значения по умолчанию?
  - level: 2
    text: 'Значение по умолчанию пишут прямо в строке с `def`, после имени параметра. Стоимость — посадка плюс `km`, умноженные на `rate`.'
  - level: 3
    text: '`def fare(km, rate=25):`, а в теле — одна строка: `return` и выражение «100 плюс километры, умноженные на тариф».'
