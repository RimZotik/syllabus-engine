id: p1f-taxi-fare
title: Тариф такси
sandbox: python-browser
difficulty: 1
statement: |
  **Напишите функцию `fare(km, rate=25)`, которая возвращает стоимость поездки на такси.**

  Поездка стоит 100 рублей за посадку и ещё `rate` рублей за каждый километр. Функция возвращает число, а не печатает его. В примерах «Ввод» — вызов функции, «Вывод» — значение, которое она возвращает.

  Пример 1
  ```input
  fare(10)
  ```
  ```output
  350
  ```

  Пример 2
  ```input
  fare(10, 40)
  ```
  ```output
  500
  ```

  Ограничения: `km` — число от 0, может быть дробным; `rate` — целое от 1.
starter: |
  def fare(km, rate):
      # План:
      # 1. Посадка — 100 рублей
      # 2. Плюс километры, умноженные на тариф
      # 3. Отдать результат через return, а не print
      return 0
solution: |
  def fare(km, rate=25):
      return 100 + km * rate
tests:
  asserts:
    - name: Обычный тариф
      code: assert fare(10) == 350, "fare(10) должно вернуть 350"
    - name: Другой тариф
      code: assert fare(10, 40) == 500, "fare(10, 40) должно вернуть 500"
    - name: Только посадка
      code: assert fare(0) == 100, "fare(0) должно вернуть 100"
    - name: Аргументы по имени
      code: assert fare(rate=30, km=2) == 160, "fare(rate=30, km=2) должно вернуть 160"
    - name: Дробные километры
      code: assert fare(2.5) == 162.5, "fare(2.5) должно вернуть 162.5"
hints:
  - level: 1
    text: Проверка вызывает `fare(10)` — с одним аргументом. Что сейчас скажет Python о таком вызове, если у `rate` нет значения по умолчанию?
  - level: 2
    text: 'Значение по умолчанию пишут прямо в строке с `def`, после имени параметра. Стоимость — посадка плюс `km`, умноженные на `rate`.'
  - level: 3
    text: 'Значение по умолчанию — в строке с `def`: `rate=25`. Тело — один `return` с выражением «посадка плюс километры, умноженные на тариф».'
