id: p1f-taxi-fare
title: Тариф такси
sandbox: python-browser
difficulty: 1
statement: |
  **Напишите функцию `fare(km, rate=25)`, которая возвращает стоимость поездки на такси.**

  Поездка стоит 100 рублей за посадку и ещё `rate` рублей за каждый километр. Если тариф не передали, он равен 25. Функция возвращает число, а не печатает его.

  Пример 1
  ```call
  fare(10)
  ```
  ```return
  350
  ```

  Пример 2
  ```call
  fare(10, 40)
  ```
  ```return
  500
  ```

  Ограничения: `km` — число от 0, может быть дробным; `rate` — целое от 1.
starter: |
  def fare(km, rate=25):
      # План:
      # 1. Посадка — 100 рублей
      # 2. Плюс километры, умноженные на тариф
      # 3. Отдать результат через return, а не print
      return 0
solution: |
  def fare(km, rate=25):
      return 100 + km * rate
tests:
  function: fare
  calls:
    - name: Обычный тариф
      args: [10]
      expect: 350
    - name: Другой тариф
      args: [10, 40]
      expect: 500
    - name: Только посадка
      args: [0]
      expect: 100
    - name: Аргументы по имени
      args: []
      kwargs: {rate: 30, km: 2}
      expect: 160
    - name: Дробные километры
      args: [2.5]
      expect: 162.5
    - name: Тариф по имени
      args: [4]
      kwargs: {rate: 10}
      expect: 140
      hidden: true
hints:
  - level: 1
    text: 'Из чего складывается цена: что платят один раз за поездку, а что — за каждый километр? Какую из этих частей задаёт `rate`?'
  - level: 2
    text: 'Стоимость — посадка плюс `km`, умноженные на `rate`. Значение `rate=25` уже стоит в строке с `def`: при вызове `fare(10)` Python подставит его сам. Чтобы увидеть, что происходит внутри, добавьте `print` — он не влияет на проверку.'
  - level: 3
    text: 'Тело — один `return` с выражением «посадка плюс километры, умноженные на тариф». Без `return` функция вернёт `None`, даже если напечатает верное число.'
