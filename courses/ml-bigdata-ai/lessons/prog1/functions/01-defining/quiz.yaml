title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: def-body-waits
  type: single
  q: |
    Что выведет программа?
    ```python
    def greet():
        print("Привет")
        return "готово"

    print("Начало")
    ```
  options:
  - '`Начало`'
  - '`Привет`, потом `Начало` — каждое в своей строке'
  - '`Начало`, потом `Привет` — каждое в своей строке'
  - '`Привет`, `готово` и `Начало` — каждое в своей строке'
  answer: 0
  explain: 'Инструкция `def` только привязывает имя `greet` к функции. Тело выполнилось бы при вызове `greet()`, а вызова в программе нет.'
- id: param-or-arg
  type: multi
  q: |
    Функция определена так, а ниже — её вызов:
    ```python
    def fare(km, rate=30):
        return 100 + km * rate

    cost = fare(12, rate=25)
    ```
    Какие утверждения верны? Выберите все.
  options:
  - 'Во время этого вызова `km` указывает на `12` — так же, как после `km = 12`'
  - 'Значения `12` и `25` — аргументы этого вызова'
  - '`rate=30` в определении — именованный аргумент'
  - 'Во время этого вызова `rate` указывает на `30`: так записано в определении'
  answer:
  - 0
  - 1
  traps:
  - 2
  explain: 'Параметры — имена в определении, аргументы — значения в вызове; при вызове параметр привязывается к аргументу, как при присваивании. `rate=30` в строке с `def` — значение по умолчанию, а именованный аргумент — `rate=25` в вызове. Значение по умолчанию берётся, только если аргумент не передали; здесь передали `25`.'
- id: print-instead-of-return
  type: single
  q: |
    Что выведет программа?
    ```python
    def to_seconds(minutes):
        print(minutes * 60)

    if to_seconds(2) == 120:
        print("две минуты")
    else:
        print("не две минуты")
    ```
  options:
  - '`120`, потом `не две минуты`'
  - '`120`, потом `две минуты`'
  - 'Только `две минуты`'
  - '`120`, потом ошибку `TypeError`: `None` нельзя сравнивать с числом'
  answer: 0
  explain: 'Вызов печатает `120`, но без `return` возвращает `None`. Сравнивать `None` с числом через `==` можно, ошибки нет — просто `None == 120` ложно, и срабатывает `else`. Такая ошибка молчит: на экране верное число, а программа решила иначе. Так же молча не пройдёт и проверка `assert to_seconds(2) == 120`.'
- id: return-in-loop-none
  type: single
  q: |
    Что выведет программа?
    ```python
    def first_frost_day(temps):
        for i in range(len(temps)):
            if temps[i] < 0:
                return i + 1

    print(first_frost_day([3, -2, -7]), first_frost_day([5, 4]))
    ```
  options:
  - '`2 None`'
  - '`3 None`'
  - '`2 0`'
  - 'Ошибку: второй вызов не дошёл до `return`'
  answer: 0
  explain: 'В первом вызове `return` на втором дне сразу завершает и цикл, и вызов: до `-7` дело не доходит. Во втором вызове мороза нет, функция доходит до конца тела без `return` и возвращает `None` — это не ошибка.'
- id: return-indent
  type: single
  q: |
    ИИ-ассистент написал функцию для среднего балла. Что вернёт `average([3, 5, 4])`?
    ```python
    def average(marks):
        total = 0
        for m in marks:
            total += m
            return total / len(marks)
    ```
  options:
  - '`1.0`'
  - '`4.0`'
  - '`None`'
  - '`12`'
  answer: 0
  explain: '`return` стоит в теле цикла. На первой же итерации `total` равен 3, и `return` отдаёт 3 / 3 — вызов закончен, остальные оценки не сложены. Чтобы получить `4.0`, `return` нужно сдвинуть на уровень `for`, после цикла.'
- id: default-order
  type: multi
  q: Какие пары «определение — вызов» выполнятся без ошибки? Выберите все.
  options:
  - '`def bonus(salary, percent=10):` и вызов `bonus(percent=5, salary=1000)`'
  - '`def bonus(percent=10, salary):` и вызов `bonus(salary=1000)`'
  - '`def bonus(salary=0, percent=10):` и вызов `bonus()`'
  - '`def bonus(salary, percent=10):` и вызов `bonus(1000, 5, 1)`'
  - '`def bonus(salary, percent=10):` и вызов `bonus(percent=5, 1000)`'
  answer:
  - 0
  - 2
  explain: 'Именованные аргументы сопоставляются по имени, порядок в вызове неважен. Если значения по умолчанию есть у всех параметров, можно не передавать ничего. Определение `bonus(percent=10, salary)` Python не примет: параметр без значения по умолчанию стоит после параметра со значением, — и именованный вызов этого не исправит. В `bonus(1000, 5, 1)` аргументов три, а параметров два — `TypeError`. А в `bonus(percent=5, 1000)` позиционный аргумент стоит после именованного: позиционные идут первыми, иначе Python не примет вызов.'
- id: name-without-call
  type: single
  q: |
    Программа выводит `отдыхаем` даже в понедельник. Какая правка строки с `if` её исправит?
    ```python
    def is_weekend(day):
        return day == "сб" or day == "вс"

    day = "пн"
    if is_weekend:
        print("отдыхаем")
    else:
        print("работаем")
    ```
  options:
  - '`if is_weekend(day):`'
  - '`if is_weekend():`'
  - '`if is_weekend == True:`'
  - '`if is_weekend(day) == "сб":`'
  answer: 0
  explain: 'В условии стоит имя функции без скобок — сама функция, а не вызов, и она считается истиной. Нужен вызов с аргументом. `is_weekend()` упадёт с `TypeError`: аргумента не хватает. `is_weekend == True` сравнивает с `True` саму функцию и всегда ложно — программа всегда выведет `работаем`. А `is_weekend(day) == "сб"` сравнивает со строкой `"сб"` результат вызова — `True` или `False`, — и равенства не будет никогда.'
- id: append-returns-none
  type: single
  q: |
    Что выведет программа?
    ```python
    marks = [5, 4]
    marks = marks.append(3)
    print(marks)
    ```
  options:
  - '`None`'
  - '`[5, 4, 3]`'
  - '`[5, 4]`'
  - '`[5, 4, 3, 3]`'
  answer: 0
  explain: 'Сначала вычисляется правая часть: `append` дописывает 3 в сам список и возвращает `None`. Потом присваивание привязывает имя `marks` к этому `None`. Список `[5, 4, 3]` получился, но имени, через которое до него добраться, больше нет. Дописать в список — это просто `marks.append(3)`, без присваивания.'
- id: args-before-call
  type: single
  q: |
    Что выведет программа?
    ```python
    def log(x):
        print("считаю", x)
        return x * 2

    print(log(1) + log(10))
    ```
  options:
  - '`считаю 1`, `считаю 10`, `22` — каждое в своей строке'
  - '`22`, `считаю 1`, `считаю 10` — каждое в своей строке'
  - '`считаю 1`, `2`, `считаю 10`, `20`, `22` — каждое в своей строке'
  - '`считаю 1`, `считаю 10` — каждое в своей строке'
  answer: 0
  explain: 'Внешний `print` сначала вычисляет свой аргумент: оба вызова `log` выполняются по очереди и печатают свои строки. Возвращённые 2 и 20 никто не печатает, их складывают. Только потом `print` выводит 22.'
- id: open-print-return
  type: open
  q: |
    Однокурсник написал функцию `vat(price)`, которая печатает НДС от цены, и говорит: «На экране всё правильно, значит, функция работает. Зачем мне `return`?» Объясните ему, чем `print` внутри функции отличается от `return`, и приведите пример, где его функция подведёт.
  rubric:
  - print только показывает текст человеку на экране, а return отдаёт значение в то место программы, где функцию вызвали
  - пример, где результат нужен программе дальше — сложить, сравнить, сохранить в переменную или проверить через assert, — и почему там функция подведёт — без return вызов возвращает None (TypeError при действии с None или непройденная проверка)
  wrong_answers:
  - print и return делают одно и то же, разница только в оформлении
  - return тоже выводит значение на экран
  - функция без return вернёт 0
  followups:
  - Что напечатает print(vat(1000)), если внутри vat стоит print, а не return?
