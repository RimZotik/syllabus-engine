title: Проверка темы
pass: 0.85
minutes: 35
questions:
- id: param-or-arg
  type: multi
  q: |
    Функция определена так, а ниже — её вызов:
    ```python
    def fare(km, rate=30):
        return 100 + km * rate

    cost = fare(12, rate=25)
    ```
    Какие утверждения верны? Выберите все.
  options:
  - 'Во время этого вызова `km` указывает на `12` — так же, как после `km = 12`'
  - 'Значения `12` и `25` — аргументы этого вызова'
  - '`rate=30` в определении — именованный аргумент'
  - 'Во время этого вызова `rate` указывает на `30`: так записано в определении'
  answer:
  - 0
  - 1
  traps:
  - 2
  explain: 'Параметры — имена в определении, аргументы — значения в вызове; при вызове параметр привязывается к аргументу, как при присваивании. `rate=30` в строке с `def` — значение по умолчанию, а именованный аргумент — `rate=25` в вызове. Значение по умолчанию берётся, только если аргумент не передали; здесь передали `25`.'
- id: print-instead-of-return
  type: single
  q: |
    Что выведет программа?
    ```python
    def to_seconds(minutes):
        print(minutes * 60)

    if to_seconds(2) == 120:
        print("две минуты")
    else:
        print("не две минуты")
    ```
  options:
  - '`120`, потом `не две минуты`'
  - '`120`, потом `две минуты`'
  - 'Только `две минуты`'
  - '`120`, потом ошибку `TypeError`: `None` нельзя сравнивать с числом'
  answer: 0
  explain: 'Вызов печатает `120`, но без `return` возвращает `None`. Сравнивать `None` с числом через `==` можно, ошибки нет — просто `None == 120` ложно, и срабатывает `else`. Такая ошибка молчит: на экране верное число, а программа решила иначе. Так же молча не пройдёт и проверка `assert to_seconds(2) == 120`.'
- id: return-in-loop-none
  type: single
  q: |
    Что выведет программа?
    ```python
    def first_frost_day(temps):
        for i in range(len(temps)):
            if temps[i] < 0:
                return i + 1

    print(first_frost_day([3, -2, -7]), first_frost_day([5, 4]))
    ```
  options:
  - '`2 None`'
  - '`3 None`'
  - '`2 0`'
  - 'Ошибку: второй вызов не дошёл до `return`'
  answer: 0
  explain: 'В первом вызове `return` на втором дне сразу завершает и цикл, и вызов: до `-7` дело не доходит. Во втором вызове мороза нет, функция доходит до конца тела без `return` и возвращает `None` — это не ошибка.'
- id: append-returns-none
  type: single
  q: |
    Что выведет программа?
    ```python
    marks = [5, 4]
    marks = marks.append(3)
    print(marks)
    ```
  options:
  - '`None`'
  - '`[5, 4, 3]`'
  - '`[5, 4]`'
  - '`[5, 4, 3, 3]`'
  answer: 0
  explain: 'Сначала вычисляется правая часть: `append` дописывает 3 в сам список и возвращает `None`. Потом присваивание привязывает имя `marks` к этому `None`. Список `[5, 4, 3]` получился, но имени, через которое до него добраться, больше нет. Дописать в список — это просто `marks.append(3)`, без присваивания.'
- id: args-before-call
  type: single
  q: |
    Что выведет программа?
    ```python
    def log(x):
        print("считаю", x)
        return x * 2

    print(log(1) + log(10))
    ```
  options:
  - '`считаю 1`, `считаю 10`, `22` — каждое в своей строке'
  - '`22`, `считаю 1`, `считаю 10` — каждое в своей строке'
  - '`считаю 1`, `2`, `считаю 10`, `20`, `22` — каждое в своей строке'
  - '`считаю 1`, `считаю 10` — каждое в своей строке'
  answer: 0
  explain: 'Внешний `print` сначала вычисляет свой аргумент: оба вызова `log` выполняются по очереди и печатают свои строки. Возвращённые 2 и 20 никто не печатает, их складывают. Только потом `print` выводит 22.'
- id: code-complete-seconds
  type: code
  q: |
    **Допишите функцию `to_seconds(minutes, seconds)`: она возвращает, сколько всего секунд в `minutes` минутах и `seconds` секундах.**

    Замените `...` в теле функции.

    Пример 1
    ```call
    to_seconds(2, 5)
    ```
    ```return
    125
    ```

    Ограничения: оба аргумента — целые от 0, `seconds` меньше 60.
  starter: |
    def to_seconds(minutes, seconds):
        return ...
  solution: |
    def to_seconds(minutes, seconds):
        return minutes * 60 + seconds
  tests:
    function: to_seconds
    calls:
    - name: Две минуты пять секунд
      args: [2, 5]
      expect: 125
    - name: Только секунды
      args: [0, 59]
      expect: 59
    - name: Ровно десять минут
      args: [10, 0]
      expect: 600
    - name: Ноль
      args: [0, 0]
      expect: 0
  explain: |
    В минуте 60 секунд: `minutes * 60 + seconds`. Проверки смотрят на то, что функция вернула, поэтому выражение стоит после `return`; `print` вместо `return` проверку не пройдёт — вызов вернёт `None`.
- id: code-fix-def-order
  type: code
  q: |
    **Исправьте программу, чтобы она перестала падать с `NameError`; формулу не меняйте.**

    Программа читает цену без НДС — целое число — и выводит цену с НДС 20%.

    Пример 1
    ```input
    1000
    ```
    ```output
    1200.0
    ```
  starter: |
    price = int(input())
    print(with_vat(price))

    def with_vat(price):
        return price + price * 20 / 100
  solution: |
    def with_vat(price):
        return price + price * 20 / 100

    price = int(input())
    print(with_vat(price))
  tests:
    io:
    - name: Цена 1000
      stdin: "1000\n"
      stdout: "1200.0"
    - name: Цена 150
      stdin: "150\n"
      stdout: "180.0"
      hidden: true
    - name: Цена 45
      stdin: "45\n"
      stdout: "54.0"
      hidden: true
    - name: Бесплатно
      stdin: "0\n"
      stdout: "0.0"
      hidden: true
  explain: |
    Python выполняет программу сверху вниз, а `def` — тоже инструкция: имя `with_vat` появляется, только когда она выполнится. Вызов стоял выше, и имени ещё не было. Определение функции нужно поставить до вызова.
- id: name-without-call
  type: code
  q: |
    **Исправьте программу: сейчас она выводит `отдыхаем` в любой день. Функцию `is_weekend` не меняйте.**

    Ввод — день недели: `пн`, `вт`, `ср`, `чт`, `пт`, `сб` или `вс`. Выведите `отдыхаем` для субботы и воскресенья, иначе — `работаем`.

    Пример 1
    ```input
    пн
    ```
    ```output
    работаем
    ```

    Пример 2
    ```input
    сб
    ```
    ```output
    отдыхаем
    ```
  starter: |
    def is_weekend(day):
        return day == "сб" or day == "вс"

    day = input()
    if is_weekend:
        print("отдыхаем")
    else:
        print("работаем")
  solution: |
    def is_weekend(day):
        return day == "сб" or day == "вс"

    day = input()
    if is_weekend(day):
        print("отдыхаем")
    else:
        print("работаем")
  tests:
    io:
    - name: Понедельник
      stdin: "пн\n"
      stdout: "работаем"
    - name: Суббота
      stdin: "сб\n"
      stdout: "отдыхаем"
      hidden: true
    - name: Воскресенье
      stdin: "вс\n"
      stdout: "отдыхаем"
      hidden: true
    - name: Пятница
      stdin: "пт\n"
      stdout: "работаем"
      hidden: true
  explain: |
    В условии стоит имя функции без скобок — сама функция, а не её вызов, и в условии она считается истиной. Поэтому всегда выполняется первая ветка. Нужен вызов с аргументом: `if is_weekend(day):`. Вызов `is_weekend()` без аргумента упал бы с `TypeError`, а сравнение `is_weekend == True` всегда ложно — тогда программа всегда выводила бы `работаем`.
- id: code-fix-default-order
  type: code
  q: |
    **Исправьте строку с `def`: Python не принимает определение функции `tip`.**

    `tip` возвращает чаевые — `percent` процентов от счёта `bill`; если процент не указан, он равен 10. Функцию вызывают так: `tip(1000)`, `tip(1000, 15)`, `tip(percent=20, bill=500)`.

    Пример 1
    ```call
    tip(1000)
    ```
    ```return
    100.0
    ```

    Пример 2
    ```call
    tip(1000, 15)
    ```
    ```return
    150.0
    ```
  starter: |
    def tip(percent=10, bill):
        return bill * percent / 100
  solution: |
    def tip(bill, percent=10):
        return bill * percent / 100
  tests:
    asserts:
    - name: Обычный процент
      code: |
        r = tip(1000)
        assert r == 100.0, "tip(1000) должна вернуть 100.0, а вернула " + repr(r)
    - name: Свой процент
      code: |
        r = tip(1000, 15)
        assert r == 150.0, "tip(1000, 15) должна вернуть 150.0, а вернула " + repr(r)
    - name: Аргументы по имени
      code: |
        r = tip(percent=20, bill=500)
        assert r == 100.0, "tip(percent=20, bill=500) должна вернуть 100.0, а вернула " + repr(r)
    - name: Пустой счёт
      code: |
        r = tip(0)
        assert r == 0.0, "tip(0) должна вернуть 0.0, а вернула " + repr(r)
  explain: |
    Параметры со значением по умолчанию пишут после остальных, иначе Python не примет определение. Вызов `tip(1000, 15)` передаёт аргументы по порядку, поэтому первым должен стоять счёт: `def tip(bill, percent=10):`. Вызов с именами `percent=20, bill=500` работает при любом порядке параметров.
- id: code-write-phone-bill
  type: code
  q: |
    **Напишите функцию `phone_bill(minutes, free=300, rate=2)`, которая возвращает плату за связь за месяц.**

    Первые `free` минут бесплатны, каждая минута сверх них стоит `rate` рублей. Если минут не больше `free`, функция возвращает `0`.

    Пример 1
    ```call
    phone_bill(400)
    ```
    ```return
    200
    ```

    Пример 2
    ```call
    phone_bill(400, rate=3)
    ```
    ```return
    300
    ```

    Ограничения: все аргументы — целые от 0.
  starter: |
    def phone_bill(minutes, free=300, rate=2):
        # Сколько минут сверх бесплатных? Если таких нет, платить нечего
        return 0
  solution: |
    def phone_bill(minutes, free=300, rate=2):
        if minutes <= free:
            return 0
        return (minutes - free) * rate
  tests:
    function: phone_bill
    calls:
    - name: Пример из условия
      args: [400]
      expect: 200
    - name: Другая цена минуты
      args: [400]
      kwargs: {"rate": 3}
      expect: 300
    - name: Меньше бесплатных
      args: [250]
      expect: 0
    - name: Ровно бесплатные
      args: [300]
      expect: 0
    - name: Одна минута сверх
      args: [301]
      expect: 2
    - name: Другой пакет минут
      args: [400]
      kwargs: {"free": 100}
      expect: 600
    - name: Все аргументы по порядку
      args: [50, 0, 1]
      expect: 50
    - name: Аргументы по имени
      args: []
      kwargs: {"rate": 5, "minutes": 310}
      expect: 50
  explain: |
    Платят только за минуты сверх бесплатных: `(minutes - free) * rate`. Если минут не больше `free`, разность получится нулевой или отрицательной — поэтому сначала проверка и `return 0`, а после неё `return` с формулой. Значения по умолчанию подставляются, только когда аргумент не передали, а именованный аргумент меняет один нужный параметр.
- id: code-write-coldest
  type: code
  q: |
    **Напишите функции `to_celsius(f)` и `coldest(temps)`: перевод из градусов Фаренгейта в градусы Цельсия и самая низкая температура списка по Цельсию.**

    `to_celsius(f)` возвращает `(f - 32) * 5 / 9`, округлённое через `round(…, 1)`. `coldest(temps)` получает температуры по Фаренгейту, переводит каждую через `to_celsius` и возвращает самую низкую; для пустого списка — `None`.

    Проверка вызывает обе функции. Например, `to_celsius(50)` возвращает `10.0`, а `to_celsius(0)` — `-17.8`.

    Пример
    ```call
    coldest([50, 23, 68])
    ```
    ```return
    -5.0
    ```
  starter: |
    def to_celsius(f):
        ...

    def coldest(temps):
        ...
  solution: |
    def to_celsius(f):
        return round((f - 32) * 5 / 9, 1)

    def coldest(temps):
        if len(temps) == 0:
            return None
        lowest = to_celsius(temps[0])
        for f in temps:
            c = to_celsius(f)
            if c < lowest:
                lowest = c
        return lowest
  tests:
    function: coldest
    calls:
    - name: Пример из условия
      args: [[50, 23, 68]]
      expect: -5.0
    - name: Пустой список
      args: [[]]
      expect: null
    - name: Одна температура
      args: [[77]]
      expect: 25.0
    - name: Самая низкая в середине
      args: [[14, -4, 5]]
      expect: -20.0
    - name: Самая низкая в конце
      args: [[41, 32, 23]]
      expect: -5.0
    asserts:
    - name: Перевод 50 °F
      code: |
        r = to_celsius(50)
        assert r == 10.0, "to_celsius(50) должна вернуть 10.0, а вернула " + repr(r)
    - name: Перевод с округлением
      code: |
        r = to_celsius(0)
        assert r == -17.8, "to_celsius(0) должна вернуть -17.8, а вернула " + repr(r)
  explain: |
    `to_celsius` возвращает число, поэтому её вызов можно поставить куда угодно — в присваивание, в сравнение. В `coldest` — знакомый поиск наименьшего: начать с первой температуры и сравнивать с каждой следующей. Пустой список проверяют до того, как брать `temps[0]`, иначе будет `IndexError`.
