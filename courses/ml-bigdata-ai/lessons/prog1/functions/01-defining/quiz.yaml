title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: def-body-waits
  type: single
  q: |
    Что выведет программа?
    ```python
    def greet():
        print("Привет")
        return "готово"

    print("Начало")
    ```
  options:
  - '`Начало`'
  - '`Привет`, потом `Начало` — каждое в своей строке'
  - '`Начало`, потом `Привет` — каждое в своей строке'
  - '`Привет`, `готово` и `Начало` — каждое в своей строке'
  answer: 0
  explain: 'Инструкция `def` только привязывает имя `greet` к функции. Тело выполнилось бы при вызове `greet()`, а вызова в программе нет.'
- id: param-or-arg
  type: multi
  q: |
    Функция определена так, а ниже — её вызов:
    ```python
    def fare(km, rate=30):
        return 100 + km * rate

    cost = fare(12, rate=25)
    ```
    Какие утверждения верны? Выберите все.
  options:
  - '`km` и `rate` — параметры функции `fare`'
  - 'Значения `12` и `25` — аргументы этого вызова'
  - '`rate=30` в определении — именованный аргумент'
  - 'Во время этого вызова `rate` указывает на `30`: так записано в определении'
  answer:
  - 0
  - 1
  traps:
  - 2
  explain: 'Параметры — имена в определении, аргументы — значения в вызове. `rate=30` в строке с `def` — значение по умолчанию, а именованный аргумент — `rate=25` в вызове. Значение по умолчанию берётся, только если аргумент не передали; здесь передали `25`.'
- id: print-instead-of-return
  type: single
  q: |
    Что произойдёт при запуске?
    ```python
    def to_seconds(minutes):
        print(minutes * 60)

    total = to_seconds(2) + 30
    ```
  options:
  - 'Выведется `120`, а потом программа упадёт с `TypeError`'
  - 'Ничего не выведется, а `total` будет указывать на `150`'
  - 'Выведется `150`'
  - 'Выведется `120`, а `total` будет указывать на `150`'
  answer: 0
  explain: '`print` показывает `120` на экране, но функция без `return` возвращает `None`. Дальше `None + 30` — и `TypeError`: складывать `None` с числом нельзя.'
- id: return-in-loop-none
  type: single
  q: |
    Что выведет программа?
    ```python
    def first_frost_day(temps):
        for i in range(len(temps)):
            if temps[i] < 0:
                return i + 1

    print(first_frost_day([3, -2, -7]), first_frost_day([5, 4]))
    ```
  options:
  - '`2 None`'
  - '`3 None`'
  - '`2 0`'
  - 'Ошибку: второй вызов не дошёл до `return`'
  answer: 0
  explain: 'В первом вызове `return` на втором дне сразу завершает и цикл, и вызов: до `-7` дело не доходит. Во втором вызове мороза нет, функция доходит до конца тела без `return` и возвращает `None` — это не ошибка.'
- id: return-indent
  type: single
  q: |
    ИИ-ассистент написал функцию для среднего балла. Что вернёт `average([3, 5, 4])`?
    ```python
    def average(marks):
        total = 0
        for m in marks:
            total += m
            return total / len(marks)
    ```
  options:
  - '`1.0`'
  - '`4.0`'
  - '`None`'
  - '`12`'
  answer: 0
  explain: '`return` стоит в теле цикла. На первой же итерации `total` равен 3, и `return` отдаёт 3 / 3 — вызов закончен, остальные оценки не сложены. Чтобы получить `4.0`, `return` нужно сдвинуть на уровень `for`, после цикла.'
- id: call-without-error
  type: single
  q: |
    Функция определена так:
    ```python
    def phone_bill(minutes, price, fee=0):
        return minutes * price + fee
    ```
    Какой из вызовов выполнится без ошибки?
  options:
  - '`phone_bill(price=2, minutes=300)`'
  - '`phone_bill(300)`'
  - '`phone_bill(fee=50, 300, 2)`'
  - '`phone_bill(300, 2, 50, 10)`'
  answer: 0
  explain: 'Именованные аргументы сопоставляются по имени, порядок неважен, а `fee` берётся по умолчанию. В `phone_bill(300)` не хватает `price`, в четырёх аргументах один лишний, а позиционные аргументы после именованного Python не примет.'
- id: default-order
  type: multi
  q: Какие определения функции Python примет? Выберите все.
  options:
  - '`def bonus(salary, percent=10):`'
  - '`def bonus(percent=10, salary):`'
  - '`def bonus():`'
  - '`def bonus(salary=0, percent=10):`'
  answer:
  - 0
  - 2
  - 3
  explain: 'Параметров может не быть совсем, и значения по умолчанию могут быть у всех. Нельзя только ставить параметр без значения по умолчанию после параметра со значением: `def bonus(percent=10, salary):` — синтаксическая ошибка.'
- id: name-without-call
  type: single
  q: |
    Программа выводит `отдыхаем` даже в понедельник. Какая правка строки с `if` её исправит?
    ```python
    def is_weekend(day):
        return day == "сб" or day == "вс"

    day = "пн"
    if is_weekend:
        print("отдыхаем")
    else:
        print("работаем")
    ```
  options:
  - '`if is_weekend(day):`'
  - '`if is_weekend():`'
  - '`if is_weekend == True:`'
  - '`if is_weekend(day) == "сб":`'
  answer: 0
  explain: 'В условии стоит имя функции без скобок — сама функция, а не вызов, и она считается истиной. Нужен вызов с аргументом. `is_weekend()` упадёт с `TypeError`: аргумента не хватает. `is_weekend == True` сравнивает с `True` саму функцию и всегда ложно — программа всегда выведет `работаем`. А вызов возвращает `True` или `False`, и с `"сб"` он не совпадёт никогда.'
- id: append-returns-none
  type: single
  q: |
    Что выведет программа?
    ```python
    marks = [5, 4]
    new_marks = marks.append(3)
    print(new_marks)
    ```
  options:
  - '`None`'
  - '`[5, 4, 3]`'
  - '`3`'
  - '`[5, 4]`'
  answer: 0
  explain: '`append` меняет сам список `marks`, а возвращает `None`. Список `[5, 4, 3]` можно увидеть через `print(marks)`.'
- id: args-before-call
  type: single
  q: |
    Что выведет программа?
    ```python
    def log(x):
        print("считаю", x)
        return x * 2

    print(log(1) + log(10))
    ```
  options:
  - '`считаю 1`, `считаю 10`, `22` — каждое в своей строке'
  - '`22`, `считаю 1`, `считаю 10` — каждое в своей строке'
  - '`считаю 1`, `2`, `считаю 10`, `20`, `22` — каждое в своей строке'
  - '`считаю 1`, `считаю 10` — каждое в своей строке'
  answer: 0
  explain: 'Внешний `print` сначала вычисляет свой аргумент: оба вызова `log` выполняются по очереди и печатают свои строки. Возвращённые 2 и 20 никто не печатает, их складывают. Только потом `print` выводит 22.'
- id: open-print-return
  type: open
  q: |
    Однокурсник написал функцию `vat(price)`, которая печатает НДС от цены, и говорит: «На экране всё правильно, значит, функция работает. Зачем мне `return`?» Объясните ему, чем `print` внутри функции отличается от `return`, и приведите пример, где его функция подведёт.
  rubric:
  - print только показывает текст человеку на экране, а return отдаёт значение в то место программы, где функцию вызвали
  - пример, где результат нужен программе дальше — сложить, сравнить, сохранить в переменную или проверить через assert, — и почему там функция подведёт — без return вызов возвращает None (TypeError при действии с None или непройденная проверка)
  wrong_answers:
  - print и return делают одно и то же, разница только в оформлении
  - return тоже выводит значение на экран
  - функция без return вернёт 0
  followups:
  - Что напечатает print(vat(1000)), если внутри vat стоит print, а не return?
