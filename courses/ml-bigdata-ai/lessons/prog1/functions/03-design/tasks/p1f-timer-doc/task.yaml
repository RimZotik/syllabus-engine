id: p1f-timer-doc
title: Время тренировки с описанием
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите функцию `format_time(seconds)`, которая возвращает время в виде `M мин S с`, и оформите её для других программистов.**

  `M` — целые минуты (может быть больше 59), `S` — оставшиеся секунды. Нужны строка документации — что делает функция, что принимает и возвращает, пример вызова `format_time(...)` с результатом — и аннотации типов: `seconds` — `int`, результат — `str`.

  Пример 1
  ```call
  format_time(125)
  ```
  ```return
  "2 мин 5 с"
  ```

  Пример 2
  ```call
  format_time(3725)
  ```
  ```return
  "62 мин 5 с"
  ```

  Ограничения: `seconds` — целое от 0 до 86 400.
starter: |
  def format_time(seconds):
      # План:
      # 1. Строка документации — первой инструкцией тела
      # 2. Аннотации типов в строке с def
      # 3. Целые минуты и оставшиеся секунды
      return ""
solution: |
  def format_time(seconds: int) -> str:
      """Вернуть время в виде «M мин S с».

      seconds — время в секундах, целое неотрицательное число.
      Пример: format_time(125) даёт "2 мин 5 с".
      """
      minutes = seconds // 60
      rest = seconds % 60
      return f"{minutes} мин {rest} с"
tests:
  function: format_time
  calls:
    - name: Пример из условия
      args: [125]
      expect: "2 мин 5 с"
    - name: Больше часа
      args: [3725]
      expect: "62 мин 5 с"
    - name: Меньше минуты
      args: [59]
      expect: "0 мин 59 с"
    - name: Ровно минута
      args: [60]
      expect: "1 мин 0 с"
    - name: Ноль секунд
      args: [0]
      expect: "0 мин 0 с"
  asserts:
    - name: Есть строка документации
      code: |
        assert format_time.__doc__ and format_time.__doc__.strip(), "У функции нет строки документации — текст в тройных кавычках должен стоять первой инструкцией тела"
    - name: В описании есть пример
      code: |
        assert format_time.__doc__ and "format_time(" in format_time.__doc__ and len(format_time.__doc__.strip()) >= 40, "Строка документации слишком короткая — опишите, что функция делает и что принимает, и добавьте пример вызова format_time(...) с результатом"
    - name: Аннотации типов
      code: |
        assert format_time.__annotations__ == {"seconds": int, "return": str}, "Подпишите типы в строке с def: seconds — int, результат — str"
hints:
  - level: 1
    text: 'Сколько целых минут в 125 секундах и сколько секунд остаётся? Какие две операции с числами вы знаете для «целой части» и «остатка»?'
  - level: 2
    text: 'Минуты — `seconds // 60`, остаток — `seconds % 60`; строку удобно собрать f-строкой. Строку документации поставьте сразу под `def`, до любых других инструкций.'
  - level: 3
    text: 'Строка с `def` — `def format_time(seconds: int) -> str:`. Под ней — описание в тройных кавычках, потом расчёт минут и остатка и `return` с f-строкой.'
