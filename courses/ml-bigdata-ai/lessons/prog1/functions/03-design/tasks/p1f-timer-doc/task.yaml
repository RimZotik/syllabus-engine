id: p1f-timer-doc
title: Время тренировки с описанием
sandbox: python-browser
difficulty: 2
statement: |
  Фитнес-браслет хранит время тренировки в секундах, а показывать его нужно в минутах и секундах. Напишите функцию `format_time(seconds)`, которая возвращает строку вида `M мин S с`:

  ```python
  format_time(125)   # должно вернуть "2 мин 5 с"
  format_time(3725)  # должно вернуть "62 мин 5 с"
  ```

  Функцией будут пользоваться другие программисты, поэтому оформите её полностью:

  - строка документации: что функция делает, что принимает и возвращает, и пример вызова с результатом, например `format_time(125)`;
  - аннотации типов: `seconds` — целое число, результат — строка.

  Вводить и печатать ничего не нужно — проверки вызывают функцию сами и смотрят на её описание и аннотации.
starter: |
  def format_time(seconds):
      # План:
      # 1. Строка документации — первой инструкцией тела
      # 2. Аннотации типов в строке с def
      # 3. Целые минуты и оставшиеся секунды
      return ""
solution: |
  def format_time(seconds: int) -> str:
      """Вернуть время в виде «M мин S с».

      seconds — время в секундах, целое неотрицательное число.
      Пример: format_time(125) даёт "2 мин 5 с".
      """
      minutes = seconds // 60
      rest = seconds % 60
      return f"{minutes} мин {rest} с"
tests:
  asserts:
    - name: Пример из условия
      code: assert format_time(125) == "2 мин 5 с", 'format_time(125) должно вернуть "2 мин 5 с"'
    - name: Больше часа
      code: assert format_time(3725) == "62 мин 5 с", 'format_time(3725) должно вернуть "62 мин 5 с"'
    - name: Меньше минуты
      code: assert format_time(59) == "0 мин 59 с", 'format_time(59) должно вернуть "0 мин 59 с"'
    - name: Ровно минута
      code: assert format_time(60) == "1 мин 0 с", 'format_time(60) должно вернуть "1 мин 0 с"'
    - name: Ноль секунд
      code: assert format_time(0) == "0 мин 0 с", 'format_time(0) должно вернуть "0 мин 0 с"'
    - name: Есть строка документации
      code: assert format_time.__doc__ and format_time.__doc__.strip(), "У функции нет строки документации — текст в тройных кавычках должен стоять первой инструкцией тела"
    - name: В описании есть пример
      code: assert format_time.__doc__ and "format_time(" in format_time.__doc__ and len(format_time.__doc__.strip()) >= 40, "Строка документации слишком короткая — опишите, что функция делает и что принимает, и добавьте пример вызова format_time(...) с результатом"
    - name: Аннотации типов
      code: |
        assert format_time.__annotations__ == {"seconds": int, "return": str}, "Подпишите типы в строке с def: seconds — int, результат — str"
hints:
  - level: 1
    text: 'Сколько целых минут в 125 секундах и сколько секунд остаётся? Какие две операции с числами вы знаете для «целой части» и «остатка»?'
  - level: 2
    text: 'Минуты — `seconds // 60`, остаток — `seconds % 60`; строку удобно собрать f-строкой. Строку документации поставьте сразу под `def`, до любых других инструкций.'
  - level: 3
    text: 'Строка с `def` — `def format_time(seconds: int) -> str:`. Под ней — описание в тройных кавычках, потом расчёт и `return f"{minutes} мин {rest} с"`.'
