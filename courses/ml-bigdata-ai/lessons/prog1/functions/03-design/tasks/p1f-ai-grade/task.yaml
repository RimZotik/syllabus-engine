id: p1f-ai-grade
title: ИИ-ассистент ставит оценки
sandbox: python-browser
difficulty: 2
statement: |
  **Найдите своими `assert` ошибки в функции `grade(score)` от ИИ-ассистента и исправьте её.**

  Шкала: 85 и выше — `5`, от 70 до 84 — `4`, от 50 до 69 — `3`, меньше 50 — `2`. Допишите под функцией проверки на каждой границе и рядом с ней, запустите и исправляйте функцию, пока все ваши проверки не пройдут.

  Пример 1
  ```call
  grade(90)
  ```
  ```return
  5
  ```

  Пример 2
  ```call
  grade(60)
  ```
  ```return
  3
  ```

  Ограничения: `score` — целое от 0 до 100.
starter: |
  # Решение от ИИ-ассистента
  def grade(score):
      """Вернуть оценку за тест по баллам.

      score — баллы от 0 до 100.
      85 и выше — 5, от 70 до 84 — 4, от 50 до 69 — 3, меньше 50 — 2.
      Пример: grade(90) даёт 5.
      """
      if score > 85:
          return 5
      if score >= 70:
          return 4
      if score > 50:
          return 3
      return 2

  # Ваши проверки:
  assert grade(90) == 5
solution: |
  def grade(score):
      """Вернуть оценку за тест по баллам.

      score — баллы от 0 до 100.
      85 и выше — 5, от 70 до 84 — 4, от 50 до 69 — 3, меньше 50 — 2.
      Пример: grade(90) даёт 5.
      """
      if score >= 85:
          return 5
      if score >= 70:
          return 4
      if score >= 50:
          return 3
      return 2

  assert grade(90) == 5
  assert grade(85) == 5
  assert grade(84) == 4
  assert grade(70) == 4
  assert grade(69) == 3
  assert grade(50) == 3
  assert grade(49) == 2
tests:
  function: grade
  calls:
    - name: Внутри пятёрки
      args: [90]
      expect: 5
    - name: Внутри тройки
      args: [60]
      expect: 3
    - name: Внутри четвёрки
      args: [75]
      expect: 4
    - name: Внутри двойки
      args: [30]
      expect: 2
    - name: Граница пятёрки
      args: [85]
      expect: 5
      hidden: true
    - name: Под границей пятёрки
      args: [84]
      expect: 4
      hidden: true
    - name: Граница четвёрки
      args: [70]
      expect: 4
      hidden: true
    - name: Под границей четвёрки
      args: [69]
      expect: 3
      hidden: true
    - name: Граница тройки
      args: [50]
      expect: 3
      hidden: true
    - name: Под границей тройки
      args: [49]
      expect: 2
      hidden: true
    - name: Наибольший балл
      args: [100]
      expect: 5
      hidden: true
    - name: Ноль баллов
      args: [0]
      expect: 2
      hidden: true
hints:
  - level: 1
    text: 'Где у этой шкалы границы? Для каждой выпишите два значения: последнее, при котором оценка ещё ниже, и первое, при котором уже выше. Совпадают ли ответы функции с описанием?'
  - level: 2
    text: 'Сравните каждое условие с описанием. «85 и выше», «от 70», «от 50» — пороговое значение входит в диапазон. Какой знак сравнения это записывает и везде ли он стоит?'
  - level: 3
    text: 'Ошибка в знаке сравнения — в двух условиях из трёх. Какие проверки упали: на 85 или на 50? Свои проверки оставьте под функцией.'
