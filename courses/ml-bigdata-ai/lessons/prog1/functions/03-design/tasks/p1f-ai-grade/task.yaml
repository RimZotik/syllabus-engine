id: p1f-ai-grade
title: ИИ-ассистент ставит оценки
sandbox: python-browser
difficulty: 2
statement: |
  Оценку за тест ставят по баллам от 0 до 100: 85 и выше — `5`, от 70 до 84 — `4`, от 50 до 69 — `3`, меньше 50 — `2`. ИИ-ассистент написал функцию `grade(score)` и снабдил её описанием. На примере из описания она отвечает верно, но часть проверок не проходит.

  ```python
  grade(90)  # должно вернуть 5
  grade(60)  # должно вернуть 3
  ```

  Сначала допишите под функцией свои проверки с `assert` — на каждой границе и рядом с ней. Запустите: первая упавшая проверка остановит программу. Исправьте функцию и запустите снова — и так, пока функция не станет делать то, что обещает её описание, а все ваши проверки не пройдут. Вводить и печатать ничего не нужно.
starter: |
  # Решение от ИИ-ассистента
  def grade(score):
      """Вернуть оценку за тест по баллам.

      score — баллы от 0 до 100.
      85 и выше — 5, от 70 до 84 — 4, от 50 до 69 — 3, меньше 50 — 2.
      Пример: grade(90) даёт 5.
      """
      if score > 85:
          return 5
      if score >= 70:
          return 4
      if score > 50:
          return 3
      return 2

  # Ваши проверки:
  assert grade(90) == 5
solution: |
  def grade(score):
      """Вернуть оценку за тест по баллам.

      score — баллы от 0 до 100.
      85 и выше — 5, от 70 до 84 — 4, от 50 до 69 — 3, меньше 50 — 2.
      Пример: grade(90) даёт 5.
      """
      if score >= 85:
          return 5
      if score >= 70:
          return 4
      if score >= 50:
          return 3
      return 2

  assert grade(90) == 5
  assert grade(85) == 5
  assert grade(84) == 4
  assert grade(70) == 4
  assert grade(69) == 3
  assert grade(50) == 3
  assert grade(49) == 2
tests:
  asserts:
    - name: Внутри диапазонов
      code: assert grade(90) == 5 and grade(75) == 4 and grade(60) == 3 and grade(30) == 2, "grade(90), grade(75), grade(60) и grade(30) должны вернуть 5, 4, 3 и 2"
    - name: Граница пятёрки
      code: assert grade(85) == 5 and grade(84) == 4, "grade(85) должно вернуть 5, а grade(84) — 4"
    - name: Граница четвёрки
      code: assert grade(70) == 4 and grade(69) == 3, "grade(70) должно вернуть 4, а grade(69) — 3"
    - name: Граница тройки
      code: assert grade(50) == 3 and grade(49) == 2, "grade(50) должно вернуть 3, а grade(49) — 2"
    - name: Крайние баллы
      code: assert grade(100) == 5 and grade(0) == 2, "grade(100) должно вернуть 5, а grade(0) — 2"
hints:
  - level: 1
    text: 'Где у этой шкалы границы? Для каждой выпишите два значения: последнее, при котором оценка ещё ниже, и первое, при котором уже выше. Совпадают ли ответы функции с описанием?'
  - level: 2
    text: 'Сравните каждое условие с описанием. «85 и выше», «от 70», «от 50» — пороговое значение входит в диапазон. Какой знак сравнения это записывает и везде ли он стоит?'
  - level: 3
    text: 'В первом и третьем `if` замените `>` на `>=`: `score >= 85` и `score >= 50`. Свои проверки оставьте под функцией.'
