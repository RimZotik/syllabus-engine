id: p1f-cafe-bill
title: Счёт в кафе по частям
sandbox: python-browser
difficulty: 3
statement: |
  **Разбейте расчёт счёта в кафе на три функции: `line_cost`, `bill_total` и `per_person`.**

  Под заготовками функций — программа, которая уже считает счёт одним циклом. Строка счёта — `название количество цена`; название может быть из нескольких слов, количество и цена — целые числа.

  - `line_cost(line)` возвращает стоимость одной строки счёта: количество, умноженное на цену;
  - `bill_total(lines)` получает список строк счёта и возвращает их общую стоимость, считая каждую строку через `line_cost`;
  - `per_person(total, people)` возвращает, сколько платит каждый из `people` человек: `total / people` без округления.

  Функции только считают и возвращают; печатает программа под ними — замените в ней цикл и деление вызовами функций. Проверка вызывает каждую функцию сама.

  Пример
  ```call
  bill_total(["капучино 2 180", "чай с мятой 1 120", "сырник 3 180"])
  ```
  ```return
  1020
  ```

  Для тех же данных `line_cost("чай с мятой 1 120")` возвращает `120`, а `per_person(1020, 3)` — `340.0`.

  Ограничения: людей от 1 до 20; строк счёта от 0 до 30, количество и цена — целые от 1.
starter: |
  def line_cost(line):
      ...

  def bill_total(lines):
      ...

  def per_person(total, people):
      ...

  # Программа до разбиения: перенесите расчёт в функции
  people = 3
  lines = ["капучино 2 180", "чай с мятой 1 120", "сырник 3 180"]
  total = 0
  for line in lines:
      words = line.split()
      total += int(words[-2]) * int(words[-1])
  print(f"Итого: {total} руб.")
  print(f"С каждого: {total / people:.2f} руб.")
solution: |
  def line_cost(line):
      words = line.split()
      return int(words[-2]) * int(words[-1])

  def bill_total(lines):
      total = 0
      for line in lines:
          total += line_cost(line)
      return total

  def per_person(total, people):
      return total / people

  people = 3
  lines = ["капучино 2 180", "чай с мятой 1 120", "сырник 3 180"]
  total = bill_total(lines)
  print(f"Итого: {total} руб.")
  print(f"С каждого: {per_person(total, people):.2f} руб.")
tests:
  function: bill_total
  no_mutate: true
  calls:
    - name: Пример из условия
      args: [["капучино 2 180", "чай с мятой 1 120", "сырник 3 180"]]
      expect: 1020
    - name: Две строки
      args: [["капучино 2 180", "сырник 3 150"]]
      expect: 810
    - name: Пустой счёт
      args: [[]]
      expect: 0
      hidden: true
    - name: Одна строка
      args: [["суп дня 1 250"]]
      expect: 250
      hidden: true
  asserts:
    - name: Стоимость строки
      code: |
        r = line_cost("капучино 2 180")
        assert r == 360, 'line_cost("капучино 2 180") должна вернуть 360, а вернула ' + repr(r)
    - name: Название из нескольких слов
      code: |
        r = line_cost("чай с мятой 1 120")
        assert r == 120, 'line_cost("чай с мятой 1 120") должна вернуть 120, а вернула ' + repr(r)
    - name: Доля каждого
      code: |
        r = per_person(900, 3)
        assert r == 300, "per_person(900, 3) должна вернуть 300.0, а вернула " + repr(r)
    - name: Доля с копейками
      code: |
        import math
        r = per_person(75, 2)
        assert isinstance(r, (int, float)) and math.isclose(r, 37.5), "per_person(75, 2) должна вернуть 37.5, а вернула " + repr(r)
    - name: Сумма пользуется line_cost
      code: |
        def line_cost(line):
            return 7
        assert bill_total(["a", "b"]) == 14, "bill_total должна считать стоимость каждой строки через line_cost, а не разбирать строки сама"
hints:
  - level: 1
    text: 'Посмотрите на цикл в программе. Какая строка внутри него разбирает одну строку счёта? Это и есть будущее тело `line_cost`.'
  - level: 2
    text: '`line_cost` берёт количество и цену из двух последних слов. `bill_total` — тот же накопитель, что в цикле сейчас, только прибавляет `line_cost(line)`. Чтобы увидеть, что происходит внутри, добавьте `print` — он не влияет на проверку.'
  - level: 3
    text: 'В программе вместо цикла — `total = bill_total(lines)`, а во втором `print` вместо `total / people` — вызов `per_person(total, people)`. Печать остаётся в программе.'
