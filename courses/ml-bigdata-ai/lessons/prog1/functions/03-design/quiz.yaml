title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: taxi-split
  type: single
  q: Программа читает километры и минуты поездки, считает цену по тарифу такси и печатает чек. Какое разбиение лучше всего следует правилам этой темы?
  options:
  - 'Функция `fare(km, minutes)` возвращает цену, а ввод и печать чека остаются в основной программе'
  - 'Функция `fare_and_print(km, minutes)` считает цену и сразу печатает чек, чтобы не возвращать значение'
  - 'Функция `read_fare()` без параметров сама читает ввод, считает и возвращает цену'
  - 'Функция `main()` без параметров содержит весь код программы, а снизу стоит один её вызов'
  answer: 0
  explain: 'У `fare` одна работа, всё нужное приходит в аргументах, и её легко проверить: `assert fare(10, 15) == …`. `fare_and_print` делает две работы и возвращает `None`. `read_fare` и `main` не проверить, не подставив ввод, — внутри они перемешивают чтение и расчёт.'
- id: call-chain-order
  type: single
  q: |
    Что выведет программа?
    ```python
    def parse(word):
        print("разбор", word)
        return int(word)

    def total(words):
        s = 0
        for w in words:
            s += parse(w)
        return s

    def report(x):
        print("отчёт")
        return f"Итого: {x}"

    print(report(total(["3", "4"])))
    ```
  options:
  - '`разбор 3`, `разбор 4`, `отчёт`, `Итого: 7` — каждое в своей строке'
  - '`отчёт`, `разбор 3`, `разбор 4`, `Итого: 7` — каждое в своей строке'
  - '`разбор 3`, `разбор 4`, `Итого: 7`, `отчёт` — каждое в своей строке'
  - '`разбор 3`, `отчёт`, `разбор 4`, `Итого: 7` — каждое в своей строке'
  answer: 0
  explain: 'Аргументы вычисляются до вызова. Чтобы вызвать `report`, нужно значение `total(["3", "4"])`, а `total` дважды вызывает `parse`. Потом выполняется тело `report`, и только когда оно вернёт строку, внешний `print` её выведет.'
- id: format-change
  type: single
  q: |
    Программа считает средний балл по строкам журнала вида `"Иванов 5"`:
    ```python
    def mark_from_line(line):
        return int(line.split()[-1])

    def average(marks):
        total = 0
        for m in marks:
            total += m
        return total / len(marks)

    def verdict(avg):
        if avg >= 4.5:
            return "отлично"
        return "хорошо"
    ```
    Журнал теперь присылают в виде `"5 Иванов"`. Что нужно изменить?
  options:
  - 'Только `mark_from_line`'
  - '`mark_from_line` и `average`'
  - 'Только `average`'
  - 'Все три функции'
  answer: 0
  explain: 'Формат строки знает только `mark_from_line`: нужно брать первое слово, а не последнее. `average` получает уже готовые числа, а `verdict` — средний балл, им всё равно, откуда эти числа взялись.'
- id: boundary-catches
  type: multi
  q: |
    Функция `shipping(total)` должна возвращать 0, если сумма заказа не меньше 2000 рублей, иначе 300. Программист по ошибке написал в условии `total > 2000` вместо `total >= 2000`. Какие проверки эту ошибку поймают? Выберите все.
  options:
  - '`assert shipping(2000) == 0`'
  - '`assert shipping(1999) == 300`'
  - '`assert shipping(5000) == 0`'
  - '`assert shipping(0) == 300`'
  answer:
  - 0
  traps:
  - 1
  explain: 'Версии с `>` и `>=` расходятся только на самой границе, 2000: правильная даёт 0, ошибочная — 300. На 1999, 5000 и 0 обе версии отвечают одинаково. Значение рядом с границей всё равно нужно: оно ловит другую ошибку — например, порог 1999 вместо 2000.'
- id: docstring-not-first
  type: single
  q: |
    Что покажет `help(call_cost)`, кроме заголовков?
    ```python
    def call_cost(minutes):
        paid = minutes - 100
        """Вернуть стоимость звонков за месяц."""
        if paid < 0:
            return 0
        return paid * 2
    ```
  options:
  - 'Ничего: описания у функции нет'
  - 'Строку `Вернуть стоимость звонков за месяц.`'
  - 'Весь код тела функции'
  - 'Ничего: `help` упадёт с ошибкой, ведь тройные кавычки стоят посреди тела'
  answer: 0
  explain: 'Строка документации — текст в тройных кавычках, который стоит первой инструкцией тела. Здесь первая инструкция — присваивание, поэтому строка в кавычках — просто значение, которое никуда не сохранили. Ошибки нет, но и описания у функции нет.'
- id: docstring-vs-comment
  type: multi
  q: Какие утверждения о строке документации и комментарии верны? Выберите все.
  options:
  - '`help` показывает строку документации функции, а комментарий с `#` внутри тела — нет'
  - 'Строка документации — строковое значение, которое Python хранит вместе с функцией'
  - 'В строке документации пошагово описывают, как устроен цикл внутри функции'
  - 'Комментарий с `#` в первой строке тела `help` тоже покажет как описание'
  answer:
  - 0
  - 1
  explain: 'Строку документации пишут для того, кто будет пользоваться функцией: что она делает, что принимает и возвращает. Как она это делает, видно из кода. Комментарий — для того, кто читает код; комментарий внутри тела `help` не видит.'
- id: first-line
  type: single
  q: Какая первая строка описания функции `average(marks)` лучше всего соответствует советам темы?
  options:
  - '«Вернуть средний балл по списку оценок.»'
  - '«Проходит циклом по оценкам и делит сумму на их количество.»'
  - '«Функция average для работы с оценками.»'
  - '«Здесь считается среднее, см. код ниже.»'
  answer: 0
  explain: 'Первая строка — одной фразой, что функция делает, в форме команды. Вторая строка описывает, *как* она устроена, а это видно из кода. Третья и четвёртая не говорят, что функция возвращает.'
- id: hint-not-checked
  type: single
  q: |
    Что выведет программа?
    ```python
    def minutes(seconds: int) -> int:
        return seconds / 60

    print(minutes(90))
    ```
  options:
  - '`1.5`'
  - '`1`'
  - 'Ошибку `TypeError`: функция обещала вернуть `int`'
  - '`2`'
  answer: 0
  explain: 'Аннотация `-> int` — подсказка для человека и инструментов. Python её не проверяет и ничего не округляет: `/` даёт дробное число, и функция возвращает `1.5`.'
- id: hint-for-printer
  type: single
  q: Функция получает список температур и только печатает их сводку. Какая строка с `def` правильно подписывает типы и параметра, и результата?
  options:
  - '`def show_summary(temps: list) -> None:`'
  - '`def show_summary(temps: list) -> str:`'
  - '`def show_summary(temps: list):`'
  - '`def show_summary(temps) -> list:`'
  answer: 0
  explain: 'Параметр — список, поэтому `temps: list`. Функция, которая только печатает, возвращает `None`, так и пишут: `-> None`. Напечатанный текст — не возвращаемое значение, поэтому `-> str` неверно, а без `->` тип результата не подписан вовсе.'
- id: not-from-decomposition
  type: single
  q: Программу чека разбили на функции «разобрать строку», «сложить цены», «применить скидку». Какое утверждение из этого **не** следует?
  options:
  - 'Если изменится формат строки чека, придётся переписать и «сложить цены»'
  - 'Разбор строки можно проверить с `assert`, не запуская всю программу'
  - 'Ошибку в разборе строки ищут в одной функции'
  - 'Изменение порога скидки затрагивает одну функцию'
  answer: 0
  explain: '«Сложить цены» пользуется разбором строки, не зная, как он устроен: при новом формате меняется только «разобрать строку». Остальные три утверждения — как раз то, что даёт декомпозиция: каждую часть можно понять, проверить и изменить отдельно.'
- id: open-water-bill
  type: open
  q: |
    В строке ввода — расход воды по дням месяца в литрах, через пробел. Программа должна посчитать расход за месяц в кубометрах (1 м³ = 1000 л), сумму к оплате по тарифу 45 рублей за кубометр и напечатать квитанцию. Предложите разбиение на функции: имя каждой, что она принимает и что возвращает, и где программа печатает квитанцию. Запишите одну проверку с `assert` для любой из ваших функций.
  rubric:
  - несколько функций (например, две-три), у каждой одна работа и имя, которое говорит, что она делает или возвращает (например, month_liters, to_cubic_meters, water_cost)
  - для каждой функции сказано, что она принимает и что возвращает
  - печать квитанции — в основной программе, а не внутри функций расчёта
  - проверка с assert вызывает функцию с конкретными аргументами и сравнивает результат с верным ожидаемым значением (например, assert water_cost(2) == 90)
  wrong_answers:
  - одна функция, которая читает ввод, всё считает и печатает квитанцию
  - функции печатают промежуточные результаты вместо того, чтобы их возвращать
  - assert проверяет то, что функция напечатала
  followups:
  - Какую проверку с assert вы добавите для месяца, в котором воду не расходовали?
