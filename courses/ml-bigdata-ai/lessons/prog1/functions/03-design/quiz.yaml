title: Проверка темы
pass: 0.85
minutes: 40
questions:
- id: taxi-split
  type: single
  q: Программа читает километры и минуты поездки, считает цену по тарифу такси и печатает чек. Какое разбиение лучше всего следует правилам этой темы?
  options:
  - 'Функция `fare(km, minutes)` возвращает цену, а ввод и печать чека остаются в основной программе'
  - 'Функция `fare_and_print(km, minutes)` считает цену и печатает чек: всё, что касается цены, собрано в одном месте'
  - 'Функция `read_fare()` без параметров сама читает ввод и возвращает цену: вызывать её проще, аргументы не нужны'
  - 'Функция `main()` содержит весь код программы, а снизу стоит один её вызов: снаружи функций не остаётся ничего'
  answer: 0
  explain: 'У `fare` одна работа, всё нужное приходит в аргументах, и её легко проверить: `assert fare(10, 15) == …`. `fare_and_print` делает две работы и возвращает `None`. `read_fare` и `main` не проверить, не подставив ввод, — внутри они перемешивают чтение и расчёт.'
- id: boundary-catches
  type: multi
  q: |
    Функция `shipping(total)` должна возвращать 0, если сумма заказа не меньше 2000 рублей, иначе 300. Программист по ошибке написал в условии `total > 2000` вместо `total >= 2000`. Какие проверки эту ошибку поймают? Выберите все.
  options:
  - '`assert shipping(2000) == 0`'
  - '`assert shipping(1999) == 300`'
  - '`assert shipping(5000) == 0`'
  - '`assert shipping(0) == 300`'
  answer:
  - 0
  traps:
  - 1
  explain: 'Версии с `>` и `>=` расходятся только на самой границе, 2000: правильная даёт 0, ошибочная — 300. На 1999, 5000 и 0 обе версии отвечают одинаково. Значение рядом с границей всё равно нужно: оно ловит другую ошибку — например, порог 1999 вместо 2000.'
- id: docstring-edge-case
  type: single
  q: |
    Какое дополнение к строке документации полезнее всего тому, кто будет вызывать эту функцию?
    ```python
    def average(marks):
        """Вернуть средний балл по списку оценок."""
        return sum(marks) / len(marks)
    ```
  options:
  - 'Что для пустого списка функция упадёт с `ZeroDivisionError`'
  - 'Что сумма оценок делится на их количество, найденное через `len`'
  - 'Что результат функция отдаёт через `return`, а не печатает'
  - 'Что внутри используются встроенные функции `sum` и `len`'
  answer: 0
  explain: 'Крайний случай не виден по имени и первой строке: тот, кто вызывает функцию, должен знать, что пустой список передавать нельзя. Как считается среднее и какими функциями — это устройство, оно видно из кода. Что результат возвращается, а не печатается, уже сказано словом «Вернуть».'
- id: docstring-not-first
  type: code
  q: |
    Функция `call_cost(minutes)` считает стоимость звонков за месяц: первые 100 минут бесплатны, каждая следующая — 2 рубля. Описание в коде есть, но `help(call_cost)` его не показывает. Исправьте функцию так, чтобы у неё появилась строка документации с этим описанием; считать функция должна так же.
  starter: |
    def call_cost(minutes):
        paid = minutes - 100
        """Вернуть стоимость звонков за месяц."""
        if paid < 0:
            return 0
        return paid * 2
  solution: |
    def call_cost(minutes):
        """Вернуть стоимость звонков за месяц."""
        paid = minutes - 100
        if paid < 0:
            return 0
        return paid * 2
  tests:
    asserts:
    - name: Строка документации
      code: |
        doc = call_cost.__doc__
        assert doc is not None and "стоимость звонков" in doc, "у call_cost нет строки документации с описанием: help(call_cost) его не покажет"
    - name: В пределах бесплатных
      code: |
        r = call_cost(100)
        assert r == 0, "call_cost(100) должна вернуть 0, а вернула " + repr(r)
    - name: Сверх бесплатных
      code: |
        r = call_cost(130)
        assert r == 60, "call_cost(130) должна вернуть 60, а вернула " + repr(r)
    - name: Мало минут
      code: |
        r = call_cost(20)
        assert r == 0, "call_cost(20) должна вернуть 0, а вернула " + repr(r)
  explain: |
    Строка документации — текст в тройных кавычках, который стоит первой инструкцией тела. Здесь первой было присваивание, поэтому строка в кавычках оставалась просто значением, которое никуда не сохранили: ошибки нет, но и описания нет. Достаточно переставить её на первое место в теле. Комментарий `#` вместо неё не подошёл бы: Python его не хранит, и `help` его не покажет.
- id: code-change-advice
  type: code
  q: |
    Программа читает температуры за несколько дней через пробел и даёт совет по средней температуре. Измените её: при средней 25 градусов и выше она должна выводить `жарко`, от 15 до 25 — `тепло`, ниже 15 — `холодно`. Менять нужно только одну функцию.
  starter: |
    def parse_temps(line):
        temps = []
        for word in line.split():
            temps.append(int(word))
        return temps

    def average(temps):
        return sum(temps) / len(temps)

    def advice(avg):
        if avg >= 15:
            return "тепло"
        return "холодно"

    temps = parse_temps(input())
    print(advice(average(temps)))
  solution: |
    def parse_temps(line):
        temps = []
        for word in line.split():
            temps.append(int(word))
        return temps

    def average(temps):
        return sum(temps) / len(temps)

    def advice(avg):
        if avg >= 25:
            return "жарко"
        if avg >= 15:
            return "тепло"
        return "холодно"

    temps = parse_temps(input())
    print(advice(average(temps)))
  tests:
    stdin: "20 30 28\n"
    io:
    - name: Жаркие дни
      stdin: "20 30 28\n"
      stdout: "жарко"
    - name: Тёплые дни
      stdin: "14 18 19\n"
      stdout: "тепло"
      hidden: true
    - name: Холодные дни
      stdin: "5 10\n"
      stdout: "холодно"
      hidden: true
    asserts:
    - name: Ровно 25
      code: |
        r = advice(25)
        assert r == "жарко", "advice(25) должна вернуть 'жарко', а вернула " + repr(r)
    - name: Чуть ниже 25
      code: |
        r = advice(24.9)
        assert r == "тепло", "advice(24.9) должна вернуть 'тепло', а вернула " + repr(r)
    - name: Ровно 15
      code: |
        r = advice(15)
        assert r == "тепло", "advice(15) должна вернуть 'тепло', а вернула " + repr(r)
    - name: Чуть ниже 15
      code: |
        r = advice(14.9)
        assert r == "холодно", "advice(14.9) должна вернуть 'холодно', а вернула " + repr(r)
    - name: Разбор строки не сломан
      code: |
        r = parse_temps("3 -2")
        assert r == [3, -2], "parse_temps('3 -2') должна вернуть [3, -2], а вернула " + repr(r)
  explain: |
    Правило совета знает только `advice`: `parse_temps` разбирает строку, `average` считает среднее — им всё равно, какие бывают советы. Порядок проверок важен: сначала `>= 25`, потом `>= 15` — иначе 30 градусов попадут в «тепло». Граница 25 и значение рядом с ней проверяют, что знак сравнения верный.
- id: hint-for-printer
  type: code
  q: |
    Программа читает температуры через пробел и выводит среднюю, например `Средняя: 21.0`. ИИ-ассистент подписал, что `show_summary` возвращает строку (`-> str`), но функция печатает текст сама и возвращает `None` — поэтому программа выводит лишнюю строку `None`. Переделайте функцию: она возвращает строку вида `Средняя: 21.0` и ничего не печатает, а печатает основная программа. Подпись `-> str` оставьте — теперь она станет правдой.
  starter: |
    def show_summary(temps: list) -> str:
        print(f"Средняя: {sum(temps) / len(temps)}")

    temps = []
    for word in input().split():
        temps.append(int(word))
    s = show_summary(temps)
    print(s)
  solution: |
    def show_summary(temps: list) -> str:
        return f"Средняя: {sum(temps) / len(temps)}"

    temps = []
    for word in input().split():
        temps.append(int(word))
    s = show_summary(temps)
    print(s)
  tests:
    stdin: "20 22\n"
    io:
    - name: Два дня
      stdin: "20 22\n"
      stdout: "Средняя: 21.0"
    - name: Один день
      stdin: "15\n"
      stdout: "Средняя: 15.0"
      hidden: true
    - name: Дробная средняя
      stdin: "10 11\n"
      stdout: "Средняя: 10.5"
      hidden: true
    asserts:
    - name: Функция возвращает строку
      code: |
        r = show_summary([20, 22])
        assert r == "Средняя: 21.0", "show_summary([20, 22]) должна вернуть 'Средняя: 21.0', а вернула " + repr(r)
    - name: Функция ничего не печатает
      code: |
        import io, contextlib
        shown = io.StringIO()
        with contextlib.redirect_stdout(shown):
            show_summary([1, 2])
        assert shown.getvalue() == "", "show_summary должна только возвращать строку, а она напечатала " + repr(shown.getvalue())
    - name: Подпись результата
      code: |
        assert show_summary.__annotations__.get("return") is str, "подпись результата -> str нужно оставить"
  explain: |
    Аннотации Python не проверяет, поэтому подпись `-> str` у функции, которая только печатает, обманывает читателя: напечатанный текст — не возвращаемое значение. Функция расчёта собирает строку и отдаёт её через `return`; что с ней делать — напечатать, записать в файл, сравнить в `assert` — решает тот, кто вызвал. Теперь `assert show_summary([20, 22]) == "Средняя: 21.0"` проверяет функцию одной строкой.
- id: code-change-input-out
  type: code
  q: |
    ИИ-ассистент написал функцию `receipt_total()`, которая сама читает строку цен и возвращает их сумму. Проверить её с `assert`, не подставив ввод, нельзя. Измените программу: `receipt_total(prices)` получает список цен — целых чисел — и возвращает их сумму, а ввод читает и превращает в числа основная программа. Вывод программы не должен измениться.
  starter: |
    def receipt_total():
        words = input().split()
        total = 0
        for w in words:
            total += int(w)
        return total

    print("Итого:", receipt_total())
  solution: |
    def receipt_total(prices):
        total = 0
        for p in prices:
            total += p
        return total

    words = input().split()
    prices = []
    for w in words:
        prices.append(int(w))
    print("Итого:", receipt_total(prices))
  tests:
    stdin: "89 45 320\n"
    io:
    - name: Три покупки
      stdin: "89 45 320\n"
      stdout: "Итого: 454"
    - name: Одна покупка
      stdin: "500\n"
      stdout: "Итого: 500"
      hidden: true
    - name: Пустой чек
      stdin: "\n"
      stdout: "Итого: 0"
      hidden: true
    asserts:
    - name: Сумма списка
      code: |
        r = receipt_total([89, 45])
        assert r == 134, "receipt_total([89, 45]) должна вернуть 134, а вернула " + repr(r)
    - name: Пустой список
      code: |
        r = receipt_total([])
        assert r == 0, "receipt_total([]) должна вернуть 0, а вернула " + repr(r)
    - name: Одна цена
      code: |
        r = receipt_total([1000])
        assert r == 1000, "receipt_total([1000]) должна вернуть 1000, а вернула " + repr(r)
  explain: |
    Функция, которая сама читает ввод, делает две работы и зависит не только от аргументов — её нельзя вызвать с придуманными числами. Когда список приходит аргументом, функция чистая: `assert receipt_total([89, 45]) == 134` проверяется одной строкой. Чтение и преобразование строк в числа остаются в основной программе, как и печать.
- id: code-fix-wiring
  type: code
  q: |
    Программа такси читает час начала поездки и строку поездки вида `Аэропорт 25` (последнее слово — километры) и печатает цену. Каждая функция работает так, как обещает её описание, — это проверено. Но программа печатает странные цены. Найдите ошибку и исправьте её, функции не меняйте.
  starter: |
    def trip_km(line: str) -> int:
        """Вернуть километры — последнее слово строки поездки."""
        return int(line.split()[-1])

    def fare(km: int) -> int:
        """Вернуть цену поездки: 100 рублей за посадку и 30 рублей за километр."""
        return 100 + km * 30

    def with_night(price: int, hour: int) -> float:
        """Вернуть цену с ночной надбавкой 20%, если поездка началась с 23 до 6 часов."""
        if hour >= 23 or hour < 6:
            return price * 1.2
        return price

    hour = int(input())
    line = input()
    price = with_night(hour, fare(trip_km(line)))
    print("К оплате:", price)
  solution: |
    def trip_km(line: str) -> int:
        """Вернуть километры — последнее слово строки поездки."""
        return int(line.split()[-1])

    def fare(km: int) -> int:
        """Вернуть цену поездки: 100 рублей за посадку и 30 рублей за километр."""
        return 100 + km * 30

    def with_night(price: int, hour: int) -> float:
        """Вернуть цену с ночной надбавкой 20%, если поездка началась с 23 до 6 часов."""
        if hour >= 23 or hour < 6:
            return price * 1.2
        return price

    hour = int(input())
    line = input()
    price = with_night(fare(trip_km(line)), hour)
    print("К оплате:", price)
  tests:
    stdin: "14\nАэропорт 25\n"
    io:
    - name: Дневная поездка
      stdin: "14\nАэропорт 25\n"
      stdout: "К оплате: 850"
    - name: Ночная поездка
      stdin: "23\nВокзал 10\n"
      stdout: "К оплате: 480.0"
      hidden: true
    - name: Под утро
      stdin: "5\nТеатральная площадь 2\n"
      stdout: "К оплате: 192.0"
      hidden: true
    - name: Уже утро
      stdin: "6\nТеатральная площадь 2\n"
      stdout: "К оплате: 160"
      hidden: true
    asserts:
    - name: Ночная надбавка не сломана
      code: |
        r = with_night(400, 23)
        assert r == 480.0, "with_night(400, 23) должна вернуть 480.0, а вернула " + repr(r)
    - name: Днём без надбавки
      code: |
        r = with_night(400, 12)
        assert r == 400, "with_night(400, 12) должна вернуть 400, а вернула " + repr(r)
  explain: |
    Позиционные аргументы сопоставляются с параметрами по порядку. В программе час стоит первым, поэтому `price` получает час, а `hour` — цену поездки: цена больше 23, и функция «видит» ночь. Аннотации не спасают — Python их не проверяет. Исправление в основной программе: `with_night(fare(trip_km(line)), hour)` или с именами: `with_night(price=fare(trip_km(line)), hour=hour)`. Проверки каждой функции этой ошибки не ловят: она в том, как части соединены.
- id: code-write-steps
  type: code
  q: |
    Шагомер записывает число шагов за каждый день, цель — `goal` шагов в день, обычно 10 000. Во вводе — шаги по дням через пробел (хотя бы один день). Программа выводит, в скольких днях цель выполнена и какая самая длинная серия таких дней подряд:
    ```input
    12000 10000 3000 11000 15000 10500
    ```
    ```
    Цель выполнена: 5 из 6 дн.
    Лучшая серия: 3 дн.
    ```
    Напишите программу по плану:

    - `parse_steps(line)` — получает строку ввода и возвращает список чисел;
    - `goal_days(steps, goal=10000)` — возвращает, в скольких днях шагов было не меньше `goal`;
    - `best_streak(steps, goal=10000)` — возвращает длину самой длинной серии таких дней подряд; если цель не выполнена ни разу — `0`. У этой функции должна быть строка документации.

    Функции только считают и возвращают, печатает основная программа.
  starter: |
    def parse_steps(line):
        ...

    def goal_days(steps, goal=10000):
        ...

    def best_streak(steps, goal=10000):
        ...

    # Основная программа: прочитать строку, вызвать функции, напечатать две строки
  solution: |
    def parse_steps(line):
        steps = []
        for word in line.split():
            steps.append(int(word))
        return steps

    def goal_days(steps, goal=10000):
        count = 0
        for s in steps:
            if s >= goal:
                count += 1
        return count

    def best_streak(steps, goal=10000):
        """Вернуть длину самой длинной серии дней подряд, когда цель выполнена.

        steps — шаги по дням, goal — цель на день. Если цель не выполнена ни разу, вернуть 0.
        Пример: best_streak([12000, 10000, 3000, 11000]) даёт 2.
        """
        best = 0
        run = 0
        for s in steps:
            if s >= goal:
                run += 1
                if run > best:
                    best = run
            else:
                run = 0
        return best

    steps = parse_steps(input())
    print("Цель выполнена:", goal_days(steps), "из", len(steps), "дн.")
    print("Лучшая серия:", best_streak(steps), "дн.")
  tests:
    stdin: "12000 10000 3000 11000 15000 10500\n"
    io:
    - name: Пример из условия
      stdin: "12000 10000 3000 11000 15000 10500\n"
      stdout: "Цель выполнена: 5 из 6 дн.\nЛучшая серия: 3 дн."
    - name: Цель не выполнена
      stdin: "9999\n"
      stdout: "Цель выполнена: 0 из 1 дн.\nЛучшая серия: 0 дн."
      hidden: true
    - name: Все дни ровно на цели
      stdin: "10000 10000 10000\n"
      stdout: "Цель выполнена: 3 из 3 дн.\nЛучшая серия: 3 дн."
      hidden: true
    - name: Серии по одному дню
      stdin: "5000 12000 4000 13000\n"
      stdout: "Цель выполнена: 2 из 4 дн.\nЛучшая серия: 1 дн."
      hidden: true
    asserts:
    - name: Разбор строки
      code: |
        r = parse_steps("5 10")
        assert r == [5, 10], "parse_steps('5 10') должна вернуть [5, 10], а вернула " + repr(r)
    - name: Граница цели
      code: |
        r = goal_days([10000, 9999])
        assert r == 1, "goal_days([10000, 9999]) должна вернуть 1, а вернула " + repr(r)
    - name: Своя цель
      code: |
        r = goal_days([5000, 6000], goal=5500)
        assert r == 1, "goal_days([5000, 6000], goal=5500) должна вернуть 1, а вернула " + repr(r)
    - name: Серия в начале
      code: |
        r = best_streak([12000, 10000, 3000, 11000])
        assert r == 2, "best_streak([12000, 10000, 3000, 11000]) должна вернуть 2, а вернула " + repr(r)
    - name: Серия в конце
      code: |
        r = best_streak([12000, 3000, 11000, 12000, 13000])
        assert r == 3, "best_streak([12000, 3000, 11000, 12000, 13000]) должна вернуть 3, а вернула " + repr(r)
    - name: Пустой список
      code: |
        r = best_streak([])
        assert r == 0, "best_streak([]) должна вернуть 0, а вернула " + repr(r)
    - name: Своя цель для серии
      code: |
        r = best_streak([1, 2, 3], goal=1)
        assert r == 3, "best_streak([1, 2, 3], goal=1) должна вернуть 3, а вернула " + repr(r)
    - name: Строка документации
      code: |
        doc = best_streak.__doc__
        assert doc is not None and doc.strip() != "", "у best_streak нет строки документации: текст в тройных кавычках должен стоять первой инструкцией тела"
  explain: |
    Каждая функция делает одну работу, и её можно проверить отдельно. В `best_streak` два накопителя: `run` — длина текущей серии, она обнуляется в день без цели, и `best` — самая длинная из уже просмотренных серий. Обновлять `best` нужно сразу при росте `run`, а не только при обрыве серии: иначе серия в конце списка не учтётся. Граница — «не меньше `goal`», поэтому ровно 10 000 шагов засчитываются.
- id: open-water-bill
  type: open
  q: |
    В строке ввода — расход воды по дням месяца в литрах, через пробел. Программа должна посчитать расход за месяц в кубометрах (1 м³ = 1000 л), сумму к оплате по тарифу 45 рублей за кубометр и напечатать квитанцию. Предложите разбиение на функции: имя каждой, что она принимает и что возвращает, и где программа печатает квитанцию. Запишите одну проверку с `assert` для любой из ваших функций.
  rubric:
  - несколько функций (например, две-три), у каждой одна работа и имя, которое говорит, что она делает или возвращает (например, month_liters, to_cubic_meters, water_cost)
  - для каждой функции сказано, что она принимает и что возвращает
  - печать квитанции — в основной программе, а не внутри функций расчёта
  - проверка с assert вызывает функцию с конкретными аргументами и сравнивает результат с верным ожидаемым значением (например, assert water_cost(2) == 90)
  wrong_answers:
  - одна функция, которая читает ввод, всё считает и печатает квитанцию
  - функции печатают промежуточные результаты вместо того, чтобы их возвращать
  - assert проверяет то, что функция напечатала
  followups:
  - Какую проверку с assert вы добавите для месяца, в котором воду не расходовали?
