title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: taxi-split
  type: single
  q: Программа читает километры и минуты поездки, считает цену по тарифу такси и печатает чек. Какое разбиение лучше всего следует правилам этой темы?
  options:
  - 'Функция `fare(km, minutes)` возвращает цену, а ввод и печать чека остаются в основной программе'
  - 'Функция `fare_and_print(km, minutes)` считает цену и печатает чек: всё, что касается цены, собрано в одном месте'
  - 'Функция `read_fare()` без параметров сама читает ввод и возвращает цену: вызывать её проще, аргументы не нужны'
  - 'Функция `main()` содержит весь код программы, а снизу стоит один её вызов: снаружи функций не остаётся ничего'
  answer: 0
  explain: 'У `fare` одна работа, всё нужное приходит в аргументах, и её легко проверить: `assert fare(10, 15) == …`. `fare_and_print` делает две работы и возвращает `None`. `read_fare` и `main` не проверить, не подставив ввод, — внутри они перемешивают чтение и расчёт.'
- id: format-change
  type: single
  q: |
    Программа считает средний балл по строкам журнала вида `"Иванов 5"`:
    ```python
    def mark_from_line(line):
        return int(line.split()[-1])

    def average(marks):
        total = 0
        for m in marks:
            total += m
        return total / len(marks)

    def verdict(avg):
        if avg >= 4.5:
            return "отлично"
        return "хорошо"
    ```
    Журнал теперь присылают в виде `"5 Иванов"`. Что нужно изменить?
  options:
  - 'Только `mark_from_line`'
  - '`mark_from_line` и `average`'
  - 'Только `average`'
  - 'Все три функции'
  answer: 0
  explain: 'Формат строки знает только `mark_from_line`: нужно брать первое слово, а не последнее. `average` получает уже готовые числа, а `verdict` — средний балл, им всё равно, откуда эти числа взялись.'
- id: boundary-catches
  type: multi
  q: |
    Функция `shipping(total)` должна возвращать 0, если сумма заказа не меньше 2000 рублей, иначе 300. Программист по ошибке написал в условии `total > 2000` вместо `total >= 2000`. Какие проверки эту ошибку поймают? Выберите все.
  options:
  - '`assert shipping(2000) == 0`'
  - '`assert shipping(1999) == 300`'
  - '`assert shipping(5000) == 0`'
  - '`assert shipping(0) == 300`'
  answer:
  - 0
  traps:
  - 1
  explain: 'Версии с `>` и `>=` расходятся только на самой границе, 2000: правильная даёт 0, ошибочная — 300. На 1999, 5000 и 0 обе версии отвечают одинаково. Значение рядом с границей всё равно нужно: оно ловит другую ошибку — например, порог 1999 вместо 2000.'
- id: docstring-not-first
  type: single
  q: |
    Что покажет `help(call_cost)`, кроме заголовков?
    ```python
    def call_cost(minutes):
        paid = minutes - 100
        """Вернуть стоимость звонков за месяц."""
        if paid < 0:
            return 0
        return paid * 2
    ```
  options:
  - 'Ничего: описания у функции нет'
  - 'Строку `Вернуть стоимость звонков за месяц.`'
  - 'Весь код тела функции'
  - 'Ничего: `help` упадёт с ошибкой, ведь тройные кавычки стоят посреди тела'
  answer: 0
  explain: 'Строка документации — текст в тройных кавычках, который стоит первой инструкцией тела. Здесь первая инструкция — присваивание, поэтому строка в кавычках — просто значение, которое никуда не сохранили. Ошибки нет, но и описания у функции нет.'
- id: docstring-vs-comment
  type: multi
  q: |
    Какие утверждения об этих функциях верны? Выберите все.
    ```python
    def a(x):
        # Вернуть удвоенное число.
        return x * 2

    def b(x):
        """Вернуть удвоенное число."""
        return x * 2
    ```
  options:
  - '`help(b)` покажет текст описания, а `help(a)` — нет'
  - 'Описания нет ни у одной: первая инструкция тела в обеих — `return`'
  - 'Если в `a` заменить комментарий той же фразой в тройных кавычках, `help(a)` покажет описание'
  - 'Комментарий из `a` Python хранит вместе с функцией, просто `help` его не выводит'
  answer:
  - 0
  - 2
  explain: 'Текст в тройных кавычках — строковое значение и полноценная инструкция; в `b` она первая в теле, поэтому это строка документации, и её покажет `help`. Комментарий `#` — не инструкция: Python его пропускает и не хранит, он остаётся только в файле для того, кто читает код. Поэтому достаточно заменить комментарий строкой в тройных кавычках — и у `a` появится описание.'
- id: docstring-edge-case
  type: single
  q: |
    Какое дополнение к строке документации полезнее всего тому, кто будет вызывать эту функцию?
    ```python
    def average(marks):
        """Вернуть средний балл по списку оценок."""
        return sum(marks) / len(marks)
    ```
  options:
  - 'Что для пустого списка функция упадёт с `ZeroDivisionError`'
  - 'Что сумма оценок делится на их количество, найденное через `len`'
  - 'Что результат функция отдаёт через `return`, а не печатает'
  - 'Что внутри используются встроенные функции `sum` и `len`'
  answer: 0
  explain: 'Крайний случай не виден по имени и первой строке: тот, кто вызывает функцию, должен знать, что пустой список передавать нельзя. Как считается среднее и какими функциями — это устройство, оно видно из кода. Что результат возвращается, а не печатается, уже сказано словом «Вернуть».'
- id: hint-not-checked
  type: single
  q: |
    Что выведет программа?
    ```python
    def minutes(seconds: int) -> int:
        return seconds / 60

    print(minutes(90))
    ```
  options:
  - '`1.5`'
  - '`1`'
  - 'Ошибку `TypeError`: функция обещала вернуть `int`'
  - '`2`'
  answer: 0
  explain: 'Аннотация `-> int` — подсказка для человека и инструментов. Python её не проверяет и ничего не округляет: `/` даёт дробное число, и функция возвращает `1.5`.'
- id: hint-for-printer
  type: single
  q: |
    Что выведет программа и как правильно подписать тип результата?
    ```python
    def show_summary(temps: list) -> str:
        print(f"Средняя: {sum(temps) / len(temps)}")

    s = show_summary([20, 22])
    print(s)
    ```
  options:
  - '`Средняя: 21.0`, потом `None`; результат стоит подписать `-> None`'
  - '`Средняя: 21.0`, потом `None`; подпись `-> str` верна: функция выводит строку'
  - '`Средняя: 21.0` дважды; подпись `-> str` верна: функция выдаёт строку'
  - 'Ошибку `TypeError`: функция обещала строку, а вернула `None`'
  answer: 0
  explain: 'Аннотации Python не проверяет, поэтому ошибки нет. `return` в функции нет — она возвращает `None`, и `print(s)` выводит `None`. Напечатанный текст — не возвращаемое значение, поэтому подпись `-> str` обманывает читателя; для функции, которая только печатает, пишут `-> None`.'
- id: not-from-decomposition
  type: single
  q: Программу такси разбили на чистые функции `trip_km(line)` — достать километры из строки поездки, `fare(km)` — цена по тарифу, `with_night(price, hour)` — ночная надбавка. Основная программа читает строки, вызывает функции и печатает чек. Какое утверждение из этого **не** следует?
  options:
  - 'Раз каждая функция прошла свои проверки с `assert`, вся программа заведомо считает верно'
  - 'Ночную надбавку можно проверить, вызвав `with_night` с придуманными числами, без строк поездок'
  - 'Функцию `fare` можно вызвать и в другой программе — например, в калькуляторе цены на сайте'
  - 'Если поменяется тариф за километр, `trip_km` и `with_night` трогать не придётся'
  answer: 0
  explain: 'Проверки каждой части не проверяют, как части соединены: основная программа может забыть вызвать `with_night` или передать ей не тот час. Остальное — то, что даёт декомпозиция: части проверяют отдельно, используют повторно, а тариф знает только `fare`.'
- id: open-water-bill
  type: open
  q: |
    В строке ввода — расход воды по дням месяца в литрах, через пробел. Программа должна посчитать расход за месяц в кубометрах (1 м³ = 1000 л), сумму к оплате по тарифу 45 рублей за кубометр и напечатать квитанцию. Предложите разбиение на функции: имя каждой, что она принимает и что возвращает, и где программа печатает квитанцию. Запишите одну проверку с `assert` для любой из ваших функций.
  rubric:
  - несколько функций (например, две-три), у каждой одна работа и имя, которое говорит, что она делает или возвращает (например, month_liters, to_cubic_meters, water_cost)
  - для каждой функции сказано, что она принимает и что возвращает
  - печать квитанции — в основной программе, а не внутри функций расчёта
  - проверка с assert вызывает функцию с конкретными аргументами и сравнивает результат с верным ожидаемым значением (например, assert water_cost(2) == 90)
  wrong_answers:
  - одна функция, которая читает ввод, всё считает и печатает квитанцию
  - функции печатают промежуточные результаты вместо того, чтобы их возвращать
  - assert проверяет то, что функция напечатала
  followups:
  - Какую проверку с assert вы добавите для месяца, в котором воду не расходовали?
