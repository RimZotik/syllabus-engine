title: Контрольная раздела «Функции»
pass: 0.85
minutes: 30
questions:
- id: s-def-below
  type: single
  q: |
    Что выведет программа?
    ```python
    def total_fee(days):
        return days * daily_fee()

    def daily_fee():
        return 50

    print(total_fee(3))
    ```
  options:
  - '`150`'
  - 'Ошибку `NameError`: `daily_fee` определена ниже, чем `total_fee`'
  - '`None`'
  - '`50`'
  answer: 0
  explain: 'Тело `total_fee` выполняется только при вызове, а к этому моменту обе инструкции `def` уже выполнены, и имя `daily_fee` есть. Важен порядок выполнения, а не порядок строк в файле.'
- id: s-print-in-chain
  type: single
  q: |
    Что выведет программа?
    ```python
    def to_celsius(f):
        print(round((f - 32) * 5 / 9, 1))

    def average(temps):
        total = 0
        for t in temps:
            total += t
        return total / len(temps)

    day = [to_celsius(50), to_celsius(68)]
    print(average(day))
    ```
  options:
  - '`10.0`, `20.0`, потом ошибку `TypeError` внутри `average`'
  - '`10.0`, `20.0`, `15.0` — каждое в своей строке'
  - 'Только `15.0`'
  - 'Ошибку `TypeError` ещё до того, как что-то напечатается'
  answer: 0
  explain: 'Список собирается из результатов вызовов: каждый вызов `to_celsius` печатает своё число, но возвращает `None`, и `day` — это `[None, None]`. Ошибка проявляется не там, где её сделали, а дальше по цепочке: `average` пытается прибавить `None` к числу. Поэтому функции расчёта возвращают результат, а печатает программа в одном месте.'
- id: s-all-passed-bug
  type: single
  q: |
    Функция должна отвечать, все ли сдали зачёт (оценка 3 и выше):
    ```python
    def all_passed(marks):
        for m in marks:
            if m >= 3:
                return True
        return False
    ```
    На каком вызове она даст неверный ответ?
  options:
  - '`all_passed([5, 2, 4])`'
  - '`all_passed([2, 2])`'
  - '`all_passed([4, 5])`'
  - '`all_passed([3])`'
  answer: 0
  explain: 'Первый же `return True` завершает вызов: на оценке 5 функция отвечает «да», не посмотрев на 2. Она проверяет «хотя бы один сдал», а не «все сдали». Для «все ли» ищут контрпример: `if m < 3: return False`, а `return True` — после цикла.'
- id: s-loop-var-local
  type: single
  q: |
    Что выведет программа?
    ```python
    p = 0

    def count_expensive(prices, limit=500):
        n = 0
        for p in prices:
            if p > limit:
                n += 1
        return n

    print(count_expensive([600, 200, 900]), count_expensive([600, 200, 900], limit=700), p)
    ```
  options:
  - '`2 1 0`'
  - '`2 1 900`'
  - '`2 2 0`'
  - 'Ошибку `UnboundLocalError`: `p` используется до присваивания'
  answer: 0
  explain: 'Переменная цикла `for` внутри функции — тоже локальное имя: цикл привязывает её заново на каждом шаге, а глобальный `p` остаётся 0. Ошибки нет: `p` получает значение от цикла раньше, чем его читают в `if`. В первом вызове порог по умолчанию, 500, — дороже него 600 и 900; во втором порог передан по имени, 700, — дороже только 900.'
- id: s-none-not-found
  type: single
  q: |
    Что выведет программа?
    ```python
    def find_index(names, target):
        for i in range(len(names)):
            if names[i] == target:
                return i

    pos = find_index(["Аня", "Борис"], "Аня")
    if pos:
        print("нашли на месте", pos)
    else:
        print("нет в списке")
    ```
  options:
  - '`нет в списке`'
  - '`нашли на месте 0`'
  - '`нашли на месте 1`'
  - '`нашли на месте None`'
  answer: 0
  explain: '«Аня» стоит первой, и функция возвращает индекс 0. Но 0 в условии ложен — так же, как `None`, который вернулся бы, если бы имени в списке не было. Поэтому программа путает «нашли на первом месте» с «не нашли». Проверять нужно `if pos is None:` — это отличает «результата нет» от нуля.'
- id: s-default-at-def
  type: single
  q: |
    Что выведет программа?
    ```python
    rate = 10

    def with_discount(price, percent=rate):
        return price - price * percent / 100

    rate = 50
    print(with_discount(1000), with_discount(1000, rate))
    ```
  options:
  - '`900.0 500.0`'
  - '`500.0 500.0`'
  - '`900.0 900.0`'
  - 'Ошибку: значением по умолчанию может быть только число, а не имя'
  answer: 0
  explain: 'Значение по умолчанию вычисляется один раз, когда выполняется `def`: в этот момент `rate` указывает на 10, и `percent` по умолчанию — 10. Новая привязка `rate = 50` его уже не меняет. Во втором вызове аргумент передали явно, а он вычисляется при вызове — тогда `rate` уже 50.'
- id: s-read-traceback
  type: multi
  q: |
    Программа таймера упала:
    ```
    Traceback (most recent call last):
      File "C:\work\timer.py", line 9, in <module>
        tick()
      File "C:\work\timer.py", line 5, in tick
        seconds -= 1
        ^^^^^^^
    UnboundLocalError: cannot access local variable 'seconds' where it is not associated with a value
    ```
    Какие выводы следуют из этого сообщения? Выберите все.
  options:
  - 'Ошибка произошла в строке 5, внутри функции `tick`'
  - 'В строке 9 функцию `tick` вызвали из программы'
  - 'Глобального имени `seconds` в программе нет'
  - 'Из-за строки `seconds -= 1` имя `seconds` локальное во всём теле `tick`'
  answer:
  - 0
  - 1
  - 3
  explain: 'Читаем снизу вверх: последняя пара «файл — строка» — где упали, пара выше — откуда пришли. `seconds -= 1` — присваивание, оно делает имя локальным, и прочитать его до присваивания нельзя. Есть ли глобальный `seconds`, сообщение не говорит: даже если есть, функция к нему не обращается.'
- id: s-new-list-local
  type: single
  q: |
    Что выведет программа?
    ```python
    def plan_week(tasks):
        tasks.append("спорт")
        tasks = ["отдых"]
        tasks.append("книга")
        return len(tasks)

    my_tasks = ["работа"]
    n = plan_week(my_tasks)
    print(n, my_tasks)
    ```
  options:
  - '`2 [''работа'', ''спорт'']`'
  - '`2 [''отдых'', ''книга'']`'
  - '`3 [''работа'', ''спорт'', ''книга'']`'
  - '`2 [''работа'']`'
  answer: 0
  explain: 'Первый `append` меняет сам список, на который указывает и `my_tasks`. Потом `tasks` привязывают к новому списку `["отдых"]`, и второй `append` меняет уже его — снаружи этого не видно. Функция возвращает длину нового списка — 2.'
- id: s-global-total
  type: multi
  q: |
    ИИ-ассистент разбил подсчёт чека на функции так:
    ```python
    discount_from = 400
    total = 0

    def add_line(line):
        global total
        total += int(line.split()[-1])

    def apply_discount():
        if total >= discount_from:
            return total * 0.95
        return total
    ```
    Какие утверждения верны? Выберите все.
  options:
  - 'Результат `apply_discount()` зависит от того, сколько раз до этого вызывали `add_line`'
  - 'В `apply_discount` тоже нужна строка `global total`, иначе вызов упадёт с `UnboundLocalError`'
  - 'Без строки `global total` в `add_line` программа работала бы так же'
  - 'Если `apply_discount` будет получать сумму параметром, её можно проверить одной строкой с `assert`'
  answer:
  - 0
  - 3
  explain: '`apply_discount` читает глобальное `total`, которое меняет `add_line`, поэтому её ответ зависит от истории вызовов, а проверка с `assert` — от того, что программа сделала до неё. Читать глобальное имя можно и без `global`: в `apply_discount` ему ничего не присваивают. А в `add_line` строка `total += …` — присваивание, и без `global` имя стало бы локальным — `UnboundLocalError`. Сумма в параметре делает `apply_discount` чистой: `assert apply_discount(400) == 380` верно при любом запуске.'
- id: s-sum-shadowed
  type: single
  q: |
    Что произойдёт при запуске?
    ```python
    sum = 0
    for p in [120, 80]:
        sum += p

    def average(prices):
        return sum(prices) / len(prices)

    print(average([10, 20]))
    ```
  options:
  - "Ошибка `TypeError: 'int' object is not callable`"
  - 'Выведется `15.0`'
  - 'Ошибка `UnboundLocalError`'
  - 'Выведется `100.0`'
  answer: 0
  explain: 'Глобальное `sum = 0` занимает имя встроенной функции до конца программы. В `average` имени `sum` не присваивают, поэтому Python находит глобальное — число 200, а число вызвать нельзя.'
- id: s-workflow
  type: single
  q: |
    Парковка до 15 минут включительно бесплатна, дольше — 100 рублей. Программист написал функцию, запустил `parking(15)`, увидел `100` и записал под функцией проверку `assert parking(15) == 100`.
    ```python
    def parking(minutes):
        if minutes >= 15:
            return 100
        return 0
    ```
    Что не так?
  options:
  - 'Ожидание в проверке взято из вывода кода, а не из правила'
  - 'Ничего: проверка проходит, значит, функция считает по правилу парковки'
  - 'Проверка на 15 минутах бесполезна: на самой границе `>` и `>=` отвечают одинаково'
  - 'Проверку стоило поставить на 30 минутах: на самой границе ответ спорный и ничего не докажет'
  answer: 0
  explain: 'Ожидаемое значение в проверке берут из правила, а не из того, что выдал код, — поэтому проверки удобно придумывать по плану, ещё до кода. По правилу `parking(15)` должна вернуть 0, а функция с `>=` возвращает 100. Граница — как раз то место, где `>` и `>=` расходятся, и проверка на 15 минутах поймала бы ошибку, будь ожидание взято из правила. На 30 минутах обе версии отвечают одинаково.'
- id: s-docstring-review
  type: single
  q: |
    ИИ-ассистент снабдил функцию описанием. Какая его часть лишняя по советам раздела?
    ```python
    def bmi(weight, height):
        """Вернуть индекс массы тела.

        weight — вес в килограммах, height — рост в метрах.
        Сначала height возводится в квадрат, потом weight делится на результат.
        Пример: bmi(70, 1.75) даёт примерно 22.9.
        """
        return weight / height ** 2
    ```
  options:
  - 'Строка о порядке вычислений'
  - 'Пример вызова с результатом'
  - 'Описание параметров с единицами измерения'
  - 'Первая строка в форме команды'
  answer: 0
  explain: 'Строка документации говорит, *что* функция делает: результат, параметры, пример. *Как* она это делает, видно из кода.'
- id: s-hints-ignored
  type: single
  q: |
    Что выведет программа?
    ```python
    def repeat(word: str, times=2) -> str:
        return word * times

    print(repeat(3), repeat("ой"))
    ```
  options:
  - '`6 ойой`'
  - '`33 ойой`'
  - 'Ошибку `TypeError`: первым аргументом ожидалась строка'
  - '`3 ой`'
  answer: 0
  explain: 'В обоих вызовах `times` берёт значение по умолчанию, 2. Аннотации Python не проверяет и ничего не преобразует: в первый вызов пришло число 3, и `*` его умножил — 6. Строку `33` дал бы вызов `repeat("3")`.'
- id: s-open-tickets
  type: open
  q: |
    В кинотеатре детям до 7 лет билет бесплатный, с 7 до 17 лет включительно — 250 рублей, остальным — 400. Функция `ticket_price(age)` возвращает цену билета. Напишите проверки с `assert`, которые поймают ошибку на единицу на каждой границе — например, `<` вместо `<=` или неверный порог. Объясните, почему вы выбрали именно эти возрасты.
  rubric:
  - проверки на обеих границах, в каждой — последний возраст одной цены и первый возраст следующей с верными ценами — ticket_price(6) == 0, ticket_price(7) == 250, ticket_price(17) == 250, ticket_price(18) == 400
  - объяснение — ошибка в знаке сравнения или в пороге меняет ответ только на пороговом возрасте или рядом с ним, а на возрастах далеко от границы (например, 10 или 30) правильная и ошибочная версии отвечают одинаково; можно упомянуть, что значения внутри диапазонов тоже полезно проверить
  wrong_answers:
  - проверки только на возрастах внутри диапазонов, например 3, 10 и 30
  - ожидаемая цена для 17 лет — 400, а для 7 лет — 0
  - достаточно одной проверки на каждую цену, возраст не важен
  followups:
  - Какая из ваших проверок упадёт, если в функции написано `age < 17` вместо `age <= 17`?
