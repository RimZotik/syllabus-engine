  solution: |
    def student_average(line):
        words = line.split()
        total = 0
        for i in range(1, len(words)):
            total += int(words[i])
        return total / (len(words) - 1)

    def best_student(lines):
        best_name = ""
        best_avg = 0
        for line in lines:
            avg = student_average(line)
            if avg > best_avg:
                best_avg = avg
                best_name = line.split()[0]
        return best_name

    lines = []
    line = input()
    while line != "":
        lines.append(line)
        line = input()
    print("Лучший средний балл:", best_student(lines))
  tests:
    stdin: "Иванов 5 3 4\nПетрова 4 5 5\nСидоров 3 5\n\n"
    io:
    - name: Пример из условия
      stdin: "Иванов 5 3 4\nПетрова 4 5 5\nСидоров 3 5\n\n"
      stdout: "Лучший средний балл: Петрова"
    - name: Лучший — последний
      stdin: "Аксёнов 3 3\nБелова 2 5 5 5\n\n"
      stdout: "Лучший средний балл: Белова"
      hidden: true
    - name: Равные средние
      stdin: "Орлова 4 5\nЗайцев 5 4\n\n"
      stdout: "Лучший средний балл: Орлова"
      hidden: true
    - name: Один ученик
      stdin: "Ким 3\n\n"
      stdout: "Лучший средний балл: Ким"
      hidden: true
    asserts:
    - name: Средний балл
      code: |
        r = student_average("Иванов 5 3 4")
        assert r == 4.0, "student_average('Иванов 5 3 4') должна вернуть 4.0, а вернула " + repr(r)
    - name: Одна оценка
      code: |
        r = student_average("Ким 3")
        assert r == 3.0, "student_average('Ким 3') должна вернуть 3.0, а вернула " + repr(r)
    - name: Лучший ученик
      code: |
        r = best_student(["Аксёнов 3 3", "Белова 2 5 5 5"])
        assert r == "Белова", "best_student(['Аксёнов 3 3', 'Белова 2 5 5 5']) должна вернуть 'Белова', а вернула " + repr(r)
    - name: Повторный вызов — тот же ответ
      code: |
        a = best_student(["Орлова 4 5", "Зайцев 5 4"])
        b = best_student(["Орлова 4 5", "Зайцев 5 4"])
        assert a == "Орлова" and b == "Орлова", "best_student(['Орлова 4 5', 'Зайцев 5 4']) должна оба раза вернуть 'Орлова', а вернула " + repr(a) + " и " + repr(b)
    - name: Предыдущий вызов не влияет
      code: |
        best_student(["Ким 5"])
        r = best_student(["Аксёнов 3 3"])
        assert r == "Аксёнов", "после best_student(['Ким 5']) вызов best_student(['Аксёнов 3 3']) должен вернуть 'Аксёнов', а вернул " + repr(r)
    - name: Пустой журнал
      code: |
        r = best_student([])
        assert r == "", "best_student([]) должна вернуть пустую строку, а вернула " + repr(r)
  explain: |
    Ошибок две. В `update_best` именам `best_avg` и `best_name` присваивают, поэтому они локальные во всём теле, и чтение `best_avg` в условии падает с `UnboundLocalError`. Лекарство — не `global`, а чистая функция: лучший результат копится в её локальных именах и возвращается через `return`, поэтому каждый вызов начинает с чистого листа. Вторая ошибка видна только после первой: `return` в `student_average` стоит в теле цикла и делит одну первую оценку на их количество — его место после цикла. Строгое `>` оставляет при равенстве того, кто выше в журнале.
- id: s-open-tickets
  type: open
  q: |
    В кинотеатре детям до 7 лет билет бесплатный, с 7 до 17 лет включительно — 250 рублей, остальным — 400. Функция `ticket_price(age)` возвращает цену билета. Напишите проверки с `assert`, которые поймают ошибку на единицу на каждой границе — например, `<` вместо `<=` или неверный порог. Объясните, почему вы выбрали именно эти возрасты.
  rubric:
  - проверки на обеих границах, в каждой — последний возраст одной цены и первый возраст следующей с верными ценами — ticket_price(6) == 0, ticket_price(7) == 250, ticket_price(17) == 250, ticket_price(18) == 400
  - объяснение — ошибка в знаке сравнения или в пороге меняет ответ только на пороговом возрасте или рядом с ним, а на возрастах далеко от границы (например, 10 или 30) правильная и ошибочная версии отвечают одинаково; можно упомянуть, что значения внутри диапазонов тоже полезно проверить
  wrong_answers:
  - проверки только на возрастах внутри диапазонов, например 3, 10 и 30
  - ожидаемая цена для 17 лет — 400, а для 7 лет — 0
  - достаточно одной проверки на каждую цену, возраст не важен
  followups:
  - Какая из ваших проверок упадёт, если в функции написано `age < 17` вместо `age <= 17`?
