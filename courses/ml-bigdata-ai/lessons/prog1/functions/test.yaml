title: Контрольная раздела «Функции»
pass: 0.85
minutes: 50
questions:
- id: s-print-in-chain
  type: single
  q: |
    Что выведет программа?
    ```python
    def to_celsius(f):
        print(round((f - 32) * 5 / 9, 1))

    def average(temps):
        total = 0
        for t in temps:
            total += t
        return total / len(temps)

    day = [to_celsius(50), to_celsius(68)]
    print(average(day))
    ```
  options:
  - '`10.0`, `20.0`, потом ошибку `TypeError` внутри `average`'
  - '`10.0`, `20.0`, `15.0` — каждое в своей строке'
  - 'Только `15.0`'
  - 'Ошибку `TypeError` ещё до того, как что-то напечатается'
  answer: 0
  explain: 'Список собирается из результатов вызовов: каждый вызов `to_celsius` печатает своё число, но возвращает `None`, и `day` — это `[None, None]`. Ошибка проявляется не там, где её сделали, а дальше по цепочке: `average` пытается прибавить `None` к числу. Поэтому функции расчёта возвращают результат, а печатает программа в одном месте.'
- id: s-default-at-def
  type: single
  q: |
    Что выведет программа?
    ```python
    rate = 10

    def with_discount(price, percent=rate):
        return price - price * percent / 100

    rate = 50
    print(with_discount(1000), with_discount(1000, rate))
    ```
  options:
  - '`900.0 500.0`'
  - '`500.0 500.0`'
  - '`900.0 900.0`'
  - 'Ошибку: значением по умолчанию может быть только число, а не имя'
  answer: 0
  explain: 'Значение по умолчанию вычисляется один раз, когда выполняется `def`: в этот момент `rate` указывает на 10, и `percent` по умолчанию — 10. Новая привязка `rate = 50` его уже не меняет. Во втором вызове аргумент передали явно, а он вычисляется при вызове — тогда `rate` уже 50.'
- id: s-read-traceback
  type: multi
  q: |
    Программа таймера упала:
    ```
    Traceback (most recent call last):
      File "C:\work\timer.py", line 9, in <module>
        tick()
      File "C:\work\timer.py", line 5, in tick
        seconds -= 1
        ^^^^^^^
    UnboundLocalError: cannot access local variable 'seconds' where it is not associated with a value
    ```
    Какие выводы следуют из этого сообщения? Выберите все.
  options:
  - 'Ошибка произошла в строке 5, внутри функции `tick`'
  - 'В строке 9 функцию `tick` вызвали из программы'
  - 'Глобального имени `seconds` в программе нет'
  - 'Из-за строки `seconds -= 1` имя `seconds` локальное во всём теле `tick`'
  answer:
  - 0
  - 1
  - 3
  explain: 'Читаем снизу вверх: последняя пара «файл — строка» — где упали, пара выше — откуда пришли. `seconds -= 1` — присваивание, оно делает имя локальным, и прочитать его до присваивания нельзя. Есть ли глобальный `seconds`, сообщение не говорит: даже если есть, функция к нему не обращается.'
- id: s-new-list-local
  type: single
  q: |
    Что выведет программа?
    ```python
    def plan_week(tasks):
        tasks.append("спорт")
        tasks = ["отдых"]
        tasks.append("книга")
        return len(tasks)

    my_tasks = ["работа"]
    n = plan_week(my_tasks)
    print(n, my_tasks)
    ```
  options:
  - '`2 [''работа'', ''спорт'']`'
  - '`2 [''отдых'', ''книга'']`'
  - '`3 [''работа'', ''спорт'', ''книга'']`'
  - '`2 [''работа'']`'
  answer: 0
  explain: 'Первый `append` меняет сам список, на который указывает и `my_tasks`. Потом `tasks` привязывают к новому списку `["отдых"]`, и второй `append` меняет уже его — снаружи этого не видно. Функция возвращает длину нового списка — 2.'
- id: s-none-not-found
  type: code
  q: |
    **Исправьте программу: для имени, которое стоит в очереди первым, она выводит `Нет в списке`. Функцию `find_index` не меняйте.**

    Ввод: в первой строке — очередь, имена через пробел, во второй — одно имя. Выведите `Индекс: N`, где `N` — индекс первого такого имени (с нуля), или `Нет в списке`, если имени нет. `find_index` в этом случае возвращает `None`.

    Пример 1
    ```input
    Аня Борис Вера
    Борис
    ```
    ```output
    Индекс: 1
    ```

    Пример 2
    ```input
    Аня Борис Вера
    Аня
    ```
    ```output
    Индекс: 0
    ```
  starter: |
    def find_index(names, target):
        for i in range(len(names)):
            if names[i] == target:
                return i

    names = input().split()
    target = input()
    pos = find_index(names, target)
    if pos:
        print("Индекс:", pos)
    else:
        print("Нет в списке")
  solution: |
    def find_index(names, target):
        for i in range(len(names)):
            if names[i] == target:
                return i

    names = input().split()
    target = input()
    pos = find_index(names, target)
    if pos is None:
        print("Нет в списке")
    else:
        print("Индекс:", pos)
  tests:
    stdin: "Аня Борис\nАня\n"
    io:
    - name: Пример из условия
      stdin: "Аня Борис Вера\nБорис\n"
      stdout: "Индекс: 1"
    - name: Первая в очереди
      stdin: "Аня Борис Вера\nАня\n"
      stdout: "Индекс: 0"
      hidden: true
    - name: Нет в очереди
      stdin: "Аня Борис Вера\nГоша\n"
      stdout: "Нет в списке"
      hidden: true
    - name: Имя встречается дважды
      stdin: "Вера Аня Вера\nВера\n"
      stdout: "Индекс: 0"
      hidden: true
    asserts:
    - name: Функция не изменилась
      code: |
        r = find_index(["Аня", "Борис"], "Гоша")
        assert r is None, "find_index для имени, которого нет, должна вернуть None, а вернула " + repr(r)
        r = find_index(["Аня", "Борис"], "Аня")
        assert r == 0, "find_index(['Аня', 'Борис'], 'Аня') должна вернуть 0, а вернула " + repr(r)
  explain: |
    Функция верна: для первого в очереди она возвращает индекс 0. Но в условии `if pos:` число 0 ложно — так же, как `None`, поэтому программа путает «нашли на первом месте» с «не нашли». «Результата нет» отличают от нуля проверкой `pos is None`. Ошибка не в функции, а в том, как программа читает её ответ.
- id: s-all-passed-bug
  type: code
  q: |
    **Исправьте функцию `all_passed(marks)`: она должна возвращать `True`, только если у всех оценка 3 и выше.**

    Если хотя бы одна оценка ниже 3, функция возвращает `False`; для пустого списка — `True`. Сейчас `all_passed([5, 2, 4])` возвращает `True`. В примерах «Ввод» — вызов функции, «Вывод» — значение, которое она возвращает.

    Пример 1
    ```input
    all_passed([5, 2, 4])
    ```
    ```output
    False
    ```

    Пример 2
    ```input
    all_passed([4, 5, 3])
    ```
    ```output
    True
    ```
  starter: |
    def all_passed(marks):
        for m in marks:
            if m >= 3:
                return True
        return False
  solution: |
    def all_passed(marks):
        for m in marks:
            if m < 3:
                return False
        return True
  tests:
    asserts:
    - name: Двойка в середине
      code: |
        r = all_passed([5, 2, 4])
        assert r is False, "all_passed([5, 2, 4]) должна вернуть False, а вернула " + repr(r)
    - name: Все сдали
      code: |
        r = all_passed([4, 5, 3])
        assert r is True, "all_passed([4, 5, 3]) должна вернуть True, а вернула " + repr(r)
    - name: Двойка в конце
      code: |
        r = all_passed([5, 4, 2])
        assert r is False, "all_passed([5, 4, 2]) должна вернуть False, а вернула " + repr(r)
    - name: Двойка в начале
      code: |
        r = all_passed([2, 5])
        assert r is False, "all_passed([2, 5]) должна вернуть False, а вернула " + repr(r)
    - name: Ровно тройка
      code: |
        r = all_passed([3])
        assert r is True, "all_passed([3]) должна вернуть True, а вернула " + repr(r)
    - name: Пустой список
      code: |
        r = all_passed([])
        assert r is True, "all_passed([]) должна вернуть True, а вернула " + repr(r)
  explain: |
    Первый же `return True` завершал вызов: на оценке 5 функция отвечала «да», не посмотрев на двойку дальше. Так проверяют «хотя бы один сдал». Для «все ли» ищут контрпример: встретилась оценка ниже 3 — сразу `return False`, а `return True` стоит после цикла, когда просмотрены все оценки. Для пустого списка цикл не выполнится ни разу, и функция вернёт `True`.
- id: s-sum-shadowed
  type: code
  q: |
    **Исправьте программу так, чтобы встроенная функция `sum` снова работала: сейчас программа падает с `TypeError: 'int' object is not callable`.**

    Программа читает цены — целые числа через пробел (хотя бы одну) — и выводит их сумму и среднюю. `sum` должна работать и в функции `average`, и после программы.

    Пример 1
    ```input
    120 80
    ```
    ```output
    Сумма: 200
    Средняя: 100.0
    ```
  starter: |
    prices = []
    for word in input().split():
        prices.append(int(word))

    sum = 0
    for p in prices:
        sum += p
    print("Сумма:", sum)

    def average(prices):
        return sum(prices) / len(prices)

    print("Средняя:", average(prices))
  solution: |
    prices = []
    for word in input().split():
        prices.append(int(word))

    total = 0
    for p in prices:
        total += p
    print("Сумма:", total)

    def average(prices):
        return sum(prices) / len(prices)

    print("Средняя:", average(prices))
  tests:
    stdin: "120 80\n"
    io:
    - name: Пример из условия
      stdin: "120 80\n"
      stdout: "Сумма: 200\nСредняя: 100.0"
    - name: Три цены
      stdin: "10 20 30\n"
      stdout: "Сумма: 60\nСредняя: 20.0"
      hidden: true
    - name: Одна цена
      stdin: "7\n"
      stdout: "Сумма: 7\nСредняя: 7.0"
      hidden: true
    asserts:
    - name: Средняя
      code: |
        r = average([10, 20])
        assert r == 15.0, "average([10, 20]) должна вернуть 15.0, а вернула " + repr(r)
    - name: Встроенная sum работает
      code: |
        assert callable(sum), "после программы имя sum должно указывать на встроенную функцию, а оно указывает на " + repr(sum)
        r = sum([1, 2])
        assert r == 3, "после программы sum([1, 2]) должна давать 3, а дала " + repr(r)
  explain: |
    Глобальное `sum = 0` занимает имя встроенной функции до конца программы. В `average` имени `sum` ничего не присваивают, поэтому Python ищет его по порядку: среди локальных нет, среди глобальных есть — это число, а число вызвать нельзя. Встроенные имена Python смотрит последними. Лекарство — своё имя для накопителя, например `total`.
- id: s-code-write-from-doc
  type: code
  q: |
    **Напишите тело функции `rental_cost` так, чтобы она делала то, что обещает её строка документации.**

    Заголовок и описание функции — в редакторе, их не меняйте. В примерах «Ввод» — вызов функции, «Вывод» — значение, которое она возвращает.

    Пример 1
    ```input
    rental_cost(10)
    ```
    ```output
    130
    ```

    Пример 2
    ```input
    rental_cost(70)
    ```
    ```output
    570
    ```
  starter: |
    def rental_cost(minutes: int, start: int = 50, per_min: int = 8) -> int:
        """Вернуть стоимость поездки на самокате в рублях.

        minutes — длина поездки в целых минутах. Поездка 0 минут бесплатна:
        самокат не поехал. Иначе платят start рублей за старт и per_min рублей
        за каждую минуту; минуты сверх 60 стоят вдвое дешевле — per_min // 2.
        Пример: rental_cost(10) даёт 130, rental_cost(70) даёт 570.
        """
        ...
  solution: |
    def rental_cost(minutes: int, start: int = 50, per_min: int = 8) -> int:
        """Вернуть стоимость поездки на самокате в рублях.

        minutes — длина поездки в целых минутах. Поездка 0 минут бесплатна:
        самокат не поехал. Иначе платят start рублей за старт и per_min рублей
        за каждую минуту; минуты сверх 60 стоят вдвое дешевле — per_min // 2.
        Пример: rental_cost(10) даёт 130, rental_cost(70) даёт 570.
        """
        if minutes == 0:
            return 0
        if minutes <= 60:
            return start + minutes * per_min
        return start + 60 * per_min + (minutes - 60) * (per_min // 2)
  tests:
    asserts:
    - name: Пример из описания
      code: |
        r = rental_cost(10)
        assert r == 130, "rental_cost(10) должна вернуть 130, а вернула " + repr(r)
    - name: Второй пример из описания
      code: |
        r = rental_cost(70)
        assert r == 570, "rental_cost(70) должна вернуть 570, а вернула " + repr(r)
    - name: Самокат не поехал
      code: |
        r = rental_cost(0)
        assert r == 0, "rental_cost(0) должна вернуть 0, а вернула " + repr(r)
    - name: Одна минута
      code: |
        r = rental_cost(1)
        assert r == 58, "rental_cost(1) должна вернуть 58, а вернула " + repr(r)
    - name: Ровно час
      code: |
        r = rental_cost(60)
        assert r == 530, "rental_cost(60) должна вернуть 530, а вернула " + repr(r)
    - name: Минута сверх часа
      code: |
        r = rental_cost(61)
        assert r == 534, "rental_cost(61) должна вернуть 534, а вернула " + repr(r)
    - name: Своя цена минуты
      code: |
        r = rental_cost(10, per_min=5)
        assert r == 100, "rental_cost(10, per_min=5) должна вернуть 100, а вернула " + repr(r)
    - name: Без платы за старт
      code: |
        r = rental_cost(10, start=0)
        assert r == 80, "rental_cost(10, start=0) должна вернуть 80, а вернула " + repr(r)
    - name: Все аргументы, долгая поездка
      code: |
        r = rental_cost(61, 0, 10)
        assert r == 605, "rental_cost(61, 0, 10) должна вернуть 605, а вернула " + repr(r)
  explain: |
    Описание — договор: по нему видно и крайние случаи (0 минут), и границу (ровно 60 минут — ещё по полной цене). Три случая — три `return`: бесплатно, не дольше часа, дольше часа. Во втором часе первые 60 минут всё равно стоят полную цену, дешевле только минуты сверх них. Параметры `start` и `per_min` нужно брать из аргументов, а не писать 50 и 8 числами: иначе вызовы со своими ценами вернут не то.
- id: s-code-extend-discount
  type: code
  q: |
    **Доработайте программу: у `apply_discount` появляются параметры `threshold=400` и `percent=5`, а с клубной картой скидка — 10% от 200 рублей.**

    Ввод: в первой строке — `да` или `нет` (есть ли клубная карта), дальше строки чека `название цена`, в конце пустая строка. Без карты скидка прежняя — 5% от суммы 400 рублей, и вызов `apply_discount` с одним аргументом работает как раньше. Остальные функции не меняйте.

    Пример 1
    ```input
    нет
    молоко 89
    хлеб 45
    сыр российский 320

    ```
    ```output
    Итого: 431.3
    ```

    Пример 2
    ```input
    да
    молоко 89
    хлеб 45
    сыр российский 320

    ```
    ```output
    Итого: 408.6
    ```
  starter: |
    def item_price(line):
        return int(line.split()[-1])

    def receipt_sum(lines):
        total = 0
        for line in lines:
            total += item_price(line)
        return total

    def apply_discount(total):
        if total >= 400:
            return total - total * 5 / 100
        return total

    card = input()
    lines = []
    line = input()
    while line != "":
        lines.append(line)
        line = input()
    print("Итого:", apply_discount(receipt_sum(lines)))
  solution: |
    def item_price(line):
        return int(line.split()[-1])

    def receipt_sum(lines):
        total = 0
        for line in lines:
            total += item_price(line)
        return total

    def apply_discount(total, threshold=400, percent=5):
        if total >= threshold:
            return total - total * percent / 100
        return total

    card = input()
    lines = []
    line = input()
    while line != "":
        lines.append(line)
        line = input()
    total = receipt_sum(lines)
    if card == "да":
        print("Итого:", apply_discount(total, threshold=200, percent=10))
    else:
        print("Итого:", apply_discount(total))
  tests:
    stdin: "нет\nхлеб 45\n\n"
    io:
    - name: Без карты
      stdin: "нет\nмолоко 89\nхлеб 45\nсыр российский 320\n\n"
      stdout: "Итого: 431.3"
    - name: С картой
      stdin: "да\nмолоко 89\nхлеб 45\nсыр российский 320\n\n"
      stdout: "Итого: 408.6"
      hidden: true
    - name: С картой, ровно 200
      stdin: "да\nкофе в зёрнах 200\n\n"
      stdout: "Итого: 180.0"
      hidden: true
    - name: С картой, меньше 200
      stdin: "да\nхлеб 45\nчай 150\n\n"
      stdout: "Итого: 195"
      hidden: true
    - name: Без карты, 200
      stdin: "нет\nкофе в зёрнах 200\n\n"
      stdout: "Итого: 200"
      hidden: true
    - name: Пустой чек
      stdin: "да\n\n"
      stdout: "Итого: 0"
      hidden: true
    asserts:
    - name: Порог по умолчанию
      code: |
        r = apply_discount(400)
        assert r == 380.0, "apply_discount(400) должна вернуть 380.0, а вернула " + repr(r)
    - name: Ниже порога по умолчанию
      code: |
        r = apply_discount(399)
        assert r == 399, "apply_discount(399) должна вернуть 399, а вернула " + repr(r)
    - name: Свой порог и процент
      code: |
        r = apply_discount(200, threshold=200, percent=10)
        assert r == 180.0, "apply_discount(200, threshold=200, percent=10) должна вернуть 180.0, а вернула " + repr(r)
    - name: Только свой процент
      code: |
        r = apply_discount(1000, percent=20)
        assert r == 800.0, "apply_discount(1000, percent=20) должна вернуть 800.0, а вернула " + repr(r)
  explain: |
    Числа 400 и 5 становятся параметрами со значениями по умолчанию — поэтому старые вызовы с одним аргументом не меняются. Решение о карте — дело основной программы: она читает ввод и выбирает, с какими аргументами вызвать `apply_discount`. `item_price` и `receipt_sum` про скидку ничего не знают и остаются прежними. Именованные аргументы `threshold=200, percent=10` сразу говорят читателю, что означает каждое число.
- id: s-code-fix-best-student
  type: code
  q: |
    **Исправьте программу электронного журнала от ИИ-ассистента: она падает. Вместо `update_best` напишите чистую функцию `best_student(lines)`.**

    Ввод — строки `фамилия оценка оценка …` (хотя бы одна оценка), в конце пустая строка. Выведите `Лучший средний балл: Фамилия` — ученика с самым высоким средним; при равенстве — того, кто выше в журнале.

    - `student_average(line)` возвращает средний балл из строки журнала;
    - `best_student(lines)` получает список строк журнала и возвращает фамилию лучшего ученика, для пустого списка — `""`; глобальных имён не меняет.

    Пример 1
    ```input
    Иванов 5 3 4
    Петрова 4 5 5
    Сидоров 3 5

    ```
    ```output
    Лучший средний балл: Петрова
    ```
  starter: |
