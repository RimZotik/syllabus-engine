  explain: 'Разбор уже сделан: `days` — «дата → строки дня», `bad` — остальное. Дописать — значит для каждой даты открыть свой файл в режиме «w» и записать строки с `\n`: `rstrip` его убрал. Запись одного файла повторяется для дней и для `log-bad.txt` — удобно вынести её в функцию. Даты ISO 8601 одного вида сортируются как строки, поэтому `sorted(days)` даёт хронологический порядок.'
- id: s-open-time-format
  type: open
  q: 'Серверы в Москве (UTC+3) и Новосибирске (UTC+7) пишут время в журнал по своим часам в виде «05.06.2024 14:30». Журналы сливают в один файл и сортируют строки как текст. Объясните, какие две проблемы у такой записи времени, и как его нужно записывать.'
  rubric:
  - 'Порядок: строки «ДД.ММ.ГГГГ» сравниваются посимвольно, а первым идёт день — сортировка как текста не хронологическая'
  - 'Пояс: время без смещения — наивное; «14:30» в Москве и в Новосибирске — разные моменты, и по записи их не различить и не упорядочить'
  - 'Решение: ISO 8601 с указанием смещения, лучше всё в UTC (например, 2024-06-05T11:30:00+00:00) — при одном виде и одном смещении строки сортируются верно, момент однозначен'
  wrong_answers:
  - Достаточно перевести даты в формат ГГГГ-ММ-ДД, пояс не важен
  - Нужно хранить время по московским часам без указания пояса — так принято в России
  followups:
  - Почему строки ISO 8601 с разными смещениями нельзя сортировать как текст?
