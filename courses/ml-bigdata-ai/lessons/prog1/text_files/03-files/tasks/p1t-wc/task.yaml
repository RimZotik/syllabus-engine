id: p1t-wc
title: Строки, слова, символы
sandbox: python-browser
difficulty: 1
statement: |
  **Посчитайте в файле `text.txt` строки, слова и символы и выведите `строк: L, слов: W, символов: C`.**

  Строки — строки файла, в том числе пустые; последняя строка может быть без перевода строки. Слова — куски между пробельными символами. Символы — все символы файла, включая переводы строк. В примере 1 после «Конец» тоже стоит перевод строки.

  Пример 1
  ```input
  (text.txt)
  Мама мыла раму.
  Раму мыла мама

  Конец
  ```
  ```output
  строк: 4, слов: 7, символов: 38
  ```

  Пример 2
  ```input
  (text.txt — пустой файл)
  ```
  ```output
  строк: 0, слов: 0, символов: 0
  ```
starter: |
  # План:
  # 1. Открыть text.txt с encoding="utf-8" и прочитать текст целиком
  # 2. Посчитать строки, слова и символы
  # 3. Вывести результат
solution: |
  with open("text.txt", encoding="utf-8") as f:
      text = f.read()
  lines = len(text.splitlines())
  words = len(text.split())
  print(f"строк: {lines}, слов: {words}, символов: {len(text)}")
tests:
  files:
    text.txt: "Мама мыла раму.\nРаму мыла мама\n\nКонец\n"
  io:
    - name: Пример 1
      stdout: "строк: 4, слов: 7, символов: 38"
    - name: Пустой файл
      files:
        text.txt: ""
      stdout: "строк: 0, слов: 0, символов: 0"
    - name: Без перевода строки в конце
      files:
        text.txt: "одна строка без перевода"
      stdout: "строк: 1, слов: 4, символов: 24"
      hidden: true
    - name: Только пустые строки
      files:
        text.txt: "\n\n\n"
      stdout: "строк: 3, слов: 0, символов: 3"
      hidden: true
    - name: Табуляция и лишние пробелы
      files:
        text.txt: "  слово\tещё слово  \n"
      stdout: "строк: 1, слов: 3, символов: 20"
      hidden: true
hints:
  - level: 1
    text: 'Удобнее прочитать файл один раз целиком: из одной строки-текста можно получить все три числа.'
  - level: 2
    text: 'Сколько строк в тексте — не то же, что сколько в нём `\n`: последняя строка может быть без перевода строки. Какой метод строки делит текст по переводам строк и не оставляет пустого куска после последнего `\n`?'
  - level: 3
    text: 'Слова — `split()` без аргумента: он не считает пустые куски между двумя пробелами. Символы — `len` всего текста.'
