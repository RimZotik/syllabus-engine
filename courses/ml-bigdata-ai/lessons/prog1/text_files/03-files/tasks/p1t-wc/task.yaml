id: p1t-wc
title: Строки, слова, символы
sandbox: python-browser
difficulty: 1
statement: |
  **Напишите функцию `wc(path)`, которая читает текстовый файл и возвращает кортеж `(строк, слов, символов)`.**

  `path` — путь к файлу в кодировке UTF-8; функция возвращает три целых числа. Строки — строки файла, в том числе пустые; последняя строка может быть без перевода строки. Слова — куски между пробельными символами. Символы — все символы файла, включая переводы строк. Файлы из примеров — на вкладках над редактором.

  Пример 1 — в `text.txt` четыре строки «Мама мыла раму.», «Раму мыла мама», пустая и «Конец», после «Конец» тоже перевод строки
  ```call
  wc("text.txt")
  ```
  ```return
  (4, 7, 38)
  ```

  Пример 2 — `empty.txt` пустой
  ```call
  wc("empty.txt")
  ```
  ```return
  (0, 0, 0)
  ```
starter: |
  def wc(path):
      # План:
      # 1. Открыть файл с encoding="utf-8" и прочитать текст целиком
      # 2. Посчитать строки, слова и символы
      # 3. Вернуть три числа кортежем
      pass


  print(wc("text.txt"))
solution: |
  def wc(path):
      with open(path, encoding="utf-8") as f:
          text = f.read()
      return len(text.splitlines()), len(text.split()), len(text)


  print(wc("text.txt"))
tests:
  files:
    text.txt: "Мама мыла раму.\nРаму мыла мама\n\nКонец\n"
    empty.txt: ""
    one.txt: "одна строка без перевода"
    blank.txt: "\n\n\n"
    tabs.txt: "  слово\tещё слово  \n"
  function: wc
  calls:
    - name: Пример 1
      args: ["text.txt"]
      expect_py: "(4, 7, 38)"
    - name: Пустой файл
      args: ["empty.txt"]
      expect_py: "(0, 0, 0)"
    - name: Без перевода строки в конце
      args: ["one.txt"]
      expect: [1, 4, 24]
      hidden: true
    - name: Только пустые строки
      args: ["blank.txt"]
      expect: [3, 0, 3]
      hidden: true
    - name: Табуляция и лишние пробелы
      args: ["tabs.txt"]
      expect: [1, 3, 20]
      hidden: true
hints:
  - level: 1
    text: 'Удобнее прочитать файл один раз целиком: из одной строки-текста можно получить все три числа.'
  - level: 2
    text: 'Сколько строк в тексте — не то же, что сколько в нём `\n`: последняя строка может быть без перевода строки. Какой метод строки делит текст по переводам строк и не оставляет пустого куска после последнего `\n`?'
  - level: 3
    text: 'Слова — `split()` без аргумента: он не считает пустые куски между двумя пробелами. Символы — `len` всего текста.'
