id: p1t-bank-statement
title: Расходы по выписке банка
sandbox: python-browser
difficulty: 3
statement: |
  **По выписке банка `statement.csv` выведите расходы по категориям — от большей суммы к меньшей, а в конце число строк, которые не удалось разобрать.**

  Выписка выгружена из Excel: UTF-8 с меткой BOM, разделитель `;`, столбцы `дата`, `описание`, `категория`, `сумма` — в разных выгрузках порядок разный. Сумма записана по-русски: `-1 250,40`, между тысячами может стоять неразрывный пробел. Расход — отрицательная сумма, доходы не учитываются. Категория приводится к строчным буквам без пробелов по краям; пустая — `без категории`. Строка вывода: категория влево, ширина 15; сумма расходов (без минуса) вправо, ширина 12, тысячи через пробел, два знака после запятой. При равных суммах — по алфавиту. Последняя строка — `Не разобрано строк: N`: сумма не число или её нет.

  Пример 1
  ```input
  (statement.csv)
  дата;описание;категория;сумма
  2024-05-01;Пятёрочка;Продукты;-1 250,40
  2024-05-02;Зарплата;Доход;85 000,00
  2024-05-03;Метро;Транспорт;-62,00
  2024-05-04;ВкусВилл; продукты ;-830,60
  2024-05-05;Кафе;;-450,00
  2024-05-06;Ошибка банка;Прочее;н/д
  2024-05-07;Такси;Транспорт;-1 012,00
  ```
  ```output
  продукты           2 081,00
  транспорт          1 074,00
  без категории        450,00
  Не разобрано строк: 1
  ```
starter: |
  import csv

  # План:
  # 1. Функция: текст суммы -> число (убрать все пробельные символы,
  #    запятую заменить точкой)
  # 2. Функция: число -> строка «2 081,00»
  # 3. Открыть выписку с нужной кодировкой и разделителем; для каждой
  #    строки разобрать сумму (не вышло — посчитать), расходы сложить
  #    по категориям
  # 4. Отсортировать и вывести таблицу и число неразобранных строк
solution: |
  import csv


  def to_amount(text):
      return float("".join(text.split()).replace(",", "."))


  def rub(x):
      return f"{x:,.2f}".replace(",", " ").replace(".", ",")


  spent = {}
  bad = 0
  with open("statement.csv", encoding="utf-8-sig", newline="") as f:
      for row in csv.DictReader(f, delimiter=";"):
          if row["сумма"] is None:
              bad += 1
              continue
          try:
              amount = to_amount(row["сумма"])
          except ValueError:
              bad += 1
              continue
          if amount >= 0:
              continue
          category = row["категория"].strip().lower() or "без категории"
          spent[category] = spent.get(category, 0) - amount

  for category, total in sorted(spent.items(), key=lambda p: (-p[1], p[0])):
      print(f"{category:<15}{rub(total):>12}")
  print(f"Не разобрано строк: {bad}")
tests:
  files:
    statement.csv: "﻿дата;описание;категория;сумма\n2024-05-01;Пятёрочка;Продукты;-1 250,40\n2024-05-02;Зарплата;Доход;85 000,00\n2024-05-03;Метро;Транспорт;-62,00\n2024-05-04;ВкусВилл; продукты ;-830,60\n2024-05-05;Кафе;;-450,00\n2024-05-06;Ошибка банка;Прочее;н/д\n2024-05-07;Такси;Транспорт;-1 012,00\n"
  io:
    - name: Пример 1
      stdout: "продукты           2 081,00\nтранспорт          1 074,00\nбез категории        450,00\nНе разобрано строк: 1"
    - name: Обычный пробел, пустая сумма и короткая строка
      files:
        statement.csv: "﻿дата;описание;категория;сумма\n2024-06-01;Ремонт;Дом;-12 500,00\n2024-06-02;Кино;Досуг;\n2024-06-03;Обрывок строки\n2024-06-04;Краска;ДОМ;-500\n"
      stdout: "дом               13 000,00\nНе разобрано строк: 2"
      hidden: true
    - name: Равные суммы и только доходы
      files:
        statement.csv: "﻿дата;описание;категория;сумма\n2024-06-01;А;Связь;-300,00\n2024-06-02;Б;Аптека;-300,00\n2024-06-03;В;Возврат;+150,00\n2024-06-04;Г;Кешбэк;0,00\n"
      stdout: "аптека               300,00\nсвязь                300,00\nНе разобрано строк: 0"
      hidden: true
    - name: Другой порядок столбцов
      files:
        statement.csv: "﻿сумма;категория;дата;описание\n-99,90;Связь;2024-06-01;Интернет\n-1 000;Связь;2024-06-02;Телефон\n"
      stdout: "связь              1 099,90\nНе разобрано строк: 0"
      hidden: true
    - name: Расходов нет
      files:
        statement.csv: "﻿дата;описание;категория;сумма\n2024-06-01;Зарплата;Доход;50 000,00\n"
      stdout: "Не разобрано строк: 0"
      hidden: true
hints:
  - level: 1
    text: 'Разделите работу на маленькие функции: текст суммы → число, число → строка по-русски. Каждую легко проверить отдельно своими `assert`.'
  - level: 2
    text: 'Метка BOM прилипает к первому заголовку, если не выбрать подходящую кодировку. Неразрывный пробел не уберёт `replace(" ", "")` — а какой вызов режет по любым пробельным символам?'
  - level: 3
    text: 'У строки без поля суммы `DictReader` подставит `None` — его проверяют до перевода в число. Сортировка по двум правилам — ключ-кортеж: минус сумма и категория.'
