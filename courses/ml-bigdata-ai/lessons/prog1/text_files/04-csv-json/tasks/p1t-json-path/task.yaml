id: p1t-json-path
title: Значение по пути в JSON
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите функцию `get_path(data, path, default=None)`, которая возвращает значение во вложенных словарях и списках по пути вида `customer.address.city` или `items.0.name`, а если пути нет — `default`.**

  `data` — то, что вернул `json.load`: словари, списки, строки, числа, `True`/`False`, `None`. `path` — строка, части пути разделены точкой. Если текущее значение — словарь, часть пути — ключ; если список — часть из цифр означает индекс с 0. Пути нет, если ключа нет, индекс за пределами списка, часть для списка не из цифр или текущее значение — не словарь и не список. В редакторе под функцией — пример с файлом `shop.json` с вкладки.

  Пример 1
  ```call
  get_path({"customer": {"address": {"city": "Казань"}}}, "customer.address.city")
  ```
  ```return
  "Казань"
  ```

  Пример 2
  ```call
  get_path({"items": [{"name": "чай", "tags": ["зелёный", "листовой"]}]}, "items.0.tags.1")
  ```
  ```return
  "листовой"
  ```

  Пример 3
  ```call
  get_path({"items": [{"name": "чай"}, {"name": "сыр"}]}, "items.5.name", "нет")
  ```
  ```return
  "нет"
  ```
starter: |
  import json


  def get_path(data, path, default=None):
      pass


  with open("shop.json", encoding="utf-8") as f:
      data = json.load(f)
  print(get_path(data, "customer.address.city"))
solution: |
  import json


  def get_path(data, path, default=None):
      current = data
      for part in path.split("."):
          if type(current) is dict:
              if part not in current:
                  return default
              current = current[part]
          elif type(current) is list:
              if not part.isdigit() or int(part) >= len(current):
                  return default
              current = current[int(part)]
          else:
              return default
      return current


  with open("shop.json", encoding="utf-8") as f:
      data = json.load(f)
  print(get_path(data, "customer.address.city"))
tests:
  files:
    shop.json: "{\n \"id\": 17,\n \"customer\": {\n  \"name\": \"Аня\",\n  \"address\": {\n   \"city\": \"Казань\"\n  }\n },\n \"items\": [\n  {\n   \"name\": \"чай\",\n   \"tags\": [\n    \"зелёный\",\n    \"листовой\"\n   ]\n  },\n  {\n   \"name\": \"сыр\"\n  }\n ]\n}\n"
  function: get_path
  calls:
    - name: Пример 1
      args: [{"customer": {"address": {"city": "Казань"}}}, "customer.address.city"]
      expect: "Казань"
    - name: Пример 2
      args: [{"items": [{"name": "чай", "tags": ["зелёный", "листовой"]}]}, "items.0.tags.1"]
      expect: "листовой"
    - name: Пример 3
      args: [{"items": [{"name": "чай"}, {"name": "сыр"}]}, "items.5.name", "нет"]
      expect: "нет"
    - name: Ключ верхнего уровня
      args: [{"id": 17, "customer": {"name": "Аня", "address": {"city": "Казань"}}, "items": [{"name": "чай", "tags": ["зелёный", "листовой"]}, {"name": "сыр"}]}, "id"]
      expect: 17
    - name: Второй элемент списка
      args: [{"id": 17, "customer": {"name": "Аня", "address": {"city": "Казань"}}, "items": [{"name": "чай", "tags": ["зелёный", "листовой"]}, {"name": "сыр"}]}, "items.1.name"]
      expect: "сыр"
      hidden: true
    - name: Путь ведёт к списку
      args: [{"a": {"b": [1, 2]}}, "a.b"]
      expect: [1, 2]
      hidden: true
    - name: Путь ведёт к словарю
      args: [{"a": {"b": [1, 2]}}, "a"]
      expect: {"b": [1, 2]}
      hidden: true
    - name: Нет ключа
      args: [{"customer": {"name": "Аня"}, "items": [{"name": "чай"}], "id": 17}, "customer.phone", "—"]
      expect: "—"
    - name: Не цифры для списка
      args: [{"customer": {"name": "Аня"}, "items": [{"name": "чай"}], "id": 17}, "items.name", "—"]
      expect: "—"
      hidden: true
    - name: Отрицательный индекс
      args: [{"customer": {"name": "Аня"}, "items": [{"name": "чай"}], "id": 17}, "items.-1.name", "—"]
      expect: "—"
      hidden: true
    - name: Индекс за пределами
      args: [{"customer": {"name": "Аня"}, "items": [{"name": "чай"}], "id": 17}, "items.1", "—"]
      expect: "—"
      hidden: true
    - name: Спуск в число
      args: [{"customer": {"name": "Аня"}, "items": [{"name": "чай"}], "id": 17}, "id.x", "—"]
      expect: "—"
      hidden: true
    - name: Спуск в строку
      args: [{"customer": {"name": "Аня"}, "items": [{"name": "чай"}], "id": 17}, "customer.name.0", "—"]
      expect: "—"
      hidden: true
    - name: Нет ключа верхнего уровня
      args: [{"customer": {"name": "Аня"}, "items": [{"name": "чай"}], "id": 17}, "nothing", "—"]
      expect: "—"
      hidden: true
    - name: Без default — None
      args: [{"customer": {"name": "Аня"}, "items": [{"name": "чай"}], "id": 17}, "customer.phone"]
      expect: null
      hidden: true
    - name: Значение None — найдено
      args: [{"coupon": null}, "coupon", "нет"]
      expect: null
      hidden: true
    - name: Значение False — найдено
      args: [{"paid": false}, "paid", "нет"]
      expect: false
      hidden: true
    - name: Значение 0 — найдено
      args: [{"n": [0]}, "n.0", "нет"]
      expect: 0
      hidden: true
hints:
  - level: 1
    text: 'Идите по пути шаг за шагом: держите «текущее значение» и на каждой части пути спускайтесь на уровень глубже — как `order["customer"]["name"]`, только скобок столько, сколько частей.'
  - level: 2
    text: 'На каждом шаге сначала узнайте, что перед вами: словарь, список или что-то другое. Тип значения показывает `type(x)`: сравните его с `dict` и `list`. От этого зависит, как понимать часть пути и как проверить, что путь есть. Чтобы увидеть, что лежит на каждом шаге, добавьте `print(current)` — он не влияет на проверку.'
  - level: 3
    text: 'Не путайте «пути нет» и «по пути лежит `None` или `False`»: проверяйте наличие ключа через `in`, а не истинность значения. Для списка — `isdigit()` и сравнение индекса с длиной.'
