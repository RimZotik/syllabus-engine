id: p1t-flight
title: Когда прилетит самолёт
sandbox: python-browser
difficulty: 3
statement: |
  **Напишите функцию `flight(departure, duration, arrival_offset)`, которая возвращает кортеж: время прилёта по местным часам и на сколько часов часы в городе прилёта спешат относительно города вылета.**

  Все три аргумента — строки: вылет `ДД.ММ.ГГГГ ЧЧ:ММ ±Ч` (местное время и смещение от UTC в часах), длительность полёта `Ч:ММ`, смещение пояса прилёта `±Ч`. Функция возвращает пару `(строка "ДД.ММ.ГГГГ ЧЧ:ММ", целое число часов)`; число может быть 0 или отрицательным.

  Пример 1
  ```call
  flight("17.05.2024 23:00 +3", "4:30", "+5")
  ```
  ```return
  ("18.05.2024 05:30", 2)
  ```

  Пример 2
  ```call
  flight("01.06.2024 08:00 +7", "9:15", "+3")
  ```
  ```return
  ("01.06.2024 13:15", -4)
  ```
starter: |
  from datetime import datetime, timedelta, timezone


  def flight(departure, duration, arrival_offset):
      # План:
      # 1. Разобрать вылет: дата и время — strptime, смещение — int
      # 2. Сделать осведомлённое время вылета
      # 3. Прибавить длительность и показать момент по часам пояса прилёта
      # 4. Разница часов — разность смещений
      pass


  print(flight("17.05.2024 23:00 +3", "4:30", "+5"))
solution: |
  from datetime import datetime, timedelta, timezone


  def flight(departure, duration, arrival_offset):
      date_text, time_text, dep_offset = departure.split()
      hours, minutes = duration.split(":")
      t = datetime.strptime(date_text + " " + time_text, "%d.%m.%Y %H:%M")
      start = datetime(t.year, t.month, t.day, t.hour, t.minute,
                       tzinfo=timezone(timedelta(hours=int(dep_offset))))
      arrival = start + timedelta(hours=int(hours), minutes=int(minutes))
      local = arrival.astimezone(timezone(timedelta(hours=int(arrival_offset))))
      return local.strftime("%d.%m.%Y %H:%M"), int(arrival_offset) - int(dep_offset)


  print(flight("17.05.2024 23:00 +3", "4:30", "+5"))
tests:
  function: flight
  calls:
    - name: Пример 1
      args: ["17.05.2024 23:00 +3", "4:30", "+5"]
      expect_py: '("18.05.2024 05:30", 2)'
    - name: Пример 2
      args: ["01.06.2024 08:00 +7", "9:15", "+3"]
      expect_py: '("01.06.2024 13:15", -4)'
    - name: Прилёт «раньше» вылета
      args: ["31.12.2024 01:00 +10", "2:00", "+3"]
      expect: ["30.12.2024 20:00", -7]
      hidden: true
    - name: Тот же пояс и западное полушарие
      args: ["28.02.2024 22:30 -5", "3:45", "-5"]
      expect: ["29.02.2024 02:15", 0]
      hidden: true
    - name: Смещение 0 и долгий полёт
      args: ["10.05.2024 12:00 +0", "13:05", "+9"]
      expect: ["11.05.2024 10:05", 9]
      hidden: true
hints:
  - level: 1
    text: '«23:00» без пояса — не момент времени. Сначала сделайте время вылета осведомлённым, тогда прибавление длительности и перевод на другие часы сделает `datetime`.'
  - level: 2
    text: '`int("+3")` и `int("-5")` работают: знак — часть числа. Длительность «4:30» — два числа для `timedelta(hours=..., minutes=...)`.'
  - level: 3
    text: 'Тот же момент на других часах показывает `astimezone`. Разница часов — разность смещений, целым числом. Чтобы увидеть промежуточные моменты, напечатайте их через `print` — он не влияет на проверку.'
