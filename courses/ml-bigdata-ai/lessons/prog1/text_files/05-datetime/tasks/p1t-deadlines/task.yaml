id: p1t-deadlines
title: Сроки задач
sandbox: python-browser
difficulty: 2
statement: |
  **По файлу `tasks.csv` и сегодняшней дате выведите задачи по возрастанию срока: сколько дней осталось или на сколько просрочено.**

  Ввод — сегодняшняя дата `ДД.ММ.ГГГГ`. Файл: разделитель `;`, столбцы `задача;срок`, срок — `ДД.ММ.ГГГГ`. Строка вывода: `просрочено на N дн.: задача`, `сегодня: задача` или `через N дн.: задача`; при равных сроках — в порядке файла. Если срок не разбирается как дата, после списка выведите `Неверная дата в строке K: срок` (строки файла считаются с 1, заголовок — строка 1).

  Пример 1
  ```input
  17.05.2024
  (tasks.csv)
  задача;срок
  отчёт;20.05.2024
  налог;15.05.2024
  звонок;17.05.2024
  отпуск;31.02.2024
  ```
  ```output
  просрочено на 2 дн.: налог
  сегодня: звонок
  через 3 дн.: отчёт
  Неверная дата в строке 5: 31.02.2024
  ```
starter: |
  import csv
  from datetime import datetime

  # План:
  # 1. Прочитать сегодняшнюю дату
  # 2. Прочитать tasks.csv: пары (срок, задача); неверную дату запомнить
  #    вместе с номером строки файла
  # 3. Отсортировать по сроку и вывести; потом — неверные даты
stdin: "17.05.2024\n"
solution: |
  import csv
  from datetime import datetime

  today = datetime.strptime(input(), "%d.%m.%Y").date()
  tasks = []
  bad = []
  with open("tasks.csv", encoding="utf-8", newline="") as f:
      for n, row in enumerate(csv.DictReader(f, delimiter=";"), start=2):
          try:
              deadline = datetime.strptime(row["срок"], "%d.%m.%Y").date()
          except ValueError:
              bad.append((n, row["срок"]))
              continue
          tasks.append((deadline, row["задача"]))

  for deadline, name in sorted(tasks, key=lambda t: t[0]):
      days = (deadline - today).days
      if days < 0:
          print(f"просрочено на {-days} дн.: {name}")
      elif days == 0:
          print(f"сегодня: {name}")
      else:
          print(f"через {days} дн.: {name}")
  for n, text in bad:
      print(f"Неверная дата в строке {n}: {text}")
tests:
  files:
    tasks.csv: "задача;срок\nотчёт;20.05.2024\nналог;15.05.2024\nзвонок;17.05.2024\nотпуск;31.02.2024\n"
  io:
    - name: Пример 1
      stdin: "17.05.2024\n"
      stdout: "просрочено на 2 дн.: налог\nсегодня: звонок\nчерез 3 дн.: отчёт\nНеверная дата в строке 5: 31.02.2024"
    - name: Через конец года и равные сроки
      stdin: "30.12.2024\n"
      files:
        tasks.csv: "задача;срок\nёлка;31.12.2024\nподарки;31.12.2024\nотчёт за год;15.01.2025\n"
      stdout: "через 1 дн.: ёлка\nчерез 1 дн.: подарки\nчерез 16 дн.: отчёт за год"
      hidden: true
    - name: Другой формат и 29 февраля
      stdin: "01.03.2024\n"
      files:
        tasks.csv: "задача;срок\nвзнос;29.02.2024\nсправка;2024-03-05\nанализы;05.03.2024\nвстреча;\n"
      stdout: "просрочено на 1 дн.: взнос\nчерез 4 дн.: анализы\nНеверная дата в строке 3: 2024-03-05\nНеверная дата в строке 5: "
      hidden: true
    - name: Задач нет
      stdin: "17.05.2024\n"
      files:
        tasks.csv: "задача;срок\n"
      stdout: ""
      hidden: true
hints:
  - level: 1
    text: 'Сравнивать и сортировать нужно даты, а не строки «ДД.ММ.ГГГГ»: строки сравниваются посимвольно, и первым в них стоит день.'
  - level: 2
    text: 'Несуществующую дату («31.02») и чужой формат `strptime` не разберёт — он выбросит исключение. Поймайте его для одной строки и идите дальше, запомнив номер строки файла.'
  - level: 3
    text: 'Пары (срок, задача) сортируют по первому элементу; `sorted` сохраняет порядок равных. Число дней — `days` у разности дат, у просроченных оно отрицательное.'
