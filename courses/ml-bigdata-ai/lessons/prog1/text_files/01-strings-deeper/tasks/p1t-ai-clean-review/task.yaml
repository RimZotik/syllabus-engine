id: p1t-ai-clean-review
title: ИИ-ассистент чистит отзывы
sandbox: python-browser
difficulty: 1
statement: |
  **Исправьте две функции: `clean_review(text)` возвращает текст, где между словами ровно один пробел, а по краям пробелов нет; `word_count(text)` возвращает число слов.**

  Слова разделены любыми пробельными символами: пробел, табуляция, перевод строки, неразрывный пробел. Код в редакторе написал ИИ-ассистент: на примере 1 он отвечает верно, на примере 2 — нет. Найдите, каких случаев он не учёл.

  Обе функции получают строку; `clean_review` возвращает строку, `word_count` — целое число.

  Пример 1
  ```call
  clean_review("  Отличный   товар,  спасибо ")
  ```
  ```return
  "Отличный товар, спасибо"
  ```

  Пример 2
  ```call
  clean_review("Пришёл\tбыстро\n\nрекомендую")
  ```
  ```return
  "Пришёл быстро рекомендую"
  ```

  Для тех же отзывов `word_count` возвращает `3` и `3`; для пустого отзыва — `0`.
starter: |
  # Решение от ИИ-ассистента
  def clean_review(text):
      while "  " in text:
          text = text.replace("  ", " ")
      return text.strip(" ")


  def word_count(text):
      return len(clean_review(text).split(" "))


  print(clean_review("  Отличный   товар,  спасибо "))
  print(word_count("  Отличный   товар,  спасибо "))
solution: |
  def clean_review(text):
      return " ".join(text.split())


  def word_count(text):
      return len(text.split())


  print(clean_review("  Отличный   товар,  спасибо "))
  print(word_count("  Отличный   товар,  спасибо "))
tests:
  function: clean_review
  calls:
    - name: Пример 1
      args: ["  Отличный   товар,  спасибо "]
      expect: "Отличный товар, спасибо"
    - name: Пример 2 — табуляция и переводы строк
      args: ["Пришёл\tбыстро\n\nрекомендую"]
      expect: "Пришёл быстро рекомендую"
    - name: Неразрывный пробел
      args: ["Цена отличная  "]
      expect: "Цена отличная"
    - name: Перевод строки по краям
      args: ["\nСупер\n"]
      expect: "Супер"
      hidden: true
    - name: Пустой отзыв
      args: [""]
      expect: ""
      hidden: true
    - name: Отзыв из одних пробельных символов
      args: [" \n\t "]
      expect: ""
      hidden: true
  asserts:
    - name: word_count — число слов
      code: |
        for t, want in [("  Отличный   товар,  спасибо ", 3), ("Пришёл\tбыстро\n\nрекомендую", 3), ("Цена отличная  ", 2), ("\nСупер\n", 1)]:
            got = word_count(t)
            assert got == want, f"word_count({t!r}) должна вернуть {want}, а вернула {got!r}"
    - name: word_count — пустой отзыв
      code: |
        for t in ["", "   ", "\n\t"]:
            got = word_count(t)
            assert got == 0, f"В {t!r} нет слов: word_count должна вернуть 0, а вернула {got!r}"
hints:
  - level: 1
    text: 'Возьмите самый короткий вход, на котором ответ неверен: например, `"а\tб"`. Что с ним делает каждая строка `clean_review`?'
  - level: 2
    text: 'Ассистент считает разделителем только обычный пробел. Какой вызов `split` сам режет по любой цепочке пробельных символов и не оставляет пустых кусков?'
  - level: 3
    text: 'Отдельно проверьте пустой отзыв: сколько элементов в `"".split(" ")` и сколько в `"".split()`?'
