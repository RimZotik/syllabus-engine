id: p1t-login-check
title: Проверка логина
sandbox: python-browser
difficulty: 2
statement: |
  **Проверьте логины по правилам и для каждого выведите `логин: ok` или `логин: ошибка — <правило>` — первое нарушенное правило по порядку.**

  Ввод — логины по одному в строке, в конце пустая строка; логин берётся как есть, без очистки. Правила:
  1. `длина от 3 до 16 символов`
  2. `только строчные латинские буквы, цифры и _`
  3. `начинается с буквы`
  4. `без двух _ подряд`
  5. `не заканчивается на _`

  Пример 1
  ```input
  anna_2024
  Anna
  2anna
  an__na

  ```
  ```output
  anna_2024: ok
  Anna: ошибка — только строчные латинские буквы, цифры и _
  2anna: ошибка — начинается с буквы
  an__na: ошибка — без двух _ подряд
  ```

  Ограничения: модуль `re` не используйте — хватит методов строк.
starter: |
  # План:
  # 1. Функция check(login) возвращает текст первого нарушенного правила
  #    или None, если нарушений нет; правила — по порядку, как в условии
  # 2. Для правила 2 — строка всех разрешённых символов и проверка
  #    каждого символа логина
  # 3. Читать логины до пустой строки и печатать результат
stdin: "anna_2024\nAnna\n2anna\nan__na\n\n"
solution: |
  ALLOWED = "abcdefghijklmnopqrstuvwxyz0123456789_"
  LETTERS = "abcdefghijklmnopqrstuvwxyz"


  def check(login):
      if len(login) < 3 or len(login) > 16:
          return "длина от 3 до 16 символов"
      if not all(ch in ALLOWED for ch in login):
          return "только строчные латинские буквы, цифры и _"
      if login[0] not in LETTERS:
          return "начинается с буквы"
      if "__" in login:
          return "без двух _ подряд"
      if login.endswith("_"):
          return "не заканчивается на _"
      return None


  login = input()
  while login != "":
      problem = check(login)
      if problem is None:
          print(f"{login}: ok")
      else:
          print(f"{login}: ошибка — {problem}")
      login = input()
tests:
  forbid: [re]
  io:
    - name: Пример 1
      stdin: "anna_2024\nAnna\n2anna\nan__na\n\n"
      stdout: "anna_2024: ok\nAnna: ошибка — только строчные латинские буквы, цифры и _\n2anna: ошибка — начинается с буквы\nan__na: ошибка — без двух _ подряд"
    - name: Длина на границах
      stdin: "ab\nabc\nabcdefghijklmnop\nabcdefghijklmnopq\n\n"
      stdout: "ab: ошибка — длина от 3 до 16 символов\nabc: ok\nabcdefghijklmnop: ok\nabcdefghijklmnopq: ошибка — длина от 3 до 16 символов"
      hidden: true
    - name: Кириллица, пробел, дефис
      stdin: "анна\nan na\nan-na\nannа\n\n"
      stdout: "анна: ошибка — только строчные латинские буквы, цифры и _\nan na: ошибка — только строчные латинские буквы, цифры и _\nan-na: ошибка — только строчные латинские буквы, цифры и _\nannа: ошибка — только строчные латинские буквы, цифры и _"
      hidden: true
    - name: Подчёркивание в начале и в конце
      stdin: "_anna\nanna_\nanna__\na_1\n\n"
      stdout: "_anna: ошибка — начинается с буквы\nanna_: ошибка — не заканчивается на _\nanna__: ошибка — без двух _ подряд\na_1: ok"
      hidden: true
    - name: Важен порядок правил
      stdin: "_A\n1__\nz99\n\n"
      stdout: "_A: ошибка — длина от 3 до 16 символов\n1__: ошибка — начинается с буквы\nz99: ok"
      hidden: true
hints:
  - level: 1
    text: 'Удобно вынести проверку в функцию, которая возвращает текст первого нарушения — или `None`, если всё хорошо. Тогда порядок правил — это просто порядок `if` с `return`.'
  - level: 2
    text: '«Только разрешённые символы» — это «каждый символ логина входит в строку разрешённых». Как проверить условие для всех элементов сразу?'
  - level: 3
    text: 'Правила 3–5 проверяются одной строкой каждое: первый символ, вхождение куска `__`, конец строки. До них доходит только логин, прошедший правила 1 и 2, поэтому `login[0]` уже не упадёт.'
