id: p1t-login-check
title: Проверка логина
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите функцию `check_login(login)`, которая возвращает `"ok"`, если логин подходит под правила, а иначе — текст первого нарушенного правила по порядку.**

  `login` — строка, берётся как есть, без очистки. Функция возвращает строку. Правила и их тексты:
  1. `длина от 3 до 16 символов`
  2. `только строчные латинские буквы, цифры и _`
  3. `начинается с буквы`
  4. `без двух _ подряд`
  5. `не заканчивается на _`

  Пример 1
  ```call
  check_login("anna_2024")
  ```
  ```return
  "ok"
  ```

  Пример 2
  ```call
  check_login("Anna")
  ```
  ```return
  "только строчные латинские буквы, цифры и _"
  ```

  Пример 3
  ```call
  check_login("an__na")
  ```
  ```return
  "без двух _ подряд"
  ```

  Ограничения: модуль `re` не используйте — хватит методов строк.
starter: |
  def check_login(login):
      # План:
      # 1. Правила — по порядку, как в условии: каждое нарушение —
      #    сразу return с его текстом
      # 2. Для правила 2 — строка всех разрешённых символов и проверка
      #    каждого символа логина
      # 3. Ни одно правило не нарушено — вернуть "ok"
      pass


  for login in ["anna_2024", "Anna", "2anna", "an__na"]:
      print(login, "—", check_login(login))
solution: |
  ALLOWED = "abcdefghijklmnopqrstuvwxyz0123456789_"
  LETTERS = "abcdefghijklmnopqrstuvwxyz"


  def check_login(login):
      if len(login) < 3 or len(login) > 16:
          return "длина от 3 до 16 символов"
      if not all(ch in ALLOWED for ch in login):
          return "только строчные латинские буквы, цифры и _"
      if login[0] not in LETTERS:
          return "начинается с буквы"
      if "__" in login:
          return "без двух _ подряд"
      if login.endswith("_"):
          return "не заканчивается на _"
      return "ok"


  for login in ["anna_2024", "Anna", "2anna", "an__na"]:
      print(login, "—", check_login(login))
tests:
  forbid: [re]
  function: check_login
  calls:
    - name: Верный логин
      args: ["anna_2024"]
      expect: "ok"
    - name: Заглавная буква
      args: ["Anna"]
      expect: "только строчные латинские буквы, цифры и _"
    - name: Начинается с цифры
      args: ["2anna"]
      expect: "начинается с буквы"
    - name: Два _ подряд
      args: ["an__na"]
      expect: "без двух _ подряд"
    - name: Короче 3 символов
      args: ["ab"]
      expect: "длина от 3 до 16 символов"
      hidden: true
    - name: Ровно 3 символа
      args: ["abc"]
      expect: "ok"
      hidden: true
    - name: Ровно 16 символов
      args: ["abcdefghijklmnop"]
      expect: "ok"
      hidden: true
    - name: 17 символов
      args: ["abcdefghijklmnopq"]
      expect: "длина от 3 до 16 символов"
      hidden: true
    - name: Кириллица
      args: ["анна"]
      expect: "только строчные латинские буквы, цифры и _"
      hidden: true
    - name: Пробел внутри
      args: ["an na"]
      expect: "только строчные латинские буквы, цифры и _"
      hidden: true
    - name: Дефис
      args: ["an-na"]
      expect: "только строчные латинские буквы, цифры и _"
      hidden: true
    - name: Кириллическая «а» в конце
      args: ["annа"]
      expect: "только строчные латинские буквы, цифры и _"
      hidden: true
    - name: Начинается с _
      args: ["_anna"]
      expect: "начинается с буквы"
      hidden: true
    - name: Кончается на _
      args: ["anna_"]
      expect: "не заканчивается на _"
      hidden: true
    - name: Два _ в конце
      args: ["anna__"]
      expect: "без двух _ подряд"
      hidden: true
    - name: _ внутри
      args: ["a_1"]
      expect: "ok"
      hidden: true
    - name: Порядок правил — сначала длина
      args: ["_A"]
      expect: "длина от 3 до 16 символов"
      hidden: true
    - name: Порядок правил — начало раньше двух _
      args: ["1__"]
      expect: "начинается с буквы"
      hidden: true
hints:
  - level: 1
    text: 'Порядок правил — это просто порядок `if` с `return`: первое нарушение сразу завершает вызов. До `return "ok"` в конце доходит только логин, прошедший все проверки.'
  - level: 2
    text: '«Только разрешённые символы» — это «каждый символ логина входит в строку разрешённых». Как проверить условие для всех элементов сразу?'
  - level: 3
    text: 'Правила 3–5 проверяются одной строкой каждое: первый символ, вхождение куска `__`, конец строки. До них доходит только логин, прошедший правила 1 и 2, поэтому `login[0]` уже не упадёт.'
