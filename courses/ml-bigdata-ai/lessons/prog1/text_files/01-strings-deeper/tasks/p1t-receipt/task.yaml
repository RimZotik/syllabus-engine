id: p1t-receipt
title: Чек ровными столбцами
sandbox: python-browser
difficulty: 2
statement: |
  **Напечатайте чек: для каждой позиции — название и стоимость, в конце черта и итог; суммы — по-русски.**

  Ввод — строки `товар;цена;количество`, в конце пустая строка. Вокруг полей могут быть пробелы; цена записана с точкой или с запятой, количество — целое. Строка чека: название влево, ширина 20 (длинное название не обрезается); стоимость (цена × количество) вправо, ширина 12, тысячи через пробел, два знака после запятой. Потом строка из 32 дефисов и строка `Итого` в том же формате.

  Пример 1
  ```input
  хлеб;45;2
  сыр;320,50;1
   молоко ; 89.90 ; 3 

  ```
  ```output
  хлеб                       90,00
  сыр                       320,50
  молоко                    269,70
  --------------------------------
  Итого                     680,20
  ```

  Пример 2
  ```input
  телевизор;35990;2

  ```
  ```output
  телевизор              71 980,00
  --------------------------------
  Итого                  71 980,00
  ```
starter: |
  # План:
  # 1. Функция: число -> строка «71 980,00»
  # 2. Читать строки до пустой: разрезать по «;», очистить поля,
  #    цену перевести в число (запятую — в точку), посчитать стоимость
  # 3. Напечатать строку позиции; накопить итог
  # 4. Черта и итог
stdin: "хлеб;45;2\nсыр;320,50;1\n молоко ; 89.90 ; 3 \n\n"
solution: |
  def rub(x):
      return f"{x:,.2f}".replace(",", " ").replace(".", ",")


  total = 0
  line = input()
  while line != "":
      name, price, qty = line.split(";")
      cost = float(price.strip().replace(",", ".")) * int(qty)
      total += cost
      print(f"{name.strip():<20}{rub(cost):>12}")
      line = input()
  print("-" * 32)
  print(f"{'Итого':<20}{rub(total):>12}")
tests:
  io:
    - name: Пример 1
      stdin: "хлеб;45;2\nсыр;320,50;1\n молоко ; 89.90 ; 3 \n\n"
      stdout: "хлеб                       90,00\nсыр                       320,50\nмолоко                    269,70\n--------------------------------\nИтого                     680,20"
    - name: Пример 2
      stdin: "телевизор;35990;2\n\n"
      stdout: "телевизор              71 980,00\n--------------------------------\nИтого                  71 980,00"
    - name: Пустой чек
      stdin: "\n"
      stdout: "--------------------------------\nИтого                       0,00"
      hidden: true
    - name: Длинное название и дробная цена
      stdin: "очень длинное название товара;1;1\nчай;0,5;3\n\n"
      stdout: "очень длинное название товара        1,00\nчай                         1,50\n--------------------------------\nИтого                       2,50"
      hidden: true
    - name: Миллион
      stdin: "ноутбук ; 99999,99 ; 10\nмышь;500;1\n\n"
      stdout: "ноутбук               999 999,90\nмышь                      500,00\n--------------------------------\nИтого               1 000 499,90"
      hidden: true
hints:
  - level: 1
    text: 'Задача распадается на две: разобрать строку позиции и красиво показать число. Начните со второй — функции, которая из 71980 делает «71 980,00».'
  - level: 2
    text: 'Отдельного формата «по-русски» нет: сначала стандартный формат с запятой между тысячами и двумя знаками, потом замены. Порядок замен важен.'
  - level: 3
    text: 'Ширину и выравнивание задают уже готовой строке: `f"{name:<20}{text:>12}"`. Строки по умолчанию прижимаются влево — для суммы нужно явное `>`.'
