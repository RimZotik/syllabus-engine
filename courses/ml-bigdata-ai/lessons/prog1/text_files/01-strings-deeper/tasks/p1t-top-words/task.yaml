id: p1t-top-words
title: Самые частые слова
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите функцию `top_words(text, n)`, которая возвращает список из `n` самых частых слов текста — пар `(слово, сколько раз)`.**

  `text` — строка, в ней может быть несколько строк; `n` — целое число от 1. Слова разделены пробельными символами; с краёв слова убираются знаки `.,!?:;«»"()—-`, регистр не важен (слово приводится к строчным буквам); то, что после очистки стало пустым, словом не считается. Пары идут по убыванию числа, при равенстве — по алфавиту; если разных слов меньше `n` — все. Пустой текст — пустой список.

  Пример 1
  ```call
  top_words("Кот видел кота. Кот — кот!\nА кот видел мышь, мышь видела кота.", 3)
  ```
  ```return
  [("кот", 4), ("видел", 2), ("кота", 2)]
  ```

  Пример 2
  ```call
  top_words("«Да», — сказал он. — Да, да!\nКто-то сказал: нет.", 2)
  ```
  ```return
  [("да", 3), ("сказал", 2)]
  ```

  Ограничения: `Counter` не используйте.
starter: |
  def top_words(text, n):
      # План:
      # 1. Разрезать текст на слова; каждое слово очистить по краям
      #    и привести к строчным; пустое пропустить, остальное посчитать в словаре
      # 2. Отсортировать пары «слово — число» и вернуть первые n
      pass


  print(top_words("Кот видел кота. Кот — кот!", 2))
solution: |
  def top_words(text, n):
      counts = {}
      for word in text.split():
          word = word.strip(".,!?:;«»\"()—-").lower()
          if word:
              counts[word] = counts.get(word, 0) + 1
      pairs = sorted(counts.items(), key=lambda p: (-p[1], p[0]))
      return pairs[:n]


  print(top_words("Кот видел кота. Кот — кот!", 2))
tests:
  forbid: [Counter, collections]
  function: top_words
  calls:
    - name: Пример 1
      args: ["Кот видел кота. Кот — кот!\nА кот видел мышь, мышь видела кота.", 3]
      expect_py: '[("кот", 4), ("видел", 2), ("кота", 2)]'
    - name: Пример 2
      args: ["«Да», — сказал он. — Да, да!\nКто-то сказал: нет.", 2]
      expect_py: '[("да", 3), ("сказал", 2)]'
    - name: Слов меньше n
      args: ["раз два", 5]
      expect: [["два", 1], ["раз", 1]]
      hidden: true
    - name: Пустой текст
      args: ["", 1]
      expect: []
      hidden: true
    - name: Равные числа — по алфавиту
      args: ["б а в б а в", 2]
      expect: [["а", 2], ["б", 2]]
      hidden: true
    - name: Табуляция и скобки
      args: ["(Чай)\tчай,  ЧАЙ.\n\"сахар\" (сахар) молоко", 2]
      expect: [["чай", 3], ["сахар", 2]]
      hidden: true
    - name: Только знаки препинания
      args: ["— ! ...", 3]
      expect: []
      hidden: true
hints:
  - level: 1
    text: 'Подсчёт — знакомый шаблон: словарь «слово → сколько раз» и `get` со значением по умолчанию. Новое здесь — как получить из строки чистые слова. Чтобы увидеть, что получается после очистки, напечатайте слово через `print` — он не влияет на проверку.'
  - level: 2
    text: 'Какой `split` не оставит пустых слов, если между словами два пробела или табуляция? Чем убрать знаки только с краёв слова, не трогая дефис в «кто-то»?'
  - level: 3
    text: 'Отсортировать нужно по двум правилам сразу: число — по убыванию, слово — по алфавиту. Ключ сортировки может вернуть кортеж; как сделать, чтобы большее число шло раньше?'
