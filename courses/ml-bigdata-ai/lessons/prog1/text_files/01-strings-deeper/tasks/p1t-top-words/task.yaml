id: p1t-top-words
title: Самые частые слова
sandbox: python-browser
difficulty: 2
statement: |
  **Выведите `n` самых частых слов текста и сколько раз каждое встретилось.**

  Первая строка ввода — число `n`, дальше — строки текста, в конце пустая строка. Слова разделены пробельными символами; с краёв слова убираются знаки `.,!?:;«»"()—-`, регистр не важен (слово приводится к строчным буквам); то, что после очистки стало пустым, словом не считается. Вывод — строки `слово: число` по убыванию числа, при равенстве — по алфавиту; если разных слов меньше `n` — все.

  Пример 1
  ```input
  3
  Кот видел кота. Кот — кот!
  А кот видел мышь, мышь видела кота.

  ```
  ```output
  кот: 4
  видел: 2
  кота: 2
  ```

  Пример 2
  ```input
  2
  «Да», — сказал он. — Да, да!
  Кто-то сказал: нет.

  ```
  ```output
  да: 3
  сказал: 2
  ```

  Ограничения: `Counter` не используйте.
starter: |
  # План:
  # 1. Прочитать n и строки текста до пустой
  # 2. Каждую строку разрезать на слова; каждое слово очистить по краям
  #    и привести к строчным; пустое пропустить, остальное посчитать в словаре
  # 3. Отсортировать пары «слово — число» и вывести первые n
stdin: "3\nКот видел кота. Кот — кот!\nА кот видел мышь, мышь видела кота.\n\n"
solution: |
  n = int(input())
  counts = {}
  line = input()
  while line != "":
      for word in line.split():
          word = word.strip(".,!?:;«»\"()—-").lower()
          if word:
              counts[word] = counts.get(word, 0) + 1
      line = input()
  pairs = sorted(counts.items(), key=lambda p: (-p[1], p[0]))
  for word, k in pairs[:n]:
      print(f"{word}: {k}")
tests:
  forbid: [Counter, collections]
  io:
    - name: Пример 1
      stdin: "3\nКот видел кота. Кот — кот!\nА кот видел мышь, мышь видела кота.\n\n"
      stdout: "кот: 4\nвидел: 2\nкота: 2"
    - name: Пример 2
      stdin: "2\n«Да», — сказал он. — Да, да!\nКто-то сказал: нет.\n\n"
      stdout: "да: 3\nсказал: 2"
    - name: Слов меньше n
      stdin: "5\nраз два\n\n"
      stdout: "два: 1\nраз: 1"
      hidden: true
    - name: Пустой текст
      stdin: "1\n\n"
      stdout: ""
      hidden: true
    - name: Равные числа — по алфавиту
      stdin: "2\nб а в б а в\n\n"
      stdout: "а: 2\nб: 2"
      hidden: true
    - name: Табуляция и скобки
      stdin: "2\n(Чай)\tчай,  ЧАЙ.\n\"сахар\" (сахар) молоко\n\n"
      stdout: "чай: 3\nсахар: 2"
      hidden: true
hints:
  - level: 1
    text: 'Подсчёт — знакомый шаблон: словарь «слово → сколько раз» и `get` со значением по умолчанию. Новое здесь — как получить из строки чистые слова.'
  - level: 2
    text: 'Какой `split` не оставит пустых слов, если между словами два пробела или табуляция? Чем убрать знаки только с краёв слова, не трогая дефис в «кто-то»?'
  - level: 3
    text: 'Отсортировать нужно по двум правилам сразу: число — по убыванию, слово — по алфавиту. Ключ сортировки может вернуть кортеж; как сделать, чтобы большее число шло раньше?'
