title: Проверка темы
pass: 0.85
minutes: 25
questions:
- id: findall-groups-vs-whole
  type: single
  q: |
    Что выведет программа?
    ```python
    import re
    s = "Рейсы: SU-1402, S7-215, UT-37"
    print(re.findall(r"([A-Z0-9]{2})-(\d+)", s)[1], re.findall(r"[A-Z0-9]{2}-\d+", s)[-1])
    ```
  options:
  - "`('S7', '215') UT-37`"
  - "`S7-215 UT-37`"
  - "`('S7', '215') ('UT', '37')`"
  - "`('SU', '1402') UT-37`"
  answer: 0
  explain: 'С двумя группами `findall` возвращает по кортежу групп на каждое совпадение, а индекс 1 — второе совпадение, то есть рейс S7. Во втором вызове групп нет — элементы списка совпадения целиком, а `[-1]` — последнее из них. Дефис стоит вне групп: в поиске участвует, в кортеж не входит.'
- id: star-matches-empty
  type: single
  q: |
    Что выведет программа?
    ```python
    import re
    text = "чай 120руб, сахар 45 руб, пакет руб"
    print(re.findall(r"\d* ?руб", text))
    ```
  options:
  - "`['120руб', '45 руб', ' руб']`"
  - "`['120руб', '45 руб']`"
  - "`['120руб', '45 руб', 'руб']`"
  - "`['120', '45']`"
  answer: 0
  traps:
  - 1
  explain: '`*` — «ноль или больше»: `\d*` подходит и там, где цифр нет вовсе. Перед последним «руб» цифр нет, но есть пробел, а `?` его разрешает — так в ответ попадает « руб» с пробелом. Чтобы требовать хотя бы одну цифру, нужен `+`. Групп в шаблоне нет, поэтому слово «руб» входит в каждый кусок.'
- id: dollar-before-newline
  type: multi
  q: |
    Какие строки пройдут проверку `re.search(r"^\d{3}-\d{2}$", s)` (результат — не `None`)?
  options:
  - '`"123-45"`'
  - '`"123-45\n"` — с переводом строки в конце'
  - '`"0123-45"`'
  - '`"123-456"`'
  answer:
  - 0
  - 1
  explain: '`$` подходит не только в самом конце строки, но и перед последним `\n` — поэтому строка файла с переводом строки проходит, и `fullmatch` её бы не пропустил. «0123-45»: после `^` идут «012», а дальше нужен дефис, а стоит «3». «123-456»: после двух цифр стоит третья, а не конец.'
- id: greedy-parentheses
  type: single
  q: |
    Из названий убирают уточнения в скобках. Что выведет программа?
    ```python
    import re
    print(re.sub(r"\(.*\)", "", "Чай (зелёный) и кофе (молотый)") + "|")
    ```
  options:
  - '`Чай |`'
  - '`Чай  и кофе |`'
  - '`Чай и кофе|`'
  - '`Чай (зелёный) и кофе (молотый)|`'
  answer: 0
  explain: '`*` жадный: `.*` захватывает всё до *последней* закрывающей скобки в строке, поэтому совпадение — от первой «(» до конца, и всё оно заменяется пустой строкой. Чтобы убрать каждое уточнение отдельно, нужен ленивый `.*?` или `[^)]*`. Пробелы вокруг скобок `sub` не трогает — в шаблоне их нет.'
- id: csv-check-which
  type: multi
  q: 'Нужно проверить, что имя файла `name` оканчивается на `.csv` — в любом регистре букв. Какие проверки верны?'
  options:
  - '`name.lower().endswith(".csv")`'
  - '`re.search(r".csv", name)`'
  - '`re.fullmatch(r".*\.csv", name, re.I)`'
  - '`re.search(r"\.csv", name, re.I)`'
  answer:
  - 0
  - 2
  explain: 'Без экранирования точка в шаблоне — любой символ, и `search` ищет где угодно: подойдёт и «acsv», а «A.CSV» — нет, регистр важен. `search(r"\.csv", …, re.I)` найдёт «.csv» и в середине — «a.csv.bak» пройдёт. `fullmatch` с `.*` требует, чтобы вся строка кончалась на «.csv». Но проще и понятнее всех — метод строки: регулярка здесь не нужна.'
- id: code-fix-price-dot
  type: code
  q: |
    **Исправьте шаблон: программа должна вывести список всех цен вида `45.90` — цифры, точка, цифры.** Сейчас в список попадают и даты, и годы.
    ```input
    Хлеб 45.90, молоко 89.5, дата 17-05, 2024
    ```
    ```output
    ['45.90', '89.5']
    ```
  starter: |
    import re

    print(re.findall(r"\d+.\d+", input()))
  solution: |
    import re

    print(re.findall(r"\d+\.\d+", input()))
  tests:
    io:
    - name: Пример из условия
      stdin: "Хлеб 45.90, молоко 89.5, дата 17-05, 2024\n"
      stdout: "['45.90', '89.5']"
    - name: Целые цены не считаются
      stdin: "Итого 120 руб, скидка 0.5 руб\n"
      stdout: "['0.5']"
      hidden: true
    - name: Время и номер
      stdin: "Доставка 14:30, заказ 2024, сдача 3.25\n"
      stdout: "['3.25']"
      hidden: true
  explain: 'Точка в шаблоне — «любой символ, кроме перевода строки»: под `\d+.\d+` подходят «17-05» и даже «2024» — «2», «0», «24». Саму точку экранируют: `\.`.'
- id: code-fix-sms-code
  type: code
  q: |
    **Исправьте `is_sms_code(s)`: `True`, только если вся строка — ровно 4 цифры.**
    ```input
    is_sms_code("0420")
    is_sms_code("04201")
    ```
    ```output
    True
    False
    ```
  starter: |
    import re


    def is_sms_code(s):
        return bool(re.search(r"\d{4}", s))


    print(is_sms_code("0420"))
    print(is_sms_code("04201"))
  solution: |
    import re


    def is_sms_code(s):
        return bool(re.fullmatch(r"\d{4}", s))


    print(is_sms_code("0420"))
    print(is_sms_code("04201"))
  tests:
    asserts:
    - name: Верный код
      code: |
        for s in ["0420", "9999", "0000"]:
            assert is_sms_code(s) is True, f"is_sms_code({s!r}) должна вернуть True, а вернула {is_sms_code(s)!r}"
    - name: Лишние символы
      code: |
        for s in ["04201", "код 0420", "0420 ", "042", "", "04-20"]:
            assert is_sms_code(s) is False, f"is_sms_code({s!r}) должна вернуть False, а вернула {is_sms_code(s)!r}"
    - name: Перевод строки в конце
      code: |
        s = "0420\n"
        assert is_sms_code(s) is False, f"is_sms_code({s!r}) должна вернуть False: перевод строки — лишний символ, а вернула {is_sms_code(s)!r}"
  explain: '`search` отвечает на вопрос «есть ли где-то внутри четыре цифры подряд» — и находит их в пяти цифрах и в «код 0420». Для проверки формы всей строки — `fullmatch`. Вариант `search` с `^…$` пропустил бы «0420\n»: `$` подходит и перед последним переводом строки.'
- id: code-complete-date-to-iso
  type: code
  q: |
    **Допишите программу: в строке каждую дату вида `ДД.ММ.ГГГГ` замените на `ГГГГ-ММ-ДД`, остальной текст не меняйте.**
    День и месяц — ровно две цифры, год — четыре; другие записи («1.05.2024», «17.05.24») не трогайте.
    ```input
    Сдать до 17.05.2024, защита 03.06.2024
    ```
    ```output
    Сдать до 2024-05-17, защита 2024-06-03
    ```
  starter: |
    import re

    text = input()
    # дата вида 17.05.2024 -> 2024-05-17

    print(text)
  solution: |
    import re

    text = input()
    # дата вида 17.05.2024 -> 2024-05-17
    text = re.sub(r"(\d{2})\.(\d{2})\.(\d{4})", r"\3-\2-\1", text)
    print(text)
  tests:
    io:
    - name: Пример из условия
      stdin: "Сдать до 17.05.2024, защита 03.06.2024\n"
      stdout: "Сдать до 2024-05-17, защита 2024-06-03"
    - name: Не даты не меняются
      stdin: "Старый срок 1.05.2024 и 17.05.24, цена 45.90\n"
      stdout: "Старый срок 1.05.2024 и 17.05.24, цена 45.90"
      hidden: true
    - name: Без дат и дата в начале
      stdin: "31.12.2023 — Новый год\n"
      stdout: "2023-12-31 — Новый год"
      hidden: true
    - name: Дефисы вместо точек
      stdin: "Дата 17-05-2024 и 17.05.2024\n"
      stdout: "Дата 17-05-2024 и 2024-05-17"
      hidden: true
  explain: 'Каждая часть даты — в своих скобках, поэтому в строке замены на неё можно сослаться: `\3` — год, `\2` — месяц, `\1` — день. Точки экранированы — иначе «17-05-2024» тоже бы подошла. Строку замены пишут сырой: в обычной `"\3"` — служебный символ с номером 3, а не ссылка на группу.'
- id: code-fix-greedy-bold
  type: code
  q: |
    **Исправьте `bold_words(text)`: вернуть список всех кусков текста между парами `**` — как в разметке заметок.** Сейчас на двух выделениях в строке функция возвращает один длинный кусок.
    ```input
    bold_words("Купить **хлеб** и **молоко**")
    ```
    ```output
    ['хлеб', 'молоко']
    ```
    - Выделение не бывает пустым и не переходит на другую строку текста.
  starter: |
    import re


    def bold_words(text):
        return re.findall(r"\*\*(.+)\*\*", text)


    print(bold_words("Купить **хлеб** и **молоко**"))
  solution: |
    import re


    def bold_words(text):
        return re.findall(r"\*\*(.+?)\*\*", text)


    print(bold_words("Купить **хлеб** и **молоко**"))
  tests:
    asserts:
    - name: Два выделения
      code: |
        got = bold_words("Купить **хлеб** и **молоко**")
        assert got == ["хлеб", "молоко"], f"Нужно ['хлеб', 'молоко'], а вернулось {got!r}"
    - name: Выделение из нескольких слов и одно выделение
      code: |
        got = bold_words("**Срочно:** позвонить **в банк до 18:00**!")
        assert got == ["Срочно:", "в банк до 18:00"], f"Нужно ['Срочно:', 'в банк до 18:00'], а вернулось {got!r}"
        got = bold_words("Только **одно**")
        assert got == ["одно"], f"Нужно ['одно'], а вернулось {got!r}"
    - name: Выделений нет
      code: |
        for t in ["просто текст", "2 * 3 = 6", "**"]:
            got = bold_words(t)
            assert got == [], f"bold_words({t!r}) должна вернуть [], а вернула {got!r}"
    - name: Выделения в разных строках текста
      code: |
        got = bold_words("**Пн**: зал\n**Вт**: бассейн")
        assert got == ["Пн", "Вт"], f"Нужно ['Пн', 'Вт'], а вернулось {got!r}"
  explain: '`.+` жадный: он дотягивается до последней пары `**` в строке, и всё между первой и последней парой становится одним куском. `?` после квантификатора делает его ленивым — `.+?` останавливается на первой подходящей паре. Звёздочки экранированы: `\*` — сам символ, а не квантификатор.'
- id: code-write-parse-order
  type: code
  q: |
    **Напишите `parse_order(line)`: найти в строке запись `Заказ №<номер>: <количество> шт. по <цена> руб.` и вернуть кортеж трёх целых чисел; если записи нет — `None`.**
    Номер, количество и цена — цифры; между словами запись может содержать один пробел или больше.
    ```input
    parse_order("Новый! Заказ №15: 3 шт. по 120 руб.")
    parse_order("Заказ №15: три шт. по 120 руб.")
    ```
    ```output
    (15, 3, 120)
    None
    ```
  starter: |
    import re


    def parse_order(line):
        pass


    print(parse_order("Новый! Заказ №15: 3 шт. по 120 руб."))
  solution: |
    import re


    def parse_order(line):
        m = re.search(r"Заказ №(\d+):\s+(\d+)\s+шт\.\s+по\s+(\d+)\s+руб\.", line)
        if not m:
            return None
        return int(m.group(1)), int(m.group(2)), int(m.group(3))


    print(parse_order("Новый! Заказ №15: 3 шт. по 120 руб."))
  tests:
    asserts:
    - name: Запись в строке есть
      code: |
        for line, want in [("Новый! Заказ №15: 3 шт. по 120 руб.", (15, 3, 120)), ("Заказ №7:  2 шт.   по 45 руб. Доставка завтра", (7, 2, 45)), ("Заказ №1024: 10 шт. по 1500 руб.", (1024, 10, 1500))]:
            got = parse_order(line)
            assert got == want, f"parse_order({line!r}) должна вернуть {want}, а вернула {got!r}"
    - name: Числа — int, а не строки
      code: |
        got = parse_order("Заказ №15: 3 шт. по 120 руб.")
        assert got is not None and all(type(x) is int for x in got), f"Нужен кортеж целых чисел, а вернулось {got!r}"
    - name: Записи нет — None
      code: |
        for line in ["Заказ №15: три шт. по 120 руб.", "Заказ №: 3 шт. по 120 руб.", "Заказ №15: 3 шт по 120 руб.", "Заказ №15: 3 шт. по 120 руб", "Заказ №15: 3 шт, по 120 руб.", "Заказ №15: 3 шт. по 120 рубля", ""]:
            got = parse_order(line)
            assert got is None, f"parse_order({line!r}) должна вернуть None, а вернула {got!r}"
  explain: 'Части, которые нужно достать, — в группах, остальное шаблона только описывает форму. Точки после «шт» и «руб» экранированы: без этого подошли бы «шт,» и строка без точки. `search` возвращает `None`, если записи нет, — его проверяют до `group`, иначе будет `AttributeError`. Группы дают строки, числами их делает `int`.'
- id: code-write-mask-cards
  type: code
  q: |
    **Напишите `mask_cards(text)`: заменить каждый номер карты на `**** **** **** NNNN`, где `NNNN` — его последние четыре цифры; остальной текст не менять.**
    Номер карты — ровно 16 цифр: подряд или четыре группы по четыре через пробел. Числа из большего количества цифр — не номера карт.
    ```input
    mask_cards("Карта 1234 5678 9012 3456, вторая 1111222233334444.")
    ```
    ```output
    Карта **** **** **** 3456, вторая **** **** **** 4444.
    ```
  starter: |
    import re


    def mask_cards(text):
        pass


    print(mask_cards("Карта 1234 5678 9012 3456, вторая 1111222233334444."))
  solution: |
    import re


    def mask_cards(text):
        return re.sub(r"\b(\d{4}) ?(\d{4}) ?(\d{4}) ?(\d{4})\b", r"**** **** **** \4", text)


    print(mask_cards("Карта 1234 5678 9012 3456, вторая 1111222233334444."))
  tests:
    asserts:
    - name: Пример из условия
      code: |
        got = mask_cards("Карта 1234 5678 9012 3456, вторая 1111222233334444.")
        want = "Карта **** **** **** 3456, вторая **** **** **** 4444."
        assert got == want, f"Нужно {want!r}, а вернулось {got!r}"
    - name: Номер — вся строка
      code: |
        got = mask_cards("4276 1600 1234 5678")
        assert got == "**** **** **** 5678", f"Нужно '**** **** **** 5678', а вернулось {got!r}"
    - name: Другие числа не меняются
      code: |
        for t in ["Счёт 12345678901234567", "тел. 89123456789", "Заказ 1234 5678", "ИНН 123456789012", "без цифр"]:
            got = mask_cards(t)
            assert got == t, f"В {t!r} нет номера карты — текст не должен меняться, а вернулось {got!r}"
  explain: 'Последние четыре цифры — в отдельной группе, и строка замены ссылается на неё: `\4`. Необязательный пробел между группами — `" ?"`. `\b` по краям не даёт найти 16 цифр внутри 17-значного счёта: граница слова есть только там, где цифры кончаются. Без `\b` шаблон замаскировал бы кусок номера счёта.'
