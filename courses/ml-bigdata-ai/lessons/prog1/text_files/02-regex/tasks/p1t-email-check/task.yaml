id: p1t-email-check
title: Упрощённая проверка почты
sandbox: python-browser
difficulty: 3
statement: |
  **Напишите функцию `is_email(s)`, которая возвращает `True`, если адрес подходит под упрощённое правило ниже, иначе — `False`.**

  `s` — строка, берётся как есть. Правило (настоящее правило записи адреса намного сложнее, здесь оно не нужно):
  - ровно один `@`;
  - до `@` — от 1 до 64 символов: латинские буквы, цифры, `.`, `_`, `-`;
  - после `@` — домен: две или больше частей через точку, каждая часть — одна или больше латинских букв, цифр или `-`;
  - последняя часть домена — только латинские буквы, не меньше двух.

  Пример 1
  ```call
  is_email("anna.petrova_1@yandex.ru")
  ```
  ```return
  True
  ```

  Пример 2
  ```call
  is_email("anna@mail")
  ```
  ```return
  False
  ```

  Пример 3
  ```call
  is_email("анна@mail.ru")
  ```
  ```return
  False
  ```
starter: |
  import re


  def is_email(s):
      # План:
      # 1. Проверить число «@», разрезать на имя и домен
      # 2. Имя — проверка формы всей строки: набор символов и длина
      # 3. Домен — разрезать по точкам и проверить каждую часть,
      #    отдельно последнюю
      pass


  print(is_email("ivan@mail.spb.ru"))
solution: |
  import re


  def is_email(s):
      if s.count("@") != 1:
          return False
      name, domain = s.split("@")
      if not re.fullmatch(r"[A-Za-z0-9._-]{1,64}", name):
          return False
      parts = domain.split(".")
      if len(parts) < 2:
          return False
      for part in parts:
          if not re.fullmatch(r"[A-Za-z0-9-]+", part):
              return False
      return bool(re.fullmatch(r"[A-Za-z]{2,}", parts[-1]))


  print(is_email("ivan@mail.spb.ru"))
tests:
  function: is_email
  calls:
    - name: Пример 1
      args: ["anna.petrova_1@yandex.ru"]
      expect: true
    - name: Домен из трёх частей
      args: ["ivan@mail.spb.ru"]
      expect: true
    - name: Пример 2 — домен из одной части
      args: ["anna@mail"]
      expect: false
    - name: Пример 3 — кириллица в имени
      args: ["анна@mail.ru"]
      expect: false
    - name: Короткий верный адрес
      args: ["a@b.co"]
      expect: true
      hidden: true
    - name: Заглавные буквы
      args: ["IVAN@MAIL.RU"]
      expect: true
      hidden: true
    - name: Дефисы
      args: ["my-shop@my-site.com"]
      expect: true
      hidden: true
    - name: Два «@»
      args: ["anna@@mail.ru"]
      expect: false
      hidden: true
    - name: Пустое имя
      args: ["@mail.ru"]
      expect: false
      hidden: true
    - name: Пробел в имени
      args: ["anna mail@mail.ru"]
      expect: false
      hidden: true
    - name: Нет «@»
      args: ["annamail.ru"]
      expect: false
      hidden: true
    - name: Две точки подряд
      args: ["anna@mail..ru"]
      expect: false
      hidden: true
    - name: Точка в начале домена
      args: ["anna@.ru"]
      expect: false
      hidden: true
    - name: Точка в конце
      args: ["anna@mail.ru."]
      expect: false
      hidden: true
    - name: Подчёркивание в домене
      args: ["anna@mail_ru.com"]
      expect: false
      hidden: true
    - name: Последняя часть из одной буквы
      args: ["anna@mail.r"]
      expect: false
      hidden: true
    - name: Цифра в последней части
      args: ["anna@mail.ru1"]
      expect: false
      hidden: true
    - name: Кириллица в последней части
      args: ["anna@mail.рф"]
      expect: false
      hidden: true
    - name: Имя из 64 символов
      args: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@mail.ru"]
      expect: true
      hidden: true
    - name: Имя из 65 символов
      args: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@mail.ru"]
      expect: false
      hidden: true
hints:
  - level: 1
    text: 'Одним шаблоном такое правило не записать коротко — и не нужно. Разбейте адрес методами строк на части и проверяйте каждую своим простым шаблоном.'
  - level: 2
    text: 'Проверка формы части — `fullmatch`: `search` найдёт подходящий кусок внутри неподходящей строки. `\w` не годится: он пропускает кириллицу.'
  - level: 3
    text: 'Пустая часть домена — признак двух точек подряд или точки с краю: `"mail..ru".split(".")` даёт пустую строку в середине. Шаблон с `+` такую часть не пропустит.'
