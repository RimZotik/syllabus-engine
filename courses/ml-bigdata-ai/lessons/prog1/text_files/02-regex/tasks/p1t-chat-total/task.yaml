id: p1t-chat-total
title: Сколько потратили по переписке
sandbox: python-browser
difficulty: 1
statement: |
  **Найдите в переписке все суммы в рублях и выведите `Итого: N руб`.**

  Ввод — сообщения по одному в строке, в конце пустая строка. Сумма — целое число из цифр подряд, за которым сразу или через один пробел идёт «руб»; «руб» может быть началом слова: «1500 рублей» — тоже сумма. Остальные числа (количество, время, даты) — не суммы.

  Пример 1
  ```input
  Купила 2 пачки чая по 150 руб
  и хлеб за 45руб, итого вышло 345 руб.
  Встречаемся в 18:30

  ```
  ```output
  Итого: 540 руб
  ```

  Пример 2
  ```input
  Ничего не купили

  ```
  ```output
  Итого: 0 руб
  ```
starter: |
  import re

  # План:
  # 1. Читать строки до пустой
  # 2. В каждой найти все суммы: группа — только цифры,
  #    после неё необязательный пробел и «руб»
  # 3. Сложить числа и вывести итог
stdin: "Купила 2 пачки чая по 150 руб\nи хлеб за 45руб, итого вышло 345 руб.\nВстречаемся в 18:30\n\n"
solution: |
  import re

  total = 0
  line = input()
  while line != "":
      for amount in re.findall(r"(\d+) ?руб", line):
          total += int(amount)
      line = input()
  print(f"Итого: {total} руб")
tests:
  io:
    - name: Пример 1
      stdin: "Купила 2 пачки чая по 150 руб\nи хлеб за 45руб, итого вышло 345 руб.\nВстречаемся в 18:30\n\n"
      stdout: "Итого: 540 руб"
    - name: Пример 2
      stdin: "Ничего не купили\n\n"
      stdout: "Итого: 0 руб"
    - name: Несколько сумм в строке
      stdin: "такси 380 руб, кофе 220руб, чаевые 50 руб\n\n"
      stdout: "Итого: 650 руб"
      hidden: true
    - name: Два пробела и слово без числа
      stdin: "скидка 100  руб не дали\nсколько руб?\n17.05 заплатил 1500 рублей\n\n"
      stdout: "Итого: 1500 руб"
      hidden: true
    - name: Число в начале строки
      stdin: "300 руб за доставку\n\n"
      stdout: "Итого: 300 руб"
      hidden: true
hints:
  - level: 1
    text: 'Опишите форму суммы словами: «одна или больше цифр, потом, может быть, пробел, потом руб». Каждую часть этой фразы можно записать шаблоном.'
  - level: 2
    text: 'Нужны только цифры, а «руб» — лишь признак суммы. Какой вызов `findall` вернёт только часть совпадения?'
  - level: 3
    text: '`findall` с одной группой возвращает список строк — их нужно перевести в числа перед сложением.'
