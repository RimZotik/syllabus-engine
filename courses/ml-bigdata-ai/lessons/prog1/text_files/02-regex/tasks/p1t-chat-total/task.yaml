id: p1t-chat-total
title: Сколько потратили по переписке
sandbox: python-browser
difficulty: 1
statement: |
  **Напишите функцию `chat_total(text)`, которая находит в переписке все суммы в рублях и возвращает их сумму — целое число.**

  `text` — строка, сообщения в ней разделены переводами строк. Сумма — целое число из цифр подряд, за которым сразу или через один пробел идёт «руб»; «руб» может быть началом слова: «1500 рублей» — тоже сумма. Остальные числа (количество, время, даты) — не суммы. Сумм нет — `0`.

  Пример 1
  ```call
  chat_total("Купила 2 пачки чая по 150 руб\nи хлеб за 45руб, итого вышло 345 руб.\nВстречаемся в 18:30")
  ```
  ```return
  540
  ```

  Пример 2
  ```call
  chat_total("Ничего не купили")
  ```
  ```return
  0
  ```
starter: |
  import re


  def chat_total(text):
      # План:
      # 1. Найти все суммы: группа — только цифры,
      #    после неё необязательный пробел и «руб»
      # 2. Перевести найденное в числа и сложить
      pass


  print(chat_total("такси 380 руб, кофе 220руб"))
solution: |
  import re


  def chat_total(text):
      total = 0
      for amount in re.findall(r"(\d+) ?руб", text):
          total += int(amount)
      return total


  print(chat_total("такси 380 руб, кофе 220руб"))
tests:
  function: chat_total
  calls:
    - name: Пример 1
      args: ["Купила 2 пачки чая по 150 руб\nи хлеб за 45руб, итого вышло 345 руб.\nВстречаемся в 18:30"]
      expect: 540
    - name: Пример 2
      args: ["Ничего не купили"]
      expect: 0
    - name: Несколько сумм в строке
      args: ["такси 380 руб, кофе 220руб, чаевые 50 руб"]
      expect: 650
      hidden: true
    - name: Два пробела и слово без числа
      args: ["скидка 100  руб не дали\nсколько руб?\n17.05 заплатил 1500 рублей"]
      expect: 1500
      hidden: true
    - name: Число в начале строки
      args: ["300 руб за доставку"]
      expect: 300
      hidden: true
    - name: Пустая переписка
      args: [""]
      expect: 0
      hidden: true
hints:
  - level: 1
    text: 'Опишите форму суммы словами: «одна или больше цифр, потом, может быть, пробел, потом руб». Каждую часть этой фразы можно записать шаблоном.'
  - level: 2
    text: 'Нужны только цифры, а «руб» — лишь признак суммы. Какой вызов `findall` вернёт только часть совпадения?'
  - level: 3
    text: '`findall` с одной группой возвращает список строк — их нужно перевести в числа перед сложением. Чтобы увидеть, что нашёл шаблон, добавьте `print(re.findall(...))` — он не влияет на проверку.'
