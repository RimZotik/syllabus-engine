id: p1t-ai-dates
title: ИИ-ассистент переводит даты
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте функцию `iso_to_ru(text)`: она должна возвращать текст, где каждая дата вида `ГГГГ-ММ-ДД` заменена на `ДД.ММ.ГГГГ`, а остальное не изменилось.**

  `text` — строка, функция возвращает новую строку. Дата — ровно 4 цифры, дефис, 2 цифры, дефис, 2 цифры. Код в редакторе написал ИИ-ассистент. Ошибок две: одна видна уже на примере 1, другая — на примере 2.

  Пример 1
  ```call
  iso_to_ru("Отгрузка 2024-05-17, оплата 2024-05-20")
  ```
  ```return
  "Отгрузка 17.05.2024, оплата 20.05.2024"
  ```

  Пример 2
  ```call
  iso_to_ru("Звоните 8-800-2000, доставка 2024-06-01")
  ```
  ```return
  "Звоните 8-800-2000, доставка 01.06.2024"
  ```
starter: |
  # Решение от ИИ-ассистента
  import re


  def iso_to_ru(text):
      return re.sub(r"(\d+)-(\d+)-(\d+)", "\3.\2.\1", text)


  print(iso_to_ru("Отгрузка 2024-05-17, оплата 2024-05-20"))
  print(iso_to_ru("Звоните 8-800-2000, доставка 2024-06-01"))
solution: |
  import re


  def iso_to_ru(text):
      return re.sub(r"(\d{4})-(\d{2})-(\d{2})", r"\3.\2.\1", text)


  print(iso_to_ru("Отгрузка 2024-05-17, оплата 2024-05-20"))
  print(iso_to_ru("Звоните 8-800-2000, доставка 2024-06-01"))
tests:
  function: iso_to_ru
  calls:
    - name: Пример 1
      args: ["Отгрузка 2024-05-17, оплата 2024-05-20"]
      expect: "Отгрузка 17.05.2024, оплата 20.05.2024"
    - name: Пример 2
      args: ["Звоните 8-800-2000, доставка 2024-06-01"]
      expect: "Звоните 8-800-2000, доставка 01.06.2024"
    - name: Дата — весь текст
      args: ["1999-12-31"]
      expect: "31.12.1999"
    - name: Две пары цифр — не дата
      args: ["Счёт 12-34-56"]
      expect: "Счёт 12-34-56"
      hidden: true
    - name: Месяц одной цифрой — не дата
      args: ["Код 2024-5-17"]
      expect: "Код 2024-5-17"
      hidden: true
    - name: Короткие числа через дефис
      args: ["Номер 1-2-3"]
      expect: "Номер 1-2-3"
      hidden: true
    - name: Текст без дат
      args: ["без дат"]
      expect: "без дат"
      hidden: true
hints:
  - level: 1
    text: 'Посмотрите внимательно на результат примера 1: что стоит на месте даты? Сравните строку замены с шаблоном — чем они записаны по-разному?'
  - level: 2
    text: 'В обычной строке обратная косая черта начинает особое сочетание ещё до того, как строка дойдёт до `re`. Как это было с `\b`?'
  - level: 3
    text: 'Вторая ошибка — в шаблоне: `\d+` не говорит, сколько цифр в каждой части даты. Чем задать ровно 4 и ровно 2?'
