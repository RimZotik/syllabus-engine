id: p1t-ai-dates
title: ИИ-ассистент переводит даты
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте `iso_to_ru(text)`: заменить в тексте каждую дату вида `ГГГГ-ММ-ДД` на `ДД.ММ.ГГГГ`, остальной текст не менять.**

  Дата — ровно 4 цифры, дефис, 2 цифры, дефис, 2 цифры. Код в редакторе написал ИИ-ассистент. Ошибок две: одна видна уже на примере 1, другая — на примере 2.

  Пример 1
  ```input
  iso_to_ru("Отгрузка 2024-05-17, оплата 2024-05-20")
  ```
  ```output
  Отгрузка 17.05.2024, оплата 20.05.2024
  ```

  Пример 2
  ```input
  iso_to_ru("Звоните 8-800-2000, доставка 2024-06-01")
  ```
  ```output
  Звоните 8-800-2000, доставка 01.06.2024
  ```
starter: |
  # Решение от ИИ-ассистента
  import re


  def iso_to_ru(text):
      return re.sub(r"(\d+)-(\d+)-(\d+)", "\3.\2.\1", text)


  print(iso_to_ru("Отгрузка 2024-05-17, оплата 2024-05-20"))
  print(iso_to_ru("Звоните 8-800-2000, доставка 2024-06-01"))
solution: |
  import re


  def iso_to_ru(text):
      return re.sub(r"(\d{4})-(\d{2})-(\d{2})", r"\3.\2.\1", text)


  print(iso_to_ru("Отгрузка 2024-05-17, оплата 2024-05-20"))
  print(iso_to_ru("Звоните 8-800-2000, доставка 2024-06-01"))
tests:
  asserts:
    - name: Пример 1
      code: |
        got = iso_to_ru("Отгрузка 2024-05-17, оплата 2024-05-20")
        want = "Отгрузка 17.05.2024, оплата 20.05.2024"
        assert got == want, f"Нужно {want!r}, а вернулось {got!r}"
    - name: Пример 2
      code: |
        got = iso_to_ru("Звоните 8-800-2000, доставка 2024-06-01")
        want = "Звоните 8-800-2000, доставка 01.06.2024"
        assert got == want, f"Нужно {want!r}, а вернулось {got!r}"
    - name: Не даты не меняются
      code: |
        for t in ["Счёт 12-34-56", "Код 2024-5-17", "Номер 1-2-3", "без дат"]:
            got = iso_to_ru(t)
            assert got == t, f"В {t!r} нет даты ГГГГ-ММ-ДД — текст не должен меняться, а вернулось {got!r}"
    - name: Дата — весь текст
      code: |
        got = iso_to_ru("1999-12-31")
        assert got == "31.12.1999", f"Нужно '31.12.1999', а вернулось {got!r}"
hints:
  - level: 1
    text: 'Посмотрите внимательно на результат примера 1: что стоит на месте даты? Сравните строку замены с шаблоном — чем они записаны по-разному?'
  - level: 2
    text: 'В обычной строке обратная косая черта начинает особое сочетание ещё до того, как строка дойдёт до `re`. Как это было с `\b`?'
  - level: 3
    text: 'Вторая ошибка — в шаблоне: `\d+` не говорит, сколько цифр в каждой части даты. Чем задать ровно 4 и ровно 2?'
