id: p1t-phone
title: Телефоны к одному виду
sandbox: python-browser
difficulty: 2
statement: |
  **Приведите каждый номер телефона к виду `+7XXXXXXXXXX`, а неподходящий замените на `неверный номер`.**

  Ввод — номера по одному в строке, в конце пустая строка. В номере допустимы только цифры, пробелы, `+`, `-` и скобки — любой другой символ делает номер неверным. Из допустимых символов значат только цифры: 11 цифр, первая 7 или 8, — российский номер, от него остаются последние 10 цифр; 10 цифр, первая 9, — номер без кода страны. Другое число цифр — неверный номер.

  Пример 1
  ```input
  +7 (912) 345-67-89
  8 912 345 67 89
  9123456789
  8 912 ABC 67 89

  ```
  ```output
  +79123456789
  +79123456789
  +79123456789
  неверный номер
  ```
starter: |
  import re

  # План:
  # 1. Функция normalize(s): проверить, что вся строка из допустимых
  #    символов; оставить только цифры; по числу цифр и первой цифре
  #    вернуть номер или «неверный номер»
  # 2. Читать номера до пустой строки и печатать результат
stdin: "+7 (912) 345-67-89\n8 912 345 67 89\n9123456789\n8 912 ABC 67 89\n\n"
solution: |
  import re


  def normalize(s):
      if not re.fullmatch(r"[\d +()-]+", s):
          return "неверный номер"
      digits = re.sub(r"\D", "", s)
      if len(digits) == 11 and digits[0] in "78":
          return "+7" + digits[1:]
      if len(digits) == 10 and digits[0] == "9":
          return "+7" + digits
      return "неверный номер"


  line = input()
  while line != "":
      print(normalize(line))
      line = input()
tests:
  io:
    - name: Пример 1
      stdin: "+7 (912) 345-67-89\n8 912 345 67 89\n9123456789\n8 912 ABC 67 89\n\n"
      stdout: "+79123456789\n+79123456789\n+79123456789\nневерный номер"
    - name: Бесплатная линия и слитная запись
      stdin: "8-800-555-35-35\n+7(912)3456789\n\n"
      stdout: "+78005553535\n+79123456789"
      hidden: true
    - name: Не хватает цифры и лишняя цифра
      stdin: "+7 912 345 67 8\n8 912 345 67 890\n\n"
      stdout: "неверный номер\nневерный номер"
      hidden: true
    - name: Чужой код страны
      stdin: "+1 202 555 01 23\n12345678901\n\n"
      stdout: "неверный номер\nневерный номер"
      hidden: true
    - name: Десять цифр не с девятки
      stdin: "4951234567\n\n"
      stdout: "неверный номер"
      hidden: true
    - name: Посторонние знаки
      stdin: "8 912 345 67 89 доб. 12\n8.912.345.67.89\n+7 912 345-67-89\n\n"
      stdout: "неверный номер\nневерный номер\n+79123456789"
      hidden: true
hints:
  - level: 1
    text: 'Здесь две проверки разного рода: «вся строка из допустимых символов» и «сколько цифр и какая первая». Первая — про форму всей строки; какая функция `re` отвечает именно на такой вопрос?'
  - level: 2
    text: 'Оставить одни цифры — значит заменить каждую «не цифру» пустой строкой. В наборе `[...]` дефис ставят последним, чтобы он не читался как диапазон.'
  - level: 3
    text: 'Когда цифры получены, шаблон больше не нужен: длина строки, первый символ и срез решают остальное.'
