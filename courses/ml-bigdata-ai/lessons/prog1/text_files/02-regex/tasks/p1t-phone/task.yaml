id: p1t-phone
title: Телефоны к одному виду
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите функцию `normalize(s)`, которая возвращает номер телефона в виде `+7XXXXXXXXXX`, а для неподходящего номера — строку `неверный номер`.**

  `s` — строка с номером. В номере допустимы только цифры, пробелы, `+`, `-` и скобки — любой другой символ делает номер неверным. Из допустимых символов значат только цифры: 11 цифр, первая 7 или 8, — российский номер, от него остаются последние 10 цифр; 10 цифр, первая 9, — номер без кода страны. Другое число цифр — неверный номер.

  Пример 1
  ```call
  normalize("+7 (912) 345-67-89")
  ```
  ```return
  "+79123456789"
  ```

  Пример 2
  ```call
  normalize("9123456789")
  ```
  ```return
  "+79123456789"
  ```

  Пример 3
  ```call
  normalize("8 912 ABC 67 89")
  ```
  ```return
  "неверный номер"
  ```
starter: |
  import re


  def normalize(s):
      # План:
      # 1. Проверить, что вся строка из допустимых символов
      # 2. Оставить только цифры
      # 3. По числу цифр и первой цифре вернуть номер или «неверный номер»
      pass


  print(normalize("8 912 345 67 89"))
solution: |
  import re


  def normalize(s):
      if not re.fullmatch(r"[\d +()-]+", s):
          return "неверный номер"
      digits = re.sub(r"\D", "", s)
      if len(digits) == 11 and digits[0] in "78":
          return "+7" + digits[1:]
      if len(digits) == 10 and digits[0] == "9":
          return "+7" + digits
      return "неверный номер"


  print(normalize("8 912 345 67 89"))
tests:
  function: normalize
  calls:
    - name: Пример 1
      args: ["+7 (912) 345-67-89"]
      expect: "+79123456789"
    - name: Начинается с 8
      args: ["8 912 345 67 89"]
      expect: "+79123456789"
    - name: Пример 2 — без кода страны
      args: ["9123456789"]
      expect: "+79123456789"
    - name: Пример 3 — буквы в номере
      args: ["8 912 ABC 67 89"]
      expect: "неверный номер"
    - name: Бесплатная линия
      args: ["8-800-555-35-35"]
      expect: "+78005553535"
      hidden: true
    - name: Слитная запись
      args: ["+7(912)3456789"]
      expect: "+79123456789"
      hidden: true
    - name: Не хватает цифры
      args: ["+7 912 345 67 8"]
      expect: "неверный номер"
      hidden: true
    - name: Лишняя цифра
      args: ["8 912 345 67 890"]
      expect: "неверный номер"
      hidden: true
    - name: Чужой код страны
      args: ["+1 202 555 01 23"]
      expect: "неверный номер"
      hidden: true
    - name: 11 цифр не с 7 и не с 8
      args: ["12345678901"]
      expect: "неверный номер"
      hidden: true
    - name: Десять цифр не с девятки
      args: ["4951234567"]
      expect: "неверный номер"
      hidden: true
    - name: Добавочный номер словами
      args: ["8 912 345 67 89 доб. 12"]
      expect: "неверный номер"
      hidden: true
    - name: Точки вместо пробелов
      args: ["8.912.345.67.89"]
      expect: "неверный номер"
      hidden: true
    - name: Пробелы и дефисы
      args: ["+7 912 345-67-89"]
      expect: "+79123456789"
      hidden: true
hints:
  - level: 1
    text: 'Здесь две проверки разного рода: «вся строка из допустимых символов» и «сколько цифр и какая первая». Первая — про форму всей строки; какая функция `re` отвечает именно на такой вопрос?'
  - level: 2
    text: 'Оставить одни цифры — значит заменить каждую «не цифру» пустой строкой. В наборе `[...]` дефис ставят последним, чтобы он не читался как диапазон.'
  - level: 3
    text: 'Когда цифры получены, шаблон больше не нужен: длина строки, первый символ и срез решают остальное.'
