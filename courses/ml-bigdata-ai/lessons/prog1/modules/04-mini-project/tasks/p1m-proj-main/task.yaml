id: p1m-proj-main
title: 'Шаг 3. Основная программа: от CSV к отчёту'
sandbox: python-browser
difficulty: 3
statement: |
  **Напишите основную программу проекта: `load(path)` читает таблицу расходов, `main()` пишет `report.json` и печатает итог.**

  - `load(path)` открывает CSV с `encoding="utf-8-sig"` (файл может начинаться с невидимой метки Excel) и `newline=""`, читает строки через `csv.DictReader` и каждую разбирает `clean.parse_row`. Строку, на которой та выбросила `ValueError`, пропускает и запоминает `{"строка": номер, "причина": текст исключения}`; номер — как в редакторе, заголовок — строка 1. Возвращает кортеж `(записи, пропущенные)`.
  - `main()` читает `expenses.csv` и пишет в `report.json` словарь с ключами `всего`, `по категориям` (`summary.by_category`), `по месяцам` (`summary.by_month`), `пропущено` — в этом порядке; все суммы округлены через `round(…, 2)`. Запись — `json.dump(отчёт, f, ensure_ascii=False, indent=2)`, файл открыт с `encoding="utf-8"`. Печатает `записей: N пропущено: M`.
  - `main()` вызывается под `if __name__ == "__main__":`: при `import main` программа ничего не печатает и не пишет.

  Модули `clean.py`, `summary.py` и таблица `expenses.csv` — на вкладках.

  Пример 1
  ```input
  (входа нет; expenses.csv — на вкладке)
  ```
  ```output
  записей: 5 пропущено: 2
  ```
  `report.json` после запуска:
  ```
  {
    "всего": 2700.5,
    "по категориям": {
      "продукты": 2140.5,
      "транспорт": 180.0,
      "кафе": 380.0
    },
    "по месяцам": {
      "2024-05": 2200.5,
      "2024-06": 500.0
    },
    "пропущено": [
      {
        "строка": 5,
        "причина": "пустая сумма"
      },
      {
        "строка": 7,
        "причина": "Invalid isoformat string: '06.06.2024'"
      }
    ]
  }
  ```
starter: |
  import csv
  import json

  import clean
  import summary


  def load(path):
      """Путь к CSV → (записи, пропущенные строки с номером и причиной)."""
      pass


  def main():
      """Читает expenses.csv, пишет report.json, печатает итог."""
      pass
solution: |
  import csv
  import json

  import clean
  import summary


  def load(path):
      """Путь к CSV → (записи, пропущенные строки с номером и причиной)."""
      records, skipped = [], []
      with open(path, encoding="utf-8-sig", newline="") as f:
          for line_no, row in enumerate(csv.DictReader(f), start=2):
              try:
                  records.append(clean.parse_row(row))
              except ValueError as e:
                  skipped.append({"строка": line_no, "причина": str(e)})
      return records, skipped


  def rounded(totals):
      """Те же суммы, округлённые до копеек."""
      return {key: round(value, 2) for key, value in totals.items()}


  def main():
      """Читает expenses.csv, пишет report.json, печатает итог."""
      records, skipped = load("expenses.csv")
      report = {
          "всего": round(sum(r["amount"] for r in records), 2),
          "по категориям": rounded(summary.by_category(records)),
          "по месяцам": rounded(summary.by_month(records)),
          "пропущено": skipped,
      }
      with open("report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, ensure_ascii=False, indent=2)
      print("записей:", len(records), "пропущено:", len(skipped))


  if __name__ == "__main__":
      main()
tests:
  files:
    clean.py: |
      """Разбор и очистка строк таблицы расходов."""
      import math
      from datetime import date


      def parse_amount(text):
          """'1 250,50' → 1250.5; пустой текст, не число или nan — ValueError."""
          cleaned = text.replace(" ", "").replace("\xa0", "").replace(",", ".")
          if not cleaned:
              raise ValueError("пустая сумма")
          amount = float(cleaned)
          if math.isnan(amount):
              raise ValueError(f"не число: {text}")
          return amount


      def clean_category(text):
          """' Продукты ' → 'продукты'; пустая категория — ValueError."""
          category = text.strip().lower()
          if not category:
              raise ValueError("пустая категория")
          return category


      def parse_row(row):
          """Словарь из csv.DictReader → запись {'date', 'category', 'amount'}; плохая строка — ValueError."""
          if row.get("дата") is None or row.get("категория") is None or row.get("сумма") is None:
              raise ValueError("не хватает полей")
          return {
              "date": date.fromisoformat(row["дата"].strip()),
              "category": clean_category(row["категория"]),
              "amount": parse_amount(row["сумма"]),
          }
    summary.py: |
      """Сводки по готовым записям расходов."""
      from collections import defaultdict


      def by_category(records):
          """Сумма расходов по каждой категории, в порядке первого появления."""
          totals = defaultdict(float)
          for r in records:
              totals[r["category"]] += r["amount"]
          return dict(totals)


      def by_month(records):
          """Сумма расходов по месяцам: ключ — 'ГГГГ-ММ'."""
          totals = defaultdict(float)
          for r in records:
              totals[r["date"].strftime("%Y-%m")] += r["amount"]
          return dict(totals)
    expenses.csv: |
      дата,категория,сумма
      2024-05-03, Продукты ,"1 250,50"
      2024-05-03,Транспорт,60
