  asserts:
    - name: import main молчит и не пишет отчёт
      code: |
        import io as _io, contextlib as _cl, os as _os
        if _os.path.exists("report.json"):
            _os.remove("report.json")
        _buf = _io.StringIO()
        with _cl.redirect_stdout(_buf):
            import main
        assert _buf.getvalue() == "", f"При import main напечаталось {_buf.getvalue()!r}: вызов main() должен стоять под if __name__ == \"__main__\""
        assert not _os.path.exists("report.json"), "При import main появился report.json: при импорте программа не должна ничего записывать"
    - name: load возвращает записи и пропуски
      code: |
        recs, skipped = load("expenses.csv")
        assert len(recs) == 5, f"load(\"expenses.csv\") должна вернуть 5 записей, а вернула {len(recs)}"
        assert skipped == [{"строка": 5, "причина": "пустая сумма"}, {"строка": 7, "причина": "Invalid isoformat string: '06.06.2024'"}], f"Пропущенные строки: {skipped}"
        assert recs[0]["category"] == "продукты" and recs[0]["amount"] == 1250.5, f"Первая запись: {recs[0]}"
hints:
  - level: 1
    text: '`load` — цикл по строкам таблицы, где каждую строку разбирают отдельно и по-отдельности же решают, что с ней: в записи или в пропущенные. Где здесь должен стоять `try` и что он должен охватывать?'
  - level: 2
    text: 'Номер строки даёт `enumerate(csv.DictReader(f), start=2)` — заголовок занимает строку 1. Текст причины — `str(e)` из `except ValueError as e`. Суммы округляйте при сборке отчёта: словарь из словаря — включение `{k: round(v, 2) for k, v in ...items()}`.'
  - level: 3
    text: 'В `main`: `records, skipped = load("expenses.csv")`, затем словарь отчёта с четырьмя ключами в нужном порядке, `with open("report.json", "w", encoding="utf-8") as f:` и `json.dump(...)` с `ensure_ascii=False, indent=2`. Печать итога — после записи.'
