id: p1m-requirements-audit
title: Проверка файла зависимостей
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите функцию `audit(path)`, которая проверяет файл зависимостей и возвращает кортеж `(незакреплённые строки, сколько закреплено, сколько пакетов всего)`.**

  `path` — путь к файлу вида `requirements.txt`. Закреплённая строка — та, где версия задана через `==`. Всё после `#` — комментарий; строки, где после удаления комментария и пробелов ничего не осталось, пропускайте. Незакреплённые строки — список строк без комментария и пробелов по краям, в порядке файла; два других значения — целые числа. Файлы — на вкладках над редактором; `requirements.txt`:
  ```
  # зависимости проекта «Отчёты»
  requests==2.32.3
  pandas>=2.0          # нужна новая группировка

  matplotlib
  numpy==2.1.3
  openpyxl==3.1.5  # чтение Excel
  ```

  Пример 1
  ```call
  audit("requirements.txt")
  ```
  ```return
  (["pandas>=2.0", "matplotlib"], 3, 5)
  ```
starter: |
  def audit(path):
      # Прочитайте файл построчно.
      pass


  print(audit("requirements.txt"))
solution: |
  def audit(path):
      unpinned = []
      pinned = 0
      total = 0
      with open(path, encoding="utf-8") as f:
          for line in f:
              line = line.split("#")[0].strip()
              if line == "":
                  continue
              total += 1
              if "==" in line:
                  pinned += 1
              else:
                  unpinned.append(line)
      return unpinned, pinned, total


  print(audit("requirements.txt"))
tests:
  files:
    requirements.txt: "# зависимости проекта «Отчёты»\nrequests==2.32.3\npandas>=2.0          # нужна новая группировка\n\nmatplotlib\nnumpy==2.1.3\nopenpyxl==3.1.5  # чтение Excel\n"
    pinned.txt: "certifi==2026.11.20\ncharset-normalizer==3.5.2\nidna==3.20\nrequests==2.32.3\nurllib3==2.8.0\n"
    ranges.txt: "#\n   # пусто\n\nurllib3<3,>=1.21.1\n  scikit-learn ~= 1.5  # почти точно\n"
    empty.txt: ""
  function: audit
  calls:
    - name: Пример 1
      args: ["requirements.txt"]
      expect_py: '(["pandas>=2.0", "matplotlib"], 3, 5)'
    - name: Всё закреплено
      args: ["pinned.txt"]
      expect: [[], 5, 5]
      hidden: true
    - name: Только комментарии и диапазоны
      args: ["ranges.txt"]
      expect: [["urllib3<3,>=1.21.1", "scikit-learn ~= 1.5"], 0, 2]
      hidden: true
    - name: Пустой файл
      args: ["empty.txt"]
      expect: [[], 0, 0]
      hidden: true
hints:
  - level: 1
    text: 'Каждую строку сначала приведите к виду «только пакет и версия», а уже потом решайте, что с ней делать: пропустить, засчитать или вывести.'
  - level: 2
    text: 'Комментарий отрезает `split("#")[0]` — всё до первой решётки; пробелы по краям убирает `strip()`. Пустой после этого строке в подсчёте не место.'
  - level: 3
    text: 'Два счётчика до цикла: сколько пакетов и сколько закреплено. Закреплено — если в очищенной строке есть `"=="`, проверка `in`; остальные строки — в список. Три значения возвращают через запятую: `return a, b, c`.'
