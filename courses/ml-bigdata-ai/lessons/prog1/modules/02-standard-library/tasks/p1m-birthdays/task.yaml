id: p1m-birthdays
title: Дни рождения по месяцам
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите функцию `birthdays_by_month(path)`, которая читает CSV-файл с днями рождения и возвращает словарь «номер месяца → список имён».**

  `path` — путь к файлу. В файле — столбцы `имя` и `дата`, дата в ISO 8601 (`ГГГГ-ММ-ДД`). Ключ словаря — номер месяца целым числом, значение — имена родившихся в этом месяце в порядке файла. Месяцев без дней рождения в словаре нет. Файлы — на вкладках над редактором; в `birthdays.csv` — Аня (2010-05-14), Борис (2009-03-02), Вера (2011-05-30), Гоша (2010-11-07).

  Пример 1
  ```call
  birthdays_by_month("birthdays.csv")
  ```
  ```return
  {5: ["Аня", "Вера"], 3: ["Борис"], 11: ["Гоша"]}
  ```

  Пример 2 — в `empty.csv` только заголовок
  ```call
  birthdays_by_month("empty.csv")
  ```
  ```return
  {}
  ```
starter: |
  import csv
  from collections import defaultdict
  from datetime import date


  def birthdays_by_month(path):
      # План:
      # 1. Прочитать файл через csv.DictReader
      # 2. Номер месяца — из даты, имя — в список своего месяца
      # 3. Вернуть словарь
      pass


  print(birthdays_by_month("birthdays.csv"))
solution: |
  import csv
  from collections import defaultdict
  from datetime import date


  def birthdays_by_month(path):
      by_month = defaultdict(list)
      with open(path, encoding="utf-8", newline="") as f:
          for row in csv.DictReader(f):
              month = date.fromisoformat(row["дата"]).month
              by_month[month].append(row["имя"])
      return dict(by_month)


  print(birthdays_by_month("birthdays.csv"))
tests:
  files:
    birthdays.csv: "имя,дата\nАня,2010-05-14\nБорис,2009-03-02\nВера,2011-05-30\nГоша,2010-11-07\n"
    class2.csv: "имя,дата\nЛиза,2010-12-31\nМарк,2010-01-01\nНина,2011-12-01\nОля,2009-10-10\nПетя,2010-01-20\n"
    empty.csv: "имя,дата\n"
  function: birthdays_by_month
  calls:
    - name: Пример 1
      args: ["birthdays.csv"]
      expect_py: '{5: ["Аня", "Вера"], 3: ["Борис"], 11: ["Гоша"]}'
    - name: Пример 2 — пустой список
      args: ["empty.csv"]
      expect: {}
    - name: Другой класс
      args: ["class2.csv"]
      expect_py: '{12: ["Лиза", "Нина"], 1: ["Марк", "Петя"], 10: ["Оля"]}'
      hidden: true
hints:
  - level: 1
    text: 'Какой ключ у группы и что в ней лежит? Ключ — номер месяца, значение — список имён в порядке файла.'
  - level: 2
    text: '`defaultdict(list)` сам заведёт пустой список для нового месяца. Номер месяца даёт `date.fromisoformat(...).month`. Если в итоге нужен обычный словарь, его даёт `dict(...)`.'
  - level: 3
    text: 'Ключ — именно число `5`, а не строка `"05"`: это `.month` у даты. Чтобы увидеть, что накопилось, напечатайте словарь внутри функции — `print` не влияет на проверку.'
