id: p1m-top-goods
title: Самые ходовые товары
sandbox: python-browser
difficulty: 2
statement: |
  **Выведите `n` товаров, которые чаще всего встречаются в чеках из файла `checks.txt`.**

  Каждая строка файла — один чек, товары через запятую. Названия сравнивайте без учёта регистра и пробелов по краям, выводите в нижнем регистре; пустые строки пропускайте. На входе — число `n`; вывод — `n` строк `товар: число`, от частых к редким, при равенстве — в порядке первого появления. Если товаров меньше `n`, выведите все. Файл `checks.txt` — на вкладке.

  Пример 1
  ```input
  3
  ```
  ```output
  хлеб: 4
  молоко: 2
  сыр: 2
  ```
starter: |
  from collections import Counter

  n = int(input())
  # Прочитайте checks.txt, разрежьте строки на товары
  # и посчитайте их.
stdin: "3\n"
solution: |
  from collections import Counter

  n = int(input())
  counts = Counter()
  with open("checks.txt", encoding="utf-8") as f:
      for line in f:
          if line.strip() == "":
              continue
          counts.update(item.strip().lower() for item in line.split(","))
  for item, k in counts.most_common(n):
      print(f"{item}: {k}")
tests:
  files:
    checks.txt: |
      Молоко, хлеб, сыр
      хлеб, яйца
       молоко , кефир, хлеб
      сыр, Хлеб
      кефир
  io:
    - name: Пример из условия
      stdin: "3\n"
      stdout: "хлеб: 4\nмолоко: 2\nсыр: 2"
    - name: Самый частый
      stdin: "1\n"
      stdout: "хлеб: 4"
      hidden: true
    - name: Больше, чем товаров
      stdin: "10\n"
      stdout: "хлеб: 4\nмолоко: 2\nсыр: 2\nкефир: 2\nяйца: 1"
      hidden: true
    - name: Другой файл, с пустыми строками
      stdin: "2\n"
      files:
        checks.txt: "\n   \nЧай,сахар\nКОФЕ, сахар\nчай, Сахар , печенье\n"
      stdout: "сахар: 3\nчай: 2"
      hidden: true
hints:
  - level: 1
    text: 'Сначала — как из строки файла получить чистые названия, потом — как их посчитать. Какой инструмент темы считает и умеет отдавать самые частые?'
  - level: 2
    text: 'Строку режут по запятой, каждое название — `strip()` и `lower()`. Пустой `Counter()` пополняют через `update(...)`: он прибавляет, а не заменяет. Строку из одних пробелов `strip()` превращает в пустую.'
  - level: 3
    text: '`most_common(n)` сам возьмёт не больше `n` пар и при равенстве сохранит порядок первого появления — сортировать ничего не нужно. Печатайте пары в цикле: `for item, k in counts.most_common(n)`.'
