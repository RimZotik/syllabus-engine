id: p1m-top-goods
title: Самые ходовые товары
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите функцию `top_goods(path, n)`, которая возвращает `n` товаров, чаще всего встречающихся в чеках из файла, — списком пар `(товар, сколько раз)`.**

  `path` — путь к файлу, `n` — целое число от 1. Каждая строка файла — один чек, товары через запятую. Названия сравнивайте без учёта регистра и пробелов по краям, возвращайте в нижнем регистре; пустые строки пропускайте. Пары — от частых к редким, при равенстве — в порядке первого появления. Если товаров меньше `n`, верните все. Файл `checks.txt` — на вкладке над редактором.

  Пример 1
  ```call
  top_goods("checks.txt", 3)
  ```
  ```return
  [("хлеб", 4), ("молоко", 2), ("сыр", 2)]
  ```
starter: |
  from collections import Counter


  def top_goods(path, n):
      # Прочитайте файл, разрежьте строки на товары
      # и посчитайте их.
      pass


  print(top_goods("checks.txt", 3))
solution: |
  from collections import Counter


  def top_goods(path, n):
      counts = Counter()
      with open(path, encoding="utf-8") as f:
          for line in f:
              if line.strip() == "":
                  continue
              counts.update(item.strip().lower() for item in line.split(","))
      return counts.most_common(n)


  print(top_goods("checks.txt", 3))
tests:
  files:
    checks.txt: "Молоко, хлеб, сыр\nхлеб, яйца\n молоко , кефир, хлеб\nсыр, Хлеб\nкефир\n"
    other.txt: "\n   \nЧай,сахар\nКОФЕ, сахар\nчай, Сахар , печенье\n"
  function: top_goods
  calls:
    - name: Пример 1
      args: ["checks.txt", 3]
      expect_py: '[("хлеб", 4), ("молоко", 2), ("сыр", 2)]'
    - name: Самый частый
      args: ["checks.txt", 1]
      expect: [["хлеб", 4]]
      hidden: true
    - name: Больше, чем товаров
      args: ["checks.txt", 10]
      expect: [["хлеб", 4], ["молоко", 2], ["сыр", 2], ["кефир", 2], ["яйца", 1]]
      hidden: true
    - name: Другой файл, с пустыми строками
      args: ["other.txt", 2]
      expect: [["сахар", 3], ["чай", 2]]
      hidden: true
hints:
  - level: 1
    text: 'Сначала — как из строки файла получить чистые названия, потом — как их посчитать. Какой инструмент темы считает и умеет отдавать самые частые?'
  - level: 2
    text: 'Строку режут по запятой, каждое название — `strip()` и `lower()`. Пустой `Counter()` пополняют через `update(...)`: он прибавляет, а не заменяет. Строку из одних пробелов `strip()` превращает в пустую.'
  - level: 3
    text: '`most_common(n)` сам возьмёт не больше `n` пар и при равенстве сохранит порядок первого появления — сортировать ничего не нужно. Он уже возвращает список пар — его и верните.'
