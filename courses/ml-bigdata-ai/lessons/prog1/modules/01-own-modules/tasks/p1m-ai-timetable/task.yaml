id: p1m-ai-timetable
title: ИИ-ассистент и расписание уроков
sandbox: python-browser
difficulty: 3
statement: |
  **Исправьте программу: по времени `ЧЧ:ММ` она выводит предметы по алфавиту и следующий урок, но следующий урок называет неверно.**

  Код в редакторе написал ИИ-ассистент; модуль `timetable.py` — на вкладке, менять нельзя ни файл, ни данные модуля во время работы программы. Первая строка вывода — `Предметы: ...` по алфавиту через запятую с пробелом, вторая — `Следующий урок: время предмет` (первый урок, который начинается не раньше заданного времени) или `Уроков больше нет`. Функцию `next_lesson` не переписывайте: найдите, почему она ошибается, и исправьте программу.

  Пример 1
  ```input
  09:00
  ```
  ```output
  Предметы: биология, математика, русский язык, физкультура
  Следующий урок: 09:25 русский язык
  ```

  Пример 2
  ```input
  12:00
  ```
  ```output
  Предметы: биология, математика, русский язык, физкультура
  Уроков больше нет
  ```
starter: |
  # Решение от ИИ-ассистента
  from timetable import LESSONS, next_lesson

  now = input()
  LESSONS.sort(key=lambda lesson: lesson[1])
  print("Предметы:", ", ".join(subject for start, subject in LESSONS))
  lesson = next_lesson(now)
  if lesson is None:
      print("Уроков больше нет")
  else:
      print("Следующий урок:", lesson[0], lesson[1])
stdin: "09:00\n"
solution: |
  from timetable import LESSONS, next_lesson

  now = input()
  by_subject = sorted(LESSONS, key=lambda lesson: lesson[1])
  print("Предметы:", ", ".join(subject for start, subject in by_subject))
  lesson = next_lesson(now)
  if lesson is None:
      print("Уроков больше нет")
  else:
      print("Следующий урок:", lesson[0], lesson[1])
tests:
  stdin: "09:00\n"
  files:
    timetable.py: |
      """Расписание уроков на день — в порядке звонков."""
      LESSONS = [("08:30", "математика"), ("09:25", "русский язык"), ("10:30", "биология"), ("11:35", "физкультура")]


      def next_lesson(now):
          """Первый урок, который начинается не раньше now ("ЧЧ:ММ"); None, если уроков больше нет."""
          for start, subject in LESSONS:
              if start >= now:
                  return start, subject
          return None
  io:
    - name: Пример 1
      stdin: "09:00\n"
      stdout: "Предметы: биология, математика, русский язык, физкультура\nСледующий урок: 09:25 русский язык"
    - name: Пример 2
      stdin: "12:00\n"
      stdout: "Предметы: биология, математика, русский язык, физкультура\nУроков больше нет"
    - name: Раннее утро
      stdin: "07:50\n"
      stdout: "Предметы: биология, математика, русский язык, физкультура\nСледующий урок: 08:30 математика"
      hidden: true
    - name: Ровно к звонку
      stdin: "10:30\n"
      stdout: "Предметы: биология, математика, русский язык, физкультура\nСледующий урок: 10:30 биология"
      hidden: true
    - name: Другое расписание
      stdin: "09:10\n"
      files:
        timetable.py: |
          """Расписание уроков на день — в порядке звонков."""
          LESSONS = [("08:00", "химия"), ("08:55", "алгебра"), ("09:50", "история"), ("10:55", "география")]


          def next_lesson(now):
              """Первый урок, который начинается не раньше now ("ЧЧ:ММ"); None, если уроков больше нет."""
              for start, subject in LESSONS:
                  if start >= now:
                      return start, subject
              return None
      stdout: "Предметы: алгебра, география, история, химия\nСледующий урок: 09:50 история"
      hidden: true
  asserts:
    - name: Расписание в модуле не изменилось
      code: |
        import timetable
        want = [("08:30", "математика"), ("09:25", "русский язык"), ("10:30", "биология"), ("11:35", "физкультура")]
        assert timetable.LESSONS == want, f"После программы timetable.LESSONS = {timetable.LESSONS}: программа изменила порядок уроков в модуле"
hints:
  - level: 1
    text: 'Пример 1 ошибается, пример 2 — нет. Какой урок программа называет для 09:00 и в каком порядке `next_lesson` перебирает уроки к этому моменту?'
  - level: 2
    text: '`from timetable import LESSONS` не копирует список. Какой список меняет `LESSONS.sort(...)` — свой или тот, по которому идёт `next_lesson`?'
  - level: 3
    text: 'Для печати по алфавиту нужен новый отсортированный список, а не сортировка на месте: `sorted(LESSONS, key=...)` оставляет исходный список как был.'
