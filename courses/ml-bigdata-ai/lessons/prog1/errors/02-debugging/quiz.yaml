title: Проверка темы
pass: 0.85
minutes: 40
questions:
- id: none-from-branch
  type: single
  q: |
    Программа падает с `TypeError: unsupported operand type(s) for +: 'int' and 'NoneType'`, последняя пара traceback — `line 8, in total`. Где ошибка, которую нужно исправить?
    ```python
    def seconds(text):
        m, s = text.split(":")
        if s != "00":
            return int(m) * 60 + int(s)

    def total(laps):
        times = [seconds(t) for t in laps]
        return sum(times)

    print(total(["1:30", "2:00", "0:45"]))
    ```
  options:
  - 'В `total`: `sum` не умеет складывать числа из списка, собранного выражением в квадратных скобках'
  - 'В `seconds`: для «2:00» условие ложно, и функция заканчивается без `return`'
  - 'В данных: «2:00» — неверная запись времени'
  - 'В `seconds`: `split(":")` не делит «2:00», ведь после двоеточия нули'
  answer: 1
  explain: 'Python складывает внутри `sum` и замечает `None` в строке 8, но `None` пришёл из `seconds`: для «2:00» условие ложно, функция дошла до конца без `return` и вернула `None`. Пары `in seconds` в traceback нет, потому что этот вызов давно закончился. «2:00» — обычная запись времени, и любое ровное число минут («3:00») снова даст `None`. `sum` складывает любые числа из списка — откуда бы он ни взялся.'
- id: predict-traceback
  type: multi
  q: |
    Программа печатает стоимость доставки по заказам. Что будет в выводе?
    ```python
    def fee(kind):
        return {"обычный": 50, "срочный": 150}[kind]

    def order_total(items):
        total = 0
        for kind in items:
            total += fee(kind)
        return total

    def receipt(orders):
        for name, items in orders.items():
            print(name, order_total(items))

    receipt({"Аня": ["обычный"], "Борис": ["срочный", "экспресс"]})
    ```
  options:
  - 'Строка `Аня 50` перед traceback'
  - 'Пары в traceback сверху вниз: основная программа, `receipt`, `order_total`, `fee`'
  - 'Пара вызова `fee` для «срочный»: он был до ошибки'
  - 'Последняя строка — `KeyError: ''экспресс''`'
  - 'Пара вызова `order_total` для заказа Ани'
  answer:
  - 0
  - 1
  - 3
  explain: 'Заказ Ани посчитан и напечатан до ошибки. На «экспресс» ключа в словаре нет — `KeyError`, и в этот момент не закончены четыре вызова: программа, `receipt`, `order_total` для Бориса и `fee`. Вызовы `fee("срочный")` и `order_total` для Ани уже закончились и ушли из стека вызовов — в traceback их нет.'
- id: first-step
  type: single
  q: 'Кассир жалуется: сумма по чеку «иногда на несколько рублей меньше». Какой вход лучше всего подходит, чтобы начать искать ошибку?'
  options:
  - 'Чек из 40 позиций, на котором сумма неверна при каждом запуске'
  - 'Чек из 3 позиций, на котором сумма неверна при каждом запуске'
  - 'Чек из 2 позиций, на котором сумма была неверной один раз, а при повторном запуске — верной'
  - 'Чек из одной позиции, на котором сумма верная: на нём проще всего проследить расчёт'
  answer: 1
  explain: 'Нужен вход, на котором ошибка повторяется каждый раз, — тогда можно проверять предположения и убедиться, что исправление помогло. Из двух таких меньший удобнее: три позиции можно проследить вручную, а в сорока ошибка теряется. Чек, где ошибка не повторилась, ничего не проверит, а чек с верной суммой не содержит ошибки вовсе.'
- id: first-or-last
  type: single
  q: '`count_cold(temps)` должна считать морозные дни (ниже нуля), но на каждом наборе ответ на один меньше. Есть два предположения: «не проверяется первый день» и «не проверяется последний». Какая пара вызовов различит их?'
  options:
  - '`count_cold([-3])` и `count_cold([-5])`'
  - '`count_cold([-3, -5])` и `count_cold([-5, -3])`'
  - '`count_cold([2, -3])` и `count_cold([-3, 2])`'
  - '`count_cold([])` и `count_cold([-3])`'
  answer: 2
  explain: 'В паре с `[2, -3]` и `[-3, 2]` морозный день то последний, то первый: если не проверяется первый, 0 вернёт `[-3, 2]`, если последний — `[2, -3]`. Перестановка двух морозных дней ничего не различает: в каждом вызове теряется один из них, обе версии ответят 1. В списке из одного дня он и первый, и последний, а пустой список даст 0 при любой ошибке.'
- id: bisect-conclusions
  type: multi
  q: 'Данные проходят четыре шага: `read_rows` → `clean` → `convert` → `total`, и итог неверный. Вы напечатали результат `clean` — данные верные. Какие выводы правильные?'
  options:
  - 'На этом входе `read_rows` и `clean` можно больше не проверять'
  - 'Ошибка — в `convert` или в `total`'
  - 'Ошибка точно в `total`: неверный итог выдаёт именно она'
  - 'Следующий `print` разумно поставить после `convert`'
  - 'Нужно проверить `read_rows`: верные данные после `clean` могли скрыть её ошибку'
  answer:
  - 0
  - 1
  - 3
  explain: 'Данные после `clean` верны — значит, первые два шага на этом входе отработали правильно, и ошибка дальше по пути. `total` выдаёт итог, но могла получить неверный список из `convert`. Это и покажет `print` после `convert` — снова половина оставшегося пути. Возвращаться к `read_rows` незачем: что бы она ни выдала, до `convert` дошли верные данные, а итог испортился позже.'
- id: code-fix-swapped-unpack
  type: code
  q: |
    Программа читает позиции чека `название;цена` до пустой строки и печатает сумму. На примере ниже она падает:
    ```
    Traceback (most recent call last):
      File "C:\work\receipt.py", line 5, in <module>
        total += int(price)
    ValueError: invalid literal for int() with base 10: 'хлеб'
    ```
    **Строка 5 верна — найдите, откуда пришло неверное значение**, и исправьте программу.
    ```input
    хлеб;45
    сыр;320

    ```
    ```output
    Итого: 365
    ```
  starter: |
    total = 0
    line = input()
    while line != "":
        price, name = line.split(";")
        total += int(price)
        line = input()
    print("Итого:", total)
  solution: |
    total = 0
    line = input()
    while line != "":
        name, price = line.split(";")
        total += int(price)
        line = input()
    print("Итого:", total)
  tests:
    io:
    - name: Пример
      stdin: "хлеб;45\nсыр;320\n\n"
      stdout: "Итого: 365"
    - name: Одна позиция
      stdin: "чай;99\n\n"
      stdout: "Итого: 99"
      hidden: true
    - name: Пустой чек
      stdin: "\n"
      stdout: "Итого: 0"
      hidden: true
  explain: 'В сообщении в кавычках — то, что получил `int`: название товара, а не цена. Значит, неверное значение пришло в `price` раньше — при распаковке в строке 4 имена стоят в обратном порядке. Строка 5 только заметила ошибку. Менять её, например оборачивать в `try`, бесполезно: цена так и останется в имени `name`.'
- id: code-fix-visits
  type: code
  q: |
    Турникет фитнес-клуба: программа читает имена до пустой строки и печатает, сколько раз пришёл каждый, — в порядке первого прихода. **Программа не падает, но у всех выходит по одному посещению.** Воспроизведите ошибку на маленьком входе и исправьте программу.
    ```input
    Аня
    Борис
    Аня

    ```
    ```output
    Аня 2
    Борис 1
    ```
  starter: |
    visits = {}
    name = input()
    while name != "":
        visits[name] = 1
        name = input()
    for name, count in visits.items():
        print(name, count)
  solution: |
    visits = {}
    name = input()
    while name != "":
        visits[name] = visits.get(name, 0) + 1
        name = input()
    for name, count in visits.items():
        print(name, count)
  tests:
    io:
    - name: Аня пришла дважды
      stdin: "Аня\nБорис\nАня\n\n"
      stdout: "Аня 2\nБорис 1"
    - name: Три прихода одного
      stdin: "Вера\nВера\nВера\n\n"
      stdout: "Вера 3"
      hidden: true
    - name: Все по разу
      stdin: "Гоша\nДина\n\n"
      stdout: "Гоша 1\nДина 1"
      hidden: true
    - name: Никто не пришёл
      stdin: "\n"
      stdout: ""
      hidden: true
  explain: 'Самый маленький вход, где ошибка видна, — одно имя дважды: `Аня`, `Аня` даёт 1 вместо 2. Значит, второй приход не прибавился, а записал значение заново: `visits[name] = 1` при каждом приходе. Нужно прибавлять к прежнему числу, а для нового имени начинать с нуля — это и делает `get(name, 0)`.'
- id: code-fix-coldest
  type: code
  q: |
    `coldest(temps)` возвращает самую низкую температуру за неделю. Зимой она отвечала верно, **а для тёплой недели вернула 0, хотя такого дня не было.** Найдите маленький вход, на котором ошибка повторяется, и исправьте функцию.
    ```call
    coldest([-3, -8, 2, -1])
    ```
    ```return
    -8
    ```
    ```call
    coldest([18, 22, 15, 20])
    ```
    ```return
    15
    ```
    - Список не пустой; числа — любые целые.
    - Готовую `min` не используйте.
  starter: |
    def coldest(temps):
        lowest = 0
        for t in temps:
            if t < lowest:
                lowest = t
        return lowest


    print(coldest([-3, -8, 2, -1]))   # -8
    print(coldest([18, 22, 15, 20]))  # 15
  solution: |
    def coldest(temps):
        lowest = temps[0]
        for t in temps:
            if t < lowest:
                lowest = t
        return lowest


    print(coldest([-3, -8, 2, -1]))   # -8
    print(coldest([18, 22, 15, 20]))  # 15
  tests:
    forbid: [min]
    function: coldest
    calls:
    - name: Есть мороз
      args: [[-3, -8, 2, -1]]
      expect: -8
    - name: Один морозный день
      args: [[-2]]
      expect: -2
      hidden: true
    - name: Ноль и минус
      args: [[0, -1]]
      expect: -1
      hidden: true
    - name: Все дни тёплые
      args: [[18, 22, 15, 20]]
      expect: 15
    - name: Один тёплый день
      args: [[7]]
      expect: 7
      hidden: true
    - name: Одинаковые дни
      args: [[5, 5]]
      expect: 5
      hidden: true
    - name: Ноль среди тёплых
      args: [[0, 3]]
      expect: 0
      hidden: true
    - name: Большие числа
      args: [[1500, 1200, 1800]]
      expect: 1200
      hidden: true
  explain: 'Самый маленький вход с ошибкой — один тёплый день: `coldest([7])` возвращает 0. Ноль не из списка: это начальное значение `lowest`, и тёплая температура никогда не бывает меньше него. Начинать нужно с настоящего значения из списка — с первого дня. Зимой ошибка пряталась, потому что мороз ниже нуля сразу заменял начальный 0.'
- id: code-fix-empty-marks
  type: code
  q: |
    Отчёт печатает средний балл каждого ученика (`"н"` — пропуск) и падает:
    ```
    Аня 4.5
    Traceback (most recent call last):
      File "C:\work\school.py", line 12, in <module>
        report(journal)
      File "C:\work\school.py", line 9, in report
        print(name, class_average(marks))
      File "C:\work\school.py", line 5, in class_average
        return statistics.mean(real)
      File "C:\Python312\Lib\statistics.py", line 486, in mean
        raise StatisticsError('mean requires at least one data point')
    statistics.StatisticsError: mean requires at least one data point
    ```
    **Ученику без оценок отчёт должен печатать имя и** `нет оценок`, остальным — средний балл, как сейчас. Исправьте программу.
    ```output
    Аня 4.5
    Борис нет оценок
    ```
    - `report` проверят и на другом журнале.
  starter: |
    import statistics

    def class_average(marks):
        real = [int(m) for m in marks if m != "н"]
        return statistics.mean(real)

    def report(journal):
        for name, marks in journal.items():
            print(name, class_average(marks))

    journal = {"Аня": ["5", "н", "4"], "Борис": ["н", "н"]}
    report(journal)
  solution: |
    import statistics

    def class_average(marks):
        real = [int(m) for m in marks if m != "н"]
        return statistics.mean(real)

    def report(journal):
        for name, marks in journal.items():
            try:
                print(name, class_average(marks))
            except statistics.StatisticsError:
                print(name, "нет оценок")

    journal = {"Аня": ["5", "н", "4"], "Борис": ["н", "н"]}
    report(journal)
  tests:
    io:
    - name: Журнал из примера
      stdout: "Аня 4.5\nБорис нет оценок"
    asserts:
    - name: Другой журнал
      code: |
        import io, contextlib
        buf = io.StringIO()
        with contextlib.redirect_stdout(buf):
            report({"Вера": [], "Гоша": ["3", "5"], "Дина": ["н"], "Егор": ["н", "2"]})
        got = buf.getvalue().strip()
        want = "Вера нет оценок\nГоша 4\nДина нет оценок\nЕгор 2"
        assert got == want, f"report напечатал:\n{got}\nа нужно:\n{want}"
  explain: 'Нижняя пара указывает в `statistics.py`, но это сигнал библиотеки: среднее пустого списка не определено. Первая пара с вашим файлом снизу — строка 5: сюда пришёл пустой `real`. Пустым его сделала строка 4 — у Бориса одни пропуски, — а её traceback не показывает. Исправление делает то, что требует условие: пустой случай проверяют заранее или ловят `statistics.StatisticsError` в `report` и печатают «нет оценок». Вернуть 0 нельзя: в отчёте не отличить «нет оценок» от настоящего нуля, а `except` с `pass` молча потерял бы ученика.'
- id: code-fix-total-reset
  type: code
  q: |
    `order_totals(orders)` возвращает словарь «покупатель → сумма заказа». **У первого покупателя сумма верная, а Борис получает 450 вместо 300.** Найдите причину и исправьте функцию.
    ```call
    order_totals({"Аня": [100, 50], "Борис": [300]})
    ```
    ```return
    {"Аня": 150, "Борис": 300}
    ```
    - Пустой список покупок — сумма 0.
  starter: |
    def order_totals(orders):
        totals = {}
        total = 0
        for name, items in orders.items():
            for price in items:
                total += price
            totals[name] = total
        return totals


    print(order_totals({"Аня": [100, 50], "Борис": [300]}))
  solution: |
    def order_totals(orders):
        totals = {}
        for name, items in orders.items():
            total = 0
            for price in items:
                total += price
            totals[name] = total
        return totals


    print(order_totals({"Аня": [100, 50], "Борис": [300]}))
  tests:
    no_mutate: true
    function: order_totals
    calls:
    - name: Пример
      args: [{"Аня": [100, 50], "Борис": [300]}]
      expect: {"Аня": 150, "Борис": 300}
    - name: Три покупателя, пустой заказ в середине
      args: [{"Вера": [10], "Гоша": [], "Дина": [5, 5]}]
      expect: {"Вера": 10, "Гоша": 0, "Дина": 10}
      hidden: true
    - name: Нет заказов
      args: [{}]
      expect: {}
      hidden: true
  explain: 'Борис получил свои 300 плюс 150 Ани: сумма не обнулилась между покупателями. `total = 0` стоит до внешнего цикла и выполняется один раз на всех. Начинать с нуля нужно для каждого покупателя — внутри внешнего цикла, перед циклом по его покупкам. Для первого покупателя ошибка не видна, поэтому проверять нужно хотя бы на двух.'
- id: code-fix-two-bugs
  type: code
  q: |
    Шагомер: программа читает строки `день шаги` до пустой строки и печатает, сколько дней выполнена цель в 10000 шагов, и среднее число шагов в день. **Программа падает, а когда исправите падение, ответ всё ещё будет неверным: ошибок две.**
    ```input
    пн 8000
    вт 12000
    ср 10000

    ```
    ```output
    Цель выполнена: 2 дн.
    В среднем: 10000.0
    ```
  starter: |
    goal_days = 0
    total = 0
    count = 0
    line = input()
    while line != "":
        day, steps = line.split(";")
        steps = int(steps)
        total += steps
        count += 1
        if steps >= 10000:
            goal_days += 1
        line = input()
    print("Цель выполнена:", goal_days, "дн.")
    print("В среднем:", total / goal_days)
  solution: |
    goal_days = 0
    total = 0
    count = 0
    line = input()
    while line != "":
        day, steps = line.split()
        steps = int(steps)
        total += steps
        count += 1
        if steps >= 10000:
            goal_days += 1
        line = input()
    print("Цель выполнена:", goal_days, "дн.")
    print("В среднем:", total / count)
  tests:
    io:
    - name: Пример
      stdin: "пн 8000\nвт 12000\nср 10000\n\n"
      stdout: "Цель выполнена: 2 дн.\nВ среднем: 10000.0"
    - name: Цель не выполнена ни разу
      stdin: "пн 3000\n\n"
      stdout: "Цель выполнена: 0 дн.\nВ среднем: 3000.0"
      hidden: true
    - name: На один шаг меньше цели
      stdin: "пн 10000\nвт 9999\n\n"
      stdout: "Цель выполнена: 1 дн.\nВ среднем: 9999.5"
      hidden: true
  explain: 'Первая ошибка видна по traceback: `ValueError: not enough values to unpack` в строке с `split(";")` — в строке нет точки с запятой, день и шаги разделены пробелом. Вторая молчит: на примере программа печатает 15000.0 вместо 10000.0. Предположение «делим не на то число» проверяется вручную: 30000 / 2 — деление на дни с выполненной целью, а нужно на все дни, `count`. Если цель не выполнена ни разу, старая версия упала бы ещё и с `ZeroDivisionError`.'
