title: Проверка темы
pass: 0.85
minutes: 18
questions:
- id: tariff-traceback
  type: multi
  q: |
    Программа считает счёт за связь. Какие утверждения верны по этому traceback?
    ```
    Traceback (most recent call last):
      File "C:\work\tariff.py", line 14, in <module>
        print(month_bill(calls))
      File "C:\work\tariff.py", line 10, in month_bill
        total += call_cost(c)
      File "C:\work\tariff.py", line 5, in call_cost
        return RATES[kind] * minutes
    KeyError: 'роуминг'
    ```
  options:
  - 'В момент ошибки ещё не закончили работу основная программа, `month_bill` и `call_cost`'
  - '`call_cost` вызвали из строки 10, когда очередь дошла до звонка с видом «роуминг»'
  - 'Вызовы `call_cost` для звонков до этого тоже есть в traceback — в тех же строках'
  - 'Ошибка точно в строке 5: исключение возникло именно там'
  - '`month_bill` вызвали из `call_cost`: пара `call_cost` стоит ниже'
  answer:
  - 0
  - 1
  explain: 'Пары traceback — незаконченные вызовы в момент исключения: программа, `month_bill`, `call_cost`, последний — внизу; пара над нижней показывает, откуда его вызвали. Вызовы для прежних звонков закончились и ушли из стека вызовов. Строка 5 — где заметили: возможно, в `RATES` забыли тариф или вид звонка записан неверно.'
- id: none-from-branch
  type: single
  q: |
    Программа падает с `TypeError: unsupported operand type(s) for +: 'int' and 'NoneType'`, последняя пара traceback — `line 8, in total`. Где ошибка, которую нужно исправить?
    ```python
    def seconds(text):
        m, s = text.split(":")
        if s != "00":
            return int(m) * 60 + int(s)

    def total(laps):
        times = [seconds(t) for t in laps]
        return sum(times)

    print(total(["1:30", "2:00", "0:45"]))
    ```
  options:
  - 'В `total`: `sum` не умеет складывать числа из списка, собранного выражением в квадратных скобках'
  - 'В `seconds`: для «2:00» условие ложно, и функция заканчивается без `return`'
  - 'В данных: «2:00» — неверная запись времени'
  - 'В `seconds`: `split(":")` не делит «2:00», ведь после двоеточия нули'
  answer: 1
  explain: 'Python складывает внутри `sum` и замечает `None` в строке 8, но `None` пришёл из `seconds`: для «2:00» условие ложно, функция дошла до конца без `return` и вернула `None`. Пары `in seconds` в traceback нет, потому что этот вызов давно закончился. «2:00» — обычная запись времени, и любое ровное число минут («3:00») снова даст `None`. `sum` складывает любые числа из списка — откуда бы он ни взялся.'
- id: library-pair
  type: multi
  q: |
    Средний балл по журналу (`"н"` — пропуск). Какие утверждения верны?
    ```python
    import statistics

    def class_average(marks):
        real = [int(m) for m in marks if m != "н"]
        return statistics.mean(real)

    def report(journal):
        for name, marks in journal.items():
            print(name, class_average(marks))

    journal = {"Аня": ["5", "н", "4"], "Борис": ["н", "н"]}
    report(journal)
    ```
    ```
    Аня 4.5
    Traceback (most recent call last):
      File "C:\work\school.py", line 12, in <module>
        report(journal)
      File "C:\work\school.py", line 9, in report
        print(name, class_average(marks))
      File "C:\work\school.py", line 5, in class_average
        return statistics.mean(real)
      File "C:\Python312\Lib\statistics.py", line 486, in mean
        raise StatisticsError('mean requires at least one data point')
    statistics.StatisticsError: mean requires at least one data point
    ```
  options:
  - 'Пустой список попал в `mean` из строки 5, в `class_average`'
  - 'Первая пара с вашим файлом, если читать снизу, — `report`, строка 9'
  - 'Список стал пустым ещё в строке 4: у Бориса одни пропуски, а строку 4 traceback не показывает'
  - 'Ошибка в библиотеке: `raise` стоит в `statistics.py`'
  answer:
  - 0
  - 2
  explain: 'Снизу первая пара вашего файла — `class_average`, строка 5: отсюда `mean` получила пустой список. Но пара показывает только строку, на которой вызов остановился; строка 4 уже выполнилась и в traceback не видна, а именно она выбросила оба «н». `mean` выбросила исключение сама: среднее пустого списка не определено, это сигнал, а не ошибка библиотеки.'
- id: read-the-message
  type: single
  q: |
    Программа печатает разницу между самой высокой и самой низкой температурой за неделю и падает:
    ```
      File "C:\work\temps.py", line 9, in <module>
        print(max(temps) - min(temps))
    TypeError: '>' not supported between instances of 'str' and 'int'
    ```
    Строка 9 выглядит верной. Где вероятнее причина?
  options:
  - 'Там, где заполняли `temps`: одно значение осталось текстом'
  - 'Список `temps` пуст, и `max` нечего сравнивать'
  - '`max` и `min` не сравнивают отрицательные температуры с положительными'
  - 'В строке 9: `max` нужно заменить на `sorted(temps)[-1]`'
  answer: 0
  explain: 'Сообщение говорит, что сравнивали текст с целым числом: в списке смешаны `str` и `int`. Значит, где-то при чтении забыли `int`. Для пустого списка сообщение было бы другим — `ValueError` о пустом аргументе. Отрицательные числа сравниваются как обычно, а `sorted` упадёт на том же сравнении.'
- id: first-step
  type: single
  q: 'Кассир жалуется: сумма по чеку «иногда на несколько рублей меньше». Какой вход лучше всего подходит, чтобы начать искать ошибку?'
  options:
  - 'Чек из 40 позиций, на котором сумма неверна при каждом запуске'
  - 'Чек из 3 позиций, на котором сумма неверна при каждом запуске'
  - 'Чек из 2 позиций, на котором сумма была неверной один раз, а при повторном запуске — верной'
  - 'Чек из одной позиции, на котором сумма верная: на нём проще всего проследить расчёт'
  answer: 1
  explain: 'Нужен вход, на котором ошибка повторяется каждый раз, — тогда можно проверять предположения и убедиться, что исправление помогло. Из двух таких меньший удобнее: три позиции можно проследить вручную, а в сорока ошибка теряется. Чек, где ошибка не повторилась, ничего не проверит, а чек с верной суммой не содержит ошибки вовсе.'
- id: first-or-last
  type: single
  q: '`count_cold(temps)` должна считать морозные дни (ниже нуля), но на каждом наборе ответ на один меньше. Есть два предположения: «не проверяется первый день» и «не проверяется последний». Какая пара вызовов различит их?'
  options:
  - '`count_cold([-3])` и `count_cold([-5])`'
  - '`count_cold([-3, -5])` и `count_cold([-5, -3])`'
  - '`count_cold([2, -3])` и `count_cold([-3, 2])`'
  - '`count_cold([])` и `count_cold([-3])`'
  answer: 2
  explain: 'В паре с `[2, -3]` и `[-3, 2]` морозный день то последний, то первый: если не проверяется первый, 0 вернёт `[-3, 2]`, если последний — `[2, -3]`. Перестановка двух морозных дней ничего не различает: в каждом вызове теряется один из них, обе версии ответят 1. В списке из одного дня он и первый, и последний, а пустой список даст 0 при любой ошибке.'
- id: bisect-conclusions
  type: multi
  q: 'Данные проходят четыре шага: `read_rows` → `clean` → `convert` → `total`, и итог неверный. Вы напечатали результат `clean` — данные верные. Какие выводы правильные?'
  options:
  - 'На этом входе `read_rows` и `clean` можно больше не проверять'
  - 'Ошибка — в `convert` или в `total`'
  - 'Ошибка точно в `total`: неверный итог выдаёт именно она'
  - 'Следующий `print` разумно поставить после `convert`'
  - 'Нужно проверить `read_rows`: верные данные после `clean` могли скрыть её ошибку'
  answer:
  - 0
  - 1
  - 3
  explain: 'Данные после `clean` верны — значит, первые два шага на этом входе отработали правильно, и ошибка дальше по пути. `total` выдаёт итог, но могла получить неверный список из `convert`. Это и покажет `print` после `convert` — снова половина оставшегося пути. Возвращаться к `read_rows` незачем: что бы она ни выдала, до `convert` дошли верные данные, а итог испортился позже.'
- id: ai-silence-fix
  type: multi
  q: 'Отчёт со средним баллом падает с `ZeroDivisionError`: у Бориса нет оценок. По условию для ученика без оценок отчёт печатает «нет оценок». ИИ-ассистент предложил правки. Какие из них исправляют ошибку, а не прячут её?'
  options:
  - 'Перед делением `if not marks:` печатать имя и «нет оценок», иначе — среднее'
  - 'Обернуть печать среднего в `try` с `except ZeroDivisionError: pass`'
  - 'Обернуть печать среднего в `try` с `except ZeroDivisionError:` и печатать в нём имя и «нет оценок»'
  - 'Для пустого списка возвращать из функции среднего 0'
  answer:
  - 0
  - 2
  explain: 'Исправление делает то, что требует условие для этого случая. Проверка пустого списка заранее и перехват конкретного `ZeroDivisionError` с печатью «нет оценок» — два способа это сделать. С `pass` тип тоже конкретный, но Борис молча пропадёт из отчёта. 0 спрячет отсутствие оценок под настоящий ноль — в отчёте не отличить «нет оценок» от плохих оценок.'
- id: last-element-lost
  type: multi
  q: |
    Функция должна считать опоздания — значения больше нуля. На каких входах она вернёт верный ответ?
    ```python
    def count_late(minutes):
        count = 0
        for i in range(len(minutes) - 1):
            if minutes[i] > 0:
                count += 1
        return count
    ```
  options:
  - '`[0, 5, 0]`'
  - '`[5, 0]`'
  - '`[0, 5]`'
  - '`[]`'
  - '`[7]`'
  answer:
  - 0
  - 1
  - 3
  explain: '`range(len(minutes) - 1)` не доходит до последнего индекса. Если последнее значение не опоздание, ответ верный: `[0, 5, 0]` → 1, `[5, 0]` → 1. Для `[]` диапазон пуст, 0 — верно. Ошибка видна, только когда опоздание стоит последним: `[0, 5]` и `[7]` дают 0 вместо 1. Самый маленький вход, на котором ошибка воспроизводится, — `[7]`.'
- id: predict-traceback
  type: multi
  q: |
    Программа печатает стоимость доставки по заказам. Что будет в выводе?
    ```python
    def fee(kind):
        return {"обычный": 50, "срочный": 150}[kind]

    def order_total(items):
        total = 0
        for kind in items:
            total += fee(kind)
        return total

    def receipt(orders):
        for name, items in orders.items():
            print(name, order_total(items))

    receipt({"Аня": ["обычный"], "Борис": ["срочный", "экспресс"]})
    ```
  options:
  - 'Строка `Аня 50` перед traceback'
  - 'Пары в traceback сверху вниз: основная программа, `receipt`, `order_total`, `fee`'
  - 'Пара вызова `fee` для «срочный»: он был до ошибки'
  - 'Последняя строка — `KeyError: ''экспресс''`'
  - 'Пара вызова `order_total` для заказа Ани'
  answer:
  - 0
  - 1
  - 3
  explain: 'Заказ Ани посчитан и напечатан до ошибки. На «экспресс» ключа в словаре нет — `KeyError`, и в этот момент не закончены четыре вызова: программа, `receipt`, `order_total` для Бориса и `fee`. Вызовы `fee("срочный")` и `order_total` для Ани уже закончились и ушли из стека вызовов — в traceback их нет.'
- id: open-debug-plan
  type: open
  q: 'Программа считает сумму заказа и выдаёт 1260 вместо 1350. Она не падает, сообщения об ошибке нет. Опишите, как вы будете искать ошибку, не меняя код наугад.'
  rubric:
  - воспроизвести ошибку и сузить вход — найти небольшой заказ, на котором сумма неверна каждый раз
  - выдвинуть предположение об одной конкретной причине и проверить его — print промежуточного значения (например, посередине пути данных), assert или прогон вручную на маленьком входе
  wrong_answers:
  - раз сообщения об ошибке нет, нужно обернуть расчёт в try/except
  - поменять несколько строк и посмотреть, станет ли сумма верной
  - переписать программу заново
  followups:
  - Как понять, в какой части программы искать, если данные проходят несколько функций?
  - Что делать, если проверка не подтвердила предположение?
