id: p1e-fix-parking
title: Жалоба на парковку
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте программу парковки: за ровно 15 минут она берёт 100 ₽, хотя такая стоянка бесплатна.**

  Тариф: до 15 минут включительно — 0 ₽, до 120 минут включительно — 100 ₽, дольше — 300 ₽. Ввод — время стоянок в минутах, по одному целому числу в строке, в конце пустая строка. Вывод — строка `N мин — C ₽` на каждую стоянку и `Итого: S ₽`. Функцию `parking_cost(minutes)` оставьте.

  Пример 1
  ```input
  10
  60
  200

  ```
  ```output
  10 мин — 0 ₽
  60 мин — 100 ₽
  200 мин — 300 ₽
  Итого: 400 ₽
  ```

  Пример 2
  ```input
  15

  ```
  ```output
  15 мин — 0 ₽
  Итого: 0 ₽
  ```
starter: |
  def parking_cost(minutes):
      if minutes < 15:
          return 0
      if minutes < 120:
          return 100
      return 300


  total = 0
  line = input()
  while line != "":
      minutes = int(line)
      cost = parking_cost(minutes)
      print(f"{minutes} мин — {cost} ₽")
      total += cost
      line = input()
  print(f"Итого: {total} ₽")
solution: |
  def parking_cost(minutes):
      if minutes <= 15:
          return 0
      if minutes <= 120:
          return 100
      return 300


  total = 0
  line = input()
  while line != "":
      minutes = int(line)
      cost = parking_cost(minutes)
      print(f"{minutes} мин — {cost} ₽")
      total += cost
      line = input()
  print(f"Итого: {total} ₽")
tests:
  stdin: "\n"
  io:
    - name: Пример из условия
      stdin: "10\n60\n200\n\n"
      stdout: "10 мин — 0 ₽\n60 мин — 100 ₽\n200 мин — 300 ₽\nИтого: 400 ₽"
    - name: Жалоба водителя
      stdin: "15\n\n"
      stdout: "15 мин — 0 ₽\nИтого: 0 ₽"
    - name: Граница 120
      stdin: "120\n121\n\n"
      stdout: "120 мин — 100 ₽\n121 мин — 300 ₽\nИтого: 400 ₽"
      hidden: true
    - name: Сразу за бесплатными минутами
      stdin: "16\n0\n\n"
      stdout: "16 мин — 100 ₽\n0 мин — 0 ₽\nИтого: 100 ₽"
      hidden: true
  asserts:
    - name: Обе границы тарифа
      code: |
        for minutes, cost in [(15, 0), (16, 100), (120, 100), (121, 300)]:
            got = parking_cost(minutes)
            assert got == cost, f"parking_cost({minutes}) должна вернуть {cost}, а вернула {got}"
hints:
  - level: 1
    text: 'Запустите программу на вводе `15` — ошибка повторяется? Что значит «до 15 минут включительно» на языке сравнений?'
  - level: 2
    text: 'Под функцией допишите `assert parking_cost(15) == 0` и такие же проверки для других стыков тарифа — по обе стороны от каждой границы. Какие из них падают?'
  - level: 3
    text: 'Сравнение `<` не включает границу. Пройдите по всем сравнениям в функции: входит ли каждая граница в свою группу тарифа?'
