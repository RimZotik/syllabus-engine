id: p1e-fix-parking
title: Жалоба на парковку
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте функцию `parking_cost(minutes)`: за ровно 15 минут она берёт 100 ₽, хотя такая стоянка бесплатна.**

  `minutes` — время стоянки, целое число минут от 0; функция возвращает цену в рублях. Тариф: до 15 минут включительно — 0 ₽, до 120 минут включительно — 100 ₽, дольше — 300 ₽. Под функцией — программа, которая печатает цену нескольких стоянок: по ней удобно искать ошибку.

  Пример 1
  ```call
  parking_cost(60)
  ```
  ```return
  100
  ```

  Пример 2 — жалоба водителя
  ```call
  parking_cost(15)
  ```
  ```return
  0
  ```
starter: |
  def parking_cost(minutes):
      if minutes < 15:
          return 0
      if minutes < 120:
          return 100
      return 300


  for minutes in [10, 60, 200, 15]:
      print(f"{minutes} мин — {parking_cost(minutes)} ₽")
solution: |
  def parking_cost(minutes):
      if minutes <= 15:
          return 0
      if minutes <= 120:
          return 100
      return 300


  for minutes in [10, 60, 200, 15]:
      print(f"{minutes} мин — {parking_cost(minutes)} ₽")
tests:
  function: parking_cost
  calls:
    - name: Короткая стоянка
      args: [10]
      expect: 0
    - name: Час
      args: [60]
      expect: 100
    - name: Долгая стоянка
      args: [200]
      expect: 300
    - name: Жалоба водителя — ровно 15 минут
      args: [15]
      expect: 0
    - name: Сразу за бесплатными минутами
      args: [16]
      expect: 100
      hidden: true
    - name: Ровно 120 минут
      args: [120]
      expect: 100
      hidden: true
    - name: Сразу за 120 минутами
      args: [121]
      expect: 300
      hidden: true
    - name: Ноль минут
      args: [0]
      expect: 0
      hidden: true
hints:
  - level: 1
    text: 'Запустите программу: что она печатает для 15 минут? Что значит «до 15 минут включительно» на языке сравнений?'
  - level: 2
    text: 'Под функцией допишите `assert parking_cost(15) == 0` и такие же проверки для других стыков тарифа — по обе стороны от каждой границы. Какие из них падают?'
  - level: 3
    text: 'Сравнение `<` не включает границу. Пройдите по всем сравнениям в функции: входит ли каждая граница в свою группу тарифа?'
