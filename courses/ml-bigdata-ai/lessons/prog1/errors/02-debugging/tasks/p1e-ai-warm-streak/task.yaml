id: p1e-ai-warm-streak
title: ИИ-ассистент ищет самую длинную оттепель
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте функцию `longest_warm_streak(temps)`: она должна возвращать длину самой длинной серии дней подряд с температурой выше нуля, а если тёплых дней нет — 0.**

  `temps` — список целых температур по дням, функция возвращает целое число. Код в редакторе написал ИИ-ассистент: на примере 1 он отвечает верно, на примере 2 — 2 вместо 3. Не переписывайте функцию заново: найдите самый короткий вход, на котором ошибка ещё есть, и по нему — причину.

  Пример 1
  ```call
  longest_warm_streak([3, 5, -1, 2])
  ```
  ```return
  2
  ```

  Пример 2
  ```call
  longest_warm_streak([-3, 1, 2, -1, 4, 5, 6])
  ```
  ```return
  3
  ```

  Ограничения: в списке от 0 до 100 целых чисел; ноль — не выше нуля.
starter: |
  # Решение от ИИ-ассистента
  def longest_warm_streak(temps):
      best = 0
      current = 0
      for t in temps:
          if t > 0:
              current += 1
          else:
              if current > best:
                  best = current
              current = 0
      return best


  print(longest_warm_streak([3, 5, -1, 2]))
  print(longest_warm_streak([-3, 1, 2, -1, 4, 5, 6]))
solution: |
  def longest_warm_streak(temps):
      best = 0
      current = 0
      for t in temps:
          if t > 0:
              current += 1
              if current > best:
                  best = current
          else:
              current = 0
      return best


  print(longest_warm_streak([3, 5, -1, 2]))
  print(longest_warm_streak([-3, 1, 2, -1, 4, 5, 6]))
tests:
  function: longest_warm_streak
  calls:
    - name: Первый пример
      args: [[3, 5, -1, 2]]
      expect: 2
    - name: Второй пример
      args: [[-3, 1, 2, -1, 4, 5, 6]]
      expect: 3
    - name: Один тёплый день
      args: [[4]]
      expect: 1
    - name: Все дни тёплые
      args: [[1, 2, 3]]
      expect: 3
    - name: Самая длинная серия — в середине
      args: [[1, -1, 2, 3, 4, 0, 5]]
      expect: 3
      hidden: true
    - name: Ноль — не выше нуля
      args: [[0, -1, -5]]
      expect: 0
    - name: Пустой список
      args: [[]]
      expect: 0
      hidden: true
hints:
  - level: 1
    text: 'Укоротите второй пример: какая серия в нём потерялась? Найдите самый короткий вход, на котором ответ всё ещё неверен. Чтобы увидеть, что происходит внутри, добавьте в цикл `print(t, current, best)` — он не влияет на проверку.'
  - level: 2
    text: 'Сравните, что вернёт функция на `[4]` и на `[4, -1]`. Чем различаются эти входы? Посмотрите, в какой момент функция обновляет `best`.'
  - level: 3
    text: 'Серия, которая тянется до последнего дня, не заканчивается холодным днём — для неё ветка `else` не выполняется. Где ещё можно сравнить `current` с `best`?'
