id: p1e-ai-warm-streak
title: ИИ-ассистент ищет самую длинную оттепель
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте `longest_warm_streak(temps)`: вернуть длину самой длинной серии дней подряд с температурой выше нуля, а если тёплых дней нет — 0.**

  Код в редакторе написал ИИ-ассистент: на примере 1 он отвечает верно, на примере 2 — 2 вместо 3. Не переписывайте функцию заново: найдите самый короткий вход, на котором ошибка ещё есть, и по нему — причину.

  Пример 1
  ```input
  longest_warm_streak([3, 5, -1, 2])
  ```
  ```output
  2
  ```

  Пример 2
  ```input
  longest_warm_streak([-3, 1, 2, -1, 4, 5, 6])
  ```
  ```output
  3
  ```
starter: |
  # Решение от ИИ-ассистента
  def longest_warm_streak(temps):
      best = 0
      current = 0
      for t in temps:
          if t > 0:
              current += 1
          else:
              if current > best:
                  best = current
              current = 0
      return best


  print(longest_warm_streak([3, 5, -1, 2]))
  print(longest_warm_streak([-3, 1, 2, -1, 4, 5, 6]))
solution: |
  def longest_warm_streak(temps):
      best = 0
      current = 0
      for t in temps:
          if t > 0:
              current += 1
              if current > best:
                  best = current
          else:
              current = 0
      return best


  print(longest_warm_streak([3, 5, -1, 2]))
  print(longest_warm_streak([-3, 1, 2, -1, 4, 5, 6]))
tests:
  asserts:
    - name: Первый пример
      code: |
        assert longest_warm_streak([3, 5, -1, 2]) == 2, "Для [3, 5, -1, 2] самая длинная серия — 2"
    - name: Второй пример
      code: |
        got = longest_warm_streak([-3, 1, 2, -1, 4, 5, 6])
        assert got == 3, f"Для [-3, 1, 2, -1, 4, 5, 6] нужно 3, а вернулось {got}"
    - name: Один день
      code: |
        got = longest_warm_streak([4])
        assert got == 1, f"longest_warm_streak([4]) должна вернуть 1, а вернула {got}"
    - name: Три дня
      code: |
        assert longest_warm_streak([1, 2, 3]) == 3, "Для [1, 2, 3] нужно 3"
    - name: Холодные дни и пустой список
      code: |
        assert longest_warm_streak([0, -1, -5]) == 0, "Ноль — не выше нуля: для [0, -1, -5] нужно 0"
        assert longest_warm_streak([]) == 0, "Для пустого списка нужно 0"
hints:
  - level: 1
    text: 'Укоротите второй пример: какая серия в нём потерялась? Найдите самый короткий вход, на котором ответ всё ещё неверен.'
  - level: 2
    text: 'Сравните, что вернёт функция на `[4]` и на `[4, -1]`. Чем различаются эти входы? Посмотрите, в какой момент функция обновляет `best`.'
  - level: 3
    text: 'Серия, которая тянется до последнего дня, не заканчивается холодным днём — для неё ветка `else` не выполняется. Где ещё можно сравнить `current` с `best`?'
