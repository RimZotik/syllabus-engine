title: Проверка темы
pass: 0.85
minutes: 40
questions:
- id: flag-check-fails
  type: multi
  q: |
    В каких случаях эта проверка провалится — упадёт с `AssertionError` или с другим исключением?
    ```python
    raised = False
    try:
        parse_age("-3")
    except ValueError:
        raised = True
    assert raised, "parse_age(\"-3\") должна выбросить ValueError"
    ```
  options:
  - '`parse_age` вернула `-3`'
  - '`parse_age` выбросила `ValueError` с текстом, которого вы не ждали'
  - '`parse_age` выбросила `TypeError`'
  - '`parse_age` напечатала «неверный возраст» и вернула `None`'
  - '`parse_age` напечатала строку «внимание: странный возраст», а потом выбросила `ValueError`'
  answer:
  - 0
  - 2
  - 3
  explain: 'Если функция что-то вернула — число или `None`, — исключения не было, флаг остался `False`, и `assert` падает. `TypeError` этот `except` не ловит — проверка падает с ним. Любой `ValueError` поднимает флаг, что бы функция ни напечатала до него и какой бы ни был текст: текст эта проверка не смотрит.'
- id: new-kind-of-case
  type: multi
  q: |
    `best_mark(marks)` возвращает лучшую оценку; для пустого списка — `ValueError`. Есть проверки:
    ```python
    assert best_mark([5, 4, 3]) == 5
    assert best_mark([2, 3, 4]) == 4
    assert best_mark([3, 5, 4]) == 5
    ```
    Какие добавления проверят случай нового вида, которого в наборе ещё нет?
  options:
  - '`assert best_mark([4]) == 4`'
  - 'Проверка флагом, что `best_mark([])` выбрасывает `ValueError`'
  - '`assert best_mark([5, 5]) == 5`'
  - '`assert best_mark([4, 5, 2]) == 5`'
  - '`assert best_mark([4, 3, 5]) == 5`'
  answer:
  - 0
  - 1
  - 2
  explain: 'В наборе только обычные списки из разных оценок. Один элемент и повторяющиеся значения — граничные случаи, пустой список — «плохой» вход. Ещё две перестановки — снова обычные: лучшая оценка в начале, в конце и в середине уже проверена.'
- id: stop-at-first-assert
  type: single
  q: |
    Условие: «Скидка пенсионерам — с 60 лет включительно». В функции ошибка: `>` вместо `>=`. Что покажет запуск файла?
    ```python
    def has_discount(age):
        return age > 60

    assert not has_discount(30), "30 лет — без скидки"
    assert not has_discount(59), "59 лет — без скидки"
    assert has_discount(60), "60 лет — скидка"
    assert has_discount(61), "61 год — скидка"
    assert has_discount(80), "80 лет — скидка"
    ```
  options:
  - '`AssertionError: 60 лет — скидка`, и на этом всё: проверки для 61 и 80 не выполнятся'
  - '`AssertionError: 60 лет — скидка`, затем проверки для 61 и 80 выполнятся и пройдут'
  - 'Два `AssertionError` — для 59 и для 60: ошибка на стыке задевает обе его стороны'
  - 'Ничего: проверки для 59 и 61 проходят, значит, граница проверена'
  answer: 0
  explain: 'Непойманный `AssertionError` останавливает программу, как любое исключение, поэтому проверки ниже упавшей не выполняются: что функция отвечает для 61 и 80, этот запуск не скажет. Падает только 60: для 59 обе версии отвечают «нет скидки», для 61 — «есть». Проверки по обе стороны от 60 молчат, ошибку ловит лишь значение на самой границе.'
- id: assert-or-raise
  type: multi
  q: Какие проверки лучше записать через `if` и `raise ValueError(...)`, а не через `assert`?
  options:
  - 'Количество товара, которое ввёл покупатель, больше нуля'
  - 'Процент скидки, который пришёл из чужой функции, — от 0 до 100'
  - '`average([4, 5])` возвращает 4.5 — проверка под вашей функцией'
  - 'Список, который ваша функция только что отсортировала, действительно упорядочен'
  answer:
  - 0
  - 1
  explain: 'Всё, что приходит снаружи — от пользователя или из чужого кода, — может быть неверным в любой момент и должно проверяться всегда. А `assert` при запуске с `-O` пропускается. Проверка `average` и проверка результата сортировки — о вашем коде: ложь там означает баг, и для этого `assert` подходит.'
- id: code-fix-paren-asserts
  type: code
  q: |
    `discount(price)` даёт скидку 10 %. Набор `check_discount(f)` должен молчать на верной функции и падать с `AssertionError` на неверной. **Сейчас он молчит всегда — даже на функции без скидки.** Исправьте набор.
    ```input
    check_discount(discount)
    check_discount(функция без скидки)
    ```
    ```output
    (ничего)
    AssertionError: f(100) должна вернуть 90, а вернула 100
    ```
  starter: |
    def check_discount(f):
        assert (f(100) == 90, f"f(100) должна вернуть 90, а вернула {f(100)}")
        assert (f(0) == 0, f"f(0) должна вернуть 0, а вернула {f(0)}")
        assert (f(250) == 225, f"f(250) должна вернуть 225, а вернула {f(250)}")


    def discount(price):
        return price * 0.9


    check_discount(discount)
  solution: |
    def check_discount(f):
        assert f(100) == 90, f"f(100) должна вернуть 90, а вернула {f(100)}"
        assert f(0) == 0, f"f(0) должна вернуть 0, а вернула {f(0)}"
        assert f(250) == 225, f"f(250) должна вернуть 225, а вернула {f(250)}"


    def discount(price):
        return price * 0.9


    check_discount(discount)
  tests:
    asserts:
    - name: Верную функцию проверки пропускают
      code: |
        def _ok(price):
            return price * 0.9
        try:
            check_discount(_ok)
        except AssertionError as e:
            assert False, f"Ваши проверки отвергли верную функцию: {e}"
    - name: Сломанные версии проверки ловят
      code: |
        def _none(price):
            return price
        def _twenty(price):
            return price * 0.8
        def _minus(price):
            return price - 10
        missed = []
        for name, broken in [("без скидки", _none), ("скидка 20 %", _twenty), ("минус 10 рублей", _minus)]:
            try:
                check_discount(broken)
                missed.append(name)
            except AssertionError:
                pass
        assert not missed, "Проверки не поймали сломанные версии: " + "; ".join(missed)
  explain: 'В скобках после `assert` стоит кортеж из двух элементов — сравнения и текста. Непустой кортеж всегда истинен, поэтому такой `assert` не проверяет ничего. Без скобок условие и текст — две части самого `assert`: ложное условие выбрасывает `AssertionError` с этим текстом. Функцию `discount` менять было не нужно: она верна.'
- id: code-fix-swallowed-check
  type: code
  q: |
    `set_timer(minutes)` при нуле и отрицательных минутах выбрасывает `ValueError`. Набор `check_set_timer(f)` должен это проверять, **но молчит, что бы ни делала функция.** Исправьте набор.
    ```input
    check_set_timer(set_timer)
    check_set_timer(функция, которая принимает 0)
    ```
    ```output
    (ничего)
    AssertionError: f(0) должна выбросить ValueError
    ```
    - Функция вернула значение вместо исключения — набор падает с `AssertionError`.
    - Функция выбросила исключение другого типа — набор его не ловит и падает вместе с ним.
  starter: |
    def check_set_timer(f):
        assert f(5) == 5, f"f(5) должна вернуть 5, а вернула {f(5)}"
        for bad in [0, -3]:
            try:
                f(bad)
                assert False, f"f({bad}) не выбросила исключение"
            except:
                pass


    def set_timer(minutes):
        if minutes <= 0:
            raise ValueError(f"минут должно быть больше нуля, а не {minutes}")
        return minutes


    check_set_timer(set_timer)
  solution: |
    def check_set_timer(f):
        assert f(5) == 5, f"f(5) должна вернуть 5, а вернула {f(5)}"
        for bad in [0, -3]:
            raised = False
            try:
                f(bad)
            except ValueError:
                raised = True
            assert raised, f"f({bad}) должна выбросить ValueError"


    def set_timer(minutes):
        if minutes <= 0:
            raise ValueError(f"минут должно быть больше нуля, а не {minutes}")
        return minutes


    check_set_timer(set_timer)
  tests:
    asserts:
    - name: Верную функцию проверки пропускают
      code: |
        def _ok(minutes):
            if minutes <= 0:
                raise ValueError("минут должно быть больше нуля")
            return minutes
        try:
            check_set_timer(_ok)
        except AssertionError as e:
            assert False, f"Ваши проверки отвергли верную функцию: {e}"
    - name: Функция вернула значение — проверки падают
      code: |
        def _zero_ok(minutes):           # ноль принимается
            if minutes < 0:
                raise ValueError("минут должно быть больше нуля")
            return minutes
        def _no_check(minutes):          # проверки нет вовсе
            return minutes
        missed = []
        for name, broken in [("ноль принимается", _zero_ok), ("нет проверки минут", _no_check)]:
            try:
                check_set_timer(broken)
                missed.append(name)
            except AssertionError:
                pass
        assert not missed, "Проверки не поймали сломанные версии: " + "; ".join(missed)
    - name: Другое исключение — проверки падают
      code: |
        def _wrong_type(minutes):
            if minutes <= 0:
                raise TypeError("минут должно быть больше нуля")
            return minutes
        silent = True
        try:
            check_set_timer(_wrong_type)
        except (AssertionError, TypeError):
            silent = False
        assert not silent, "Функция выбросила TypeError вместо ValueError, а проверки промолчали"
  explain: 'Если функция не выбросит исключение, `assert False` выбросит `AssertionError` — но внутри того же `try`, и `except` без типа его поймает. Он ловит и `TypeError`. Нужен флаг: поднять его в `except ValueError`, а `assert` поставить после всей конструкции. Тогда возвращённое значение оставит флаг опущенным, а исключение другого типа никто не поймает — оно само уронит проверку. Подойдёт и `else` с `assert False`: он выполняется, только если исключения не было, и стоит вне `try`.'
- id: code-complete-membership
  type: code
  q: |
    Тариф фитнес-клуба: до 4 посещений в месяц включительно — `лёгкий`, от 5 до 12 — `стандарт`, больше 12 — `безлимит`. Функция с ошибкой на стыке групп проходит набор `check_membership(f)`. **Допишите набор, чтобы он ловил ошибку на любом стыке**, а верную функцию пропускал.
    ```input
    check_membership(membership)
    check_membership(функция, где 5 посещений — «лёгкий»)
    ```
    ```output
    (ничего)
    AssertionError: f(5) должна вернуть «стандарт», а вернула лёгкий
    ```
  starter: |
    def check_membership(f):
        assert f(2) == "лёгкий", f"f(2) должна вернуть «лёгкий», а вернула {f(2)}"
        assert f(4) == "лёгкий", f"f(4) должна вернуть «лёгкий», а вернула {f(4)}"
        assert f(8) == "стандарт", f"f(8) должна вернуть «стандарт», а вернула {f(8)}"
        assert f(20) == "безлимит", f"f(20) должна вернуть «безлимит», а вернула {f(20)}"


    def membership(visits):
        if visits <= 4:
            return "лёгкий"
        if visits <= 12:
            return "стандарт"
        return "безлимит"


    check_membership(membership)
  solution: |
    def check_membership(f):
        assert f(2) == "лёгкий", f"f(2) должна вернуть «лёгкий», а вернула {f(2)}"
        assert f(4) == "лёгкий", f"f(4) должна вернуть «лёгкий», а вернула {f(4)}"
        assert f(8) == "стандарт", f"f(8) должна вернуть «стандарт», а вернула {f(8)}"
        assert f(20) == "безлимит", f"f(20) должна вернуть «безлимит», а вернула {f(20)}"
        for visits, plan in [(0, "лёгкий"), (5, "стандарт"), (12, "стандарт"), (13, "безлимит")]:
            assert f(visits) == plan, f"f({visits}) должна вернуть «{plan}», а вернула {f(visits)}"


    def membership(visits):
        if visits <= 4:
            return "лёгкий"
        if visits <= 12:
            return "стандарт"
        return "безлимит"


    check_membership(membership)
  tests:
    asserts:
    - name: Верную функцию проверки пропускают
      code: |
        def _ok(visits):
            if visits <= 4:
                return "лёгкий"
            if visits <= 12:
                return "стандарт"
            return "безлимит"
        try:
            check_membership(_ok)
        except AssertionError as e:
            assert False, f"Ваши проверки отвергли верную функцию: {e}"
    - name: Ошибки на стыках проверки ловят
      code: |
        def _make(light, std):
            def f(visits):
                if visits <= light:
                    return "лёгкий"
                if visits <= std:
                    return "стандарт"
                return "безлимит"
            return f
        missed = []
        for name, broken in [("5 посещений — «лёгкий»", _make(5, 12)), ("4 посещения — «стандарт»", _make(3, 12)),
                             ("12 посещений — «безлимит»", _make(4, 11)), ("13 посещений — «стандарт»", _make(4, 13))]:
            try:
                check_membership(broken)
                missed.append(name)
            except AssertionError:
                pass
        assert not missed, "Проверки не поймали сломанные версии: " + "; ".join(missed)
  explain: 'Ошибка вида `<` вместо `<=` живёт на стыке групп, поэтому каждый стык проверяют с обеих сторон: 4 и 5, 12 и 13. В наборе была только одна сторона первого стыка, а второй не проверялся вовсе — `visits <= 5` или `visits < 12` проходили. Ноль посещений — край допустимых значений, его тоже стоит проверить, хотя ни одна сломанная версия здесь на нём не ошибается.'
- id: code-fix-ai-expectation
  type: code
  q: |
    Условие: «Скидка 10 % на заказы от 1000 ₽». ИИ-ассистент написал `order_total(total)` и набор `check_order_total(f)` — все проверки проходят. **Посчитайте ожидания по условию и исправьте набор, затем — функцию.**
    ```input
    order_total(500)
    order_total(2000)
    ```
    ```output
    500
    1800.0
    ```
    - Добавьте проверки по обе стороны от границы скидки.
    - Исправленный набор молчит на верной функции и падает на неверной.
  starter: |
    def check_order_total(f):
        assert f(500) == 500, f"f(500) должна вернуть 500, а вернула {f(500)}"
        assert f(1000) == 1000, f"f(1000) должна вернуть 1000, а вернула {f(1000)}"
        assert f(2000) == 1800, f"f(2000) должна вернуть 1800, а вернула {f(2000)}"


    def order_total(total):
        if total > 1000:
            return total * 0.9
        return total


    check_order_total(order_total)
  solution: |
    def check_order_total(f):
        assert f(500) == 500, f"f(500) должна вернуть 500, а вернула {f(500)}"
        assert f(999) == 999, f"f(999) должна вернуть 999, а вернула {f(999)}"
        assert f(1000) == 900, f"f(1000) должна вернуть 900, а вернула {f(1000)}"
        assert f(2000) == 1800, f"f(2000) должна вернуть 1800, а вернула {f(2000)}"


    def order_total(total):
        if total >= 1000:
            return total * 0.9
        return total


    check_order_total(order_total)
  tests:
    asserts:
    - name: Исправленная функция
      code: |
        for total, want in [(500, 500), (999, 999), (1000, 900), (2000, 1800), (0, 0)]:
            r = order_total(total)
            assert r == want, f"order_total({total}) должна вернуть {want}, а вернула {r!r}"
    - name: Верную функцию проверки пропускают
      code: |
        def _ok(total):
            if total >= 1000:
                return total * 0.9
            return total
        try:
            check_order_total(_ok)
        except AssertionError as e:
            assert False, f"Ваши проверки отвергли верную функцию: {e}"
    - name: Сломанные версии проверки ловят
      code: |
        def _strict(total):              # как у ассистента: 1000 без скидки
            if total > 1000:
                return total * 0.9
            return total
        def _early(total):               # скидка уже с 999
            if total >= 999:
                return total * 0.9
            return total
        def _twenty(total):              # скидка 20 %
            if total >= 1000:
                return total * 0.8
            return total
        missed = []
        for name, broken in [("1000 ₽ без скидки", _strict), ("скидка уже с 999 ₽", _early), ("скидка 20 %", _twenty)]:
            try:
                check_order_total(broken)
                missed.append(name)
            except AssertionError:
                pass
        assert not missed, "Проверки не поймали сломанные версии: " + "; ".join(missed)
  explain: '«От 1000» включает саму 1000: по условию `order_total(1000)` — 900. Ассистент понял условие как «больше 1000» и с этим пониманием написал и функцию, и ожидание, поэтому неверная проверка проходила. Ожидание считают по условию, а не берут из вывода функции. Граница проверяется с двух сторон: 999 — ещё без скидки, 1000 — уже со скидкой. Проверка для 2000 была верной.'
- id: code-write-message-check
  type: code
  q: |
    `parse_mark(text)` переводит оценку из текста в число от 1 до 5. При неверном тексте она выбрасывает `ValueError`, **в тексте которого есть слова** `от 1 до 5`, — так учитель поймёт, что исправить. Допишите `check_parse_mark(f)`, чтобы он проверял и тип исключения, и эти слова.
    ```input
    check_parse_mark(parse_mark)
    check_parse_mark(функция, которая на "6" выбрасывает ValueError("ошибка"))
    ```
    ```output
    (ничего)
    AssertionError: текст исключения для "6" — «ошибка», в нём нет «от 1 до 5»
    ```
    - «Плохие» входы: `"0"`, `"6"`, `"пять"`.
    - Набор падает с `AssertionError`, если функция вернула значение, выбросила `ValueError` без этих слов или неверно ответила на верной оценке.
  starter: |
    def check_parse_mark(f):
        for mark in [1, 3, 5]:
            assert f(str(mark)) == mark, f"f(\"{mark}\") должна вернуть {mark}, а вернула {f(str(mark))}"
        # «плохие» входы: "0", "6", "пять"


    def parse_mark(text):
        try:
            mark = int(text)
        except ValueError:
            raise ValueError(f"оценка — целое число от 1 до 5, а не «{text}»")
        if mark < 1 or mark > 5:
            raise ValueError(f"оценка должна быть от 1 до 5, а не {mark}")
        return mark


    check_parse_mark(parse_mark)
  solution: |
    def check_parse_mark(f):
        for mark in [1, 3, 5]:
            assert f(str(mark)) == mark, f"f(\"{mark}\") должна вернуть {mark}, а вернула {f(str(mark))}"
        for bad in ["0", "6", "пять"]:
            msg = None
            try:
                f(bad)
            except ValueError as e:
                msg = str(e)
            assert msg is not None, f"f(\"{bad}\") должна выбросить ValueError"
            assert "от 1 до 5" in msg, f"Текст исключения для \"{bad}\" — «{msg}», в нём нет «от 1 до 5»"


    def parse_mark(text):
        try:
            mark = int(text)
        except ValueError:
            raise ValueError(f"оценка — целое число от 1 до 5, а не «{text}»")
        if mark < 1 or mark > 5:
            raise ValueError(f"оценка должна быть от 1 до 5, а не {mark}")
        return mark


    check_parse_mark(parse_mark)
  tests:
    asserts:
    - name: Верную функцию проверки пропускают
      code: |
        def _ok(text):
            try:
