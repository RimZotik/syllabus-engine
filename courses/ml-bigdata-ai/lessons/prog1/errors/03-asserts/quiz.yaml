title: Проверка темы
pass: 0.85
minutes: 20
questions:
- id: broken-versions-pass
  type: multi
  q: |
    Тариф фитнес-клуба: до 4 посещений в месяц включительно — «лёгкий», от 5 до 12 — «стандарт», больше 12 — «безлимит». Для функции `membership(visits)` написали проверки:
    ```python
    assert membership(2) == "лёгкий"
    assert membership(4) == "лёгкий"
    assert membership(8) == "стандарт"
    assert membership(20) == "безлимит"
    ```
    Какие сломанные версии функции пройдут все четыре проверки?
  options:
  - '`visits < 4` вместо `visits <= 4`'
  - '`visits < 12` вместо `visits <= 12`'
  - '`visits <= 13` вместо `visits <= 12`'
  - 'Перепутаны «стандарт» и «безлимит»'
  - '`visits <= 5` вместо `visits <= 4`'
  answer:
  - 1
  - 2
  - 4
  explain: 'Проверка для 4 ловит `< 4`, а перепутанные названия ловят проверки для 8 и 20. Граница 12 не проверена ни с одной стороны, поэтому и `< 12`, и `<= 13` проходят. У границы 4/5 проверена только одна сторона: `<= 5` на четырёх отвечает верно, а пятёрку никто не спросил. Нужны проверки для 5, 12 и 13.'
- id: flag-check-fails
  type: multi
  q: |
    В каких случаях эта проверка провалится — упадёт с `AssertionError` или с другим исключением?
    ```python
    raised = False
    try:
        parse_age("-3")
    except ValueError:
        raised = True
    assert raised, "parse_age(\"-3\") должна выбросить ValueError"
    ```
  options:
  - '`parse_age` вернула `-3`'
  - '`parse_age` выбросила `ValueError` с текстом, которого вы не ждали'
  - '`parse_age` выбросила `TypeError`'
  - '`parse_age` напечатала «неверный возраст» и вернула `None`'
  - '`parse_age` напечатала строку «внимание: странный возраст», а потом выбросила `ValueError`'
  answer:
  - 0
  - 2
  - 3
  explain: 'Если функция что-то вернула — число или `None`, — исключения не было, флаг остался `False`, и `assert` падает. `TypeError` этот `except` не ловит — проверка падает с ним. Любой `ValueError` поднимает флаг, что бы функция ни напечатала до него и какой бы ни был текст: текст эта проверка не смотрит.'
- id: bare-except-swallows
  type: single
  q: |
    Чем плоха такая проверка?
    ```python
    try:
        parse_age("-3")
        assert False, "parse_age(\"-3\") не выбросила исключение"
    except:
        pass
    ```
  options:
  - 'Она всегда падает: `assert False` ложен при любом поведении функции'
  - 'Она не проверяет текст сообщения, а в остальном верна'
  - 'Она никогда не падает: `except` без типа ловит и `AssertionError`'
  - 'Ничем: нет исключения — сработает `assert False`, есть — `except`'
  answer: 2
  explain: 'Если `parse_age` не выбросит исключение, `assert False` выбросит `AssertionError` — но он внутри того же `try`, и `except` без типа его поймает. Поймает и `TypeError`, если функция упадёт не так. Проверка молчит при любом исходе. До `assert False` дело доходит, только когда исключения нет, поэтому «всегда падает» тоже неверно.'
- id: ai-own-tests
  type: multi
  q: |
    Условие: «Скидка 10 % на заказы от 1000 ₽». ИИ-ассистент написал функцию с условием `if total > 1000:` и три проверки к ней — все прошли:
    ```python
    assert order_total(500) == 500
    assert order_total(1000) == 1000
    assert order_total(2000) == 1800
    ```
    Какие утверждения верны?
  options:
  - 'Проверка для 1000 повторяет ошибку функции'
  - 'Раз все три проверки прошли, функция соответствует условию'
  - 'Проверка для 2000 верна, её стоит оставить'
  - 'Чтобы найти ошибку, сначала нужно прочитать код функции'
  answer:
  - 0
  - 2
  explain: '«От 1000» включает 1000: по условию `order_total(1000)` — 900. Ассистент понял условие как «больше 1000», и с этим же пониманием написал и функцию, и ожидание — поэтому проверка проходит. Проверка для 2000 верна: 1800 следует из условия. Ошибку видно, если посчитать ожидание для 1000 по условию, — код читать для этого не нужно.'
- id: paren-in-assert
  type: single
  q: |
    Что произойдёт при запуске?
    ```python
    def discount(price):
        return price * 0.9

    assert (discount(100) == 80, "скидка должна быть 20%")
    print("проверка прошла")
    ```
  options:
  - '`AssertionError: скидка должна быть 20%`'
  - '`SyntaxError`: условие `assert` нельзя брать в скобки'
  - '`AssertionError` без текста: скобки отрезали сообщение'
  - 'Напечатается `проверка прошла`'
  answer: 3
  traps:
  - 0
  explain: 'В скобках — кортеж из двух элементов: сравнение и текст. Непустой кортеж истинен, поэтому `assert` молчит, хотя 90 не равно 80, и программа идёт дальше. Синтаксической ошибки нет: Python лишь предупреждает `SyntaxWarning`, и то не везде, — а выполнение продолжается. Пишите без скобок.'
- id: assert-or-raise
  type: multi
  q: Какие проверки лучше записать через `if` и `raise ValueError(...)`, а не через `assert`?
  options:
  - 'Количество товара, которое ввёл покупатель, больше нуля'
  - 'Процент скидки, который пришёл из чужой функции, — от 0 до 100'
  - '`average([4, 5])` возвращает 4.5 — проверка под вашей функцией'
  - 'Список, который ваша функция только что отсортировала, действительно упорядочен'
  answer:
  - 0
  - 1
  explain: 'Всё, что приходит снаружи — от пользователя или из чужого кода, — может быть неверным в любой момент и должно проверяться всегда. А `assert` при запуске с `-O` пропускается. Проверка `average` и проверка результата сортировки — о вашем коде: ложь там означает баг, и для этого `assert` подходит.'
- id: new-kind-of-case
  type: multi
  q: |
    `best_mark(marks)` возвращает лучшую оценку; для пустого списка — `ValueError`. Есть проверки:
    ```python
    assert best_mark([5, 4, 3]) == 5
    assert best_mark([2, 3, 4]) == 4
    assert best_mark([3, 5, 4]) == 5
    ```
    Какие добавления проверят случай нового вида, которого в наборе ещё нет?
  options:
  - '`assert best_mark([4]) == 4`'
  - 'Проверка флагом, что `best_mark([])` выбрасывает `ValueError`'
  - '`assert best_mark([5, 5]) == 5`'
  - '`assert best_mark([4, 5, 2]) == 5`'
  - '`assert best_mark([4, 3, 5]) == 5`'
  answer:
  - 0
  - 1
  - 2
  explain: 'В наборе только обычные списки из разных оценок. Один элемент и повторяющиеся значения — граничные случаи, пустой список — «плохой» вход. Ещё две перестановки — снова обычные: лучшая оценка в начале, в конце и в середине уже проверена.'
- id: stop-at-first-assert
  type: single
  q: |
    Условие: «Скидка пенсионерам — с 60 лет включительно». В функции ошибка: `>` вместо `>=`. Что покажет запуск файла?
    ```python
    def has_discount(age):
        return age > 60

    assert not has_discount(30), "30 лет — без скидки"
    assert not has_discount(59), "59 лет — без скидки"
    assert has_discount(60), "60 лет — скидка"
    assert has_discount(61), "61 год — скидка"
    assert has_discount(80), "80 лет — скидка"
    ```
  options:
  - '`AssertionError: 60 лет — скидка`, и на этом всё: проверки для 61 и 80 не выполнятся'
  - '`AssertionError: 60 лет — скидка`, затем проверки для 61 и 80 выполнятся и пройдут'
  - 'Два `AssertionError` — для 59 и для 60: ошибка на стыке задевает обе его стороны'
  - 'Ничего: проверки для 59 и 61 проходят, значит, граница проверена'
  answer: 0
  explain: 'Непойманный `AssertionError` останавливает программу, как любое исключение, поэтому проверки ниже упавшей не выполняются: что функция отвечает для 61 и 80, этот запуск не скажет. Падает только 60: для 59 обе версии отвечают «нет скидки», для 61 — «есть». Проверки по обе стороны от 60 молчат, ошибку ловит лишь значение на самой границе.'
- id: open-grade-checks
  type: open
  q: 'Функция `grade(points)` переводит баллы за контрольную (целое число от 0 до 100) в оценку: 0–49 — 2, 50–69 — 3, 70–84 — 4, 85–100 — 5; для баллов вне 0..100 — `ValueError`. Какие проверки вы напишете и почему именно такие? Код писать не обязательно: достаточно входов и ожидаемых ответов.'
  rubric:
  - обычные случаи — хотя бы по одному значению внутри каждой оценки
  - граничные — значения на стыках оценок с обеих сторон (например, 49 и 50) и края диапазона 0 и 100, потому что ошибки вида < вместо <= живут на стыках
  - «плохие» входы вне диапазона (например, −1 или 101) — проверить, что функция выбрасывает ValueError, а не возвращает оценку
  wrong_answers:
  - достаточно проверить по одному значению для каждой оценки
  - «плохие» входы проверять не нужно, функция для них не предназначена
  - для −1 написать assert grade(-1) == ValueError
  followups:
  - Какую ошибку в функции пропустит набор, в котором нет значений 69 и 70?
