id: p1e-own-checks
title: Сначала проверки, потом посылка
sandbox: python-browser
difficulty: 2
statement: |
  **Сначала напишите набор проверок `check_parcel_cost(f)`, затем — функцию `parcel_cost(grams)`: стоимость посылки по весу.**

  Тариф (вес в граммах, целое число): до 500 включительно — 150 ₽; до 2000 включительно — 300 ₽; до 10000 включительно — 600 ₽. Вес меньше 1 или больше 10000 — `ValueError` с текстом `вес должен быть от 1 до 10000 г, а не 12000` (в конце — переданный вес).

  `check_parcel_cost(f)` проверяет переданную функцию `f` через `assert`: обычные веса, стыки групп с обеих сторон, края допустимого веса и вес вне диапазона. Для верной функции набор молчит, для неверной — падает с `AssertionError`. Платформа запустит его на верной функции и на нескольких сломанных версиях — каждую он должен поймать; вашу `parcel_cost` она проверит своими проверками. Вызов `check_parcel_cost(parcel_cost)` оставляйте в коде, только когда он проходит.

  Пример 1
  ```call
  parcel_cost(500)
  ```
  ```return
  150
  ```

  Пример 2
  ```call
  parcel_cost(501)
  ```
  ```return
  300
  ```

  Пример 3: `parcel_cost(12000)` выбрасывает `ValueError("вес должен быть от 1 до 10000 г, а не 12000")`.
starter: |
  def check_parcel_cost(f):
      """Мои проверки: f — проверяемая функция."""
      # Обычные: по одному весу из каждой группы
      assert f(200) == 150, f"f(200) должна вернуть 150, а вернула {f(200)}"
      # …

      # Граничные: стыки 500/501 и 2000/2001, края 1 и 10000

      # «Плохие»: 0 и 10001 — f должна выбросить ValueError
      # raised = False
      # try:
      #     f(0)
      # except ValueError:
      #     raised = True
      # assert raised, "f(0) должна выбросить ValueError"


  def parcel_cost(grams):
      """Цена посылки: до 500 г — 150, до 2000 г — 300, до 10000 г — 600; вне 1..10000 — ValueError."""
      pass   # функцию — после проверок


  # check_parcel_cost(parcel_cost)
solution: |
  def check_parcel_cost(f):
      """Мои проверки: f — проверяемая функция."""
      # обычные
      assert f(200) == 150, f"f(200) должна вернуть 150, а вернула {f(200)}"
      assert f(1200) == 300, f"f(1200) должна вернуть 300, а вернула {f(1200)}"
      assert f(5000) == 600, f"f(5000) должна вернуть 600, а вернула {f(5000)}"
      # граничные
      for grams, cost in [(1, 150), (500, 150), (501, 300), (2000, 300), (2001, 600), (10000, 600)]:
          assert f(grams) == cost, f"f({grams}) должна вернуть {cost}, а вернула {f(grams)}"
      # «плохие»
      for bad in [0, -3, 10001]:
          raised = False
          try:
              f(bad)
          except ValueError:
              raised = True
          assert raised, f"f({bad}) должна выбросить ValueError"


  def parcel_cost(grams):
      """Цена посылки: до 500 г — 150, до 2000 г — 300, до 10000 г — 600; вне 1..10000 — ValueError."""
      if grams < 1 or grams > 10000:
          raise ValueError(f"вес должен быть от 1 до 10000 г, а не {grams}")
      if grams <= 500:
          return 150
      if grams <= 2000:
          return 300
      return 600


  check_parcel_cost(parcel_cost)
tests:
  function: parcel_cost
  calls:
    - name: Ваша функция — лёгкая посылка
      args: [200]
      expect: 150
    - name: Ваша функция — средняя посылка
      args: [1200]
      expect: 300
    - name: Ваша функция — тяжёлая посылка
      args: [5000]
      expect: 600
    - name: Ваша функция — стык 500 г
      args: [500]
      expect: 150
    - name: Ваша функция — сразу за 500 г
      args: [501]
      expect: 300
    - name: Ваша функция — стык 2000 г
      args: [2000]
      expect: 300
      hidden: true
    - name: Ваша функция — сразу за 2000 г
      args: [2001]
      expect: 600
      hidden: true
    - name: Ваша функция — край 1 г
      args: [1]
      expect: 150
      hidden: true
    - name: Ваша функция — край 10000 г
      args: [10000]
      expect: 600
      hidden: true
    - name: Ваша функция — 0 г
      args: [0]
      raises: ValueError
    - name: Ваша функция — 10001 г
      args: [10001]
      raises: ValueError
      hidden: true
    - name: Ваша функция — отрицательный вес
      args: [-3]
      raises: ValueError
      hidden: true
  asserts:
    - name: Ваша функция — текст исключения
      code: |
        for bad in [0, -3, 10001, 12000]:
            msg = None
            try:
                parcel_cost(bad)
            except ValueError as e:
                msg = str(e)
            assert msg == f"вес должен быть от 1 до 10000 г, а не {bad}", f"Сообщение исключения для {bad}: «{msg}». Нужно: вес должен быть от 1 до 10000 г, а не {bad}"
    - name: Ваши проверки принимают верную функцию
      code: |
        assert "check_parcel_cost" in globals(), "Нужна функция check_parcel_cost(f) с вашими проверками"
        def _ref(grams):
            if grams < 1 or grams > 10000:
                raise ValueError(f"вес должен быть от 1 до 10000 г, а не {grams}")
            if grams <= 500:
                return 150
            if grams <= 2000:
                return 300
            return 600
        try:
            check_parcel_cost(_ref)
        except AssertionError as e:
            assert False, f"Ваши проверки отвергли верную функцию: {e}"
    - name: Ваши проверки ловят сломанные версии
      code: |
        assert "check_parcel_cost" in globals(), "Нужна функция check_parcel_cost(f) с вашими проверками"
        def _first_border(grams):        # 500 г считается уже второй группой
            if grams < 1 or grams > 10000:
                raise ValueError(f"вес должен быть от 1 до 10000 г, а не {grams}")
            if grams < 500:
                return 150
            if grams <= 2000:
                return 300
            return 600
        def _second_border(grams):       # 2001 г — ещё вторая группа
            if grams < 1 or grams > 10000:
                raise ValueError(f"вес должен быть от 1 до 10000 г, а не {grams}")
            if grams <= 500:
                return 150
            if grams <= 2001:
                return 300
            return 600
        def _no_lower(grams):            # нет проверки нижней границы
            if grams > 10000:
                raise ValueError(f"вес должен быть от 1 до 10000 г, а не {grams}")
            if grams <= 500:
                return 150
            if grams <= 2000:
                return 300
            return 600
        def _upper_off(grams):           # 10001 г ещё принимается
            if grams < 1 or grams > 10001:
                raise ValueError(f"вес должен быть от 1 до 10000 г, а не {grams}")
            if grams <= 500:
                return 150
            if grams <= 2000:
                return 300
            return 600
        missed = []
        for name, broken in [("500 г во второй группе", _first_border), ("2001 г во второй группе", _second_border),
                             ("нет проверки веса меньше 1 г", _no_lower), ("10001 г принимается", _upper_off)]:
            try:
                check_parcel_cost(broken)
                missed.append(name)
            except AssertionError:
                pass
        assert not missed, "Ваши проверки не поймали сломанные версии: " + "; ".join(missed)
hints:
  - level: 1
    text: 'Сколько групп у веса и где их стыки? Для каждого стыка — какие два веса стоят по разные стороны от него? А какой вес — самый маленький и самый большой из допустимых?'
  - level: 2
    text: 'Проверки внутри `check_parcel_cost` вызывают `f`, а не `parcel_cost`. Для каждого стыка — пара весов по обе стороны, плюс края допустимого веса. Вес вне диапазона проверяют флагом: `assert f(0) == ...` здесь не написать.'
  - level: 3
    text: 'Граничные проверки: 1, 500, 501, 2000, 2001, 10000; «плохие» — 0 и 10001 через `try`/`except ValueError` и флаг. В `parcel_cost` сначала отсейте неверный вес `raise`, потом идите по группам с `<=`.'
