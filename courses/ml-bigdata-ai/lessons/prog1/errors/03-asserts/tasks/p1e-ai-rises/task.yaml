id: p1e-ai-rises
title: ИИ-ассистент считает потепления
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите набор проверок `check_rises(f)` и с его помощью найдите и исправьте ошибку в `rises(temps)`.**

  `rises(temps)` возвращает, сколько раз день был теплее предыдущего; у первого дня предыдущего нет. Код `rises` написал ИИ-ассистент, он внизу редактора — проверки пишите по условию, не заглядывая в него, и ответы считайте сами. В `check_rises(f)` нужны обычные случаи и граничные: пустой список, один день, одинаковые температуры, разный порядок дней. Платформа запустит ваш набор на верной функции (он должен промолчать) и на нескольких сломанных версиях (каждую он должен поймать), а исправленную `rises` проверит своими проверками.

  Пример 1
  ```input
  rises([1, 2, 3])
  rises([4, 4, 2, 5])
  ```
  ```output
  2
  1
  ```
starter: |
  def check_rises(f):
      """Мои проверки: f — проверяемая функция."""
      assert f([1, 2, 3]) == 2, f"f([1, 2, 3]) должна вернуть 2, а вернула {f([1, 2, 3])}"
      # обычные: …
      # граничные: пустой список, один день, одинаковые температуры, другой порядок


  # --- код ИИ-ассистента ---
  def rises(temps):
      count = 0
      for i in range(len(temps)):
          if temps[i] > temps[i - 1]:
              count += 1
      return count


  check_rises(rises)
solution: |
  def check_rises(f):
      """Мои проверки: f — проверяемая функция."""
      for temps, expected in [([1, 2, 3], 2), ([4, 4, 2, 5], 1), ([], 0), ([7], 0),
                              ([3, 3, 3], 0), ([3, 1, 2], 1), ([5, 4, 3], 0), ([1, 3], 1)]:
          got = f(temps)
          assert got == expected, f"f({temps}) должна вернуть {expected}, а вернула {got}"


  def rises(temps):
      count = 0
      for i in range(1, len(temps)):
          if temps[i] > temps[i - 1]:
              count += 1
      return count


  check_rises(rises)
tests:
  asserts:
    - name: Примеры из условия
      code: |
        assert rises([1, 2, 3]) == 2, "rises([1, 2, 3]) должна вернуть 2"
        assert rises([4, 4, 2, 5]) == 1, "rises([4, 4, 2, 5]) должна вернуть 1"
    - name: Другой порядок дней
      code: |
        got = rises([3, 1, 2])
        assert got == 1, f"rises([3, 1, 2]) должна вернуть 1, а вернула {got}"
        got = rises([5, 4, 3])
        assert got == 0, f"rises([5, 4, 3]) должна вернуть 0, а вернула {got}"
    - name: Пусто, один день, одинаковые
      code: |
        assert rises([]) == 0, "rises([]) должна вернуть 0"
        assert rises([7]) == 0, "rises([7]) должна вернуть 0: у единственного дня нет предыдущего"
        assert rises([3, 3, 3]) == 0, "Одинаковая температура — не потепление: rises([3, 3, 3]) должна вернуть 0"
    - name: Ваши проверки принимают верную функцию
      code: |
        assert "check_rises" in globals(), "Нужна функция check_rises(f) с вашими проверками"
        def _ref(temps):
            return sum(1 for i in range(1, len(temps)) if temps[i] > temps[i - 1])
        try:
            check_rises(_ref)
        except AssertionError as e:
            assert False, f"Ваши проверки отвергли верную функцию: {e}"
    - name: Ваши проверки ловят сломанные версии
      code: |
        assert "check_rises" in globals(), "Нужна функция check_rises(f) с вашими проверками"
        def _wrap(temps):           # версия ассистента: первый день сравнивается с последним
            return sum(1 for i in range(len(temps)) if temps[i] > temps[i - 1])
        def _not_less(temps):       # одинаковая температура считается потеплением
            return sum(1 for i in range(1, len(temps)) if temps[i] >= temps[i - 1])
        def _skip_last(temps):      # последний день не проверяется
            return sum(1 for i in range(1, len(temps) - 1) if temps[i] > temps[i - 1])
        def _drops(temps):          # считает похолодания
            return sum(1 for i in range(1, len(temps)) if temps[i] < temps[i - 1])
        missed = []
        for name, broken in [("первый день сравнивается с последним", _wrap), ("одинаковая температура считается потеплением", _not_less),
                             ("последний день не проверяется", _skip_last), ("считаются похолодания", _drops)]:
            try:
                check_rises(broken)
                missed.append(name)
            except AssertionError:
                pass
            except IndexError:
                pass
        assert not missed, "Ваши проверки не поймали сломанные версии: " + "; ".join(missed)
hints:
  - level: 1
    text: 'Оба примера из условия идут по возрастанию к концу. Какие ещё наборы стоит взять: где первый день теплее последнего, где дни одинаковые, где день всего один?'
  - level: 2
    text: 'Если `check_rises(rises)` упал на каком-то наборе — проследите цикл ассистента на нём вручную. С каким днём сравнивается первый день, когда `i` равно 0?'
  - level: 3
    text: 'При `i = 0` выражение `temps[i - 1]` — это `temps[-1]`, последний день. С какого индекса должен начинаться цикл?'
