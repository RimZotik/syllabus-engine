id: p1e-oven-timer
title: Таймер духовки
sandbox: python-browser
difficulty: 2
statement: |
  **Спрашивайте время таймера, пока не придёт целое число от 1 до 240, и тогда выведите `Таймер: N мин`.**

  Ввод — строки, по одной на попытку. На каждую неподходящую строку выведите подсказку: не целое число — `Нужно целое число`; 0 или меньше — `Нужно больше нуля`; больше 240 — `Не больше 240 минут`. Пробелы по краям числа допустимы. Подходящая строка во вводе всегда есть.

  Пример 1
  ```input
  сорок
  0
  45
  ```
  ```output
  Нужно целое число
  Нужно больше нуля
  Таймер: 45 мин
  ```

  Ограничения: методы строк `isdigit`, `isdecimal`, `isnumeric` не используйте.
starter: |
  # План:
  # 1. Бесконечный цикл: прочитать строку
  # 2. Попробовать перевести её в целое число;
  #    не вышло — подсказка и следующая попытка
  # 3. Проверить диапазон: вне 1..240 — своя подсказка,
  #    внутри — выйти из цикла
  # 4. После цикла вывести таймер
solution: |
  while True:
      text = input()
      try:
          minutes = int(text)
      except ValueError:
          print("Нужно целое число")
          continue
      if minutes <= 0:
          print("Нужно больше нуля")
      elif minutes > 240:
          print("Не больше 240 минут")
      else:
          break
  print(f"Таймер: {minutes} мин")
tests:
  forbid: [isdigit, isdecimal, isnumeric]
  io:
    - name: Пример из условия
      stdin: "сорок\n0\n45\n"
      stdout: "Нужно целое число\nНужно больше нуля\nТаймер: 45 мин"
    - name: Сразу верно
      stdin: "20\n"
      stdout: "Таймер: 20 мин"
      hidden: true
    - name: Граница 240
      stdin: "241\n240\n"
      stdout: "Не больше 240 минут\nТаймер: 240 мин"
      hidden: true
    - name: Граница 1
      stdin: "-5\n1\n"
      stdout: "Нужно больше нуля\nТаймер: 1 мин"
      hidden: true
    - name: Дробь и пустая строка
      stdin: "7.5\n\n7\n"
      stdout: "Нужно целое число\nНужно целое число\nТаймер: 7 мин"
      hidden: true
    - name: Пробелы по краям
      stdin: " 30 \n"
      stdout: "Таймер: 30 мин"
      hidden: true
    - name: Много попыток
      stdin: "час\n0\n300\n-1\n1.5\n90\n"
      stdout: "Нужно целое число\nНужно больше нуля\nНе больше 240 минут\nНужно больше нуля\nНужно целое число\nТаймер: 90 мин"
      hidden: true
hints:
  - level: 1
    text: 'Сколько раз нужно спрашивать — заранее неизвестно. Какой цикл подходит для «пока не получится»? Где в нём место для `try`?'
  - level: 2
    text: 'Здесь две разные беды: текст не число (это заметит `int`) и число вне 1..240 (это заметите вы). Первую ловит `except`, вторую — обычный `if`. Диапазон проверяют только у того, что стало числом; выход из цикла — только когда обе проверки пройдены.'
  - level: 3
    text: 'В `except` напечатайте подсказку и сразу переходите к следующей попытке. Диапазон проверяйте после `try` цепочкой `if`/`elif`/`else`; выход из цикла — в последней ветке.'
