id: p1e-gym-age
title: Возраст в анкете спортзала
sandbox: python-browser
difficulty: 2
statement: |
  Администратор спортзала переносит анкеты в программу: в каждой строке имя и возраст через пробел. Возраст пишут как попало, поэтому его разбирает отдельная функция.

  Напишите `parse_age(text)`: она возвращает возраст целым числом от 0 до 150, а в остальных случаях выбрасывает `ValueError` с текстом ровно такого вида:

  - не целое число: `возраст должен быть целым числом, а не «двадцать»` — в кавычках-ёлочках сам текст;
  - число вне 0..150: `возраст должен быть от 0 до 150, а не 200`.

  Если вместо текста пришло не текст (например, `None`), пусть функция падает с тем же `TypeError`, что и `int`.

  Под функцией — программа: читает строки до пустой и для каждой выводит `имя: возраст` или `имя: ошибка — текст исключения`.

  ```input
  Аня 35
  Борис двадцать
  Вера 200

  ```
  ```
  Аня: 35
  Борис: ошибка — возраст должен быть целым числом, а не «двадцать»
  Вера: ошибка — возраст должен быть от 0 до 150, а не 200
  ```

  (Последняя строка ввода пустая.)
starter: |
  def parse_age(text):
      """Возраст из текста: целое число от 0 до 150, иначе ValueError."""
      # План:
      # 1. Перевести text в целое; если int не смог —
      #    выбросить свой ValueError с понятным текстом
      # 2. Проверить диапазон; вне 0..150 — свой ValueError
      # 3. Вернуть возраст
      pass


  # Программа:
  # читать строки до пустой, делить на имя и текст возраста,
  # в try вызвать parse_age, при ValueError вывести «имя: ошибка — …»
solution: |
  def parse_age(text):
      """Возраст из текста: целое число от 0 до 150, иначе ValueError."""
      try:
          age = int(text)
      except ValueError:
          raise ValueError(f"возраст должен быть целым числом, а не «{text}»")
      if age < 0 or age > 150:
          raise ValueError(f"возраст должен быть от 0 до 150, а не {age}")
      return age


  line = input()
  while line != "":
      name, age_text = line.split()
      try:
          print(f"{name}: {parse_age(age_text)}")
      except ValueError as e:
          print(f"{name}: ошибка — {e}")
      line = input()
tests:
  stdin: "\n"
  io:
    - name: Пример из условия
      stdin: "Аня 35\nБорис двадцать\nВера 200\n\n"
      stdout: "Аня: 35\nБорис: ошибка — возраст должен быть целым числом, а не «двадцать»\nВера: ошибка — возраст должен быть от 0 до 150, а не 200"
    - name: Края диапазона и выход за них
      stdin: "Гоша 0\nДина 150\nЕгор -1\nЖеня 151\n\n"
      stdout: "Гоша: 0\nДина: 150\nЕгор: ошибка — возраст должен быть от 0 до 150, а не -1\nЖеня: ошибка — возраст должен быть от 0 до 150, а не 151"
      hidden: true
    - name: Дробный возраст
      stdin: "Зоя 30.5\n\n"
      stdout: "Зоя: ошибка — возраст должен быть целым числом, а не «30.5»"
      hidden: true
    - name: Пустая анкета
      stdin: "\n"
      stdout: ""
      hidden: true
  asserts:
    - name: Верный возраст
      code: |
        assert parse_age("35") == 35, "parse_age(\"35\") должна вернуть 35"
        assert parse_age("0") == 0, "parse_age(\"0\") должна вернуть 0: граница входит"
        assert parse_age("150") == 150, "parse_age(\"150\") должна вернуть 150: граница входит"
    - name: Не число — ValueError с текстом
      code: |
        msg = None
        try:
            parse_age("двадцать")
        except ValueError as e:
            msg = str(e)
        assert msg is not None, "parse_age(\"двадцать\") должна выбросить ValueError"
        assert msg == "возраст должен быть целым числом, а не «двадцать»", f"Текст исключения: «{msg}». Нужен: возраст должен быть целым числом, а не «двадцать»"
    - name: Вне диапазона — ValueError с текстом
      code: |
        for text, age in [("200", 200), ("-1", -1), ("151", 151)]:
            msg = None
            try:
                parse_age(text)
            except ValueError as e:
                msg = str(e)
            assert msg is not None, f"parse_age(\"{text}\") должна выбросить ValueError"
            assert msg == f"возраст должен быть от 0 до 150, а не {age}", f"Текст исключения для \"{text}\": «{msg}»"
    - name: Не текст — TypeError
      code: |
        caught = None
        try:
            parse_age(None)
        except TypeError:
            caught = "TypeError"
        except ValueError:
            caught = "ValueError"
        assert caught == "TypeError", f"parse_age(None) должна упасть с TypeError, а не {caught}: ловите только ValueError"
hints:
  - level: 1
    text: 'Две разные беды — текст не число и число вне диапазона. Кто замечает каждую из них: `int` или ваша проверка? Чем должно закончиться каждое из этих событий?'
  - level: 2
    text: 'Непонятный текст исключения от `int` можно заменить своим — вспомните, где в теме `raise` стоял внутри `except`. Диапазон — отдельная проверка после перевода в число. В программе текст пойманного исключения даёт `except ValueError as e`.'
  - level: 3
    text: '`try: age = int(text)` / `except ValueError: raise ValueError(f"возраст должен быть целым числом, а не «{text}»")`, затем `if age < 0 or age > 150: raise ValueError(f"возраст должен быть от 0 до 150, а не {age}")` и `return age`.'
