id: p1e-gym-age
title: Возраст в анкете спортзала
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите функцию `parse_age(text)`, которая возвращает возраст из анкеты целым числом от 0 до 150, а для неподходящего текста выбрасывает `ValueError` с понятным сообщением.**

  `text` — строка из анкеты. Сообщение исключения:
  - текст не целое число — `возраст должен быть целым числом, а не «двадцать»` (в ёлочках — сам текст);
  - число вне 0..150 — `возраст должен быть от 0 до 150, а не 200`.

  Если пришёл не текст, например `None`, функция падает с `TypeError`, как сам `int`. Под функцией в редакторе — программа, которая разбирает анкеты: она ловит ваше исключение и печатает его сообщение.

  Пример 1
  ```call
  parse_age("35")
  ```
  ```return
  35
  ```

  Пример 2
  ```call
  parse_age("150")
  ```
  ```return
  150
  ```

  Пример 3: `parse_age("двадцать")` выбрасывает `ValueError("возраст должен быть целым числом, а не «двадцать»")`, `parse_age("200")` — `ValueError("возраст должен быть от 0 до 150, а не 200")`.

  Ограничения: границы 0 и 150 входят в допустимый возраст.
starter: |
  def parse_age(text):
      """Возраст из текста: целое число от 0 до 150, иначе ValueError."""
      # План:
      # 1. Перевести text в целое; если int не смог —
      #    выбросить свой ValueError с понятным текстом
      # 2. Проверить диапазон; вне 0..150 — свой ValueError
      # 3. Вернуть возраст
      pass


  # Программа: разбирает анкеты и печатает возраст или сообщение исключения
  for name, age_text in [("Аня", "35"), ("Борис", "двадцать"), ("Вера", "200")]:
      try:
          print(f"{name}: {parse_age(age_text)}")
      except ValueError as e:
          print(f"{name}: ошибка — {e}")
solution: |
  def parse_age(text):
      """Возраст из текста: целое число от 0 до 150, иначе ValueError."""
      try:
          age = int(text)
      except ValueError:
          raise ValueError(f"возраст должен быть целым числом, а не «{text}»")
      if age < 0 or age > 150:
          raise ValueError(f"возраст должен быть от 0 до 150, а не {age}")
      return age


  # Программа: разбирает анкеты и печатает возраст или сообщение исключения
  for name, age_text in [("Аня", "35"), ("Борис", "двадцать"), ("Вера", "200")]:
      try:
          print(f"{name}: {parse_age(age_text)}")
      except ValueError as e:
          print(f"{name}: ошибка — {e}")
tests:
  function: parse_age
  calls:
    - name: Обычный возраст
      args: ["35"]
      expect: 35
    - name: Нижняя граница входит
      args: ["0"]
      expect: 0
    - name: Верхняя граница входит
      args: ["150"]
      expect: 150
    - name: Не число — ValueError
      args: ["двадцать"]
      raises: ValueError
    - name: Больше 150 — ValueError
      args: ["200"]
      raises: ValueError
    - name: Сразу за верхней границей
      args: ["151"]
      raises: ValueError
      hidden: true
    - name: Сразу за нижней границей
      args: ["-1"]
      raises: ValueError
      hidden: true
    - name: Дробный возраст
      args: ["30.5"]
      raises: ValueError
      hidden: true
    - name: Не текст — TypeError, как у int
      args: [null]
      raises: TypeError
  asserts:
    - name: Текст исключения — не число
      code: |
        msg = None
        try:
            parse_age("двадцать")
        except ValueError as e:
            msg = str(e)
        assert msg == "возраст должен быть целым числом, а не «двадцать»", f"Сообщение исключения: «{msg}». Нужно: возраст должен быть целым числом, а не «двадцать»"
    - name: Текст исключения — вне диапазона
      code: |
        for text, age in [("200", 200), ("-1", -1), ("151", 151)]:
            msg = None
            try:
                parse_age(text)
            except ValueError as e:
                msg = str(e)
            assert msg == f"возраст должен быть от 0 до 150, а не {age}", f"Сообщение исключения для \"{text}\": «{msg}». Нужно: возраст должен быть от 0 до 150, а не {age}"
hints:
  - level: 1
    text: 'Две разные беды — текст не число и число вне диапазона. Кто замечает каждую из них: `int` или ваша проверка? Чем должно закончиться каждое из этих событий?'
  - level: 2
    text: 'Непонятное сообщение исключения от `int` можно заменить своим — вспомните, где в теме `raise` стоял внутри `except`. Диапазон — отдельная проверка после перевода в число.'
  - level: 3
    text: 'Внутри `except ValueError:` выбросьте через `raise` новый `ValueError` со своим текстом из f-строки. Диапазон проверьте после `try`, обычным `if`, и тоже через `raise`. Ловите только `ValueError`: `TypeError` для `None` должен пройти дальше.'
