id: p1e-safe-int
title: Количество из поля формы
sandbox: python-browser
difficulty: 1
statement: |
  **Напишите функцию `safe_int(text, default)`, которая возвращает целое число из текста, а если текст не разбирается как целое число — возвращает `default`.**

  `text` — строка из поля формы, `default` — любое значение. Пробелы по краям числа допустимы. Если вместо текста пришло что-то другое, например `None`, функция падает с `TypeError`, как сам `int`.

  Пример 1
  ```call
  safe_int(" 12 ", 1)
  ```
  ```return
  12
  ```

  Пример 2
  ```call
  safe_int("2.5", 0)
  ```
  ```return
  0
  ```

  Ограничения: методы строк `isdigit`, `isdecimal`, `isnumeric` не используйте — нужны `try` и `except`.
starter: |
  def safe_int(text, default):
      # План:
      # 1. Попробовать перевести text в целое число и вернуть его
      # 2. Если значение не разбирается как целое — вернуть default
      # 3. Исключения других типов не ловить
      pass


  print(safe_int("3", 1))
  print(safe_int("три", 1))
solution: |
  def safe_int(text, default):
      try:
          return int(text)
      except ValueError:
          return default


  print(safe_int("3", 1))
  print(safe_int("три", 1))
tests:
  forbid: [isdigit, isdecimal, isnumeric]
  function: safe_int
  calls:
    - name: Целое число
      args: ["3", 1]
      expect: 3
    - name: Отрицательное число
      args: ["-4", 0]
      expect: -4
    - name: Пробелы по краям
      args: [" 12 ", 1]
      expect: 12
    - name: Слово вместо числа
      args: ["три", 1]
      expect: 1
    - name: Дробь — не целое число
      args: ["2.5", 0]
      expect: 0
    - name: Пустая строка
      args: ["", 7]
      expect: 7
      hidden: true
    - name: default может быть любым, даже None
      args: ["много", null]
      expect: null
      hidden: true
    - name: Не текст — по-прежнему TypeError
      args: [null, 0]
      raises: TypeError
hints:
  - level: 1
    text: 'Какое исключение выбрасывает `int`, когда текст не разбирается как целое число? А какое — когда ему дали `None`?'
  - level: 2
    text: 'В `try` — только попытка перевести текст. Подумайте, что поймает `except` без типа при вызове с `None` и почему это нарушит условие.'
  - level: 3
    text: 'В `except` укажите тип исключения из первой подсказки — тогда `TypeError` пройдёт мимо, как и требует условие.'
