id: p1e-safe-int
title: Количество из поля формы
sandbox: python-browser
difficulty: 1
statement: |
  **Напишите `safe_int(text, default)`: вернуть целое число из текста, а если текст не разбирается как целое число — вернуть `default`.**

  Пробелы по краям числа допустимы. Если вместо текста пришло что-то другое, например `None`, функция падает с `TypeError`, как сам `int`.

  Пример 1
  ```input
  safe_int(" 12 ", 1)
  ```
  ```output
  12
  ```

  Пример 2
  ```input
  safe_int("2.5", 0)
  ```
  ```output
  0
  ```

  Ограничения: методы строк `isdigit`, `isdecimal`, `isnumeric` не используйте — нужны `try` и `except`.
starter: |
  def safe_int(text, default):
      # План:
      # 1. Попробовать перевести text в целое число и вернуть его
      # 2. Если значение не разбирается как целое — вернуть default
      # 3. Исключения других типов не ловить
      pass


  print(safe_int("3", 1))
  print(safe_int("три", 1))
solution: |
  def safe_int(text, default):
      try:
          return int(text)
      except ValueError:
          return default


  print(safe_int("3", 1))
  print(safe_int("три", 1))
tests:
  forbid: [isdigit, isdecimal, isnumeric]
  asserts:
    - name: Целое число
      code: |
        assert safe_int("3", 1) == 3, "safe_int(\"3\", 1) должно вернуть 3"
        assert safe_int("-4", 0) == -4, "safe_int(\"-4\", 0) должно вернуть -4"
    - name: Пробелы по краям
      code: |
        assert safe_int(" 12 ", 1) == 12, "safe_int(\" 12 \", 1) должно вернуть 12"
    - name: Не целое число
      code: |
        assert safe_int("три", 1) == 1, "safe_int(\"три\", 1) должно вернуть 1"
        assert safe_int("2.5", 0) == 0, "safe_int(\"2.5\", 0) должно вернуть 0: дробь — не целое число"
    - name: Пустая строка
      code: |
        assert safe_int("", 7) == 7, "safe_int(\"\", 7) должно вернуть 7"
    - name: default может быть любым
      code: |
        assert safe_int("много", None) is None, "safe_int(\"много\", None) должно вернуть None — то, что передали в default"
    - name: Не текст — по-прежнему TypeError
      code: |
        caught = None
        try:
            safe_int(None, 0)
        except TypeError:
            caught = "TypeError"
        assert caught == "TypeError", "safe_int(None, 0) должна упасть с TypeError: ловите только исключение неверного значения"
hints:
  - level: 1
    text: 'Какое исключение выбрасывает `int`, когда текст не разбирается как целое число? А какое — когда ему дали `None`?'
  - level: 2
    text: 'В `try` — только попытка перевести текст. Подумайте, что поймает `except` без типа при вызове с `None` и почему это нарушит условие.'
  - level: 3
    text: 'В `except` укажите тип исключения из первой подсказки — тогда `TypeError` пройдёт мимо, как и требует условие.'
