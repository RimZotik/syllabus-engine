title: Проверка темы
pass: 0.85
minutes: 20
questions:
- id: skip-in-loop
  type: single
  q: |
    Что выведет программа?
    ```python
    items = ["3", "два", "5"]
    total = 0
    for s in items:
        try:
            total += int(s)
            print("+", s)
        except ValueError:
            print("пропуск", s)
    print(total)
    ```
  options:
  - '`+ 3`, `пропуск два`, `+ 5`, `8` — каждое в своей строке'
  - '`+ 3`, `пропуск два`, `3` — каждое в своей строке'
  - '`+ 3`, `+ два`, `пропуск два`, `+ 5`, `8` — каждое в своей строке'
  - '`+ 3`, `пропуск два` — и программа остановится с `ValueError`'
  answer: 0
  explain: 'На «два» `int` выбрасывает исключение, остаток блока `try` — печать `+ два` — пропускается, и выполняется `except`. Исключение поймано внутри цикла, поэтому цикл продолжается со следующего элемента и прибавляет 5. Остановиться программа могла бы, только если бы подходящего `except` не нашлось.'
- id: which-inputs-hint
  type: multi
  q: |
    `prices = {"хлеб": 45}`. При каких значениях `name` и `qty` программа напечатает подсказку?
    ```python
    try:
        cost = prices[name] * int(qty)
    except ValueError:
        print("Количество — целое число")
    ```
  options:
  - '`name = "хлеб"`, `qty = "два"`'
  - '`name = "хлеб"`, `qty = "2.5"`'
  - '`name = "сыр"`, `qty = "два"`'
  - '`name = "хлеб"`, `qty = ""`'
  - '`name = "хлеб"`, `qty = " 3 "`'
  answer:
  - 0
  - 1
  - 3
  traps:
  - 2
  explain: '`int` не разбирает «два», «2.5» и пустую строку — это `ValueError`, его и ловит `except`. Пробелы по краям `int` пропускает: `" 3 "` даёт 3, исключения нет. Для «сыр» до `int` дело не доходит: выражение вычисляется слева направо, и `prices["сыр"]` раньше выбрасывает `KeyError`. Его `except ValueError` не ловит — программа остановится.'
- id: bare-vs-typed
  type: multi
  q: |
    Две версии программы отличаются только строкой `except`: в версии А — `except:`, в версии Б — `except ValueError:`. В обеих есть опечатка. Пользователь вводит `3`. Какие утверждения верны?
    ```python
    PRICE = 40
    text = input()
    try:
        qty = int(text)
        total = qty * PRICE
        print(f"Итого: {totl}")
    except ...:      # А: except:    Б: except ValueError:
        print("Нужно целое число")
    ```
  options:
  - 'Версия А напечатает «Нужно целое число», хотя ввод верный'
  - 'Версия Б остановится с `NameError` и покажет опечатку `totl`'
  - 'Версия Б тоже напечатает «Нужно целое число»: `NameError` — разновидность `ValueError`'
  - 'Обе версии остановятся: опечатку в имени `try` не ловит, как и синтаксическую ошибку'
  answer:
  - 0
  - 1
  explain: '`totl` не существует — при выполнении строки возникает `NameError`. `except` без типа ловит и его, поэтому версия А выдаёт опечатку в коде за неверный ввод. `except ValueError` пропускает чужой тип дальше, и версия Б честно останавливается. Опечатку в имени Python находит только при выполнении строки — это не синтаксическая ошибка, и `try` с подходящим `except` её поймал бы.'
- id: break-moved-out
  type: single
  q: |
    В цикле повторного ввода `break` вынесли из `try` на уровень цикла. Что будет, если первым ввести `пять`?
    ```python
    while True:
        text = input("Сколько минут? ")
        try:
            minutes = int(text)
        except ValueError:
            print("Нужно целое число")
        break
    print("Таймер на", minutes)
    ```
  options:
  - 'Программа напечатает подсказку и спросит снова — как было, пока `break` стоял внутри `try`'
  - 'Программа напечатает подсказку, а потом остановится с `NameError`'
  - 'Программа напечатает подсказку и затем `Таймер на пять`'
  - 'Программа сразу остановится с `ValueError`: `except` уже не внутри цикла'
  answer: 1
  explain: 'После `except` выполнение идёт дальше по циклу, а там теперь `break` — цикл кончается после первой попытки при любом вводе. Имя `minutes` так и не появилось: `int("пять")` выбросил исключение раньше присваивания. Поэтому `print` падает с `NameError: name ''minutes'' is not defined`. `except` по-прежнему внутри цикла и ловит `ValueError`.'
- id: finally-with-return
  type: single
  q: |
    Что выведет `print(charge("x"))`?
    ```python
    def charge(text):
        try:
            minutes = int(text)
        except ValueError:
            print("неверно")
            return 0
        else:
            print("принято")
            return minutes * 3
        finally:
            print("запись в журнал")
    ```
  options:
  - '`неверно`, `0` — `return` в `except` завершает функцию, и `finally` не успевает'
  - '`неверно`, `0`, `запись в журнал` — `finally` выполнится после вывода результата'
  - '`неверно`, `запись в журнал`, `0`'
  - '`неверно`, `принято`, `запись в журнал`, `0`'
  answer: 2
  explain: '`finally` выполняется при любом выходе из `try`, в том числе через `return` из `except`: функция возвращает 0 только после него. Внешний `print` получает 0, когда функция уже закончила работу, поэтому 0 — последним. `else` работает, только если исключения не было, — «принято» здесь не печатается.'
- id: wrong-blame
  type: multi
  q: |
    Цена из каталога записана как `price_text = "45,90"`. Покупатель ввёл `3`, а увидел «Количество — целое число». Какие утверждения верны?
    ```python
    try:
        qty = int(input())
        unit = float(price_text)
    except ValueError:
        print("Количество — целое число")
    ```
  options:
  - 'Исключение выбросил `float`: он не разбирает число с запятой'
  - 'Если перенести строку с `float` в `else`, программа остановится с `ValueError` о «45,90»'
  - 'Исключение выбросил `int`: `input()` вернул текст «3», а не число'
  - 'Если заменить `except ValueError:` на `except:`, покупатель увидит настоящую причину'
  answer:
  - 0
  - 1
  explain: '`int("3")` работает: он и нужен, чтобы перевести текст в число. Падает `float("45,90")` — Python ждёт точку. `except` ловит `ValueError` из любой строки блока `try`, поэтому вину свалили на покупателя. Из `else` исключение уже не попадает в этот `except` и останавливает программу с честным сообщением. `except` без типа ловит ещё больше — та же подсказка, причина спрятана.'
- id: propagate-caught-in-loop
  type: single
  q: |
    Что выведет программа?
    ```python
    def price_of(line):
        name, price = line.split(";")
        return int(price)

    def total(lines):
        s = 0
        for line in lines:
            try:
                s += price_of(line)
            except ValueError:
                print("пропуск:", line)
        return s

    print(total(["хлеб;45", "сыр", "чай;сто", "мёд;300"]))
    ```
  options:
  - '`пропуск: сыр`, `пропуск: чай;сто`, `345` — каждое в своей строке'
  - 'Программа остановится на «сыр»: распаковка выбрасывает `ValueError` не из `int`, и этот `except` её не касается'
  - '`пропуск: сыр` и `45`: после первого исключения цикл заканчивается'
  - 'Программа остановится на «сыр» с `IndexError`: в списке после `split` одна часть'
  answer: 0
  explain: 'Для «сыр» `split` даёт один элемент, а имён два — распаковка выбрасывает `ValueError: not enough values to unpack` — «не хватает значений», пара к уже знакомому «too many values». `except ValueError` ловит исключение этого типа, откуда бы оно ни пришло, — даже из глубины вызванной функции. `price_of` прерывается, исключение поднимается в `total`, там его ловят, и цикл идёт дальше. Индексов распаковка не использует, `IndexError` взяться неоткуда.'
- id: where-to-catch
  type: multi
  q: 'Функция `read_mark(text)` переводит оценку из текста в число и при неверном тексте выбрасывает `ValueError`. Её вызывают трое: журнал считает средний балл и неверную запись должен пропустить; форма ввода должна переспросить ученика; годовой отчёт для директора при неверной записи выпускать нельзя — он должен остановиться с понятной причиной. Какие решения верны?'
  options:
  - 'Журнал ловит `ValueError` внутри цикла по записям и переходит к следующей'
  - 'Форма ловит `ValueError` и снова вызывает `input()`'
  - '`read_mark` сама ловит `ValueError` и возвращает 0 — тогда никому из троих не нужен `try`'
  - 'Отчёту можно не ловить `ValueError`: непойманное исключение и остановит его с текстом причины'
  - '`read_mark` сама переспрашивает через `input()`, пока не получит число'
  answer:
  - 0
  - 1
  - 3
  explain: 'Что делать с неверной оценкой, знает только вызывающий, и у троих ответы разные — поэтому ловят у себя журнал и форма. Отчёту остановка и нужна, а текст из `raise` объяснит причину. Ноль из `read_mark` молча попадёт в средний балл и в отчёт. Переспрашивать через `input()` годится только форме: у журнала и отчёта нет человека, которого можно спросить.'
- id: tariff-negative
  type: single
  q: 'Функция `call_cost(minutes)` считает цену звонка. Её вызвали с `minutes = -5`. Какая строка в функции лучше всего сообщит об этом?'
  options:
  - '`raise TypeError(f"минут не может быть меньше нуля, а пришло {minutes}")`'
  - '`raise ValueError("ошибка в данных")`'
  - '`raise ValueError(f"минут не может быть меньше нуля, а пришло {minutes}")`'
  - '`return -1`, чтобы вызывающий код понял: данные неверные'
  answer: 2
  explain: '−5 — число, тип верный, а значение неподходящее: это `ValueError`; `TypeError` — когда пришло значение не того типа. Тип верный и у варианта «ошибка в данных», но текст не говорит, что ожидалось и что пришло, — по traceback не понять, какие данные искать. −1 легко забыть проверить, и он попадёт в сумму счёта.'
- id: raise-flow
  type: single
  q: |
    Что выведет программа?
    ```python
    def set_volume(level):
        if level < 0 or level > 10:
            raise ValueError(f"громкость от 0 до 10, а не {level}")
        print("громкость", level)
        return level

    try:
        v = set_volume(12)
        print("готово")
    except ValueError as e:
        print("Ошибка:", e)
    ```
  options:
  - '`Ошибка: громкость от 0 до 10, а не 12`, затем `готово`'
  - '`Ошибка: громкость от 0 до 10, а не 12`'
  - '`громкость 12`, затем `готово`'
  - '`Ошибка: ValueError`'
  answer: 1
  explain: '`raise` прерывает функцию так же, как исключение от `int`: ни печать громкости, ни `return` не выполняются. Остаток блока `try` — `print("готово")` — тоже пропускается. Имя `e` указывает на пойманное исключение, и `print` выводит его текст, а не название типа.'
- id: syntax-not-caught
  type: single
  q: |
    Что появится при запуске?
    ```python
    print("Старт")
    try:
        n = int(input()
    except SyntaxError:
        print("опечатка в коде")
    ```
  options:
  - '`Старт`, затем сообщение о `SyntaxError`: строки выполняются по порядку, ошибка — на третьей'
  - 'Только сообщение о `SyntaxError` — `Старт` не напечатается'
  - '`Старт`, затем `опечатка в коде`'
  - '`Старт`, затем программа будет ждать ввода'
  answer: 1
  explain: 'Незакрытую скобку Python находит, когда читает весь текст программы, — до выполнения первой строки. Поэтому не выполняется даже `print("Старт")`, и до `try` дело не доходит: `except SyntaxError` не срабатывает. Ловить можно только исключения, которые возникают во время работы программы.'
- id: open-narrow-except
  type: open
  q: 'Начинающий программист обернул всю программу в один `try` с `except:` без типа, «чтобы она никогда не падала». Объясните, чем это плохо и как поступить вместо этого.'
  rubric:
  - такой except ловит не только ожидаемые исключения от неверного ввода, но и ошибки в самом коде (опечатку — NameError, TypeError и т. п.) и выдаёт их за другое или молча прячет, поэтому о баге не узнать
  - вместо этого — ловить конкретный ожидаемый тип (например, ValueError), чтобы остальные ошибки останавливали программу; короткий try — плюс, но для зачёта достаточно конкретного типа
  wrong_answers:
  - except без типа плох только тем, что программа работает медленнее
  - Python запрещает except без типа
  - достаточно заменить except на except Exception — тогда ошибки в коде будут видны
  followups:
  - Что увидит пользователь, если в коде внутри такого try опечатка в имени переменной?
