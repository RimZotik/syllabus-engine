title: Проверка темы
pass: 0.85
minutes: 40
questions:
- id: skip-in-loop
  type: single
  q: |
    Что выведет программа?
    ```python
    items = ["3", "два", "5"]
    total = 0
    for s in items:
        try:
            total += int(s)
            print("+", s)
        except ValueError:
            print("пропуск", s)
    print(total)
    ```
  options:
  - '`+ 3`, `пропуск два`, `+ 5`, `8` — каждое в своей строке'
  - '`+ 3`, `пропуск два`, `3` — каждое в своей строке'
  - '`+ 3`, `+ два`, `пропуск два`, `+ 5`, `8` — каждое в своей строке'
  - '`+ 3`, `пропуск два` — и программа остановится с `ValueError`'
  answer: 0
  explain: 'На «два» `int` выбрасывает исключение, остаток блока `try` — печать `+ два` — пропускается, и выполняется `except`. Исключение поймано внутри цикла, поэтому цикл продолжается со следующего элемента и прибавляет 5. Остановиться программа могла бы, только если бы подходящего `except` не нашлось.'
- id: finally-with-return
  type: single
  q: |
    Что выведет `print(charge("x"))`?
    ```python
    def charge(text):
        try:
            minutes = int(text)
        except ValueError:
            print("неверно")
            return 0
        else:
            print("принято")
            return minutes * 3
        finally:
            print("запись в журнал")
    ```
  options:
  - '`неверно`, `0` — `return` в `except` завершает функцию, и `finally` не успевает'
  - '`неверно`, `0`, `запись в журнал` — `finally` выполнится после вывода результата'
  - '`неверно`, `запись в журнал`, `0`'
  - '`неверно`, `принято`, `запись в журнал`, `0`'
  answer: 2
  explain: '`finally` выполняется при любом выходе из `try`, в том числе через `return` из `except`: функция возвращает 0 только после него. Внешний `print` получает 0, когда функция уже закончила работу, поэтому 0 — последним. `else` работает, только если исключения не было, — «принято» здесь не печатается.'
- id: propagate-caught-in-loop
  type: single
  q: |
    Что выведет программа?
    ```python
    def price_of(line):
        name, price = line.split(";")
        return int(price)

    def total(lines):
        s = 0
        for line in lines:
            try:
                s += price_of(line)
            except ValueError:
                print("пропуск:", line)
        return s

    print(total(["хлеб;45", "сыр", "чай;сто", "мёд;300"]))
    ```
  options:
  - '`пропуск: сыр`, `пропуск: чай;сто`, `345` — каждое в своей строке'
  - 'Программа остановится на «сыр»: распаковка выбрасывает `ValueError` не из `int`, и этот `except` её не касается'
  - '`пропуск: сыр` и `45`: после первого исключения цикл заканчивается'
  - 'Программа остановится на «сыр» с `IndexError`: в списке после `split` одна часть'
  answer: 0
  explain: 'Для «сыр» `split` даёт один элемент, а имён два — распаковка выбрасывает `ValueError: not enough values to unpack` — «не хватает значений», пара к уже знакомому «too many values». `except ValueError` ловит исключение этого типа, откуда бы оно ни пришло, — даже из глубины вызванной функции. `price_of` прерывается, исключение поднимается в `total`, там его ловят, и цикл идёт дальше. Индексов распаковка не использует, `IndexError` взяться неоткуда.'
- id: where-to-catch
  type: multi
  q: 'Функция `read_mark(text)` переводит оценку из текста в число и при неверном тексте выбрасывает `ValueError`. Её вызывают трое: журнал считает средний балл и неверную запись должен пропустить; форма ввода должна переспросить ученика; годовой отчёт для директора при неверной записи выпускать нельзя — он должен остановиться с понятной причиной. Какие решения верны?'
  options:
  - 'Журнал ловит `ValueError` внутри цикла по записям и переходит к следующей'
  - 'Форма ловит `ValueError` и снова вызывает `input()`'
  - '`read_mark` сама ловит `ValueError` и возвращает 0 — тогда никому из троих не нужен `try`'
  - 'Отчёту можно не ловить `ValueError`: непойманное исключение и остановит его с текстом причины'
  - '`read_mark` сама переспрашивает через `input()`, пока не получит число'
  answer:
  - 0
  - 1
  - 3
  explain: 'Что делать с неверной оценкой, знает только вызывающий, и у троих ответы разные — поэтому ловят у себя журнал и форма. Отчёту остановка и нужна, а текст из `raise` объяснит причину. Ноль из `read_mark` молча попадёт в средний балл и в отчёт. Переспрашивать через `input()` годится только форме: у журнала и отчёта нет человека, которого можно спросить.'
- id: syntax-not-caught
  type: single
  q: |
    Что появится при запуске?
    ```python
    print("Старт")
    try:
        n = int(input()
    except SyntaxError:
        print("опечатка в коде")
    ```
  options:
  - '`Старт`, затем сообщение о `SyntaxError`: строки выполняются по порядку, ошибка — на третьей'
  - 'Только сообщение о `SyntaxError` — `Старт` не напечатается'
  - '`Старт`, затем `опечатка в коде`'
  - '`Старт`, затем программа будет ждать ввода'
  answer: 1
  explain: 'Незакрытую скобку Python находит, когда читает весь текст программы, — до выполнения первой строки. Поэтому не выполняется даже `print("Старт")`, и до `try` дело не доходит: `except SyntaxError` не срабатывает. Ловить можно только исключения, которые возникают во время работы программы.'
- id: code-fix-except-type
  type: code
  q: |
    Кофейня: `cups_cost(text)` получает число чашек текстом и возвращает сумму — чашка стоит 150 ₽. **На неверный текст функция должна вернуть подсказку**, а сейчас функция падает. Исправьте её.
    ```call
    cups_cost("2")
    ```
    ```return
    "К оплате: 300"
    ```
    ```call
    cups_cost("две")
    ```
    ```return
    "Нужно целое число чашек"
    ```
    - Пробелы по краям числа допустимы: `cups_cost(" 3 ")` возвращает `"К оплате: 450"`.
    - Не текст (например, `None`) — ошибка в программе: такой вызов падает с `TypeError`, как сам `int`.
  starter: |
    def cups_cost(text):
        try:
            cups = int(text)
            return f"К оплате: {cups * 150}"
        except TypeError:
            return "Нужно целое число чашек"


    print(cups_cost("2"))
  solution: |
    def cups_cost(text):
        try:
            cups = int(text)
            return f"К оплате: {cups * 150}"
        except ValueError:
            return "Нужно целое число чашек"


    print(cups_cost("2"))
    print(cups_cost("две"))
  tests:
    function: cups_cost
    calls:
    - name: Число
      args: ["2"]
      expect: "К оплате: 300"
    - name: Слово
      args: ["две"]
      expect: "Нужно целое число чашек"
    - name: Пробелы по краям
      args: [" 3 "]
      expect: "К оплате: 450"
      hidden: true
    - name: Дробное число
      args: ["2.5"]
      expect: "Нужно целое число чашек"
      hidden: true
    - name: Пустая строка
      args: [""]
      expect: "Нужно целое число чашек"
      hidden: true
    - name: Не текст — TypeError, как у int
      args: [null]
      raises: TypeError
  explain: '`int("две")` выбрасывает `ValueError`: тип у значения подходящий — текст, — но число из него не получается. `TypeError` — когда пришло значение не того типа, например `None`. `except` ловит только свой тип, поэтому `except TypeError` пропускал `ValueError` дальше, и программа останавливалась. «2.5» и пустую строку `int` тоже не разбирает, а пробелы по краям пропускает сам.'
- id: code-fix-break-place
  type: code
  q: |
    Таймер спрашивает число минут, **пока не введут целое число**, и печатает `Таймер на N мин`. На неверный ввод он печатает `Нужно целое число` и спрашивает снова. Сейчас после первого же неверного ввода программа падает с `NameError`. Исправьте её.
    ```input
    пять
    5.5
    10
    ```
    ```output
    Нужно целое число
    Нужно целое число
    Таймер на 10 мин
    ```
  starter: |
    while True:
        text = input()
        try:
            minutes = int(text)
        except ValueError:
            print("Нужно целое число")
        break
    print("Таймер на", minutes, "мин")
  solution: |
    while True:
        text = input()
        try:
            minutes = int(text)
            break
        except ValueError:
            print("Нужно целое число")
    print("Таймер на", minutes, "мин")
  tests:
    io:
    - name: Две неудачные попытки
      stdin: "пять\n5.5\n10\n"
      stdout: "Нужно целое число\nНужно целое число\nТаймер на 10 мин"
    - name: Сразу число
      stdin: "25\n"
      stdout: "Таймер на 25 мин"
    - name: Пустая строка и слово
      stdin: "\nдесять\n3\n"
      stdout: "Нужно целое число\nНужно целое число\nТаймер на 3 мин"
      hidden: true
  explain: '`break` стоял на уровне цикла и выполнялся после любой попытки — и удачной, и неудачной. После неверного ввода имя `minutes` так и не появилось: `int` выбросил исключение раньше присваивания, — отсюда `NameError`. `break` должен выполняться, только если перевод удался: в `try` сразу после `int` или в блоке `else`.'
- id: code-fix-unknown-item
  type: code
  q: |
    `line_cost(name, qty_text)` возвращает стоимость позиции заказа по словарю `PRICES`, а при неверном количестве — подсказку `количество — целое число`. **Неизвестный товар должен выбрасывать** `KeyError`, а сейчас на него тоже приходит подсказка про количество. Исправьте функцию.
    ```call
    line_cost("хлеб", "2")
    ```
    ```return
    90
    ```
    ```call
    line_cost("хлеб", "два")
    ```
    ```return
    "количество — целое число"
    ```
    - `line_cost("кофе", "2")` выбрасывает `KeyError: 'кофе'`.
    - Количество не текстом (например, `None`) — ошибка в программе: `TypeError`, как у самого `int`.
  starter: |
    PRICES = {"хлеб": 45, "молоко": 89, "сыр": 320}


    def line_cost(name, qty_text):
        try:
            return PRICES[name] * int(qty_text)
        except:
            return "количество — целое число"


    print(line_cost("хлеб", "2"))
    print(line_cost("хлеб", "два"))
    print(line_cost("кофе", "2"))
  solution: |
    PRICES = {"хлеб": 45, "молоко": 89, "сыр": 320}


    def line_cost(name, qty_text):
        try:
            return PRICES[name] * int(qty_text)
        except ValueError:
            return "количество — целое число"


    print(line_cost("хлеб", "2"))
    print(line_cost("хлеб", "два"))
  tests:
    function: line_cost
    calls:
    - name: Верный заказ
      args: ["хлеб", "2"]
      expect: 90
    - name: Пробелы вокруг количества
      args: ["сыр", " 1 "]
      expect: 320
      hidden: true
    - name: Количество словом
      args: ["хлеб", "два"]
      expect: "количество — целое число"
    - name: Дробное количество
      args: ["молоко", "1.5"]
      expect: "количество — целое число"
      hidden: true
    - name: Пустое количество
      args: ["молоко", ""]
      expect: "количество — целое число"
      hidden: true
    - name: Неизвестный товар — KeyError
      args: ["кофе", "2"]
      raises: KeyError
    - name: Не текст вместо количества — TypeError
      args: ["хлеб", null]
      raises: TypeError
      hidden: true
  explain: '`except` без типа ловит всё: и `ValueError` от `int`, и `KeyError` от словаря, и `TypeError`, если вместо текста пришёл `None`. Поэтому неизвестный товар выдавался за неверное количество. После `except` нужен тот тип, который вы ожидаете и знаете, как обработать, — `ValueError`. Остальные исключения уходят к вызывающему коду. `except Exception` здесь тоже не годится: он ловит и `KeyError`.'
- id: code-change-raise-minutes
  type: code
  q: |
    `call_cost(minutes)` возвращает цену звонка: 3 ₽ за минуту. При отрицательных минутах она возвращает −1, и однажды это −1 попало в сумму счёта. **Измените функцию: при отрицательных минутах она выбрасывает исключение** — `ValueError` с текстом `минут не может быть меньше нуля, а пришло <минуты>`.
    ```call
    call_cost(10)
    ```
    ```return
    30
    ```
    - `call_cost(-5)` выбрасывает `ValueError: минут не может быть меньше нуля, а пришло -5`.
    - Звонок в 0 минут стоит 0 ₽.
  starter: |
    def call_cost(minutes):
        if minutes < 0:
            return -1
        return minutes * 3


    print(call_cost(10))
  solution: |
    def call_cost(minutes):
        if minutes < 0:
            raise ValueError(f"минут не может быть меньше нуля, а пришло {minutes}")
        return minutes * 3


    print(call_cost(10))
  tests:
    function: call_cost
    calls:
    - name: Обычный звонок
      args: [10]
      expect: 30
    - name: Одна минута
      args: [1]
      expect: 3
      hidden: true
    - name: Ноль минут
      args: [0]
      expect: 0
    - name: Отрицательные минуты — ValueError
      args: [-5]
      raises: ValueError
    - name: Минус одна минута — ValueError
      args: [-1]
      raises: ValueError
      hidden: true
    asserts:
    - name: Текст исключения
      code: |
        for m in [-5, -1]:
            msg = None
            try:
                call_cost(m)
            except ValueError as e:
                msg = str(e)
            want = f"минут не может быть меньше нуля, а пришло {m}"
            assert msg == want, f"Текст исключения для {m}: «{msg}». Нужен: {want}"
  explain: 'Особое значение вроде −1 вызывающий код может забыть проверить, и оно смешается с настоящими ценами. Исключение забыть нельзя: его либо поймают, либо программа остановится с понятным текстом. Тип — `ValueError`: число минут — число, тип верный, неподходящее значение. В тексте — что ожидалось и что пришло, поэтому нужна f-строка с `minutes`. После `raise` функция прерывается, `return` уже не выполняется.'
- id: code-fix-else-seats
  type: code
  q: |
    `book(text, free)` получает число гостей из формы и число свободных мест. Если в форме не число, она возвращает `Введите число гостей`. **Если мест не хватает, исключение из** `check_free` **должно дойти до вызывающего кода** — а сейчас гость видит «Введите число гостей». Исправьте `book`, `check_free` не меняйте.
    ```call
    book("4", 6)
    ```
    ```return
    "Столик на 4"
    ```
    ```call
    book("четыре", 6)
    ```
    ```return
    "Введите число гостей"
    ```
    - `book("8", 6)` выбрасывает `ValueError: свободно только 6 мест, а гостей 8` — исключение из `check_free`.
  starter: |
    def check_free(guests, free):
        if guests > free:
            raise ValueError(f"свободно только {free} мест, а гостей {guests}")


    def book(text, free):
        try:
            guests = int(text)
            check_free(guests, free)
        except ValueError:
            return "Введите число гостей"
        return f"Столик на {guests}"


    print(book("4", 6))
    print(book("четыре", 6))
  solution: |
    def check_free(guests, free):
        if guests > free:
            raise ValueError(f"свободно только {free} мест, а гостей {guests}")


    def book(text, free):
        try:
            guests = int(text)
        except ValueError:
            return "Введите число гостей"
        else:
            check_free(guests, free)
        return f"Столик на {guests}"


    print(book("4", 6))
    print(book("четыре", 6))
  tests:
    function: book
    calls:
    - name: Места есть
      args: ["4", 6]
      expect: "Столик на 4"
    - name: Ровно столько мест
      args: ["6", 6]
      expect: "Столик на 6"
      hidden: true
    - name: Пробелы вокруг числа
      args: [" 2 ", 3]
      expect: "Столик на 2"
      hidden: true
    - name: В форме слово
      args: ["четыре", 6]
      expect: "Введите число гостей"
    - name: Пустая форма
      args: ["", 6]
      expect: "Введите число гостей"
      hidden: true
    - name: Дробное число гостей
      args: ["2.5", 6]
      expect: "Введите число гостей"
      hidden: true
    - name: Мест не хватает — ValueError
      args: ["8", 6]
      raises: ValueError
    - name: Свободных мест нет — ValueError
      args: ["1", 0]
      raises: ValueError
      hidden: true
    asserts:
    - name: Мест не хватает — текст от check_free
      code: |
        for text, free in [("8", 6), ("1", 0)]:
            msg = None
            try:
                book(text, free)
            except ValueError as e:
                msg = str(e)
            want = f"свободно только {free} мест, а гостей {text}"
            assert msg == want, f"Текст исключения для book({text!r}, {free}): «{msg}». Нужен текст от check_free: {want}"
  explain: '`except ValueError` ловит исключение этого типа из любой строки блока `try` — и от `int`, и из глубины `check_free`. В `try` должна остаться только строка, где ожидается неверный ввод. Работу с удачным результатом переносят в `else` — или после всей конструкции, ведь `except` заканчивается `return`. Тогда `ValueError` от `check_free` уже не попадает в этот `except` и уходит к вызывающему коду.'
- id: code-write-average-mark
  type: code
  q: |
    `read_mark(text)` переводит запись журнала в оценку от 1 до 5, а иначе выбрасывает `ValueError`. Напишите `average_mark(records)` — **средний балл по верным записям; неверные записи пропускаются.** `read_mark` не меняйте.
    ```call
    average_mark(["5", "4", "отл", "7", "3"])
    ```
    ```return
    4.0
    ```
    - `average_mark(["н", "0"])` выбрасывает `ValueError: нет ни одной верной оценки`.
    - `records` — список строк журнала; функция возвращает средний балл, округлённый до двух знаков: `round(x, 2)`.
    - Нет ни одной верной записи (в том числе пустой список) — `ValueError` с текстом `нет ни одной верной оценки`.
    - Не текст в списке (например, `None`) — ошибка в программе: `TypeError` не ловите.
  starter: |
    def read_mark(text):
        mark = int(text)
        if mark < 1 or mark > 5:
            raise ValueError(f"оценка должна быть от 1 до 5, а не {mark}")
        return mark


    def average_mark(records):
        pass


    print(average_mark(["5", "4", "отл", "7", "3"]))   # 4.0
  solution: |
    def read_mark(text):
        mark = int(text)
        if mark < 1 or mark > 5:
            raise ValueError(f"оценка должна быть от 1 до 5, а не {mark}")
        return mark


    def average_mark(records):
        marks = []
        for r in records:
            try:
                marks.append(read_mark(r))
            except ValueError:
                continue
        if not marks:
            raise ValueError("нет ни одной верной оценки")
        return round(sum(marks) / len(marks), 2)


    print(average_mark(["5", "4", "отл", "7", "3"]))   # 4.0
  tests:
    function: average_mark
    calls:
    - name: Неверные записи пропускаются
      args: [["5", "4", "отл", "7", "3"]]
      expect: 4.0
    - name: Все записи верные
      args: [["5", "4"]]
      expect: 4.5
    - name: Округление до двух знаков
      args: [["2", "3", "3"]]
      expect: 2.67
      hidden: true
    - name: Одна верная запись
      args: [["н", "5", "0"]]
      expect: 5
      hidden: true
    - name: Верных записей нет — ValueError
      args: [["н", "0", "6"]]
      raises: ValueError
    - name: Пустой журнал — ValueError
      args: [[]]
      raises: ValueError
      hidden: true
    - name: Не текст в журнале — TypeError
      args: [["5", null]]
      raises: TypeError
      hidden: true
    asserts:
    - name: Текст исключения
      code: |
        for records in [["н", "0", "6"], []]:
            msg = None
            try:
                average_mark(records)
            except ValueError as e:
                msg = str(e)
            assert msg == "нет ни одной верной оценки", f"Текст исключения для {records}: «{msg}». Нужен: нет ни одной верной оценки"
  explain: 'Что делать с неверной записью, решает тот, кто знает задачу: `read_mark` только сообщает о ней, а `average_mark` пропускает. Поэтому `try` стоит внутри цикла, вокруг одного вызова: исключение поднимается из `read_mark`, ловится, и цикл идёт к следующей записи. Пустой список верных оценок — отдельный случай: без проверки деление на `len(marks)` дало бы `ZeroDivisionError` с непонятным для журнала текстом.'
