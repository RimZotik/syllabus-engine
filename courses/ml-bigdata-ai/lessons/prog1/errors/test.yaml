title: Контрольная раздела «Ошибки и отладка»
pass: 0.85
minutes: 26
questions:
- id: s-finally-log
  type: single
  q: |
    Что выведет программа?
    ```python
    log = []

    def minutes(text):
        try:
            return int(text)
        finally:
            log.append(text)

    total = 0
    for t in ["10", "пять", "15"]:
        try:
            total += minutes(t)
        except ValueError:
            pass
    print(total, log)
    ```
  options:
  - "`25 ['10', '15']`"
  - "`25 ['10', 'пять', '15']`"
  - "`10 ['10', 'пять']`"
  - "`25 ['пять']`"
  answer: 1
  traps:
  - 0
  explain: '`finally` выполняется при любом выходе из `try`: и перед `return`, и когда исключение уходит из функции непойманным — внутри `minutes` его никто не ловит. Поймано оно в цикле, поэтому цикл продолжается и прибавляет 15. `finally` без `except` не перехватывает исключение, а только выполняет свой блок по пути.'
- id: s-duplicates-counterexample
  type: multi
  q: |
    Ассистент написал проверку «есть ли в списке повторы». На каких входах она ответит неверно?
    ```python
    def has_duplicates(items):
        for i in range(len(items) - 1):
            if items[i] == items[i + 1]:
                return True
        return False
    ```
  options:
  - '`[1, 2, 1]`'
  - '`[3, 3]`'
  - '`[]`'
  - '`["а", "б", "а", "б"]`'
  - '`[5, 5, 1]`'
  answer:
  - 0
  - 3
  explain: 'Функция сравнивает только соседей. Повторы, стоящие не рядом, она не видит: `[1, 2, 1]` и `["а", "б", "а", "б"]` — ответ `False` вместо `True`. В `[3, 3]` и `[5, 5, 1]` повтор рядом — ответ верный. Для пустого списка цикл не выполняется, `False` — тоже верно. Самый короткий контрпример — `[1, 2, 1]`.'
- id: s-bug-report-to-check
  type: single
  q: 'Все ваши проверки функции проходят, но пользователь прислал вход, на котором функция ошибается. Что сделать до любых правок кода?'
  options:
  - 'Ничего: проверки прошли — значит, неверны данные пользователя'
  - 'Сделать из этого входа проверку с ответом по условию и убедиться, что она падает'
  - 'Удалить старые проверки: раз ошибка есть, они ничего не стоят'
  - 'Ничего: исправить функцию, а старые проверки покажут, если исправление что-то сломает'
  answer: 1
  explain: 'Это и есть воспроизведение ошибки: проверка, которая падает каждый раз, показывает ошибку, а после исправления подтвердит, что её больше нет, — и останется в наборе на будущее. Прошедшие проверки говорят только о своих входах: старые не мешают, они ловят другие ошибки, но этот вход не проверяют — их уже прошла версия с ошибкой, и исправленную на нём они тоже не проверят.'
- id: s-message-check-silent
  type: single
  q: |
    Проверка должна убедиться, что `set_timer(-5)` выбрасывает `ValueError` с понятным текстом. Что с ней не так?
    ```python
    try:
        set_timer(-5)
    except ValueError as e:
        assert "больше нуля" in str(e), f"непонятное сообщение: {e}"
    ```
  options:
  - 'Если `set_timer` выбросит `TypeError`, проверка молча пройдёт'
  - '`str(e)` не даёт текст исключения, поэтому `in` всегда ложно'
  - 'Если исключения не будет вовсе, проверка молча пройдёт'
  - 'Всё в порядке: она проверяет и тип исключения, и текст'
  answer: 2
  explain: 'Если исключения нет, `except` не выполняется, и `assert` внутри него тоже — проверка ничего не замечает. Нужен ещё флаг: поднять его в `except` и после всей конструкции проверить. `TypeError` этот `except` не ловит — проверка упадёт с ним, это правильно. `str(e)` — текст исключения, тот же, что выводит `print`.'
- id: s-whole-order-lost
  type: single
  q: |
    Что выведет программа?
    ```python
    def read_order(lines):
        order = {}
        for line in lines:
            name, qty = line.split()
            order[name] = int(qty)
        return order

    try:
        order = read_order(["чай 2", "сахар много", "мёд 1"])
    except ValueError:
        order = {}
    print(order)
    ```
  options:
  - "`{'чай': 2, 'мёд': 1}`"
  - "`{'чай': 2}`"
  - '`{}`'
  - 'Ничего: программа остановится с `ValueError`'
  answer: 2
  explain: 'На «сахар много» `int` выбрасывает исключение, `read_order` прерывается и ничего не возвращает — словарь, собранный внутри, теряется. `except` в основной программе привязывает `order` к пустому словарю. Чтобы пропускать только неверную строку, `try` ставят внутри цикла — там, где известно, что делать с одной позицией.'
- id: s-empty-literal
  type: single
  q: 'Программа разбирает тысячу строк с ценами и падает: `ValueError: invalid literal for int() with base 10: ''''`. Что, вероятнее всего, случилось?'
  options:
  - 'В одной из цен пробелы по краям'
  - 'Среди строк есть пустая'
  - 'В одной из цен копейки через запятую'
  - 'В одной из строк цена записана словом'
  answer: 1
  explain: 'В конце сообщения в кавычках — тот текст, который получил `int`, а между кавычками пусто. Пробелы по краям `int` пропускает сам, а строка из одних пробелов была бы видна в кавычках: `''  ''`. Цена с запятой или словом тоже стояла бы в кавычках: `''45,90''`, `''сто''`.'
- id: s-mutant-survives
  type: single
  q: 'Условие: «Детский билет в кино — до 12 лет включительно». Чтобы проверить свой набор проверок, вы заменили в функции `age <= 12` на `age < 12` — и все проверки по-прежнему проходят. О чём это говорит?'
  options:
  - 'Функция верна на всех входах: проверки прошли и до замены, и после'
  - 'Замена ничего не меняет: обе версии отвечают по условию'
  - 'Проверки верны, поэтому достаточно перечитать функцию вручную'
  - 'В наборе нет проверки для 12 лет — его нужно дополнить'
  answer: 3
  explain: 'Версии расходятся только на 12: одна даёт детский билет, другая — нет, а условие говорит, что двенадцатилетнему он положен. Раз ни одна проверка не заметила разницы, 12 в наборе нет. Проверки прошли на обеих версиях — значит, о границе они молчат, и уверенности в функции не прибавляют; перечитывание кода этого не заменит.'
- id: s-taxi-who-catches
  type: single
  q: |
    Ночью программа печатает чеки за все поездки такси и падает на одной записи. Бухгалтеру нужны чеки остальных поездок. Куда поставить `try` с `except ValueError`?
    ```
    Traceback (most recent call last):
      File "C:\work\taxi.py", line 18, in <module>
        print_receipts(rides)
      File "C:\work\taxi.py", line 13, in print_receipts
        cost = ride_cost(ride)
      File "C:\work\taxi.py", line 8, in ride_cost
        km = parse_km(ride["km"])
      File "C:\work\taxi.py", line 4, in parse_km
        raise ValueError(f"километры должны быть больше нуля, а не {km}")
    ValueError: километры должны быть больше нуля, а не -3
    ```
  options:
  - 'В `parse_km` — вокруг строки с `raise`'
  - 'В основной программе — вокруг `print_receipts(rides)`'
  - 'В `print_receipts` — вокруг `ride_cost(ride)` в цикле'
  - 'В `ride_cost` — вокруг вызова `parse_km`, а в `except` вернуть 0'
  answer: 2
  explain: 'Решение «пропустить поездку и печатать дальше» принимается там, где идёт цикл по поездкам, — в `print_receipts`. В основной программе исключение поймается уже после выхода из цикла: остальные чеки не напечатаются. Ловить собственный `raise` в `parse_km` бессмысленно — функция сообщает о неверных данных, это её работа. Ноль из `ride_cost` превратится в чек на 0 ₽, похожий на настоящий.'
- id: s-passed-min-assert
  type: single
  q: |
    Учитель жалуется: для класса с оценками `[5, 3, 4, 2]` программа говорит, что сдали двое, а сдали трое. Какая проверка покажет ошибку на самом маленьком входе?
    ```python
    def passed(marks):
        """Сколько учеников сдали: оценка 3 и выше."""
        count = 0
        for m in marks:
            if m > 3:
                count += 1
        return count
    ```
  options:
  - '`assert passed([5, 3, 4, 2]) == 2`'
  - '`assert passed([2]) == 0`'
  - '`assert passed([3]) == 1`'
  - '`assert passed([5, 4]) == 2`'
  answer: 2
  explain: 'Ожидание берут из условия: тройка — «сдал», и `passed([3])` должна вернуть 1, а функция с `m > 3` вернёт 0 — проверка падает на входе из одного элемента. Для `[2]` и `[5, 4]` ошибочная и верная версии отвечают одинаково. Ожидание 2 для полного класса переписано из неверного вывода: такая проверка закрепит ошибку.'
- id: s-finally-and-library
  type: multi
  q: |
    Что верно про запуск этой программы?
    ```python
    import statistics

    def class_report(name, marks):
        try:
            print(name, statistics.mean(marks))
        finally:
            print("— конец отчёта", name)

    class_report("9А", [5, 4])
    class_report("9Б", [])
    ```
  options:
  - 'Строка `— конец отчёта 9Б` напечатается до traceback'
  - 'Первая пара с вашим файлом снизу — строка 5, в `class_report`'
  - '`— конец отчёта 9Б` не напечатается: исключение прерывает функцию сразу'
  - 'Первая пара с вашим файлом снизу — `<module>`, строка 10: `class_report` уже закончила работу, раз `finally` выполнился'
  answer:
  - 0
  - 1
  explain: '`finally` выполняется, когда исключение уходит из `try`, — до того, как оно покинет функцию, поэтому строка про 9Б печатается раньше traceback. Пары traceback — те вызовы, через которые прошло исключение: снизу `statistics.py`, над ней `class_report` со строкой 5, где вызвали `mean` с пустым списком, выше — основная программа.'
- id: s-flag-loop-output
  type: single
  q: |
    Что выведет программа?
    ```python
    def set_timer(text):
        minutes = int(text)
        if minutes <= 0:
            raise ValueError(f"нужно больше нуля, а не {minutes}")
        return minutes

    for text in ["-5", "пять", "0"]:
        raised = False
        try:
            set_timer(text)
        except ValueError as e:
            raised = True
            print(e)
        assert raised, f"{text}: нет исключения"
    print("проверки прошли")
    ```
  options:
  - 'Три сообщения: о −5, `invalid literal…` для «пять», о 0 — затем `проверки прошли`'
  - 'Сообщение о −5, затем `AssertionError: пять: нет исключения` — флаг поднимает только наш `raise`'
  - 'Сообщения `нужно больше нуля, а не -5`, `нужно больше нуля, а не пять`, `нужно больше нуля, а не 0`, затем `проверки прошли`'
  - 'Сообщение о −5, затем программа остановится с `ValueError` на «пять»: `except` написан для исключения из `raise`'
  answer: 0
  explain: 'Для «пять» исключение выбрасывает `int` — со своим текстом, до нашей проверки дело не доходит. Но тип у него тот же, `ValueError`, поэтому `except` ловит его так же, как наш `raise`, и флаг поднимается. 0 не больше нуля — наш `ValueError`. Все три проверки проходят.'
- id: s-silent-skip
  type: multi
  q: |
    Итог продаж — 750 вместо 1950. Вы напечатали данные посередине пути: `print(lines)` дал `['450', '1 200', '300']`, `print(parse(lines))` — `[450, 300]`. Какие выводы верны?
    ```python
    def parse(lines):
        prices = []
        for line in lines:
            try:
                prices.append(int(line))
            except ValueError:
                continue
        return prices
    ```
  options:
  - 'До `parse` данные верны: искать ошибку раньше неё незачем'
  - '`int` не разобрал «1 200» из-за пробела, и `except` молча выбросил эту строку'
  - 'Ошибка в сложении: итог считает неверно функция суммы'
  - 'Если заменить `except ValueError:` на `except:`, итог станет верным'
  answer:
  - 0
  - 1
  explain: 'Данные до `parse` верны, после — без одной цены: ошибка между этими двумя `print`. `int` не принимает пробел внутри числа, а `except` с `continue` пропустил строку без следа — такой `except` прячет ошибку в данных. Сумма честно сложила 450 и 300. `except` без типа поймает то же самое — итог не изменится; нужно убрать пробелы перед `int` или хотя бы сообщить о пропущенной строке.'
- id: s-open-raise-and-check
  type: open
  q: 'Функция `parse_mark(text)` получила оценку «7» при шкале от 1 до 5. Почему ей лучше выбросить `ValueError`, чем вернуть `None`? И как проверить `assert`-ом, что она действительно так поступает?'
  rubric:
  - почему исключение лучше — достаточно одной верной причины: None не остановит программу сразу (ошибка всплывёт позже и в другом месте или None незаметно попадёт в результат), а исключение сразу сообщает о неверных данных понятным текстом и его поймает тот, кто знает, что делать
  - проверка — вызвать parse_mark("7") внутри try, в except ValueError поднять флаг, после конструкции — assert флага; если исключения нет (или оно другого типа), проверка падает
  wrong_answers:
  - "assert parse_mark(\"7\") == ValueError"
  - исключение лучше, потому что программа работает быстрее
  - None лучше, потому что программа не падает
  followups:
  - Что случится с вашей проверкой, если parse_mark вернёт None вместо исключения?
