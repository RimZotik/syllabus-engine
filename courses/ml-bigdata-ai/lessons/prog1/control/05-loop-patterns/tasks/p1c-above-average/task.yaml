id: p1c-above-average
title: Выше среднего
sandbox: python-browser
difficulty: 2
statement: |
  **Посчитайте, сколько учеников набрали строго больше среднего балла.**

  Ввод — баллы учеников, целые числа через пробел (хотя бы одно). Вывод — одно число.

  Пример 1
  ```input
  1 2 3 4
  ```
  ```output
  2
  ```
  Средний балл 2.5, выше него — 3 и 4.

  Пример 2
  ```input
  2 2 2
  ```
  ```output
  0
  ```

  Ограничения: встроенные `sum`, `max` и `sorted` не используйте — сумму посчитайте сами.
starter: |
  scores = input().split()
  # План:
  # 1. Список чисел
  # 2. Накопитель: сумма баллов
  # 3. Среднее
  # 4. Счётчик: сколько баллов больше среднего
stdin: "1 2 3 4\n"
solution: |
  parts = input().split()
  scores = []
  for p in parts:
      scores.append(int(p))
  total = 0
  for s in scores:
      total += s
  average = total / len(scores)
  above = 0
  for s in scores:
      if s > average:
          above += 1
  print(above)
tests:
  forbid: [sum, max, sorted]
  io:
    - name: Пример 1
      stdin: "1 2 3 4\n"
      stdout: "2"
    - name: Пример 2
      stdin: "2 2 2\n"
      stdout: "0"
    - name: Один ученик
      stdin: "5\n"
      stdout: "0"
      hidden: true
    - name: Один выделяется
      stdin: "1 1 1 4\n"
      stdout: "1"
      hidden: true
    - name: Отрицательные баллы
      stdin: "-1 -2 -3 10\n"
      stdout: "1"
      hidden: true
    - name: Ровно средний не считается
      stdin: "1 2 3\n"
      stdout: "1"
      hidden: true
    - name: Двузначные баллы
      stdin: "9 10 11 100\n"
      stdout: "1"
      hidden: true
hints:
  - level: 1
    text: Можно ли узнать, кто выше среднего, за один проход? Что должно быть известно до сравнения?
  - level: 2
    text: 'Нужны два прохода: первый считает сумму, второй — сколько баллов строго больше среднего.'
  - level: 3
    text: 'Среднее — сумма, делённая на число баллов, `len(scores)`. Не забудьте превратить строки в числа.'
