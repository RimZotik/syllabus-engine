id: p1c-my-max
title: Свой максимум
sandbox: python-browser
difficulty: 2
statement: |
  **Найдите самую высокую температуру и номер дня, когда она была впервые.**

  Ввод — дневные температуры, целые числа через пробел (хотя бы одно). Вывод — максимум и номер дня (дни нумеруются с 1) через пробел.

  Пример 1
  ```input
  3 7 2 7
  ```
  ```output
  7 2
  ```

  Пример 2
  ```input
  -5 -2 -8
  ```
  ```output
  -2 2
  ```

  Ограничения: от 1 до 1000 чисел, каждое от −10 000 до 10 000. Встроенные `max`, `min`, `sorted` и `sort` не используйте.
starter: |
  temps = input().split()
  # План:
  # 1. Превратить строки в числа
  # 2. Лучший из просмотренных — ...
  # 3. ...
stdin: "3 7 2 7\n"
solution: |
  parts = input().split()
  temps = []
  for p in parts:
      temps.append(int(p))
  best_day = 0
  for i in range(1, len(temps)):
      if temps[i] > temps[best_day]:
          best_day = i
  print(temps[best_day], best_day + 1)
tests:
  forbid: [max, min, sorted, sort]
  io:
    - name: Пример 1
      stdin: "3 7 2 7\n"
      stdout: "7 2"
    - name: Пример 2
      stdin: "-5 -2 -8\n"
      stdout: "-2 2"
    - name: Сильные морозы
      stdin: "-2000 -3000\n"
      stdout: "-2000 1"
      hidden: true
    - name: Один день
      stdin: "4\n"
      stdout: "4 1"
      hidden: true
    - name: Максимум первый
      stdin: "9 1 2\n"
      stdout: "9 1"
      hidden: true
    - name: Максимум последний
      stdin: "1 2 30\n"
      stdout: "30 3"
      hidden: true
    - name: Все одинаковые
      stdin: "5 5 5\n"
      stdout: "5 1"
      hidden: true
    - name: Числа больше 9
      stdin: "8 12 100 99\n"
      stdout: "100 3"
      hidden: true
hints:
  - level: 1
    text: 'Что такое `"12"` после `split()` — число или строка? Почему `"9" > "12"` даёт `True`?'
  - level: 2
    text: 'Запоминайте **индекс** лучшего дня, начиная с первого дня, а не значение 0 — дни бывают морозными.'
  - level: 3
    text: 'Обновляйте лучший день только при строгом `>`: тогда при равенстве останется первый.'
