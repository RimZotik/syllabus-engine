id: p1c-my-max
title: Свой максимум
sandbox: python-browser
difficulty: 2
statement: |
  В строке ввода — дневные температуры, целые числа через пробел (хотя бы одно число). Выведите через пробел самую высокую температуру и номер дня, когда она была впервые (дни нумеруются с 1).

  Напишите поиск максимума сами: встроенные `max`, `min`, `sorted` и `sort` не используйте.

  ```input
  3 7 2 7
  ```
  ```
  7 2
  ```
starter: |
  temps = input().split()
  # План:
  # 1. Превратить строки в числа
  # 2. Лучший из просмотренных — ...
  # 3. ...
stdin: "3 7 2 7\n"
solution: |
  parts = input().split()
  temps = []
  for p in parts:
      temps.append(int(p))
  best_day = 0
  for i in range(1, len(temps)):
      if temps[i] > temps[best_day]:
          best_day = i
  print(temps[best_day], best_day + 1)
tests:
  forbid: [max, min, sorted, sort]
  io:
    - name: Пример из условия
      stdin: "3 7 2 7\n"
      stdout: "7 2"
    - name: Все морозные
      stdin: "-5 -2 -8\n"
      stdout: "-2 2"
      hidden: true
    - name: Сильные морозы
      stdin: "-2000 -3000\n"
      stdout: "-2000 1"
      hidden: true
    - name: Один день
      stdin: "4\n"
      stdout: "4 1"
      hidden: true
    - name: Максимум первый
      stdin: "9 1 2\n"
      stdout: "9 1"
      hidden: true
    - name: Максимум последний
      stdin: "1 2 30\n"
      stdout: "30 3"
      hidden: true
    - name: Все одинаковые
      stdin: "5 5 5\n"
      stdout: "5 1"
      hidden: true
    - name: Числа больше 9
      stdin: "8 12 100 99\n"
      stdout: "100 3"
      hidden: true
hints:
  - level: 1
    text: Что такое `"12"` после `split()` — число или строка? Почему `"9" > "12"` даёт `True`?
  - level: 2
    text: 'Сначала соберите список чисел. Потом помните **индекс** лучшего дня, начиная с первого (0), а не значение 0 — дни бывают морозными. Обновляйте его только при строгом `>`, чтобы при равенстве остался первый день.'
  - level: 3
    text: '`best_day = 0`, `for i in range(1, len(temps)):` — `if temps[i] > temps[best_day]: best_day = i`; вывод — `print(temps[best_day], best_day + 1)`.'
