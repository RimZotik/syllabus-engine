id: p1c-ai-frost
title: ИИ-ассистент ищет мороз
sandbox: python-browser
difficulty: 2
statement: |
  **Исправьте программу: она выводит `мороз был`, если хотя бы одна температура ниже нуля, иначе `без мороза`.**

  Ввод — температуры, целые числа через пробел (хотя бы одно). Ноль морозом не считается. Код в редакторе написал ИИ-ассистент: на примере 1 он отвечает верно, на примере 2 — нет.

  Пример 1
  ```input
  3 5 -2
  ```
  ```output
  мороз был
  ```

  Пример 2
  ```input
  -4 1 2
  ```
  ```output
  мороз был
  ```

  Ограничения: встроенные `any` и `min` не используйте.
starter: |
  # Решение от ИИ-ассистента
  temps = input().split()
  frost = False
  for t in temps:
      if int(t) < 0:
          frost = True
      else:
          frost = False
  if frost:
      print("мороз был")
  else:
      print("без мороза")
stdin: "-4 1 2\n"
solution: |
  temps = input().split()
  frost = False
  for t in temps:
      if int(t) < 0:
          frost = True
          break
  if frost:
      print("мороз был")
  else:
      print("без мороза")
tests:
  forbid: [any, min]
  io:
    - name: Пример 1
      stdin: "3 5 -2\n"
      stdout: "мороз был"
    - name: Пример 2
      stdin: "-4 1 2\n"
      stdout: "мороз был"
    - name: Тепло
      stdin: "1 2 3\n"
      stdout: "без мороза"
      hidden: true
    - name: Ноль — не мороз
      stdin: "0 0\n"
      stdout: "без мороза"
      hidden: true
    - name: Один морозный день
      stdin: "-1\n"
      stdout: "мороз был"
      hidden: true
    - name: Мороз в середине
      stdin: "5 -3 0 7\n"
      stdout: "мороз был"
      hidden: true
hints:
  - level: 1
    text: Для ввода `-4 1 2` — на что указывает `frost` после первой итерации? После второй? О каком дне в итоге говорит флаг?
  - level: 2
    text: Ветвь `else` сбрасывает флаг на каждом тёплом дне, и он отражает только последний день.
  - level: 3
    text: 'Флаг переключают в одну сторону — только при находке. После находки смотреть дальше незачем.'
