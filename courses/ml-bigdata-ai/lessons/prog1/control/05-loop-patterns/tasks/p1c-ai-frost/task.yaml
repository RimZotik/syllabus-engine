id: p1c-ai-frost
title: ИИ-ассистент ищет мороз
sandbox: python-browser
difficulty: 2
statement: |
  Задача: в строке ввода — температуры за несколько дней, целые числа через пробел (хотя бы одно). Выведите `мороз был`, если хотя бы одна температура ниже нуля, иначе — `без мороза`. Ноль морозом не считается. Встроенные `any` и `min` не используйте.

  ```input
  3 5 -2
  ```
  ```
  мороз был
  ```

  Решение в редакторе написал ИИ-ассистент. На примере из условия оно выводит правильный ответ, но часть тестов не проходит. Проследите флаг вручную на вводе `-4 1 2` (правильный ответ — `мороз был`): на что указывает `frost` после каждой итерации? Найдите ошибку и исправьте её.
starter: |
  # Решение от ИИ-ассистента
  temps = input().split()
  frost = False
  for t in temps:
      if int(t) < 0:
          frost = True
      else:
          frost = False
  if frost:
      print("мороз был")
  else:
      print("без мороза")
stdin: "3 5 -2\n"
solution: |
  temps = input().split()
  frost = False
  for t in temps:
      if int(t) < 0:
          frost = True
          break
  if frost:
      print("мороз был")
  else:
      print("без мороза")
tests:
  forbid: [any, min]
  io:
    - name: Пример из условия
      stdin: "3 5 -2\n"
      stdout: "мороз был"
    - name: Мороз в первый день
      stdin: "-4 1 2\n"
      stdout: "мороз был"
    - name: Тепло
      stdin: "1 2 3\n"
      stdout: "без мороза"
      hidden: true
    - name: Ноль — не мороз
      stdin: "0 0\n"
      stdout: "без мороза"
      hidden: true
    - name: Один морозный день
      stdin: "-1\n"
      stdout: "мороз был"
      hidden: true
    - name: Мороз в середине
      stdin: "5 -3 0 7\n"
      stdout: "мороз был"
      hidden: true
hints:
  - level: 1
    text: Для ввода `-4 1 2` — на что указывает `frost` после первой итерации? После второй? О каком дне в итоге говорит флаг?
  - level: 2
    text: Ветвь `else` сбрасывает флаг на каждом тёплом дне, и он отражает только последний день. Флаг переключают в одну сторону — только при находке.
  - level: 3
    text: 'Уберите ветвь `else` с `frost = False`; при находке можно сразу выйти из цикла — `frost = True` и `break`.'
