id: p1c-expense-diary
title: Дневник расходов
sandbox: python-browser
difficulty: 3
statement: |
  Маленькая настоящая программа: дневник расходов. В первой строке ввода — дневной бюджет (целое число). Дальше — расходы за каждый день, целые числа, по одному в строке, а в конце — пустая строка.

  Выведите четыре строки:

  - `Дней: N` — сколько дней записано;
  - `Всего: S` — сумма всех расходов;
  - `Самый дорогой день: D (M)` — номер дня с самым большим расходом (дни нумеруются с 1; если таких дней несколько — первый из них) и сам расход;
  - `Бюджет превышен: да`, если хотя бы в один день расход был **больше** бюджета, иначе `Бюджет превышен: нет`.

  Если не записано ни одного дня, выведите одну строку `Нет данных`.

  Всё посчитайте своими циклами: встроенные `sum`, `max`, `min`, `any`, `all` и `sorted` не используйте. Начните с плана в комментариях — он уже есть в редакторе.

  ```input
  1000
  800
  1500
  250
  1000

  ```
  ```
  Дней: 4
  Всего: 3550
  Самый дорогой день: 2 (1500)
  Бюджет превышен: да
  ```

  (Последняя строка ввода пустая.)
starter: |
  budget = int(input())
  # План:
  # 1. Прочитать расходы до пустой строки в список
  # 2. Если список пуст — вывести «Нет данных»
  # 3. Иначе посчитать: сумму (накопитель), самый дорогой день (лучший на данный момент),
  #    было ли превышение (флаг)
  # 4. Вывести четыре строки
stdin: "1000\n800\n1500\n250\n1000\n\n"
solution: |
  budget = int(input())
  expenses = []
  line = input()
  while line != "":
      expenses.append(int(line))
      line = input()
  if len(expenses) == 0:
      print("Нет данных")
  else:
      total = 0
      best_day = 0
      over = False
      for i in range(len(expenses)):
          total += expenses[i]
          if expenses[i] > expenses[best_day]:
              best_day = i
          if expenses[i] > budget:
              over = True
      print("Дней:", len(expenses))
      print("Всего:", total)
      print(f"Самый дорогой день: {best_day + 1} ({expenses[best_day]})")
      if over:
          print("Бюджет превышен: да")
      else:
          print("Бюджет превышен: нет")
tests:
  forbid: [sum, max, min, any, all, sorted]
  io:
    - name: Пример из условия
      stdin: "1000\n800\n1500\n250\n1000\n\n"
      stdout: "Дней: 4\nВсего: 3550\nСамый дорогой день: 2 (1500)\nБюджет превышен: да"
    - name: Ни одного дня
      stdin: "1000\n\n"
      stdout: "Нет данных"
      hidden: true
    - name: Один день в бюджете
      stdin: "500\n300\n\n"
      stdout: "Дней: 1\nВсего: 300\nСамый дорогой день: 1 (300)\nБюджет превышен: нет"
      hidden: true
    - name: Ровно бюджет — не превышение
      stdin: "1000\n1000\n999\n1000\n\n"
      stdout: "Дней: 3\nВсего: 2999\nСамый дорогой день: 1 (1000)\nБюджет превышен: нет"
      hidden: true
    - name: Превышение в последний день
      stdin: "100\n10\n20\n101\n\n"
      stdout: "Дней: 3\nВсего: 131\nСамый дорогой день: 3 (101)\nБюджет превышен: да"
      hidden: true
    - name: Превышение в первый день
      stdin: "100\n500\n10\n20\n\n"
      stdout: "Дней: 3\nВсего: 530\nСамый дорогой день: 1 (500)\nБюджет превышен: да"
      hidden: true
    - name: Дни без расходов
      stdin: "300\n0\n0\n0\n\n"
      stdout: "Дней: 3\nВсего: 0\nСамый дорогой день: 1 (0)\nБюджет превышен: нет"
      hidden: true
hints:
  - level: 1
    text: Идите по плану. Шаг 1 — тот же шаблон, что в теме о списках, — `while` до пустой строки и `append`. Какие три шаблона из этой темы нужны в шаге 3?
  - level: 2
    text: 'Шаг 3 можно сделать одним циклом по индексам — в теле обновлять накопитель `total`, индекс лучшего дня `best_day` (при строгом `>`) и флаг `over` (только в одну сторону). Начальные значения — 0, 0 и `False`, все до цикла.'
  - level: 3
    text: '`for i in range(len(expenses)):` — `total += expenses[i]`; `if expenses[i] > expenses[best_day]: best_day = i`; `if expenses[i] > budget: over = True`. Третья строка вывода — `f"Самый дорогой день: {best_day + 1} ({expenses[best_day]})"`.'
