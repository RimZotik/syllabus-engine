id: p1c-queue
title: Очередь к врачу
sandbox: python-browser
difficulty: 2
statement: |
  **Прочитайте очередь пациентов до слова `конец` и выведите её размер, первого и последнего.**

  Ввод — имена по одному в строке, в конце — `конец`. Вывод — три строки: `В очереди: N`, `Первый: <имя>`, `Последний: <имя>`. Если никто не записался, выведите одну строку `Очередь пуста`.

  Пример 1
  ```input
  Аня
  Борис
  Вера
  конец
  ```
  ```output
  В очереди: 3
  Первый: Аня
  Последний: Вера
  ```

  Пример 2
  ```input
  конец
  ```
  ```output
  Очередь пуста
  ```
starter: |
  queue = []
  name = input()
  # допишите программу
stdin: "Аня\nБорис\nВера\nконец\n"
solution: |
  queue = []
  name = input()
  while name != "конец":
      queue.append(name)
      name = input()
  if len(queue) == 0:
      print("Очередь пуста")
  else:
      print("В очереди:", len(queue))
      print("Первый:", queue[0])
      print("Последний:", queue[-1])
tests:
  io:
    - name: Пример 1
      stdin: "Аня\nБорис\nВера\nконец\n"
      stdout: "В очереди: 3\nПервый: Аня\nПоследний: Вера"
    - name: Пример 2
      stdin: "конец\n"
      stdout: "Очередь пуста"
    - name: Один пациент
      stdin: "Глеб\nконец\n"
      stdout: "В очереди: 1\nПервый: Глеб\nПоследний: Глеб"
      hidden: true
    - name: Два пациента
      stdin: "Дина\nЕгор\nконец\n"
      stdout: "В очереди: 2\nПервый: Дина\nПоследний: Егор"
      hidden: true
    - name: Одинаковые имена
      stdin: "Аня\nАня\nБорис\nАня\nконец\n"
      stdout: "В очереди: 4\nПервый: Аня\nПоследний: Аня"
      hidden: true
hints:
  - level: 1
    text: Сначала соберите все имена в список, а уже потом отвечайте. Каким циклом читать ввод до слова `конец`?
  - level: 2
    text: 'Пока `name != "конец"`, дописывайте имя в список методом `append` и читайте следующее. Как после цикла узнать длину списка, первый и последний элемент?'
  - level: 3
    text: 'Что даст `queue[0]` для пустого списка? Проверьте длину списка до трёх `print`.'
