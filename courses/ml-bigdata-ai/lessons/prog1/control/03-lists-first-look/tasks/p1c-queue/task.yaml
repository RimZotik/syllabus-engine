id: p1c-queue
title: Очередь к врачу
sandbox: python-browser
difficulty: 2
statement: |
  Регистратура записывает пациентов в очередь: на вход подаются имена, по одному в строке, а в конце — слово `конец`. Выведите три строки:

  - `В очереди: N` — сколько человек записалось;
  - `Первый: <имя>` — кто записался первым;
  - `Последний: <имя>` — кто последним.

  Если никто не записался (первая же строка — `конец`), выведите одну строку `Очередь пуста`.

  ```input
  Аня
  Борис
  Вера
  конец
  ```
  ```
  В очереди: 3
  Первый: Аня
  Последний: Вера
  ```
starter: |
  queue = []
  name = input()
  # допишите программу
stdin: "Аня\nБорис\nВера\nконец\n"
solution: |
  queue = []
  name = input()
  while name != "конец":
      queue.append(name)
      name = input()
  if len(queue) == 0:
      print("Очередь пуста")
  else:
      print("В очереди:", len(queue))
      print("Первый:", queue[0])
      print("Последний:", queue[-1])
tests:
  io:
    - name: Пример из условия
      stdin: "Аня\nБорис\nВера\nконец\n"
      stdout: "В очереди: 3\nПервый: Аня\nПоследний: Вера"
    - name: Один пациент
      stdin: "Глеб\nконец\n"
      stdout: "В очереди: 1\nПервый: Глеб\nПоследний: Глеб"
      hidden: true
    - name: Никого
      stdin: "конец\n"
      stdout: "Очередь пуста"
      hidden: true
    - name: Два пациента
      stdin: "Дина\nЕгор\nконец\n"
      stdout: "В очереди: 2\nПервый: Дина\nПоследний: Егор"
      hidden: true
    - name: Одинаковые имена
      stdin: "Аня\nАня\nБорис\nАня\nконец\n"
      stdout: "В очереди: 4\nПервый: Аня\nПоследний: Аня"
      hidden: true
hints:
  - level: 1
    text: Сначала соберите все имена в список, а уже потом отвечайте на вопросы. Каким циклом читать ввод до слова `конец`?
  - level: 2
    text: 'Пока `name != "конец"`, дописывайте имя в список методом `append` и читайте следующее. После цикла — число людей — это `len(queue)`, первый — `queue[0]`, последний — `queue[-1]`. Что будет с `queue[0]`, если список пуст?'
  - level: 3
    text: 'После цикла: `if len(queue) == 0:` — вывести «Очередь пуста», иначе три `print` — `print("В очереди:", len(queue))`, `print("Первый:", queue[0])`, `print("Последний:", queue[-1])`.'
