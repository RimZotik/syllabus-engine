id: p1c-registration
title: Список гостей
sandbox: python-browser
difficulty: 2
statement: |
  **Для каждого пришедшего выведите `да`, если он есть в списке гостей, иначе `нет`.**

  Первая строка ввода — имена гостей через пробел. Дальше — имена пришедших, по одному в строке, в конце — пустая строка. Имя должно совпасть целиком, с учётом больших и маленьких букв.

  Пример 1
  ```input
  Аня Борис Вера
  Борис
  Глеб
  Аня

  ```
  ```output
  да
  нет
  да
  ```

  Пример 2
  ```input
  Анастасия Борис
  Ана
  Борис

  ```
  ```output
  нет
  да
  ```
starter: |
  guests = input().split()
  # допишите программу
stdin: "Аня Борис Вера\nБорис\nГлеб\nАня\n\n"
solution: |
  guests = input().split()
  name = input()
  while name != "":
      if name in guests:
          print("да")
      else:
          print("нет")
      name = input()
tests:
  io:
    - name: Пример 1
      stdin: "Аня Борис Вера\nБорис\nГлеб\nАня\n\n"
      stdout: "да\nнет\nда"
    - name: Пример 2
      stdin: "Анастасия Борис\nАна\nБорис\n\n"
      stdout: "нет\nда"
    - name: Кусок имени — не имя
      stdin: "Анастасия Борис\nБор\nсия\nАнастасия\n\n"
      stdout: "нет\nнет\nда"
      hidden: true
    - name: Регистр важен
      stdin: "Аня\nаня\nАня\n\n"
      stdout: "нет\nда"
      hidden: true
    - name: Никто не пришёл
      stdin: "Аня Борис\n\n"
      stdout: ""
      hidden: true
    - name: Один гость пришёл дважды
      stdin: "Вера\nВера\nВера\n\n"
      stdout: "да\nда"
      hidden: true
hints:
  - level: 1
    text: Что делает `split()` с первой строкой? Чем `in` для списка отличается от `in` для строки?
  - level: 2
    text: 'Читайте имена в цикле, пока строка не пустая. Для списка `in` ищет элемент целиком, поэтому «Ана» не найдётся внутри «Анастасии».'
  - level: 3
    text: 'Чтение следующего имени должно стоять в конце тела цикла — после вывода ответа, для обеих ветвей.'
