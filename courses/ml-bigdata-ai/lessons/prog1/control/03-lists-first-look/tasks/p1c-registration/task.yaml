id: p1c-registration
title: Список гостей
sandbox: python-browser
difficulty: 2
statement: |
  В первой строке ввода — имена гостей, записанных на вечеринку, через пробел. Дальше охранник вводит имена тех, кто пришёл, по одному в строке ввода, а в конце — пустую строку ввода. Для каждого пришедшего выведите `да`, если он есть в списке гостей, и `нет`, если его нет. Имя должно совпасть целиком, с учётом регистра.

  ```input
  Аня Борис Вера
  Борис
  Глеб
  Аня

  ```
  ```
  да
  нет
  да
  ```

  (Последняя строка ввода пустая.)
starter: |
  guests = input().split()
  # допишите программу
stdin: "Аня Борис Вера\nБорис\nГлеб\nАня\n\n"
solution: |
  guests = input().split()
  name = input()
  while name != "":
      if name in guests:
          print("да")
      else:
          print("нет")
      name = input()
tests:
  io:
    - name: Пример из условия
      stdin: "Аня Борис Вера\nБорис\nГлеб\nАня\n\n"
      stdout: "да\nнет\nда"
    - name: Часть имени — это не имя
      stdin: "Анастасия Борис\nАна\nБор\nБорис\n\n"
      stdout: "нет\nнет\nда"
      hidden: true
    - name: Регистр важен
      stdin: "Аня\nаня\nАня\n\n"
      stdout: "нет\nда"
      hidden: true
    - name: Никто не пришёл
      stdin: "Аня Борис\n\n"
      stdout: ""
      hidden: true
    - name: Один гость
      stdin: "Вера\nВера\nВера\n\n"
      stdout: "да\nда"
      hidden: true
hints:
  - level: 1
    text: Что делает `split()` с первой строкой? Чем проверка «есть ли элемент в списке» отличается от проверки «есть ли кусок в строке»?
  - level: 2
    text: 'Читайте имена в цикле, пока строка не пустая. Для каждого имени проверяйте `name in guests` — здесь `guests` список, поэтому `in` ищет элемент целиком, и «Ана» не найдётся внутри «Анастасии».'
  - level: 3
    text: '`name = input()`, затем `while name != "":` — внутри `if name in guests: print("да")`, иначе `print("нет")`, и в конце тела — `name = input()`.'
