id: p1c-reverse-words
title: Слова задом наперёд
sandbox: python-browser
difficulty: 2
statement: |
  **Выведите слова строки в обратном порядке.**

  Ввод — строка, слова разделены пробелами. Вывод — те же слова через один пробел, от последнего к первому; если слов нет — пустая строка. Стартовый код копирует слова в прямом порядке — переделайте его.

  Пример 1
  ```input
  мама мыла раму
  ```
  ```output
  раму мыла мама
  ```

  Пример 2
  ```input
    a  b   c
  ```
  ```output
  c b a
  ```

  Ограничения: только индексы, `while` и `append`; `reverse`, `reversed`, `sorted`, срезы (`words[::-1]`), `insert` и `pop` не используйте.
starter: |
  words = input().split()
  result = []
  i = 0
  while i < len(words):
      result.append(words[i])
      i += 1
  print(*result)
stdin: "мама мыла раму\n"
solution: |
  words = input().split()
  result = []
  i = len(words) - 1
  while i >= 0:
      result.append(words[i])
      i -= 1
  print(*result)
tests:
  forbid: [reverse, reversed, sorted, sort, slice, insert, pop]
  io:
    - name: Пример 1
      stdin: "мама мыла раму\n"
      stdout: "раму мыла мама"
    - name: Пример 2
      stdin: "  a  b   c \n"
      stdout: "c b a"
    - name: Одно слово
      stdin: "привет\n"
      stdout: "привет"
      hidden: true
    - name: Два слова
      stdin: "один два\n"
      stdout: "два один"
      hidden: true
    - name: Пустая строка
      stdin: "\n"
      stdout: ""
      hidden: true
    - name: Повторы
      stdin: "да нет да да\n"
      stdout: "да да нет да"
      hidden: true
hints:
  - level: 1
    text: Стартовый код перебирает индексы 0, 1, 2… Какой индекс у последнего слова, если слов `len(words)`?
  - level: 2
    text: 'Начните с индекса последнего слова и уменьшайте `i` на 1. До какого индекса включительно идти?'
  - level: 3
    text: 'Проверьте условие цикла на одном слове (одна итерация) и на пустой строке (ни одной).'
