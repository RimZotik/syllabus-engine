title: Проверка темы
pass: 0.85
minutes: 40
questions:
- id: in-list-vs-string
  type: single
  q: |
    Что выведет программа?
    ```python
    print("кот" in ["котик", "пёс"], "кот" in "котик")
    ```
  options:
  - '`True True`'
  - '`False True`'
  - '`False False`'
  - '`True False`'
  answer: 1
  explain: 'Для списка `in` ищет элемент, равный `"кот"` целиком, — такого нет. Для строки `in` ищет кусок текста, и `"кот"` в `"котик"` есть.'
- id: build-with-while
  type: single
  q: |
    Что выведет программа?
    ```python
    items = []
    n = 3
    while n > 0:
        items.append(n)
        n -= 1
    print(items, len(items))
    ```
  options:
  - '`[3, 2, 1] 3`'
  - '`[1, 2, 3] 3`'
  - '`[3, 2, 1, 0] 4`'
  - '`[3] 1`'
  answer: 0
  explain: '`append` дописывает в конец, поэтому порядок — как добавляли: 3, 2, 1. При `n = 0` условие ложно, и ноль не добавляется.'
- id: replace-item
  type: single
  q: |
    Что выведет программа?
    ```python
    temps = [5, 7, 9]
    temps[-1] = temps[0]
    print(temps)
    ```
  options:
  - '`[5, 7, 5]`'
  - '`[9, 7, 9]`'
  - Ошибку `TypeError`
  - '`[5, 7, 9, 5]`'
  answer: 0
  explain: 'В отличие от строки, элемент списка можно заменить. Сначала вычисляется правая часть — `temps[0]`, это 5, — потом последний элемент начинает указывать на 5. Присваивание по индексу заменяет элемент, а не дописывает новый.'
- id: print-list-ways
  type: multi
  q: '`nums = [1, 2, 3]`. Какие строки кода выведут ровно `1 2 3`? Выберите все.'
  options:
  - '`print(*nums)`'
  - '`print(" ".join(nums))`'
  - '`print(nums)`'
  - '`print(nums[0], nums[1], nums[2])`'
  answer:
  - 0
  - 3
  explain: '`print(nums)` выводит `[1, 2, 3]` со скобками и запятыми. `join` склеивает только строки, а здесь числа — будет `TypeError`.'
- id: in-vs-or
  type: single
  q: |
    Что выведет программа?
    ```python
    x = 5
    print(x in [1, 2, 3], x == 1 or 2)
    ```
  options:
  - '`False False`'
  - '`False 2`'
  - '`True 2`'
  - '`False True`'
  answer: 1
  explain: '`x in [1, 2, 3]` ищет 5 среди элементов — его нет, `False`. А `x == 1 or 2` читается как `(x == 1) or 2`: левая часть ложна, и `or` возвращает значение справа — число `2`. Проверку «одно из нескольких значений» пишут через `in`.'
- id: split-strings
  type: code
  q: |
    **Исправьте программу: она должна сложить цену и доставку, а склеивает их.**

    Ввод — два целых числа через пробел: цена товара и стоимость доставки. Вывод — `К оплате: S`.

    Пример 1
    ```input
    10 20
    ```
    ```output
    К оплате: 30
    ```
  starter: |
    parts = input().split()
    print("К оплате:", parts[0] + parts[1])
  solution: |
    parts = input().split()
    print("К оплате:", int(parts[0]) + int(parts[1]))
  tests:
    io:
    - name: 10 и 20
      stdin: "10 20\n"
      stdout: "К оплате: 30"
    - name: Бесплатная доставка
      stdin: "500 0\n"
      stdout: "К оплате: 500"
      hidden: true
    - name: 1 и 99
      stdin: "1 99\n"
      stdout: "К оплате: 100"
      hidden: true
    - name: 250 и 300
      stdin: "250 300\n"
      stdout: "К оплате: 550"
      hidden: true
  explain: |
    `split()` возвращает список **строк**: `["10", "20"]`. Для строк `+` — склеивание, отсюда `1020`. Каждую часть нужно превратить в число: `int(parts[0]) + int(parts[1])`.
- id: l-fix-last-item
  type: code
  q: |
    **Исправьте программу: она должна вывести последнюю покупку, а падает с ошибкой.**

    Ввод — покупки через пробел, хотя бы одна.

    Пример 1
    ```input
    хлеб молоко сыр
    ```
    ```output
    сыр
    ```
  starter: |
    items = input().split()
    print(items[len(items)])
  solution: |
    items = input().split()
    print(items[-1])
  tests:
    io:
    - name: Три покупки
      stdin: "хлеб молоко сыр\n"
      stdout: "сыр"
    - name: Одна покупка
      stdin: "чай\n"
      stdout: "чай"
      hidden: true
    - name: Две покупки
      stdin: "соль сахар\n"
      stdout: "сахар"
      hidden: true
  explain: |
    В списке из `n` элементов индексы — от `0` до `n - 1`, поэтому `items[len(items)]` выходит за конец: `IndexError`. Последний элемент — `items[-1]` или `items[len(items) - 1]`.
- id: l-complete-price
  type: code
  q: |
    **Допишите одну строку: замените цену товара с данным номером.**

    Первая строка ввода — цены через пробел. Вторая — номер товара (с 1, как на ценнике) и новая цена. Вывод — все цены через пробел.

    Пример 1
    ```input
    100 250 80
    2 300
    ```
    ```output
    100 300 80
    ```
  starter: |
    prices = input().split()
    change = input().split()
    number = int(change[0])
    new_price = change[1]
    # замените цену товара с номером number
    print(*prices)
  solution: |
    prices = input().split()
    change = input().split()
    number = int(change[0])
    new_price = change[1]
    prices[number - 1] = new_price
    print(*prices)
  tests:
    io:
    - name: Второй товар
      stdin: "100 250 80\n2 300\n"
      stdout: "100 300 80"
    - name: Единственный товар
      stdin: "50\n1 70\n"
      stdout: "70"
      hidden: true
    - name: Последний товар
      stdin: "10 20 30\n3 35\n"
      stdout: "10 20 35"
      hidden: true
    - name: Первый товар
      stdin: "10 20 30\n1 15\n"
      stdout: "15 20 30"
      hidden: true
  explain: |
    Элемент списка можно заменить присваиванием по индексу. Номер на ценнике начинается с 1, а индекс — с 0, поэтому `prices[number - 1] = new_price`. С `prices[number]` меняется соседний товар, а для последнего — `IndexError`. `append` не заменил бы цену, а дописал новую в конец.
- id: append-none
  type: code
  q: |
    **Исправьте программу: на втором имени она падает с ошибкой.**

    Ввод — имена гостей, по одному в строке, в конце — пустая строка. Вывод — `Гостей: N` и следующей строкой имена через запятую с пробелом в порядке ввода.

    Пример 1
    ```input
    Аня
    Борис

    ```
    ```output
    Гостей: 2
    Аня, Борис
    ```
  starter: |
    names = []
    name = input()
    while name != "":
        names = names.append(name)
        name = input()
    print("Гостей:", len(names))
    print(", ".join(names))
  solution: |
    names = []
    name = input()
    while name != "":
        names.append(name)
        name = input()
    print("Гостей:", len(names))
    print(", ".join(names))
  tests:
    io:
    - name: Два гостя
      stdin: "Аня\nБорис\n\n"
      stdout: "Гостей: 2\nАня, Борис"
    - name: Один гость
      stdin: "Вера\n\n"
      stdout: "Гостей: 1\nВера"
      hidden: true
    - name: Три гостя
      stdin: "Глеб\nДина\nЕгор\n\n"
      stdout: "Гостей: 3\nГлеб, Дина, Егор"
      hidden: true
    - name: Никого
      stdin: "\n"
      stdout: "Гостей: 0"
      hidden: true
  explain: |
    `append` меняет сам список и возвращает `None`. Строка кода `names = names.append(name)` добавляет имя, а затем привязывает `names` к этому `None` — список потерян, и следующий `append` вызывать уже не у чего. Достаточно `names.append(name)` без присваивания.
- id: l-fix-day-numbers
  type: code
  q: |
    **Исправьте программу: она берёт не ту температуру и в конце падает.**

    Ввод — температуры через пробел. Вывод — `День i: t` для каждого дня, каждая запись в своей строке. Формат вывода не меняйте.

    Пример 1
    ```input
    12 15 9
    ```
    ```output
    День 1: 12
    День 2: 15
    День 3: 9
    ```
  starter: |
    temps = input().split()
    i = 1
    while i <= len(temps):
        print(f"День {i}: {temps[i]}")
        i += 1
  solution: |
    temps = input().split()
    i = 1
    while i <= len(temps):
        print(f"День {i}: {temps[i - 1]}")
        i += 1
  tests:
    io:
    - name: Три дня
      stdin: "12 15 9\n"
      stdout: "День 1: 12\nДень 2: 15\nДень 3: 9"
    - name: Один день
      stdin: "5\n"
      stdout: "День 1: 5"
      hidden: true
    - name: Нет данных
      stdin: "\n"
      stdout: ""
      hidden: true
  explain: |
    Номер дня начинается с 1, а индекс списка — с 0. Программа брала элемент с индексом, равным номеру дня, — на один дальше, — и на последнем дне уходила за конец списка. Индекс должен быть на единицу меньше номера: `temps[i - 1]`. Можно и наоборот: перебирать индексы с `i = 0` при `i < len(temps)` и печатать номер `i + 1`.
- id: l-change-shopping
  type: code
  q: |
    **Измените программу: повторную покупку не добавляйте в список, а сразу выведите `уже есть: <покупка>`.**

    Ввод — покупки по одной в строке, в конце — пустая строка. В конце программа, как и раньше, выводит список через запятую с пробелом. Большие и маленькие буквы различаются.

    Пример 1
    ```input
    хлеб
    молоко
    хлеб

    ```
    ```output
    уже есть: хлеб
    хлеб, молоко
    ```
  starter: |
    items = []
    item = input()
    while item != "":
        items.append(item)
        item = input()
    print(", ".join(items))
  solution: |
    items = []
    item = input()
    while item != "":
        if item in items:
            print("уже есть:", item)
        else:
            items.append(item)
        item = input()
    print(", ".join(items))
  tests:
    io:
    - name: Хлеб дважды
      stdin: "хлеб\nмолоко\nхлеб\n\n"
      stdout: "уже есть: хлеб\nхлеб, молоко"
    - name: Пустой список
      stdin: "\n"
      stdout: ""
      hidden: true
    - name: Разный регистр
      stdin: "сыр\nСыр\n\n"
      stdout: "сыр, Сыр"
      hidden: true
    - name: Три раза одно и то же
      stdin: "чай\nчай\nчай\n\n"
      stdout: "уже есть: чай\nуже есть: чай\nчай"
      hidden: true
  explain: |
    Перед `append` проверяем `item in items`: для списка `in` ищет элемент, равный покупке целиком. Найден — печатаем сообщение и не добавляем, иначе дописываем в конец. Чтение следующей строки `item = input()` остаётся в конце тела для обеих ветвей — иначе цикл не закончится.
- id: l-write-temp-diff
  type: code
  q: |
    **Выведите, на сколько градусов менялась температура от каждого дня к следующему.**

    Ввод — температуры, целые числа через пробел. Вывод — изменения через пробел; если дней меньше двух — пустая строка.

    Пример 1
    ```input
    5 7 4 4
    ```
    ```output
    2 -3 0
    ```

    Ограничения: перебирайте индексы циклом `while`.
  starter: |
    temps = input().split()
  solution: |
    temps = input().split()
    changes = []
    i = 1
    while i < len(temps):
        changes.append(int(temps[i]) - int(temps[i - 1]))
        i += 1
    print(*changes)
  tests:
    io:
    - name: Четыре дня
      stdin: "5 7 4 4\n"
      stdout: "2 -3 0"
    - name: Один день
      stdin: "10\n"
      stdout: ""
      hidden: true
    - name: Нет данных
      stdin: "\n"
      stdout: ""
      hidden: true
    - name: Из мороза в оттепель
      stdin: "-3 2\n"
      stdout: "5"
      hidden: true
    - name: Похолодание и потепление
      stdin: "20 18 18 25\n"
      stdout: "-2 0 7"
      hidden: true
  explain: |
    Изменение к дню `i` — это `temps[i] - temps[i - 1]`, поэтому перебор начинается с `i = 1`: у первого дня предыдущего нет. Изменений на одно меньше, чем дней. Элементы после `split()` — строки, их нужно превратить в числа: иначе вычитание даст `TypeError`. Новые значения собираются в список через `append`, а `print(*changes)` выводит их через пробел.
