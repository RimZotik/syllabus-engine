id: p1c-ai-weekend
title: ИИ-ассистент проверяет выходной
sandbox: python-browser
difficulty: 2
statement: |
  Задача: на вход подаётся номер дня недели от 1 (понедельник) до 7 (воскресенье). Выведите `выходной` для субботы и воскресенья (6 и 7) и `рабочий` для остальных дней.

  ```input
  6
  ```
  ```
  выходной
  ```

  Решение в редакторе написал ИИ-ассистент. На примере из условия оно выводит правильный ответ, но часть тестов не проходит. Проследите условие вручную для ввода `3` (правильный ответ — `рабочий`), объясните себе, что вычисляет Python, и исправьте ошибку.
starter: |
  # Решение от ИИ-ассистента
  day = int(input())
  if day == 6 or 7:
      print("выходной")
  else:
      print("рабочий")
stdin: "6\n"
solution: |
  day = int(input())
  if day == 6 or day == 7:
      print("выходной")
  else:
      print("рабочий")
tests:
  io:
    - name: Пример из условия
      stdin: "6\n"
      stdout: "выходной"
    - name: Среда
      stdin: "3\n"
      stdout: "рабочий"
    - name: Воскресенье
      stdin: "7\n"
      stdout: "выходной"
      hidden: true
    - name: Понедельник
      stdin: "1\n"
      stdout: "рабочий"
      hidden: true
    - name: Пятница
      stdin: "5\n"
      stdout: "рабочий"
      hidden: true
hints:
  - level: 1
    text: Python читает условие как `(day == 6) or 7`. Чему равна левая часть для `day = 3`? Что тогда вернёт `or`?
  - level: 2
    text: Если левая часть ложна, `or` отдаёт правую — число `7`, а ненулевое число в условии истинно. Каждое сравнение нужно писать целиком.
  - level: 3
    text: 'Исправленное условие — `if day == 6 or day == 7:` (или короче `if day >= 6:`, раз дни только от 1 до 7).'
