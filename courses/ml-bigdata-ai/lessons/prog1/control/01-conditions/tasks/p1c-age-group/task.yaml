id: p1c-age-group
title: Возрастная группа
sandbox: python-browser
difficulty: 1
statement: |
  **Выведите возрастную группу читателя библиотеки по его возрасту.**

  Ввод — целое число: возраст в годах. Вывод — одно слово:
  - `дошкольник` — младше 7 лет;
  - `школьник` — от 7 до 17 включительно;
  - `взрослый` — от 18 до 64 включительно;
  - `пенсионер` — 65 лет и старше.

  Пример 1
  ```input
  12
  ```
  ```output
  школьник
  ```

  Пример 2
  ```input
  65
  ```
  ```output
  пенсионер
  ```

  Ограничения: возраст от 0 до 120.
starter: |
  age = int(input())
  if age < 7:
      print("дошкольник")
stdin: "12\n"
solution: |
  age = int(input())
  if age < 7:
      print("дошкольник")
  elif age < 18:
      print("школьник")
  elif age < 65:
      print("взрослый")
  else:
      print("пенсионер")
tests:
  io:
    - name: Пример 1
      stdin: "12\n"
      stdout: "школьник"
    - name: Пример 2
      stdin: "65\n"
      stdout: "пенсионер"
    - name: Взрослый
      stdin: "30\n"
      stdout: "взрослый"
      hidden: true
    - name: Новорождённый
      stdin: "0\n"
      stdout: "дошкольник"
      hidden: true
    - name: Граница 6
      stdin: "6\n"
      stdout: "дошкольник"
      hidden: true
    - name: Граница 7
      stdin: "7\n"
      stdout: "школьник"
      hidden: true
    - name: Граница 17
      stdin: "17\n"
      stdout: "школьник"
      hidden: true
    - name: Граница 18
      stdin: "18\n"
      stdout: "взрослый"
      hidden: true
    - name: Граница 64
      stdin: "64\n"
      stdout: "взрослый"
      hidden: true
    - name: Пожилой читатель
      stdin: "93\n"
      stdout: "пенсионер"
      hidden: true
hints:
  - level: 1
    text: Вариантов ответа четыре, а ветвь в стартовом коде одна. Какая инструкция добавляет промежуточные ветви?
  - level: 2
    text: Проверяйте пороги по возрастанию — 7, потом 18, потом 65. Почему во второй проверке не нужно писать `age >= 7`?
  - level: 3
    text: 'Следующая ветвь — `elif age < 18:`. Для последней группы условие не нужно: какая ветвь ловит всё остальное?'
