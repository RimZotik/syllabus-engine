id: p1c-triangle
title: Треугольник
sandbox: python-browser
difficulty: 3
statement: |
  **По трём сторонам определите, существует ли треугольник и какой он.**

  Ввод — три целых числа, каждое в своей строке: длины сторон. Вывод — одна строка:
  - `не существует` — если какая-нибудь сторона не меньше суммы двух других;
  - `равносторонний` — все три стороны равны;
  - `равнобедренный` — равны ровно две стороны;
  - `разносторонний` — все стороны разные.

  Пример 1
  ```input
  5
  8
  5
  ```
  ```output
  равнобедренный
  ```

  Пример 2
  ```input
  2
  2
  5
  ```
  ```output
  не существует
  ```

  Ограничения: стороны от 1 до 1000.
starter: |
  a = int(input())
  b = int(input())
  c = int(input())
stdin: "5\n8\n5\n"
solution: |
  a = int(input())
  b = int(input())
  c = int(input())
  if a + b <= c or a + c <= b or b + c <= a:
      print("не существует")
  elif a == b and b == c:
      print("равносторонний")
  elif a == b or b == c or a == c:
      print("равнобедренный")
  else:
      print("разносторонний")
tests:
  io:
    - name: Пример 1
      stdin: "5\n8\n5\n"
      stdout: "равнобедренный"
    - name: Пример 2
      stdin: "2\n2\n5\n"
      stdout: "не существует"
    - name: Египетский треугольник
      stdin: "3\n4\n5\n"
      stdout: "разносторонний"
      hidden: true
    - name: Все стороны равны
      stdin: "7\n7\n7\n"
      stdout: "равносторонний"
      hidden: true
    - name: Равны первая и вторая
      stdin: "5\n5\n8\n"
      stdout: "равнобедренный"
      hidden: true
    - name: Равны вторая и третья
      stdin: "8\n5\n5\n"
      stdout: "равнобедренный"
      hidden: true
    - name: Длинная первая сторона
      stdin: "10\n1\n1\n"
      stdout: "не существует"
      hidden: true
    - name: Длинная вторая сторона
      stdin: "1\n10\n1\n"
      stdout: "не существует"
      hidden: true
    - name: Сторона равна сумме двух других
      stdin: "1\n2\n3\n"
      stdout: "не существует"
      hidden: true
    - name: Почти вырожденный
      stdin: "6\n6\n11\n"
      stdout: "равнобедренный"
      hidden: true
    - name: Вырожденный с равными сторонами
      stdin: "6\n12\n6\n"
      stdout: "не существует"
      hidden: true
    - name: Единичный
      stdin: "1\n1\n1\n"
      stdout: "равносторонний"
      hidden: true
    - name: Разные стороны
      stdin: "4\n9\n6\n"
      stdout: "разносторонний"
      hidden: true
hints:
  - level: 1
    text: 'Для `2 2 5` две стороны равны, но треугольника нет. Какая проверка должна стоять в цепочке первой?'
  - level: 2
    text: 'Треугольника нет, если **хотя бы одна** сторона не меньше суммы двух других. Это три сравнения — каким оператором их соединить?'
  - level: 3
    text: 'Для «равнобедренного» сравните все три пары сторон: первую со второй, вторую с третьей и первую с третьей. Равносторонний к этому месту цепочки уже отсеян.'
