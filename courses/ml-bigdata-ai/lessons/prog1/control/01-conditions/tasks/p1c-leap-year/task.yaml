id: p1c-leap-year
title: Високосный год
sandbox: python-browser
difficulty: 2
statement: |
  **Определите, високосный ли год.**

  Год високосный, если его номер делится на 4 и не делится на 100, — или если он делится на 400. Ввод — номер года. Вывод — `високосный` или `обычный`.

  Пример 1
  ```input
  2024
  ```
  ```output
  високосный
  ```

  Пример 2
  ```input
  1900
  ```
  ```output
  обычный
  ```

  Ограничения: год от 1 до 10 000.
starter: |
  year = int(input())
  if year % 4 == 0:
      print("високосный")
  else:
      print("обычный")
stdin: "2024\n"
solution: |
  year = int(input())
  if (year % 4 == 0 and year % 100 != 0) or year % 400 == 0:
      print("високосный")
  else:
      print("обычный")
tests:
  io:
    - name: Пример 1
      stdin: "2024\n"
      stdout: "високосный"
    - name: Пример 2
      stdin: "1900\n"
      stdout: "обычный"
    - name: Обычный год
      stdin: "2023\n"
      stdout: "обычный"
      hidden: true
    - name: Делится на 400
      stdin: "2000\n"
      stdout: "високосный"
      hidden: true
    - name: Ещё один век
      stdin: "2100\n"
      stdout: "обычный"
      hidden: true
    - name: Делится на 400 ещё раз
      stdin: "2400\n"
      stdout: "високосный"
      hidden: true
    - name: Первый год
      stdin: "1\n"
      stdout: "обычный"
      hidden: true
    - name: Високосный не круглый
      stdin: "1996\n"
      stdout: "високосный"
      hidden: true
    - name: Делится на 2, но не на 4
      stdin: "2022\n"
      stdout: "обычный"
      hidden: true
hints:
  - level: 1
    text: Что выводит стартовый код для 1900? А как должно быть по правилу?
  - level: 2
    text: 'В правиле два случая, соединённых «или». Первый случай сам состоит из двух проверок, соединённых «и». «Не делится на 100» — это `year % 100 != 0`.'
  - level: 3
    text: 'Соберите первый случай в скобках через `and`, затем допишите второй через `or`. Проверьте на бумаге 2024, 1900 и 2000.'
