id: p1c-leap-year
title: Високосный год
sandbox: python-browser
difficulty: 2
statement: |
  По григорианскому календарю год високосный, если его номер делится на 4, но не делится на 100. Исключение: годы, которые делятся на 400, — тоже високосные. Поэтому 2024 и 2000 — високосные, а 2023 и 1900 — нет.

  Прочитайте номер года — целое положительное число — и выведите `високосный` или `обычный`.

  ```input
  2024
  ```
  ```
  високосный
  ```
starter: |
  year = int(input())
  if year % 4 == 0:
      print("високосный")
  else:
      print("обычный")
stdin: "2024\n"
solution: |
  year = int(input())
  if (year % 4 == 0 and year % 100 != 0) or year % 400 == 0:
      print("високосный")
  else:
      print("обычный")
tests:
  io:
    - name: Пример из условия
      stdin: "2024\n"
      stdout: "високосный"
    - name: Обычный год
      stdin: "2023\n"
      stdout: "обычный"
    - name: Делится на 100, но не на 400
      stdin: "1900\n"
      stdout: "обычный"
      hidden: true
    - name: Делится на 400
      stdin: "2000\n"
      stdout: "високосный"
      hidden: true
    - name: Ещё один век
      stdin: "2100\n"
      stdout: "обычный"
      hidden: true
    - name: Делится на 400 ещё раз
      stdin: "2400\n"
      stdout: "високосный"
      hidden: true
    - name: Первый год
      stdin: "1\n"
      stdout: "обычный"
      hidden: true
    - name: Високосный не круглый
      stdin: "1996\n"
      stdout: "високосный"
      hidden: true
hints:
  - level: 1
    text: Что выводит стартовый код для 1900? А как должно быть по правилу из условия?
  - level: 2
    text: 'Правило состоит из двух случаев, соединённых «или»: (делится на 4 **и** не делится на 100) **или** делится на 400. «Не делится» — это `year % 100 != 0`.'
  - level: 3
    text: 'Условие целиком: `(year % 4 == 0 and year % 100 != 0) or year % 400 == 0`.'
