title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: elif-first-true
  type: single
  q: |
    Что выведет программа?
    ```python
    t = 25
    if t > 30:
        print("жарко")
    elif t > 20:
        print("тепло")
    elif t > 10:
        print("прохладно")
    else:
        print("холодно")
    ```
  options:
  - '`тепло`'
  - '`тепло` и `прохладно`'
  - '`прохладно`'
  - '`холодно`'
  answer: 0
  explain: Цепочка `if`–`elif` останавливается на первом истинном условии. `25 > 20` — истинно, печатается `тепло`, а `25 > 10` уже не проверяется.
- id: separate-ifs
  type: single
  q: |
    Что выведет программа?
    ```python
    x = 12
    if x > 10:
        print("A")
    if x > 5:
        print("B")
    else:
        print("C")
    ```
  options:
  - Только `A`
  - '`A` и `B`'
  - '`A` и `C`'
  - '`A`, `B` и `C`'
  answer: 1
  explain: Здесь две независимые инструкции `if`. Первая печатает `A`. Вторая проверяется отдельно — `12 > 5` истинно, поэтому `B`, а её `else` пропускается.
- id: indent-block
  type: single
  q: |
    Что выведет программа?
    ```python
    age = 16
    if age >= 18:
        print("Доступ открыт")
        print("Добро пожаловать")
    print("конец")
    ```
  options:
  - '`Добро пожаловать` и `конец`'
  - '`конец`'
  - Ничего
  - '`Доступ открыт`, `Добро пожаловать` и `конец`'
  answer: 1
  explain: 'Обе строки кода с отступом — тело ветви `if`, и при ложном условии `16 >= 18` пропускаются обе. `print("конец")` стоит у левого края, вне ветви, и выполняется всегда.'
- id: falsy-values
  type: multi
  q: При каком значении `v` строка кода `if v:` **не** выполнит свою ветвь? Выберите все.
  options:
  - '`0`'
  - '`"0"`'
  - '`""`'
  - '`[]`'
  - '`" "`'
  answer:
  - 0
  - 2
  - 3
  explain: 'Ложны ноль, пустая строка и пустой список. Строки `"0"` и `" "` не пустые, поэтому истинны: Python не читает смысл текста.'
- id: short-circuit
  type: single
  q: |
    Что выведет программа?
    ```python
    n = 0
    if n != 0 and 10 / n > 1:
        print("да")
    else:
        print("нет")
    ```
  options:
  - '`нет`'
  - Ошибку `ZeroDivisionError`
  - '`да`'
  - Ничего
  answer: 0
  explain: '`and` вычислил левую часть — `False` — и правую уже не трогал. Деления на ноль не происходит, выполняется ветвь `else`.'
- id: or-returns-operand
  type: single
  q: |
    Что выведет программа?
    ```python
    name = ""
    print(name or "гость")
    ```
  options:
  - '`False`'
  - '`True`'
  - '`гость`'
  - Пустую строку вывода
  answer: 2
  explain: '`or` возвращает одно из значений слева или справа от себя. Слева — пустая строка, она ложна, поэтому результат — значение справа, `"гость"`.'
- id: compare-with-true
  type: single
  q: '`is_open` указывает на `True` или `False`. Какая запись проверяет то же, что `if is_open == True:`, и принята в Python?'
  options:
  - '`if is_open:`'
  - '`if is_open = True:`'
  - '`if is_open == "True":`'
  - '`if "is_open" == True:`'
  answer: 0
  explain: 'Логическое значение уже годится для условия, сравнивать его с `True` незачем. `=` в условии — синтаксическая ошибка, а в кавычках — строки, а не логическое значение и не имя.'
- id: if-not-loop
  type: single
  q: |
    Что выведет программа?
    ```python
    x = 1
    if x < 3:
        x = x + 1
    print(x)
    ```
  options:
  - '`3`'
  - '`2`'
  - '`1`'
  - '`4`'
  answer: 1
  explain: '`if` проверяет условие один раз и не повторяет ветвь. `1 < 3` — ветвь выполняется один раз, `x` становится 2. Повторять, пока условие верно, умеет только цикл.'
- id: string-compare
  type: single
  q: |
    Что выведет программа?
    ```python
    print("Яблоко" < "арбуз", "кот" == "Кот")
    ```
  options:
  - '`True False`'
  - '`False False`'
  - '`False True`'
  - '`True True`'
  answer: 0
  explain: Строки сравниваются по номерам символов в кодировке, а все большие буквы стоят раньше маленьких — поэтому `"Яблоко" < "арбуз"`. Регистр важен и при `==`.
- id: open-or-answer
  type: open
  q: |
    Программа спрашивает согласие:
    ```python
    answer = input()
    if answer == "да" or "Да":
        print("Принято")
    else:
        print("Отказ")
    ```
    Пользователь ввёл `нет`, а программа вывела `Принято`. Объясните, почему так происходит, и исправьте условие.
  rubric:
  - Python читает условие как (answer == "да") or "Да", а не как «answer равно да или Да»
  - левая часть ложна, or возвращает строку "Да", а непустая строка в условии истинна — ветвь выполняется при любом вводе
  - исправление — сравнение целиком с каждой стороны answer == "да" or answer == "Да" (или answer.lower() == "да")
  wrong_answers:
  - нужно поставить скобки ("да" or "Да")
  - ошибка в else — его надо убрать
  followups:
  - Что выведет исправленная программа для ввода "ДА"? Как сделать проверку без учёта регистра?
