title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: elif-first-true
  type: single
  q: |
    Что выведет программа?
    ```python
    t = 25
    if t > 30:
        print("жарко")
    elif t > 20:
        print("тепло")
    elif t > 10:
        print("прохладно")
    else:
        print("холодно")
    ```
  options:
  - '`тепло`'
  - '`тепло` и `прохладно`'
  - '`прохладно`'
  - '`холодно`'
  answer: 0
  explain: Цепочка `if`–`elif` останавливается на первом истинном условии. `25 > 20` — истинно, печатается `тепло`, а `25 > 10` уже не проверяется.
- id: separate-ifs
  type: single
  q: |
    Что выведет программа?
    ```python
    x = 12
    if x > 10:
        print("A")
    if x > 5:
        print("B")
    else:
        print("C")
    ```
  options:
  - Только `A`
  - '`A` и `B`'
  - '`A` и `C`'
  - '`A`, `B` и `C`'
  answer: 1
  explain: Здесь две независимые инструкции `if`. Первая печатает `A`. Вторая проверяется отдельно — `12 > 5` истинно, поэтому `B`, а её `else` пропускается.
- id: indent-block
  type: single
  q: |
    Что выведет программа?
    ```python
    age = 16
    if age >= 18:
        print("Доступ открыт")
        print("Добро пожаловать")
    print("конец")
    ```
  options:
  - '`Добро пожаловать` и `конец`'
  - '`конец`'
  - Ничего
  - '`Доступ открыт`, `Добро пожаловать` и `конец`'
  answer: 1
  explain: 'Обе строки кода с отступом — тело ветви `if`, и при ложном условии `16 >= 18` пропускаются обе. `print("конец")` стоит у левого края, вне ветви, и выполняется всегда.'
- id: falsy-values
  type: multi
  q: При каком значении `v` строка кода `if v:` **не** выполнит свою ветвь? Выберите все.
  options:
  - '`0.0`'
  - '`"False"`'
  - '`" ".strip()`'
  - '`-1`'
  - '`[]`'
  answer:
  - 0
  - 2
  - 4
  explain: 'Ложны ноль любого числового типа, пустая строка и пустой список. `" ".strip()` убирает пробел и даёт пустую строку — она ложна. `"False"` — непустая строка, а `-1` — не ноль, поэтому оба истинны: Python не читает смысл текста и не смотрит на знак числа.'
- id: short-circuit
  type: single
  q: |
    Что выведет программа?
    ```python
    n = 0
    if n == 0 or 10 / n > 1:
        print("да")
    else:
        print("нет")
    ```
  options:
  - '`да`'
  - Ошибку `ZeroDivisionError`
  - '`нет`'
  - '`да`, а затем ошибку `ZeroDivisionError`'
  answer: 0
  explain: 'Левая часть `n == 0` истинна, значит, ответ на вопрос «истинно хотя бы одно?» уже ясен, и `or` правую часть не вычисляет. Деления на ноль не происходит, выполняется ветвь `if`.'
- id: or-returns-operand
  type: single
  q: |
    Что выведет программа?
    ```python
    count = 0
    print(count and 100 / count)
    ```
  options:
  - '`False`'
  - '`0`'
  - Ошибку `ZeroDivisionError`
  - '`0.0`'
  answer: 1
  explain: '`and` возвращает одно из значений слева или справа от себя, а не обязательно `True` или `False`. Слева `0` — он ложен, поэтому результат — сам `0`, а деление справа даже не вычисляется.'
- id: compare-with-true
  type: single
  q: |
    `x` — целое число. Какая одна строка кода делает с именем `big` то же, что эти четыре?
    ```python
    if x > 0:
        big = True
    else:
        big = False
    ```
  options:
  - '`big = x > 0`'
  - '`big = bool(x)`'
  - '`big = "True" if x > 0 else "False"`'
  - '`big = x if x > 0 else False`'
  answer: 0
  explain: 'Сравнение `x > 0` уже даёт `True` или `False`. `bool(x)` истинно и для отрицательных чисел. Условное выражение с `"True"` и `"False"` даёт строки, а строка `"False"` в условии истинна. Вариант `x if x > 0 else False` для `x = 5` имя `big` укажет на `5`, а не на `True`.'
- id: if-not-loop
  type: single
  q: |
    Что выведет программа?
    ```python
    x = 1
    if x < 3:
        x = x + 1
    print(x)
    ```
  options:
  - '`3`'
  - '`2`'
  - '`1`'
  - '`4`'
  answer: 1
  explain: '`if` проверяет условие один раз и не повторяет ветвь. `1 < 3` — ветвь выполняется один раз, `x` становится 2. Повторять, пока условие верно, умеет только цикл.'
- id: string-compare
  type: single
  q: |
    Что выведет программа?
    ```python
    print("Кот" < "кит", "кот" < "кит")
    ```
  options:
  - '`True False`'
  - '`False False`'
  - '`False True`'
  - '`True True`'
  answer: 0
  explain: 'Строки сравниваются буква за буквой по номерам символов. В первой паре уже первые буквы разные: большая `К` стоит раньше любой маленькой, поэтому `True`. Во второй первые буквы совпадают, а вторые — `о` и `и` — идут как в алфавите: `и` раньше `о`, значит, `"кот"` больше, и ответ `False`.'
- id: chain-statements
  type: multi
  q: Какие утверждения о цепочке `if`–`elif`–`else` верны? Выберите все.
  options:
  - Если истинны несколько условий, выполнится ветвь того, что стоит выше всех
  - Условие `elif` проверяется, только если все условия выше него оказались ложными
  - Цепочка всегда выполняет ровно одну из своих ветвей
  - Если внутри ветви имя получило новое значение, условия ниже проверяются заново
  answer:
  - 0
  - 1
  traps:
  - 2
  explain: 'Цепочка останавливается на первом истинном условии, а до `elif` доходит, только если всё выше ложно. Ровно одна ветвь выполняется, лишь когда есть `else`: без него при всех ложных условиях не выполнится ни одна. После выполненной ветви цепочка заканчивается, ничего не перепроверяя.'
- id: open-or-answer
  type: open
  q: |
    Программа спрашивает согласие:
    ```python
    answer = input()
    if answer == "да" or "Да":
        print("Принято")
    else:
        print("Отказ")
    ```
    Пользователь ввёл `нет`, а программа вывела `Принято`. Объясните, почему так происходит, и исправьте условие.
  rubric:
  - Python читает условие как (answer == "да") or "Да" — левая часть ложна, or возвращает строку "Да", а непустая строка в условии истинна, поэтому ветвь выполняется при любом вводе
  - исправление — сравнение целиком с каждой стороны answer == "да" or answer == "Да" (или answer.lower() == "да")
  wrong_answers:
  - нужно поставить скобки ("да" or "Да")
  - ошибка в else — его надо убрать
  followups:
  - Что выведет исправленная программа для ввода "ДА"? Как сделать проверку без учёта регистра?
