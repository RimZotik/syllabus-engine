title: Проверка темы
pass: 0.85
minutes: 40
questions:
- id: falsy-values
  type: multi
  q: При каком значении `v` строка кода `if v:` **не** выполнит свою ветвь? Выберите все.
  options:
  - '`0.0`'
  - '`"False"`'
  - '`" ".strip()`'
  - '`-1`'
  - '`[]`'
  answer:
  - 0
  - 2
  - 4
  explain: 'Ложны ноль любого числового типа, пустая строка и пустой список. `" ".strip()` убирает пробел и даёт пустую строку — она ложна. `"False"` — непустая строка, а `-1` — не ноль, поэтому оба истинны: Python не читает смысл текста и не смотрит на знак числа.'
- id: or-returns-operand
  type: single
  q: |
    Что выведет программа?
    ```python
    count = 0
    print(count and 100 / count)
    ```
  options:
  - '`False`'
  - '`0`'
  - Ошибку `ZeroDivisionError`
  - '`0.0`'
  answer: 1
  explain: '`and` возвращает одно из значений слева или справа от себя, а не обязательно `True` или `False`. Слева `0` — он ложен, поэтому результат — сам `0`, а деление справа даже не вычисляется.'
- id: compare-with-true
  type: single
  q: |
    `x` — целое число. Какая одна строка кода делает с именем `big` то же, что эти четыре?
    ```python
    if x > 0:
        big = True
    else:
        big = False
    ```
  options:
  - '`big = x > 0`'
  - '`big = bool(x)`'
  - '`big = "True" if x > 0 else "False"`'
  - '`big = x if x > 0 else False`'
  answer: 0
  explain: 'Сравнение `x > 0` уже даёт `True` или `False`. `bool(x)` истинно и для отрицательных чисел. Условное выражение с `"True"` и `"False"` даёт строки, а строка `"False"` в условии истинна. Вариант `x if x > 0 else False` для `x = 5` имя `big` укажет на `5`, а не на `True`.'
- id: if-not-loop
  type: single
  q: |
    Что выведет программа?
    ```python
    x = 1
    if x < 3:
        x = x + 1
    print(x)
    ```
  options:
  - '`3`'
  - '`2`'
  - '`1`'
  - '`4`'
  answer: 1
  explain: '`if` проверяет условие один раз и не повторяет ветвь. `1 < 3` — ветвь выполняется один раз, `x` становится 2. Повторять, пока условие верно, умеет только цикл.'
- id: string-compare
  type: single
  q: |
    Что выведет программа?
    ```python
    print("Кот" < "кит", "кот" < "кит")
    ```
  options:
  - '`True False`'
  - '`False False`'
  - '`False True`'
  - '`True True`'
  answer: 0
  explain: 'Строки сравниваются буква за буквой по номерам символов. В первой паре уже первые буквы разные: большая `К` стоит раньше любой маленькой, поэтому `True`. Во второй первые буквы совпадают, а вторые — `о` и `и` — идут как в алфавите: `и` раньше `о`, значит, `"кот"` больше, и ответ `False`.'
- id: chain-statements
  type: multi
  q: Какие утверждения о цепочке `if`–`elif`–`else` верны? Выберите все.
  options:
  - Если истинны несколько условий, выполнится ветвь того, что стоит выше всех
  - Условие `elif` проверяется, только если все условия выше него оказались ложными
  - Цепочка всегда выполняет ровно одну из своих ветвей
  - Если внутри ветви имя получило новое значение, условия ниже проверяются заново
  answer:
  - 0
  - 1
  traps:
  - 2
  explain: 'Цепочка останавливается на первом истинном условии, а до `elif` доходит, только если всё выше ложно. Ровно одна ветвь выполняется, лишь когда есть `else`: без него при всех ложных условиях не выполнится ни одна. После выполненной ветви цепочка заканчивается, ничего не перепроверяя.'
- id: indent-block
  type: code
  q: |
    Программа проверяет возраст посетителя. Взрослому — от 18 лет — она должна вывести `Доступ открыт` и `Добро пожаловать`, каждое в своей строке, а затем всем без исключения — `Хорошего дня`. Сейчас `Добро пожаловать` видят и несовершеннолетние. Исправьте программу.
  starter: |
    age = int(input())
    if age >= 18:
        print("Доступ открыт")
    print("Добро пожаловать")
    print("Хорошего дня")
  solution: |
    age = int(input())
    if age >= 18:
        print("Доступ открыт")
        print("Добро пожаловать")
    print("Хорошего дня")
  tests:
    io:
    - name: Взрослый
      stdin: "20\n"
      stdout: "Доступ открыт\nДобро пожаловать\nХорошего дня"
    - name: Подросток
      stdin: "16\n"
      stdout: "Хорошего дня"
    - name: Ровно 18 лет
      stdin: "18\n"
      stdout: "Доступ открыт\nДобро пожаловать\nХорошего дня"
      hidden: true
    - name: 17 лет
      stdin: "17\n"
      stdout: "Хорошего дня"
      hidden: true
  explain: |
    Тело ветви — все строки кода с отступом под `if`. `print("Добро пожаловать")` стоял у левого края, вне ветви, поэтому выполнялся при любом возрасте. С отступом он входит в ветвь вместе с `Доступ открыт`, а `Хорошего дня` остаётся у края — его видят все.
- id: c-fix-discount
  type: code
  q: |
    Магазин снимает 100 рублей с покупки от 1000 рублей **включительно**. Программа читает сумму покупки и выводит, сколько нужно заплатить, но на одной из сумм ошибается. Найдите ошибку и исправьте её.
  starter: |
    total = int(input())
    if total > 1000:
        total = total - 100
    print(total)
  solution: |
    total = int(input())
    if total >= 1000:
        total = total - 100
    print(total)
  tests:
    io:
    - name: Большая покупка
      stdin: "1500\n"
      stdout: "1400"
    - name: Маленькая покупка
      stdin: "300\n"
      stdout: "300"
    - name: Ровно 1000 рублей
      stdin: "1000\n"
      stdout: "900"
      hidden: true
    - name: 999 рублей
      stdin: "999\n"
      stdout: "999"
      hidden: true
  explain: |
    «От 1000 включительно» — это `total >= 1000`. Со знаком `>` покупка ровно на 1000 рублей скидку не получает. Такая ошибка видна только на самой границе, поэтому граничное значение проверяют отдельно.
- id: c-complete-cinema
  type: code
  q: |
    На фильм пускают зрителей от 16 лет, а тех, кто младше, — только со взрослым. Программа читает возраст и ответ на вопрос «Со взрослым?» — `да` или `нет`. Замените `...` после `if` условием, чтобы программа отвечала верно.
  starter: |
    age = int(input())
    with_adult = input()
    if ...:
        print("проходите")
    else:
        print("нельзя")
  solution: |
    age = int(input())
    with_adult = input()
    if age >= 16 or with_adult == "да":
        print("проходите")
    else:
        print("нельзя")
  tests:
    io:
    - name: Взрослый зритель
      stdin: "20\nнет\n"
      stdout: "проходите"
    - name: Ребёнок без взрослого
      stdin: "12\nнет\n"
      stdout: "нельзя"
    - name: Ребёнок со взрослым
      stdin: "12\nда\n"
      stdout: "проходите"
      hidden: true
    - name: Ровно 16 лет
      stdin: "16\nнет\n"
      stdout: "проходите"
      hidden: true
    - name: 15 лет без взрослого
      stdin: "15\nнет\n"
      stdout: "нельзя"
      hidden: true
    - name: Взрослый со взрослым
      stdin: "30\nда\n"
      stdout: "проходите"
      hidden: true
  explain: |
    Пускают, если выполнено **хотя бы одно** из двух: зрителю от 16 лет или он пришёл со взрослым. Это `or`. С `and` взрослого, пришедшего одного, не пустили бы. Ответ сравнивается целиком: `with_adult == "да"`.
- id: short-circuit
  type: code
  q: |
    Программа читает сумму баллов за все работы ученика и число работ, каждое в своей строке. Она выводит `отличник`, если работы были и средний балл не ниже 4.5, иначе — `нет`. Но если работ не было (число работ — 0), программа падает с ошибкой. Исправьте условие.
  starter: |
    total = int(input())
    count = int(input())
    if total / count >= 4.5 and count > 0:
        print("отличник")
    else:
        print("нет")
  solution: |
    total = int(input())
    count = int(input())
    if count > 0 and total / count >= 4.5:
        print("отличник")
    else:
        print("нет")
  tests:
    io:
    - name: Средний балл 4.7
      stdin: "14\n3\n"
      stdout: "отличник"
    - name: Работ не было
      stdin: "0\n0\n"
      stdout: "нет"
    - name: Ровно 4.5
      stdin: "9\n2\n"
      stdout: "отличник"
      hidden: true
    - name: Средний балл 4
      stdin: "8\n2\n"
      stdout: "нет"
      hidden: true
    - name: Одна четвёрка
      stdin: "4\n1\n"
      stdout: "нет"
      hidden: true
  explain: |
    `and` вычисляет части слева направо и правую не трогает, если левая уже ложна. В программе первым стоит деление, и при `count = 0` оно выполняется раньше проверки — `ZeroDivisionError`. Поменяйте части местами: `count > 0 and total / count >= 4.5`. Тогда при нуле работ `and` остановится на левой части, и деления не будет.
- id: c-fix-delivery
  type: code
  q: |
    Доставка стоит 100 рублей до 3 км включительно, 200 рублей — до 10 км включительно и 400 рублей — дальше. Программа читает расстояние в километрах, целое число, но для близких адресов выводит две цены. Исправьте её, чтобы она всегда выводила одну цену.
  starter: |
    km = int(input())
    if km <= 3:
        print(100)
    if km <= 10:
        print(200)
    else:
        print(400)
  solution: |
    km = int(input())
    if km <= 3:
        print(100)
    elif km <= 10:
        print(200)
    else:
        print(400)
  tests:
    io:
    - name: 7 км
      stdin: "7\n"
      stdout: "200"
    - name: 2 км
      stdin: "2\n"
      stdout: "100"
    - name: Ровно 3 км
      stdin: "3\n"
      stdout: "100"
      hidden: true
    - name: Ровно 10 км
      stdin: "10\n"
      stdout: "200"
      hidden: true
    - name: 11 км
      stdin: "11\n"
      stdout: "400"
      hidden: true
    - name: 25 км
      stdin: "25\n"
      stdout: "400"
      hidden: true
  explain: |
    Второй `if` начинает новую, независимую проверку: для 2 км истинны и `km <= 3`, и `km <= 10`, поэтому печатаются обе цены. Если второй `if` заменить на `elif`, получится одна цепочка: она остановится на первом истинном условии, и выполнится ровно одна ветвь.
- id: c-change-shop-hours
  type: code
  q: |
    Программа читает номер дня недели (1 — понедельник, 7 — воскресенье) и час — целое число от 0 до 23 — и сообщает, открыт ли магазин. Сейчас она считает, что магазин каждый день работает с 9 до 21 часа: в 9 часов уже открыто, в 21 — уже закрыто. Измените её: в субботу и воскресенье магазин работает с 10 до 18 часов (в 10 уже открыто, в 18 уже закрыто), в будни — как раньше.
  starter: |
    day = int(input())
    hour = int(input())
    if 9 <= hour < 21:
        print("открыто")
    else:
        print("закрыто")
  solution: |
    day = int(input())
    hour = int(input())
    if day <= 5:
        is_open = 9 <= hour < 21
    else:
        is_open = 10 <= hour < 18
    if is_open:
        print("открыто")
    else:
        print("закрыто")
  tests:
    io:
    - name: Среда, 9 часов
      stdin: "3\n9\n"
      stdout: "открыто"
    - name: Суббота, 9 часов
      stdin: "6\n9\n"
      stdout: "закрыто"
    - name: Суббота, 10 часов
      stdin: "6\n10\n"
      stdout: "открыто"
      hidden: true
    - name: Воскресенье, 17 часов
      stdin: "7\n17\n"
      stdout: "открыто"
      hidden: true
    - name: Воскресенье, 18 часов
      stdin: "7\n18\n"
      stdout: "закрыто"
      hidden: true
    - name: Пятница, 20 часов
      stdin: "5\n20\n"
      stdout: "открыто"
      hidden: true
    - name: Пятница, 21 час
      stdin: "5\n21\n"
      stdout: "закрыто"
      hidden: true
    - name: Суббота, 20 часов
      stdin: "6\n20\n"
      stdout: "закрыто"
      hidden: true
    - name: Понедельник, 8 часов
      stdin: "1\n8\n"
      stdout: "закрыто"
      hidden: true
  explain: |
    Сначала выбираем, какие часы работы действуют сегодня (`day <= 5` — будни), потом проверяем час по этим границам. Можно и одним условием: `day <= 5 and 9 <= hour < 21 or day >= 6 and 10 <= hour < 18` — `and` выполняется раньше `or`, но с отдельным именем `is_open` читать проще. Границы «в 10 уже открыто, в 18 уже закрыто» — это `10 <= hour < 18`.
- id: c-write-best-jump
  type: code
  q: |
    Спортсмен сделал три попытки прыжка в длину. Программа читает три результата в сантиметрах, каждый в своей строке, и выводит лучший — наибольший. Допишите её, не используя встроенные `max`, `min` и `sorted`.
  starter: |
    a = int(input())
    b = int(input())
    c = int(input())
  solution: |
    a = int(input())
    b = int(input())
    c = int(input())
    if a >= b and a >= c:
        print(a)
    elif b >= c:
        print(b)
    else:
        print(c)
  tests:
    forbid: [max, min, sorted]
    io:
    - name: Лучшая — вторая попытка
      stdin: "410\n452\n438\n"
      stdout: "452"
    - name: Лучшая — первая попытка
      stdin: "500\n452\n438\n"
      stdout: "500"
      hidden: true
    - name: Лучшая — третья попытка
      stdin: "410\n420\n438\n"
      stdout: "438"
      hidden: true
    - name: Две первые равны и лучше третьей
      stdin: "450\n450\n430\n"
      stdout: "450"
      hidden: true
    - name: Две последние равны и лучше первой
      stdin: "430\n450\n450\n"
      stdout: "450"
      hidden: true
    - name: Все три равны
      stdin: "400\n400\n400\n"
      stdout: "400"
      hidden: true
  explain: |
    Первое число — лучшее, если оно не меньше каждого из двух других: `a >= b and a >= c`. Если нет, лучшее — большее из `b` и `c`: `elif` уже знает, что `a` не победило. Другой путь — шаблон «лучший из просмотренных»: `best = a`, затем два отдельных `if` заменяют `best` на `b` или `c`, если они больше. Опасны равные результаты: если для каждого числа написать своё условие «больше обоих других» — `a > b and a > c`, `b > a and b > c`, `c > a and c > b`, — то при `450, 450, 430` ни одно из них не истинно, и программа не выведет ничего.
- id: open-or-answer
  type: open
  q: |
    Программа спрашивает согласие:
    ```python
    answer = input()
    if answer == "да" or "Да":
        print("Принято")
    else:
        print("Отказ")
    ```
    Пользователь ввёл `нет`, а программа вывела `Принято`. Объясните, почему так происходит, и исправьте условие.
  rubric:
  - Python читает условие как (answer == "да") or "Да" — левая часть ложна, or возвращает строку "Да", а непустая строка в условии истинна, поэтому ветвь выполняется при любом вводе
  - исправление — сравнение целиком с каждой стороны answer == "да" or answer == "Да" (или answer.lower() == "да")
  wrong_answers:
  - нужно поставить скобки ("да" or "Да")
  - ошибка в else — его надо убрать
  followups:
  - Что выведет исправленная программа для ввода "ДА"? Как сделать проверку без учёта регистра?
