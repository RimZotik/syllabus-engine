title: Проверка темы
pass: 0.85
minutes: 40
questions:
- id: trace-divide
  type: single
  q: |
    Что выведет программа? Проследите её вручную, по таблице.
    ```python
    n = 20
    steps = 0
    while n > 1:
        n = n // 3
        steps += 1
    print(steps, n)
    ```
  options:
  - '`3 0`'
  - '`2 2`'
  - '`3 1`'
  - '`2 0`'
  answer: 0
  explain: 'Значения `n` при проверках — 20, 6, 2, 0. Три раза условие истинно, после третьей итерации `n = 2 // 3 = 0`, и проверка `0 > 1` ложна. Цикл не останавливается ровно на 1 — он выходит при первой ложной проверке.'
- id: checked-once
  type: single
  q: |
    Что выведет программа (каждое число — в своей строке вывода)?
    ```python
    x = 0
    while x < 10:
        x += 6
        print(x)
    ```
  options:
  - Только `6`
  - '`6` и `12`'
  - '`6`, `12` и `18`'
  - Числа без конца
  answer: 1
  explain: 'Условие проверяется один раз перед каждой итерацией. При `x = 6` проверка истинна, и тело выполняется целиком — `x` становится 12 и печатается. Только следующая проверка `12 < 10` останавливает цикл.'
- id: which-infinite
  type: multi
  q: |
    Какие из циклов никогда не закончатся сами? Выберите все.
    ```python
    # A
    i = 0
    while i < 5:
        print(i)

    # B
    i = 0
    while i < 5:
        i += 1

    # C
    i = 10
    while i > 0:
        i += 1

    # D
    while True:
        break
    ```
  options:
  - A
  - B
  - C
  - D
  answer:
  - 0
  - 2
  explain: 'В A тело не меняет `i`, и `0 < 5` верно вечно. В C `i` растёт, поэтому `i > 0` никогда не станет ложным. B заканчивается через пять итераций, D — сразу на `break`.'
- id: continue-before-step
  type: single
  q: |
    Что произойдёт при запуске?
    ```python
    i = 0
    while i < 5:
        if i == 2:
            continue
        print(i)
        i += 1
    ```
  options:
  - Выведутся 0, 1, 3, 4, и программа закончится
  - Выведутся 0 и 1, а потом программа зависнет, больше ничего не печатая
  - Выведутся 0, 1, 2, 3, 4, и программа закончится
  - Без конца будет печататься `2`
  answer: 1
  explain: 'При `i = 2` срабатывает `continue`, и строки кода `print(i)` и `i += 1` пропускаются. `i` навсегда остаётся 2 — каждая итерация снова упирается в `continue` и ничего не печатает. Это бесконечный цикл: после 0 и 1 вывода больше нет, пока программу не прервут.'
- id: break-vs-continue
  type: single
  q: |
    Программу запустили два раза: сначала с `break` в отмеченной строке, потом с `continue`. Что она выведет в первый и во второй раз?
    ```python
    total = 0
    i = 0
    while i < 5:
        i += 1
        if i == 3:
            break  # во второй раз здесь continue
        total += i
    print(total)
    ```
  options:
  - '`3`, затем `12`'
  - '`3`, затем `15`'
  - '`12`, затем `3`'
  - '`3`, затем `3`'
  answer: 0
  explain: 'С `break` цикл кончается на `i = 3` до прибавления — сложились только 1 и 2. С `continue` пропускается лишь прибавление тройки, а цикл не кончается и идёт дальше: 1 + 2 + 4 + 5 = 12. Сумма всех пяти чисел, 15, не получится ни в одном запуске.'
- id: checks-count
  type: single
  q: Тело цикла `while` выполнилось 4 раза, и цикл закончился сам, без `break`. Сколько раз Python проверил его условие?
  options:
  - '4'
  - '5'
  - '1'
  - '8'
  answer: 1
  explain: 'Перед каждой из четырёх итераций условие было истинным, и ещё одна, пятая проверка дала `False` — после неё цикл закончился.'
- id: w-fix-countdown
  type: code
  q: |
    **Исправьте таймер: он выводит лишнюю строку.**

    Ввод — число секунд n. Вывод — n, n − 1, …, 1, каждое в своей строке, затем `Старт!`.

    Пример 1
    ```input
    3
    ```
    ```output
    3
    2
    1
    Старт!
    ```
  starter: |
    n = int(input())
    while n >= 0:
        print(n)
        n -= 1
    print("Старт!")
  solution: |
    n = int(input())
    while n > 0:
        print(n)
        n -= 1
    print("Старт!")
  tests:
    io:
    - name: Три секунды
      stdin: "3\n"
      stdout: "3\n2\n1\nСтарт!"
    - name: Одна секунда
      stdin: "1\n"
      stdout: "1\nСтарт!"
      hidden: true
    - name: Ноль секунд
      stdin: "0\n"
      stdout: "Старт!"
      hidden: true
  explain: |
    При `n >= 0` последняя истинная проверка — `0 >= 0`, и тело печатает лишний `0`. Нужно, чтобы цикл вышел, когда `n` стал нулём: `n > 0`. Проверьте крайние значения: при вводе `0` тело не должно выполниться ни разу.
- id: off-by-one-bound
  type: code
  q: |
    **Выведите все чётные числа от 2 до n включительно, каждое в своей строке.**

    Ввод — целое число n, не меньше 0. Если таких чисел нет, ничего не выводите.

    Пример 1
    ```input
    10
    ```
    ```output
    2
    4
    6
    8
    10
    ```

    Ограничения: используйте цикл `while`.
  starter: |
    n = int(input())
  solution: |
    n = int(input())
    i = 2
    while i <= n:
        print(i)
        i += 2
  tests:
    io:
    - name: До 10
      stdin: "10\n"
      stdout: "2\n4\n6\n8\n10"
    - name: До 7
      stdin: "7\n"
      stdout: "2\n4\n6"
      hidden: true
    - name: Ровно 2
      stdin: "2\n"
      stdout: "2"
      hidden: true
    - name: Единица
      stdin: "1\n"
      stdout: ""
      hidden: true
    - name: Ноль
      stdin: "0\n"
      stdout: ""
      hidden: true
  explain: |
    Начинаем с 2 и шагаем на 2. «Включительно» — это `i <= n`: с `i < n` при чётном `n` пропадёт само `n`. Проверьте крайние значения: при `n = 2` тело выполняется один раз, при `n = 1` — ни разу.
- id: w-fix-stop-word
  type: code
  q: |
    **Исправьте программу: на слове `стоп` она падает с ошибкой.**

    Программа складывает целые числа, по одному в строке, пока не введут `стоп`, и выводит сумму.

    Пример 1
    ```input
    3
    4
    стоп
    ```
    ```output
    7
    ```
  starter: |
    total = 0
    line = int(input())
    while line != "стоп":
        total += line
        line = int(input())
    print(total)
  solution: |
    total = 0
    line = input()
    while line != "стоп":
        total += int(line)
        line = input()
    print(total)
  tests:
    io:
    - name: Два числа
      stdin: "3\n4\nстоп\n"
      stdout: "7"
    - name: Сразу стоп
      stdin: "стоп\n"
      stdout: "0"
      hidden: true
    - name: Есть отрицательное
      stdin: "10\n-2\n5\nстоп\n"
      stdout: "13"
      hidden: true
  explain: |
    `int(input())` пытается превратить в число каждую строку, и на слове `стоп` выходит `ValueError` — до сравнения со `"стоп"` дело не доходит. Читать нужно строку, сравнивать её со словом, а в число превращать только то, что прошло проверку: `total += int(line)`. Подойдёт и `while True` с `break`.
- id: w-complete-steps
  type: code
  q: |
    **Допишите в отмеченное место проверку, которая пропускает сбойные дни шагомера.**

    Ввод — число шагов за день, по одному в строке, в конце — `стоп`. Отрицательное число — сбой: такой день не учитывается вовсе. Вывод — сумма шагов и число учтённых дней через пробел.

    Пример 1
    ```input
    5000
    -1
    7000
    стоп
    ```
    ```output
    12000 2
    ```
  starter: |
    total = 0
    days = 0
    while True:
        line = input()
        if line == "стоп":
            break
        steps = int(line)
        # здесь пропустите сбойный день
        total += steps
        days += 1
    print(total, days)
  solution: |
    total = 0
    days = 0
    while True:
        line = input()
        if line == "стоп":
            break
        steps = int(line)
        if steps < 0:
            continue
        total += steps
        days += 1
    print(total, days)
  tests:
    io:
    - name: Один сбойный день
      stdin: "5000\n-1\n7000\nстоп\n"
      stdout: "12000 2"
    - name: Сразу стоп
      stdin: "стоп\n"
      stdout: "0 0"
      hidden: true
    - name: Все дни сбойные
      stdin: "-5\n-3\nстоп\n"
      stdout: "0 0"
      hidden: true
    - name: День без шагов — не сбой
      stdin: "0\n3000\nстоп\n"
      stdout: "3000 2"
      hidden: true
  explain: |
    `if steps < 0: continue` пропускает остаток итерации — и прибавление шагов, и счёт дня, — а цикл идёт дальше, к следующей строке ввода. Ноль шагов — не сбой: день засчитывается, поэтому условие строгое, `< 0`. `break` здесь не подходит: он закончил бы чтение на первом же сбое.
- id: w-write-coins
  type: code
  q: |
    **Выведите, сколько монет по 10, 5 и 1 рублю выдаст автомат на сдачу.**

    Автомат выдаёт десятки, пока может, потом пятёрки, а остаток — рублями. Ввод — сумма сдачи, целое число не меньше 0. Вывод — три числа через пробел.

    Пример 1
    ```input
    27
    ```
    ```output
    2 1 2
    ```
  starter: |
    change = int(input())
  solution: |
    change = int(input())
    tens = 0
    while change >= 10:
        change -= 10
        tens += 1
    fives = 0
    while change >= 5:
        change -= 5
        fives += 1
    print(tens, fives, change)
  tests:
    io:
    - name: 27 рублей
      stdin: "27\n"
      stdout: "2 1 2"
    - name: Без сдачи
      stdin: "0\n"
      stdout: "0 0 0"
      hidden: true
    - name: Только рубли
      stdin: "4\n"
      stdout: "0 0 4"
      hidden: true
    - name: Ровно 15
      stdin: "15\n"
      stdout: "1 1 0"
      hidden: true
    - name: 9 рублей
      stdin: "9\n"
      stdout: "0 1 4"
      hidden: true
    - name: 100 рублей
      stdin: "100\n"
      stdout: "10 0 0"
      hidden: true
  explain: |
    Каждый номинал — свой цикл «пока остаток не меньше номинала — выдать монету и уменьшить остаток». Условие нестрогое, `>=`: при остатке ровно 10 десятка ещё выдаётся, со знаком `>` для 15 получилось бы `0 2 5`. Что осталось после пятёрок, выдаётся рублями. Можно обойтись и без циклов: `change // 10` монет по 10, остаток `change % 10` — и так далее.
- id: w-write-piggy-bank
  type: code
  q: |
    **Выведите, через сколько дней в копилке будет не меньше заданной суммы.**

    В первый день в копилку кладут 10 рублей, в каждый следующий — на 10 больше, чем накануне: 10, 20, 30… Ввод — цель, целое положительное число рублей.

    Пример 1
    ```input
    100
    ```
    ```output
    4
    ```
    10 + 20 + 30 + 40 = 100.
  starter: |
    goal = int(input())
  solution: |
    goal = int(input())
    saved = 0
    day = 0
    while saved < goal:
        day += 1
        saved += day * 10
    print(day)
  tests:
    io:
    - name: Цель 100 рублей
      stdin: "100\n"
      stdout: "4"
    - name: Цель 101 рубль
      stdin: "101\n"
      stdout: "5"
      hidden: true
    - name: Цель 1 рубль
      stdin: "1\n"
      stdout: "1"
      hidden: true
    - name: Ровно сумма двух дней
      stdin: "30\n"
      stdout: "2"
      hidden: true
    - name: Чуть больше двух дней
      stdin: "31\n"
      stdout: "3"
      hidden: true
    - name: Большая цель
      stdin: "5500\n"
      stdout: "33"
      hidden: true
  explain: |
    Сколько дней — заранее неизвестно, поэтому `while`. Цикл копит, пока суммы **не хватает**: `saved < goal`. Когда накоплено ровно столько, сколько нужно, цель уже достигнута — со знаком `<=` получился бы лишний день. Проверьте вручную: для 30 после двух дней в копилке 10 + 20 = 30, проверка `30 < 30` ложна — ответ 2.
- id: w-change-budget
  type: code
  q: |
    **Измените программу: как только сумма корзины превысит 1000 рублей, выведите `Бюджет превышен на N` и закончите работу.**

    Ввод — цены товаров по одной в строке, в конце — `0`. N — на сколько рублей превышен бюджет; после превышения ввод больше не читайте. Если бюджет не превышен, после `0` программа, как раньше, выводит `Итого: S`.

    Пример 1
    ```input
    300
    200
    0
    ```
    ```output
    Итого: 500
    ```

    Пример 2
    ```input
    600
    500
    100
    0
    ```
    ```output
    Бюджет превышен на 100
    ```
  starter: |
    total = 0
    price = int(input())
    while price != 0:
        total += price
        price = int(input())
    print("Итого:", total)
  solution: |
    total = 0
    price = int(input())
    while price != 0:
        total += price
        if total > 1000:
            break
        price = int(input())
    if total > 1000:
        print("Бюджет превышен на", total - 1000)
    else:
        print("Итого:", total)
  tests:
    io:
    - name: В пределах бюджета
      stdin: "300\n200\n0\n"
      stdout: "Итого: 500"
    - name: Бюджет превышен
      stdin: "600\n500\n100\n0\n"
      stdout: "Бюджет превышен на 100"
    - name: Ровно 1000 рублей
      stdin: "400\n600\n0\n"
      stdout: "Итого: 1000"
      hidden: true
    - name: Пустая корзина
      stdin: "0\n"
      stdout: "Итого: 0"
      hidden: true
    - name: Превышен первым же товаром
      stdin: "1500\n0\n"
      stdout: "Бюджет превышен на 500"
      hidden: true
    - name: После превышения дальше не читает
      stdin: "800\n300\nабв\n"
      stdout: "Бюджет превышен на 100"
      hidden: true
  explain: |
    Внутри цикла после каждого прибавления проверяем сумму и при превышении выходим через `break`, не читая следующую цену. После цикла нужно понять, **как** он закончился: по `0` или по `break`. Это видно по самой сумме — `total > 1000`. «Больше бюджета» — строгое сравнение: ровно 1000 рублей бюджет не превышает.
