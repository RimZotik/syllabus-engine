title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: trace-divide
  type: single
  q: |
    Что выведет программа? Проследите её вручную, по таблице.
    ```python
    n = 20
    steps = 0
    while n > 1:
        n = n // 3
        steps += 1
    print(steps, n)
    ```
  options:
  - '`3 0`'
  - '`2 2`'
  - '`3 1`'
  - '`2 0`'
  answer: 0
  explain: 'Значения `n` при проверках — 20, 6, 2, 0. Три раза условие истинно, после третьей итерации `n = 2 // 3 = 0`, и проверка `0 > 1` ложна. Цикл не останавливается ровно на 1 — он выходит при первой ложной проверке.'
- id: false-at-start
  type: single
  q: |
    Что выведет программа?
    ```python
    i = 10
    while i < 5:
        print(i)
        i += 1
    print("готово")
    ```
  options:
  - '`10`, затем `готово`'
  - Только `готово`
  - Ничего — программа зависнет
  - Числа 10, 11, 12… без конца
  answer: 1
  explain: Условие ложно уже при первой проверке, поэтому тело не выполняется ни разу. Выполнение сразу переходит к строке кода после цикла.
- id: checked-once
  type: single
  q: |
    Что выведет программа (каждое число — в своей строке вывода)?
    ```python
    x = 0
    while x < 10:
        x += 6
        print(x)
    ```
  options:
  - Только `6`
  - '`6` и `12`'
  - '`6`, `12` и `18`'
  - Числа без конца
  answer: 1
  explain: 'Условие проверяется один раз перед каждой итерацией. При `x = 6` проверка истинна, и тело выполняется целиком — `x` становится 12 и печатается. Только следующая проверка `12 < 10` останавливает цикл.'
- id: which-infinite
  type: multi
  q: |
    Какие из циклов никогда не закончатся сами? Выберите все.
    ```python
    # A
    i = 0
    while i < 5:
        print(i)

    # B
    i = 0
    while i < 5:
        i += 1

    # C
    i = 10
    while i > 0:
        i += 1

    # D
    while True:
        break
    ```
  options:
  - A
  - B
  - C
  - D
  answer:
  - 0
  - 2
  explain: 'В A тело не меняет `i`, и `0 < 5` верно вечно. В C `i` растёт, поэтому `i > 0` никогда не станет ложным. B заканчивается через пять итераций, D — сразу на `break`.'
- id: break-then-after
  type: single
  q: |
    Что выведет программа?
    ```python
    total = 0
    while True:
        n = int(input())
        if n < 0:
            break
        total += n
    print("Сумма:", total)
    ```
    ```input
    4
    5
    -1
    7
    ```
  options:
  - Ничего — `break` завершает программу
  - '`Сумма: 9`'
  - '`Сумма: 16`'
  - '`Сумма: 8`'
  answer: 1
  explain: '`break` завершает только цикл, а строка кода после него выполняется. Сложились 4 и 5; на `-1` цикл прервался до прибавления, а `7` уже не читалась.'
- id: continue-skip
  type: single
  q: |
    Что выведет программа?
    ```python
    i = 0
    while i < 5:
        i += 1
        if i == 3:
            continue
        print(i)
    ```
  options:
  - Числа 1, 2, 4, 5
  - Числа 1 и 2
  - Числа от 1 до 5
  - Числа 1, 2, 4
  answer: 0
  explain: '`continue` пропускает только остаток текущей итерации — `print` для 3. Цикл продолжается с проверки условия, и 4 и 5 печатаются.'
- id: off-by-one-bound
  type: multi
  q: |
    Нужно вывести числа от 1 до 10 включительно, каждое в своей строке. Какие программы делают ровно это? Выберите все.
    ```python
    # A
    i = 1
    while i <= 10:
        print(i)
        i += 1

    # B
    i = 1
    while i < 10:
        print(i)
        i += 1

    # C
    i = 0
    while i < 10:
        i += 1
        print(i)

    # D
    i = 0
    while i <= 10:
        i += 1
        print(i)
    ```
  options:
  - A
  - B
  - C
  - D
  answer:
  - 0
  - 2
  explain: 'Проверьте крайние значения. A печатает 1…10 и выходит на проверке `11 <= 10`. B выходит на `10 < 10` и десятку не печатает. В C число сначала растёт, потом печатается: последняя истинная проверка — `9 < 10`, после неё печатается 10. В D последняя истинная проверка — `10 <= 10`, и тело напечатает лишнее 11.'
- id: continue-before-step
  type: single
  q: |
    Что произойдёт при запуске?
    ```python
    i = 0
    while i < 5:
        if i == 2:
            continue
        print(i)
        i += 1
    ```
  options:
  - Выведутся 0, 1, 3, 4, и программа закончится
  - Выведутся 0 и 1, а потом программа зависнет, больше ничего не печатая
  - Выведутся 0, 1, 2, 3, 4, и программа закончится
  - Без конца будет печататься `2`
  answer: 1
  explain: 'При `i = 2` срабатывает `continue`, и строки кода `print(i)` и `i += 1` пропускаются. `i` навсегда остаётся 2 — каждая итерация снова упирается в `continue` и ничего не печатает. Это бесконечный цикл: после 0 и 1 вывода больше нет, пока программу не прервут.'
- id: break-vs-continue
  type: single
  q: |
    Программу запустили два раза: сначала с `break` в отмеченной строке, потом с `continue`. Что она выведет в первый и во второй раз?
    ```python
    total = 0
    i = 0
    while i < 5:
        i += 1
        if i == 3:
            break  # во второй раз здесь continue
        total += i
    print(total)
    ```
  options:
  - '`3`, затем `12`'
  - '`3`, затем `15`'
  - '`12`, затем `3`'
  - '`3`, затем `3`'
  answer: 0
  explain: 'С `break` цикл кончается на `i = 3` до прибавления — сложились только 1 и 2. С `continue` пропускается лишь прибавление тройки, а цикл не кончается и идёт дальше: 1 + 2 + 4 + 5 = 12. Сумма всех пяти чисел, 15, не получится ни в одном запуске.'
- id: checks-count
  type: single
  q: Тело цикла `while` выполнилось 4 раза, и цикл закончился сам, без `break`. Сколько раз Python проверил его условие?
  options:
  - '4'
  - '5'
  - '1'
  - '8'
  answer: 1
  explain: 'Перед каждой из четырёх итераций условие было истинным, и ещё одна, пятая проверка дала `False` — после неё цикл закончился.'
- id: open-stop-word
  type: open
  q: |
    Программа должна складывать числа, пока не введут слово `стоп`:
    ```python
    total = 0
    line = int(input())
    while line != "стоп":
        total += line
        line = int(input())
    print(total)
    ```
    На вводе `3`, `4`, `стоп` она падает. Какая будет ошибка, в какой строке кода и почему? Как исправить программу?
  rubric:
  - ошибка ValueError в строке кода 5 — int не может превратить слово «стоп» в число; до сравнения со «стоп» слово так и не доходит
  - исправление — читать строку и сравнивать её со «стоп», а в число превращать только после проверки (total += int(line)), или while True с проверкой и break
  wrong_answers:
  - нужно поставить "стоп" без кавычек
  - ошибка в print — total надо превратить в строку
  followups:
  - Что выведет исправленная программа, если первая же строка ввода — «стоп»?
