id: p1c-guess-number
title: Угадай число
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите игру «Угадай число»: загадано 37, программа читает догадки и подсказывает.**

  Догадки — целые числа, по одной в строке. На неверную догадку выведите `Больше`, если загаданное число больше догадки, и `Меньше`, если меньше. На верную — `Угадано! Попыток: N`, где N — число догадок вместе с верной; после неё ввод больше не читайте.

  Пример 1
  ```input
  50
  20
  37
  ```
  ```output
  Меньше
  Больше
  Угадано! Попыток: 3
  ```

  Пример 2
  ```input
  37
  10
  ```
  ```output
  Угадано! Попыток: 1
  ```

  Ограничения: во вводе обязательно есть 37; после неё могут идти лишние строки.
starter: |
  secret = 37
  guess = int(input())
  if guess == secret:
      print("Угадано! Попыток: 1")
stdin: "50\n20\n37\n"
solution: |
  secret = 37
  attempts = 0
  while True:
      guess = int(input())
      attempts += 1
      if guess == secret:
          print(f"Угадано! Попыток: {attempts}")
          break
      if guess < secret:
          print("Больше")
      else:
          print("Меньше")
tests:
  io:
    - name: Пример 1
      stdin: "50\n20\n37\n"
      stdout: "Меньше\nБольше\nУгадано! Попыток: 3"
    - name: Пример 2
      stdin: "37\n10\n"
      stdout: "Угадано! Попыток: 1"
    - name: Рядом с загаданным
      stdin: "36\n38\n37\n"
      stdout: "Больше\nМеньше\nУгадано! Попыток: 3"
      hidden: true
    - name: Лишние строки после верной догадки
      stdin: "40\n37\n10\n90\n"
      stdout: "Меньше\nУгадано! Попыток: 2"
      hidden: true
    - name: Лишняя строка — не число
      stdin: "37\nстоп\n"
      stdout: "Угадано! Попыток: 1"
      hidden: true
    - name: Много попыток
      stdin: "1\n100\n30\n45\n35\n40\n37\n"
      stdout: "Больше\nМеньше\nБольше\nМеньше\nБольше\nМеньше\nУгадано! Попыток: 7"
      hidden: true
hints:
  - level: 1
    text: Сколько будет догадок, заранее неизвестно. Каким циклом читать ввод, пока не случится «угадано»? Какое имя будет считать попытки?
  - level: 2
    text: 'Удобная форма — `while True:`; внутри — прочитать догадку и увеличить счётчик. Как выйти из такого цикла?'
  - level: 3
    text: 'Сначала проверьте совпадение: вывести итог и `break`. Только потом — подсказка `Больше` или `Меньше`.'
