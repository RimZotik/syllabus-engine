id: p1c-guess-number
title: Угадай число
sandbox: python-browser
difficulty: 2
statement: |
  Программа загадала число 37 (оно уже записано в стартовом коде). Пользователь вводит догадки, по одной в строке. На каждую неверную догадку программа отвечает `Больше`, если загаданное число больше догадки, и `Меньше`, если меньше. Когда число угадано, программа выводит `Угадано! Попыток: N`, где N — сколько догадок было введено, включая верную, — и больше ничего не читает.

  Гарантируется, что среди строк ввода есть 37. Строки после верной догадки нужно не читать и не обрабатывать.

  ```input
  50
  20
  37
  ```
  ```
  Меньше
  Больше
  Угадано! Попыток: 3
  ```
starter: |
  secret = 37
  guess = int(input())
  if guess == secret:
      print("Угадано! Попыток: 1")
stdin: "50\n20\n37\n"
solution: |
  secret = 37
  attempts = 0
  while True:
      guess = int(input())
      attempts += 1
      if guess == secret:
          print(f"Угадано! Попыток: {attempts}")
          break
      if guess < secret:
          print("Больше")
      else:
          print("Меньше")
tests:
  io:
    - name: Пример из условия
      stdin: "50\n20\n37\n"
      stdout: "Меньше\nБольше\nУгадано! Попыток: 3"
    - name: С первой попытки
      stdin: "37\n"
      stdout: "Угадано! Попыток: 1"
      hidden: true
    - name: Рядом с загаданным
      stdin: "36\n38\n37\n"
      stdout: "Больше\nМеньше\nУгадано! Попыток: 3"
      hidden: true
    - name: Лишние строки после верной догадки
      stdin: "40\n37\n10\n90\n"
      stdout: "Меньше\nУгадано! Попыток: 2"
      hidden: true
    - name: Много попыток
      stdin: "1\n100\n30\n45\n35\n40\n37\n"
      stdout: "Больше\nМеньше\nБольше\nМеньше\nБольше\nМеньше\nУгадано! Попыток: 7"
      hidden: true
hints:
  - level: 1
    text: Сколько догадок будет, заранее неизвестно. Каким циклом читать ввод, пока не случится событие «угадано»? И какое имя будет считать попытки?
  - level: 2
    text: 'Удобная форма — `while True:` — внутри прочитать догадку, прибавить 1 к счётчику, при совпадении вывести итог и выйти из цикла `break`, иначе вывести подсказку.'
  - level: 3
    text: 'Внутри цикла — `guess = int(input())`, `attempts += 1`, затем `if guess == secret:` с выводом `f"Угадано! Попыток: {attempts}"` и `break`; дальше `if guess < secret: print("Больше")`, иначе `print("Меньше")`.'
