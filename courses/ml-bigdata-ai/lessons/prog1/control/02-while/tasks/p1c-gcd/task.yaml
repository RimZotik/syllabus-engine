id: p1c-gcd
title: Алгоритм Евклида
sandbox: python-browser
difficulty: 3
statement: |
  Наибольший общий делитель (НОД) двух чисел — самое большое число, на которое оба делятся без остатка. НОД 12 и 18 — 6.

  Больше двух тысяч лет назад Евклид описал быстрый способ его найти. Пусть есть два числа a и b. Пока b не равно нулю, повторяйте:

  1. найдите остаток от деления a на b;
  2. a становится равным b;
  3. b становится равным этому остатку.

  Когда b стал нулём, a — это и есть НОД.

  Прочитайте два целых положительных числа, каждое в отдельной строке, и выведите их НОД. Модуль `math` не используйте.

  ```input
  12
  18
  ```
  ```
  6
  ```
starter: |
  a = int(input())
  b = int(input())
  print(a)
stdin: "12\n18\n"
solution: |
  a = int(input())
  b = int(input())
  while b != 0:
      rest = a % b
      a = b
      b = rest
  print(a)
tests:
  forbid: [math, gcd]
  io:
    - name: Пример из условия
      stdin: "12\n18\n"
      stdout: "6"
    - name: Взаимно простые
      stdin: "7\n13\n"
      stdout: "1"
      hidden: true
    - name: Одно делит другое
      stdin: "100\n10\n"
      stdout: "10"
      hidden: true
    - name: Меньшее первым
      stdin: "10\n100\n"
      stdout: "10"
      hidden: true
    - name: Равные числа
      stdin: "5\n5\n"
      stdout: "5"
      hidden: true
    - name: Единицы
      stdin: "1\n1\n"
      stdout: "1"
      hidden: true
    - name: Большие числа
      stdin: "1071\n462\n"
      stdout: "21"
      hidden: true
hints:
  - level: 1
    text: Проследите алгоритм вручную для 12 и 18 — какие значения у a и b после каждого повторения? Сколько повторений понадобилось?
  - level: 2
    text: 'Шаги 2 и 3 меняют оба имени. Если сначала написать `a = b`, старое значение a потеряется, а оно нужно для остатка. Посчитайте остаток заранее и запомните под отдельным именем — как временное имя при обмене значений.'
  - level: 3
    text: 'Цикл `while b != 0:` с телом `rest = a % b`, `a = b`, `b = rest`; после цикла — `print(a)`.'
