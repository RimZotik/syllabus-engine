id: p1c-gcd
title: Алгоритм Евклида
sandbox: python-browser
difficulty: 3
statement: |
  **Найдите наибольший общий делитель (НОД) двух чисел алгоритмом Евклида.**

  Алгоритм: пока b не равно нулю, пара (a, b) заменяется парой (b, остаток от деления a на b). Когда b стало нулём, a — это НОД. Ввод — a и b, каждое в своей строке. Вывод — НОД.

  Пример 1
  ```input
  12
  18
  ```
  ```output
  6
  ```

  Пример 2
  ```input
  7
  13
  ```
  ```output
  1
  ```

  Ограничения: 1 ≤ a, b ≤ 10⁹. Модуль `math` не используйте.
starter: |
  a = int(input())
  b = int(input())
  print(a)
stdin: "12\n18\n"
solution: |
  a = int(input())
  b = int(input())
  while b != 0:
      rest = a % b
      a = b
      b = rest
  print(a)
tests:
  forbid: [math, gcd]
  io:
    - name: Пример 1
      stdin: "12\n18\n"
      stdout: "6"
    - name: Пример 2
      stdin: "7\n13\n"
      stdout: "1"
    - name: Одно делит другое
      stdin: "100\n10\n"
      stdout: "10"
      hidden: true
    - name: Меньшее первым
      stdin: "10\n100\n"
      stdout: "10"
      hidden: true
    - name: Равные числа
      stdin: "5\n5\n"
      stdout: "5"
      hidden: true
    - name: Единицы
      stdin: "1\n1\n"
      stdout: "1"
      hidden: true
    - name: Трёхзначные числа
      stdin: "1071\n462\n"
      stdout: "21"
      hidden: true
    - name: Большие числа
      stdin: "999999937\n999999929\n"
      stdout: "1"
      hidden: true
    - name: Большой общий делитель
      stdin: "600000000\n900000000\n"
      stdout: "300000000"
      hidden: true
hints:
  - level: 1
    text: Проследите алгоритм вручную для 12 и 18 — какие значения у a и b после каждого повторения?
  - level: 2
    text: 'Если сначала написать `a = b`, старое значение a потеряется, а оно нужно для остатка. Посчитайте остаток заранее и запомните под отдельным именем.'
  - level: 3
    text: 'Условие цикла — `b != 0`, в теле три присваивания по шагам алгоритма. Перебирать все делители подряд не годится: для чисел около миллиарда это слишком долго.'
