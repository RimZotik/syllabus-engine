id: p1c-halving
title: Делим пополам
sandbox: python-browser
difficulty: 1
statement: |
  **Посчитайте, сколько раз число нужно разделить нацело на 2, чтобы получилась 1.**

  Ввод — целое число n. Деление — `n // 2`. Вывод — число делений; для n = 1 делить не нужно, ответ 0.

  Пример 1
  ```input
  10
  ```
  ```output
  3
  ```
  10 → 5 → 2 → 1.

  Пример 2
  ```input
  1
  ```
  ```output
  0
  ```

  Ограничения: 1 ≤ n ≤ 10¹⁸.
starter: |
  n = int(input())
  count = 0
  print(count)
stdin: "10\n"
solution: |
  n = int(input())
  count = 0
  while n > 1:
      n = n // 2
      count += 1
  print(count)
tests:
  io:
    - name: Пример 1
      stdin: "10\n"
      stdout: "3"
    - name: Пример 2
      stdin: "1\n"
      stdout: "0"
    - name: Степень двойки
      stdin: "8\n"
      stdout: "3"
      hidden: true
    - name: Двойка
      stdin: "2\n"
      stdout: "1"
      hidden: true
    - name: Три
      stdin: "3\n"
      stdout: "1"
      hidden: true
    - name: Миллион
      stdin: "1000000\n"
      stdout: "19"
      hidden: true
    - name: Очень большое число
      stdin: "1152921504606846975\n"
      stdout: "59"
      hidden: true
hints:
  - level: 1
    text: Сколько раз делить, заранее неизвестно. Какой цикл повторяет действие, пока условие верно? Какое это условие?
  - level: 2
    text: Повторяйте, пока `n > 1`. В теле два действия — разделить `n` и увеличить счётчик.
  - level: 3
    text: 'Проверьте вручную, что для n = 1 тело не выполнится ни разу, а `print(count)` стоит после цикла, без отступа.'
