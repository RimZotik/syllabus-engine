id: p1c-trace-odd
title: Трассировка цикла
sandbox: python-browser
difficulty: 3
statement: |
  Вот программа:
  ```python
  n = int(input())
  total = 0
  k = 1
  while k <= n:
      total += k * 2 - 1
      k += 1
  print(total)
  ```

  1. Проследите её на бумаге для ввода `3`: составьте таблицу — значения `k` и `total` при каждой проверке условия и результат проверки.
  2. Проверьте себя кнопкой «По шагам».
  3. Повторите для `4` и `5` и найдите закономерность: как вывод связан с введённым числом?
  4. Подумайте, что программа выведет для `0` и для отрицательного числа.
  5. Напишите свою программу, которая для любого целого числа на входе выводит ровно то же, что программа выше, — но без цикла: прочитайте число и сразу посчитайте ответ по найденной закономерности.

  ```input
  3
  ```
  ```
  9
  ```
starter: |
  n = int(input())
  print(n)
stdin: "3\n"
solution: |
  n = int(input())
  if n > 0:
      print(n * n)
  else:
      print(0)
tests:
  forbid: [for, while, range, sum]
  io:
    - name: Пример из условия
      stdin: "3\n"
      stdout: "9"
    - name: Четыре
      stdin: "4\n"
      stdout: "16"
      hidden: true
    - name: Единица
      stdin: "1\n"
      stdout: "1"
      hidden: true
    - name: Сто
      stdin: "100\n"
      stdout: "10000"
      hidden: true
    - name: Миллион
      stdin: "1000000\n"
      stdout: "1000000000000"
      hidden: true
    - name: Ноль
      stdin: "0\n"
      stdout: "0"
      hidden: true
    - name: Отрицательное число
      stdin: "-5\n"
      stdout: "0"
      hidden: true
hints:
  - level: 1
    text: 'Какие числа прибавляются к `total` на каждой итерации — при k = 1, 2, 3? Как называются такие числа?'
  - level: 2
    text: 'Сумма первых n нечётных чисел: 1, 1 + 3 = 4, 1 + 3 + 5 = 9… А сколько итераций будет при n = 0 или n = −5? Проверьте условие `k <= n` для k = 1.'
  - level: 3
    text: 'Для положительных n ответ — `n * n`, иначе цикл не выполняется ни разу и выводится `0`. Это одна инструкция `if`–`else`.'
