id: p1c-reverse-number
title: Число задом наперёд
sandbox: python-browser
difficulty: 2
statement: |
  **Выведите число, записанное теми же цифрами в обратном порядке.**

  Ввод — целое неотрицательное число n. Вывод — перевёрнутое число; нули, оказавшиеся впереди, не пишутся.

  Пример 1
  ```input
  1234
  ```
  ```output
  4321
  ```

  Пример 2
  ```input
  1200
  ```
  ```output
  21
  ```

  Ограничения: 0 ≤ n ≤ 10¹⁸. Решите арифметикой — `%` и `//`: строки (`str`, `len`, индексы, срезы) не используйте.
starter: |
  n = int(input())
  result = 0
  print(result)
stdin: "1234\n"
solution: |
  n = int(input())
  result = 0
  while n > 0:
      result = result * 10 + n % 10
      n = n // 10
  print(result)
tests:
  forbid: [str, len, "[]", reversed, for]
  io:
    - name: Пример 1
      stdin: "1234\n"
      stdout: "4321"
    - name: Пример 2
      stdin: "1200\n"
      stdout: "21"
    - name: Ноль
      stdin: "0\n"
      stdout: "0"
      hidden: true
    - name: Одна цифра
      stdin: "7\n"
      stdout: "7"
      hidden: true
    - name: Десять
      stdin: "10\n"
      stdout: "1"
      hidden: true
    - name: Ноль в середине
      stdin: "905\n"
      stdout: "509"
      hidden: true
    - name: Симметричное число
      stdin: "1001\n"
      stdout: "1001"
      hidden: true
    - name: Много нулей в конце
      stdin: "100000\n"
      stdout: "1"
      hidden: true
    - name: Длинное число
      stdin: "123456789012345678\n"
      stdout: "876543210987654321"
      hidden: true
hints:
  - level: 1
    text: 'Последняя цифра числа — `n % 10`, число без неё — `n // 10`. Это вы знаете из темы о числах.'
  - level: 2
    text: 'Как из 43 и цифры 2 получить 432? Так же к `result` дописывается справа каждая новая цифра.'
  - level: 3
    text: 'Цикл идёт, пока у `n` остались цифры. Проследите на бумаге значения `n` и `result` для 1200 и для 0.'
