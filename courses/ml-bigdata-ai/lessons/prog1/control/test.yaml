title: Контрольная раздела «Управление ходом программы»
pass: 0.85
minutes: 30
questions:
- id: s-elif-order
  type: single
  q: |
    Что выведет программа?
    ```python
    speed = 95
    if speed > 60:
        print("штраф")
    elif speed > 90:
        print("большой штраф")
    else:
        print("ок")
    ```
  options:
  - '`большой штраф`'
  - '`штраф`'
  - '`штраф` и `большой штраф`'
  - '`ок`'
  answer: 1
  explain: 'Цепочка останавливается на первом истинном условии — `95 > 60`. До `speed > 90` дело не доходит. Узкое условие нужно было поставить первым.'
- id: s-or-bug
  type: single
  q: |
    Что выведет программа?
    ```python
    city = "Омск"
    if city == "Москва" or "Казань":
        print("столица региона")
    else:
        print("другой город")
    ```
  options:
  - '`другой город`'
  - '`столица региона`'
  - Ошибку `TypeError`
  - Ничего
  answer: 1
  explain: 'Условие читается как `(city == "Москва") or "Казань"`. Левая часть ложна, `or` отдаёт непустую строку `"Казань"`, а она истинна.'
- id: s-input-truthy
  type: single
  q: |
    Ответы пользователя сохранены как строки — так их возвращает `input()`. Что выведет программа?
    ```python
    answers = ["0", "", "нет"]
    filled = 0
    for a in answers:
        if a:
            filled += 1
    print(filled)
    ```
  options:
  - '`1`'
  - '`2`'
  - '`0`'
  - '`3`'
  answer: 1
  explain: 'Ложна только пустая строка. `"0"` и `"нет"` — непустые строки, поэтому истинны: Python не читает смысл текста, он смотрит только, пуст ли он.'
- id: s-while-trace
  type: single
  q: |
    Что выведет программа?
    ```python
    n = 1
    count = 0
    while n < 50:
        n = n * 2
        count += 1
    print(count, n)
    ```
  options:
  - '`6 64`'
  - '`5 32`'
  - '`6 32`'
  - '`7 128`'
  answer: 0
  explain: 'Значения `n` при проверках — 1, 2, 4, 8, 16, 32 (шесть раз меньше 50) и 64. Шесть итераций, после них `n = 64`.'
- id: s-while-checked-once
  type: single
  q: Какое утверждение о цикле `while` верно?
  options:
  - Цикл прерывается в тот же момент, когда условие стало ложным, даже посреди тела
  - Условие проверяется перед каждой итерацией, а тело выполняется до конца
  - Условие проверяется один раз, при входе в цикл
  - Тело выполняется хотя бы один раз, даже если условие сразу ложно
  answer: 1
  explain: Проверка происходит только наверху — перед каждой итерацией. Внутри тела условие может временно стать ложным, цикл этого не заметит. Если условие ложно сразу, тело не выполнится ни разу.
- id: s-break-continue
  type: single
  q: |
    Что выведет программа?
    ```python
    for n in [3, -1, 4, 0, 5]:
        if n < 0:
            continue
        if n == 0:
            break
        print(n)
    print("конец")
    ```
  options:
  - Числа 3 и 4, затем `конец`
  - Только 3, затем `конец`
  - Числа 3, 4 и 5, затем `конец`
  - Числа 3 и 4, без `конец`
  answer: 0
  explain: '`-1` пропущено `continue`, на `0` цикл прерван `break`, поэтому `5` не печатается. `break` завершает только цикл — `конец` выводится.'
- id: s-list-len
  type: single
  q: |
    Что выведет программа?
    ```python
    nums = [7, 3, 9]
    nums.append(nums[0] + nums[-1])
    print(nums, len(nums))
    ```
  options:
  - '`[7, 3, 9, 16] 4`'
  - '`[7, 3, 9, 10] 4`'
  - '`[16, 7, 3, 9] 4`'
  - '`[7, 3, 9] 3`'
  answer: 0
  explain: '`nums[0]` — 7, `nums[-1]` — 9. Сумма 16 дописывается в конец, и элементов становится четыре.'
- id: s-append-none
  type: single
  q: |
    ИИ-ассистент написал программу, которая читает слова до пустой строки:
    ```python
    words = []
    w = input()
    while w != "":
        words = words.append(w)
        w = input()
    print(len(words))
    ```
    На вводе из двух слов и пустой строки она падает со второй итерации. Почему?
  options:
  - '`append` вернул `None`, и `words` больше не указывает на список'
  - Пустую строку нельзя сравнивать через `!=`
  - Список нельзя менять внутри цикла `while`
  - '`len` не работает со списком, созданным как `[]`'
  answer: 0
  explain: '`append` меняет список и возвращает `None`. После первой итерации `words` указывает на `None`, и вызов `words.append` падает. Правильно — `words.append(w)` без присваивания.'
- id: s-range-count
  type: single
  q: Сколько раз выполнится тело цикла `for i in range(3, 10, 3)`?
  options:
  - '`2`'
  - '`3`'
  - '`4`'
  - '`7`'
  answer: 1
  explain: '`range(3, 10, 3)` выдаёт 3, 6 и 9; следующее число 12 уже не меньше 10. Три итерации.'
- id: s-for-rebind
  type: single
  q: |
    Что выведет программа?
    ```python
    prices = [100, 200]
    for p in prices:
        p = p - 10
    for i in range(len(prices)):
        prices[i] = prices[i] * 2
    print(prices)
    ```
  options:
  - '`[180, 380]`'
  - '`[200, 400]`'
  - '`[90, 190]`'
  - '`[100, 200]`'
  answer: 1
  explain: 'Первый цикл перепривязывает только имя `p` — список не меняется. Второй меняет элементы по индексу и удваивает их.'
- id: s-nested
  type: single
  q: |
    Сколько строк выведет программа?
    ```python
    for a in range(1, 4):
        for b in range(a):
            print(a, b)
    ```
  options:
  - '`9`'
  - '`6`'
  - '`3`'
  - '`4`'
  answer: 1
  explain: 'Внутренний цикл делает `a` итераций: при `a` = 1, 2, 3 — это 1, 2 и 3 строки, всего 6.'
- id: s-flag-while
  type: single
  q: |
    Что выведет программа?
    ```python
    attempts = 0
    ok = False
    while attempts < 3 and not ok:
        code = input()
        attempts += 1
        if code == "1234":
            ok = True
    print(ok, attempts)
    ```
    ```input
    0000
    1234
    9999
    ```
  options:
  - '`True 2`'
  - '`True 3`'
  - '`False 3`'
  - '`True 1`'
  answer: 0
  explain: 'На второй попытке флаг стал `True`, и при следующей проверке `not ok` ложно — цикл закончился, третью строку ввода программа не читала.'
- id: s-max-negative
  type: single
  q: |
    Какое начальное значение `best` даёт правильный максимум для **любого** непустого списка чисел `nums`?
    ```python
    best = ???
    for x in nums:
        if x > best:
            best = x
    ```
  options:
  - '`0`'
  - '`nums[0]`'
  - '`-1000`'
  - '`len(nums)`'
  answer: 1
  explain: 'С нулём список из одних отрицательных чисел даст неверный ответ, а `-1000` — список, где все числа ещё меньше. Первый элемент — честный «лучший среди просмотренных» с самого начала.'
- id: s-pattern-choice
  type: single
  q: Нужно узнать, был ли среди заказов хоть один дороже 5000, — без встроенных функций. Какой шаблон подходит лучше всего?
  options:
  - Накопитель — сложить все заказы и сравнить сумму с 5000
  - Флаг `False` до цикла, при первом заказе дороже 5000 — `True` и `break`
  - Цикл `while`, который повторяется, пока заказ дороже 5000
  - Флаг, который на каждом заказе становится `True` или `False` по условию
  answer: 1
  explain: 'Это поиск: ответ «да» ясен при первой находке. Сумма отвечает на другой вопрос, а флаг, который переключается в обе стороны, расскажет только о последнем заказе.'
- id: s-loop-choice
  type: multi
  q: В каких задачах лучше подходит `while`, а не `for`? Выберите все.
  options:
  - Читать строки ввода до слова `стоп`
  - Вывести каждую букву слова
  - Посчитать, через сколько лет вклад вырастет до 1 000 000 рублей
  - Повторить приветствие 5 раз
  answer:
  - 0
  - 2
  explain: '`while` — когда число повторов заранее неизвестно и зависит от условия. Перебрать известную последовательность или повторить известное число раз проще `for`.'
- id: s-open-plan
  type: open
  q: |
    Задача: программа читает слова, по одному в строке, до пустой строки и выводит, сколько среди них слов длиннее 5 букв. Если слов не было, выводит `0`.

    Напишите сначала план в комментариях (что до цикла, что в цикле, что после), а потом код. Встроенные `sum`, `max`, `any` не используйте. Назовите, какой шаблон вы использовали, и проверьте программу вручную на вводе `кот`, `программа`, пустая строка.
  rubric:
  - план в комментариях — до цикла счётчик 0, в цикле читать слово и проверять длину, после цикла вывести
  - чтение до пустой строки циклом while (while True с break или input до цикла и в конце тела)
  - счётчик увеличивается на 1 только при len(слово) > 5; начальное значение 0 стоит до цикла
  - ученик называет шаблон «счётчик» (накопитель) и проверяет пример вручную — ответ 1
  wrong_answers:
  - использует встроенную sum вместо своего счётчика
  - проверяет len(слово) >= 5 — слово из 5 букв засчитывается, а оно не длиннее 5
  - обнуляет счётчик внутри цикла
  followups:
  - Что выведет ваша программа, если первая строка ввода пустая? Почему?
