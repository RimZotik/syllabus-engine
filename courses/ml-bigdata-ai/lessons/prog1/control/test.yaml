title: Контрольная раздела «Управление ходом программы»
pass: 0.85
minutes: 80
questions:
- id: s-if-in-loop
  type: single
  q: |
    Что выведет программа?
    ```python
    scores = [95, 70, 40]
    labels = []
    for s in scores:
        if s >= 90:
            labels.append("A")
        if s >= 60:
            labels.append("B")
        else:
            labels.append("C")
    print(labels)
    ```
  options:
  - "`['A', 'B', 'C']`"
  - "`['A', 'B', 'B', 'C']`"
  - "`['A', 'A', 'B', 'C']`"
  - "`['A', 'B', 'C', 'C']`"
  answer: 1
  explain: 'В теле две независимые инструкции: отдельный `if` и пара `if`–`else`. Для 95 срабатывают обе — `A` и `B`, для 70 только вторая — `B`, для 40 её `else` — `C`. Чтобы на каждую оценку была ровно одна метка, нужна цепочка с `elif`.'
- id: s-text-vs-number
  type: single
  q: |
    Ответы пользователя сохранены как строки — так их возвращает `input()`. Что выведет программа?
    ```python
    answers = ["0", "5", "00"]
    as_text = 0
    as_number = 0
    for a in answers:
        if a:
            as_text += 1
        if int(a):
            as_number += 1
    print(as_text, as_number)
    ```
  options:
  - '`3 1`'
  - '`1 1`'
  - '`3 2`'
  - '`1 3`'
  answer: 0
  explain: 'Все три строки непустые, поэтому в условии истинны — Python не читает смысл текста. После `int` строки `"0"` и `"00"` становятся нулём, а ноль ложен: истинно только число 5.'
- id: s-guard-order
  type: multi
  q: |
    В программе подсчёта слов на букву «с» нужно дописать условие:
    ```python
    words = ["кот", "", "сон"]
    count = 0
    for w in words:
        if ???:
            count += 1
    print(count)
    ```
    С какими условиями программа выведет `1` и не упадёт? Выберите все.
  options:
  - '`w != "" and w[0] == "с"`'
  - '`w[0] == "с" and w != ""`'
  - '`w and w[0] == "с"`'
  - '`w[0] == "с" or w == ""`'
  answer:
  - 0
  - 2
  explain: 'На пустой строке `w[0]` даёт `IndexError`. Проверка «строка не пуста» спасает, только если стоит слева: тогда `and` при ложной левой части правую не вычисляет. Пустая строка в условии ложна, поэтому `w` слева работает так же, как `w != ""`. Если `w[0]` стоит первым, ошибка случится раньше любой проверки — и с `and`, и с `or`.'
- id: s-break-index
  type: single
  q: |
    Что выведет программа?
    ```python
    nums = [4, 7, 10, 13]
    for i in range(len(nums)):
        if nums[i] % 5 == 0:
            break
    print(i, nums[i])
    ```
  options:
  - '`2 10`'
  - '`3 13`'
  - '`10 2`'
  - Ошибку `NameError`
  answer: 0
  explain: 'Цикл перебирает индексы 0, 1, 2. На индексе 2 элемент 10 делится на 5, и `break` прерывает перебор. Переменная цикла после цикла не исчезает и указывает на последнее значение, которое успела получить, — 2.'
- id: s-flag-while
  type: single
  q: |
    Что выведет программа?
    ```python
    attempts = 0
    ok = False
    while attempts < 3 and not ok:
        code = input()
        attempts += 1
        if code == "1234":
            ok = True
    print(ok, attempts)
    ```
    ```input
    0000
    1234
    9999
    ```
  options:
  - '`True 2`'
  - '`True 3`'
  - '`False 3`'
  - '`True 1`'
  answer: 0
  explain: 'На второй попытке флаг стал `True`, и при следующей проверке `not ok` ложно — цикл закончился, третью строку ввода программа не читала.'
- id: s-loop-choice
  type: multi
  q: В каких задачах лучше подходит `while`, а не `for`? Выберите все.
  options:
  - Читать строки ввода до слова `стоп`
  - Вывести каждую букву слова
  - Посчитать, через сколько лет вклад вырастет до 1 000 000 рублей
  - Повторить приветствие 5 раз
  answer:
  - 0
  - 2
  explain: '`while` — когда число повторов заранее неизвестно и зависит от условия. Перебрать известную последовательность или повторить известное число раз проще `for`.'
- id: s-write-long-words
  type: code
  q: |
    **Посчитайте, сколько введено слов длиннее 5 букв.**

    Ввод — слова по одному в строке, в конце — пустая строка. Вывод — число; если слов не было — `0`. Начните с плана в комментариях: что до цикла, что в цикле, что после.

    Пример 1
    ```input
    кот
    программа

    ```
    ```output
    1
    ```

    Ограничения: встроенные `sum`, `max` и `any` не используйте.
  solution: |
    # до цикла: счётчик 0
    # в цикле: читать слово до пустой строки, длиннее 5 — прибавить 1
    # после цикла: вывести счётчик
    count = 0
    word = input()
    while word != "":
        if len(word) > 5:
            count += 1
        word = input()
    print(count)
  tests:
    forbid: [sum, max, any]
    io:
    - name: Короткое и длинное слово
      stdin: "кот\nпрограмма\n\n"
      stdout: "1"
    - name: Слов нет
      stdin: "\n"
      stdout: "0"
      hidden: true
    - name: Ровно 5 букв и 6 букв
      stdin: "пятак\nшестой\n\n"
      stdout: "1"
      hidden: true
    - name: Все слова длинные
      stdin: "молоко\nкапуста\nкартошка\n\n"
      stdout: "3"
      hidden: true
  explain: |
    Сколько будет слов, заранее неизвестно — читаем циклом `while` до пустой строки. Это шаблон «счётчик»: 0 до цикла, `+1` при `len(word) > 5`, вывод после цикла. Слово из пяти букв не длиннее пяти, поэтому сравнение строгое. Если обнулять счётчик внутри цикла, он покажет только последнее слово.
- id: s-pattern-choice
  type: code
  q: |
    **Выведите сумму заказов за день и номер первого заказа дороже 5000 рублей.**

    Ввод — суммы заказов по одной в строке, в конце — пустая строка. Вывод — две строки: `Всего: S` и `Первый крупный: N` (номер с 1) или `Первый крупный: нет`.

    Пример 1
    ```input
    1200
    7000
    300
    9000

    ```
    ```output
    Всего: 17500
    Первый крупный: 2
    ```
  solution: |
    total = 0
    number = 0
    first = 0
    line = input()
    while line != "":
        number += 1
        order = int(line)
        total += order
        if order > 5000 and first == 0:
            first = number
        line = input()
    print("Всего:", total)
    if first:
        print("Первый крупный:", first)
    else:
        print("Первый крупный: нет")
  tests:
    io:
    - name: Два крупных заказа
      stdin: "1200\n7000\n300\n9000\n\n"
      stdout: "Всего: 17500\nПервый крупный: 2"
    - name: Заказов нет
      stdin: "\n"
      stdout: "Всего: 0\nПервый крупный: нет"
      hidden: true
    - name: Ровно 5000 — не крупный
      stdin: "5000\n5001\n\n"
      stdout: "Всего: 10001\nПервый крупный: 2"
      hidden: true
    - name: Крупных нет
      stdin: "100\n200\n\n"
      stdout: "Всего: 300\nПервый крупный: нет"
      hidden: true
    - name: Крупный первым
      stdin: "6000\n6000\n\n"
      stdout: "Всего: 12000\nПервый крупный: 1"
      hidden: true
  explain: |
    Здесь два шаблона в одном цикле: накопитель для суммы и поиск первого. Поиск обычно заканчивают `break`, но здесь нельзя — сумме нужны все заказы. Поэтому номер запоминают, только пока он ещё не найден: `first == 0`. Без этой проверки `first` укажет на последний крупный заказ. Номер заказа считает отдельный счётчик.
- id: s-while-digits
  type: code
  q: |
    **Выведите контрольную цифру числа.**

    Складываются все цифры числа; если в сумме больше одной цифры, складываются её цифры — и так, пока не останется одна цифра. Ввод — целое неотрицательное число.

    Пример 1
    ```input
    9875
    ```
    ```output
    2
    ```
    9 + 8 + 7 + 5 = 29, 2 + 9 = 11, 1 + 1 = 2.
  starter: |
    n = int(input())
  solution: |
    n = int(input())
    while n >= 10:
        s = 0
        while n > 0:
            s += n % 10
            n = n // 10
        n = s
    print(n)
  tests:
    io:
    - name: "9875"
      stdin: "9875\n"
      stdout: "2"
    - name: Ноль
      stdin: "0\n"
      stdout: "0"
      hidden: true
    - name: Одна цифра
      stdin: "7\n"
      stdout: "7"
      hidden: true
    - name: "10"
      stdin: "10\n"
      stdout: "1"
      hidden: true
    - name: Сумма снова двузначная
      stdin: "19\n"
      stdout: "1"
      hidden: true
    - name: Восемь девяток
      stdin: "99999999\n"
      stdout: "9"
      hidden: true
  explain: |
    Циклов два. Внутренний складывает цифры: `n % 10` — последняя цифра, `n // 10` её отбрасывает. Внешний повторяет сложение, пока число не меньше 10, — сколько раз, заранее неизвестно. Сумму `s` обнуляют перед каждым проходом, иначе она накопит цифры прошлых сумм. Для 19 одного прохода мало: получится 10, и нужен ещё один.
- id: s-fix-two-bugs
  type: code
  q: |
    **Найдите и исправьте две ошибки в программе для журнала.**

    Ввод — баллы за контрольную от 0 до 100 через пробел, хотя бы один. Вывод — оценки в одну строку через пробел (от 85 — `5`, от 70 — `4`, от 50 — `3`, ниже — `2`), следующей строкой — `Двоек: N`. Программу написал ИИ-ассистент.

    Пример 1
    ```input
    90 75 55 30
    ```
    ```output
    5 4 3 2
    Двоек: 1
    ```
  starter: |
    scores = input().split()
    for s in scores:
        twos = 0
        s = int(s)
        if s >= 50:
            print(3, end=" ")
        elif s >= 70:
            print(4, end=" ")
        elif s >= 85:
            print(5, end=" ")
        else:
            print(2, end=" ")
            twos += 1
    print()
    print("Двоек:", twos)
  solution: |
    scores = input().split()
    twos = 0
    for s in scores:
        s = int(s)
        if s >= 85:
            print(5, end=" ")
        elif s >= 70:
            print(4, end=" ")
        elif s >= 50:
            print(3, end=" ")
        else:
            print(2, end=" ")
            twos += 1
    print()
    print("Двоек:", twos)
  tests:
    io:
    - name: Все четыре оценки
      stdin: "90 75 55 30\n"
      stdout: "5 4 3 2\nДвоек: 1"
    - name: Двойки в начале
      stdin: "40 10 85\n"
      stdout: "2 2 5\nДвоек: 2"
      hidden: true
    - name: Границы оценок
      stdin: "70 69 50 49\n"
      stdout: "4 3 3 2\nДвоек: 1"
      hidden: true
    - name: Один балл
      stdin: "100\n"
      stdout: "5\nДвоек: 0"
      hidden: true
    - name: 84 и 85
      stdin: "84 85\n"
      stdout: "4 5\nДвоек: 0"
      hidden: true
  explain: |
    Первая ошибка — в порядке проверок. Цепочка останавливается на первом истинном условии, а `s >= 50` истинно и для 90: до `s >= 70` и `s >= 85` дело не доходит. Пороги проверяют от большего к меньшему. Вторая — счётчик двоек обнуляется в начале каждой итерации и помнит только последний балл. Начальное значение накопителя ставят до цикла.
- id: s-extend-below-average
  type: code
  q: |
    **Допишите программу: второй строкой выведите, у кого оценка ниже среднего.**

    Ввод — строки `имя оценка`, в конце — пустая строка. Программа уже выводит `Средний балл: X`. Добавьте строку `Ниже среднего: ` с именами через запятую с пробелом в порядке ввода, а если таких нет — `Ниже среднего: никого`. Если не введено ни одной строки, выведите только `Нет данных`.

    Пример 1
    ```input
    Аня 5
    Борис 3
    Вера 4

    ```
    ```output
    Средний балл: 4.0
    Ниже среднего: Борис
    ```
  starter: |
    names = []
    marks = []
    line = input()
    while line != "":
        parts = line.split()
        names.append(parts[0])
        marks.append(int(parts[1]))
        line = input()
    total = 0
    for m in marks:
        total += m
    print("Средний балл:", round(total / len(marks), 1))
  solution: |
    names = []
    marks = []
    line = input()
    while line != "":
        parts = line.split()
        names.append(parts[0])
        marks.append(int(parts[1]))
        line = input()
    if marks:
        total = 0
        for m in marks:
            total += m
        average = total / len(marks)
        print("Средний балл:", round(average, 1))
        below = []
        for i in range(len(marks)):
            if marks[i] < average:
                below.append(names[i])
        if below:
            print("Ниже среднего:", ", ".join(below))
        else:
            print("Ниже среднего: никого")
    else:
        print("Нет данных")
  tests:
    io:
    - name: Три ученика
      stdin: "Аня 5\nБорис 3\nВера 4\n\n"
      stdout: "Средний балл: 4.0\nНиже среднего: Борис"
    - name: Нет данных
      stdin: "\n"
      stdout: "Нет данных"
      hidden: true
    - name: У всех одинаково
      stdin: "Оля 5\nПетя 5\n\n"
      stdout: "Средний балл: 5.0\nНиже среднего: никого"
      hidden: true
    - name: Двое ниже среднего
      stdin: "Аня 2\nБорис 3\nВера 5\nГлеб 5\n\n"
      stdout: "Средний балл: 3.8\nНиже среднего: Аня, Борис"
      hidden: true
    - name: Один ученик
      stdin: "Дима 4\n\n"
      stdout: "Средний балл: 4.0\nНиже среднего: никого"
      hidden: true
  explain: |
    Сначала разберитесь в готовом коде: имена и оценки собраны в два списка, и у одного ученика в обоих один и тот же индекс. Поэтому второй проход перебирает индексы — `range(len(marks))` — и по индексу `i` берёт и оценку, и имя. Среднее известно только после первого прохода, значит, отбирать учеников приходится вторым. На пустом вводе `total / len(marks)` — деление на ноль, поэтому пустой список проверяют до всего остального.
- id: s-fix-gift-card
  type: code
  q: |
    **Исправьте программу: она ищет два разных товара, которые вместе стоят ровно столько, сколько на подарочной карте.**

    Первая строка ввода — цены товаров через пробел, вторая — сумма на карте. Вывод — номера двух товаров (с 1, первый меньше второго) через пробел, и больше ничего. Если пар несколько — та, у которой первый номер меньше, а при равных первых — второй. Если пары нет — `нет`. Ошибок в программе больше одной.

    Пример 1
    ```input
    300 200 500 100
    600
    ```
    ```output
    3 4
    ```
  starter: |
    prices = input().split()
    card = int(input())
    found = False
    for i in range(len(prices)):
        for j in range(len(prices)):
            if int(prices[i]) + int(prices[j]) == card:
                print(i + 1, j + 1)
                found = True
                break
    if not found:
        print("нет")
  solution: |
    prices = input().split()
    card = int(input())
    found = False
    for i in range(len(prices)):
        for j in range(i + 1, len(prices)):
            if int(prices[i]) + int(prices[j]) == card:
                print(i + 1, j + 1)
                found = True
                break
        if found:
            break
    if not found:
        print("нет")
  tests:
    io:
    - name: Подходит только третий и четвёртый
      stdin: "300 200 500 100\n600\n"
      stdout: "3 4"
    - name: Несколько подходящих пар
      stdin: "100 500 100 500\n600\n"
      stdout: "1 2"
      hidden: true
    - name: Товар не берут дважды
      stdin: "250 400\n500\n"
      stdout: "нет"
      hidden: true
    - name: Два товара
      stdin: "50 70\n120\n"
      stdout: "1 2"
      hidden: true
    - name: Одинаковые цены
      stdin: "80 300 300\n600\n"
      stdout: "2 3"
      hidden: true
    - name: Пары нет
      stdin: "100 200 300\n1000\n"
      stdout: "нет"
      hidden: true
    - name: Пары нет, но цена — половина карты
      stdin: "100 300 700\n600\n"
      stdout: "нет"
      hidden: true
  explain: |
    Ошибок две. Внутренний цикл начинается с нуля, поэтому товар складывается сам с собой: для `250 400` и карты 500 программа находит «пару» `1 1`. Второй номер должен быть больше первого — `range(i + 1, len(prices))`; заодно пропадают пары наоборот, вроде `2 1`. Вторая — `break` стоит во внутреннем цикле и прерывает только его: внешний цикл идёт дальше и печатает следующие пары. Чтобы закончить оба цикла, после внутреннего проверяют флаг `found` и выходят вторым `break`.
- id: s-write-runs
  type: code
  q: |
    **Сожмите строку: замените каждую серию одинаковых символов подряд самим символом и длиной серии.**

    Ввод — строка. Вывод — сжатая строка; для пустой строки — пустая строка.

    Пример 1
    ```input
    ааабвв
    ```
    ```output
    а3б1в2
    ```

    Пример 2
    ```input
    ааббаа
    ```
    ```output
    а2б2а2
    ```
  starter: |
    text = input()
  solution: |
    text = input()
    result = ""
    count = 0
    for i in range(len(text)):
        count += 1
        if i == len(text) - 1 or text[i] != text[i + 1]:
            result += text[i] + str(count)
            count = 0
    print(result)
  tests:
    io:
    - name: Три серии
      stdin: "ааабвв\n"
      stdout: "а3б1в2"
    - name: Буква возвращается
      stdin: "ааббаа\n"
      stdout: "а2б2а2"
    - name: Пустая строка
      stdin: "\n"
      stdout: ""
      hidden: true
    - name: Один символ
      stdin: "я\n"
      stdout: "я1"
      hidden: true
    - name: Без повторов
      stdin: "абв\n"
      stdout: "а1б1в1"
      hidden: true
    - name: Длинная серия
      stdin: "ззззззззззззз\n"
      stdout: "з13"
      hidden: true
    - name: Большая и маленькая буква
      stdin: "Аа\n"
      stdout: "А1а1"
      hidden: true
  explain: |
    Это счётчик, который обнуляется, — как длина серии: на каждом символе прибавляем 1, а когда серия кончается, дописываем к ответу символ и длину и начинаем заново. Серия кончается, если следующий символ другой или текущий — последний; проверка `i == len(text) - 1` стоит слева от `or`, поэтому `text[i + 1]` за концом строки не вычисляется. Считать, сколько раз буква встречается во всём тексте, нельзя: в `ааббаа` у буквы `а` две разные серии.
