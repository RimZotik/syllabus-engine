title: Контрольная раздела «Управление ходом программы»
pass: 0.85
minutes: 30
questions:
- id: s-if-in-loop
  type: single
  q: |
    Что выведет программа?
    ```python
    scores = [95, 70, 40]
    labels = []
    for s in scores:
        if s >= 90:
            labels.append("A")
        if s >= 60:
            labels.append("B")
        else:
            labels.append("C")
    print(labels)
    ```
  options:
  - "`['A', 'B', 'C']`"
  - "`['A', 'B', 'B', 'C']`"
  - "`['A', 'A', 'B', 'C']`"
  - "`['A', 'B', 'C', 'C']`"
  answer: 1
  explain: 'В теле две независимые инструкции: отдельный `if` и пара `if`–`else`. Для 95 срабатывают обе — `A` и `B`, для 70 только вторая — `B`, для 40 её `else` — `C`. Чтобы на каждую оценку была ровно одна метка, нужна цепочка с `elif`.'
- id: s-text-vs-number
  type: single
  q: |
    Ответы пользователя сохранены как строки — так их возвращает `input()`. Что выведет программа?
    ```python
    answers = ["0", "5", "00"]
    as_text = 0
    as_number = 0
    for a in answers:
        if a:
            as_text += 1
        if int(a):
            as_number += 1
    print(as_text, as_number)
    ```
  options:
  - '`3 1`'
  - '`1 1`'
  - '`3 2`'
  - '`1 3`'
  answer: 0
  explain: 'Все три строки непустые, поэтому в условии истинны — Python не читает смысл текста. После `int` строки `"0"` и `"00"` становятся нулём, а ноль ложен: истинно только число 5.'
- id: s-while-digits
  type: single
  q: |
    Что выведет программа?
    ```python
    n = 507
    digits = []
    while n > 0:
        digits.append(n % 10)
        n = n // 10
    print(digits)
    ```
  options:
  - '`[5, 0, 7]`'
  - '`[7, 0, 5]`'
  - '`[7, 5]`'
  - '`[7, 0, 5, 0]`'
  answer: 1
  explain: '`n % 10` — последняя цифра, `n // 10` её отбрасывает. Значения `n` при проверках: 507, 50, 5, 0. Цифры дописываются в конец в порядке получения — с конца числа: 7, 0, 5. Ноль в середине цикл не останавливает: проверяется `n`, а 50 больше нуля.'
- id: s-guard-order
  type: multi
  q: |
    В программе подсчёта слов на букву «с» нужно дописать условие:
    ```python
    words = ["кот", "", "сон"]
    count = 0
    for w in words:
        if ???:
            count += 1
    print(count)
    ```
    С какими условиями программа выведет `1` и не упадёт? Выберите все.
  options:
  - '`w != "" and w[0] == "с"`'
  - '`w[0] == "с" and w != ""`'
  - '`w and w[0] == "с"`'
  - '`w[0] == "с" or w == ""`'
  answer:
  - 0
  - 2
  explain: 'На пустой строке `w[0]` даёт `IndexError`. Проверка «строка не пуста» спасает, только если стоит слева: тогда `and` при ложной левой части правую не вычисляет. Пустая строка в условии ложна, поэтому `w` слева работает так же, как `w != ""`. Если `w[0]` стоит первым, ошибка случится раньше любой проверки — и с `and`, и с `or`.'
- id: s-break-continue
  type: single
  q: |
    Что выведет программа?
    ```python
    for n in [3, -1, 4, 0, 5]:
        if n < 0:
            continue
        if n == 0:
            break
        print(n)
    print("конец")
    ```
  options:
  - Числа 3 и 4, затем `конец`
  - Только 3, затем `конец`
  - Числа 3, 4 и 5, затем `конец`
  - Числа 3 и 4, без `конец`
  answer: 0
  explain: '`-1` пропущено `continue`, на `0` цикл прерван `break`, поэтому `5` не печатается. `break` завершает только цикл — `конец` выводится.'
- id: s-break-index
  type: single
  q: |
    Что выведет программа?
    ```python
    nums = [4, 7, 10, 13]
    for i in range(len(nums)):
        if nums[i] % 5 == 0:
            break
    print(i, nums[i])
    ```
  options:
  - '`2 10`'
  - '`3 13`'
  - '`10 2`'
  - Ошибку `NameError`
  answer: 0
  explain: 'Цикл перебирает индексы 0, 1, 2. На индексе 2 элемент 10 делится на 5, и `break` прерывает перебор. Переменная цикла после цикла не исчезает и указывает на последнее значение, которое успела получить, — 2.'
- id: s-nested
  type: single
  q: |
    Сколько строк выведет программа?
    ```python
    for a in range(1, 4):
        for b in range(a):
            print(a, b)
    ```
  options:
  - '`9`'
  - '`6`'
  - '`3`'
  - '`4`'
  answer: 1
  explain: 'Внутренний цикл делает `a` итераций: при `a` = 1, 2, 3 — это 1, 2 и 3 строки, всего 6.'
- id: s-read-spread
  type: single
  q: |
    Программа читает числа до пустой строки. Что она выведет на вводе `5`, `-2`, `3`, пустая строка — и на вводе из одной пустой строки?
    ```python
    nums = []
    line = input()
    while line != "":
        nums.append(int(line))
        line = input()
    if nums:
        print(max(nums) - min(nums))
    else:
        print("нет данных")
    ```
  options:
  - '`7` и `нет данных`'
  - '`7` и ошибку `ValueError`'
  - '`3` и `нет данных`'
  - '`7` и `0`'
  answer: 0
  explain: 'Наибольшее 5, наименьшее −2, разница 7. На пустом вводе тело цикла не выполнится ни разу, список останется пустым, а пустой список в условии ложен — до `max` дело не дойдёт, и сработает ветвь `else`.'
- id: s-flag-while
  type: single
  q: |
    Что выведет программа?
    ```python
    attempts = 0
    ok = False
    while attempts < 3 and not ok:
        code = input()
        attempts += 1
        if code == "1234":
            ok = True
    print(ok, attempts)
    ```
    ```input
    0000
    1234
    9999
    ```
  options:
  - '`True 2`'
  - '`True 3`'
  - '`False 3`'
  - '`True 1`'
  answer: 0
  explain: 'На второй попытке флаг стал `True`, и при следующей проверке `not ok` ложно — цикл закончился, третью строку ввода программа не читала.'
- id: s-pattern-choice
  type: single
  q: Нужно узнать, был ли среди заказов хоть один дороже 5000, — без встроенных функций. Какой шаблон подходит лучше всего?
  options:
  - Накопитель — сложить все заказы и сравнить сумму с 5000
  - Флаг `False` до цикла, при первом заказе дороже 5000 — `True` и `break`
  - Цикл `while`, который повторяется, пока заказ дороже 5000
  - Флаг, который на каждом заказе становится `True` или `False` по условию
  answer: 1
  explain: 'Это поиск: ответ «да» ясен при первой находке. Сумма отвечает на другой вопрос, а флаг, который переключается в обе стороны, расскажет только о последнем заказе.'
- id: s-loop-choice
  type: multi
  q: В каких задачах лучше подходит `while`, а не `for`? Выберите все.
  options:
  - Читать строки ввода до слова `стоп`
  - Вывести каждую букву слова
  - Посчитать, через сколько лет вклад вырастет до 1 000 000 рублей
  - Повторить приветствие 5 раз
  answer:
  - 0
  - 2
  explain: '`while` — когда число повторов заранее неизвестно и зависит от условия. Перебрать известную последовательность или повторить известное число раз проще `for`.'
- id: s-open-plan
  type: open
  q: |
    Задача: программа читает слова, по одному в строке, до пустой строки и выводит, сколько среди них слов длиннее 5 букв. Если слов не было, выводит `0`.

    Напишите сначала план в комментариях (что до цикла, что в цикле, что после), а потом код. Встроенные `sum`, `max`, `any` не используйте. Назовите, какой шаблон вы использовали, и проверьте программу вручную на вводе `кот`, `программа`, пустая строка.
  rubric:
  - план в комментариях — до цикла счётчик 0, в цикле читать слово и проверять длину, после цикла вывести
  - чтение до пустой строки циклом while (while True с break или input до цикла и в конце тела)
  - счётчик увеличивается на 1 только при len(слово) > 5; начальное значение 0 стоит до цикла
  - ученик называет шаблон «счётчик» (накопитель) и проверяет пример вручную — ответ 1
  wrong_answers:
  - использует встроенную sum вместо своего счётчика
  - проверяет len(слово) >= 5 — слово из 5 букв засчитывается, а оно не длиннее 5
  - обнуляет счётчик внутри цикла
  followups:
  - Что выведет ваша программа, если первая строка ввода пустая? Почему?
