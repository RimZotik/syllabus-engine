id: p1c-vowels
title: Сколько гласных
sandbox: python-browser
difficulty: 1
statement: |
  **Посчитайте, сколько в строке русских гласных букв.**

  Гласные — а, е, ё, и, о, у, ы, э, ю, я, и строчные, и заглавные; остальные символы, включая латиницу, не считаются. Вывод — одно число. Стартовый код ошибается на части строк — найдите где и исправьте.

  Пример 1
  ```input
  Привет, мир!
  ```
  ```output
  3
  ```

  Пример 2
  ```input
  Ёжик
  ```
  ```output
  2
  ```
starter: |
  text = input()
  vowels = 0
  for ch in text:
      if ch in "аеиоуыэюя":
          vowels += 1
  print(vowels)
stdin: "Привет, мир!\n"
solution: |
  text = input()
  vowels = 0
  for ch in text.lower():
      if ch in "аеёиоуыэюя":
          vowels += 1
  print(vowels)
tests:
  io:
    - name: Пример 1
      stdin: "Привет, мир!\n"
      stdout: "3"
    - name: Пример 2
      stdin: "Ёжик\n"
      stdout: "2"
    - name: Большие буквы
      stdin: "АИСТ\n"
      stdout: "2"
      hidden: true
    - name: Буква ё внутри
      stdin: "Ёжик ест ёлку\n"
      stdout: "5"
      hidden: true
    - name: Пустая строка
      stdin: "\n"
      stdout: "0"
      hidden: true
    - name: Латиница не считается
      stdin: "Python and Java\n"
      stdout: "0"
      hidden: true
    - name: Одни гласные
      stdin: "аУЕЮЭЫ\n"
      stdout: "6"
      hidden: true
hints:
  - level: 1
    text: Что стартовый код выведет для `АИСТ`? А для `ёж`?
  - level: 2
    text: В строке гласных нет `ё`, и в ней только маленькие буквы.
  - level: 3
    text: Большие буквы можно не перечислять — перебирайте символы строки, приведённой к нижнему регистру.
