id: p1c-range-sum
title: Сумма чисел от a до b
sandbox: python-browser
difficulty: 2
statement: |
  **Выведите сумму всех целых чисел от a до b включительно.**

  Ввод — a и b, каждое в своей строке. Если a больше b, таких чисел нет — выведите `0`.

  Пример 1
  ```input
  3
  6
  ```
  ```output
  18
  ```

  Пример 2
  ```input
  7
  2
  ```
  ```output
  0
  ```

  Ограничения: −10⁶ ≤ a, b ≤ 10⁶. Сложите числа циклом `for`, встроенную `sum` не используйте.
starter: |
  a = int(input())
  b = int(input())
  total = 0
  print(total)
stdin: "3\n6\n"
solution: |
  a = int(input())
  b = int(input())
  total = 0
  for x in range(a, b + 1):
      total += x
  print(total)
tests:
  forbid: [sum]
  io:
    - name: Пример 1
      stdin: "3\n6\n"
      stdout: "18"
    - name: Пример 2
      stdin: "7\n2\n"
      stdout: "0"
    - name: Одно число
      stdin: "5\n5\n"
      stdout: "5"
      hidden: true
    - name: Через ноль
      stdin: "-3\n2\n"
      stdout: "-3"
      hidden: true
    - name: От 1 до 100
      stdin: "1\n100\n"
      stdout: "5050"
      hidden: true
    - name: Только отрицательные
      stdin: "-5\n-1\n"
      stdout: "-15"
      hidden: true
    - name: Соседние числа наоборот
      stdin: "4\n3\n"
      stdout: "0"
      hidden: true
hints:
  - level: 1
    text: Какие числа выдаёт `range(3, 6)`? Есть ли среди них 6?
  - level: 2
    text: Нужен накопитель — начальное значение до цикла, прибавление в теле.
  - level: 3
    text: 'Что выдаст `range(a, b + 1)`, если a больше b? Нужна ли тогда отдельная проверка?'
