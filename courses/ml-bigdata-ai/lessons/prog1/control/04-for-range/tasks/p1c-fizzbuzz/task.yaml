id: p1c-fizzbuzz
title: FizzBuzz
sandbox: python-browser
difficulty: 2
statement: |
  Классическая задача с собеседований. Прочитайте целое число n и выведите числа от 1 до n включительно, каждое в своей строке вывода, но:

  - вместо чисел, которые делятся на 3, выведите `Fizz`;
  - вместо чисел, которые делятся на 5, — `Buzz`;
  - вместо чисел, которые делятся и на 3, и на 5, — `FizzBuzz`.

  Если n меньше 1, программа ничего не выводит.

  ```input
  5
  ```
  ```
  1
  2
  Fizz
  4
  Buzz
  ```
starter: |
  n = int(input())
  for i in range(1, n):
      print(i)
stdin: "5\n"
solution: |
  n = int(input())
  for i in range(1, n + 1):
      if i % 15 == 0:
          print("FizzBuzz")
      elif i % 3 == 0:
          print("Fizz")
      elif i % 5 == 0:
          print("Buzz")
      else:
          print(i)
tests:
  io:
    - name: Пример из условия
      stdin: "5\n"
      stdout: "1\n2\nFizz\n4\nBuzz"
    - name: До пятнадцати
      stdin: "15\n"
      stdout: "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz"
      hidden: true
    - name: Одно число
      stdin: "1\n"
      stdout: "1"
      hidden: true
    - name: Ноль
      stdin: "0\n"
      stdout: ""
      hidden: true
    - name: Дважды FizzBuzz
      stdin: "31\n"
      stdout: "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n16\n17\nFizz\n19\nBuzz\nFizz\n22\n23\nFizz\nBuzz\n26\nFizz\n28\n29\nFizzBuzz\n31"
      hidden: true
    - name: Отрицательное n
      stdin: "-3\n"
      stdout: ""
      hidden: true
    - name: После FizzBuzz
      stdin: "16\n"
      stdout: "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n16"
      hidden: true
hints:
  - level: 1
    text: Какие числа выдаёт `range(1, n)` для n = 5? Входит ли в них само n?
  - level: 2
    text: Для каждого числа нужен выбор одного варианта из четырёх — это цепочка `if`–`elif`–`else`. Какое условие должно стоять первым, чтобы 15 не стало просто `Fizz`?
  - level: 3
    text: '`for i in range(1, n + 1):`, первой проверкой — `if i % 15 == 0:` (делится и на 3, и на 5), затем `elif i % 3 == 0:`, `elif i % 5 == 0:`, `else: print(i)`.'
