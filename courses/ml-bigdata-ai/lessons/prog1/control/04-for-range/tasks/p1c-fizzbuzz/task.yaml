id: p1c-fizzbuzz
title: FizzBuzz
sandbox: python-browser
difficulty: 2
statement: |
  **Выведите числа от 1 до n, заменив кратные 3 на `Fizz`, кратные 5 — на `Buzz`, кратные и 3, и 5 — на `FizzBuzz`.**

  Каждое значение — в своей строке. Если n меньше 1, ничего не выводите.

  Пример 1
  ```input
  5
  ```
  ```output
  1
  2
  Fizz
  4
  Buzz
  ```

  Пример 2
  ```input
  0
  ```
  ```output
  ```

  Ограничения: −10 ≤ n ≤ 1000.
starter: |
  n = int(input())
  for i in range(1, n):
      print(i)
stdin: "5\n"
solution: |
  n = int(input())
  for i in range(1, n + 1):
      if i % 15 == 0:
          print("FizzBuzz")
      elif i % 3 == 0:
          print("Fizz")
      elif i % 5 == 0:
          print("Buzz")
      else:
          print(i)
tests:
  io:
    - name: Пример 1
      stdin: "5\n"
      stdout: "1\n2\nFizz\n4\nBuzz"
    - name: Пример 2
      stdin: "0\n"
      stdout: ""
    - name: До пятнадцати
      stdin: "15\n"
      stdout: "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz"
      hidden: true
    - name: Одно число
      stdin: "1\n"
      stdout: "1"
      hidden: true
    - name: Дважды FizzBuzz
      stdin: "31\n"
      stdout: "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n16\n17\nFizz\n19\nBuzz\nFizz\n22\n23\nFizz\nBuzz\n26\nFizz\n28\n29\nFizzBuzz\n31"
      hidden: true
    - name: Отрицательное n
      stdin: "-3\n"
      stdout: ""
      hidden: true
    - name: После FizzBuzz
      stdin: "16\n"
      stdout: "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n16"
      hidden: true
hints:
  - level: 1
    text: Какие числа выдаёт `range(1, n)` для n = 5? Входит ли в них само n?
  - level: 2
    text: Для каждого числа выбирается один вариант из четырёх — это цепочка `if`–`elif`–`else`.
  - level: 3
    text: 'Какое условие должно стоять первым, чтобы 15 не превратилось просто в `Fizz`?'
