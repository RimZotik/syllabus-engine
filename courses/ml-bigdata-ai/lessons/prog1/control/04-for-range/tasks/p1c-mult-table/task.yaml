id: p1c-mult-table
title: Таблица умножения
sandbox: python-browser
difficulty: 3
statement: |
  **Выведите таблицу умножения n × n.**

  Ввод — целое число n. Вывод — n строк: в строке с номером i — произведения i · 1, i · 2, …, i · n через пробел.

  Пример 1
  ```input
  3
  ```
  ```output
  1 2 3
  2 4 6
  3 6 9
  ```

  Пример 2
  ```input
  1
  ```
  ```output
  1
  ```

  Ограничения: 1 ≤ n ≤ 20.
starter: |
  n = int(input())
stdin: "3\n"
solution: |
  n = int(input())
  for i in range(1, n + 1):
      row = []
      for j in range(1, n + 1):
          row.append(i * j)
      print(*row)
tests:
  io:
    - name: Пример 1
      stdin: "3\n"
      stdout: "1 2 3\n2 4 6\n3 6 9"
    - name: Пример 2
      stdin: "1\n"
      stdout: "1"
    - name: Два
      stdin: "2\n"
      stdout: "1 2\n2 4"
      hidden: true
    - name: Пять
      stdin: "5\n"
      stdout: "1 2 3 4 5\n2 4 6 8 10\n3 6 9 12 15\n4 8 12 16 20\n5 10 15 20 25"
      hidden: true
    - name: Девять
      stdin: "9\n"
      stdout: "1 2 3 4 5 6 7 8 9\n2 4 6 8 10 12 14 16 18\n3 6 9 12 15 18 21 24 27\n4 8 12 16 20 24 28 32 36\n5 10 15 20 25 30 35 40 45\n6 12 18 24 30 36 42 48 54\n7 14 21 28 35 42 49 56 63\n8 16 24 32 40 48 56 64 72\n9 18 27 36 45 54 63 72 81"
      hidden: true
hints:
  - level: 1
    text: Нужны два цикла — один перебирает строки, другой числа в строке. Какой из них внутри?
  - level: 2
    text: 'Строку удобно собрать в список и вывести `print(*row)`. Где создавать пустой список — до внешнего цикла или в начале каждой его итерации?'
  - level: 3
    text: 'Оба цикла идут от 1 до n включительно — вспомните, где кончается `range`. Число в клетке — произведение двух переменных цикла.'
