title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: range-step
  type: single
  q: |
    Что выведет программа?
    ```python
    print(list(range(2, 8, 2)))
    ```
  options:
  - '`[2, 4, 6]`'
  - '`[2, 4, 6, 8]`'
  - '`[4, 6, 8]`'
  - '`[2, 3, 4, 5, 6, 7]`'
  answer: 0
  explain: 'От 2 с шагом 2, пока не дойдёт до 8: 2, 4, 6. Конец диапазона не включается.'
- id: range-inclusive
  type: single
  q: Какой `range` даёт числа от 1 до 10 включительно?
  options:
  - '`range(1, 10)`'
  - '`range(10)`'
  - '`range(1, 11)`'
  - '`range(0, 10)`'
  answer: 2
  explain: 'Конец не включается, поэтому нужно `range(1, 11)`. `range(1, 10)` заканчивается на 9, а `range(10)` и `range(0, 10)` — это числа от 0 до 9.'
  traps: [0]
- id: loop-var-after
  type: single
  q: |
    Что выведет программа?
    ```python
    total = 0
    for x in [3, 1, 4]:
        total += x
    print(total, x)
    ```
  options:
  - '`8 4`'
  - '`8 3`'
  - Ошибку `NameError`
  - '`4 4`'
  answer: 0
  explain: 'Накопитель собрал 3 + 1 + 4 = 8. Переменная цикла после цикла не исчезает: она указывает на последний элемент, 4.'
- id: rebind-loop-var
  type: single
  q: |
    Что выведет программа?
    ```python
    nums = [1, 2, 3]
    for n in nums:
        n = n * 10
    print(nums)
    ```
  options:
  - '`[10, 20, 30]`'
  - '`[1, 2, 3]`'
  - '`[1, 2, 30]`'
  - '`30`'
  answer: 1
  explain: 'Присваивание `n = n * 10` перепривязывает только имя `n`, а элементы списка остаются прежними. Изменить список можно через индекс: `nums[i] = nums[i] * 10`.'
- id: change-by-index
  type: single
  q: |
    Что выведет программа?
    ```python
    nums = [1, 2, 3]
    for i in range(len(nums)):
        nums[i] = nums[i] + i
    print(nums)
    ```
  options:
  - '`[1, 3, 5]`'
  - '`[1, 2, 3]`'
  - '`[2, 4, 6]`'
  - '`[0, 1, 2]`'
  answer: 0
  explain: 'Индексы 0, 1, 2. К каждому элементу прибавляется его индекс: 1 + 0, 2 + 1, 3 + 2. Присваивание по индексу меняет место в списке.'
- id: nested-count
  type: single
  q: |
    Что выведет программа?
    ```python
    count = 0
    for i in range(3):
        for j in range(4):
            count += 1
    print(count)
    ```
  options:
  - '`7`'
  - '`12`'
  - '`4`'
  - '`20`'
  answer: 1
  explain: Внутренний цикл проходит целиком — 4 итерации — на каждой из трёх итераций внешнего. Всего 3 × 4 = 12.
- id: string-loop
  type: single
  q: |
    Что выведет программа?
    ```python
    word = "Анаконда"
    n = 0
    for ch in word:
        if ch == "а":
            n += 1
    print(n)
    ```
  options:
  - '`3`'
  - '`2`'
  - '`4`'
  - '`1`'
  answer: 1
  explain: 'Цикл перебирает символы по одному. Маленькая `а` встречается дважды; большая `А` — другой символ, она не равна `"а"`.'
- id: empty-range
  type: single
  q: |
    Что выведет программа?
    ```python
    for i in range(5, 1):
        print(i)
    print("конец")
    ```
  options:
  - Числа 5, 4, 3, 2, затем `конец`
  - Только `конец`
  - Числа 5, 4, 3, 2, 1, затем `конец`
  - Ошибку `ValueError`
  answer: 1
  explain: 'Шаг по умолчанию — `+1`, а начало 5 уже не меньше конца 1. Диапазон пуст, тело не выполняется ни разу. Чтобы идти вниз, нужен отрицательный шаг: `range(5, 1, -1)`.'
- id: empty-list-loop-var
  type: single
  q: |
    Что произойдёт?
    ```python
    for t in []:
        print(t)
    print(t)
    ```
  options:
  - Пустая строка вывода
  - Выведется `None`
  - Ошибка `NameError`
  - Выведется `[]`
  answer: 2
  explain: 'Список пуст, тело не выполнилось ни разу, и имя `t` так и не было привязано. Обращение к нему после цикла — `NameError`.'
- id: open-range-off-by-one
  type: open
  q: |
    Ученик хочет вывести числа от 1 до n включительно:
    ```python
    n = int(input())
    for i in range(1, n):
        print(i)
    ```
    Для `5` программа выводит только четыре числа. Объясните, почему, сколько чисел вообще даёт `range(a, b)`, и исправьте программу. Что выведет исправленная программа для `0`?
  rubric:
  - конец range не включается — range(1, 5) даёт 1, 2, 3, 4
  - в range(a, b) при a ≤ b ровно b − a чисел, иначе ни одного
  - исправление — range(1, n + 1)
  - для n = 0 диапазон range(1, 1) пуст, программа ничего не выводит
  wrong_answers:
  - нужно написать range(0, n)
  - range не умеет считать с единицы
  followups:
  - Как вывести те же числа в обратном порядке, от n до 1?
