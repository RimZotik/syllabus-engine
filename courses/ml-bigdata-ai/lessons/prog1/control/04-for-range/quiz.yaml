title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: range-step
  type: single
  q: |
    Что выведет программа?
    ```python
    print(list(range(10, 2, -3)))
    ```
  options:
  - '`[10, 7, 4]`'
  - '`[10, 7, 4, 1]`'
  - '`[]`'
  - '`[4, 7, 10]`'
  answer: 0
  explain: 'Шаг отрицательный, поэтому числа идут вниз от 10: 10, 7, 4. Следующее, 1, уже за концом 2 и не входит. Диапазон не пуст: при отрицательном шаге начало и должно быть больше конца.'
- id: neighbor-from-zero
  type: single
  q: |
    Программа считает дни, которые теплее предыдущего. Что она выведет?
    ```python
    temps = [7, 8, 6]
    count = 0
    for i in range(len(temps)):
        if temps[i] > temps[i - 1]:
            count += 1
    print(count)
    ```
  options:
  - '`2`'
  - '`1`'
  - Ошибку `IndexError`
  - '`3`'
  answer: 0
  explain: 'При `i = 0` индекс `i - 1` равен `-1`, а это последний элемент: программа без ошибки сравнивает первый день с последним, 7 > 6, и засчитывает его. Дальше засчитан второй день (8 > 7), а третий нет (6 > 8 ложно). Итого 2, хотя по смыслу ответ 1 — перебор нужно начинать с `range(1, len(temps))`.'
- id: loop-var-after
  type: single
  q: |
    Что выведет программа?
    ```python
    total = 0
    for x in [3, 1, 4]:
        total += x
    print(total, x)
    ```
  options:
  - '`8 4`'
  - '`8 3`'
  - Ошибку `NameError`
  - '`4 4`'
  answer: 0
  explain: 'В `total` собралась сумма 3 + 1 + 4 = 8. Переменная цикла после цикла не исчезает: она указывает на последний элемент, 4.'
- id: rebind-loop-var
  type: single
  q: |
    Что выведет программа?
    ```python
    nums = [1, 2, 3]
    for n in nums:
        n = n * 10
    print(nums)
    ```
  options:
  - '`[10, 20, 30]`'
  - '`[1, 2, 3]`'
  - '`[1, 2, 30]`'
  - '`30`'
  answer: 1
  explain: 'Присваивание `n = n * 10` перепривязывает только имя `n`, а элементы списка остаются прежними. Изменить список можно через индекс: `nums[i] = nums[i] * 10`.'
- id: change-by-index
  type: single
  q: |
    Что выведет программа?
    ```python
    nums = [1, 2, 3]
    for i in range(len(nums)):
        nums[i] = nums[i] + i
    print(nums)
    ```
  options:
  - '`[1, 3, 5]`'
  - '`[1, 2, 3]`'
  - '`[2, 4, 6]`'
  - '`[0, 1, 2]`'
  answer: 0
  explain: 'Индексы 0, 1, 2. К каждому элементу прибавляется его индекс: 1 + 0, 2 + 1, 3 + 2. Присваивание по индексу меняет место в списке.'
- id: nested-count
  type: single
  q: |
    Что выведет программа?
    ```python
    count = 0
    for i in range(3):
        for j in range(4):
            if j == 2:
                break
            count += 1
    print(count)
    ```
  options:
  - '`6`'
  - '`2`'
  - '`12`'
  - '`8`'
  answer: 0
  explain: '`break` прерывает только внутренний цикл, в котором стоит. На каждой из трёх итераций внешнего внутренний успевает прибавить единицу при `j = 0` и `j = 1`, а на `j = 2` прерывается. Внешний цикл продолжает работу: всего 3 × 2 = 6.'
- id: string-loop
  type: single
  q: |
    Что выведет программа?
    ```python
    word = "Анаконда"
    n = 0
    for ch in word:
        if ch == "а":
            n += 1
    print(n)
    ```
  options:
  - '`3`'
  - '`2`'
  - '`4`'
  - '`1`'
  answer: 1
  explain: 'Цикл перебирает символы по одному. Маленькая `а` встречается дважды; большая `А` — другой символ, она не равна `"а"`.'
- id: empty-range
  type: single
  q: |
    Что выведет программа?
    ```python
    for i in range(5, 1):
        print(i)
    print("конец")
    ```
  options:
  - Числа 5, 4, 3, 2, затем `конец`
  - Только `конец`
  - Числа 5, 4, 3, 2, 1, затем `конец`
  - Ошибку `ValueError`
  answer: 1
  explain: 'Шаг по умолчанию — `+1`, а начало 5 уже не меньше конца 1. Диапазон пуст, тело не выполняется ни разу. Чтобы идти вниз, нужен отрицательный шаг: `range(5, 1, -1)`.'
- id: for-or-while
  type: single
  q: |
    Какой заголовок цикла `for` с тем же телом `print(i)` выведет ровно те же числа, что эта программа?
    ```python
    i = 10
    while i > 0:
        print(i)
        i -= 2
    ```
  options:
  - '`for i in range(10, 0, -2):`'
  - '`for i in range(10, 0, 2):`'
  - '`for i in range(0, 10, 2):`'
  - '`for i in range(10, -1, -2):`'
  answer: 0
  explain: '`while` печатает 10, 8, 6, 4, 2 и останавливается на проверке `0 > 0`. `range(10, 0, -2)` идёт вниз с шагом 2 и не включает конец 0 — те же числа. С шагом `2` при начале больше конца диапазон пуст, `range(0, 10, 2)` идёт вверх и начинает с 0, а `range(10, -1, -2)` захватит лишний 0.'
- id: empty-list-loop-var
  type: single
  q: |
    Что произойдёт?
    ```python
    for t in []:
        print(t)
    print(t)
    ```
  options:
  - Пустая строка вывода
  - Выведется `None`
  - Ошибка `NameError`
  - Выведется `[]`
  answer: 2
  explain: 'Список пуст, тело не выполнилось ни разу, и имя `t` так и не было привязано. Обращение к нему после цикла — `NameError`.'
- id: open-range-off-by-one
  type: open
  q: |
    Ученик хочет вывести числа от 1 до n включительно:
    ```python
    n = int(input())
    for i in range(1, n):
        print(i)
    ```
    Для `5` программа выводит только четыре числа. Объясните, почему, и исправьте программу.
  rubric:
  - конец range не включается — range(1, 5) даёт 1, 2, 3, 4
  - исправление — range(1, n + 1)
  wrong_answers:
  - нужно написать range(0, n)
  - range не умеет считать с единицы
  followups:
  - Что выведет исправленная программа для 0?
  - Как вывести те же числа в обратном порядке, от n до 1?
