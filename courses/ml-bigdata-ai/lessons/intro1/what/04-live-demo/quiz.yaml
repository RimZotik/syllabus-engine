title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: knn-idea
  type: single
  q: Как метод k ближайших соседей решает, к какому классу отнести новый объект?
  options:
  - Подставляет признаки в формулу с подобранными коэффициентами
  - Смотрит, какой класс преобладает у самых похожих известных примеров
  - Выбирает класс наугад
  - Спрашивает ответ у человека
  answer: 1
  explain: Модель находит самые похожие известные примеры и отвечает тем классом, который среди них встречается чаще.
- id: coords
  type: single
  q: Если точка на плоскости — это клиент, то что такое её координаты?
  options:
  - Целевая переменная
  - Признаки клиента
  - Параметры модели
  - Номер клиента
  answer: 1
  explain: Координаты — признаки, например возраст и доход.
- id: k-small
  type: single
  q: Что происходит, если взять k = 1?
  options:
  - Модель становится особенно надёжной
  - Модель подстраивается под каждую отдельную точку, даже случайную
  - Модель перестаёт работать
  - Граница между классами выпрямляется
  answer: 1
  explain: Одна «чужая» точка создаёт вокруг себя целую область.
- id: k-large
  type: single
  q: Что происходит, если k сделать очень большим?
  options:
  - Модель начинает замечать мельчайшие детали
  - Ответы становятся всё более «средними», мелкие особенности пропадают
  - Ничего не меняется
  - Модель начинает сама добавлять новые точки
  answer: 1
  explain: При огромном k почти любая точка получает самый частый класс во всём наборе.
- id: hyperparam
  type: single
  q: Чем гиперпараметр отличается от параметра модели?
  options:
  - Разницы нет
  - Гиперпараметр заранее выбирает человек, а параметр подбирается при обучении
  - Гиперпараметр — другое название признака
  - Гиперпараметр всегда больше по значению
  - Гиперпараметр подбирается при обучении, а параметр заранее выбирает человек
  answer: 1
  explain: Число k задаём мы, а a и b в модели цены подбирает обучение.
  traps:
  - 4
- id: lazy
  type: single
  q: Почему метод ближайших соседей называют «ленивым»?
  options:
  - Он учится дольше остальных моделей
  - Заранее он ничего не считает — вся работа начинается, когда приходит новый объект
  - Он чаще других ошибается
  - Он обходится совсем без данных
  answer: 1
  explain: Всё «знание» — сами примеры; вычисления происходят при предсказании.
- id: more-data
  type: multi
  q: Какие выводы можно сделать из демонстрации?
  options:
  - Когда примеров совсем мало, граница почти случайна
  - Чем больше качественных примеров, тем ближе граница к настоящей
  - Модели нужны правила, которые написал человек
  - Модель справляется даже с запутанной границей, которую сложно описать правилом
  answer:
  - 0
  - 1
  - 3
  explain: Правила модели не нужны — она учится на точках.
- id: knn-vote
  type: single
  q: 'k = 3. Три ближайших соседа новой точки: два зелёных и один фиолетовый. Что ответит модель?'
  options:
  - Зелёный
  - Фиолетовый
  - Ничего — нужно больше соседей
  - Оба цвета сразу
  answer: 0
  explain: Выбирается самый частый класс среди соседей — 2 против 1.
- id: tie
  type: single
  q: k = 2, соседи новой точки — один зелёный и один фиолетовый. В чём проблема?
  options:
  - Проблемы нет, модель выберет зелёный
  - Голоса разделились поровну, и большинства нет
  - Модель упадёт с ошибкой
  - Нужно добавить третий класс
  answer: 1
  explain: 'Ничья: модель не может выбрать класс. Поэтому при двух классах k обычно берут нечётным — ползунок в демонстрации
    шагает по нечётным числам.'
- id: k-all
  type: single
  q: Что ответит модель для любой точки, если k равно числу всех обучающих точек?
  options:
  - Цвет ближайшей точки
  - Везде один и тот же класс — самый частый среди всех точек
  - Случайный цвет
  - Модель не сможет ответить
  answer: 1
  explain: Соседями становятся все точки сразу — положение новой точки перестаёт влиять на ответ.
- id: explain-tradeoff
  type: open
  q: Опишите, что вы наблюдали в демонстрации, меняя k от 1 до 9. Почему одинаково плохо и «верить каждому примеру», и «всё
    усреднять»?
  rubric:
  - 'ответ ссылается на наблюдение: островки при малом k, сглаживание при большом'
  - малое k ведёт к переобучению на случайностях
  - большое k теряет детали настоящей закономерности
  wrong_answers:
  - чем больше k, тем всегда лучше
  - k — это число классов
  followups:
  - Как бы вы выбрали k, не гадая?
  - Как бы вы выбрали k, если бы были отложенные данные?
  explain: Вернитесь к странице «Что вы увидели».
