title: Контрольная раздела «ИИ, машинное обучение и данные простыми словами»
pass: 0.85
minutes: 30
questions:
- id: s-rules
  type: single
  q: Компания хочет считать стоимость доставки — 300 ₽ по городу и 600 ₽ за городом. Что лучше использовать?
  options:
  - Модель, обученную на истории доставок
  - Обычное правило в программе
  - Кластеризацию заказов
  - Генеративную модель
  answer: 1
  explain: Правило простое и точно известно — обучение здесь не нужно.
- id: s-ml-def
  type: single
  q: Что точнее всего описывает машинное обучение?
  options:
  - Компьютер исполняет правила, которые продиктовал эксперт
  - Программа сама выводит закономерность из множества случаев, а не получает её в готовом виде
  - Компьютер сам пишет себе программный код
  - Любая программа, написанная на Python
  answer: 1
  explain: Ключевое — закономерность из примеров, а не из готовых правил.
- id: s-vocab
  type: multi
  q: Сервис предсказывает время доставки по расстоянию, погоде и загруженности дорог. Что верно?
  options:
  - Время доставки — целевая переменная
  - Расстояние, погода и загруженность — признаки
  - Это задача классификации
  - Одна прошлая доставка — один объект
  answer:
  - 0
  - 1
  - 3
  explain: Ответ — число минут, поэтому это регрессия, а не классификация.
- id: s-params
  type: single
  q: Что именно меняется при обучении модели?
  options:
  - Признаки объектов
  - Правильные ответы в примерах
  - Числа внутри модели, от которых зависят её ответы
  - Настройки вроде k, которые выбрал человек
  answer: 2
  explain: Обучение подбирает параметры. Гиперпараметры (например, k) выбирает человек.
- id: s-overfit
  type: single
  q: Модель отлично работает на обучающих данных и плохо на новых. Что это и как это заметили?
  options:
  - Модель слишком простая; это видно по большой ошибке на обучении
  - Модель зазубрила примеры; это видно, если сравнить ошибку на обучающих и на отложенных данных
  - Модель хорошо обобщает; это видно по скорости её работы
  - Это нормально, ничего делать не нужно
  answer: 1
  explain: Разрыв между обучением и отложенными данными — признак переобучения.
- id: s-types
  type: single
  q: Какой тип задачи — «разбить новости на темы, которые заранее неизвестны»?
  options:
  - Классификация
  - Регрессия
  - Кластеризация
  - Ранжирование
  answer: 2
  explain: Темы не заданы заранее — их надо найти.
- id: s-learning-kinds
  type: multi
  q: Выберите верные утверждения о способах обучения.
  options:
  - При обучении с учителем у примеров есть готовые ответы
  - При обучении с подкреплением модель ориентируется на поощрения и штрафы
  - Обучение без учителя невозможно без ручной разметки
  - Поиск групп похожих объектов — пример обучения без учителя
  answer:
  - 0
  - 1
  - 3
  explain: Без учителя — как раз без разметки.
  traps:
  - 2
- id: s-knn
  type: single
  q: 'Обучающие примеры — зелёные и фиолетовые точки, класс каждой известен. Одна фиолетовая точка лежит среди зелёных. Модель
    — метод k ближайших соседей, k = 1. Появляется новая точка без класса — его и нужно предсказать. Ближайший к ней обучающий
    пример — та самая фиолетовая точка. Какой класс предскажет модель?'
  options:
  - Зелёный
  - Фиолетовый
  - Модель откажется отвечать
  - Случайный класс
  answer: 1
  explain: При k = 1 решает единственный ближайший пример.
- id: s-hyper
  type: single
  q: Какое утверждение о числе k в методе ближайших соседей верно?
  options:
  - Это внутреннее число модели, которое находится при обучении
  - Это настройка, которую человек выбирает заранее
  - Это то, что модель предсказывает
  - Это количество признаков
  answer: 1
  explain: k — гиперпараметр, он задаётся до обучения.
- id: s-features-matter
  type: single
  q: Модель предсказывает цену подержанного автомобиля, но в данных нет пробега. К чему это приведёт?
  options:
  - Модель сама восстановит пробег по другим данным
  - Модель будет хуже оценивать цену — учесть пробег она не сможет
  - Модель станет только точнее
  - Модель вообще не сможет обучиться
  answer: 1
  explain: Модель видит объект только через признаки.
- id: s-link
  type: multi
  q: Вспомните демонстрацию с точками. Какие утверждения о ней верны?
  options:
  - Это задача классификации
  - 'Это обучение с учителем: у точек известен цвет'
  - 'Это кластеризация: модель сама придумывает цвета'
  - Число k — гиперпараметр
  answer:
  - 0
  - 1
  - 3
  explain: Цвета (классы) задали вы — значит, классификация с учителем.
- id: s-ml-errors
  type: single
  q: Почему модели машинного обучения в реальных системах окружают обычным кодом?
  options:
  - Модели запускаются только из кода на Python
  - Модель права лишь в большинстве случаев, и её промахи нужно страховать
  - Этого требует закон
  - Без дополнительного кода модель не может выдать ответ
  answer: 1
  explain: Проверки и правила страхуют от ошибок модели.
- id: s-open-project
  type: open
  q: Вы работаете в интернет-магазине. Опишите одну задачу, где поможет машинное обучение. Укажите тип задачи, объект, 3 признака,
    целевую переменную и как вы проверите, что модель хороша.
  rubric:
  - задача реалистична и требует обучения
  - верно указан тип задачи
  - названы объект, три признака и целевая переменная
  - проверка — на отложенных данных, которые модель не видела
  followups:
  - Откуда возьмутся правильные ответы для обучения?
  - Что изменится, если данных станет в десять раз меньше?
  explain: Используйте словарь второй темы и типы задач из третьей.
- id: s-open-explain
  type: open
  q: Объясните другу без технического образования, что такое модель, обучение и предсказание, на одном связном примере.
  rubric:
  - модель — функция или «устройство» с настраиваемыми параметрами
  - обучение — подбор параметров по примерам с известными ответами
  - предсказание — применение к новому случаю
  - пример цельный и понятный
  followups:
  - Приведите ещё один пример — не про квартиры
  - Чем предсказание отличается от обучения?
  explain: Вторая тема раздела, пример с квартирами.
- id: s-open-not-ml
  type: open
  q: Опишите ситуацию, где машинное обучение использовать НЕ стоит, и объясните почему.
  rubric:
  - ситуация, где правило простое и точно известно, или ошибка недопустима и нужна полная объяснимость, или нет данных
  - объяснение опирается на сравнение правил и обучения из первой темы
  wrong_answers:
  - ML не стоит использовать никогда, потому что оно ошибается
  followups:
  - А если правило есть, но меняется каждую неделю?
