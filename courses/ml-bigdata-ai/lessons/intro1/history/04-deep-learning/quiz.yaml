title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: backprop
  type: single
  q: Многослойная сеть увидела фото кошки и ответила «собака». Что сделает метод обратного распространения ошибки?
  options:
  - Найдёт один нейрон, виновный в ошибке, и поправит только его веса
  - Поправит только веса выходного слоя — для внутренних нейронов правильных ответов нет
  - Пройдёт от выхода к входу и для каждого веса вычислит, насколько и в какую сторону его сдвинуть
  - Сдвинет все веса сети на одну и ту же величину в сторону правильного ответа
  answer: 2
  explain: Ошибку передают назад слой за слоем, и каждый вес получает свою поправку — свою «долю вины». Именно это сделало
    обучаемыми внутренние слои, для которых в примерах нет готовых ответов.
- id: nn-def
  type: single
  q: Почему сеть из нескольких слоёв справляется с исключающим ИЛИ, а один перцептрон — нет?
  options:
  - Каждый нейрон сети устроен сложнее перцептрона и проводит кривую, а не прямую
  - Выходы одних нейронов становятся входами других, и из нескольких прямых складывается более сложная граница
  - Сети дают больше примеров, а перцептрону в этой задаче мешал недостаток данных
  - Сеть запоминает все четыре случая целиком и сравнивает с ними каждый новый
  answer: 1
  explain: Нейроны сети похожи на перцептрон, и каждый по-прежнему проводит прямую. Сила — в соединении слоями. Перцептрону
    не помогли бы никакие примеры.
- id: dl-features
  type: single
  q: 'Раньше для распознавания речи инженеры сами описывали признаки звука: высоту, громкость, паузы. Что меняет глубокая
    сеть?'
  options:
  - Сеть вообще не выделяет никаких признаков — внутри неё звук сразу превращается в ответ
  - Инженеры по-прежнему задают признаки, а сеть лишь быстрее их обрабатывает
  - Инженеры указывают, что искать на каждом слое, а сеть подбирает только веса
  - Сеть при обучении сама выясняет, на что смотреть, — от мелких деталей звука к их сочетаниям
  answer: 3
  explain: Признаки никуда не делись, но их подбирает обучение, а не человек. Ранние слои находят простое, следующие собирают
    из него сложное. Что искать на каждом слое, сети никто не говорит.
- id: nets-2000s
  type: single
  q: Что из этого НЕ было причиной, по которой в 2000-х нейросетям часто предпочитали метод опорных векторов и бустинг?
  options:
  - Большие сети обучались мучительно долго
  - Большим сетям нужно много размеченных примеров, а таких наборов было мало
  - Другие методы давали результат надёжнее
  - Веса во внутренних слоях ещё не умели подбирать по примерам
  answer: 3
  explain: Обратное распространение ошибки стало широко известно ещё в 1986 году, и к концу 1990-х сети уже читали цифры
    на чеках. Мешали скорость обучения и нехватка данных.
- id: imagenet-bet
  type: single
  q: Почему ставка создателей ImageNet на данные, а не на новый алгоритм, оказалась верной для глубоких сетей?
  options:
  - Чем сложнее модель, тем больше примеров ей нужно, чтобы уловить закономерность, а не зазубрить
  - На достаточно большом наборе любая модель, даже один перцептрон, учится чему угодно
  - Подписи людей подсказывали сети, какие признаки искать на каждом слое
  - Миллионы примеров позволили обучать сеть без обратного распространения ошибки
  answer: 0
  explain: Это мысль Вапника и Червоненкиса из прошлой темы. У глубокой сети огромное число параметров, и на маленьком наборе
    она зазубрит примеры. Перцептрону данные не помогут — его граница всё равно прямая.
- id: alexnet-meaning
  type: multi
  q: Какие выводы следуют из истории AlexNet? Выберите все верные.
  options:
  - Сама идея многослойной сети к 2012 году была известна давно
  - AlexNet обошла соперников, потому что признаки для картинок ей задали эксперты по зрению
  - Видеокарта ускорила обучение, потому что нейроны одного слоя работают независимо и их вычисления можно вести одновременно
  - После этой победы глубокие сети почти полностью вытеснили другие подходы к данным любого вида, а не только к картинкам
  - Огромный отрыв показал, что старой идее не хватало масштаба — данных и вычислений
  answer:
  - 0
  - 2
  - 4
  explain: Сеть была старой идеей, новыми — ImageNet и видеокарты. Признаки AlexNet нашла сама. На глубокие сети перешло
    компьютерное зрение, а не все задачи вообще.
  traps:
  - 3
- id: transformer-problem
  type: single
  q: В длинном письме в первой строке названо имя Оля, а в последней написано «передайте ей привет». Почему сети, которая
    читает слово за словом, труднее понять, кто «она», чем трансформеру?
  options:
  - У неё нет правил рода и падежа, а трансформеру их задают заранее
  - Она обрабатывает слова одновременно и путает их порядок, а трансформер читает строго по очереди
  - В её сжатой памяти начало письма к концу расплылось, а трансформер напрямую сопоставляет «ей» со всеми словами
  - Она видит все слова сразу, но не умеет решить, какие из них важны
  answer: 2
  explain: Пословное чтение держит прочитанное в сжатой «памяти», и далёкое начало в ней теряется. Во внимании каждое слово
    напрямую смотрит на все остальные, как бы далеко они ни стояли.
- id: attention
  type: single
  q: 'Модель-переводчик на трансформере получила фразу «Ключ не подошёл к замку, потому что он заржавел». Что сделает внимание
    для слова «он»?'
  options:
  - Возьмёт ближайшее существительное мужского рода перед ним — «замок»
  - Учтёт только слова перед ним, ведь слова после ещё не прочитаны
  - Пропустит «он» — местоимения сами по себе смысла не несут
  - Оценит важность каждого слова фразы и сильнее учтёт «ключ», «замок» и «заржавел»
  answer: 3
  explain: Внимание не ищет по правилу грамматики и не читает по порядку. Каждое слово сравнивается со всеми остальными,
    и важные для смысла получают больший вес.
- id: transformer-speed
  type: single
  q: Почему трансформер обучается намного быстрее сети, которая читает слово за словом?
  options:
  - Внимание пропускает неважные слова, и текста приходится обрабатывать меньше
  - Слова не стоят в очереди друг за другом, и видеокарта обрабатывает их одновременно
  - У него меньше слоёв и параметров, поэтому шагов обучения меньше
  - Его сжатая память о прочитанном короче, и её быстрее обновлять
  answer: 1
  explain: При пословном чтении следующий шаг ждёт предыдущий. Трансформер при обучении берёт все слова сразу — ровно
    такая работа, которую видеокарта делает тысячами одновременно.
- id: lm-labels
  type: single
  q: Почему языковую модель можно учить на миллиардах страниц текста, а модель, которая отличает больные листья растений
    от здоровых, — только на фото, подписанных агрономами?
  options:
  - Тексты в интернете проверены редакторами, а фото листьев никто не проверял
  - Языковой модели правильные ответы не нужны, она учится вообще без примеров
  - Текстов больше, чем фото, и их просто не успевают подписывать
  - В тексте ответ — следующее слово — уже записан, а на фото листа диагноз не написан
  answer: 3
  explain: Языковая модель учится на примерах с ответами, но ответы берутся из самого текста. Чтобы узнать, болен ли лист,
    нужен человек, который это определит.
- id: pretrain-vs-rlhf
  type: single
  q: Модель, которую учили только продолжать тексты, на вопрос «Как сварить гречку?» выдаёт ещё три похожих вопроса — как
    в списке на форуме. Какой шаг в создании ChatGPT решал именно эту проблему?
  options:
  - Ещё больше текстов из интернета для предсказания следующего слова
  - Дообучение на диалогах, а затем на оценках, которые люди ставили её ответам
  - Правила, которые запрещают модели отвечать вопросом на вопрос
  - Замена пословного чтения механизмом внимания
  answer: 1
  explain: Продолжать текст — ещё не значит отвечать. Больше текстов научат продолжать ещё лучше, внимание у модели уже
    есть. Вести диалог её научило дообучение на диалогах и оценках людей.
- id: chatgpt-steps
  type: multi
  q: Какие утверждения о ChatGPT верны? Выберите все верные.
  options:
  - На первом этапе модель училась предсказывать следующее слово, и ответы для этого никто не подписывал
  - На этапе с оценками люди сравнивали ответы модели, и наградой служило то, какой ответ сочли лучшим
  - Обучение на оценках людей — это обучение с подкреплением, где человек пишет для каждого вопроса правильный ответ
  - Модель сверяет каждый ответ с базой проверенных фактов
  - Модель может уверенно назвать книгу, которой не существует, потому что выдаёт правдоподобное продолжение
  answer:
  - 0
  - 1
  - 4
  explain: При обучении с подкреплением человек не пишет правильный ответ, а оценивает ответы модели, и оценка служит наградой.
    Базы фактов у языковой модели нет — она выдаёт правдоподобное, а не проверенное.
  traps:
  - 2
- id: open-three
  type: open
  q: Нейросети известны с 1980-х. Назовите три прорыва — 2012, 2017 и 2022 годов — и для каждого объясните одним-двумя
    предложениями, что в нём было новым. Что у всех трёх общего с идеями первого раздела курса?
  rubric:
  - 2012 — глубокая сеть (AlexNet), обученная на огромном подписанном наборе ImageNet с помощью видеокарт
  - 2017 — трансформер, механизм внимания вместо пословного чтения; слова обрабатываются одновременно, поэтому стало
    возможным учиться на огромных текстах
  - 2022 — ChatGPT, большая языковая модель, дообученная на диалогах и оценках людей
  - общее — это модели с параметрами, обученные на примерах; они обобщают и могут ошибаться
  wrong_answers:
  - ChatGPT работает по правилам, которые написали программисты
  - в 2012 году придумали нейросети
  followups:
  - Почему идея нейросетей, известная с 1980-х, выстрелила только в 2012 году?
  - Откуда берутся правильные ответы при обучении языковой модели?
  explain: Страницы «2012», «2017» и «2022» этой темы.
