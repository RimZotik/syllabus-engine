title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: backprop
  type: single
  q: Какую проблему решил метод обратного распространения ошибки?
  options:
  - Как собрать миллионы размеченных картинок
  - Как обойтись совсем без примеров с правильными ответами
  - Как понять, насколько и в какую сторону менять веса во внутренних слоях
  - Как заставить один нейрон проводить кривую границу
  answer: 2
  explain: Ошибку передают от выхода назад, и каждый вес получает свою «долю вины». Так многослойные сети стали обучаемыми.
- id: nn-def
  type: single
  q: Что такое нейронная сеть в самом простом понимании?
  options:
  - Слои простых нейронов, где выходы одного слоя — входы следующего
  - Компьютер, который устроен точно как человеческий мозг
  - Набор правил «если — то», составленный нейробиологами
  - Таблица, в которой хранятся все обучающие примеры
  answer: 0
  explain: Нейросеть — слои простых вычислительных элементов. С настоящим мозгом её роднит лишь общая идея.
- id: dl-features
  type: single
  q: Что изменило глубокое обучение по сравнению с прежними методами распознавания картинок?
  options:
  - Признаки для картинок больше не нужны вообще
  - Признаки теперь задаёт эксперт для каждого слоя отдельно
  - Сеть запоминает каждую картинку целиком, без признаков
  - Сеть сама находит полезные признаки, от простых к сложным, а не получает их от человека
  answer: 3
  explain: Признаки по-прежнему есть, но их подбирает обучение — от простых вроде краёв до сложных вроде целых объектов.
- id: nets-2000s
  type: single
  q: Почему в 2000-х нейросетям часто предпочитали метод опорных векторов и бустинг?
  options:
  - Большие сети обучались мучительно долго и требовали много размеченных данных
  - Нейросети не могли работать с картинками и рукописным текстом
  - Нейросети не умели решать исключающее ИЛИ
  - Метод опорных векторов уже тогда умел писать тексты
  answer: 0
  explain: Не хватало данных и вычислений, а другие методы работали надёжнее. Исключающее ИЛИ многослойные сети решали ещё
    в 1980-х, а рукописные цифры на чеках читали к концу 1990-х.
  traps:
  - 2
- id: imagenet-bet
  type: single
  q: В чём была главная ставка создателей ImageNet?
  options:
  - Придумать новый алгоритм обучения нейросетей
  - Написать правила распознавания для тысяч категорий
  - Сделать конкурс, в котором побеждает самый быстрый компьютер
  - Дать моделям намного больше подписанных примеров, чем было раньше
  answer: 3
  explain: ImageNet — ставка на данные. Миллионы подписанных картинок позволили обучать большие модели без сильного
    переобучения.
- id: alexnet-meaning
  type: single
  q: Почему победу AlexNet в 2012 году считают поворотной?
  options:
  - Это была первая нейросеть в истории
  - Сеть перестала ошибаться на картинках
  - Глубокая сеть резко обошла остальные подходы, и компьютерное зрение перешло на нейросети
  - Её обучили без видеокарт, на обычном процессоре
  answer: 2
  explain: Нейросети существовали давно. Поворот — в огромном отрыве и в том, что после этого область перешла на глубокое
    обучение.
- id: transformer-problem
  type: single
  q: Какую проблему прежних сетей для текста решил трансформер?
  options:
  - Они читали слово за словом, к концу текста «забывали» начало и обучались медленно
  - Они не умели работать с текстом совсем, только с картинками
  - Им требовались правила грамматики, которые писали лингвисты
  - Они могли обработать за раз только одно короткое предложение
  answer: 0
  explain: У пословного чтения две проблемы — оно «забывает» начало и учится медленно, ведь следующий шаг ждёт предыдущий.
    Внимание решает обе.
- id: attention
  type: single
  q: Как в общих словах работает механизм внимания?
  options:
  - Модель обращает внимание только на первое и последнее слово
  - Человек отмечает для модели важные слова в каждом тексте
  - Модель пропускает слова, которые уже встречались раньше
  - Каждое слово учитывает все остальные слова текста с разной важностью
  answer: 3
  explain: Каждый элемент «смотрит» на все остальные и сам определяет, какие из них важны для его смысла.
- id: lm-labels
  type: single
  q: Почему языковые модели можно обучать на огромной части текстов интернета без ручной разметки?
  options:
  - Им не нужны правильные ответы — они учатся без примеров
  - Тексты в интернете уже размечены своими авторами
  - Правильный ответ — следующее слово — уже есть в самом тексте
  - Модель сама придумывает правильные ответы и проверяет себя
  answer: 2
  explain: Следующее слово в тексте всегда известно — это готовый правильный ответ, размечать ничего не нужно.
- id: chatgpt-steps
  type: multi
  q: Какие утверждения о ChatGPT верны? Выберите все.
  options:
  - В основе — языковая модель на архитектуре трансформер
  - Модель проверяет каждый свой ответ по базе фактов, поэтому не ошибается
  - Модель дообучали на диалогах и на сравнениях ответов, которые делали люди
  - Оценки людей служили наградой — это идея обучения с подкреплением
  answer:
  - 0
  - 2
  - 3
  explain: Языковая модель выдаёт правдоподобное продолжение, а не проверенную истину, и может уверенно выдумывать факты.
- id: open-three
  type: open
  q: Назовите три прорыва — 2012, 2017 и 2022 годов — и для каждого объясните одним-двумя предложениями, что в нём было
    новым. Что у всех трёх общего с идеями первого раздела курса?
  rubric:
  - 2012 — глубокая сеть (AlexNet) на огромном размеченном наборе ImageNet, обучение на видеокартах, резкий отрыв от других
    подходов
  - 2017 — трансформер, механизм внимания вместо пословного чтения, одновременная обработка слов и обучение на больших текстах
  - 2022 — ChatGPT, большая языковая модель, дообученная на диалогах и оценках людей
  - общее — это модели с параметрами, обученные на примерах; они обобщают и могут ошибаться
  wrong_answers:
  - ChatGPT работает по правилам, которые написали программисты
  - в 2012 году придумали нейросети
  followups:
  - Почему идея нейросетей, известная с 1980-х, выстрелила только в 2012 году?
  - Откуда берутся правильные ответы при обучении языковой модели?
  explain: Страницы «2012», «2017» и «2022» этой темы.
