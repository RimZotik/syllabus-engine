title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: tm-idea
  type: single
  q: Зачем Тьюринг придумал свою воображаемую машину?
  options:
  - Чтобы построить быстрый электронный вычислитель для расчётов
  - Чтобы доказать, что машина может заменить человека-вычислителя
  - Чтобы точно определить, что значит решать задачу строго по инструкции
  - Чтобы создать машину, которая сама учится на примерах
  answer: 2
  explain: Машина Тьюринга — мысленная модель вычисления по правилам. Это не прибор и не обучающаяся машина, а точное описание
    того, что значит «действовать по инструкции».
- id: tm-calculator
  type: single
  q: Касса в магазине считает сумму чека одинаково и в первый день, и после миллиона пробитых чеков. Чем она похожа на машину
    Тьюринга?
  options:
  - Действует только по заранее заданным правилам, и опыт её не меняет
  - Учится на каждом чеке, но так медленно, что этого не заметно
  - Хранит готовые ответы для всех возможных чеков
  - Сама придумала способ складывать, глядя на работу кассиров
  answer: 0
  explain: Как и машина Тьюринга, касса только исполняет записанные человеком правила. Сколько бы случаев она ни обработала,
    сама она ничему не учится.
- id: tt-essence
  type: single
  q: Как устроен тест Тьюринга?
  options:
  - Машина решает сложные задачи, и если решает быстрее человека — тест пройден
  - Учёные изучают устройство программы и решают, есть ли в ней разум
  - Судья переписывается с человеком и машиной и пытается понять, кто из них машина
  - Машина отвечает на вопросы экзамена, и её ответы сравнивают с ответами студентов
  answer: 2
  explain: 'Игра в имитацию — это переписка: если судья не может надёжно отличить машину от человека, машина проходит
    тест.'
- id: tt-why
  type: single
  q: Двое спорят, «думает» ли чат-ассистент, и каждый понимает слово «думать» по-своему. Как предложил бы решить такой спор
    Тьюринг?
  options:
  - Сначала договориться о точном определении мышления, а потом спорить дальше
  - Разобрать программу ассистента и найти в ней часть, отвечающую за мышление
  - Признать, что ассистент думает, если он отвечает быстрее человека
  - Устроить переписку вслепую и посмотреть, отличит ли судья ассистента от человека
  answer: 3
  explain: Тьюринг считал спор о размытом слове «мыслить» бесполезным и заменил его проверкой поведения, результат которой
    можно наблюдать.
- id: tt-limits
  type: single
  q: Машина прошла тест Тьюринга. Что из этого следует?
  options:
  - Машина по-настоящему понимает, о чём говорит
  - В переписке её трудно отличить от человека
  - Машина умеет делать всё, что умеет человек
  - Машина никогда не ошибается в ответах
  answer: 1
  explain: Тест проверяет только поведение в разговоре. О понимании, чувствах или безошибочности он ничего не говорит.
  traps:
  - 0
- id: child-machine
  type: single
  q: Какой путь к «умной» машине Тьюринг предложил в разделе об обучающихся машинах?
  options:
  - Вписать в машину правила всех экспертов, раздел за разделом
  - Скопировать в машину устройство мозга взрослого человека
  - Сделать машину, способную учиться, и дать ей образование
  - Отказаться от этой цели, потому что знаний слишком много
  answer: 2
  explain: «Машина-ребёнок», которую потом обучают, — это и есть идея машинного обучения в зародыше.
- id: hand-rules
  type: single
  q: Тьюринг прикинул, сколько займёт вписать в машину знания взрослого человека вручную. Какой вывод из этой оценки важен
    для машинного обучения?
  options:
  - Писать такие правила нужно большой командой, а не в одиночку
  - Сначала нужны компьютеры побыстрее, а уже потом можно вписывать знания
  - Программистов в то время было слишком мало для такой работы
  - Знаний так много, что выписать их правилами практически нереально
  answer: 3
  explain: 'Это тот же довод, что и в первой теме курса: где правил слишком много, их приходится не писать, а получать
    из примеров.'
- id: two-lines
  type: single
  q: 'Команда делает программу, которая подсказывает врачу диагноз. Вариант А: расспросить опытных врачей и записать их
    знания в виде условий. Вариант Б: собрать тысячи прошлых случаев с известными диагнозами и настроить модель на них.
    К каким линиям ИИ относятся эти варианты?'
  options:
  - Оба варианта — обучение на примерах, просто данные разные
  - А — линия обучения, потому что врачи когда-то учились; Б — линия правил
  - А — линия правил, записанных человеком; Б — линия обучения на примерах
  - Оба варианта — линия правил, потому что внутри всё равно работает программа
  answer: 2
  explain: Разница в источнике знаний. В варианте А правила пишет человек, в варианте Б модель подбирает параметры по примерам
    с ответами.
- id: tm-vs-ml
  type: multi
  q: Какие утверждения о машине Тьюринга и машинном обучении верны? Выберите все.
  options:
  - Каждое действие машины Тьюринга заранее записано в её таблице правил
  - Машина Тьюринга постепенно улучшает свою таблицу правил, решая задачи
  - Машине Тьюринга нужны примеры с правильными ответами, чтобы начать работу
  - В машинном обучении параметры модели подбираются по примерам, а не записываются человеком
  answer:
  - 0
  - 3
  explain: 'Машина Тьюринга ничему не учится: и правила, и порядок действий задал человек. В машинном обучении человек задаёт
    устройство модели, а её параметры подбираются по примерам.'
- id: open-turing
  type: open
  q: Объясните своими словами, как связаны статья Тьюринга 1950 года и машинное обучение. Что в ней было вопросом, что —
    проверкой, а что — предложением, как построить «умную» машину?
  rubric:
  - вопрос — может ли машина мыслить; Тьюринг считает его размытым
  - проверка — игра в имитацию (тест Тьюринга) по переписке с судьёй
  - предложение — не вписывать знания вручную, а построить машину, которая учится, и обучить её
  - связь с ML — переход от правил, написанных человеком, к обучению на примерах
  - засчитывается полностью, если названы все три части и связь с обучением на примерах
  wrong_answers:
  - тест Тьюринга доказывает, что машина понимает смысл
  - Тьюринг придумал нейросети
  followups:
  - Почему Тьюринг считал, что вписать знания вручную слишком долго?
  - Чего тест Тьюринга не проверяет?
  explain: Перечитайте страницы «Может ли машина мыслить» и «Машина-ребёнок».
