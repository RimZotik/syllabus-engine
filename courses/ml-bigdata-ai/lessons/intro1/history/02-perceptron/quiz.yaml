title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: perc-new
  type: single
  q: Чем перцептрон принципиально отличался от «умных» программ 1950-х вроде шахматных или доказывающих теоремы?
  options:
  - Он сам подбирал свои веса по примерам, а не выполнял правила, записанные человеком
  - Он работал на гораздо более мощном компьютере, чем остальные программы
  - Он умел вести разговор с человеком и проходил тест Тьюринга
  - Он в точности копировал устройство мозга, нейрон за нейроном
  answer: 0
  explain: Главное новшество — обучение на примерах. Устройство нейрона было сильно упрощённым, а разговаривать перцептрон
    не умел.
- id: perc-how
  type: single
  q: Как перцептрон выдаёт ответ?
  options:
  - Ищет самый похожий пример среди запомненных и повторяет его ответ
  - Проверяет цепочку условий «если — то», составленную экспертом
  - Выбирает ответ случайно, а потом запоминает удачные
  - Складывает признаки, умноженные на веса, и сравнивает сумму с порогом
  answer: 3
  explain: Взвешенная сумма и порог — это и есть перцептрон. Готовых примеров он не хранит, а цепочка условий от эксперта —
    обычная программа.
- id: perc-rule
  type: single
  q: Перцептрон правильно ответил на очередной пример. Что происходит с его весами по правилу обучения?
  options:
  - Все веса увеличиваются, чтобы закрепить успех
  - Веса сбрасываются к начальным значениям
  - Веса остаются прежними
  - Веса уменьшаются, чтобы модель не переобучилась
  answer: 2
  explain: Поправка делается только при ошибке. Угадал — ничего не трогаем.
- id: perc-words
  type: multi
  q: Сопоставьте перцептрон со словарём машинного обучения. Какие утверждения верны?
  options:
  - Веса перцептрона — это параметры модели
  - Правильные ответы в примерах меняются при обучении вместе с весами
  - Поправка весов после ошибок — это обучение
  - Ответ для нового объекта — это предсказание
  answer:
  - 0
  - 2
  - 3
  explain: 'У Розенблатта уже есть всё: модель, параметры, обучение, предсказание. Правильные ответы в примерах — это данные,
    при обучении они не меняются; подбираются веса.'
- id: xor-why
  type: single
  q: Лампа горит, когда поднят ровно один из двух выключателей. Почему один перцептрон не научится предсказывать, горит ли
    лампа?
  options:
  - Случаи «горит» и «темно» не разделить одной прямой, а другой границы перцептрон не умеет
  - Для этой задачи нельзя собрать примеры с правильными ответами
  - Перцептрону для такой задачи нужно больше двух признаков
  - Он научится, но только если показать каждый случай много раз
  answer: 0
  explain: Это исключающее ИЛИ. Точки «горит» стоят по диагонали, одна прямая их не отделит — дело в устройстве модели,
    а не в данных.
- id: xor-fix
  type: single
  q: Что справилось бы с исключающим ИЛИ и почему этим тогда не воспользовались?
  options:
  - Более мощный компьютер; его не на что было купить
  - Больше обучающих примеров; их было трудно собрать
  - Несколько слоёв нейронов; не знали, как обучать веса внутренних слоёв
  - Экспертные правила; эксперты отказались их писать
  answer: 2
  explain: Многослойная сеть может построить более сложную границу, но как обучать её внутренние веса, тогда не знали.
- id: winter-def
  type: single
  q: Что называют «зимой искусственного интеллекта»?
  options:
  - Время, когда ИИ окончательно признали невозможным и исследования прекратились
  - Время, когда исследователи отказались от правил и перешли к обучению на примерах
  - Время, когда новые компьютеры перестали выпускать из-за нехватки денег
  - Спад денег и интереса к исследованиям ИИ после завышенных обещаний
  answer: 3
  explain: Зима — это спад финансирования и интереса после неоправданных обещаний. Исследования при этом не прекращаются
    полностью.
- id: winter-causes
  type: multi
  q: Что привело к первой «зиме» ИИ в 1970-х? Выберите все.
  options:
  - Обещания исследователей сильно опередили реальные результаты
  - Учёные доказали, что машины в принципе не могут учиться
  - Программы, работавшие на игрушечных задачах, не справлялись с настоящими
  - Перцептрон не мог выучить некоторые простые на вид задачи
  answer:
  - 0
  - 2
  - 3
  explain: Ограничения доказали для одного перцептрона, а не для обучения вообще. Причины зимы — разрыв между обещаниями и
    результатами; за ним последовало сокращение денег.
  traps:
  - 1
- id: open-perceptron
  type: open
  q: Объясните, почему перцептрон — это уже настоящее машинное обучение и почему, несмотря на это, он не оправдал надежд.
    Используйте слова «модель», «параметры» и «обучение».
  rubric:
  - перцептрон — модель с параметрами (весами), которые подбираются по примерам с ответами
  - обучение — поправка весов при ошибках
  - ограничение — одна прямая граница, поэтому некоторые задачи (исключающее ИЛИ) он не выучит ни на каких данных
  - многослойные сети решали проблему, но обучать их тогда не умели; плюс завышенные обещания и спад финансирования
  wrong_answers:
  - перцептрону просто не хватило примеров
  - Минский и Пейперт доказали, что нейросети не работают
  followups:
  - Чем веса перцептрона похожи на ручки модели цены квартиры?
  - Помогло бы перцептрону больше данных для исключающего ИЛИ?
  explain: 'Страницы «Как учится перцептрон» и «Стена: исключающее ИЛИ».'
