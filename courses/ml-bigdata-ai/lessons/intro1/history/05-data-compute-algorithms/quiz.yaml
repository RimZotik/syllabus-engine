title: Проверка темы
pass: 0.85
minutes: 14
questions:
- id: three-ingredients
  type: multi
  q: Что из этого относится к ингредиенту «вычисления»? Выберите все верные.
  options:
  - Игровой рынок сделал мощные видеокарты дешёвыми
  - Видеокарты стали программировать не только для графики
  - Появились приёмы, которые ускоряют обучение глубоких сетей
  - Смартфоны дали миллиарды фотографий
  - Языковые модели учат на тысячах ускорителей в дата-центрах
  answer:
  - 0
  - 1
  - 4
  explain: Приёмы, которые ускоряют обучение, — это алгоритмы, хотя и звучат как «вычисления». Они меняют то, как сеть
    учится, а не то, на чём считают. Фотографии со смартфонов — данные.
  traps:
  - 2
- id: why-not-1986
  type: single
  q: Перенесёмся в 1986 год и дадим исследователям ImageNet, но компьютеры оставим прежними. Что будет с попыткой обучить
    большую сеть вроде AlexNet?
  options:
  - Данных теперь хватает, поэтому сеть быстро обучится и повторит успех 2012 года
  - Обучение растянется на непомерный срок — обычный компьютер выполняет простые операции в основном по очереди
  - Сеть зазубрит примеры — на миллионах картинок большие сети переобучаются
  - Сеть вообще не удастся обучить — обратное распространение ошибки ещё не придумали
  answer: 1
  explain: Один ингредиент не даёт прорыва. Данные есть, но без видеокарт, которые делают тысячи операций сразу, обучение
    заняло бы немыслимо много времени. Обратное распространение в 1986 году уже было.
- id: data-overfit
  type: single
  q: 'Две модели учатся находить брак по 500 фотографиям деталей: простая и огромная сеть с миллионами параметров. На этих
    фото огромная сеть ошибается реже, а на новых — чаще. Почему?'
  options:
  - На новых фото другой свет, а простая модель от освещения не зависит
  - Огромной сети не хватило параметров, чтобы запомнить все детали
  - Сложные модели всегда работают на новых данных хуже простых
  - Огромная сеть подстроилась под мелочи этих 500 фото вместо общей закономерности
  answer: 3
  explain: Это переобучение. Чем сложнее модель, тем больше ей нужно примеров. На 500 фото огромная сеть зазубрила их, а
    на миллионах примеров могла бы обогнать простую.
- id: labels-in-data
  type: multi
  q: В каких задачах правильные ответы уже есть в самих данных, и размечать вручную ничего не нужно? Выберите все верные.
  options:
  - Предсказать следующее слово в письме
  - Определить породу собаки по фотографии
  - Угадать слово, которое закрыли в середине предложения
  - Оценить, вежливо ли чат-бот ответил клиенту
  answer:
  - 0
  - 2
  explain: Следующее и закрытое слово уже записаны в самом тексте. Породу собаки и вежливость ответа должен определить
    человек — как подписи ImageNet или оценки людей при дообучении ChatGPT.
- id: dirty-data
  type: single
  q: Модель, которая оценивает товары, обучили на миллионе отзывов, и треть из них — накрученные пятёрки. Чего ожидать?
  options:
  - Миллион — это много, и накрутка усреднится сама
  - Модель может перенять перекос и завышать оценки товаров
  - Модель распознает накрутку, ведь она видела и честные отзывы
  - Модель переобучится и станет зазубривать каждый отзыв
  answer: 1
  explain: Модель учится тому, что есть в данных, включая перекосы. Объём не спасает от грязи. Переобучение — другая беда,
    она про сложность модели и число примеров.
- id: gpu-why
  type: single
  q: Какую задачу видеокарта ускорит сильнее всего по сравнению с обычным процессором?
  options:
  - Вычислить сложный процент по вкладу за 30 лет, где каждый год считается от предыдущего
  - Посчитать новую яркость каждой из миллиона точек фотографии по одной формуле
  - Пройти цепочку правил «если — то», где каждое следующее зависит от ответа предыдущего
  - Выполнить одно сложное вычисление, которое нельзя разбить на части
  answer: 1
  explain: Видеокарта сильна, когда простых вычислений много и они не зависят друг от друга. Яркость каждой точки считается
    отдельно. Остальные задачи идут по очереди, и тысячи «школьников» там не помогут.
- id: algo-role
  type: single
  q: Две команды получили одинаковые данные и одинаковые видеокарты. Первая знает приёмы, которые помогают глубоким сетям
    обучаться быстрее и меньше переобучаться, вторая — нет. Что следует из темы?
  options:
  - У второй команды большая сеть может так и не обучиться, хотя данные и видеокарты те же
  - Разницы не будет — всё решают данные и вычисления
  - Первая команда обойдётся гораздо меньшим числом примеров без всякого риска переобучения
  - Вторая команда восполнит отставание, если купит вдвое больше видеокарт
  answer: 0
  explain: Данные и вычисления — топливо, алгоритмы — двигатель. Без этих приёмов большие сети просто не обучались бы.
    Риск переобучения приёмы уменьшают, но не убирают.
- id: bitter-lesson
  type: single
  q: Разработчики шахматной программы годами вписывали в неё советы гроссмейстеров. Конкурент взял общий метод, который
    учится на сыгранных партиях, и дал ему в десять раз больше вычислений. Что предсказывает «горький урок»?
  options:
  - Советы гроссмейстеров надёжнее, ведь за ними опыт лучших игроков
  - Победит тот, у кого больше вычислений, даже если программа ничему не учится
  - Со временем программа, которая учится на партиях, обойдёт программу с советами
  - Знания людей в машинном обучении вредны, и вкладывать их нельзя никогда
  answer: 2
  explain: По Саттону, общие обучаемые методы с ростом вычислений обходят ручные знания. Вычисления помогают тем, кто учится.
    И это мнение, а не закон, — запрета на знания людей из него не следует.
- id: old-methods
  type: single
  q: Банк хочет по таблице с данными клиентов — доход, возраст, просрочки — предсказывать, вернёт ли клиент кредит. Какой
    вывод из истории ИИ здесь разумен?
  options:
  - Взять языковую модель — её обучали на самых больших данных, значит она сильнее
  - Записать правила кредитных экспертов — ручные знания со временем обходят обучение
  - Начать с бустинга — для таблиц он и сейчас один из лучших методов
  - Отказаться от бустинга — после 2012 года нейросети вытеснили старые методы
  answer: 2
  explain: Старое не умирает. Бустинг остаётся одним из лучших инструментов для таблиц, а выбор метода — инженерное решение
    под задачу.
- id: hype-cycle
  type: single
  q: Компания объявляет, что через год её модель заменит всех врачей. Какой вывод из истории ИИ здесь уместен?
  options:
  - Сегодняшний подъём опирается на настоящие результаты, значит обещание сбудется
  - Дважды громкие обещания сменялись зимой — стоит отделять, что модель умеет, от того, что о ней говорят
  - Значит, скоро придёт новая зима, и вкладываться в ИИ не стоит
  - Модели уже неотличимы от людей в переписке, значит медицину они понимают
  answer: 1
  explain: Настоящие результаты есть, но обещания от этого сами не сбываются. История учит не верить и не отвергать вслепую,
    а проверять. Неотличимость в переписке не доказывает понимания.
  traps:
  - 0
- id: open-ingredients
  type: open
  q: Объясните, как каждый из трёх ингредиентов — данные, вычисления, алгоритмы — повлиял на прорыв глубокого обучения. Почему
    ни одного из них по отдельности не хватило бы?
  rubric:
  - данные — большие наборы примеров (например, ImageNet или тексты интернета); большой модели нужно много примеров, чтобы
    не переобучиться
  - вычисления — видеокарты выполняют тысячи простых операций одновременно, поэтому большую сеть стало можно обучить за
    разумное время
  - алгоритмы — например, обратное распространение, глубокие сети, трансформер, приёмы против переобучения; они позволяют
    извлечь пользу из данных и вычислений
  - объяснено, почему нужно сочетание — например, большая модель без данных переобучится, а без вычислений не обучится за
    разумное время
  wrong_answers:
  - всё решили видеокарты, остальное не важно
  - нейросети изобрели только в 2012 году
  followups:
  - Что было бы, если бы у исследователей 1986 года был ImageNet, но не было видеокарт?
  - Почему языковым моделям не нужна ручная разметка?
  explain: Страницы «Данные», «Вычисления» и «Алгоритмы» этой темы.
