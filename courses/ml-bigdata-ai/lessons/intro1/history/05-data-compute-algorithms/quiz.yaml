title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: three-ingredients
  type: multi
  q: Какие три ингредиента вместе сделали возможным прорыв нейросетей? Выберите все.
  options:
  - Большие наборы данных
  - Правила, записанные экспертами для каждой задачи
  - Дешёвые вычисления, которые можно делать одновременно
  - Отказ от проверки моделей на новых данных
  - Алгоритмы, способные использовать данные и вычисления
  answer:
  - 0
  - 2
  - 4
  explain: Данные, вычисления и алгоритмы. Ручные правила — как раз то, от чего история уходила.
- id: why-not-1986
  type: single
  q: Обучать многослойные сети умели с 1986 года. Почему же прорыв случился только в 2012-м?
  options:
  - Обратное распространение ошибки тогда давало неверные поправки весов
  - В 2012 году придумали модель, совсем не похожую на прежние сети
  - Сети 1980-х не умели проводить сложные границы между классами
  - Не хватало больших размеченных данных и мощности, чтобы обучать большие сети
  answer: 3
  explain: Устройство AlexNet в главном похоже на сети 1980-х. Новыми были масштаб данных и вычисления на видеокартах.
- id: data-overfit
  type: single
  q: Почему модели с миллионами параметров нужно много примеров?
  options:
  - На малом числе примеров она легко зазубрит их, а не уловит закономерность
  - Иначе она обучается слишком медленно
  - Каждому параметру нужен свой отдельный пример
  - Иначе её параметры не поместятся в память компьютера
  answer: 0
  explain: Чем сложнее модель, тем выше риск переобучения на малых данных. Больше разнообразных примеров — лучше обобщение.
- id: data-sources
  type: multi
  q: Что сделало большие данные доступными? Выберите все.
  options:
  - Интернет с миллиардами страниц текста
  - Отказ от разметки в задачах распознавания картинок
  - Смартфоны, с которых люди выкладывают фотографии
  - Записи о покупках в онлайн-магазинах и по банковским картам
  answer:
  - 0
  - 2
  - 3
  explain: Оцифровка жизни дала примеры. Картинки для ImageNet при этом подписывали люди — без правильных ответов модель
    не узнает, что на картинке.
  traps:
  - 1
- id: dirty-data
  type: single
  q: Модель обучили на огромном наборе отзывов, в котором много спама и ошибок. Чего ожидать?
  options:
  - Большой объём сам по себе гарантирует хорошее качество
  - Модель сама отфильтрует спам, потому что он ей не нравится
  - Модель может перенять ошибки и перекосы этих данных
  - Модель откажется обучаться на таких данных
  answer: 2
  explain: Модель учится тому, что есть в данных. Грязные данные — грязная модель, сколько бы их ни было.
- id: gpu-why
  type: single
  q: Нужно перемножить миллион пар чисел, и каждое произведение не зависит от остальных. Почему видеокарта справится с этим
    быстрее обычного процессора?
  options:
  - Видеокарта умнее процессора и находит короткий путь к ответу
  - Видеокарта выполняет тысячи таких простых операций одновременно
  - Видеокарта пропускает умножения, ответ которых легко угадать
  - Видеокарты с самого начала создавали для таких расчётов в ИИ
  answer: 1
  explain: Сила видеокарты — в одновременности. Обучение нейросети тоже состоит из множества простых независимых операций,
    поэтому и перешло на видеокарты. Придумали их для игровой графики.
- id: algo-role
  type: single
  q: Какова роль алгоритмов среди трёх ингредиентов?
  options:
  - Алгоритмы не важны — всё решают данные и вычисления
  - Они заменяют данные, когда примеров мало
  - Они позволяют модели действительно извлечь пользу из данных и вычислений
  - Они нужны только для того, чтобы ускорить загрузку данных
  answer: 2
  explain: Без обратного распространения, удачных архитектур и приёмов против переобучения данные и видеокарты ничего бы
    не дали.
- id: bitter-lesson
  type: single
  q: Какую мысль выражает «горький урок»?
  options:
  - Правила, записанные экспертами, в итоге всегда надёжнее обучения
  - Для каждой задачи нужно придумывать свои особые правила и признаки
  - Общие методы, обучаемые на данных, со временем обходят вручную вложенные знания
  - Рост вычислений сам по себе, без обучения, решает любые задачи ИИ
  answer: 2
  explain: Ручные знания о задаче раз за разом проигрывали общим обучаемым методам при росте вычислений. Это мнение, а не
    закон, но оно хорошо подводит итог раздела.
- id: old-methods
  type: single
  q: Банк хочет по таблице с данными клиентов предсказывать, вернёт ли клиент кредит. Какой вывод из истории ML здесь
    разумен?
  options:
  - Стоит рассмотреть бустинг — он остаётся одним из лучших методов для таблиц
  - Нужна языковая модель — её обучали на самых больших данных
  - Лучше вернуться к экспертной системе — она надёжнее любой модели
  - Подойдёт только самая большая нейросеть, всё остальное устарело
  answer: 0
  explain: Новые методы не отменяют старые. Выбор метода — инженерное решение под задачу и данные.
- id: open-ingredients
  type: open
  q: Объясните, как каждый из трёх ингредиентов — данные, вычисления, алгоритмы — повлиял на прорыв глубокого обучения. Почему
    ни одного из них по отдельности не хватило бы?
  rubric:
  - данные — большие размеченные наборы (ImageNet) и тексты, где ответ берётся из самого текста; большим моделям нужно много
    примеров, чтобы не переобучиться
  - вычисления — видеокарты выполняют тысячи простых операций одновременно, поэтому большую сеть стало можно обучить за несколько дней
  - алгоритмы — обратное распространение, глубокие сети, трансформер, приёмы против переобучения
  - объяснено, почему нужно сочетание — например, большая модель без данных переобучится, а без вычислений не обучится за
    разумное время
  wrong_answers:
  - всё решили видеокарты, остальное не важно
  - нейросети изобрели только в 2012 году
  followups:
  - Что было бы, если бы у исследователей 1986 года был ImageNet, но не было видеокарт?
  - Почему языковым моделям не нужна ручная разметка?
  explain: Страницы «Данные», «Вычисления» и «Алгоритмы» этой темы.
