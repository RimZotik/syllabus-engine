title: Контрольная раздела «Краткая история»
pass: 0.85
minutes: 35
questions:
- id: s-thread
  type: single
  q: Какое описание истории ИИ из этого раздела точнее всего?
  options:
  - Рост мощности компьютеров, при котором методы с 1958 года в главном не менялись
  - Переход от правил, написанных людьми, к обучению на данных, после которого правила вышли из употребления
  - Смена моделей — перцептрон, бустинг, нейросети, — где каждая следующая отменила предыдущую
  - Переход от правил, написанных людьми, к обучению на данных; правила остались там, где они просты и точны
  answer: 3
  explain: Линия раздела — от правил к обучению. Но старое не умирает — правила и бустинг работают и сегодня.
  traps:
  - 1
- id: s-turing-test
  type: single
  q: Чат-бот поддержки так отвечает клиентам, что они в переписке не могут понять, человек это или программа. Что из этого
    следует?
  options:
  - Чат-бот по-настоящему понимает проблемы клиентов
  - Чат-бот выдержал бы проверку поведения в переписке, но понимания это не доказывает
  - Чат-бот отвечает без ошибок, иначе клиенты бы его раскусили
  - Чат-бот работает по правилам, написанным экспертами
  answer: 1
  explain: Тест Тьюринга проверяет только неотличимость в разговоре — не понимание, не безошибочность и не то, как программа
    устроена внутри.
- id: s-child-machine
  type: single
  q: Какая идея Тьюринга ближе всего к машинному обучению?
  options:
  - Любое вычисление по чёткому алгоритму можно разложить на шаги машины с лентой
  - Спор о том, может ли машина мыслить, заменить проверкой поведения в переписке
  - Один компьютер может стать плеером или редактором — в зависимости от загруженной программы
  - Не вписывать знания вручную, а построить машину, которая учится, как ребёнок
  answer: 3
  explain: Все варианты — идеи Тьюринга, но к обучению на примерах ведёт именно «машина-ребёнок».
- id: s-perceptron-ml
  type: multi
  q: Какие утверждения о перцептроне верны? Выберите все верные.
  options:
  - Его веса — это параметры модели, которые подбираются по примерам
  - Он сдвигает веса после каждого примера, даже угаданного
  - Если дать достаточно примеров, он выучит любую закономерность
  - Он проводит между классами только прямую границу
  - Ошибившись, он сдвигает веса в сторону правильного ответа
  answer:
  - 0
  - 3
  - 4
  explain: Угадал — веса не трогает, ошибся — сдвигает к правильному ответу. Это настоящая обучаемая модель, но слишком
    простая — исключающее ИЛИ она не выучит ни на каких данных.
  traps:
  - 1
- id: s-xor-new
  type: single
  q: 'Сигнализация должна срабатывать, только если открыта ровно одна из двух дверей: открыты обе или закрыты обе — молчать.
    Справится ли с этим один перцептрон?'
  options:
  - Да, если дать ему очень много примеров
  - Да, если подобрать подходящие веса и порог
  - Нет, двери — не числа, а перцептрону нужны числа
  - Нет, случаи «сработать» и «молчать» здесь не разделить одной прямой
  answer: 3
  explain: Это исключающее ИЛИ, как с лампой и двумя выключателями. Двери можно записать числами 0 и 1, но никакие веса
    и порог не дадут нужной прямой. Нужна сеть из нескольких слоёв.
- id: s-winters
  type: single
  q: Что общего у причин первой и второй «зимы» ИИ?
  options:
  - Обещания сильно опередили результаты, и в подход разочаровались
  - Обе вызвала нехватка мощности компьютеров
  - Обе вызвал один и тот же метод — перцептрон
  - В обоих случаях отказались от правил ради обучения на примерах
  answer: 0
  explain: Первая — после неоправданных надежд на перцептрон, вторая — после бума экспертных систем. Экспертные системы
    упёрлись не в мощность компьютеров, а в сам подход.
- id: s-expert-dead-end
  type: single
  q: Служба доставки записала в программу 300 правил опытных диспетчеров — как распределять заказы. Через год открылись
    новые районы и появились новые виды доставки. Чего ждать по опыту экспертных систем?
  options:
  - Система сама выведет новые правила из заказов, накопленных за год
  - Система начнёт тормозить на новых районах, и её спасёт более мощный компьютер
  - Новые правила придётся вписывать вручную, а на непривычных заказах система будет ошибаться
  - Ничего не изменится — правила опытных диспетчеров не устаревают
  answer: 2
  explain: Правила хрупкие, требуют ручной поддержки, а сама система не учится на новых случаях. Дело не в мощности компьютера.
- id: s-generalization
  type: single
  q: Сложная модель почти не ошибается на квартирах из обучающей выборки, а на новых объявлениях ошибается сильно. Что
    посоветовала бы статистическая теория обучения?
  options:
  - Взять модель ещё сложнее, чтобы она точнее запомнила примеры
  - Взять модель попроще или собрать больше примеров
  - Проверять модель только на квартирах из обучающей выборки
  - Отказаться от обучения и записать правила оценщиков
  answer: 1
  explain: Чем сложнее модель, тем больше примеров ей нужно, чтобы обобщать, а не зазубривать. Значит, либо упростить
    модель, либо дать ей больше данных.
- id: s-boosting
  type: single
  q: Магазин прогнозирует спрос градиентным бустингом. Первая модель сказала «120 пачек», а продали 150. Чему будет учиться
    вторая модель?
  options:
  - Предсказывать спрос заново, не глядя на первую
  - Решать, какой из двух моделей верить, и отбрасывать другую
  - Повторять ответ первой, но округлять его точнее
  - Предсказывать ошибку первой — недобор в 30 пачек
  answer: 3
  explain: В градиентном бустинге каждая следующая модель учится на том, что не исправили предыдущие, а ответ — сумма всех.
    Как с ценой квартиры — 7 млн плюс поправка в 1 млн.
- id: s-2012
  type: single
  q: Что из этого к 2012 году было уже НЕ новым?
  options:
  - Набор из миллионов подписанных картинок
  - Многослойная сеть, которую обучают обратным распространением ошибки
  - Обучение большой сети на игровых видеокартах
  - Отрыв в распознавании картинок, в разы больший обычного
  answer: 1
  explain: Многослойные сети с обратным распространением ошибки известны с 1986 года. Новыми были ImageNet, видеокарты
    и результат, который они дали.
- id: s-deep-features
  type: single
  q: Программа ищет номера машин на снимках по признакам, которые описал инженер, — прямоугольник, контраст, высота символов.
    Какое изменение ближе всего к идее глубокого обучения?
  options:
  - Добавить ещё десяток признаков от опытных инженеров
  - Записать правила распознавания для каждой буквы и цифры
  - Дать сети много подписанных снимков, чтобы она сама нашла, на что смотреть
  - Заменить программу одним перцептроном, который сам найдёт признаки
  answer: 2
  explain: Глубокая сеть сама находит признаки, от простых к сложным. Один перцептрон признаков не ищет — он только взвешивает
    те, что ему дали.
- id: s-transformer
  type: single
  q: Нужно обучить модель на тексте всей Википедии. Почему трансформер для этого удобнее сети, которая читает слово за словом?
  options:
  - Он пропускает неважные слова и потому обрабатывает меньше текста
  - Ему не нужны правильные ответы, а прежней сети нужны
  - Ему не нужно ждать предыдущего слова, и видеокарта считает все слова сразу
  - Он хранит более длинную сжатую память о прочитанном
  answer: 2
  explain: Обе сети можно учить предсказывать следующее слово — ответы берутся из текста. Разница в устройстве. Внимание
    обрабатывает слова одновременно, а это хорошо ложится на видеокарты.
- id: s-lm-labels
  type: single
  q: Почему языковые модели могли учиться на огромной части текстов интернета, а ImageNet пришлось подписывать людям?
  options:
  - Тексты в интернете проверены экспертами, а картинки — нет
  - Языковым моделям правильные ответы вообще не нужны
  - Текстов в интернете больше, чем картинок, и подписывать их некому
  - В тексте ответ — следующее слово — уже записан, а что на картинке, должен сказать человек
  answer: 3
  explain: Задача «предскажи следующее слово» берёт ответы из самого текста. Языковая модель учится на примерах с ответами,
    просто их не нужно подписывать.
- id: s-chatgpt-dialog
  type: single
  q: Языковая модель пишет грамотные тексты, но на просьбу «составь список покупок» продолжает её как начало рассказа. Чего
    ей не хватает?
  options:
  - Ещё большего объёма текстов для предсказания следующего слова
  - Механизма внимания вместо пословного чтения
  - Дообучения на диалогах, а затем на оценках, которые люди ставят её ответам
  - Правил, которые программисты пишут для каждого вида просьбы
  answer: 2
  explain: Продолжать текст — ещё не значит выполнять просьбу. Этому ChatGPT научили дообучением на диалогах и обучением
    с подкреплением, где наградой была оценка человека.
- id: s-perceptron-chatgpt
  type: multi
  q: Что общего у перцептрона 1958 года и ChatGPT? Выберите все верные.
  options:
  - Оба — модели с параметрами, которые подбираются при обучении
  - Оба могут ошибаться на новых случаях
  - Оба учились на оценках, которые люди давали их ответам
  - Оба проводят между классами одну прямую
  - Оба — пример обучения на данных, а не правил, записанных человеком
  answer:
  - 0
  - 1
  - 4
  explain: Ни один прорыв не отменил старых идей — это всё модели с параметрами, обученные на примерах. Перцептрон учился
    на примерах с готовыми ответами, а не на оценках людей.
- id: s-ingredients
  type: multi
  q: Какие утверждения о данных, вычислениях и алгоритмах верны? Выберите все верные.
  options:
  - Большой модели нужно много примеров, иначе она зазубрит обучающую выборку
  - Если данных очень много, их качество уже не важно
  - Видеокарта полезна там, где много простых вычислений не зависят друг от друга
  - Без подходящих алгоритмов данные и видеокарты не дали бы прорыва
  answer:
  - 0
  - 2
  - 3
  explain: Модель перенимает ошибки и перекосы данных, поэтому их качество важно при любом объёме.
- id: s-open-story
  type: open
  q: Расскажите историю ИИ из этого раздела как историю одной проблемы — по шагам «привычный мир, проблема, попытки, тупик,
    решение, новый мир». На каждом шаге назовите хотя бы один пример.
  rubric:
  - привычный мир — компьютер исполняет правила, написанные человеком (например, машина Тьюринга)
  - проблема — знаний для «умной» машины слишком много или их не сформулировать правилами
  - попытки и тупик — например, перцептрон (слишком простая модель), экспертные системы (правила не масштабируются),
    две зимы ИИ
  - решение — обучение на данных; пример — статистическая теория обучения, бустинг или глубокие сети
  - новый мир — например, модели, которые узнают картинки или ведут диалог
  wrong_answers:
  - нейросети придумали в 2012 году
  - экспертные системы проиграли из-за медленных компьютеров
  followups:
  - Какой шаг этой истории, по-вашему, мог бы повториться — например, новая «зима»?
  - Где в этой истории впервые появляется идея обучения на примерах?
  explain: Страница «История целиком» последней темы раздела.
- id: s-open-choose
  type: open
  q: 'Вам нужно решить две задачи: проверять, что сумма скидки посчитана по тарифу, и предсказывать, уйдёт ли клиент
    от банка, по таблице из 30 признаков. Какие подходы из истории ИИ вы бы выбрали для каждой и почему?'
  rubric:
  - для скидки — обычное правило в программе, потому что закономерность известна и точна
  - для ухода клиента — обучение на примерах (например, бустинг, сильный на таблицах), потому что закономерность вручную
    не записать, а примеры есть
  wrong_answers:
  - для любой задачи нужна самая большая нейросеть
  - для ухода клиента лучше всего экспертная система
  followups:
  - Что изменится, если вместо таблицы у вас будут записи разговоров с клиентами?
  - Почему для скидки не нужно обучение?
  explain: Темы про бустинг и про три ингредиента, а также первая тема курса о выборе между правилами и обучением.
