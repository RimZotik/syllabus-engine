title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: request-to-task
  type: multi
  q: Руководитель фитнес-клуба просит «ИИ, чтобы клиенты продлевали абонементы». Что нужно выяснить, прежде чем строить модель?
    Выберите все подходящие.
  options:
  - Что именно предсказываем — например, продлит ли клиент абонемент в ближайший месяц
  - Что клуб сделает с прогнозом — например, кому и что предложит
  - Как измерим, что продлений действительно стало больше
  - Какая нейросеть сейчас самая популярная
  answer:
  - 0
  - 1
  - 2
  explain: Просьбу бизнеса переводят в конкретный прогноз, действие по нему и метрику. Выбор модели — далеко не первый шаг.
- id: pipeline-order
  type: single
  q: В каком порядке обычно проходит проект с моделью?
  options:
  - Модель → данные → проблема → внедрение → метрика → мониторинг
  - Данные → модель → внедрение → проблема → мониторинг → метрика
  - Проблема → данные → модель → метрика → внедрение → мониторинг
  - Проблема → модель → внедрение → данные → метрика → мониторинг
  answer: 2
  explain: Сначала понимают проблему и данные, потом строят и оценивают модель, внедряют и следят за ней. На любом шаге можно
    вернуться назад.
- id: monitoring-why
  type: single
  q: Модель прогноза спроса год назад работала отлично, а теперь ошибается всё чаще, хотя её код не меняли. Какое объяснение
    самое вероятное?
  options:
  - Модель со временем «устала» от постоянной работы
  - Поведение покупателей и данные изменились, а модель училась на старых
  - Модель без участия людей сама дообучилась на новых данных и сбилась
  - Год назад модель неправильно оценили, и она всегда была плохой
  answer: 1
  explain: Мир меняется, данные становятся не похожи на те, на которых модель училась, и она устаревает. Поэтому нужны мониторинг
    и переобучение.
  traps:
  - 2
- id: two-metrics
  type: single
  q: Зачем в проекте с моделью смотрят и на метрику модели, и на метрику бизнеса?
  options:
  - Метрику бизнеса считают для отчёта, а решения принимают только по метрике модели
  - Метрика модели измеряет деньги, а метрика бизнеса — долю верных прогнозов
  - Это одно и то же число, только названное для разных слушателей по-разному
  - Точная модель ещё не гарантирует пользы — деньги, клиенты или время могут не измениться
  answer: 3
  explain: Модель может хорошо угадывать на отложенных данных и при этом ничего не менять для бизнеса — например, если на
    прогноз нечем ответить.
- id: task-types
  type: multi
  q: Выберите верные сопоставления задач и типов.
  options:
  - Поиск групп похожих клиентов, когда групп заранее никто не знает, — классификация
  - Прогноз, сколько поездок закажут в такси в каждом районе в следующий час, — регрессия
  - Решение, мошеннический ли перевод, — классификация
  - Порядок товаров в выдаче по запросу «кроссовки» — ранжирование
  answer:
  - 1
  - 2
  - 3
  explain: Число — регрессия, «да / нет» — классификация, порядок — ранжирование. Группы, которых заранее нет, ищет кластеризация.
- id: churn-ab
  type: single
  q: Банк звонит клиентам, которых модель отметила как готовых уйти, и предлагает лучшие условия. Как надёжнее всего узнать,
    помогают ли звонки?
  options:
  - Разделить список на две группы, позвонить только одной и сравнить отток в группах
  - Посмотреть, насколько точно модель угадывает, кто из клиентов уйдёт
  - Спросить менеджеров, довольны ли клиенты разговором и новыми условиями
  - Сравнить общий отток в этом году с оттоком в прошлом году
  answer: 0
  explain: Это A/B-тест. Точность модели не говорит, помогает ли звонок, а сравнение с прошлым годом смешивает эффект звонков
    со всем, что изменилось за год.
- id: metric-what
  type: single
  q: Две модели прогноза спроса нужно сравнить и выбрать лучшую. Что в проекте называют метрикой?
  options:
  - Список признаков, на которых обучали модель
  - Число, по которому оценивают и сравнивают решения
  - Самое простое правило, с которым сравнивают модели
  - Постоянное наблюдение за моделью после запуска
  answer: 1
  explain: Метрика — число для сравнения решений, например доля верных прогнозов или деньги. Простое правило для сравнения — базовое
    решение, а наблюдение после запуска — мониторинг.
- id: no-ml
  type: multi
  q: В каких случаях разумно обойтись без машинного обучения? Выберите все подходящие.
  options:
  - Интернет-магазин открылся вчера, истории заказов ещё нет
  - Скидка 5 % положена всем, кто купил больше чем на 10 000 ₽ за год
  - Нужно находить спам в письмах, приёмы спамеров постоянно меняются
  - Правило «показывать самые популярные товары» почти не уступает сложной модели
  answer:
  - 0
  - 1
  - 3
  explain: Нет данных, правило известно и простое, простое решение уже почти идеально — модель не нужна. Спам с меняющимися
    приёмами — как раз задача для обучения.
- id: baseline
  type: single
  q: Зачем в начале проекта строят простое базовое решение, например «завтра продадим столько же, сколько неделю назад»?
  options:
  - Чтобы было с чем сравнивать модели и понять, стоит ли сложность затрат
  - Чтобы показать заказчику, что задача слишком лёгкая
  - Чтобы модель потом училась на его прогнозах как на правильных ответах
  - Чтобы сразу внедрить его вместо модели навсегда
  answer: 0
  explain: Базовое решение — мерило. Если модель обгоняет его едва заметно, её разработка и поддержка могут не окупиться.
- id: llm-docs
  type: single
  q: Компания хочет, чтобы готовая языковая модель извлекала из договоров сумму и срок оплаты. Что важнее всего сделать перед
    запуском?
  options:
  - Обучить свою языковую модель с нуля на договорах компании
  - Собрать набор договоров с правильными ответами и измерить, как часто модель ошибается
  - Выбрать самую новую модель — она не ошибается в таких задачах
  - Убрать проверку человеком, чтобы ускорить работу
  answer: 1
  explain: Готовая языковая модель может уверенно ошибаться; качество измеряют на проверочном наборе. Обучать модель с нуля для такой
    задачи обычно не нужно.
- id: task-open
  type: open
  q: 'Сеть аптек хочет «с помощью ИИ уменьшить списания просроченных лекарств». Пройдите путь задачи: что предсказываем и какой
    это тип задачи, какие нужны данные, какое простое базовое решение можно сделать без ML, как измерить пользу и за чем следить
    после запуска.'
  rubric:
  - прогноз сформулирован конкретно — например, сколько упаковок каждого лекарства продадут в каждой аптеке за неделю; тип —
    регрессия
  - названы данные — история продаж, остатки, сроки годности, сезонность или праздники
  - предложено базовое решение без ML — например, «как на прошлой неделе» или среднее за месяц
  - названа метрика бизнеса — объём списаний и нехватки товара, а не только точность прогноза
  - упомянут мониторинг — спрос меняется (эпидемии, новые препараты), модель нужно проверять и переобучать
  wrong_answers:
  - модель сама уменьшит списания, и ничего делать с прогнозом не нужно
  - это задача кластеризации, потому что аптек много
  followups:
  - Какая ошибка дороже — заказать слишком много или слишком мало? Как это повлияет на выбор метрики?
  - В каком случае вы бы остались на базовом решении?
  explain: Сравните с разбором про отток и с таблицей типичных задач.
