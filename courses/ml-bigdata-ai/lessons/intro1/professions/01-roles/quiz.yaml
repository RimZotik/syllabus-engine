title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: analyst-role
  type: single
  q: Продажи в одном из регионов упали, и руководитель хочет понять, когда это началось и в каких группах покупателей. Чья это
    задача в первую очередь?
  options:
  - Аналитика данных
  - MLOps-инженера
  - AI-инженера
  - Инженера данных
  answer: 0
  explain: Ответить цифрами на вопрос «что произошло и почему» — главная задача аналитика. Инженер данных готовит данные,
    но выводы из них не делает.
- id: ds-vs-analyst
  type: single
  q: Чем работа дата-сайентиста обычно отличается от работы аналитика данных?
  options:
  - Дата-сайентист не пишет SQL, а аналитик не пишет на Python
  - Дата-сайентист чаще строит модели, чтобы предсказать будущее и выбрать действие
  - Аналитик — это начальная ступень, после которой становятся дата-сайентистом
  - Аналитик работает только с отчётами, которые ему присылают другие
  answer: 1
  explain: Грубая граница — «что было и почему» против «что будет и что делать». Это разные специализации, а не ступени
    одной лестницы, и обе используют SQL и Python.
- id: mle-role
  type: single
  q: Дата-сайентист в эксперименте построил модель, которая хорошо угадывает спрос. Теперь она должна каждый день сама считать
    прогнозы для всех магазинов и не падать. Кто прежде всего за это отвечает?
  options:
  - Аналитик данных
  - Инженер данных
  - ML-инженер
  - AI-инженер
  answer: 2
  explain: Довести модель до работы внутри продукта — надёжно, быстро, по расписанию — основная задача ML-инженера.
- id: ai-engineer
  type: multi
  q: Что верно описывает работу AI-инженера? Выберите все подходящие.
  options:
  - Строит продукты на основе готовых больших языковых моделей
  - Обычно сам обучает языковую модель с нуля на своих данных
  - Создаёт системы, где модель отвечает с опорой на найденные документы компании
  - Собирает проверочные примеры и измеряет, стала ли система лучше
  - Отвечает за ночную загрузку данных из приложения в хранилище
  answer:
  - 0
  - 2
  - 3
  explain: AI-инженер строит систему вокруг готовой языковой модели и измеряет её качество. Обучение большой модели с нуля
    стоит огромных денег и редко входит в его работу; загрузка данных — зона инженера данных.
  traps:
  - 1
- id: de-role
  type: single
  q: Что в первую очередь сдаёт как результат инженер данных?
  options:
  - Выводы для руководства о том, почему и где упали продажи
  - Модель, которая заранее предсказывает, кто из клиентов уйдёт
  - Чат-ассистента, который отвечает клиентам по документам компании
  - Регулярную доставку чистых свежих данных из источников в хранилище
  answer: 3
  explain: Регулярная доставка чистых данных в хранилище — продукт инженера данных; им пользуются все остальные роли.
- id: mlops-role
  type: single
  q: В компании сорок моделей, каждую переобучают и выкатывают вручную, а о падении качества узнают от недовольных клиентов.
    Какой специалист нужен прежде всего?
  options:
  - MLOps-инженер
  - Ещё один аналитик данных
  - AI-инженер
  - Дата-сайентист, который построит модели точнее
  answer: 0
  explain: Автоматическое переобучение, выкатка и мониторинг моделей — это задачи MLOps.
- id: titles-differ
  type: single
  q: В вакансии «Data Scientist» требуется писать SQL-запросы, строить отчёты и проверять, сработали ли изменения в продукте.
    Какой вывод разумнее всего?
  options:
  - Это ошибка в вакансии — дата-сайентисты такими задачами не занимаются
  - Это вакансия для ML-инженера
  - По сути это работа аналитика данных, хотя должность называется иначе
  - Без опыта в нейросетях на неё не стоит откликаться
  answer: 2
  explain: Названия должностей у компаний разные; о содержании работы говорит список задач.
- id: handoff
  type: single
  q: Дата-сайентист проверил модель и рекомендует её внедрить. Кому он обычно передаёт её дальше и зачем?
  options:
  - Аналитику данных — чтобы тот построил по ней отчёт для руководства
  - ML-инженеру — чтобы модель надёжно заработала в продакшене
  - Инженеру данных — чтобы тот сложил модель в хранилище данных
  - AI-инженеру — чтобы тот заменил её готовой языковой моделью
  answer: 1
  explain: Цепочка ролей — данные → модель → продакшен. Довести проверенную модель до работы в продукте — задача ML-инженера.
- id: company-size
  type: single
  q: Как размер компании обычно влияет на роли?
  options:
  - В маленькой компании роли уже, потому что каждый отвечает только за своё
  - В большой компании один человек ведёт проект целиком — от данных до продакшена
  - В маленькой компании один человек часто совмещает несколько ролей, а в большой роли уже
  - Размер компании на роли не влияет — они везде устроены одинаково
  answer: 2
  explain: В стартапе один человек может быть и аналитиком, и дата-сайентистом; в бигтехе можно годами заниматься одной узкой
    задачей.
- id: roles-open
  type: open
  q: 'Банк хочет запустить модель, которая предсказывает, вернёт ли клиент кредит. Опишите, кто из шести специалистов будет
    участвовать и что сделает каждый: от сбора данных до работы модели в продукте.'
  rubric:
  - инженер данных собирает и доставляет данные об истории кредитов и клиентов
  - дата-сайентист формулирует задачу, строит и проверяет модель
  - ML-инженер встраивает модель в продукт, чтобы она отвечала при каждой заявке
  - MLOps (или ML-инженер) обеспечивает переобучение и мониторинг; аналитик может оценивать эффект на бизнес
  - засчитывается полностью, если цепочка от данных до продакшена описана верно и роли не перепутаны; AI-инженера упоминать
    не обязательно
  wrong_answers:
  - AI-инженер обучает модель оценки заёмщиков с нуля, потому что это искусственный интеллект
  - аналитик данных выкатывает модель в продакшен
  followups:
  - Кто заметит, что модель стала ошибаться через полгода, и как?
  - Как изменится состав участников в стартапе на 15 человек?
  explain: Сравните с цепочкой на первой странице темы и с таблицей «Кто кому передаёт работу».
