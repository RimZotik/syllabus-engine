title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: analyst-role
  type: single
  q: Продажи в одном из регионов упали, и руководитель хочет понять, когда это началось и в каких группах покупателей. Чья это
    задача в первую очередь?
  options:
  - Аналитика данных
  - Дата-сайентиста
  - MLOps-инженера
  - Инженера данных
  answer: 0
  explain: Вопрос о прошлом — «что произошло, когда и у кого». Ответить на него цифрами — главная задача аналитика. Дата-сайентист
    нужен, когда надо предсказать, что будет, и выбрать действие; инженер данных готовит данные, но выводы из них не делает.
- id: ds-vs-analyst
  type: single
  q: Чем работа дата-сайентиста обычно отличается от работы аналитика данных?
  options:
  - Дата-сайентист не пишет SQL, а аналитик не пишет на Python
  - Дата-сайентист больше занят прогнозом — строит модели, чтобы понять, что будет и как на это повлиять
  - Аналитик — это начальная ступень, после которой становятся дата-сайентистом
  - Аналитик отвечает, что было, а дата-сайентист — что будет, поэтому аналитики никогда не строят моделей
  answer: 1
  explain: Грубая граница — «что было и почему» против «что будет и что делать». Но граница размыта, и «никогда» здесь неверно.
    Это разные специализации, а не ступени одной лестницы, и обеим нужны SQL и Python.
  traps:
  - 3
- id: mle-role
  type: single
  q: Дата-сайентист в эксперименте построил модель, которая хорошо угадывает спрос. Теперь она должна каждый день сама считать
    прогнозы для всех магазинов и не падать. Кто прежде всего за это отвечает?
  options:
  - Сам дата-сайентист — раз он её построил
  - Инженер данных
  - ML-инженер
  - AI-инженер
  answer: 2
  explain: Довести модель до работы внутри продукта — надёжно, быстро, по расписанию — основная задача ML-инженера. Дата-сайентист
    передаёт ему проверенную модель; инженер данных доставляет данные, а не запускает модели.
- id: ai-engineer
  type: multi
  q: Что верно описывает работу AI-инженера? Выберите все подходящие.
  options:
  - Берёт уже обученную большую языковую модель и строит вокруг неё продукт
  - Обычно сам обучает языковую модель с нуля на своих данных
  - Создаёт системы, где модель отвечает с опорой на найденные документы компании
  - Собирает проверочные примеры и измеряет, стала ли система лучше
  - Отвечает за ночную загрузку данных из приложения в хранилище
  answer:
  - 0
  - 2
  - 3
  explain: AI-инженер строит систему вокруг готовой языковой модели и измеряет её качество. Обучение большой модели с нуля
    стоит огромных денег и редко входит в его работу; загрузка данных — зона инженера данных.
  traps:
  - 1
- id: de-role
  type: single
  q: Что в первую очередь сдаёт как результат инженер данных?
  options:
  - Выводы для руководства о том, почему и где упали продажи
  - Модель, которая заранее предсказывает, кто из клиентов уйдёт
  - Систему, в которой модели сами обучаются заново по расписанию
  - Ежедневную доставку данных из приложения и сайта в хранилище в едином виде
  answer: 3
  explain: Продукт инженера данных — регулярная доставка чистых данных в хранилище; им пользуются все остальные роли. Система,
    где модели обучаются по расписанию, — работа MLOps-инженера, выводы — аналитика, модели — дата-сайентиста.
- id: mlops-role
  type: single
  q: В компании сорок моделей, каждую вручную обучают заново и выкатывают, а о падении качества узнают от недовольных клиентов.
    Какой специалист нужен прежде всего?
  options:
  - MLOps-инженер
  - Инженер данных, который наладит доставку свежих данных
  - AI-инженер
  - Дата-сайентист, который построит модели точнее
  answer: 0
  explain: Беда не в данных и не в точности моделей, а в ручной работе вокруг них. Автоматическое обучение по расписанию,
    выкатка и слежение за качеством моделей — задачи MLOps.
- id: titles-differ
  type: single
  q: В вакансии «Data Scientist» требуется писать SQL-запросы, строить отчёты и проверять, сработали ли изменения в продукте.
    Какой вывод разумнее всего?
  options:
  - Это ошибка в вакансии — дата-сайентисты такими задачами не занимаются
  - Это вакансия для новичков — с отчётов дата-сайентисты начинают карьеру
  - По сути это работа аналитика данных, хотя должность называется иначе
  - Без опыта в нейросетях на неё не стоит откликаться
  answer: 2
  explain: Названия должностей у компаний разные; о содержании работы говорит список задач. Аналитик — отдельная специализация,
    а не первая ступень дата-сайентиста.
- id: handoff
  type: single
  q: Дата-сайентист проверил модель и рекомендует её внедрить. Кому он обычно передаёт её дальше и зачем?
  options:
  - Аналитику данных — чтобы тот построил по ней отчёт для руководства
  - ML-инженеру — чтобы модель надёжно заработала в продакшене
  - Инженеру данных — чтобы тот сложил модель в хранилище данных
  - AI-инженеру — чтобы тот заменил её готовой языковой моделью
  answer: 1
  explain: Цепочка ролей — данные → модель → продакшен. Довести проверенную модель до работы в продукте — задача ML-инженера.
- id: company-size
  type: single
  q: Вы выбираете между стартапом на 15 человек и крупным банком. Какое ожидание о работе разумно?
  options:
  - В стартапе роли более узкие — людей мало, и каждый отвечает только за своё
  - В банке один человек ведёт проект целиком — от сбора данных до продакшена
  - В стартапе одному человеку может достаться работа сразу нескольких ролей
  - Обязанности определяет название должности, а не размер компании
  answer: 2
  explain: В стартапе один человек может быть и аналитиком, и дата-сайентистом; в бигтехе можно годами заниматься одной узкой
    задачей.
- id: roles-open
  type: open
  q: 'Банк хочет запустить модель, которая предсказывает, вернёт ли клиент кредит. Опишите, кто из шести специалистов будет
    участвовать и что сделает каждый: от сбора данных до работы модели в продукте и её поддержки после запуска.'
  rubric:
  - инженер данных собирает и доставляет данные об истории кредитов и клиентов
  - дата-сайентист формулирует задачу, строит и проверяет модель
  - ML-инженер встраивает модель в продукт, чтобы она отвечала при каждой заявке
  - после запуска MLOps-инженер (или ML-инженер) следит за качеством модели и налаживает её регулярное обучение заново
  - засчитывается полностью, если цепочка от данных до поддержки после запуска описана верно и роли не перепутаны; аналитика
    и AI-инженера упоминать не обязательно
  wrong_answers:
  - AI-инженер обучает модель оценки заёмщиков с нуля, потому что это искусственный интеллект
  - аналитик данных выкатывает модель в продакшен
  followups:
  - Кто заметит, что модель стала ошибаться через полгода, и как?
  - Как изменится состав участников в стартапе на 15 человек?
  explain: Сравните с цепочкой на первой странице темы и с таблицей «Кто кому передаёт работу».
