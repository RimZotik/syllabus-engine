title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: pillar-sql
  type: single
  q: В таблице заказов город покупателя записан то как «СПб», то как «Санкт-Петербург», и модель считает это двумя разными
    городами. Знания какой опоры прежде всего нужны, чтобы это исправить?
  options:
  - Данных
  - Моделей
  - Инфраструктуры
  - Математики
  answer: 0
  explain: Модель здесь ни при чём — она честно учится на том, что ей дали. Привести записи к одному виду — подготовка данных.
- id: pillar-infra
  type: multi
  q: Какие из этих задач относятся к опоре «Инфраструктура»?
  options:
  - Перенести модель с ноутбука туда, где к ней обращаются клиенты
  - Настроить оповещение на случай, если сервис с моделью перестал отвечать
  - Посчитать, в какую сторону сдвинуть параметры, чтобы ошибка уменьшилась
  - Привести все цены в архиве к рублям
  - Заметить, что качество модели падает, и обучить её заново на свежих данных
  answer:
  - 0
  - 1
  - 4
  explain: Направление сдвига параметров — вопрос математики, единые единицы цен — подготовка данных. Запуск модели у пользователей,
    наблюдение за ней и обновление устаревшей модели — инфраструктура.
- id: why-math
  type: single
  q: Компьютер подбирает ручки модели цены сам, без человека. Что ему для этого даёт математика?
  options:
  - Ответ, как изменится площадь квартиры, если чуть повернуть ручку
  - Ответ, вырастет или уменьшится ошибка, если чуть повернуть ручку
  - Готовые значения ручек, при которых ошибка сразу становится нулевой
  - Способ быстро найти среди миллионов квартир самые похожие
  answer: 1
  explain: Обучение — подбор параметров, при котором ошибка как можно меньше. Математика говорит, в какую сторону повернуть
    ручку, и ручки сдвигают понемногу, шаг за шагом. Площадь от ручек не зависит — это признак из данных. Быстрый поиск похожих
    — вопрос алгоритмов, то есть программирования.
  traps:
  - 0
- id: pillar-code
  type: single
  q: Приложение подбирает похожие песни, сравнивая выбранную с каждой из 50 миллионов в каталоге. Советует оно хорошо, но
    ответ идёт полминуты. Нужно найти способ искать, не перебирая весь каталог. Это задача какой опоры?
  options:
  - Математики
  - Инфраструктуры
  - Данных
  - Программирования
  answer: 3
  explain: Модель советует хорошо, данные в порядке — медленный сам способ поиска. Как искать быстро среди огромного числа объектов
    — вопрос алгоритмов, а алгоритмы — часть опоры «Программирование». Более мощный сервер не меняет способ поиска.
- id: honest-check
  type: single
  q: Модель почти не ошибается на обучающих примерах, но плохо оценивает квартиры, которых не видела. Как это понимать?
  options:
  - Модель хорошая — на обучающих примерах она почти не ошибается
  - Модель хорошая, просто новые квартиры оказались необычными
  - Модель плохо обобщает, а судить о ней нужно по новым квартирам
  - Модель недообучена, и её стоит дольше учить на тех же примерах
  answer: 2
  explain: Модель хороша не на обучающих примерах, а на новых данных — это обобщение. Недообученная модель ошибалась бы и на
    обучающих примерах, а здесь она их почти выучила.
- id: small-part
  type: single
  q: Какое утверждение о настоящей ML-системе верно?
  options:
  - Больше всего сил уходит на выбор и обучение модели, остальное второстепенно
  - Больше всего сил уходит не на саму модель, а на данные, запуск и наблюдение
  - Когда модель обучена и проверена, система готова и больше не требует внимания
  - Данные, запуск и наблюдение важны только в компаниях с миллионами клиентов
  answer: 1
  explain: Код самой модели — небольшая часть системы. Без данных, проверок и инфраструктуры она не принесёт пользы.
- id: drift
  type: single
  q: Модель оценки квартир обучили два года назад. Код с тех пор не меняли, но ошибки растут. В чём наиболее вероятная причина?
  options:
  - Модель со временем изнашивается, как деталь машины
  - Сервер стал работать медленнее, и модель считает менее точно
  - Цены сдвинулись, а модель отвечает по закономерностям старых примеров
  - Модель сама дообучилась на неправильных примерах
  answer: 2
  explain: Модель не меняется, но мир меняется. Скорость сервера не влияет на ответ, а сама по себе модель не учится. Поэтому
    за качеством следят и обучают модель заново на свежих данных.
- id: garbage
  type: single
  q: В архиве половина цен записана в рублях, а половина — в тысячах рублей. Что будет, если обучить модель на таких данных
    как есть?
  options:
  - Модель сама заметит разницу и пересчитает цены в рубли
  - Ошибки в разные стороны усреднятся и погасят друг друга
  - Модель примет обе записи за настоящие цены и будет ошибаться незаметно
  - Обучение остановится с сообщением об ошибке в данных
  answer: 2
  explain: Модель не знает, какие данные «правильные», — она учится на том, что ей дали, и выдаёт неверные ответы так же уверенно,
    как верные. Мусор на входе — мусор на выходе.
- id: roles
  type: multi
  q: Какие утверждения о профессиях и опорах верны?
  options:
  - Инженер данных в основном занят данными, кодом и инфраструктурой
  - Аналитик данных в основном опирается на данные и статистику
  - ML-инженер работает только с моделями, а запуском занимаются другие
  - Каждая профессия держится на одной опоре, остальные ей не нужны
  - В разных компаниях границы между ролями проведены по-разному
  answer:
  - 0
  - 1
  - 4
  explain: Каждая профессия опирается на все пять опор, но с разным упором. ML-инженер как раз доводит модель до работы у
    пользователей, а границы ролей размыты — поэтому курс проходит все пять опор.
- id: open-pillars
  type: open
  q: Выберите одну задачу компании, где нужна модель (например, «предсказывать время доставки в приложении»). Опишите, что
    понадобится от каждой из пяти опор, чтобы модель заработала у пользователей и не испортилась со временем. Для опоры «Данные»
    укажите, откуда их взять и что с ними сделать.
  rubric:
  - названы все пять опор — программирование, математика, данные, модели, инфраструктура
  - для каждой опоры указано конкретное действие, связанное именно с выбранной задачей
  - в данных сказано, откуда их взять и что их нужно подготовить
  - в инфраструктуре есть не только запуск, но и наблюдение за моделью или её обновление
  wrong_answers:
  - достаточно обучить модель — остальное неважно
  - опоры перечислены общими словами без связи с задачей
  followups:
  - Какая из опор в вашей задаче, по-вашему, самая трудная и почему?
  - Что случится с вашей моделью через год, если за ней никто не будет следить?
  explain: Вернитесь к примеру с агентством недвижимости на первой странице темы и к таблице пяти опор.
