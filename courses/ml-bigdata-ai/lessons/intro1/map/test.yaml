title: Контрольная раздела «Карта знаний»
pass: 0.85
minutes: 25
questions:
- id: s-data-pillar
  type: multi
  q: Какие задачи относятся к опоре «Данные»?
  options:
  - Достать из базы магазина все покупки клиентов за год
  - Найти и убрать дубли, привести цены к одним единицам
  - Запустить сервис с моделью на сервере
  - Понять, в какую сторону сдвигать параметры модели при обучении
  answer:
  - 0
  - 1
  explain: Запуск сервиса — инфраструктура, направление сдвига параметров — математика. Получить и подготовить данные
    — опора «Данные».
- id: s-infra-pillar
  type: single
  q: Сервис с моделью работает на компьютере разработчика, но на сервере падает. Знания какой опоры помогут?
  options:
  - Математики
  - Моделей
  - Данных
  - Инфраструктуры
  answer: 3
  explain: Сделать так, чтобы модель работала у людей, а не только на ноутбуке, — главный вопрос инфраструктуры.
- id: s-honest
  type: single
  q: Модель кредитного скоринга верно оценила почти всех клиентов из обучающих данных, а на новых клиентах ошибается часто.
    Что важнее всего сделать перед запуском?
  options:
  - Запускать — на обучающих данных она почти не ошибается
  - Купить сервер помощнее, чтобы модель считала точнее
  - Добиться лучшего обобщения и снова честно проверить модель на новых клиентах
  - Убрать из проверки клиентов, на которых она ошибается
  answer: 2
  explain: Модель хороша не на обучающих примерах, а на новых данных. Честная проверка — главное в опоре «Модели».
- id: s-drift
  type: single
  q: Зачем следить за качеством модели в продакшене, если её код не меняется?
  options:
  - Код модели со временем портится сам
  - Меняются мир и данные, и качество модели может незаметно падать
  - Модель сама дообучается и может испортиться
  - Это нужно только для отчётов, на качество это не влияет
  answer: 1
  explain: Модель помнит закономерности старых данных. Когда мир меняется, это нужно вовремя заметить и переобучить модель.
- id: s-derivative
  type: single
  q: Почему в курсе производные изучают раньше, чем обучение моделей?
  options:
  - Производные — самая простая часть математики, с неё удобно начинать
  - Производные нужны, чтобы вычислять признаки объектов перед обучением
  - Так принято в университетах — сначала математика, потом всё остальное
  - Производная показывает, куда сдвигать параметры, чтобы ошибка уменьшалась
  answer: 3
  explain: Параметры сдвигают туда, где ошибка уменьшается, а это направление даёт производная (для многих параметров —
    градиент).
- id: s-prereq
  type: single
  q: В черновике учебного плана тема «Градиент» оказалась раньше темы «Производная». Что с этим не так?
  options:
  - Ничего — порядок тем внутри математики на понимание не влияет
  - Градиент — то же, что производная, только для многих параметров, поэтому без неё его не понять
  - Градиент проще производной, поэтому так даже удобнее
  - Производная нужна только для нейросетей, а градиент — для всех моделей
  answer: 1
  explain: Производная — предпосылка градиента, а тема может опираться только на то, что пройдено раньше неё. Такой план
    не пропустит проверка порядка.
- id: s-sequence
  type: single
  q: «Буду каждый день понемногу заниматься всеми дисциплинами курса сразу». Чем этот план расходится с устройством курса?
  options:
  - Ничем — дисциплины курса и задуманы идти параллельно, как уроки в школе
  - Курс задаёт жёсткое расписание — по часу на каждую дисциплину в день
  - Новые дисциплины идут одна за другой, а вперемешку темы встречаются только в повторении
  - Курс требует сначала пройти всю математику, а остальное потом
  answer: 2
  explain: Последовательный поток позволяет погрузиться в тему и довести её до конца. Смешанные вопросы — задача повторения.
- id: s-math-principle
  type: multi
  q: Что соответствует принципу «только нужная математика, но вся нужная»?
  options:
  - Для каждой математической темы известно, где она пригодится дальше
  - Математику можно пропустить, если интересуют только языковые модели
  - Математика стоит недалеко от тем, где она применяется
  - Вся математика собрана в один блок в начале курса
  answer:
  - 0
  - 2
  explain: Пропускать нужную математику нельзя — на неё опираются следующие темы. И стоит она рядом с местом применения,
    а не одним блоком в начале.
- id: s-diy
  type: single
  q: Почему свой градиентный бустинг пишут раньше, чем открывается библиотека для бустинга?
  options:
  - Чтобы потом в работе пользоваться своим бустингом вместо библиотеки
  - Чтобы понимать, что делает библиотека, и разобраться, если она поведёт себя странно
  - Потому что библиотеку нельзя установить без своей реализации
  - Потому что своя реализация работает быстрее библиотечной
  answer: 1
  explain: Своя реализация — ради понимания и подготовки к собеседованиям. После открытия библиотекой пользуются — это
    нормально и правильно.
  traps:
  - 0
- id: s-subject
  type: single
  q: «Базы данных I» идут на Курсе I, а «Базы данных II» — на Курсе III. Как это описать?
  options:
  - Это два разных предмета с похожими названиями
  - Это одна дисциплина, разбитая на два курса
  - Это две дисциплины одного предмета — его первый и второй уровни
  - Это повтор одной и той же дисциплины для закрепления
  answer: 2
  explain: «Базы данных» — предмет, сквозная линия. Каждый его уровень на конкретном курсе — отдельная дисциплина.
- id: s-retention
  type: single
  q: Как интервальное повторение связано с цепочками предпосылок?
  options:
  - Они не связаны — повторение нужно только перед экзаменом по дисциплине
  - Повторение заменяет прохождение новых тем, когда цепочка уже длинная
  - Повторение нужно, чтобы выставить итоговую оценку за весь курс
  - Повторение удерживает в памяти нижние звенья, на которые опираются новые темы
  answer: 3
  explain: Цепочка работает, только если ранние темы удерживаются в памяти. Для этого пройденное и возвращается в повторении.
- id: s-checking
  type: single
  q: Кто проверяет вопросы с выбором ответа, а кто — развёрнутые ответы?
  options:
  - И то и другое проверяет Claude, а платформа только хранит ответы
  - И то и другое проверяет платформа, сравнивая ответ с образцом
  - Выбор ответа проверяет Claude, а развёрнутые ответы не проверяет никто
  - Выбор ответа проверяет платформа, а развёрнутые ответы — Claude по рубрике
  answer: 3
  explain: Всё, что можно проверить кодом, проверяет платформа. Claude проверяет развёрнутые и устные ответы. Без него они
    не мешают двигаться дальше, а с ним тема засчитывается, когда они приняты.
- id: s-open-order
  type: open
  q: Объясните другу, почему курс по машинному обучению начинается с Python, математики и SQL, а не с нейросетей. Приведите
    одну конкретную цепочку предпосылок и скажите, что сломается без её нижнего звена.
  rubric:
  - главная мысль — новые темы опираются на ранние, и без них остаётся заучивание или работа наугад
  - приведена конкретная цепочка из нескольких звеньев в правильном порядке
  - объяснено, что именно не получится понять или сделать без нижнего звена
  - упомянуто, что готовая библиотека не спасает, когда что-то идёт не так
  wrong_answers:
  - так принято в университетах
  - нейросети слишком сложны, поэтому их оставили напоследок (без объяснения, на что они опираются)
  followups:
  - Зачем тогда вообще писать свою реализацию, если потом всё равно пользуются библиотекой?
  - Почему математика стоит не одним блоком в начале, а рядом с темами, где применяется?
  explain: Вторая тема раздела — цепочка предпосылок и правила порядка.
- id: s-open-pillars
  type: open
  q: Задача — рекомендовать товары на главной странице интернет-магазина. Распределите работу над ней по пяти опорам профессии.
  rubric:
  - работа разложена на все пять опор, и каждая часть относится именно к этой задаче
  - в данных есть получение истории покупок и её подготовка
  - в моделях есть честная проверка на новых данных
  - в инфраструктуре есть запуск сервиса и наблюдение за качеством или переобучение
  wrong_answers:
  - вся работа — выбрать модель
  - опоры перечислены общими словами без связи с задачей
  followups:
  - Как понять, что новые рекомендации действительно повысили продажи, а не совпали с распродажей?
  - Что случится с рекомендациями через полгода, если за моделью никто не следит?
  explain: Первая тема раздела — пять опор и зачем нужна каждая.
