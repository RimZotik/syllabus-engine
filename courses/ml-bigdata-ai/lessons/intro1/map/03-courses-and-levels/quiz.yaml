title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: subject-vs-discipline
  type: single
  q: Чем предмет отличается от дисциплины?
  options:
  - Предмет — один уровень на конкретном курсе, дисциплина — сквозная линия через несколько курсов
  - Предмет — теория, дисциплина — практика по этой теории
  - Предмет — сквозная линия через несколько курсов, дисциплина — один его уровень на конкретном курсе
  - Это два названия одного и того же
  answer: 2
  explain: «Программирование» — предмет, «Программирование III» — дисциплина, то есть его третий уровень.
  traps:
  - 0
- id: why-levels
  type: single
  q: Почему программирование тянется через все шесть курсов, а не проходится целиком в начале?
  options:
  - Так проще поровну распределить часы между курсами
  - Python меняется каждый год, и его приходится учить заново
  - Чтобы программирование не успело надоесть
  - Каждый следующий уровень сложнее и опирается на уже пройденный предыдущий
  answer: 3
  explain: Предмет растёт уровнями — каждый новый уровень опирается на прошлый и приходит, когда для него всё готово.
- id: gates
  type: single
  q: Вы закончили все темы раздела. Какая проверка ждёт дальше?
  options:
  - Переводной экзамен
  - Курсовой проект
  - Контрольная по всем темам раздела
  - Устный экзамен по дисциплине
  answer: 2
  explain: Раздел заканчивается контрольной, дисциплина — экзаменом, курс — переводным экзаменом и проектом.
- id: course-arc
  type: single
  q: Какая последовательность лучше всего описывает путь от Курса I к Курсу VI?
  options:
  - Классические модели → нейросети → код, математика и данные → продакшен
  - Нейросети → классические модели → код и данные → продакшен
  - Код, математика и данные → классические модели → нейросети → продакшен
  - Вся математика → всё программирование → нейросети → классические модели
  answer: 2
  explain: Курсы I–III закладывают фундамент — код, математику и данные, IV — классические модели, V — нейросети, VI —
    продакшен. Каждый опирается на предыдущие.
- id: no-claude
  type: multi
  q: У вас не установлен Claude. Что из этого верно?
  options:
  - Можно пройти теорию, тесты с выбором ответа и контрольные
  - Вопросы с развёрнутым ответом не мешают двигаться дальше
  - Без Claude курс пройти нельзя
  - Устные экзамены проходят так же, только без проверки
  answer:
  - 0
  - 1
  explain: Claude не обязателен. Без него недоступны только развёрнутые ответы и устные экзамены, и они не мешают прохождению.
- id: with-claude
  type: single
  q: Claude установлен. Вы верно ответили на 90% вопросов с выбором ответа, но развёрнутый ответ получил «дополнить». Засчитана
    ли тема?
  options:
  - Да — порог 85% пройден, развёрнутый ответ не влияет
  - Нет — нужно дополнить ответ и сдать его снова, пока его не примут
  - Нет — придётся заново пройти весь тест
  - Да, но с пометкой «нужен Claude»
  answer: 1
  explain: С Claude тема засчитывается, только когда пройден порог по вопросам с выбором ответа и приняты все развёрнутые
    ответы. Ответ можно дополнить и сдать снова.
- id: teacher
  type: single
  q: Что делает преподаватель Claude с вашим развёрнутым ответом?
  options:
  - Пишет за вас правильный ответ, чтобы вы его запомнили
  - Сверяет ответ с критериями рубрики и подсказывает, что дополнить
  - Ставит оценку в зависимости от длины ответа
  - Исправляет ошибки в тексте и засчитывает ответ автоматически
  answer: 1
  explain: Преподаватель оценивает по рубрике и не выдаёт готовый ответ — он подсказывает, о чём подумать.
- id: spaced
  type: single
  q: Как устроено интервальное повторение?
  options:
  - Каждый день повторяются все вопросы из всех пройденных тем
  - Всё пройденное повторяют один раз — перед экзаменом по дисциплине
  - Пройденное возвращается сначала часто, потом всё реже, а прочно усвоенное пропускается
  - Каждая тема возвращается ровно через месяц после изучения
  answer: 2
  explain: Промежутки между повторениями растут, поэтому ежедневные сессии остаются короткими.
- id: no-memorize
  type: single
  q: Почему в повторении не получится просто заучить ответы на вопросы?
  options:
  - Правильные ответы после ошибки никогда не показываются
  - В повторении нет вопросов — только перечитывание тем
  - Вопросы каждый раз новые — платформа отслеживает понятие, а не конкретный вопрос
  - Вопросы повторения доступны только тем, у кого установлен Claude
  answer: 2
  explain: Платформа запоминает, насколько прочно вы знаете понятие, и проверяет его в разных формах.
- id: open-plan
  type: open
  q: Какой курс программы кажется вам самым трудным и почему? На что из более ранних курсов он опирается и что вы будете
    делать, чтобы к нему не забыть пройденное?
  rubric:
  - назван конкретный курс и конкретная причина трудности
  - верно названо хотя бы два направления из более ранних курсов, на которые он опирается
  - объяснено, зачем они нужны в выбранном курсе
  - упомянут способ не забыть пройденное — например, ежедневное интервальное повторение
  wrong_answers:
  - всё трудное, поэтому план не нужен
  - названо то, что стоит позже выбранного курса
  followups:
  - Что будет с цепочкой предпосылок, если одно из нижних звеньев забудется?
  - Почему повторение устроено так, что вопросы каждый раз новые?
  explain: Вернитесь к таблице шести курсов и к рассказу о повторении.
