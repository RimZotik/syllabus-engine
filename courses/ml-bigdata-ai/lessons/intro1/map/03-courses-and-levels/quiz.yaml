title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: subject-vs-discipline
  type: single
  q: Чем предмет отличается от дисциплины?
  options:
  - Дисциплина тянется через несколько курсов, а предмет — её ступень на одном курсе
  - Предмет — это теория, а дисциплина — практика по этой теории
  - Предмет тянется через несколько курсов, а дисциплина — его ступень на одном курсе
  - Ничем — это два названия одного и того же
  answer: 2
  explain: «Программирование» — предмет, «Программирование III» — дисциплина, то есть его третий уровень.
  traps:
  - 0
- id: why-levels
  type: single
  q: Почему программирование тянется через все шесть курсов, а не проходится целиком в начале?
  options:
  - Так проще поровну распределить часы между курсами
  - Python меняется каждый год, и его приходится учить заново
  - Первые курсы заняты математикой, и на всё программирование не хватает времени
  - Следующий уровень сложнее, и для него нужно то, что дал предыдущий
  answer: 3
  explain: Предмет растёт уровнями — каждый новый уровень опирается на прошлый и приходит, когда для него всё готово.
- id: gates
  type: single
  q: Какая пара «ступень плана — проверка» указана неверно?
  options:
  - Тема — тест темы
  - Раздел — контрольная по всем его темам
  - Дисциплина — контрольная по всем её разделам
  - Курс — переводной экзамен и курсовой проект
  answer: 2
  explain: Дисциплина заканчивается экзаменом — практикой и устным опросом. Контрольная бывает после раздела, а не после
    всей дисциплины.
- id: course-arc
  type: single
  q: Какая последовательность лучше всего описывает путь от Курса I к Курсу VI?
  options:
  - Классические модели → нейросети → код, математика и данные → продакшен
  - Нейросети → классические модели → код и данные → продакшен
  - Код, математика и данные → классические модели → нейросети → продакшен
  - Код, математика и данные → нейросети → классические модели → продакшен
  answer: 2
  explain: Курсы I–III закладывают фундамент — код, математику и данные, IV — классические модели, V — нейросети, VI —
    продакшен. Каждый опирается на предыдущие.
- id: no-claude
  type: multi
  q: У вас не установлен Claude. Что из этого верно?
  options:
  - Можно пройти теорию, тесты с выбором ответа и контрольные
  - Вопросы с развёрнутым ответом не мешают двигаться дальше
  - Развёрнутые ответы засчитываются автоматически как принятые
  - Устные экзамены проходят так же, только без проверки
  answer:
  - 0
  - 1
  explain: Claude не обязателен. Без него развёрнутые ответы и устные экзамены никто не проверяет — они помечены «нужен Claude»,
    но не мешают прохождению.
- id: with-claude
  type: single
  q: Claude установлен. Вы верно ответили на 90% вопросов с выбором ответа, но развёрнутый ответ получил «дополнить». Засчитана
    ли тема?
  options:
  - Да — порог 85% пройден, развёрнутый ответ не влияет
  - Нет — нужно дополнить ответ и сдать его снова, пока его не примут
  - Нет — придётся заново пройти весь тест
  - Да, но с пометкой «нужен Claude»
  answer: 1
  explain: С Claude тема засчитывается, только когда пройден порог по вопросам с выбором ответа и приняты все развёрнутые
    ответы. Ответ можно дополнить и сдать снова.
- id: teacher
  type: single
  q: Что делает преподаватель Claude с вашим развёрнутым ответом?
  options:
  - Сверяет ответ с рубрикой и, если чего-то не хватает, показывает правильный ответ
  - Сверяет ответ с рубрикой и подсказывает, о чём ещё подумать
  - Исправляет ошибки в тексте ответа и засчитывает его автоматически
  - Пишет за вас образцовый ответ, чтобы вы его запомнили
  answer: 1
  explain: Преподаватель оценивает по рубрике и не выдаёт готовый ответ — он подсказывает, о чём подумать, а ответ можно
    дополнить и сдать снова.
  traps:
  - 0
- id: spaced
  type: single
  q: Как устроено интервальное повторение?
  options:
  - Каждый день повторяются все вопросы из всех пройденных тем
  - Всё пройденное повторяют один раз — перед экзаменом по дисциплине
  - Промежутки между повторениями растут, а то, что вы почти наверняка помните, не показывается
  - Каждая тема возвращается ровно через месяц после изучения
  answer: 2
  explain: Пройденное возвращается сначала часто, потом всё реже, поэтому ежедневные сессии остаются короткими.
- id: no-memorize
  type: single
  q: Почему в повторении не получится просто заучить ответы на вопросы?
  options:
  - После ошибки правильный ответ не показывают, и запомнить его не из чего
  - Вопросы перемешиваются, но остаются теми же, что в тестах тем
  - Платформа следит за понятием, а не за вопросом, и спрашивает его каждый раз по-новому
  - Повторение показывает только то, что вы и так уверенно помните
  answer: 2
  explain: Платформа запоминает, насколько прочно вы знаете понятие, и проверяет его в разных формах. Уверенно усвоенное как
    раз не показывается.
- id: open-plan
  type: open
  q: Какой курс программы кажется вам самым трудным и почему? Назовите хотя бы две вещи из более ранних курсов, на которые
    он опирается, и скажите, зачем они ему нужны. Что вы будете делать, чтобы к этому курсу не забыть пройденное?
  rubric:
  - назван конкретный курс и конкретная причина трудности
  - верно названо хотя бы два направления из более ранних курсов, на которые он опирается
  - объяснено, зачем они нужны в выбранном курсе
  - упомянут способ не забыть пройденное — например, ежедневное интервальное повторение
  wrong_answers:
  - всё трудное, поэтому план не нужен
  - названо то, что стоит позже выбранного курса
  followups:
  - Что будет с цепочкой предпосылок, если одно из нижних звеньев забудется?
  - Почему повторение устроено так, что вопросы каждый раз новые?
  explain: Вернитесь к таблице шести курсов и к рассказу о повторении.
