title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: prereq-order
  type: single
  q: Тема «Б» опирается на тему «А». Что это значит для учебного плана?
  options:
  - «А» и «Б» можно проходить в любом порядке
  - «А» обязана стоять раньше «Б»
  - «Б» обязана стоять раньше «А»
  - «А» и «Б» проходят одновременно, чередуя занятия
  answer: 1
  explain: Предпосылка всегда стоит раньше темы, которая на неё опирается, — это проверяется автоматически.
- id: why-inside
  type: single
  q: Нейросеть можно обучить готовой библиотекой за десять строк. Зачем тогда понимать, что происходит внутри?
  options:
  - Без понимания устройства библиотеку не получится установить
  - Десять строк кода работают только на учебных данных
  - Понимание устройства само по себе делает обучение быстрее
  - Когда обучение пойдёт не так, без понимания останется менять настройки наугад
  answer: 3
  explain: Пока всё идёт хорошо, хватает и десяти строк. Но когда ошибка перестаёт уменьшаться, найти причину может только
    тот, кто понимает устройство.
- id: chain
  type: single
  q: Какая последовательность соответствует цепочке, ведущей к обучению нейросети?
  options:
  - Обратное распространение → производная → градиент → обучение сети
  - Градиент → производная → обучение сети → обратное распространение
  - Производная → градиент → обратное распространение → обучение сети
  - Обучение сети → обратное распространение → градиент → производная
  answer: 2
  explain: Сначала производная по одному параметру, потом градиент для многих параметров, потом способ быстро посчитать
    его в сети и, наконец, само обучение.
- id: no-derivative
  type: single
  q: Что случится, если взяться за обратное распространение ошибки, не зная, что такое производная?
  options:
  - Ничего страшного — готовая библиотека всё посчитает, понимать не обязательно
  - Формулы придётся заучивать, не понимая, откуда они берутся
  - Нейросеть будет обучаться заметно медленнее
  - Не получится установить библиотеку для нейросетей
  answer: 1
  explain: Обратное распространение опирается на производную. Без неё остаётся только зубрить формулы. Библиотека посчитает,
    но когда обучение пойдёт не так, разобраться будет не на чем.
- id: sequence
  type: single
  q: Как проходятся дисциплины внутри одного курса?
  options:
  - Как в школе — несколько дисциплин параллельно, по уроку каждой в день
  - В любом порядке, который выберет ученик
  - Одна за другой — следующая начинается, когда закончена предыдущая
  - Сначала вся математика курса, затем всё остальное
  answer: 2
  explain: Новый материал идёт одним потоком. Вперемешку старые темы встречаются только в повторении.
- id: subject-return
  type: single
  q: Вы закончили первую дисциплину по базам данных. Что дальше происходит с этим предметом?
  options:
  - Он возвращается на более позднем курсе, уже на новом уровне
  - Он больше не встречается — следующие курсы о другом
  - Он чередуется с другими дисциплинами каждую неделю до конца курса
  - Он возвращается только на выпускном экзамене
  answer: 0
  explain: Предмет не исчезает — он возвращается на следующем уровне, когда первый уже пройден.
- id: math-when
  type: single
  q: «Зачем мне тригонометрия, если я хочу заниматься ML?» Какой ответ соответствует принципу курса?
  options:
  - Тригонометрия входит в любую высшую математику, так принято
  - Она нужна для общего развития, а в ML почти не применяется
  - Её можно пропустить, если интересуют только модели
  - У неё есть конкретное применение — например, косинусом угла измеряют похожесть векторов
  answer: 3
  explain: Для каждой математической темы в плане записано, где она пригодится. У тригонометрии это, например, похожесть
    векторов.
- id: diy-why
  type: multi
  q: Почему в курсе сначала пишут свою реализацию, а потом открывают библиотеку? Выберите верные причины.
  options:
  - Чтобы понимать, что делает библиотека, и находить причину, когда она ведёт себя странно
  - Потому что на собеседованиях просят реализовать алгоритмы с нуля
  - Чтобы потом в работе пользоваться своей реализацией вместо библиотеки
  - Потому что популярные библиотеки часто считают с ошибками
  answer:
  - 0
  - 1
  explain: Своя реализация — ради понимания и подготовки к собеседованиям. В работе после открытия пользуются библиотекой.
  traps:
  - 2
- id: after-unlock
  type: single
  q: Вы написали свой код для матриц и сдали его — NumPy открыт. Как правильно работать с матрицами дальше?
  options:
  - Пользоваться NumPy — теперь это нормально и правильно
  - Продолжать пользоваться своим классом, раз он уже написан
  - Чередовать свой класс и NumPy, чтобы не забыть устройство
  - Ещё какое-то время обходиться без NumPy, для закрепления
  answer: 0
  explain: После открытия библиотека — правильный рабочий инструмент. Своя реализация уже выполнила свою задачу.
- id: open-order
  type: open
  q: Выберите одну тему из конца курса (например, обучение нейросети) и объясните на её примере, почему курс не начинается
    с неё. Назовите хотя бы две её предпосылки и что пойдёт не так без каждой.
  rubric:
  - выбрана конкретная тема из поздних курсов
  - названы хотя бы две реальные предпосылки этой темы
  - для каждой предпосылки объяснено, что без неё не получится понять или сделать
  - есть мысль, что без предпосылок остаётся заучивание или работа наугад
  wrong_answers:
  - курс не начинается с нейросетей, потому что это слишком модно
  - предпосылки названы, но не объяснено, зачем они нужны
  followups:
  - Можно ли пользоваться библиотекой для этой темы, не понимая предпосылок? Что будет, когда что-то сломается?
  - Какая из названных предпосылок, по-вашему, самая важная?
  explain: Вернитесь к цепочке «от функции до обучения нейросети».
