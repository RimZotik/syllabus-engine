title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: prereq-order
  type: single
  q: Тема «Графики функций» опирается на тему «Координатная плоскость». Какой вариант плана нарушает правило порядка?
  options:
  - «Координатная плоскость» стоит в начале раздела, «Графики функций» — в его конце
  - Обе темы стоят подряд, сначала «Координатная плоскость»
  - «Графики функций» стоят в разделе, который идёт раньше раздела с «Координатной плоскостью»
  - Между «Координатной плоскостью» и «Графиками функций» стоят ещё пять тем
  answer: 2
  explain: Тема может опираться только на то, что пройдено раньше неё. Сколько тем между ними — неважно, важно, что предпосылка
    стоит раньше. В третьем варианте графики оказались раньше своей предпосылки.
- id: why-inside
  type: single
  q: Нейросеть можно обучить готовой библиотекой за десять строк. Зачем тогда понимать, что происходит внутри?
  options:
  - Готовые библиотеки часто считают с ошибками, и результат нужно перепроверять вручную
  - Десять строк кода работают только на учебных данных, а на настоящих — нет
  - Понимание устройства само по себе делает обучение сети быстрее
  - Когда ошибка застрянет, понимание поможет найти причину, а не крутить настройки вслепую
  answer: 3
  explain: Пока всё идёт хорошо, хватает и десяти строк. Но когда ошибка перестаёт уменьшаться или модель проваливается на
    новых примерах, найти причину может только тот, кто понимает устройство.
- id: chain
  type: single
  q: Какая цепочка ведёт к обучению нейросети, если каждое звено опирается на предыдущее?
  options:
  - Функция → градиент → производная → обратное распространение
  - Функция → производная → обратное распространение → градиент
  - Функция → производная → градиент → обратное распространение
  - Производная → функция → градиент → обратное распространение
  answer: 2
  explain: Производная говорит, как меняется функция при сдвиге одного параметра, градиент — то же сразу для многих параметров,
    обратное распространение — способ быстро посчитать градиент в сети. Без функции нет и производной.
- id: no-derivative
  type: single
  q: Что случится, если взяться за обратное распространение ошибки, не зная, что такое производная?
  options:
  - Ничего страшного — библиотека всё посчитает, а понимать формулы не обязательно
  - Формулы метода останутся набором правил, которые можно только зазубрить
  - Нейросеть, которую вы обучаете, будет учиться заметно медленнее
  - Метод придётся заменить другим, в котором производная не нужна
  answer: 1
  explain: Обратное распространение опирается на производную. Без неё не видно, откуда берётся каждая формула. Библиотека
    посчитает, но когда обучение пойдёт не так, разобраться будет не на чем. На скорость самой сети ваше понимание не влияет.
- id: sequence
  type: single
  q: Какое утверждение о порядке курса неверно?
  options:
  - Следующая дисциплина курса начинается, когда закончена предыдущая
  - Темы разных дисциплин вперемешку встречаются в повторении
  - Каждый день проходится понемногу из каждой дисциплины курса
  - Математика стоит не одним блоком, а рядом с темами, где применяется
  answer: 2
  explain: Так устроена школа, а не этот курс. Здесь дисциплины идут одна за другой, а вперемешку старые темы встречаются только
    в повторении.
- id: subject-return
  type: single
  q: Вы закончили «SQL-запросы» на Курсе I. Где вы встретите SQL дальше?
  options:
  - На одном из следующих курсов — уже на новом уровне
  - Нигде — дисциплина закончилась, и эта область пройдена целиком
  - Только в повторении — новых тем по SQL больше не будет
  - В следующей дисциплине Курса I — новые темы SQL пойдут вперемешку с ней
  answer: 0
  explain: Область знаний не исчезает — она возвращается на одном из следующих курсов, на новом уровне, как «Аналитический SQL»
    на Курсе III. Повторение лишь удерживает пройденное, новых тем в нём нет, а дисциплины курса
    идут одна за другой, не вперемешку.
- id: math-when
  type: single
  q: «Зачем мне тригонометрия, если я хочу заниматься ML?» Какой ответ соответствует принципу курса?
  options:
  - Без неё не построить график прямой, а на нём держится любая модель
  - Её проходят ради полноты — в высшей математике так принято
  - Она нужна для конкретной задачи — косинусом угла сравнивают векторы
  - Её можно пропустить, если интересуют только языковые модели
  answer: 2
  explain: Для каждой математической темы в плане записано, где она пригодится. У тригонометрии это, например, мера похожести
    векторов. График прямой строят без тригонометрии.
- id: diy-why
  type: multi
  q: Почему в курсе сначала пишут свою реализацию, а потом открывают библиотеку? Выберите верные причины.
  options:
  - Чтобы видеть, что библиотека делает внутри, и находить причину её странного поведения
  - Потому что на собеседованиях просят реализовать алгоритм с нуля
  - Чтобы потом в работе пользоваться своей реализацией вместо библиотеки
  - Потому что популярные библиотеки часто считают с ошибками
  answer:
  - 0
  - 1
  explain: Своя реализация — ради понимания и подготовки к собеседованиям. В работе после открытия пользуются библиотекой.
  traps:
  - 2
- id: after-unlock
  type: single
  q: Вы написали свой код для матриц и сдали его — NumPy открыт. Как правильно работать с матрицами дальше?
  options:
  - Перейти на NumPy — своя реализация была нужна для понимания
  - Продолжать пользоваться своим кодом, раз он уже написан
  - Чередовать свой код и NumPy, чтобы не забыть устройство
  - Ещё какое-то время обходиться без NumPy, для закрепления
  answer: 0
  explain: После открытия библиотека — правильный рабочий инструмент. Своя реализация уже выполнила свою задачу.
- id: open-order
  type: open
  q: Выберите одну тему из конца курса (например, обучение нейросети) и объясните на её примере, почему курс не начинается
    с неё. Назовите хотя бы две её предпосылки и что пойдёт не так без каждой.
  rubric:
  - выбрана конкретная тема из поздних курсов
  - названы хотя бы две предпосылки этой темы, которые действительно стоят раньше неё (например, звенья цепочки из урока); неточное название звена при верном месте в цепочке — поправка, а не ошибка
  - хотя бы для двух предпосылок сказано своими словами, что без неё не получится понять или сделать (устройство метода объяснять не нужно)
  - есть мысль, что без предпосылок остаётся заучивание или работа наугад
  wrong_answers:
  - курс не начинается с нейросетей, потому что это слишком модно
  - предпосылки названы, но не объяснено, зачем они нужны
  - в предпосылки записана тема, которая стоит позже выбранной или с ней не связана
  followups:
  - Можно ли пользоваться библиотекой для этой темы, не понимая предпосылок? Что будет, когда что-то сломается?
  - Какая из названных предпосылок, по-вашему, самая важная?
  explain: Вернитесь к цепочке «от функции до обучения нейросети».
