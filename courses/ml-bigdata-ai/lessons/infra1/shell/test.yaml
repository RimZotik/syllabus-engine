questions:
- id: s-quoted-var-and-glob
  type: single
  q: 'В домашней папке лежат `a.txt`, `b.txt` и `notes.md`. Что напечатает `echo "$HOME"/*.txt`?'
  options:
  - '`/home/student/a.txt /home/student/b.txt`'
  - '`/home/student/*.txt`'
  - '`$HOME/*.txt`'
  - '`/home/student/a.txt`'
  answer: 0
  explain: 'В двойных кавычках `$HOME` подставляется, а `*` стоит уже за кавычками — и шаблон раскрывается: слово `/home/student/*.txt` совпадает с двумя файлами. Шаблон остался бы как есть, если бы стоял внутри кавычек или не совпал ни с чем; `$HOME` не подставился бы только в одинарных.'
- id: s-rm-no-match
  type: single
  q: 'В папке нет ни одного файла `.tmp`. Что напечатает строка `rm *.tmp; echo $?`?'
  options:
  - 'Сообщение `rm` о том, что `*.tmp` нет, и затем 1'
  - 'Только 0: удалять было нечего, значит, ошибки нет'
  - 'Сообщение `rm` о том, что `*.tmp` нет, и затем 0: `;` сбрасывает код'
  - 'Ничего: `echo $?` не выполнится после ошибки'
  answer: 0
  explain: 'Шаблон без совпадений остаётся как есть, и `rm` получает имя `*.tmp` — такого файла нет: `cannot remove ''*.tmp''` и код 1. `;` запускает следующую команду при любом исходе, а `$?` хранит код `rm`. Пропустить `echo` при ошибке мог бы `&&`.'
- id: s-nano-unwritable
  type: single
  q: 'Без `sudo` открыли `nano /etc/app.conf` (владелец root, права `rw-r--r--`), поправили строку и нажали Ctrl+S. Что произойдёт?'
  options:
  - 'Записать не получится: nano работает от вашего имени; правка останется в его памяти, пока вы не выйдете'
  - 'nano запросит пароль для sudo и сохранит файл'
  - 'nano сохранит правку в `app.conf.save` рядом, а оригинал не тронет'
  - 'Ничего не произойдёт: nano откроет такой файл только для чтения, и поправить строку нельзя'
  answer: 0
  explain: 'nano — процесс, запущенный вами, и файл на запись открывает от вашего имени — вам достаётся тройка остальных `r--`. Правка жива в памяти nano, пока он открыт. `.save` nano пишет, когда его процесс завершают с несохранёнными правками, а не при отказе в записи. Правильный путь — выйти без сохранения и открыть `sudo nano /etc/app.conf`.'
- id: s-sudo-nano-new-file
  type: single
  q: 'В своей домашней папке вы набрали `sudo nano todo.txt` (файла не было), написали строку и сохранили. Что дальше?'
  options:
  - 'Файл принадлежит root; без sudo дописать в него нельзя, а удалить — можно'
  - 'Файл принадлежит вам: папка ваша, и sudo влияет только на ввод пароля'
  - 'Файл принадлежит root, и без sudo его нельзя ни изменить, ни удалить'
  - 'Файл принадлежит root, но вы его владелец по группе и можете дописывать'
  answer: 0
  traps: [2]
  explain: 'Файл создал процесс nano, работавший от имени root, — root и стал владельцем, а права у нового файла `rw-r--r--`: вам — только чтение. Удаление решают права папки, а домашняя папка ваша: `rm todo.txt` сработает, спросив про защищённый от записи файл. Группа нового файла — тоже root.'
- id: s-move-and-rights
  type: multi
  q: |
    Вы — student, в своей домашней папке:
    ```
    -r--r--r-- 1 student student  80 Nov 20 09:00 draft.txt
    ```
    Общая папка и файл в ней:
    ```
    drwxr-xr-x 2 root root 4096 Nov 20 09:00 /srv/shared
    -rw-r--r-- 1 root root  300 Nov 20 09:00 /srv/shared/rules.txt
    ```
    Какие команды сработают?
  options:
  - '`mv draft.txt final.txt`'
  - '`mv draft.txt /srv/shared/`'
  - '`cp /srv/shared/rules.txt .`'
  - '`echo готово >> draft.txt`'
  - '`rm /srv/shared/rules.txt`'
  answer: [0, 2]
  explain: 'Переименование меняет только список имён папки — домашняя папка ваша, права файла не важны. Перенос в `/srv/shared` и удаление оттуда требуют w у этой папки, а вам достаётся `r-x`. Копирование к себе требует прочитать файл (`r--` у остальных есть) и войти в папку (x есть). Дописать в `draft.txt` не даёт тройка владельца `r--`.'
- id: s-grep-r-denied
  type: single
  q: |
    В `/srv/logs` три журнала со строками ERROR: `app.log` (2 строки), `db.log` (1 строка) и `secure.log` (4 строки) с правами `-rw-r----- root adm`. Вы не в группе adm. Что выведет
    ```
    grep -r ERROR /srv/logs | wc -l
    ```
  options:
  - 'Сообщение grep про `secure.log` и число 3'
  - 'Только число 7: grep с `-r` читает все файлы папки'
  - 'Сообщение grep про `secure.log` и число 4: сообщение тоже посчиталось строкой'
  - 'Только сообщение про `secure.log`: из-за ошибки wc ничего не получит'
  answer: 0
  explain: 'grep работает от вашего имени и `secure.log` прочитать не может — сообщение `Permission denied` идёт в stderr, на экран, мимо канала. Остальные файлы grep читает, и `wc -l` считает 2 + 1 = 3 строки. Ошибка на одном файле не останавливает поиск по другим.'
- id: s-sort-root-file
  type: single
  q: 'Файл `/etc/app/allow.txt` принадлежит root, менять папку `/etc/app` может только root. Какая команда отсортирует файл на месте и ничего не потеряет?'
  options:
  - '`sudo sort -o /etc/app/allow.txt /etc/app/allow.txt`'
  - '`sudo sort /etc/app/allow.txt > /etc/app/allow.txt`'
  - '`sort /etc/app/allow.txt | sudo tee /etc/app/allow.txt`'
  - '`sudo sort /etc/app/allow.txt | tee /etc/app/allow.txt`'
  answer: 0
  explain: 'С `-o` sort сначала читает весь файл и только потом пишет результат — и делает это сам, от имени root. Во втором варианте файл открывает ваша оболочка: Permission denied. В третьем `tee` очищает файл при запуске, а команды конвейера работают одновременно — `sort` может прочитать уже пустой файл. В четвёртом от вашего имени работает `tee`: Permission denied.'
- id: s-single-quotes-tee
  type: single
  q: 'Что окажется в конце `/etc/app.conf` после `echo ''data=$HOME/data'' | sudo tee -a /etc/app.conf`?'
  options:
  - '`data=$HOME/data`'
  - '`data=/root/data`'
  - '`data=/home/student/data`'
  - 'Ничего: файл откроет ваша оболочка, и запись не пройдёт'
  answer: 0
  explain: 'В одинарных кавычках оболочка ничего не подставляет — `echo` получает текст с `$HOME`, и `tee` пишет его как есть. Файл здесь открывает сам `tee`, запущенный через `sudo`, а не ваша оболочка, поэтому запись проходит.'
- id: s-pipe-code
  type: single
  q: 'Файла `app.log` нет. Что напечатает `grep ERROR app.log | wc -l; echo $?`?'
  options:
  - 'Сообщение grep об ошибке, затем 0 и ещё 0'
  - 'Сообщение grep об ошибке и затем 2'
  - 'Сообщение grep об ошибке, затем 0 и 2'
  - 'Только сообщение grep: wc не запустится'
  answer: 0
  explain: 'Сообщение grep идёт в stderr, на экран; в канал не приходит ничего, и `wc -l` печатает 0. Команды конвейера запускаются все сразу, ошибка одной не отменяет другие. Код конвейера — код его последней команды, `wc`, а у неё 0.'
- id: s-tail-f-train
  type: single
  q: |
    ```
    student@forge:~$ nohup ./train.sh > train.log 2>&1 &
    student@forge:~$ tail -f train.log
    ```
    Посмотрев на вывод, вы нажали Ctrl+C. Что остановилось?
  options:
  - 'Только `tail`: обучение — фоновое задание, Ctrl+C достаётся команде на переднем плане'
  - 'И `tail`, и обучение: Ctrl+C прерывает всё, что запущено из этого окна'
  - 'Ничего: `tail -f` не завершается, пока растёт файл'
  - 'Только обучение: `tail` читает его вывод и остановится вместе с ним'
  answer: 0
  explain: 'SIGINT от Ctrl+C получает команда на переднем плане — `tail -f`. Обучение запущено с `&` и работает в фоне: оно пишет в файл, а `tail` этот файл только читает, это два независимых процесса. `nohup` и вывод в файл нужны, чтобы обучение пережило и закрытие окна.'
- id: s-nano-bashrc-other-window
  type: single
  q: 'В первом окне вы дописали в `~/.bashrc` через nano строку `export DATA_DIR=/srv/data`, нажали Ctrl+S, но nano не закрыли. Во втором окне, открытом раньше, выполнили `source ~/.bashrc; echo $DATA_DIR`. Что напечатается?'
  options:
  - '`/srv/data`'
  - 'Пустая строка: пока nano открыт, файл на диске прежний'
  - 'Пустая строка: второе окно открыто до правки, и `source` его не обновит'
  - 'Пустая строка: `export` из `~/.bashrc` действует только в новых окнах'
  answer: 0
  explain: 'Ctrl+S записал текст на диск — закрывать nano для этого не нужно. `source` выполняет файл, каким он лежит на диске сейчас, в оболочке второго окна, и её переменная меняется. Устаревает окно, которое файл не перечитывало, а `source` как раз перечитывает.'
- id: s-code-write-grep-c
  type: code
  q: |
    **Напишите `grep_c(pattern, files, names)`: что напечатает и с каким кодом завершится `grep -c ОБРАЗЕЦ имя1 имя2 …`.**
    `files` — словарь имя → текст существующих файлов, `names` — имена из командной строки (хотя бы одно). Образец ищется как подстрока. Для каждого существующего файла в stdout идёт число строк с образцом: при одном имени — просто число, при нескольких — `имя:число`. Сообщение о несуществующем файле уходит в stderr — в результат его не включайте. Код: 2, если хоть одного файла нет; иначе 0, если строки с образцом нашлись, и 1, если нет. Вернуть пару `(список строк stdout, код)`.
    ```input
    grep_c("ERROR", {"app.log": "INFO start\nERROR db\n", "db.log": "INFO ok\n"}, ["app.log", "db.log"])
    grep_c("ERROR", {"db.log": "INFO ok\n"}, ["db.log"])
    ```
    ```output
    (['app.log:1', 'db.log:0'], 0)
    (['0'], 1)
    ```
  starter: |
    def grep_c(pattern, files, names):
        pass


    print(grep_c("ERROR", {"app.log": "INFO start\nERROR db\n", "db.log": "INFO ok\n"}, ["app.log", "db.log"]))
  solution: |
    def grep_c(pattern, files, names):
        out = []
        total = 0
        missing = False
        for name in names:
            if name not in files:
                missing = True
                continue
            count = sum(1 for line in files[name].splitlines() if pattern in line)
            total += count
            out.append(str(count) if len(names) == 1 else f"{name}:{count}")
        if missing:
            code = 2
        elif total > 0:
            code = 0
        else:
            code = 1
        return out, code


    print(grep_c("ERROR", {"app.log": "INFO start\nERROR db\n", "db.log": "INFO ok\n"}, ["app.log", "db.log"]))
  tests:
    asserts:
    - name: Примеры из условия
      code: |
        got = grep_c("ERROR", {"app.log": "INFO start\nERROR db\n", "db.log": "INFO ok\n"}, ["app.log", "db.log"])
        assert got == (["app.log:1", "db.log:0"], 0), f"Ожидалось (['app.log:1', 'db.log:0'], 0), а вернулось {got!r}"
        got = grep_c("ERROR", {"db.log": "INFO ok\n"}, ["db.log"])
        assert got == (["0"], 1), f"Ожидалось (['0'], 1): число напечатано, но совпадений нет — код 1. Вернулось {got!r}"
    - name: Нет файла — код 2, остальные посчитаны
      code: |
        files = {"app.log": "ERROR a\nERROR b\nINFO c\n"}
        got = grep_c("ERROR", files, ["app.log", "nope.log"])
        assert got == (["app.log:2"], 2), f"Ожидалось (['app.log:2'], 2): совпадения есть, но файла nope.log нет. Вернулось {got!r}"
        got = grep_c("ERROR", files, ["nope.log"])
        assert got == ([], 2), f"Ожидалось ([], 2): единственного файла нет, в stdout ничего. Вернулось {got!r}"
    - name: Подстрока и регистр
      code: |
        files = {"a.txt": "cat\nconcatenate\nCat\n", "b.txt": "dog\n"}
        got = grep_c("cat", files, ["a.txt", "b.txt", "a.txt"])
        assert got == (["a.txt:2", "b.txt:0", "a.txt:2"], 0), f"Ожидалось (['a.txt:2', 'b.txt:0', 'a.txt:2'], 0): cat — подстрока concatenate, Cat — другой регистр, имена — в порядке командной строки. Вернулось {got!r}"
    - name: Пустой файл
      code: |
        got = grep_c("x", {"empty.txt": ""}, ["empty.txt"])
        assert got == (["0"], 1), f"Для пустого файла нужно (['0'], 1), а вернулось {got!r}"
  explain: 'Вывод и код — разные вещи: `grep -c` печатает 0 и всё равно возвращает 1, потому что совпадений нет. Отсутствующий файл не мешает посчитать остальные, но код становится 2 — настоящая ошибка важнее, чем «нашёл» или «не нашёл». Имя перед числом grep пишет, только когда файлов в командной строке несколько.'
- id: s-open-train-over-ssh
  type: open
  q: 'Коллега подключился к серверу по SSH, запустил `python3 train.py &` и закрыл ноутбук. Утром обучение не завершено, а его вывода нигде нет. Объясните, что произошло, и как запустить обучение, чтобы оно пережило выход и весь его вывод, включая ошибки, сохранился в файл.'
  rubric:
  - 'Задание с `&` осталось заданием оболочки этого окна: при закрытии окна или разрыве соединения оболочка получила SIGHUP и передала его заданиям, и обучение завершилось; его вывод шёл в терминал, которого больше нет'
  - 'Запускать через `nohup` в фоне с перенаправлением в файл обоих потоков, например `nohup python3 -u train.py > train.log 2>&1 &`: `> train.log` — stdout, `2>&1` — ошибки туда же'
  wrong_answers:
  - Нужно было запустить без &, тогда обучение работает и после закрытия окна
  - Обучение завершилось, потому что ноутбук уснул и процессор сервера остановился
  - Достаточно написать > train.log, ошибки попадут туда сами
  followups:
  - Зачем здесь `-u` у `python3`?
