id: i1s-names-with-spaces
title: Имена с пробелами
sandbox: shell
difficulty: 2
concepts: [кавычки, экранирование, mv]
statement: |
  **Переименуйте файлы в папке `docs` так, чтобы в именах не было пробелов: каждый пробел замените дефисом. Папку `Новая папка` переименуйте в `archive`.**

  Остальные символы имени не меняются, содержимое файлов — тоже.

  Пример

  Было:
  ```text
  docs/
  ├── Новая папка/
  │   └── старое.txt
  ├── отчёт за май.txt
  ├── смета $500.txt
  └── фото с моря.jpg
  ```

  Стало:
  ```text
  docs/
  ├── archive/
  │   └── старое.txt
  ├── отчёт-за-май.txt
  ├── смета-$500.txt
  └── фото-с-моря.jpg
  ```
setup:
  cwd: /home/student
  files:
    docs/отчёт за май.txt: "продажи выросли на 12%\n"
    docs/смета $500.txt: "бумага 200\nкартридж 300\n"
    docs/фото с моря.jpg: "JPEG sea\n"
    docs/Новая папка/старое.txt: "черновик\n"
solution:
  - mv "docs/отчёт за май.txt" docs/отчёт-за-май.txt
  - mv 'docs/смета $500.txt' 'docs/смета-$500.txt'
  - mv docs/фото\ с\ моря.jpg docs/фото-с-моря.jpg
  - mv "docs/Новая папка" docs/archive
tests:
  checks:
    - name: Отчёт переименован
      fs_content: {path: docs/отчёт-за-май.txt, equals: "продажи выросли на 12%\n"}
    - name: Смета переименована, знак $ на месте
      fs_content: {path: docs/смета-$500.txt, equals: "бумага 200\nкартридж 300\n"}
    - name: Фото переименовано
      fs_content: {path: docs/фото-с-моря.jpg, equals: "JPEG sea\n"}
    - name: Папка стала archive, файл в ней
      fs_content: {path: docs/archive/старое.txt, equals: "черновик\n"}
    - name: Других файлов в docs нет
      run: ls -A docs
      stdout: "archive\nотчёт-за-май.txt\nсмета-$500.txt\nфото-с-моря.jpg\n"
hints:
  - level: 1
    text: "Без кавычек оболочка делит имя по пробелам на несколько аргументов. Как собрать его в одно слово?"
  - level: 2
    text: "Если файл со сметой «не найден», посмотрите, что знак `$` значит внутри двойных кавычек: `echo` с тем же словом покажет, что получает `mv`."
  - level: 3
    text: "Tab дописывает имя с пробелами сам — посмотрите, как он их записывает."
