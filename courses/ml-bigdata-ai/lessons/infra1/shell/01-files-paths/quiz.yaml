title: Проверка темы
pass: 0.85
minutes: 20
questions:
- id: cd-chain
  type: single
  q: 'Вы в папке `/home/student/projects/shop`. Выполнили по очереди `cd ../../downloads`, `cd -` и `cd ..`. Что теперь покажет `pwd`?'
  options:
  - '`/home/student/projects`'
  - '`/home/student`'
  - '`/home/student/downloads`'
  - '`/home`'
  answer: 0
  explain: 'Первый `cd` поднимается на два уровня — в `/home/student` — и спускается в `downloads`. `cd -` возвращает туда, где были до этого, — в `/home/student/projects/shop`. `cd ..` поднимает на уровень выше: `/home/student/projects`. Ответ `/home/student` получится, если считать, что `cd -` поднимает на уровень вверх; `/home/student/downloads` — если забыть про `cd -`.'
- id: run-from-where
  type: multi
  q: 'Программа `train.py` лежит в `~/ml` и открывает файл так: `open("data/train.csv")`. Таблица лежит в `~/ml/data/train.csv`. При каком запуске программа найдёт таблицу?'
  options:
  - 'В `~/ml`: `python3 train.py`'
  - 'В `~`: `python3 ml/train.py`'
  - 'В `~/ml/data`: `python3 ../train.py`'
  - 'В `/tmp`: `python3 ~/ml/train.py`'
  - 'В `~`: сначала `cd ml`, затем `python3 train.py`'
  answer: [0, 4]
  explain: 'Относительный путь в `open` отсчитывается от текущей папки процесса, а её программа получает от оболочки, — где лежит сам `train.py`, не важно. Из `~/ml` путь ведёт к `~/ml/data/train.csv` — нужный файл; `cd ml` из `~` приводит туда же. Из `~` программа будет искать `~/data/train.csv`, из `~/ml/data` — `~/ml/data/data/train.csv`, из `/tmp` — `/tmp/data/train.csv`.'
- id: cp-target-rules
  type: multi
  q: |
    В папке есть файл `notes.txt` и папка `backup`, а папок `old` и `arch` нет. Выполнили три команды:
    ```text
    cp notes.txt backup
    cp notes.txt old
    cp notes.txt arch/
    ```
    Какие утверждения верны?
  options:
  - 'Появился файл `backup/notes.txt`'
  - 'Появился файл `old` — копия `notes.txt`'
  - 'Третья команда завершилась ошибкой и ничего не создала'
  - 'Появилась папка `old`, а в ней `notes.txt`'
  - 'Третья команда создала папку `arch` и положила копию в неё'
  answer: [0, 1, 2]
  explain: 'Цель — существующая папка: копия ложится внутрь под прежним именем. Цели нет — копия получает имя цели, папок `cp` не создаёт. Слеш в конце говорит «это папка», а её нет, поэтому `cp` отвечает ошибкой и ничего не создаёт.'
- id: mv-overwrite
  type: single
  q: 'В папке `archive` уже лежит `report.csv` за прошлый месяц. Вы набрали `mv report.csv archive/` для отчёта за этот месяц. Что получится?'
  options:
  - 'Старый `report.csv` будет заменён новым без вопроса'
  - '`mv` откажется переносить: в `archive` уже есть файл с таким именем'
  - '`mv` спросит, заменять ли файл, и будет ждать ответа'
  - 'В `archive` появится второй файл с именем вроде `report (1).csv`'
  answer: 0
  traps: [2]
  explain: '`mv` и `cp` молча заменяют файл с тем же именем. Спросить их заставляет флаг `-i`, без него вопроса нет. Копии с номером в имени создаёт проводник Windows, а не `mv`.'
- id: echo-no-match
  type: single
  q: 'В папке лежат `.env`, `.gitignore`, `main.py`, `README.md` и папка `data`. Что напечатает `echo *.py *.txt .e*`?'
  options:
  - '`main.py *.txt .env`'
  - '`main.py .env`'
  - '`main.py *.txt`'
  - '`*.py *.txt .e*`'
  answer: 0
  explain: 'Шаблоны раскрывает оболочка до запуска `echo`. `*.py` совпал с `main.py`. Для `*.txt` совпадений нет — такой шаблон остаётся как есть. Скрытые файлы `*` не выбирает, но в `.e*` точка написана явно, поэтому он совпал с `.env`.'
- id: rm-extra-word
  type: single
  q: 'В папке лежат `draft1.txt`, `draft2.txt`, `report.txt` и `data.csv`. Хотели удалить черновики, но набрали `rm draft *.txt`. Что произойдёт?'
  options:
  - 'Удалятся все три `.txt`, а про `draft` будет ошибка'
  - 'Удалятся только `draft1.txt` и `draft2.txt`, остальное `rm` не тронет'
  - 'Ничего не удалится: из-за ошибки с `draft` `rm` отменит всю команду'
  - 'Удалятся все четыре файла папки'
  answer: 0
  explain: 'Пробел разделил строку на два аргумента: слово `draft` и шаблон `*.txt`, который оболочка раскрыла во все три `.txt`, включая `report.txt`. Файла `draft` нет — об этом будет ошибка, но остальные имена `rm` всё равно обработает. `data.csv` под шаблон не подходит.'
- id: quotes-and-dollar
  type: single
  q: 'Вы в домашней папке `/home/student`, в ней есть `a.csv`. Что напечатает `echo "$HOME/*.csv"`?'
  options:
  - '`/home/student/*.csv`'
  - '`/home/student/a.csv`'
  - '`$HOME/*.csv`'
  - '`$HOME/a.csv`'
  answer: 0
  explain: 'В двойных кавычках `$` работает, поэтому `$HOME` превращается в путь, а шаблоны — нет, поэтому `*.csv` остаётся строкой. Ничего не раскрылось бы в одинарных кавычках, всё — без кавычек.'
- id: copy-name-with-spaces
  type: multi
  q: 'В папке один PDF-файл — `счёт за май.pdf` — и папка `backup`. Какие команды скопируют этот файл в `backup`?'
  options:
  - '`cp "счёт за май.pdf" backup/`'
  - '`cp ''счёт за май.pdf'' backup/`'
  - '`cp счёт\ за\ май.pdf backup/`'
  - '`cp счёт*.pdf backup/`'
  - '`cp счёт за май.pdf backup/`'
  answer: [0, 1, 2, 3]
  explain: 'Двойные и одинарные кавычки собирают имя с пробелами в один аргумент, `\` отменяет особый смысл каждого пробела. Шаблон `счёт*.pdf` оболочка заменяет подходящим именем целиком — `cp` получает одно имя с пробелами внутри. Без кавычек имя распадается на три аргумента: `счёт`, `за` и `май.pdf`, таких файлов нет.'
- id: read-ls-l
  type: multi
  q: |
    Что можно сказать о папке по выводу `ls -l`?
    ```text
    total 12
    -rw-r--r-- 1 student student  831 Nov 21 14:05 Data.csv
    drwxr-xr-x 2 student student 4096 Nov 20 09:00 data
    -rw-r--r-- 1 student student   97 Nov 19 18:30 train.py
    ```
  options:
  - '`data` — папка, а `Data.csv` — обычный файл'
  - '`Data.csv` в последний раз меняли позже, чем `train.py`'
  - '`train.py` занимает 97 килобайт'
  - 'Скрытых файлов в этой папке нет'
  - '`Data.csv` и `data.csv` — одно и то же имя, поэтому второй такой файл здесь не создать'
  answer: [0, 1]
  explain: 'Первый символ строки — тип: `d` у папки, `-` у файла. Время — последнего изменения: 21 ноября позже 19-го. Размер в `ls -l` — в байтах, килобайты только в строке `total`. Скрытые файлы `ls -l` без `-a` не показывает, поэтому об их отсутствии вывод ничего не говорит. Регистр в именах важен: `data.csv` рядом с `Data.csv` создать можно.'
- id: open-star-not-found
  type: open
  q: 'Коллега пишет в чат: «В папке `tmp` набрал `rm *.tmp`, а `rm` ответил `cannot remove ''*.tmp'': No such file or directory`. Похоже, `rm` не понимает звёздочку?» Объясните, кто на самом деле обрабатывает `*`, почему получилось такое сообщение и что из него следует о содержимом папки.'
  rubric:
  - 'Шаблон раскрывает оболочка (bash) до запуска команды: `rm` получает уже готовые имена файлов и звёздочку сам не обрабатывает'
  - 'В папке не нашлось ни одного имени, подходящего под `*.tmp`, поэтому шаблон остался как есть и `rm` получил строку `*.tmp` как имя файла'
  - 'Значит, файлов с окончанием `.tmp` в папке нет (по крайней мере видимых: скрытые `*` не выбирает), и ничего не удалено'
  wrong_answers:
  - '`rm` не умеет работать с шаблонами, нужно перечислить файлы вручную'
  - 'Звёздочку раскрывает сама команда `rm`, и в этой версии она сломана'
  - 'Нужно было написать `rm "*.tmp"` в кавычках, тогда шаблон сработает'
  followups:
  - 'Как заранее проверить, во что раскроется шаблон, ничего не удаляя?'
