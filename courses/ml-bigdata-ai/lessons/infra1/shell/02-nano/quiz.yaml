title: Проверка темы
pass: 0.85
minutes: 14
questions:
- id: caret-typed
  type: single
  q: 'В подсказке внизу nano написано `^X Exit`. Новичок нажимает Shift+6, чтобы получить символ `^`, а потом X. Что произойдёт?'
  options:
  - 'В текст добавятся два символа, `^X`, и в верхней строке появится `Modified`'
  - 'nano выйдет, потому что `^X` — команда выхода'
  - 'nano спросит «Save modified buffer?», как при выходе'
  - 'Ничего: nano не реагирует на клавиши без Ctrl'
  answer: 0
  explain: '`^` в подсказках — обозначение клавиши Ctrl, а не символ, который надо набрать. Символы, набранные с клавиатуры, nano вставляет в текст там, где курсор, — файл стал изменённым. Выйти можно только Ctrl+X.'
- id: save-under-new-name
  type: single
  q: 'В nano открыт `config.ini`. Вы поменяли строку, через Ctrl+O сохранили текст под именем `config.new`, а потом нажали Ctrl+X. Что получится?'
  options:
  - '`config.ini` прежний, в `config.new` — правка; nano закроется без вопроса'
  - 'Правка окажется в обоих файлах: Ctrl+X сохранит и `config.ini`'
  - '`config.ini` прежний, а nano перед выходом спросит, сохранить ли его'
  - 'В `config.ini` — правка, а `config.new` — его копия до правки'
  answer: 0
  traps: [2]
  explain: 'Ctrl+O записывает текст из памяти nano в файл с тем именем, что вы ввели, — в `config.new`. Дальше nano работает уже с ним, и правок с последней записи нет, поэтому Ctrl+X выходит без вопроса. В `config.ini` ничего не записывалось.'
- id: cut-paste-twice
  type: single
  q: |
    В файле семь строк: `a`, `b`, `c`, `d`, `e`, `f`, `g`. Курсор на строке `b`. Нажали Ctrl+K три раза подряд, затем стрелку вниз, затем Ctrl+U два раза. Какие теперь строки по порядку?
  options:
  - '`a e b c d b c d f g`'
  - '`a e f b c d b c d g`'
  - '`a e b c d f g`'
  - '`a b c d e b c d f g`'
  answer: 0
  explain: 'Три Ctrl+K подряд вырезали `b`, `c`, `d` и собрали их вместе; курсор оказался на `e`. Стрелка вниз — на `f`. Ctrl+U вставляет вырезанное над строкой с курсором, курсор остаётся на `f`, а вырезанное — в памяти, поэтому второе нажатие вставляет ещё одну копию туда же.'
- id: frozen-terminal
  type: single
  q: 'Вы набирали команду в оболочке и по привычке нажали Ctrl+S. Терминал перестал откликаться на клавиши. Что сделать?'
  options:
  - 'Нажать Ctrl+Q — вывод продолжится, и всё набранное за это время появится'
  - 'Нажать Ctrl+C — это прервёт зависшую оболочку'
  - 'Закрыть окно: оболочка зависла, и набранное уже не вернуть'
  - 'Нажать Ctrl+X, как при выходе из nano'
  answer: 0
  explain: 'Вне редактора Ctrl+S по старой договорённости терминалов только останавливает вывод: оболочка работает и принимает клавиши, их просто не видно. Ctrl+Q снимает остановку.'
- id: vim-insert-exit
  type: single
  q: 'Команда `git commit` открыла vim. Вы начали печатать, внизу видно `-- INSERT --`. Нужно выйти, ничего не сохранив. Что нажать?'
  options:
  - 'Esc, затем `:q!` и Enter'
  - '`:q!` и Enter'
  - 'Ctrl+X, затем N'
  - 'Esc, затем `:wq` и Enter'
  answer: 0
  explain: 'В режиме вставки `:q!` станет просто текстом — сначала Esc возвращает в командный режим. `:q!` выходит, бросив правки, а `:wq` сохранил бы набранное. Ctrl+X и N — выход из nano, vim их так не понимает.'
- id: where-edits-live
  type: multi
  q: 'В nano открыт файл `todo.txt`, вы дописали в него строку и ещё не сохраняли. Какие утверждения верны?'
  options:
  - 'Если сейчас в другом окне выполнить `cat todo.txt`, новой строки не будет'
  - 'Если закрыть окно терминала, в `todo.txt` останется прежний текст'
  - 'Ctrl+S запишет строку в `todo.txt`, не закрывая редактор'
  - 'Строка уже на диске: nano записывает каждое нажатие клавиши'
  - 'После Ctrl+X и N в `todo.txt` будет новая строка'
  answer: [0, 1, 2]
  explain: 'Пока файл не сохранён, правка живёт только в памяти процесса nano — `cat` читает с диска прежний текст. Закрытое окно завершает nano, и правка в файл не попадает (только в запасной `todo.txt.save`). Ctrl+S сохраняет сразу; Ctrl+X и N выходят, бросив правку.'
- id: open-lost-edits
  type: open
  q: 'Коллега правил на сервере `config.ini` в nano, а потом закрыл окно терминала, не выйдя из редактора. Утром сервис работает со старыми настройками, а рядом с `config.ini` лежит `config.ini.save`. Объясните, почему настройки старые, что за файл `config.ini.save` и как вернуть правки в `config.ini`.'
  rubric:
  - 'Правки не были сохранены: они жили только в памяти процесса nano, а на диске оставался прежний `config.ini`; закрытое окно завершило nano'
  - '`config.ini.save` — запасной файл, куда nano при аварийном завершении записал несохранённый текст'
  - 'Вернуть: проверить содержимое `config.ini.save` (например, `cat`) и поставить его на место `config.ini` — `mv config.ini.save config.ini` или открыть и сохранить под именем `config.ini`'
  wrong_answers:
  - 'nano сохраняет при закрытии окна, значит, сервис просто не перечитал настройки'
  - '`config.ini.save` — резервная копия старой версии, правки потеряны'
  - 'Правки вернутся, если снова открыть `config.ini` в nano'
  followups:
  - 'Какой клавишей коллеге стоило сохранить файл, не выходя из nano?'
