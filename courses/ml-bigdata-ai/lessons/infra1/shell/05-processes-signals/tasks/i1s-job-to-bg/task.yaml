id: i1s-job-to-bg
title: Освободить терминал, не прерывая работу
sandbox: shell
difficulty: 2
concepts: [Ctrl+Z, bg, jobs, фоновое задание]
statement: |
  **Запустите `sleep 300` обычным образом, на переднем плане, а потом, не завершая его, переведите в фон, чтобы оно продолжало работать, а терминал принимал команды.**

  `sleep 300` здесь играет роль долгой выгрузки: прерывать и запускать её заново нельзя.

  Пример
  ```text
  student@forge:~$ jobs
  [1]+  Running                 sleep 300 &
  ```

  Ограничения: запуск сразу с `&` не засчитывается — задание должно начаться на переднем плане.
setup:
  cwd: /home/student
solution:
  - sleep 300 &
  - kill -TSTP %1
  - jobs
  - bg
tests:
  checks:
    - {name: sleep 300 работает, process_alive: sleep}
    - name: Задание выполняется в фоне, а не стоит
      run: jobs
      stdout_contains: ["Running", "sleep 300"]
      message: "jobs не показывает работающее задание sleep 300: оно остановлено, завершено или не запущено."
    - {name: Задание приостанавливали, signal_sent: {to: sleep, signal: TSTP}, message: "Задание не приостанавливали — запустите sleep 300 без & и остановите его клавишами."}
    - {name: Продолжено командой bg, command_used: bg}
hints:
  - level: 1
    text: "Пока `sleep 300` идёт на переднем плане, приглашения нет. Сочетание клавиш, которое приостанавливает команду, не завершая её, — не Ctrl+C."
  - level: 2
    text: "Приостановленное задание видно в `jobs` как `Stopped`. Одна команда вернёт его на передний план, другая — продолжит в фоне."
