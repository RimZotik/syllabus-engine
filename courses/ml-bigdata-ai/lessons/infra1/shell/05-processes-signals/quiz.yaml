title: Проверка темы
pass: 0.85
minutes: 25
questions:
- id: cpu-over-100
  type: single
  q: |
    Строка `ps aux` на сервере с 8 ядрами:
    ```
    USER     PID  %CPU %MEM    VSZ   RSS TTY  STAT START   TIME COMMAND
    student 5120 400.0 12.5 9805200 4100000 ? Rl  09:00 160:12 python3 train.py
    ```
    Что значит 400 в столбце `%CPU`?
  options:
  - 'Обучение занимает примерно четыре ядра целиком — половину процессора машины'
  - 'Ошибка `ps`: доля процессора не бывает больше 100 %'
  - 'Обучение занимает весь процессор и ещё ждёт в очереди в четыре раза больше'
  - 'Программа однопоточная, а 400 — сумма за четыре последних замера'
  answer: 0
  explain: '`%CPU` в строке процесса считается от одного ядра: 100 — одно ядро целиком. 400 могут дать только несколько потоков, работающих одновременно, — четыре ядра из восьми. Однопоточная программа выше 100 не поднимется.'
- id: stat-stopped
  type: single
  q: |
    Обработка выгрузки вдруг перестала занимать процессор. В `ps aux` её строка:
    ```
    student 6230  0.0  1.2 250000 98000 pts/1 T 10:02 3:41 python3 export.py
    ```
    Что, скорее всего, случилось и как продолжить работу с того же места?
  options:
  - 'Её приостановили, например клавишами Ctrl+Z в окне pts/1; продолжит `fg` или `bg` в том окне'
  - 'Она завершилась с ошибкой; запустить заново командой `fg` в окне pts/1'
  - 'Она ждёт диска; продолжится сама, когда ожидание закончится'
  - 'Её завершили по SIGTERM; строка исчезнет при следующем `ps aux`'
  answer: 0
  explain: '`T` — остановлен: процесс в памяти, но ядро не получает. Так бывает после Ctrl+Z (SIGTSTP). `fg` или `bg` в том же окне продолжат его с того же места. Ожидание диска — `D`, а завершённого процесса в `ps` вообще нет.'
- id: pgrep-by-name
  type: multi
  q: 'Работает `python3 train.py` с PID 5120, других процессов `python3` нет. Какие команды напечатают его PID?'
  options:
  - '`pgrep -f train.py`'
  - '`pgrep python3`'
  - '`pgrep train.py`'
  - '`pgrep -l train`'
  answer: [0, 1]
  explain: 'Имя процесса — имя программы, `python3`, поэтому `pgrep python3` его найдёт, а `train.py` и `train` в имени не встречаются. `-f` ищет по всей строке запуска, где есть и `train.py`.'
- id: chain-last-code
  type: single
  q: 'Команды `nosuchcmd` в системе нет. Что напечатает строка `nosuchcmd && echo A || echo B; echo $?`?'
  options:
  - 'Сообщение `command not found`, затем `B` и `0`'
  - 'Сообщение `command not found`, затем `B` и `127`'
  - 'Сообщение `command not found`, затем `A` и `0`'
  - 'Сообщение `command not found` и `127`: после ошибки строка останавливается'
  answer: 0
  explain: 'Ненайденная команда завершается с кодом 127. `&&` на ненулевой код пропускает `echo A`, а `||` запускает `echo B`. `;` выполняет `echo $?` в любом случае, а `$?` — код последней выполненной команды, `echo B`, то есть 0: код 127 к этому моменту уже заменён.'
- id: finally-on-signals
  type: single
  q: |
    ```python
    import time
    try:
        while True:
            time.sleep(1)
    finally:
        print("сохраняю")
    ```
    Программу останавливали двумя способами: Ctrl+C в её окне и `kill PID` из другого окна. Когда она напечатает «сохраняю»?
  options:
  - 'Только после Ctrl+C'
  - 'В обоих случаях: finally выполняется всегда'
  - 'Только после `kill PID`: SIGTERM — вежливая просьба'
  - 'Ни в одном: при сигнале Python сразу завершается'
  answer: 0
  explain: 'Python превращает SIGINT от Ctrl+C в исключение `KeyboardInterrupt`, и при выходе из `try` выполняется `finally`. Своего обработчика SIGTERM у Python нет: процесс завершается сразу, без исключения и без `finally`. Чтобы программа на SIGTERM сохранялась, обработчик ставят модулем `signal`.'
- id: and-for-move
  type: single
  q: 'Скрипт переносит архив так: `cp logs.tar /mnt/backup/ && rm logs.tar`. Зачем здесь `&&`, а не `;`?'
  options:
  - 'Чтобы `rm` выполнился, только если копирование завершилось с кодом 0'
  - 'Чтобы `cp` и `rm` выполнялись одновременно и перенос шёл быстрее'
  - 'Чтобы ошибка `cp` не печаталась на экран'
  - 'Разницы нет: `&&` и `;` — две записи одного и того же'
  answer: 0
  explain: '`;` выполнит `rm` при любом исходе — и если `/mnt/backup` нет, архив будет удалён без копии. `&&` смотрит на код возврата `cp`: 0 — копия есть, можно удалять. Команды при этом идут по очереди, а сообщение об ошибке `cp` всё равно появится.'
- id: code-after-kill9
  type: single
  q: 'В первом окне идёт `sleep 300`. Из второго окна его сняли командой `kill -9`. Что напечатает `echo $?` в первом окне?'
  options:
  - '137'
  - '9'
  - '0'
  - '130'
  answer: 0
  explain: 'Процесс завершён сигналом, и bash отдаёт код 128 + номер сигнала: 128 + 9 = 137. 130 — это 128 + 2, завершение по Ctrl+C. 0 был бы, если бы `sleep` доработал до конца.'
- id: jobs-new-window
  type: single
  q: |
    В окне терминала на сервере запустили
    ```
    nohup python3 -u train.py > train.log 2>&1 &
    ```
    Окно закрыли, открыли новое и набрали `jobs`. Что вы увидите?
  options:
  - 'Пустой список, хотя обучение идёт: задание принадлежало закрытой оболочке'
  - 'Строку `Running` с обучением: `nohup` переносит задание в новое окно'
  - 'Пустой список: обучение завершилось вместе с окном'
  - 'Строку `Stopped` с обучением: без окна задание ждёт `fg`'
  answer: 0
  traps: [2]
  explain: '`jobs` показывает задания только своей оболочки, а в новом окне — новая оболочка, у неё заданий нет. Обучение при этом живо: из-за `nohup` SIGHUP при закрытии окна его не завершил. Найти его можно как любой процесс — `pgrep -af train.py` или `ps aux`.'
- id: kill-job-number
  type: single
  q: |
    ```
    student@forge:~$ sleep 600 &
    [1] 4120
    student@forge:~$ sleep 900 &
    [2] 4121
    student@forge:~$ kill 2
    ```
    Что сделает последняя команда?
  options:
  - 'Попробует послать SIGTERM процессу с PID 2 и, скорее всего, ответит Operation not permitted'
  - 'Завершит задание `sleep 900`: оно второе'
  - 'Завершит оба задания: 2 — их число'
  - 'Пошлёт сигнал номер 2, SIGINT, последнему заданию'
  answer: 0
  explain: 'Без знака `%` число для `kill` — это PID, а процесс с номером 2 запущен системой при загрузке и принадлежит root: чужому процессу сигнал без `sudo` не послать. Задание номер 2 — `kill %2`, а номер сигнала пишут с минусом: `kill -2`.'
- id: code-write-busy
  type: code
  q: |
    **Напишите `busy(lines, user)`: по строкам `ps aux` вернуть список PID процессов пользователя `user`, у которых `%CPU` не меньше 50, — по убыванию `%CPU`.**
    Первая строка — заголовок. Столбцы разделены пробелами (их может быть несколько подряд): USER, PID, %CPU, …; в COMMAND тоже бывают пробелы. PID — числа.
    ```input
    busy([
        "USER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND",
        "root 412 0.0 0.1 283028 5100 ? S Nov20 0:00 /usr/lib/systemd/systemd-journald",
        "student 3001 99.7 0.2 68919 9000 ? R 07:50 29:54 hog",
        "student 5120 400.0 12.5 9805200 4100000 ? Rl 09:00 160:12 python3 train.py",
        "student 2210 0.0 0.1 11200 5100 pts/0 Ss 08:10 0:00 -bash",
    ], "student")
    ```
    ```output
    [5120, 3001]
    ```
  starter: |
    def busy(lines, user):
        pass


    print(busy([
        "USER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND",
        "student 3001 99.7 0.2 68919 9000 ? R 07:50 29:54 hog",
        "student 5120 400.0 12.5 9805200 4100000 ? Rl 09:00 160:12 python3 train.py",
    ], "student"))
  solution: |
    def busy(lines, user):
        found = []
        for line in lines[1:]:
            fields = line.split()
            if fields[0] == user and float(fields[2]) >= 50:
                found.append((float(fields[2]), int(fields[1])))
        found.sort(reverse=True)
        return [pid for cpu, pid in found]


    print(busy([
        "USER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND",
        "student 3001 99.7 0.2 68919 9000 ? R 07:50 29:54 hog",
        "student 5120 400.0 12.5 9805200 4100000 ? Rl 09:00 160:12 python3 train.py",
    ], "student"))
  tests:
    asserts:
    - name: Пример из условия
      code: |
        lines = [
            "USER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND",
            "root 412 0.0 0.1 283028 5100 ? S Nov20 0:00 /usr/lib/systemd/systemd-journald",
            "student 3001 99.7 0.2 68919 9000 ? R 07:50 29:54 hog",
            "student 5120 400.0 12.5 9805200 4100000 ? Rl 09:00 160:12 python3 train.py",
            "student 2210 0.0 0.1 11200 5100 pts/0 Ss 08:10 0:00 -bash",
        ]
        got = busy(lines, "student")
        assert got == [5120, 3001], f"Ожидалось [5120, 3001], а вернулось {got!r}"
    - name: Проценты сравниваются как числа
      code: |
        lines = [
            "USER         PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND",
            "anna        7001 99.0  0.1  11200  5100 ?        R    08:10   9:00 render",
            "anna        7002 100.0  0.1  11200  5100 ?        R    08:10   9:00 render --fast",
            "anna        7003 50.0  0.1  11200  5100 ?        R    08:10   9:00 zip",
            "anna        7004 49.9  0.1  11200  5100 ?        R    08:10   9:00 sort",
            "anna        7005 5.0  0.1  11200  5100 ?        S    08:10   0:10 nano",
        ]
        got = busy(lines, "anna")
        assert got == [7002, 7001, 7003], f"Ожидалось [7002, 7001, 7003]: 100.0 больше 99.0 как число, 50.0 входит, 49.9 и 5.0 — нет. Вернулось {got!r}"
    - name: Только процессы этого пользователя
      code: |
        lines = [
            "USER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND",
            "root 1203 97.0 0.1 246957 5100 ? R Nov20 50:00 /usr/sbin/sshd -D",
            "student 3001 60.0 0.2 68919 9000 ? R 07:50 29:54 hog",
            "studentx 3005 90.0 0.2 68919 9000 ? R 07:50 29:54 hog2",
        ]
        got = busy(lines, "student")
        assert got == [3001], f"Ожидалось [3001]: процессы root и studentx — не процессы student. Вернулось {got!r}"
        got = busy(lines[:1], "student")
        assert got == [], f"Без строк процессов нужен [], а вернулось {got!r}"
  explain: '`split()` без аргумента делит по любым пробелам, сколько бы их ни было подряд, — так столбцы находятся при любом выравнивании. Проценты сравнивают как числа (`float`): как строки `"100.0"` меньше `"99.0"`. Пользователя сравнивают целиком, а не по началу строки: `studentx` — другой пользователь. Сортируют пары `(%CPU, PID)` по убыванию и оставляют PID.'
- id: open-term-then-kill
  type: open
  q: 'Программа зависла и не реагирует. Почему её сначала останавливают командой `kill PID` и ждут несколько секунд, а `kill -9 PID` посылают, только если она всё ещё работает? Что можно потерять, если начать сразу с `kill -9`?'
  rubric:
  - '`kill PID` посылает SIGTERM — просьбу завершиться, на которую программа может ответить своим обработчиком: дописать файлы, сохранить состояние и выйти'
  - '`kill -9` посылает SIGKILL, который нельзя перехватить: ОС снимает процесс сразу, и начатые файлы остаются оборванными, несохранённые данные пропадают'
  wrong_answers:
  - kill -9 просто громче, чем kill, а результат тот же
  - kill без -9 программу не останавливает, это только проверка, жива ли она
  - После kill -9 ОС сама дописывает за программу все открытые файлы
  followups:
  - Что делать, если и после `kill PID` процесс ещё в списке `pgrep`?
