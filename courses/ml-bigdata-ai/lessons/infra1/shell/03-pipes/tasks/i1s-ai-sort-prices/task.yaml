id: i1s-ai-sort-prices
title: "ИИ написал команду: отсортировать цены"
sandbox: shell
difficulty: 3
concepts: [sort -n, перенаправление, ловушка sort f > f, mv]
statement: |
  **ИИ-помощник предложил отсортировать цены в `prices.txt` по возрастанию прямо в этом файле командой `sort prices.txt > prices.txt`. В команде две ошибки. Исправьте их и отсортируйте файл.**

  В итоге `prices.txt` содержит те же числа, по одному в строке, от меньшего к большему. Других файлов в папке после работы быть не должно.

  Пример

  Было (`prices.txt`):
  ```text
  120
  45
  1500
  ```

  Стало:
  ```text
  45
  120
  1500
  ```

  Если исходные цены пропали, нажмите «Сбросить».
setup:
  cwd: /home/student/shop
  files:
    prices.txt: "120\n45\n1500\n9\n300\n45\n2000\n75\n"
solution:
  - sort -n prices.txt > sorted.txt
  - mv sorted.txt prices.txt
tests:
  checks:
    - name: Цены на месте и отсортированы как числа
      fs_content: {path: prices.txt, equals: "9\n45\n45\n75\n120\n300\n1500\n2000\n"}
    - name: Лишних файлов не осталось
      run: ls
      stdout: "prices.txt\n"
hints:
  - level: 1
    text: "Выполните `sort prices.txt` без перенаправления: в каком порядке оказались 1500 и 300? Так сравнивают строки, а не числа."
  - level: 2
    text: "Когда оболочка готовит `> prices.txt` — до запуска `sort` или после того, как он прочитал файл?"
  - level: 3
    text: "Результат можно записать в другой файл, а потом поставить его на место исходного."
