id: i1s-top-ips
title: Пять самых частых адресов
sandbox: shell
difficulty: 3
concepts: [sort, uniq -c, sort -rn, head, конвейер]
statement: |
  **В `ips.txt` — адреса клиентов из журнала веб-сервера за ночь, по одному в строке. Запишите в `top5.txt` пять адресов, с которых пришло больше всего запросов, с числом запросов; самый частый — первым.**

  Формат строки — как у `uniq -c`: число, выровненное пробелами, затем адрес. Числа у пяти самых частых адресов различны.

  Пример

  `ips.txt` (короче, чем в задаче):
  ```text
  10.0.0.2
  10.0.0.5
  10.0.0.2
  10.0.0.9
  10.0.0.5
  10.0.0.2
  ```

  Адресов всего три, поэтому в ответе три строки:
  ```text
        3 10.0.0.2
        2 10.0.0.5
        1 10.0.0.9
  ```
setup:
  cwd: /home/student
  files:
    ips.txt: "10.0.0.12\n10.0.0.3\n10.0.0.7\n10.0.0.7\n10.0.0.12\n172.16.0.5\n10.0.0.7\n10.0.0.3\n192.168.1.20\n192.168.1.20\n172.16.0.5\n10.0.0.3\n10.0.0.9\n192.168.1.20\n10.0.0.7\n10.0.0.3\n10.0.0.12\n10.0.0.7\n10.0.0.3\n172.16.0.8\n192.168.1.20\n10.0.0.7\n192.168.1.4\n10.0.0.7\n192.168.1.20\n10.0.0.7\n192.168.1.20\n10.0.0.7\n192.168.1.4\n192.168.1.20\n172.16.0.5\n10.0.0.7\n10.0.0.7\n172.16.0.5\n10.0.0.7\n10.0.0.3\n"
solution:
  - sort ips.txt | uniq -c | sort -rn | head -n 5 > top5.txt
tests:
  checks:
    - name: В top5.txt — пять адресов с числами, по убыванию
      fs_content: {path: top5.txt, equals: "     12 10.0.0.7\n      7 192.168.1.20\n      6 10.0.0.3\n      4 172.16.0.5\n      3 10.0.0.12\n"}
hints:
  - level: 1
    text: "Соберите ответ по шагам: смотрите на вывод каждого шага, прежде чем добавить следующий."
  - level: 2
    text: "`uniq` сворачивает только соседние повторы — что нужно сделать с адресами до него?"
  - level: 3
    text: "Упорядочить строки по числу в начале — это сортировка чисел, а самые большие нужны сверху."
