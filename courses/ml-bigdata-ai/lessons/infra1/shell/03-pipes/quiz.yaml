title: Проверка темы
pass: 0.85
minutes: 26
questions:
- id: grep-word
  type: single
  q: |
    В `build.log` четыре строки:
    ```text
    error: missing file
    0 errors found
    Error in step 3
    terror.csv loaded
    ```
    Что напечатает `grep -c -w error build.log`?
  options:
  - '`1`'
  - '`2`'
  - '`3`'
  - '`4`'
  answer: 0
  explain: '`-w` ищет образец целым словом: в `errors` и `terror` к нему приклеены буквы, а двоеточие после `error` в первой строке — не буква, слово там целое. `Error` с заглавной не подходит: без `-i` регистр важен. `-c` печатает число строк — одна.'
- id: sort-reverse-text
  type: single
  q: 'В `sizes.txt` по строкам: `9`, `120`, `45`, `1000`. Что напечатает `sort -r sizes.txt | head -n 1`?'
  options:
  - '`9`'
  - '`1000`'
  - '`120`'
  - '`45`'
  answer: 0
  explain: 'Без `-n` `sort` сравнивает строки как текст, по первому символу: `9` больше `4` и `1`, поэтому в обратном порядке `9` первая. Число 1000 было бы первым только с `sort -rn`.'
- id: uniq-without-sort
  type: single
  q: 'В `buys.txt` по строкам: хлеб, молоко, хлеб, сыр, молоко, хлеб. Что напечатают `uniq buys.txt | wc -l` и `sort buys.txt | uniq | wc -l`?'
  options:
  - '`6` и `3`'
  - '`3` и `3`'
  - '`5` и `3`'
  - '`6` и `6`'
  answer: 0
  explain: '`uniq` убирает только соседние повторы, а одинаковых соседей в файле нет — все 6 строк остаются. После `sort` одинаковые города стоят рядом, и `uniq` оставляет по одному — три города.'
- id: wc-last-line
  type: single
  q: 'Программа записала в `list.txt` три строки, но после последней не поставила перевод строки: `сыр\nхлеб\nмолоко`. Что напечатает `wc -l < list.txt`?'
  options:
  - '`2`'
  - '`3`'
  - '`4`'
  - '`0`'
  answer: 0
  explain: '`wc -l` считает символы перевода строки, а не сами строки. Их в файле два — после «сыр» и после «хлеб»; у последней строки его нет, и она в счёт не попала.'
- id: only-number-to-file
  type: multi
  q: 'Нужно записать в `count.txt` только число строк `app.log` — без имени файла. Какие команды это сделают?'
  options:
  - '`wc -l < app.log > count.txt`'
  - '`cat app.log | wc -l > count.txt`'
  - '`wc -l app.log > count.txt`'
  - '`wc -l < app.log 2> count.txt`'
  - '`wc -l < app.log | head -n 1 > count.txt`'
  answer: [0, 1, 4]
  explain: 'Имени файла `wc` не знает, когда читает stdin — из перенаправления `<` или из канала, — и печатает только число. С именем в аргументах он печатает и имя. `2>` направляет в файл поток ошибок, а число уходит в stdout на экран — `count.txt` останется пустым. `head -n 1` пропускает единственную строку с числом без изменений.'
- id: sort-uniq-same-file
  type: single
  q: 'В `emails.txt` 200 адресов с повторами. Чтобы убрать повторы на месте, выполнили `sort emails.txt | uniq > emails.txt`. Что верно об этой команде?'
  options:
  - 'Адреса могут пропасть: `sort` и `uniq` запускаются одновременно, и `>` может очистить файл раньше, чем `sort` его прочитает'
  - 'Она безопасна: `uniq` начнёт писать, только когда `sort` прочитает весь файл, поэтому ловушка `sort f > f` здесь не срабатывает'
  - 'Оболочка откажется её выполнять: читать и перезаписывать один файл в одной строке нельзя'
  - 'Пропадут только повторы: `>` очищает лишь те строки, которые выбросил `uniq`'
  answer: 0
  traps: [1]
  explain: 'Каждая команда конвейера — свой процесс, и стартуют они сразу. `> emails.txt` готовится для процесса `uniq` ещё до запуска самой программы и очищает файл; успеет ли `sort` прочитать его раньше — дело случая, обычно не успевает. То, что `uniq` пишет позже, не спасает: файл очищает `>` при открытии, а не запись. Надёжно — через другой файл и `mv`.'
- id: redirect-order
  type: single
  q: 'Программа `check.py` печатает отчёт в stdout, а предупреждения — в stderr. Какая строка запишет и то и другое в `all.txt`?'
  options:
  - '`python3 check.py > all.txt 2>&1`'
  - '`python3 check.py 2>&1 > all.txt`'
  - '`python3 check.py > all.txt 2> /dev/null`'
  - '`python3 check.py 2> all.txt`'
  answer: 0
  explain: 'Оболочка разбирает перенаправления слева направо. `> all.txt` отправляет stdout в файл, затем `2>&1` — поток 2 туда же, куда сейчас поток 1, то есть в файл. В обратном порядке `2>&1` выполняется, пока stdout ещё на экране, и предупреждения идут на экран. `/dev/null` выбрасывает их, а `2>` без `>` пишет в файл только предупреждения.'
- id: pipe-and-traceback
  type: multi
  q: 'Программа печатает через `print` пять строк отчёта, а потом падает с трассировкой. Её запустили так: `python3 report.py | head -n 1 > top.txt`. Что верно?'
  options:
  - 'В `top.txt` — первая строка отчёта'
  - 'Трассировка появится на экране'
  - 'Трассировка не попадёт ни в `top.txt`, ни в `head`'
  - 'В `top.txt` — трассировка: ошибка пришла последней и вытеснила отчёт'
  - 'На экране будут видны все пять строк отчёта'
  answer: [0, 1, 2]
  explain: 'В канал идёт только stdout — пять строк отчёта; `head` оставляет первую и пишет её в файл. Трассировка уходит в stderr, а он по-прежнему подключён к терминалу. Строки отчёта на экран не попадают: их забрал канал.'
- id: find-vs-glob
  type: single
  q: |
    Текущая папка:
    ```text
    ./
    ├── app.log
    └── logs/
        ├── a.log
        ├── b.log
        └── old/
            └── c.log
    ```
    Что напечатают `ls *.log | wc -l` и `find . -name '*.log' | wc -l`?
  options:
  - '`1` и `4`'
  - '`4` и `4`'
  - '`1` и `1`'
  - '`3` и `4`'
  answer: 0
  explain: 'Шаблон `*.log` оболочка раскрывает по одной текущей папке — там только `app.log`. `find` обходит всё дерево со вложенными папками и сам сверяет шаблон с каждым именем — четыре файла.'
- id: code-top-lines
  type: code
  q: |
    **Напишите программу, которая повторяет конвейер `sort | uniq -c | sort -rn | head -n 3`: читает строки до конца ввода и печатает три самые частые строки с числом повторов.**
    Формат — как у `uniq -c`: число, выровненное пробелами по правому краю в 7 символов, пробел, строка. Самая частая — первой; при равном числе выше та строка, что больше при сравнении строк в Python. Если разных строк меньше трёх — печатаются все.
    ```input
    Омск
    Казань
    Омск
    Тверь
    Омск
    Казань
    ```
    ```output
          3 Омск
          2 Казань
          1 Тверь
    ```
  starter: |
    import sys

    lines = sys.stdin.read().splitlines()
  solution: |
    import sys

    lines = sys.stdin.read().splitlines()
    counts = {}
    for line in lines:
        counts[line] = counts.get(line, 0) + 1
    top = sorted(counts.items(), key=lambda p: (p[1], p[0]), reverse=True)[:3]
    for line, n in top:
        print(f"{n:7d} {line}")
  tests:
    io:
    - name: Пример из условия
      stdin: "Омск\nКазань\nОмск\nТверь\nОмск\nКазань\n"
      stdout: "      3 Омск\n      2 Казань\n      1 Тверь"
    - name: Больше трёх разных строк, числа больше 9
      stdin: "10.0.0.1\n10.0.0.2\n10.0.0.1\n10.0.0.3\n10.0.0.1\n10.0.0.4\n10.0.0.2\n10.0.0.1\n10.0.0.1\n10.0.0.1\n10.0.0.1\n10.0.0.1\n10.0.0.1\n10.0.0.1\n10.0.0.3\n10.0.0.2\n"
      stdout: "     10 10.0.0.1\n      3 10.0.0.2\n      2 10.0.0.3"
      hidden: true
    - name: Ничья — выше большая строка
      stdin: "b\na\nc\nd\na\nb\n"
      stdout: "      2 b\n      2 a\n      1 d"
      hidden: true
    - name: Повторы не подряд и одна разная строка
      stdin: "x\ny\nx\n"
      stdout: "      2 x\n      1 y"
      hidden: true
    - name: Одна строка
      stdin: "ok\n"
      stdout: "      1 ok"
      hidden: true
  explain: '`sort | uniq -c` — это подсчёт повторов каждой строки, в Python — словарь «строка → число». `sort -rn` упорядочивает по числу по убыванию, `head -n 3` берёт первые три. Ключ `(число, строка)` с `reverse=True` ставит сначала большие числа, а при равных — большую строку. Формат `7d` выравнивает число по правому краю в 7 символов, как `uniq -c`.'
- id: open-missing-traceback
  type: open
  q: 'Коллега запускает обучение командой `python3 train.py > log.txt`. Обучение упало, и он жалуется: «В `log.txt` есть вывод `print`, а трассировки нет — Python не записал ошибку». Объясните, куда делась трассировка, и как изменить команду, чтобы в `log.txt` попали и вывод, и ошибки.'
  rubric:
  - 'Трассировка ушла в поток ошибок stderr, а `>` перенаправляет в файл только stdout; поэтому ошибка была показана на экране, а не записана в файл'
  - 'Чтобы записать оба потока в один файл: `python3 train.py > log.txt 2>&1` — `2>&1` стоит после `>`, иначе ошибки уйдут на экран'
  wrong_answers:
  - 'Python не пишет трассировку, если вывод перенаправлен в файл'
  - 'Трассировка ушла в stdin'
  - 'Надо писать `2>&1 > log.txt`, порядок не важен'
  followups:
  - 'Как выбросить предупреждения программы, но оставить её вывод на экране?'
