id: i1m-bits-needed
title: Сколько битов на номер
sandbox: python-browser
difficulty: 2
statement: |
  **Для каждого `N` выведите, сколько битов и сколько целых байтов нужно как минимум, чтобы дать `N` разным значениям разные двоичные номера одинаковой длины.**

  Каждая строка ввода — целое `N`, не меньше 2; ввод заканчивается пустой строкой. Вывод — `N: битов B, байтов K` на каждую строку; байтов — сколько нужно, чтобы вместить B битов.

  Пример 1
  ```input
  300
  256

  ```
  ```output
  300: битов 9, байтов 2
  256: битов 8, байтов 1
  ```

  Пример 2
  ```input
  2

  ```
  ```output
  2: битов 1, байтов 1
  ```

  Ограничения: нельзя `bit_length` и логарифмы (`log`, `log2`) — считайте степени двойки сами.
starter: |
  # План:
  # 1. Читать числа до пустой строки
  # 2. Для каждого найти наименьшее B, при котором 2 ** B не меньше N
  # 3. Байтов — B, делённое на 8 с округлением вверх
solution: |
  line = input()
  while line != "":
      n = int(line)
      bits = 1
      while 2 ** bits < n:
          bits += 1
      nbytes = (bits + 7) // 8
      print(f"{n}: битов {bits}, байтов {nbytes}")
      line = input()
stdin: "300\n256\n\n"
tests:
  forbid: [bit_length, log, log2, log10, bin, format]
  io:
    - name: Пример 1
      stdin: "300\n256\n\n"
      stdout: "300: битов 9, байтов 2\n256: битов 8, байтов 1"
    - name: Пример 2
      stdin: "2\n\n"
      stdout: "2: битов 1, байтов 1"
    - name: Границы степеней двойки
      stdin: "257\n3\n4\n5\n65536\n65537\n\n"
      stdout: "257: битов 9, байтов 2\n3: битов 2, байтов 1\n4: битов 2, байтов 1\n5: битов 3, байтов 1\n65536: битов 16, байтов 2\n65537: битов 17, байтов 3"
      hidden: true
    - name: Миллиард
      stdin: "1000000000\n\n"
      stdout: "1000000000: битов 30, байтов 4"
      hidden: true
hints:
  - level: 1
    text: 'В B битах помещается 2 в степени B разных значений. Нужна наименьшая такая степень, которая не меньше `N`.'
  - level: 2
    text: 'Начните с одного бита и прибавляйте по биту, пока значений не хватает. Проверьте условие цикла на `N = 256` и `N = 257`: «меньше» или «не больше» здесь меняет ответ.'
  - level: 3
    text: 'Байтов — B / 8 с округлением вверх: 9 битов не помещаются в один байт. Целыми числами это `(bits + 7) // 8`.'
