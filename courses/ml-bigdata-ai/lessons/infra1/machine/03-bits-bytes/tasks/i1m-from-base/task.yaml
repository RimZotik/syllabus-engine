id: i1m-from-base
title: Из любой — в число
sandbox: python-browser
difficulty: 2
statement: |
  **Напишите `from_base(s, b)`: вернуть число, записанное строкой `s` в системе с основанием `b`, — как `int(s, b)`, но без `int`.**

  `b` — от 2 до 16. Цифры — `0`–`9` и буквы `A`–`F` в любом регистре, без префикса и знака. Если строка пустая или в ней есть символ, который не цифра в этой системе, — выбросить `ValueError`.

  Пример 1
  ```input
  from_base("C8", 16)
  from_base("ff", 16)
  from_base("1101", 2)
  ```
  ```output
  200
  255
  13
  ```

  Пример 2
  ```input
  from_base("102", 2)
  ```
  ```output
  ValueError
  ```

  Ограничения: нельзя `int` и `eval`.
starter: |
  DIGITS = "0123456789ABCDEF"


  def from_base(s, b):
      pass


  print(from_base("C8", 16))
solution: |
  DIGITS = "0123456789ABCDEF"


  def from_base(s, b):
      if s == "":
          raise ValueError("пустая запись")
      number = 0
      for ch in s.upper():
          digit = DIGITS.find(ch)
          if digit == -1 or digit >= b:
              raise ValueError(f"{ch!r} — не цифра в системе с основанием {b}")
          number = number * b + digit
      return number


  print(from_base("C8", 16))
tests:
  forbid: [int, eval, exec]
  asserts:
    - name: Примеры из условия
      code: |
        for args, want in [(("C8", 16), 200), (("ff", 16), 255), (("1101", 2), 13)]:
            got = from_base(*args)
            assert got == want, f"from_base{args} должна вернуть {want}, а вернула {got!r}"
    - name: Нули, края байта и другие основания
      code: |
        for args, want in [(("0", 2), 0), (("11111111", 2), 255), (("100", 16), 256), (("755", 8), 493), (("1022", 3), 35), (("0042", 10), 42), (("aBcD", 16), 43981)]:
            got = from_base(*args)
            assert got == want, f"from_base{args} должна вернуть {want}, а вернула {got!r}"
    - name: Большое число
      code: |
        got = from_base("1" + "0" * 16, 16)
        assert got == 2 ** 64, f"from_base('1' + '0' * 16, 16) должна вернуть 2 ** 64, а вернула {got!r}"
    - name: Не цифры — ValueError
      code: |
        for args in [("102", 2), ("1G", 16), ("9", 8), ("", 10), ("12 3", 10), ("-5", 10)]:
            what = None
            try:
                what = "вернула " + repr(from_base(*args))
            except ValueError:
                what = "ValueError"
            assert what == "ValueError", f"from_base{args} должна выбросить ValueError, а {what}"
hints:
  - level: 1
    text: 'Число по записи собирают слева направо, как 375 из цифр 3, 7, 5: на каждом шаге — умножить накопленное на основание и прибавить новую цифру.'
  - level: 2
    text: 'Значение цифры — её место в строке `DIGITS`: `DIGITS.find(ch)` вернёт его или -1, если символа там нет. Строчные буквы сначала переведите в заглавные.'
  - level: 3
    text: 'Цифра годится, только если она нашлась и меньше основания: в двоичной системе `2` уже не цифра. Иначе — `raise ValueError(...)`. Пустую строку проверьте до цикла.'
