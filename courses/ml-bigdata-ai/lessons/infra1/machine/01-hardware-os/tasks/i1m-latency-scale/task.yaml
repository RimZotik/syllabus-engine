id: i1m-latency-scale
title: Если бы наносекунда длилась секунду
sandbox: python-browser
difficulty: 2
statement: |
  **Растяните время: пусть одна наносекунда длится секунду. Для каждой задержки выведите, сколько она длилась бы в растянутом времени, в самой крупной подходящей единице.**

  Каждая строка ввода — `имя значение единица`: имя — одно слово, значение — число, возможно дробное, единица — `нс`, `мкс`, `мс` или `с`. Ввод заканчивается пустой строкой. Растянутое время в секундах равно задержке в наносекундах. Единица вывода: меньше 60 с — `с`; меньше часа — `мин`; меньше суток — `ч`; меньше 365 суток — `сут`; иначе `лет` (год — 365 суток). Вывод — `имя: N единица`, N с одним знаком после точки.

  Пример 1
  ```input
  кэш 1 нс
  память 100 нс
  ssd 100 мкс
  hdd 10 мс
  сеть 150 мс

  ```
  ```output
  кэш: 1.0 с
  память: 1.7 мин
  ssd: 1.2 сут
  hdd: 115.7 сут
  сеть: 4.8 лет
  ```

  Пример 2
  ```input
  моргнуть 0.3 с

  ```
  ```output
  моргнуть: 9.5 лет
  ```
starter: |
  TO_NS = {"нс": 1, "мкс": 1000, "мс": 1_000_000, "с": 1_000_000_000}

  # План:
  # 1. Читать строки до пустой: имя, значение, единица
  # 2. Перевести задержку в наносекунды — это растянутое время в секундах
  # 3. Выбрать единицу вывода и перевести в неё
stdin: "кэш 1 нс\nпамять 100 нс\nssd 100 мкс\nhdd 10 мс\nсеть 150 мс\n\n"
solution: |
  TO_NS = {"нс": 1, "мкс": 1000, "мс": 1_000_000, "с": 1_000_000_000}
  MINUTE = 60
  HOUR = 60 * MINUTE
  DAY = 24 * HOUR
  YEAR = 365 * DAY

  line = input()
  while line != "":
      name, value, unit = line.split()
      seconds = float(value) * TO_NS[unit]
      if seconds < MINUTE:
          amount, label = seconds, "с"
      elif seconds < HOUR:
          amount, label = seconds / MINUTE, "мин"
      elif seconds < DAY:
          amount, label = seconds / HOUR, "ч"
      elif seconds < YEAR:
          amount, label = seconds / DAY, "сут"
      else:
          amount, label = seconds / YEAR, "лет"
      print(f"{name}: {amount:.1f} {label}")
      line = input()
tests:
  io:
    - name: Пример 1
      stdin: "кэш 1 нс\nпамять 100 нс\nssd 100 мкс\nhdd 10 мс\nсеть 150 мс\n\n"
      stdout: "кэш: 1.0 с\nпамять: 1.7 мин\nssd: 1.2 сут\nhdd: 115.7 сут\nсеть: 4.8 лет"
    - name: Пример 2
      stdin: "моргнуть 0.3 с\n\n"
      stdout: "моргнуть: 9.5 лет"
    - name: Ровно на границах единиц
      stdin: "a 59 нс\nb 60 нс\nc 3600 нс\nd 86400 нс\ne 31536 мкс\n\n"
      stdout: "a: 59.0 с\nb: 1.0 мин\nc: 1.0 ч\nd: 1.0 сут\ne: 1.0 лет"
      hidden: true
    - name: Дробные значения и часы
      stdin: "регистр 0.5 нс\nпоток 2.5 мкс\nзапрос 7.2 мкс\n\n"
      stdout: "регистр: 0.5 с\nпоток: 41.7 мин\nзапрос: 2.0 ч"
      hidden: true
    - name: Пустой ввод
      stdin: "\n"
      stdout: ""
      hidden: true
hints:
  - level: 1
    text: 'Сначала переведите любую задержку в наносекунды — словарь `TO_NS` уже есть. Получившееся число и есть растянутое время в секундах.'
  - level: 2
    text: 'Заведите длины минуты, часа, суток и года в секундах и сравнивайте с ними по возрастанию: первая граница, которую время не достигло, и выбирает единицу.'
  - level: 3
    text: 'Цепочка `if seconds < MINUTE: … elif seconds < HOUR: … elif … else:` — в каждой ветке поделите на размер своей единицы. Граница «меньше»: ровно 60 с — уже `1.0 мин`.'
