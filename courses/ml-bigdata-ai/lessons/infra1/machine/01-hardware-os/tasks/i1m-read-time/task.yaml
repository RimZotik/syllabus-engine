id: i1m-read-time
title: Сколько читать датасет
sandbox: python-browser
difficulty: 1
statement: |
  **Выведите, сколько секунд займёт прочитать подряд датасет размером `S` ГБ с жёсткого диска, с SSD и из оперативной памяти.**

  Скорость чтения подряд: жёсткий диск — 150 МБ/с, SSD — 2 ГБ/с, память — 20 ГБ/с; 1 ГБ = 1000 МБ. Ввод — число `S`, возможно дробное. Вывод — три строки `HDD: T с`, `SSD: T с`, `RAM: T с`, время с одним знаком после точки.

  Пример 1
  ```input
  20
  ```
  ```output
  HDD: 133.3 с
  SSD: 10.0 с
  RAM: 1.0 с
  ```

  Пример 2
  ```input
  0.4
  ```
  ```output
  HDD: 2.7 с
  SSD: 0.2 с
  RAM: 0.0 с
  ```
starter: |
  size_gb = float(input())

  # Переведите размер в МБ, а скорости — в МБ/с, и разделите
stdin: "20\n"
solution: |
  size_mb = float(input()) * 1000
  speeds = [("HDD", 150), ("SSD", 2000), ("RAM", 20000)]
  for name, mb_per_s in speeds:
      print(f"{name}: {size_mb / mb_per_s:.1f} с")
tests:
  io:
    - name: Пример 1
      stdin: "20\n"
      stdout: "HDD: 133.3 с\nSSD: 10.0 с\nRAM: 1.0 с"
    - name: Пример 2
      stdin: "0.4\n"
      stdout: "HDD: 2.7 с\nSSD: 0.2 с\nRAM: 0.0 с"
    - name: Большой датасет
      stdin: "512\n"
      stdout: "HDD: 3413.3 с\nSSD: 256.0 с\nRAM: 25.6 с"
      hidden: true
    - name: Дробный размер
      stdin: "1.6\n"
      stdout: "HDD: 10.7 с\nSSD: 0.8 с\nRAM: 0.1 с"
      hidden: true
hints:
  - level: 1
    text: 'Время — это объём, делённый на скорость. Деление имеет смысл, только если объём и скорость в одних единицах.'
  - level: 2
    text: 'Переведите всё в мегабайты: `S` ГБ — это `S * 1000` МБ, 2 ГБ/с — 2000 МБ/с, 20 ГБ/с — 20000 МБ/с.'
  - level: 3
    text: 'Один знак после точки даёт спецификация формата `.1f` в f-строке. Три строки удобно вывести циклом по парам «имя, скорость».'
