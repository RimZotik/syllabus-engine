title: Проверка темы
pass: 0.85
minutes: 18
questions:
- id: many-small-files
  type: single
  q: 'Нужно скопировать на SSD 2 ГБ данных. Вариант А — один файл на 2 ГБ, вариант Б — 200 000 маленьких файлов на те же 2 ГБ. Почему Б обычно идёт заметно дольше?'
  options:
  - 'Каждый маленький файл — отдельное обращение со своей задержкой, а большой читается подряд одним потоком'
  - 'Маленькие файлы не помещаются в кэш процессора по одному, а большой файл кэш держит целиком'
  - 'Каждый файл — отдельная программа, и ОС переключает процессор между двумястами тысячами программ'
  - 'Маленькие файлы копируются через оперативную память, а большой — с диска на диск напрямую'
  answer: 0
  explain: 'При чтении подряд важна скорость потока, а при множестве мелких чтений — задержка каждого: 200 000 раз приходится «ехать» в новое место. Файл — не программа, его никто не запускает. Кэш — несколько мегабайтов, в нём не поместится ни один из вариантов. Данные в обоих случаях проходят через память.'
- id: same-py-other-cpu
  type: single
  q: 'Файл `report.py` скопировали с ноутбука на компьютер с процессором другой фирмы, у которого свои машинные инструкции. Python там установлен, и программа работает. Почему один и тот же файл работает на обоих процессорах?'
  options:
  - 'Его выполняет интерпретатор `python`, а сам он собран под инструкции этого процессора'
  - 'Строки Python — это и есть машинные инструкции, и все процессоры их понимают одинаково'
  - 'При копировании файл `.py` сам переводится в машинные инструкции нового процессора'
  - 'Операционная система переводит каждую строку Python в инструкции процессора'
  answer: 0
  explain: 'В `.py` — текст, процессор такого не понимает. Его читает и выполняет программа `python`, а уж она состоит из машинных инструкций своего процессора: под каждый процессор интерпретатор свой. Копирование не меняет байты файла, а ОС распоряжается ресурсами, но код на Python не переводит.'
- id: second-pass-faster
  type: single
  q: 'Процессор дважды подряд читает из оперативной памяти одну и ту же небольшую таблицу чисел. Второе чтение идёт заметно быстрее первого. Почему?'
  options:
  - 'После первого чтения копии этих чисел остались в кэше, и во второй раз процессор берёт их оттуда'
  - 'Первое чтение навсегда перенесло таблицу в кэш, и больше к оперативной памяти не обращаются'
  - 'Во второй раз таблица читается с диска подряд, потоком, а не по одному числу'
  - 'Процессор запомнил результат первого чтения в регистре и второй раз не читает'
  answer: 0
  traps: [1]
  explain: 'Кэш сам держит копии недавно использованных данных и их соседей — они вероятно понадобятся снова. Но копии не вечные: кэш маленький, старое вытесняется новым, и данные по-прежнему лежат в памяти. Диск здесь ни при чём: таблица уже в памяти. Регистров — несколько десятков, таблица в них не помещается.'
- id: code-fix-wait-seconds
  type: code
  q: |
    **Исправьте `wait_seconds(requests, latency_ms)`: вернуть, сколько секунд программа ждёт сеть, если делает `requests` запросов по очереди, каждый с задержкой `latency_ms` миллисекунд.**
    ```input
    wait_seconds(10000, 150)
    wait_seconds(1, 150)
    ```
    ```output
    1500.0
    0.15
    ```
  starter: |
    def wait_seconds(requests, latency_ms):
        return requests * latency_ms


    print(wait_seconds(10000, 150))
  solution: |
    def wait_seconds(requests, latency_ms):
        return requests * latency_ms / 1000


    print(wait_seconds(10000, 150))
  tests:
    asserts:
    - name: Примеры из условия
      code: |
        for args, want in [((10000, 150), 1500.0), ((1, 150), 0.15)]:
            got = wait_seconds(*args)
            assert abs(got - want) < 1e-9, f"wait_seconds{args} должна вернуть {want}, а вернула {got!r}"
    - name: Другие задержки
      code: |
        for args, want in [((0, 150), 0.0), ((3, 40), 0.12), ((1000000, 0.1), 100.0)]:
            got = wait_seconds(*args)
            assert abs(got - want) < 1e-9, f"wait_seconds{args} должна вернуть {want}, а вернула {got!r}"
  explain: 'В секунде 1000 миллисекунд, поэтому время в миллисекундах делят на 1000. Десять тысяч запросов по 150 мс — 25 минут ожидания: так выглядит цикл, который на каждом шаге ходит в сеть.'
- id: code-change-total-sales
  type: code
  q: |
    **Измените `total_sales(path)`: она складывает числа из файла продаж — по одному в строке, — но загружает весь файл в память. Файл больше оперативной памяти: читайте его по одной строке, держа в памяти только текущую строку и итог.**
    Пустые строки пропускаются.
    ```input
    (sales.txt)
    120
    45.5

    30
    (вызов)
    total_sales("sales.txt")
    ```
    ```output
    195.5
    ```
    Ограничения: нельзя `read`, `readlines`, `list` и `tuple` — они собирают весь файл в памяти.
  starter: |
    def total_sales(path):
        with open(path, encoding="utf-8") as f:
            lines = f.read().split("\n")
        total = 0
        for line in lines:
            if line.strip():
                total += float(line)
        return total


    print(total_sales("sales.txt"))
  solution: |
    def total_sales(path):
        total = 0
        with open(path, encoding="utf-8") as f:
            for line in f:
                if line.strip():
                    total += float(line)
        return total


    print(total_sales("sales.txt"))
  tests:
    forbid: [read, readlines, list, tuple]
    files:
      sales.txt: "120\n45.5\n\n30\n"
    asserts:
    - name: Файл из условия
      code: |
        got = total_sales("sales.txt")
        assert abs(got - 195.5) < 1e-9, f"total_sales('sales.txt') должна вернуть 195.5, а вернула {got!r}"
    - name: Длинный файл и последняя строка без перевода
      code: |
        with open("big.txt", "w", encoding="utf-8") as f:
            f.write("1.5\n" * 100000 + "\n7")
        got = total_sales("big.txt")
        assert abs(got - 150007) < 1e-6, f"Для 100 000 строк «1.5», пустой строки и «7» нужно 150007, а вернулось {got!r}"
    - name: Пустой файл
      code: |
        with open("empty.txt", "w", encoding="utf-8") as f:
            pass
        got = total_sales("empty.txt")
        assert got == 0, f"Для пустого файла нужно 0, а вернулось {got!r}"
  explain: '`read` и `readlines` переносят в память весь файл, и файл больше памяти не поместится, сколько бы места ни было на диске. Цикл `for line in f` берёт из файла по строке: в памяти одновременно только текущая строка и накопленный итог, поэтому размер файла уже не важен.'
- id: code-fix-rate-once
  type: code
  q: |
    **Исправьте `to_rubles(prices)`: она переводит цены из долларов в рубли по курсу из файла `rate.txt`, но открывает файл для каждой цены. Нужно открывать его один раз за вызов.**
    Курс в файле может меняться между вызовами, поэтому читайте его при каждом вызове. Рубли округляются до копеек: `round(x, 2)`.
    ```input
    (rate.txt)
    92.5
    (вызов)
    to_rubles([10, 2.5])
    ```
    ```output
    [925.0, 231.25]
    ```
  starter: |
    def to_rubles(prices):
        result = []
        for price in prices:
            with open("rate.txt", encoding="utf-8") as f:
                rate = float(f.read())
            result.append(round(price * rate, 2))
        return result


    print(to_rubles([10, 2.5]))
  solution: |
    def to_rubles(prices):
        with open("rate.txt", encoding="utf-8") as f:
            rate = float(f.read())
        result = []
        for price in prices:
            result.append(round(price * rate, 2))
        return result


    print(to_rubles([10, 2.5]))
  tests:
    files:
      rate.txt: "92.5\n"
    asserts:
    - name: Пример из условия
      code: |
        got = to_rubles([10, 2.5])
        assert got == [925.0, 231.25], f"to_rubles([10, 2.5]) должна вернуть [925.0, 231.25], а вернула {got!r}"
    - name: Файл открывается один раз за вызов
      code: |
        import builtins
        real_open = builtins.open
        opened = []
        def counting_open(*args, **kwargs):
            opened.append(args[0] if args else kwargs.get("file"))
            return real_open(*args, **kwargs)
        builtins.open = counting_open
        try:
            to_rubles([1, 2, 3, 4, 5])
        finally:
            builtins.open = real_open
        assert len(opened) <= 1, f"На пяти ценах файл открыт {len(opened)} раз, а нужно один раз за вызов"
    - name: Курс изменился между вызовами
      code: |
        with open("rate.txt", "w", encoding="utf-8") as f:
            f.write("33.33\n")
        got = to_rubles([3, 0.5])
        assert got == [99.99, 16.66], f"После смены курса на 33.33 нужно [99.99, 16.66], а вернулось {got!r}: курс надо читать при каждом вызове и округлять до копеек"
  explain: 'Открыть и прочитать файл — это просьба к ОС и обращение к диску, на каждом шаге цикла оно повторяется зря: курс от цены не зависит. Читают его один раз до цикла и запоминают в переменной, а дальше берут из памяти. Чтение при каждом вызове функции оставляет программу верной, если курс в файле обновили.'
- id: code-write-where-time-goes
  type: code
  q: |
    **Напишите программу: по списку обращений посчитать, сколько миллисекунд программа ждёт данных, и назвать, на что уходит больше всего ожидания.**
    Каждая строка ввода — `место количество`, ввод заканчивается пустой строкой (хотя бы одна строка до неё есть). Задержка одного обращения: `кэш` — 1 нс, `память` — 100 нс, `ssd` — 100 мкс, `hdd` — 10 мс, `сеть` — 150 мс. Одно место может встретиться несколько раз — количества складываются. Вывод — `Ожидание: X мс` (X с одним знаком после точки) и `Дольше всего: место`; при равенстве — то, что раньше встретилось во вводе.
    ```input
    память 1000000
    ssd 1000
    сеть 2

    ```
    ```output
    Ожидание: 500.0 мс
    Дольше всего: сеть
    ```
  starter: |
    LATENCY_NS = {"кэш": 1, "память": 100, "ssd": 100_000, "hdd": 10_000_000, "сеть": 150_000_000}

    # План:
    # 1. Читать строки до пустой, копить ожидание по каждому месту
    # 2. Вывести общее ожидание в мс и место, где ожидание больше всего
  solution: |
    LATENCY_NS = {"кэш": 1, "память": 100, "ssd": 100_000, "hdd": 10_000_000, "сеть": 150_000_000}

    waits = {}
    line = input()
    while line != "":
        place, count = line.split()
        waits[place] = waits.get(place, 0) + int(count) * LATENCY_NS[place]
        line = input()
    total_ms = sum(waits.values()) / 1_000_000
    print(f"Ожидание: {total_ms:.1f} мс")
    print("Дольше всего:", max(waits, key=waits.get))
  tests:
    io:
    - name: Пример из условия
      stdin: "память 1000000\nssd 1000\nсеть 2\n\n"
      stdout: "Ожидание: 500.0 мс\nДольше всего: сеть"
    - name: Повторы складываются
      stdin: "hdd 3\nкэш 5000000\nhdd 2\n\n"
      stdout: "Ожидание: 55.0 мс\nДольше всего: hdd"
      hidden: true
    - name: Равенство — первое во вводе
      stdin: "память 1000000\nssd 1000\n\n"
      stdout: "Ожидание: 200.0 мс\nДольше всего: память"
      hidden: true
    - name: Мало ожидания
      stdin: "кэш 30000\n\n"
      stdout: "Ожидание: 0.0 мс\nДольше всего: кэш"
      hidden: true
  explain: 'Ожидание по месту — количество обращений, умноженное на задержку одного. Удобно считать в наносекундах целыми числами и только в конце делить на миллион. Словарь «место → ожидание» копит повторы, а `max` с `key` выбирает место с наибольшим ожиданием и при равенстве оставляет первое по порядку. В примере миллион обращений к памяти «стоят» столько же, сколько тысяча к SSD, а две поездки по сети — больше обоих.'
