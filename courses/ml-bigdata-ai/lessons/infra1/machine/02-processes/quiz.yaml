title: Проверка темы
pass: 0.85
minutes: 18
questions:
- id: tabs-as-processes
  type: single
  q: 'Браузер держит каждую вкладку в отдельном процессе, а не в отдельном потоке одного процесса. Что это даёт?'
  options:
  - 'Если страница в одной вкладке упадёт, данные других вкладок не пострадают'
  - 'Вкладки обмениваются данными быстрее: у процессов общая память'
  - 'Каждая вкладка получает своё ядро процессора на всё время работы'
  - 'ОС не переключает процессы, поэтому вкладки не тормозят друг друга'
  answer: 0
  explain: 'У каждого процесса своя память, и ошибка в одном процессе не портит данные другого. У потоков память общая — упавший поток мог бы задеть соседей. Именно поэтому обмен между процессами труднее, а не легче. Ядра ОС делит между всеми процессами отрезками времени, своего навсегда никто не получает.'
- id: busy-and-waiting
  type: single
  q: 'У компьютера одно ядро. Программа А только считает и в одиночку работает 10 секунд. Вместе с ней запустили программу Б, которая почти всё время ждёт ответа сервера. Сколько примерно будет работать А?'
  options:
  - 'Около 10 секунд: Б почти всё время ждёт и ядро не занимает'
  - 'Около 20 секунд: ОС делит одно ядро между двумя программами поровну'
  - 'Пока Б не дождётся ответа: до этого Б держит ядро за собой'
  - 'Меньше 10 секунд: пока Б ждёт, А получает и долю Б'
  answer: 0
  traps: [1]
  explain: 'Поровну ядро делится между теми, кто считает, — как две считающие копии. Ждущая программа отдаёт ядро сразу и не держит его до ответа. А получает ядро почти всё время, но быстрее, чем в одиночку, идти не может: и одна она занимала ядро целиком.'
- id: code-fix-count-by-program
  type: code
  q: |
    **Исправьте `count_by_program(rows)`: по строкам из `tasklist` — парам `(программа, PID)` — вернуть словарь программа → число её процессов.** Сейчас для двух запусков `python.exe` получается 1.
    ```input
    count_by_program([("python.exe", 36412), ("chrome.exe", 812), ("python.exe", 33648)])
    ```
    ```output
    {'python.exe': 2, 'chrome.exe': 1}
    ```
  starter: |
    def count_by_program(rows):
        result = {}
        for name, pid in rows:
            result[name] = 1
        return result


    print(count_by_program([("python.exe", 36412), ("chrome.exe", 812), ("python.exe", 33648)]))
  solution: |
    def count_by_program(rows):
        result = {}
        for name, pid in rows:
            result[name] = result.get(name, 0) + 1
        return result


    print(count_by_program([("python.exe", 36412), ("chrome.exe", 812), ("python.exe", 33648)]))
  tests:
    asserts:
    - name: Пример из условия
      code: |
        got = count_by_program([("python.exe", 36412), ("chrome.exe", 812), ("python.exe", 33648)])
        assert got == {"python.exe": 2, "chrome.exe": 1}, f"Ожидалось {{'python.exe': 2, 'chrome.exe': 1}}, а вернулось {got!r}"
    - name: Много процессов у одной программы
      code: |
        rows = [("chrome.exe", p) for p in range(100, 112)] + [("Telegram.exe", 5), ("python.exe", 7)]
        got = count_by_program(rows)
        want = {"chrome.exe": 12, "Telegram.exe": 1, "python.exe": 1}
        assert got == want, f"Ожидалось {want}, а вернулось {got!r}"
    - name: Пустой список
      code: |
        got = count_by_program([])
        assert got == {}, f"Для пустого списка нужен {{}}, а вернулось {got!r}"
  explain: 'Каждая строка `tasklist` — отдельный процесс, и строки одной программы надо сложить, а не перезаписать единицей. Счётчик в словаре: `result.get(name, 0) + 1`. У браузера таких строк обычно больше десятка.'
- id: code-write-cpu-load
  type: code
  q: |
    **Напишите `cpu_load(states, cpus)`: какую общую загрузку процессора в процентах покажет Диспетчер задач.**
    `states` — состояния всех потоков в системе: `"считает"` или `"ждёт"`; `cpus` — число логических процессоров. Считайте упрощённо: каждый считающий поток занимает одного исполнителя целиком, ждущий не занимает ни одного. Результат не округляйте.
    ```input
    cpu_load(["считает"] + ["ждёт"] * 400, 16)
    cpu_load(["считает", "считает", "считает"], 2)
    ```
    ```output
    6.25
    100.0
    ```
  starter: |
    def cpu_load(states, cpus):
        pass


    print(cpu_load(["считает"] + ["ждёт"] * 400, 16))
  solution: |
    def cpu_load(states, cpus):
        busy = states.count("считает")
        return min(busy, cpus) / cpus * 100


    print(cpu_load(["считает"] + ["ждёт"] * 400, 16))
  tests:
    asserts:
    - name: Примеры из условия
      code: |
        for args, want in [((["считает"] + ["ждёт"] * 400, 16), 6.25), ((["считает"] * 3, 2), 100.0)]:
            got = cpu_load(*args)
            assert got is not None and abs(got - want) < 1e-9, f"Потоков {len(args[0])}, из них считают {args[0].count('считает')}, процессоров {args[1]}: нужно {want}, а cpu_load вернула {got!r}"
    - name: Ждущие не нагружают
      code: |
        for args, want in [((["ждёт"] * 8086, 14), 0.0), (([], 4), 0.0), ((["ждёт", "считает", "ждёт", "считает"], 4), 50.0)]:
            got = cpu_load(*args)
            assert got is not None and abs(got - want) < 1e-9, f"Потоков {len(args[0])}, из них считают {args[0].count('считает')}, процессоров {args[1]}: нужно {want}, а cpu_load вернула {got!r}"
    - name: Считающих больше, чем процессоров
      code: |
        for args, want in [((["считает"] * 20, 16), 100.0), ((["считает"] * 12 + ["ждёт"] * 3000, 14), 1200 / 14), ((["считает"] * 5, 1), 100.0)]:
            got = cpu_load(*args)
            assert got is not None and abs(got - want) < 1e-9, f"Потоков {len(args[0])}, из них считают {args[0].count('считает')}, процессоров {args[1]}: нужно {want}, а cpu_load вернула {got!r}"
  explain: 'Ждущий поток отдаёт ядро и не нагружает процессор, поэтому сотни ждущих потоков дают ноль. Считающий занимает одного исполнителя, но не больше: однопоточная программа на 16 процессорах — это 1/16, 6,25%. Если считающих больше, чем процессоров, ОС делит процессоры между ними по очереди, и загрузка упирается в 100%: `min(busy, cpus)`.'
- id: code-complete-timeline
  type: code
  q: |
    **Допишите `timeline(jobs, q)`: одно ядро делится между процессами отрезками по `q` шагов; вернуть список — какой процесс работал на каждом шаге.**
    `jobs` — список пар `(имя, шагов работы)` в порядке очереди. Процесс из начала очереди работает `q` шагов или меньше, если работы осталось меньше. Если работа осталась, процесс встаёт в конец очереди.
    ```input
    timeline([("A", 3), ("B", 1)], 2)
    ```
    ```output
    ['A', 'A', 'B', 'A']
    ```
  starter: |
    def timeline(jobs, q):
        queue = [[name, left] for name, left in jobs]
        steps = []
        while queue:
            name, left = queue.pop(0)
            work = min(q, left)
            steps += [name] * work
            left -= work
            # допишите: что делать с процессом, у которого осталась работа


        return steps


    print(timeline([("A", 3), ("B", 1)], 2))
  solution: |
    def timeline(jobs, q):
        queue = [[name, left] for name, left in jobs]
        steps = []
        while queue:
            name, left = queue.pop(0)
            work = min(q, left)
            steps += [name] * work
            left -= work
            if left > 0:
                queue.append([name, left])
        return steps


    print(timeline([("A", 3), ("B", 1)], 2))
  tests:
    asserts:
    - name: Пример из условия
      code: |
        got = timeline([("A", 3), ("B", 1)], 2)
        assert got == ["A", "A", "B", "A"], f"Ожидалось ['A', 'A', 'B', 'A'], а вернулось {got!r}"
    - name: Отрезок в один шаг
      code: |
        got = timeline([("A", 2), ("B", 2), ("C", 1)], 1)
        want = ["A", "B", "C", "A", "B"]
        assert got == want, f"timeline([('A', 2), ('B', 2), ('C', 1)], 1): ожидалось {want}, а вернулось {got!r}"
    - name: Один процесс и большой отрезок
      code: |
        got = timeline([("A", 5)], 2)
        assert got == ["A"] * 5, f"timeline([('A', 5)], 2): ожидалось пять 'A', а вернулось {got!r}"
        got = timeline([("A", 2), ("B", 3)], 10)
        assert got == ["A", "A", "B", "B", "B"], f"timeline([('A', 2), ('B', 3)], 10): ожидалось ['A', 'A', 'B', 'B', 'B'], а вернулось {got!r}"
    - name: Нет процессов
      code: |
        got = timeline([], 3)
        assert got == [], f"Для пустой очереди нужен [], а вернулось {got!r}"
  explain: 'Не доработавший процесс не выбрасывают, а ставят в конец очереди с остатком работы: `queue.append([name, left])`. Цикл `while queue` закончится, когда работы не останется ни у кого. Без этой строки каждый процесс получал бы один отрезок — и бросал недоделанное.'
- id: code-write-switches
  type: code
  q: |
    **Напишите `switches(jobs, q)`: сколько раз ОС переключит ядро с одного процесса на другой, если раздаёт отрезки по `q` шагов по очереди.**
    Правила очереди — как в `timeline`: процесс из начала очереди работает `q` шагов или меньше, недоработавший встаёт в конец. Переключение — когда следующий отрезок достаётся другому процессу, чем предыдущий; если очередной отрезок снова у того же процесса, переключения нет.
    ```input
    switches([("A", 3), ("B", 1)], 2)
    switches([("A", 2), ("B", 6)], 2)
    ```
    ```output
    2
    1
    ```
  starter: |
    def switches(jobs, q):
        pass


    print(switches([("A", 3), ("B", 1)], 2))
  solution: |
    def switches(jobs, q):
        queue = [[name, left] for name, left in jobs]
        count = 0
        previous = None
        while queue:
            name, left = queue.pop(0)
            if previous is not None and name != previous:
                count += 1
            previous = name
            left -= min(q, left)
            if left > 0:
                queue.append([name, left])
        return count


    print(switches([("A", 3), ("B", 1)], 2))
  tests:
    asserts:
    - name: Примеры из условия
      code: |
        for args, want in [(([("A", 3), ("B", 1)], 2), 2), (([("A", 2), ("B", 6)], 2), 1)]:
            got = switches(*args)
            assert got == want, f"switches{args} должна вернуть {want}, а вернула {got!r}"
    - name: Один процесс — переключений нет
      code: |
        got = switches([("A", 7)], 2)
        assert got == 0, f"switches([('A', 7)], 2): один процесс работает подряд, нужно 0, а вернулось {got!r}"
    - name: Три процесса по кругу
      code: |
        for args, want in [(([("A", 1), ("B", 1), ("C", 1)], 5), 2), (([("A", 4), ("B", 4), ("C", 4)], 2), 5), (([("A", 5), ("B", 1), ("C", 3)], 2), 5)]:
            got = switches(*args)
            assert got == want, f"switches{args} должна вернуть {want}, а вернула {got!r}"
    - name: Нет процессов
      code: |
        got = switches([], 3)
        assert got == 0, f"Для пустой очереди нужно 0, а вернулось {got!r}"
  explain: 'Удобно идти по отрезкам так же, как в `timeline`, и помнить, чей был предыдущий. Переключение считают, только когда хозяин отрезка сменился. Ответ «число отрезков минус один» неверен: когда остальные закончили, последний процесс получает отрезки подряд без переключений — как B во втором примере.'
- id: open-more-cores
  type: open
  q: 'Коллега говорит: «Перенесу свой расчёт с ноутбука на 4 ядра на сервер с 64 ядрами — посчитает в 16 раз быстрее». Расчёт — одна программа с одним циклом, без потоков. Прав ли он? Объясните, что будет, и что нужно, чтобы дополнительные ядра помогли.'
  rubric:
  - 'Не прав: у программы один поток, и в каждый момент он выполняется только на одном ядре'
  - 'Поэтому расчёт пойдёт примерно с той же скоростью, что на одном свободном ядре; остальные ядра достанутся другим программам или будут простаивать'
  - 'Чтобы ядра помогли, работу нужно разделить между несколькими потоками или процессами'
  wrong_answers:
  - Прав, ОС сама распределит один цикл по всем ядрам
  - Станет быстрее в 64 раза, потому что каждое ядро выполнит свою строку цикла
  - Станет медленнее, потому что ОС будет переключать поток между 64 ядрами
  followups:
  - Что покажет Диспетчер задач на таком сервере, пока идёт расчёт, — какую общую загрузку процессора?
