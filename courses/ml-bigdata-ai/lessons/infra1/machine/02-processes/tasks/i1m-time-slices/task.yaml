id: i1m-time-slices
title: Одно ядро на всех
sandbox: python-browser
difficulty: 2
statement: |
  **Нарисуйте, как одно ядро делится между процессами отрезками по `q` шагов: для каждого процесса выведите строку, где `#` — шаг, на котором он работал, `.` — шаг, на котором работал другой.**

  Первая строка ввода — `q`. Дальше строки `имя шагов` — процессы в порядке очереди (шагов работы не меньше 1), ввод заканчивается пустой строкой. Процесс из начала очереди работает `q` шагов или меньше, если работы осталось меньше; недоработавший встаёт в конец очереди. Вывод — по строке `имя: полоса` на процесс в порядке ввода; длина полосы — общее число шагов.

  Пример 1
  ```input
  2
  A 3
  B 1
  C 2

  ```
  ```output
  A: ##...#
  B: ..#...
  C: ...##.
  ```

  Пример 2
  ```input
  5
  report 2
  backup 3

  ```
  ```output
  report: ##...
  backup: ..###
  ```
starter: |
  # План:
  # 1. Прочитать q и процессы до пустой строки
  # 2. Пройти по очереди отрезками и записать, кто работал на каждом шаге
  # 3. По этому списку нарисовать полосу каждого процесса
stdin: "2\nA 3\nB 1\nC 2\n\n"
solution: |
  q = int(input())
  jobs = []
  line = input()
  while line != "":
      name, work = line.split()
      jobs.append((name, int(work)))
      line = input()

  queue = [[name, work] for name, work in jobs]
  steps = []
  while queue:
      name, left = queue.pop(0)
      work = min(q, left)
      steps += [name] * work
      left -= work
      if left > 0:
          queue.append([name, left])

  for name, _ in jobs:
      bar = "".join("#" if who == name else "." for who in steps)
      print(f"{name}: {bar}")
tests:
  io:
    - name: Пример 1
      stdin: "2\nA 3\nB 1\nC 2\n\n"
      stdout: "A: ##...#\nB: ..#...\nC: ...##."
    - name: Пример 2
      stdin: "5\nreport 2\nbackup 3\n\n"
      stdout: "report: ##...\nbackup: ..###"
    - name: Отрезок в один шаг
      stdin: "1\nA 3\nB 2\nC 1\n\n"
      stdout: "A: #..#.#\nB: .#..#.\nC: ..#..."
      hidden: true
    - name: Один процесс
      stdin: "3\nsolo 7\n\n"
      stdout: "solo: #######"
      hidden: true
    - name: Длинный процесс в конце работает подряд
      stdin: "2\nx 1\ny 6\nz 3\n\n"
      stdout: "x: #.........\ny: .##..##.##\nz: ...##..#.."
      hidden: true
hints:
  - level: 1
    text: 'Разделите работу на два шага: сначала получить список «кто работал на шаге 1, 2, 3…», потом по нему нарисовать полосы. Первая часть — очередь из списка: взять из начала, вернуть в конец.'
  - level: 2
    text: 'Процесс из начала очереди работает `min(q, осталось)` шагов. Добавьте его имя в список шагов столько раз и, если работа осталась, поставьте его в конец очереди с остатком.'
  - level: 3
    text: 'Полоса процесса — по символу на каждый элемент списка шагов: `"#"`, если там его имя, иначе `"."`. Склеить символы помогает `"".join(...)`.'
