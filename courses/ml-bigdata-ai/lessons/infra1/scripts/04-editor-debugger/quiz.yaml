title: Проверка темы
pass: 0.85
minutes: 25
questions:
- id: code-not-found
  type: single
  q: 'Вы поставили VS Code в Windows и в том же окне Ubuntu набрали `code .` — `command not found`, хотя `explorer.exe .` из этого окна открывает Проводник. Почему?'
  options:
  - 'Окно получило `PATH` при запуске WSL, а папку VS Code установщик дописал в `PATH` Windows позже'
  - 'Ubuntu не видит программы Windows, а `explorer.exe` встроен в WSL'
  - 'VS Code для Ubuntu нужно поставить ещё раз — через `sudo snap install code`'
  - '`code` — команда Linux, её ставят через `apt`, а `explorer.exe` — через Windows'
  answer: 0
  explain: 'Раз `explorer.exe` находится, папки из `PATH` Windows в окно попали — но список скопирован при запуске, до установки VS Code. Помогает перезапуск Windows Terminal. `snap install code` поставил бы второй, отдельный VS Code внутри Linux.'
- id: vars-at-second-stop
  type: single
  q: |
    Точка останова стоит на строке `count += 1`. Что покажет VARIABLES при **второй** остановке?
    ```python
    def count_long(words, n):
        count = 0
        for w in words:
            if len(w) > n:
                count += 1
        return count


    print(count_long(["кот", "собака", "ёж", "корова"], 3))
    ```
  options:
  - '`w = "корова"`, `count = 1`'
  - '`w = "корова"`, `count = 2`'
  - '`w = "ёж"`, `count = 1`'
  - '`w = "собака"`, `count = 1`'
  answer: 0
  explain: 'Строка `count += 1` выполняется только для длинных слов: первая остановка — на «собака», вторая — на «корова». Программа замирает перед строкой, поэтому прибавлена лишь первая единица. На «ёж» до этой строки дело не доходит: условие ложно.'
- id: f10-plain-call
  type: single
  q: |
    Внутри `clean` точек останова нет. Программа стоит на строке 7. Вы нажали F10. Что будет?
    ```python
    def clean(text):
        text = text.strip()
        return text.lower()


    raw = "  Привет "
    word = clean(raw)
    print(word)
    ```
  options:
  - '`clean` выполнится целиком, остановка на строке 8; в VARIABLES `word = "привет"`'
  - 'Остановка на строке 2, внутри `clean`'
  - 'Остановка на строке 8, но `word` в VARIABLES ещё нет: присваивание закончится вместе со строкой 8'
  - 'Программа выполнится до конца: F10 идёт до следующей точки останова, а их больше нет'
  answer: 0
  explain: 'F10 выполняет строку целиком, вместе с вызовом: `clean` отработала, и `word` уже указывает на результат. Внутрь `clean` заходит F11, а до следующей точки останова идёт F5. Строка выполнена полностью, когда отладчик остановился на следующей.'
- id: call-stack-read
  type: multi
  q: |
    Программа остановилась на точке, панель CALL STACK показывает:
    ```
    parse_line   app.py:4
    load         app.py:12
    <module>     app.py:20
    ```
    Что верно?
  options:
  - '`parse_line` вызвана из `load`'
  - '`load` ещё не вернула результат'
  - 'Щелчок по строке `load` покажет в VARIABLES имена вызова `load`'
  - '`parse_line` вызвана прямо из основной программы'
  - 'Упади программа сейчас — последней строкой «File …» в traceback была бы `parse_line`'
  answer: [0, 1, 2, 4]
  explain: 'Под каждым вызовом в стеке — тот, кто его вызвал: `parse_line` вызвала `load`, а её — основная программа (`<module>`), поэтому `parse_line` вызвана не из неё напрямую. Все три вызова начались и не закончились. В traceback стопка наоборот: последний вызов внизу.'
- id: set-value
  type: single
  q: |
    Программа стоит на строке 2, в VARIABLES `x = 5`. Вы правым щелчком выбрали Set Value и вписали `10`, затем нажали F10. Что теперь в VARIABLES?
    ```python
    def double(x):
        x = x * 2
        return x
    ```
  options:
  - '`x = 20`'
  - '`x = 10`'
  - '`x = 15`'
  - 'Ошибка: менять значения во время отладки нельзя'
  answer: 0
  explain: 'Остановка — перед строкой 2, она ещё не выполнялась. Set Value поменял `x` на 10, и F10 выполнил `x = x * 2` уже с новым значением. Так проверяют догадку, не перезапуская программу.'
- id: rare-record
  type: single
  q: 'Цикл обрабатывает 500 000 заказов. Неверный результат — только у заказа с номером `73512`, номер хранится в `order["id"]`. Как быстрее всего остановиться именно на нём?'
  options:
  - 'Условная точка останова в цикле с выражением `order["id"] == 73512`'
  - 'Обычная точка останова в цикле и F5, пока не появится нужный заказ'
  - 'Поставить точку на первую строку программы и пройти её F11'
  - 'Условная точка с Hit Count `73512`'
  answer: 0
  explain: 'Условие проверяется на каждом проходе, и программа остановится только на нужном заказе. Hit Count останавливает на N-м проходе, а номер заказа не обязан совпадать с номером прохода. Нажимать F5 или F11 пришлось бы десятки тысяч раз.'
- id: breakpoint-loop-pdb
  type: single
  q: |
    Вы запустили по SSH `python3 train.py`. В скрипте забыта строка `breakpoint()`:
    ```python
    for epoch in range(3):
        breakpoint()
        print("эпоха", epoch)
    ```
    На каждое приглашение `(Pdb)` вы отвечаете `c`. Сколько раз программа остановится?
  options:
  - 'Три раза: `c` продолжает до следующего вызова `breakpoint()`, а он стоит в цикле'
  - 'Один раз: после `c` отладчик больше не останавливается'
  - 'Ни разу: без окна VS Code `breakpoint()` не работает'
  - 'Четыре раза: ещё одна остановка — в конце программы'
  answer: 0
  explain: '`breakpoint()` — обычный вызов функции: Python останавливается каждый раз, когда его выполняет, то есть на каждом проходе цикла. pdb работает в терминале, окно VS Code ему не нужно. В конце программы отдельной остановки нет.'
- id: code-fix-max-change
  type: code
  q: |
    **Исправьте `max_change(changes)`: она должна возвращать самое большое изменение баланса за день.**
    `changes` — непустой список целых изменений в рублях: доход положительный, расход отрицательный. Отладчик на строке `return best` для примера 2 показал `best = 0`.
    Пример 1
    ```call
    max_change([300, -1200, 4500])
    ```
    ```return
    4500
    ```
    Пример 2
    ```call
    max_change([-500, -1200, -300])
    ```
    ```return
    -300
    ```
  starter: |
    def max_change(changes):
        best = 0
        for c in changes:
            if c > best:
                best = c
        return best
  solution: |
    def max_change(changes):
        best = changes[0]
        for c in changes:
            if c > best:
                best = c
        return best
  tests:
    function: max_change
    calls:
    - args: [[300, -1200, 4500]]
      expect: 4500
    - args: [[-500, -1200, -300]]
      expect: -300
    - name: Одно изменение
      args: [[-70]]
      expect: -70
    - name: Крупные расходы
      args: [[-150000, -90000, -2000000]]
      expect: -90000
      hidden: true
    - name: Наибольшее — первое
      args: [[800, -5, 0]]
      expect: 800
      hidden: true
    - name: Огромные расходы
      args: [[-3000000000000000, -2000000000000000]]
      expect: -2000000000000000
      hidden: true
  explain: 'Начальное значение `0` больше любого расхода, и если все изменения отрицательные, функция возвращает ноль — числа, которого в списке нет. Начинать нужно с элемента самого списка. Большое отрицательное число вместо нуля тоже не годится: найдётся расход ещё крупнее.'
- id: open-find-rare-bug
  type: open
  q: 'Функция `price(item)` вызывается в цикле для 10 000 товаров и неверно считает цену одного из них — `item["sku"] == "A-7781"`. Опишите, как найти ошибку отладчиком: где и какую точку останова поставите, что сделаете, когда программа остановится, и на что будете смотреть.'
  rubric:
  - 'Условная точка останова на строке вызова `price` в цикле (или на первой строке `price`) с условием `item["sku"] == "A-7781"` — чтобы остановиться только на нужном товаре'
  - 'После остановки — войти в `price` (F11) и идти по её строкам (F10)'
  - 'Смотреть в VARIABLES (или WATCH) значения имён перед каждой строкой и найти первую строку, после которой значение становится неверным'
  wrong_answers:
  - 'Поставить обычную точку и нажимать F5, пока не дойдёт до нужного товара'
  - 'Добавить `print` во все строки функции'
  - 'Нажать F10 на строке вызова — отладчик сам покажет ошибку внутри функции'
  followups:
  - 'Почему с условной точкой отладка цикла идёт медленнее, чем обычный запуск?'
