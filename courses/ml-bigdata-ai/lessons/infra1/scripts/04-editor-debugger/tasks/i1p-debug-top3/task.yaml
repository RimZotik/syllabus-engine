id: i1p-debug-top3
title: Лучшие попытки и испорченный журнал
sandbox: python-browser
difficulty: 2
concepts: [отладка, изменяемость, sort, sorted]
statement: |
  **Исправьте функцию `top3(scores)`: она должна возвращать три лучших результата по убыванию и не менять список `scores`, а сейчас после её вызова журнал попыток оказывается перепутан.**

  `scores` — список очков по попыткам в порядке попыток. Если попыток меньше трёх, функция возвращает все по убыванию. Под функцией — программа: она печатает лучшие результаты, а затем журнал, и журнал уже не в порядке попыток. Найдите строку, после которой `results` меняется.

  Пример
  ```call
  top3([12, 40, 7, 25, 31])
  ```
  ```return
  [40, 31, 25]
  ```
  После вызова список-аргумент по-прежнему `[12, 40, 7, 25, 31]`.

  Ограничения: попыток от 0 до 100.
starter: |
  def top3(scores):
      scores.sort(reverse=True)
      return scores[:3]


  results = [12, 40, 7, 25, 31]
  print("Лучшие:", top3(results))
  print("Журнал:", results)
solution: |
  def top3(scores):
      return sorted(scores, reverse=True)[:3]


  results = [12, 40, 7, 25, 31]
  print("Лучшие:", top3(results))
  print("Журнал:", results)
tests:
  function: top3
  no_mutate: true
  calls:
    - name: Пример
      args: [[12, 40, 7, 25, 31]]
      expect: [40, 31, 25]
    - name: Ровно три попытки
      args: [[5, 9, 1]]
      expect: [9, 5, 1]
    - name: Меньше трёх попыток
      args: [[8, 3]]
      expect: [8, 3]
    - name: Повторы
      args: [[10, 30, 30, 20, 30]]
      expect: [30, 30, 30]
      hidden: true
    - name: Нет попыток
      args: [[]]
      expect: []
      hidden: true
hints:
  - level: 1
    text: "Остановитесь на строке, которая печатает журнал: что показывает `results`? На какой строке функции этот список изменился?"
  - level: 2
    text: "Параметр `scores` и `results` в программе указывают на один и тот же список. Какой способ сортировки строит новый список, а не переставляет элементы старого?"
