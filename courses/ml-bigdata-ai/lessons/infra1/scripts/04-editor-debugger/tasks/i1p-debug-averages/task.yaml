id: i1p-debug-averages
title: Средний балл у всех, кроме первого
sandbox: python-browser
difficulty: 2
concepts: [отладка, накопитель, словарь, вложенный цикл]
statement: |
  **Исправьте функцию `averages(grades)`: она должна возвращать словарь «имя → средняя оценка», но у всех учеников, кроме первого, средняя выходит слишком большой.**

  `grades` — словарь: имя ученика → непустой список его оценок от 1 до 5. Среднее округляется до двух знаков после запятой: `round(…, 2)`. Найдите ошибку, не добавляя `print`: пройдите вызов «По шагам» и сравните `total` в момент, когда цикл переходит ко второму ученику, с тем, каким он должен быть.

  Пример
  ```call
  averages({"Аня": [5, 4], "Боря": [3, 3, 4]})
  ```
  ```return
  {"Аня": 4.5, "Боря": 3.33}
  ```

  Ограничения: учеников от 0 до 30.
starter: |
  def averages(grades):
      result = {}
      total = 0
      for name, marks in grades.items():
          for m in marks:
              total += m
          result[name] = round(total / len(marks), 2)
      return result


  print(averages({"Аня": [5, 4], "Боря": [3, 3, 4]}))
solution: |
  def averages(grades):
      result = {}
      for name, marks in grades.items():
          total = 0
          for m in marks:
              total += m
          result[name] = round(total / len(marks), 2)
      return result


  print(averages({"Аня": [5, 4], "Боря": [3, 3, 4]}))
tests:
  function: averages
  no_mutate: true
  calls:
    - name: Пример
      args: [{"Аня": [5, 4], "Боря": [3, 3, 4]}]
      expect: {"Аня": 4.5, "Боря": 3.33}
      tol: 0.001
    - name: Один ученик
      args: [{"Вера": [2, 5, 5]}]
      expect: {"Вера": 4.0}
      tol: 0.001
    - name: Три ученика, по одной оценке
      args: [{"Аня": [5], "Боря": [4], "Вера": [3]}]
      expect: {"Аня": 5.0, "Боря": 4.0, "Вера": 3.0}
      tol: 0.001
    - name: Порядок учеников не тот, что в примере
      args: [{"Гоша": [2, 2], "Аня": [5, 5, 5, 4], "Дина": [3, 4]}]
      expect: {"Гоша": 2.0, "Аня": 4.75, "Дина": 3.5}
      tol: 0.001
      hidden: true
    - name: Нет учеников
      args: [{}]
      expect: {}
      hidden: true
hints:
  - level: 1
    text: "Какое значение `total` у второго ученика, когда к нему ещё не прибавлена ни одна его оценка? Каким оно должно быть?"
  - level: 2
    text: "Накопитель обнуляют там, где начинается то, что он считает. Что он считает — сумму всех оценок класса или сумму оценок одного ученика?"
