title: Контрольная раздела «Скрипты и окружение разработчика»
pass: 0.85
minutes: 30
questions:
- id: s-which-set-e
  type: single
  q: |
    Скрипт ставит `jq`, только если его нет:
    ```bash
    #!/bin/bash
    set -e
    which jq > /dev/null || sudo apt-get install -y jq
    jq --version
    ```
    Строку `which …` заменили на `which jq > /dev/null` — без `||` и установки. Что будет на машине, где `jq` нет?
  options:
  - 'Скрипт остановится на `which` с кодом 1, ничего не напечатав'
  - 'Скрипт дойдёт до `jq --version` и остановится на `command not found`'
  - 'Скрипт отработает до конца: `which` только ищет, и её код `set -e` не проверяет'
  - '`which` предложит `sudo apt install jq`, и скрипт продолжится'
  answer: 0
  explain: 'Не найдя программу, `which` возвращает 1, а свой вывод она и так отправила в `/dev/null`. Слева от `||` это был ответ, а отдельной строкой — неудача, и `set -e` завершает скрипт. Подсказку `sudo apt install` печатает bash, когда не находит команду, которую запускают, — до `jq --version` дело не дойдёт.'
- id: s-script-activate
  type: single
  q: |
    Скрипт `start.sh` с правами `rwxr-xr-x`:
    ```bash
    #!/bin/bash
    source .venv/bin/activate
    python3 app.py
    ```
    `./start.sh` работает. Сразу после него в том же окне `python3 app.py` падает с `ModuleNotFoundError`. Почему?
  options:
  - 'Скрипт — дочерний процесс: окружение включилось в нём и пропало вместе с ним'
  - '`source` внутри скрипта не работает, и `app.py` в скрипте тоже запустил системный Python'
  - 'Скрипт выключил окружение при завершении, потому что `activate` так устроен'
  - 'Окружение включилось, но новый `PATH` окно увидит только после `source ~/.bashrc`'
  answer: 0
  explain: '`source` выполнил `activate` в процессе скрипта, и его `PATH` начался с `.venv/bin` — поэтому внутри скрипта всё работает. Окно — другой процесс, его `PATH` не менялся. Выключать нечего: процесс просто закончился, а `~/.bashrc` об окружении ничего не знает. В окне его включают `source .venv/bin/activate`.'
- id: s-reset-unquoted
  type: single
  q: |
    Скрипт `reset.sh` пересоздаёт окружение проекта:
    ```bash
    #!/bin/bash
    rm -rf $1/.venv
    ```
    В `~/forge` есть папки `old`, `shop` и `old shop`, в каждой из них лежит `.venv`. Что сделает `./reset.sh "old shop"`, запущенный из `~/forge`?
  options:
  - 'Удалит папку `old` целиком и `shop/.venv`, а `old shop/.venv` останется'
  - 'Удалит `old shop/.venv`, как и задумано'
  - 'Ничего: `rm` не найдёт папку `old shop/.venv` и выдаст ошибку'
  - 'Удалит `old shop` целиком: пробел обрезал путь до имени папки'
  answer: 0
  explain: 'Без кавычек значение `$1` снова делится по пробелу, и `rm` получает два аргумента: `old` и `shop/.venv`. `-f` молчит о несуществующем, `-r` удаляет папку `old` со всем содержимым. С `"$1"/.venv` аргумент был бы один.'
- id: s-ssh-refused
  type: single
  q: 'В только что установленной Ubuntu под WSL вы сверили имя пользователя, а `ssh student@localhost` из PowerShell отвечает `ssh: connect to host localhost port 22: Connection refused`. Что делать?'
  options:
  - 'В Ubuntu поставить службу SSH: `sudo apt update` и `sudo apt install openssh-server`'
  - 'Удалить старый ключ сервера: `ssh-keygen -R localhost`'
  - 'Подключиться к порту 2222: `ssh -p 2222 student@localhost`'
  - 'Ввести пароль Linux ещё раз, медленнее: при вводе он не виден'
  answer: 0
  explain: '«Connection refused» значит, что порт 22 никто не слушает: до проверки ключа и пароля дело не дошло. В свежей Ubuntu `sshd` нет — его ставят пакетом `openssh-server`. `ssh-keygen -R` лечит смену ключа сервера, а порт 2222 — проброс в VirtualBox.'
- id: s-move-from-mnt
  type: single
  q: 'Проект `shop` с окружением `.venv` лежит в `/mnt/c/Users/Анна/shop`, и `pip install` в нём идёт минутами. Как правильно перенести проект?'
  options:
  - 'Перенести в `~/shop` всё, кроме `.venv`, и создать окружение там заново'
  - 'Перенести в `~/shop` целиком, вместе с `.venv`: файлы те же, а Linux быстрее'
  - 'Оставить проект в `/mnt/c`, а `pip install` запускать из PowerShell: Windows со своим диском работает быстрее'
  - 'Оставить проект в `/mnt/c`, а `.venv` перенести в `~` и включать его оттуда'
  answer: 0
  explain: 'Через границу систем тысячи мелких файлов окружения читаются медленно, поэтому проекты держат в `~`. Но окружение не переносят: в `activate` и первой строке `pip` записаны абсолютные пути к старой папке. pip из PowerShell — это Python Windows: пакеты попали бы в него, а не в окружение Ubuntu.'
- id: s-sudo-pip-in-venv
  type: single
  q: 'В Ubuntu поставлен системный `python3-pip`. В окне включено окружение проекта: `pip install rich` работает, а `sudo pip install rich` отвечает `error: externally-managed-environment`. Почему?'
  options:
  - '`sudo` ищет `pip` по своему `PATH`, где нет `.venv/bin`, и запускает системный pip'
  - 'Под root окружение выключается само, потому что принадлежит пользователю student'
  - 'Пакеты окружения root менять не может, и pip сообщает об этом так'
  - '`sudo` снимает пометку PEP 668 только с системного Python, а не с окружения'
  answer: 0
  explain: 'Активация — это `.venv/bin` в начале `PATH` вашего окна, а `sudo` подставляет свой список папок. Находится `/usr/bin/pip` системного Python, а он помечен как внешне управляемый. Root может писать куда угодно, а пометку PEP 668 `sudo` не снимает нигде. Права root окружению и не нужны.'
- id: s-tool-for-job
  type: multi
  q: 'Какие пары «что поставить — чем» правильные?'
  options:
  - '`htop` для этой машины — `sudo apt install htop`'
  - 'Проверку стиля `ruff`, нужную во всех папках, — `uv tool install ruff`'
  - 'Python 3.13 для проекта, когда в Ubuntu 3.12, — `uv python install 3.13`'
  - '`pandas` для проекта — `sudo apt install python3-pandas`'
  - '`requests` для проекта на uv — `uv pip install requests`'
  answer: [0, 1, 2]
  explain: 'Программы системы ставит `apt`, программы на Python для себя — `uv tool`, другой Python — `uv python install`, не трогая системный. `python3-pandas` — одна версия на всю систему, выбранная дистрибутивом, и в зависимостях проекта её нет. `uv pip install` не записывает пакет ни в `pyproject.toml`, ни в `uv.lock` — в проекте на uv пакет ставят через `uv add`.'
- id: s-curl-sudo-sh
  type: single
  q: 'В статье из блога uv ставят командой `curl -LsSf https://uv-fast.example.net/install.sh | sudo sh`. Чем она опаснее команды из документации uv?'
  options:
  - 'Неизвестно чей скрипт, которого вы не видели, выполнится с правами root'
  - 'Ничем: адрес другой, но скрипт тот же, а `sudo` лишь ставит uv для всех пользователей'
  - '`curl` с `sudo` скачивает быстрее и может оборвать установку на середине'
  - 'Опасность одна: uv окажется в `/root/.local/bin`, и команда `uv` не найдётся'
  answer: 0
  explain: 'Конвейер отдаёт скачанный текст `sh` на выполнение сразу, не показывая его вам. Скрипт с чужого адреса может делать что угодно, а `sudo sh` даёт ему права root — он может поменять любой файл системы. Даже официальный установщик запускают без `sudo`: он ставит uv в вашу домашнюю папку.'
- id: s-watch-before-line
  type: single
  q: |
    Точка останова стоит на строке 2, в WATCH вписаны три выражения: `len(xs)`, `total` и `total / len(xs)`. Что покажет WATCH сразу при остановке и после нажатия F10?
    ```python
    def mean(xs):
        total = sum(xs)
        return total / len(xs)


    print(mean([2, 4, 9]))
    ```
  options:
  - 'Сразу: `len(xs) = 3`, а два других — ошибка `name ''total'' is not defined`; после F10: `3`, `15` и `5.0`'
  - 'Сразу: `3`, `15` и `5.0` — WATCH вычисляет выражения вперёд, по тексту функции'
  - 'Сразу: `3`, `total = 0` и `0.0`; после F10: `3`, `15` и `5.0`'
  - 'Ничего, пока функция не вернёт результат: WATCH обновляется только при выходе из функции'
  answer: 0
  explain: 'Остановка — перед строкой 2, и `total` ещё не существует, поэтому два выражения с ним дают ошибку; `len(xs)` считается, ведь `xs` уже есть. WATCH пересчитывается на каждой остановке, но вперёд не заглядывает. После F10 строка выполнена: `total = 15`, а `15 / 3` — `5.0`.'
- id: s-hit-count
  type: single
  q: |
    Точка останова стоит в `load` на строке `rows = parse(name)`, у неё Hit Count `3`:
    ```python
    for name in ["jan.csv", "feb.csv", "mar.csv", "apr.csv"]:
        load(name)
    ```
    Что вы увидите при первой остановке?
  options:
  - 'В VARIABLES `name = "mar.csv"`, в CALL STACK сверху `load`, под ней основная программа'
  - 'В VARIABLES `name = "jan.csv"`: Hit Count задаёт, сколько раз остановиться'
  - 'В VARIABLES `name = "mar.csv"` и `rows` с данными этого файла'
  - 'В CALL STACK сверху основная программа, под ней `load`'
  answer: 0
  explain: 'Hit Count останавливает на N-м проходе через строку — это третий вызов `load`, для `mar.csv`. Остановка — перед строкой, поэтому `rows` для этого файла ещё не вычислен. В VS Code последний вызов в стеке сверху.'
- id: s-code-freeze-diff
  type: code
  q: |
    **Напишите `changes(before, after)`: по двум выводам `pip freeze` вернуть, что поменялось в окружении, — строками, как в выводе `uv`.**
    `before` и `after` — списки строк вида `имя==версия`, каждое имя встречается в списке один раз. Пакет, который исчез, даёт строку `- имя==версия`, новый — `+ имя==версия`, у пакета с другой версией — обе: `- имя==старая` и `+ имя==новая`. Пакеты без изменений в ответ не попадают. Строки упорядочены по имени пакета, а у одного имени `-` идёт перед `+`.
    ```call
    changes(["certifi==2026.11.20", "requests==2.31.0", "urllib3==2.8.0"], ["requests==2.32.3", "rich==14.2.0", "urllib3==2.8.0"])
    ```
    ```return
    ['- certifi==2026.11.20', '- requests==2.31.0', '+ requests==2.32.3', '+ rich==14.2.0']
    ```
  starter: |
    def changes(before, after):
        return []
  solution: |
    def changes(before, after):
        old = {}
        for line in before:
            name, version = line.split("==")
            old[name] = version
        new = {}
        for line in after:
            name, version = line.split("==")
            new[name] = version
        result = []
        for name in sorted(set(old) | set(new)):
            if old.get(name) == new.get(name):
                continue
            if name in old:
                result.append(f"- {name}=={old[name]}")
            if name in new:
                result.append(f"+ {name}=={new[name]}")
        return result
  tests:
    function: changes
    no_mutate: true
    calls:
    - args: [["certifi==2026.11.20", "requests==2.31.0", "urllib3==2.8.0"], ["requests==2.32.3", "rich==14.2.0", "urllib3==2.8.0"]]
      expect: ['- certifi==2026.11.20', '- requests==2.31.0', '+ requests==2.32.3', '+ rich==14.2.0']
    - name: Ничего не поменялось
      args: [["six==1.17.0", "pytz==2025.2"], ["pytz==2025.2", "six==1.17.0"]]
      expect: []
    - name: Пустое окружение — всё новое
      args: [[], ["tabulate==0.10.0", "numpy==2.3.5"]]
      expect: ['+ numpy==2.3.5', '+ tabulate==0.10.0']
    - name: Всё удалено
      args: [["rich==14.2.0", "markdown-it-py==4.0.0"], []]
      expect: ['- markdown-it-py==4.0.0', '- rich==14.2.0']
      hidden: true
    - name: Версия понизилась, порядок во входе случайный
      args: [["urllib3==2.8.0", "idna==3.20", "charset-normalizer==3.5.2"], ["idna==3.20", "urllib3==2.5.0", "charset-normalizer==3.5.2"]]
      expect: ['- urllib3==2.8.0', '+ urllib3==2.5.0']
      hidden: true
    - name: Новый пакет по имени раньше удалённого
      args: [["zipp==3.23.0", "six==1.17.0"], ["six==1.17.0", "attrs==25.4.0"]]
      expect: ['+ attrs==25.4.0', '- zipp==3.23.0']
      hidden: true
    - name: Похожие имена — разные пакеты
      args: [["pandas==2.3.3", "pandas-stubs==2.3.2"], ["pandas==2.3.3", "pandas-stubs==2.3.3"]]
      expect: ['- pandas-stubs==2.3.2', '+ pandas-stubs==2.3.3']
      hidden: true
  explain: 'Удобно разложить оба списка в словари «имя → версия»: тогда новый, исчезнувший и изменившийся пакет различаются проверкой ключа. Порядок ответа задаёт сортировка объединения имён, а не порядок во входе. Сравнивать строки `имя==версия` целиком мало: у изменившегося пакета нужны обе строки рядом.'
- id: s-open-server-setup
  type: open
  q: 'Проект на uv из `~/forge/weather` нужно запустить на свежем сервере Ubuntu, куда вы входите по SSH. Опишите по шагам: что из проекта передать на сервер и чем, что и чем поставить на сервере и как собрать окружение и запустить программу.'
  rubric:
  - 'Передать код, `pyproject.toml`, `uv.lock` и `.python-version` без `.venv` — например, `scp -r` (или архив и `scp`)'
  - 'На сервере поставить uv по инструкции из официальной документации (установщик в домашнюю папку, без `sudo`); программы системы, если нужны, — `sudo apt update` и `sudo apt install`'
  - 'В папке проекта выполнить `uv sync` — он соберёт `.venv` по `uv.lock` (при нужде скачав версию Python из `.python-version`); запускать `uv run main.py`'
  wrong_answers:
  - 'Скопировать проект вместе с `.venv`, чтобы не ставить пакеты заново'
  - 'Поставить пакеты на сервере через `sudo pip install`'
  - 'Поставить uv через `sudo apt install uv`'
  followups:
  - 'Почему после установки uv по SSH команда `uv` может не найтись в том же сеансе и что сделать?'
