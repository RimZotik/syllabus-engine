title: Проверка темы
pass: 0.85
minutes: 22
questions:
- id: arith-in-quotes
  type: single
  q: |
    Что напечатает вторая строка?
    ```
    student@forge:~$ a=7; b=2
    student@forge:~$ echo "$a+$b=$((a + b)), $a/$b=$((a / b))"
    ```
  options:
  - '`7+2=9, 7/2=3`'
  - '`7+2=9, 7/2=3.5`'
  - '`9=9, 3=3`'
  - '`7+2=$((a + b)), 7/2=$((a / b))`'
  answer: 0
  explain: 'Вне `$(( … ))` значения переменных — просто строки, поэтому `$a+$b` даёт текст `7+2`. Считает только `$(( … ))`, и только в целых: дробная часть от `7 / 2` отбрасывается. Двойные кавычки подстановку не отключают — её отключили бы одинарные.'
- id: assign-with-spaces
  type: single
  q: 'Запуск скрипта `./sum.sh` печатает `./sum.sh: line 2: total: command not found`. Вторая строка скрипта — `total = 0`. В чём причина?'
  options:
  - 'Оболочка поняла строку как запуск команды `total` с аргументами `=` и `0`'
  - 'Переменную нужно сначала объявить, а потом присваивать ей значение'
  - '`0` — число, а переменной оболочки можно присвоить только строку в кавычках'
  - 'Имя `total` занято встроенной командой bash'
  answer: 0
  explain: 'Присваивание — это `имя=значение` одним словом, без пробелов. С пробелами строка делится на три слова, и первое оболочка ищет как команду. Объявлять переменные заранее не нужно, а `total=0` без кавычек — обычная строка `0`.'
- id: test-greater-redirect
  type: multi
  q: |
    В папке лежит только `a.txt`. Выполнили строку:
    ```
    n=10; if [ $n > 9 ]; then echo да; else echo нет; fi
    ```
    Какие утверждения верны?
  options:
  - 'Строка напечатает `да`'
  - 'В папке появится файл с именем `9`'
  - 'Команда `[` получит аргументы `10` и `]`'
  - 'Строка напечатает `нет`: строка `10` по алфавиту меньше `9`'
  - 'Оболочка ответит ошибкой: внутри `[ ]` знак `>` не разрешён'
  answer: [0, 1, 2]
  explain: '`> 9` оболочка разбирает как перенаправление: создаёт файл `9` и направляет туда вывод `[`. Команде достаются `10` и `]`, то есть проверка «строка `10` непустая» — код 0, и выполняется ветка `then`. Числа сравнивает `-gt`: `[ "$n" -gt 9 ]`.'
- id: too-many-arguments
  type: single
  q: |
    Скрипт `clean.sh` печатает `./clean.sh: line 3: [: too many arguments`. Его строки 2 и 3:
    ```
    f="отчёт за май.csv"
    if [ -f $f ]; then
    ```
    Что исправит ошибку?
  options:
  - 'Взять переменную в кавычки: `[ -f "$f" ]`'
  - 'Убрать кавычки в строке 2: `f=отчёт за май.csv`'
  - 'Заменить `-f` на `-e`: `-f` не подходит для `.csv`'
  - 'Поставить пробел перед `;`: `[ -f $f ] ; then`'
  answer: 0
  explain: 'Без кавычек значение с пробелами распадается на три слова, и `[` получает `-f`, `отчёт`, `за`, `май.csv` — лишний аргумент. С `"$f"` имя остаётся одним словом. Без кавычек в строке 2 присваивание сломается само: `за` станет командой.'
- id: empty-glob-loop
  type: single
  q: |
    В папке `logs` лежит только `app.txt`. Что напечатает последняя команда?
    ```
    student@forge:~$ n=0
    student@forge:~$ for f in logs/*.log; do n=$((n + 1)); done
    student@forge:~$ echo "$n"
    ```
  options:
  - '`1`'
  - '`0`'
  - 'Пустую строку: цикл не выполнился, и `n` осталась без значения'
  - 'Ошибку `logs/*.log: No such file or directory`, а затем `0`'
  answer: 0
  explain: 'Шаблон без совпадений остаётся как есть, и цикл выполняется один раз со словом `logs/*.log`. Тело ничего не проверяет, поэтому счётчик стал 1. Защита — `[ -e "$f" ] || continue` в начале тела.'
- id: set-e-which-stop
  type: multi
  q: 'Скрипт начинается с `#!/bin/bash` и `set -e`, файла `nope.txt` нет, папка `backup` есть. Какие из строк, поставленные следующей строкой скрипта, остановят его?'
  options:
  - '`ls nope.txt || echo "нет файла"`'
  - '`if grep -q ERROR nope.txt; then echo есть; fi`'
  - '`n=$(wc -l < nope.txt)`'
  - '`echo "строк: $(wc -l < nope.txt)"`'
  - '`cp nope.txt backup/`'
  - '`cat nope.txt | wc -l`'
  answer: [2, 4]
  explain: 'Слева от `||` и в условии `if` ненулевой код — ответ, а не ошибка. У присваивания код — код подстановки, и он не 0; у `echo` код свой, 0, и ошибку внутри `$(…)` он заглушает. `cp` завершается с 1 — остановка. Код конвейера без `pipefail` — код `wc`, то есть 0.'
- id: while-read-count
  type: single
  q: |
    В `tasks.txt` три строки: `a`, `b`, `c`, после `c` перевода строки нет. Что напечатает последняя команда?
    ```
    student@forge:~$ n=0
    student@forge:~$ while read -r line; do n=$((n + 1)); done < tasks.txt
    student@forge:~$ echo "$n"
    ```
  options:
  - '`2`'
  - '`3`'
  - '`1`'
  - '`0`'
  answer: 0
  explain: 'Строку `c` команда `read` прочитает, но вернёт 1, потому что дошла до конца файла без `\n`. Для `while` это «стоп», и тело на ней не выполнится. Посчитать и её помогает `|| [ -n "$line" ]` в условии.'
- id: positional-quotes
  type: single
  q: |
    Скрипт `greet.sh`:
    ```
    #!/bin/bash
    name=${1:-гость}
    echo "Привет, $name! Аргументов: $#"
    ```
    Что напечатает `./greet.sh Анна Петрова`?
  options:
  - '`Привет, Анна! Аргументов: 2`'
  - '`Привет, Анна Петрова! Аргументов: 2`'
  - '`Привет, Анна Петрова! Аргументов: 1`'
  - '`Привет, гость! Аргументов: 2`'
  answer: 0
  explain: 'Без кавычек в командной строке `Анна` и `Петрова` — два аргумента: `$1` — `Анна`, `$#` — 2. `гость` подставляется, только когда первого аргумента нет. Одним аргументом имя стало бы так: `./greet.sh "Анна Петрова"`.'
- id: bash-runs-python-file
  type: single
  q: |
    Файл `stats.py` с правами `rwxr-xr-x`:
    ```
    #!/usr/bin/env python3
    import csv
    total = 0
    ```
    Что ответит `bash stats.py`?
  options:
  - 'Две ошибки: `stats.py: line 2: import: command not found` и `stats.py: line 3: total: command not found`'
  - 'Ничего: файл выполнит Python, потому что так велит шебанг'
  - '`bash: stats.py: Permission denied`: файл Python нельзя передать bash'
  - 'Ничего: bash увидит шебанг чужой программы и пропустит файл'
  answer: 0
  explain: 'Шебанг читает ОС, когда файл запускают по пути, например `./stats.py`. Здесь запущена программа `bash`, и файл она читает как свой скрипт: первая строка для неё — комментарий, а остальные она ищет как команды.'
- id: error-branch-ending
  type: single
  q: 'Скрипт обнаружил, что нужного файла нет. Какой конец этой ветки правильный, чтобы при `./s.sh > out.txt` сообщение осталось на экране, а `./s.sh && echo готово` не напечатал `готово`?'
  options:
  - '`echo "нет файла" >&2; exit 1`'
  - '`echo "нет файла" 2>&1; exit 1`'
  - '`echo "нет файла" >&2; exit 0`'
  - '`echo "нет файла"; exit 1`'
  answer: 0
  explain: '`>&2` отправляет вывод `echo` в stderr, а `> out.txt` перенаправляет только stdout — сообщение остаётся на экране. `2>&1` делает наоборот: stderr туда же, куда stdout, то есть в файл. Ненулевой код нужен, чтобы `&&` не выполнил вторую команду.'
- id: open-set-e-substitution
  type: open
  q: 'В скрипте с `set -euo pipefail` строка `n=$(grep -c ERROR app.log)` останавливает скрипт без единого сообщения, когда в журнале нет ошибок, а строка `echo "ошибок: $(grep -c ERROR app.log)"` на том же журнале не останавливает. Почему так? Как записать первую строку, чтобы при нуле ошибок скрипт шёл дальше и `n` была `0`?'
  rubric:
  - '`grep -c`, не найдя совпадений, печатает 0, но возвращает код 1; у присваивания код — код подстановки команды, поэтому `set -e` завершает скрипт'
  - 'В строке с `echo` код возврата — код самой `echo`, то есть 0: неудача `grep` внутри `$(…)` не видна, и `set -e` не срабатывает'
  - 'Чтобы «не нашёл» не считался ошибкой, добавляют `|| true`: `n=$(grep -c ERROR app.log || true)` — `grep` всё равно напечатает 0'
  wrong_answers:
  - '`set -e` не действует на строки с `$(…)`'
  - 'Скрипт останавливается, потому что `n` получает пустую строку и срабатывает `-u`'
  - 'Нужно убрать `set -e`: тогда скрипт не будет останавливаться'
  followups:
  - 'Какой код возврата у `grep -c ERROR app.log`, если в файле две строки с `ERROR`?'
