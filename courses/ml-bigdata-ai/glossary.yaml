# Глоссарий курса. Поля: id, term, en (английский термин), decode (расшифровка/происхождение), short (1–2 предложения своими словами),
# example (необязательно), introduced_in (id темы, где термин введён). Правила — docs/content/style-guide.md, разделы 4 и 8.

- id: program
  term: программа
  en: program
  decode: от греч. prógramma — «объявление, предписание»
  short: Набор точных инструкций, который компьютер выполняет шаг за шагом.
  introduced_in: intro1.what.1

- id: algorithm
  term: алгоритм
  en: algorithm
  decode: от имени математика аль-Хорезми (IX век)
  short: Конечная последовательность понятных шагов, которая из входных данных получает результат. Рецепт — тоже алгоритм.
  example: «Если сумма покупки больше 5000 ₽ — скидка 10 %, иначе — без скидки».
  introduced_in: intro1.what.1

- id: ai
  term: искусственный интеллект
  en: artificial intelligence, AI
  decode: термин придумал Джон Маккарти в 1955 году
  short: Широкая область, которая учит компьютеры решать задачи, обычно требующие человеческого ума. Машинное обучение — самый успешный её способ сегодня.
  introduced_in: intro1.what.1

- id: ml
  term: машинное обучение
  en: machine learning, ML
  decode: выражение ввёл Артур Сэмюэл в 1959 году
  short: Способ создавать программы, которые находят закономерности в примерах сами, а не следуют правилам, написанным человеком.
  introduced_in: intro1.what.1

- id: data
  term: данные
  en: data
  decode: от лат. datum — «данное»
  short: Записанные факты о мире — числа, тексты, картинки, клики. Сырьё, из которого машинное обучение извлекает закономерности.
  introduced_in: intro1.what.2

- id: dataset
  term: датасет
  en: dataset, «набор данных»
  short: Набор примеров, собранных для одной задачи. Часто — таблица, где строка — объект, а столбцы — его признаки и ответ.
  introduced_in: intro1.what.2

- id: feature
  term: признак
  en: feature
  short: Одна измеримая характеристика объекта — площадь квартиры, возраст клиента, число слов в письме.
  introduced_in: intro1.what.2

- id: target
  term: целевая переменная
  en: target, label («метка»)
  short: То, что модель должна предсказать — цена, «спам или нет», диагноз. В обучающих примерах ответ известен.
  introduced_in: intro1.what.2

- id: model
  term: модель
  en: model
  short: Функция с настраиваемыми параметрами, которая по признакам объекта выдаёт предсказание.
  example: цена = a × площадь + b, где a и b — параметры.
  introduced_in: intro1.what.2

- id: parameter
  term: параметр модели
  en: parameter, weight («вес»)
  short: Число внутри модели, которое подбирается при обучении. У простой модели их два, у больших языковых моделей — сотни миллиардов.
  introduced_in: intro1.what.2

- id: training
  term: обучение
  en: training
  short: Подбор параметров модели так, чтобы её ошибки на известных примерах стали как можно меньше.
  introduced_in: intro1.what.2

- id: loss
  term: функция потерь
  en: loss function
  short: Число, которое показывает, насколько предсказание модели на одном объекте расходится с правильным ответом. Среднее потерь по обучающей выборке называют эмпирическим риском — его и уменьшает обучение.
  introduced_in: intro1.what.2

- id: prediction
  term: предсказание
  en: prediction, inference («вывод»)
  short: Ответ, который обученная модель выдаёт для нового объекта, ответ для которого заранее неизвестен.
  introduced_in: intro1.what.2

- id: generalization
  term: обобщение
  en: generalization
  short: Способность модели правильно отвечать на новых примерах, которых она не видела при обучении. Ради этого всё и делается.
  introduced_in: intro1.what.2

- id: overfitting
  term: переобучение
  en: overfitting
  short: Модель «зазубрила» обучающие примеры вместе со случайным шумом и плохо работает на новых данных.
  introduced_in: intro1.what.2

- id: classification
  term: классификация
  en: classification
  short: Задача выбрать для объекта один из заранее известных классов — «спам / не спам», «кошка / собака / птица».
  introduced_in: intro1.what.3

- id: regression
  term: регрессия
  en: regression
  decode: от лат. regressio — «возвращение»; название историческое, от работ Фрэнсиса Гальтона
  short: Задача предсказать число — цену, температуру, время доставки.
  introduced_in: intro1.what.3

- id: clustering
  term: кластеризация
  en: clustering, от cluster — «гроздь»
  short: Задача разбить объекты на группы похожих, когда правильных групп заранее никто не знает.
  introduced_in: intro1.what.3

- id: recommender
  term: рекомендательная система
  en: recommender system
  short: Система, которая для каждого пользователя подбирает и упорядочивает то, что ему, вероятно, понравится.
  introduced_in: intro1.what.3

- id: supervised
  term: обучение с учителем
  en: supervised learning
  short: Обучение на примерах, где для каждого объекта известен правильный ответ.
  introduced_in: intro1.what.3

- id: unsupervised
  term: обучение без учителя
  en: unsupervised learning
  short: Поиск структуры в данных без правильных ответов — например, группировка похожих объектов.
  introduced_in: intro1.what.3

- id: reinforcement
  term: обучение с подкреплением
  en: reinforcement learning
  short: Обучение через пробы и ошибки — агент действует, получает награду или штраф и постепенно учится действовать лучше.
  introduced_in: intro1.what.3

- id: generative
  term: генеративная модель
  en: generative model
  short: Модель, которая создаёт новые данные — текст, картинки, звук — похожие на те, на которых она училась.
  introduced_in: intro1.what.3

- id: knn
  term: метод k ближайших соседей
  en: k nearest neighbours, kNN
  short: Чтобы предсказать класс нового объекта, смотрим на k самых похожих известных примеров и выбираем самый частый у них класс.
  introduced_in: intro1.what.4

- id: hyperparameter
  term: гиперпараметр
  en: hyperparameter
  short: Настройка модели, которую выбирает человек до обучения (например, число соседей k). Параметры подбирает обучение, гиперпараметры — мы.
  introduced_in: intro1.what.4

- id: object
  term: объект
  en: object, sample, instance
  short: То, о чём модель делает предсказание, — квартира, письмо, клиент. В таблице данных это одна строка.
  introduced_in: intro1.what.2

- id: training-set
  term: обучающая выборка
  en: training set
  short: Часть данных с известными ответами, на которой модель обучается.
  introduced_in: intro1.what.2

- id: holdout
  term: отложенные данные
  en: hold-out set, test set
  short: Часть данных, которую заранее откладывают и не показывают модели при обучении, чтобы честно проверить её на новых примерах.
  introduced_in: intro1.what.2

- id: underfitting
  term: недообучение
  en: underfitting
  short: Модель слишком простая и плохо отвечает даже на обучающих примерах — она не уловила закономерность.
  introduced_in: intro1.what.2

- id: labeling
  term: разметка данных
  en: data labeling, annotation
  short: Расстановка правильных ответов для примеров — обычно людьми. Без разметки нельзя обучать с учителем.
  introduced_in: intro1.what.3

- id: agent
  term: агент
  en: agent
  short: В обучении с подкреплением — тот, кто действует в среде, получает награду или штраф и учится действовать лучше.
  introduced_in: intro1.what.3

- id: ranking
  term: ранжирование
  en: ranking
  short: Задача упорядочить объекты по тому, насколько они подходят запросу или конкретному человеку, — как выдача поисковика.
  introduced_in: intro1.what.3

# ── intro1.history

- id: turing-machine
  term: машина Тьюринга
  en: Turing machine
  decode: по имени Алана Тьюринга, описавшего её в 1936 году
  short: Мысленная модель вычисления по инструкции — лента с символами, головка, которая читает, пишет и сдвигается, и таблица
    правил. Принято считать, что на ней можно выполнить любой алгоритм.
  introduced_in: intro1.history.1

- id: turing-test
  term: тест Тьюринга
  en: Turing test, imitation game («игра в имитацию»)
  short: Проверка, в которой судья переписывается с человеком и машиной и пытается понять, кто из них машина. Проверяет только
    поведение в разговоре, а не понимание.
  introduced_in: intro1.history.1

- id: perceptron
  term: перцептрон
  en: perceptron
  decode: от лат. perceptio — «восприятие»; Фрэнк Розенблатт, 1958
  short: Простейшая обучаемая модель — складывает признаки с весами и сравнивает сумму с порогом; при ошибке веса сдвигаются
    к правильному ответу. Проводит между классами только прямую границу.
  introduced_in: intro1.history.2

- id: ai-winter
  term: зима искусственного интеллекта
  en: AI winter
  short: Период резкого спада денег и интереса к ИИ после завышенных ожиданий. Первая — в 1970-х, вторая — с конца 1980-х
    до середины 1990-х.
  introduced_in: intro1.history.2

- id: expert-system
  term: экспертная система
  en: expert system
  short: Программа, в которую записали знания специалистов в виде правил «если — то». Работала в узких задачах, но не училась
    и плохо масштабировалась.
  introduced_in: intro1.history.3

- id: boosting
  term: бустинг
  en: boosting, от boost — «усиливать»
  short: Способ собрать сильную модель из цепочки простых, где каждая следующая исправляет ошибки предыдущих. Один из главных
    методов для табличных данных.
  introduced_in: intro1.history.3

- id: neural-network
  term: нейронная сеть
  en: neural network, «нейросеть»
  short: Модель из многих простых «нейронов», собранных в слои, — выходы одного слоя идут на входы следующего. Обучается подбором
    весов по примерам.
  introduced_in: intro1.history.2

- id: deep-learning
  term: глубокое обучение
  en: deep learning
  short: Обучение нейросетей из многих слоёв, которые сами находят признаки — от простых (края на картинке) до сложных (целые
    объекты).
  introduced_in: intro1.history.4

- id: transformer
  term: трансформер
  en: transformer
  short: Архитектура нейросети на механизме внимания — каждый элемент (например, слово) учитывает все остальные сразу. Основа
    современных языковых моделей.
  introduced_in: intro1.history.4

- id: language-model
  term: языковая модель
  en: language model; large language model, LLM
  decode: LLM — large language model, «большая языковая модель»
  short: Модель, которая по началу текста предсказывает следующее слово. Большие языковые модели с миллиардами параметров
    лежат в основе чат-ассистентов.
  introduced_in: intro1.history.4

- id: gpu
  term: видеокарта (GPU)
  en: graphics processing unit, GPU
  decode: GPU — graphics processing unit, «графический процессор»
  short: Чип, который выполняет тысячи простых вычислений одновременно. Создан для игровой графики, стал главным инструментом
    для обучения нейросетей.
  introduced_in: intro1.history.5

# ── intro1.professions

- id: data-analyst
  term: аналитик данных
  en: data analyst
  short: Специалист, который отвечает на вопросы бизнеса цифрами — запросами к данным, отчётами и выводами о том, что произошло
    и почему.
  introduced_in: intro1.professions.1

- id: data-scientist
  term: дата-сайентист
  en: data scientist, DS
  synonyms:
  - специалист по данным
  short: Специалист, который превращает данные в выводы и модели — формулирует задачу, строит и проверяет модель, объясняет
    бизнесу, стоит ли её внедрять.
  introduced_in: intro1.professions.1

- id: ml-engineer
  term: ML-инженер
  en: machine learning engineer, MLE
  synonyms:
  - ML-разработчик
  short: Программист, который доводит модели до работы внутри продукта — надёжно, быстро и под нагрузкой.
  introduced_in: intro1.professions.1

- id: ai-engineer
  term: AI-инженер
  en: AI engineer
  synonyms:
  - LLM-инженер
  short: Инженер, который строит продукты на основе готовых больших языковых моделей — например, чат-ассистентов — и измеряет
    их качество.
  introduced_in: intro1.professions.1

- id: data-engineer
  term: инженер данных
  en: data engineer, DE
  synonyms:
  - дата-инженер
  short: Специалист, который строит и поддерживает регулярную доставку данных в хранилище, чтобы у всех остальных были свежие,
    правильные и удобные данные.
  introduced_in: intro1.professions.1

- id: mlops
  term: MLOps
  en: machine learning operations
  decode: ML + Ops (operations — «эксплуатация»), по аналогии с DevOps
  short: Практики и роль, которые автоматизируют жизнь моделей — обучение, выкатку, хранение версий и мониторинг.
  introduced_in: intro1.professions.1

- id: production
  term: продакшен
  en: production, prod
  synonyms:
  - прод
  - промышленная эксплуатация
  short: Рабочая среда, где программа или модель обслуживает настоящих пользователей, — в отличие от экспериментов на компьютере
    разработчика.
  introduced_in: intro1.professions.1

- id: baseline
  term: базовое решение
  en: baseline
  synonyms:
  - бейзлайн
  short: Самое простое разумное решение задачи — правило или тривиальная модель. С ним сравнивают все более сложные модели.
  example: «Завтра продадим столько же, сколько в этот же день неделю назад».
  introduced_in: intro1.professions.2

- id: metric
  term: метрика
  en: metric
  short: Число, по которому оценивают и сравнивают решения — долю верных ответов модели, выручку, число ушедших клиентов.
  introduced_in: intro1.professions.2

- id: monitoring
  term: мониторинг
  en: monitoring
  short: Постоянное наблюдение за работающей системой или моделью, чтобы вовремя заметить сбой или падение качества.
  introduced_in: intro1.professions.2

- id: code-review
  term: код-ревью
  en: code review
  synonyms:
  - ревью кода
  short: Чтение и проверка изменений кода коллегой перед тем, как они попадут в общий код.
  introduced_in: intro1.professions.3

# ── intro1.map

- id: prerequisite
  term: предпосылка
  en: prerequisite
  short: Тема или навык, без которых новую тему не понять. В учебном плане предпосылки раздела всегда стоят раньше него.
  introduced_in: intro1.map.2

- id: subject
  term: предмет
  en: subject
  short: Сквозная линия обучения, которая тянется через несколько курсов уровнями, — например, Программирование I–VI.
  introduced_in: intro1.map.3

- id: discipline
  term: дисциплина
  en: discipline
  short: Один уровень предмета на конкретном курсе — например, «Программирование III». Заканчивается экзаменом.
  introduced_in: intro1.map.3

- id: spaced-repetition
  term: интервальное повторение
  en: spaced repetition
  short: Повторение пройденного через растущие промежутки времени — сначала часто, потом всё реже. Так знания держатся в памяти
    при небольшой ежедневной нагрузке.
  introduced_in: intro1.map.3

# ── prog1.basics

- id: python
  term: Python
  en: Python
  decode: назван в честь британского комедийного шоу «Летающий цирк Монти Пайтона»; автор — Гвидо ван Россум, первая версия
    — 1991 год
  short: Язык программирования общего назначения, созданный так, чтобы код было легко читать. Широко используется в машинном
    обучении и анализе данных.
  introduced_in: prog1.basics.1

- id: test-case
  term: тест
  en: test case
  short: Одна автоматическая проверка программы — заранее подготовленный ввод (или вызов функции) вместе с ответом, который
    программа обязана выдать.
  example: «Ввод Аня — ожидаемый вывод Привет, Аня!» или assert square(3) == 9.
  introduced_in: prog1.basics.1

- id: value
  term: значение
  en: value
  short: Данные, с которыми работает программа, — число, строка, True/False и т. д. В сообщениях об ошибках и документации
    Python значение называют объектом; к «объекту» из машинного обучения (строке таблицы данных) это отношения не имеет.
  example: 5, 3.5, "кот", True.
  introduced_in: prog1.basics.2

- id: expression
  term: выражение
  en: expression
  short: Комбинация значений, имён, операций и вызовов функций, которую Python вычисляет, получая одно значение.
  example: price * count + 10
  introduced_in: prog1.basics.2

- id: variable
  term: переменная
  en: variable
  short: Имя, которое указывает на значение. Это ярлык, а не коробка — на одно значение могут указывать несколько имён.
  example: после price = 250 имя price указывает на число 250.
  introduced_in: prog1.basics.2

- id: assignment
  term: присваивание
  en: assignment
  short: Инструкция со знаком =, которая привязывает имя к значению. Сначала вычисляется правая часть, потом имя слева привязывается
    к результату.
  example: x = x + 1 — вычислить x + 1 и привязать имя x к результату.
  introduced_in: prog1.basics.2

- id: data-type
  term: тип данных
  en: data type
  short: Вид значения — целое число, дробное число, строка и т. д. Тип определяет, какие значения возможны и какие операции
    с ними разрешены. Узнать тип можно функцией type().
  example: type(5) — int, type("5") — str.
  introduced_in: prog1.basics.2

- id: int
  term: int (целое число)
  en: integer
  decode: сокращение от integer — «целое»
  short: Тип целых чисел в Python. Целые числа точные и не переполняются — растут, пока хватает памяти.
  example: 7, -12, 2 ** 100
  introduced_in: prog1.basics.3

- id: float
  term: float (число с плавающей точкой)
  en: floating-point number
  decode: от floating point — «плавающая точка»
  short: Тип дробных чисел в Python. Хранится в двоичном виде с ограниченной точностью, поэтому результаты вычислений бывают
    чуть неточными.
  example: 0.1 + 0.2 даёт 0.30000000000000004
  introduced_in: prog1.basics.3

- id: module
  term: модуль
  en: module
  short: Набор готового кода — функций и значений, — который подключают к программе инструкцией import.
  example: import math, затем math.sqrt(16)
  introduced_in: prog1.basics.3

- id: string
  term: строка
  en: string
  short: Тип str — неизменяемая последовательность символов, то есть текст. Записывается в одинарных или двойных кавычках.
  example: Строки "Привет", "" (пустая) и "42" (строка из цифр, а не число).
  introduced_in: prog1.basics.4

- id: index
  term: индекс
  en: index
  short: Номер элемента в последовательности. В Python нумерация начинается с 0; отрицательные индексы считают с конца, -1
    — последний элемент.
  example: s = "Python"; s[0] — "P", s[-1] — "n".
  introduced_in: prog1.basics.4

- id: f-string
  term: f-строка
  en: f-string, formatted string literal
  short: Строка с буквой f перед кавычками; выражения в фигурных скобках внутри неё вычисляются и подставляются в текст.
  example: 'f"Итого: {total:.2f} руб."'
  introduced_in: prog1.basics.4

- id: method
  term: метод
  en: method
  short: Функция, привязанная к значению определённого типа. Вызывается через точку после значения.
  example: '"кот".upper() даёт "КОТ".'
  introduced_in: prog1.basics.4

- id: syntax-error
  term: синтаксическая ошибка
  en: syntax error
  short: Ошибка в записи программы — нарушены правила языка (скобки, кавычки, двоеточия, отступы). Python находит её до запуска,
    поэтому программа не выполняется вовсе.
  example: 'print("Привет" — SyntaxError: ''('' was never closed'
  introduced_in: prog1.basics.5

- id: exception
  term: исключение
  en: exception
  short: Ошибка, возникшая во время выполнения программы, когда действие выполнить нельзя. У исключения есть тип (TypeError,
    ValueError, NameError…) и текст.
  example: int("abc") — ValueError.
  introduced_in: prog1.basics.5

- id: traceback
  term: traceback
  en: traceback
  decode: «обратная трассировка», или трассировка стека, — путь, который прошла программа до ошибки
  short: Сообщение Python об исключении. Читается снизу вверх — последняя строка содержит тип и текст ошибки, строки над ней
    — файл и номер строки кода, где она произошла.
  introduced_in: prog1.basics.5

# ── prog1.control

- id: if-statement
  term: условная инструкция
  en: if statement
  short: Инструкция if (с необязательными elif и else) — развилка в программе. Проверяет условия сверху вниз один раз и выполняет
    только первую ветвь с истинным условием.
  example: "if age < 14:\n    print(\"детский\")\nelse:\n    print(\"взрослый\")"
  introduced_in: prog1.control.1

- id: bool
  term: логическое значение
  en: boolean
  decode: тип bool назван в честь Джорджа Буля, английского математика XIX века, создателя алгебры логики
  short: Значение типа bool — True (истина) или False (ложь). Его дают сравнения и логические операции and, or, not.
  example: 5 > 3 даёт True, 2 + 2 == 5 даёт False.
  introduced_in: prog1.control.1

- id: truthiness
  term: истинность значения
  en: truth value
  short: То, как значение ведёт себя в условии. Из уже знакомых значений ложны False, None, ноль (0, 0.0), пустая строка и
    пустой список; то же правило распространяется на любые пустые коллекции. Остальные значения истинны.
  example: if name — ветвь выполнится, только если строка name не пустая; строка "0" истинна.
  introduced_in: prog1.control.1

- id: loop
  term: цикл
  en: loop
  short: Инструкция, которая повторяет блок строк кода — тело цикла. while повторяет, пока условие истинно; for — для каждого
    элемента последовательности (или другого перебираемого значения).
  example: 'for t in temps: print(t)'
  introduced_in: prog1.control.2

- id: iteration
  term: итерация
  en: iteration
  decode: от латинского iteratio — «повторение»
  short: Одно выполнение тела цикла. Словом «итерации» также называют сам процесс многократного повторения.
  example: Цикл for по списку из пяти элементов делает пять итераций.
  introduced_in: prog1.control.2

- id: off-by-one
  term: ошибка на единицу
  en: off-by-one error
  short: Ошибка на границе, из-за которой цикл или индекс промахивается на один шаг — лишняя или недостающая итерация, лишний
    или пропущенный элемент. Типичные причины — < вместо <= и забытое правило «конец range не включается».
  example: while i < 5 печатает 1–4 вместо 1–5; range(1, 10) не включает 10.
  introduced_in: prog1.control.2

- id: list
  term: список
  en: list
  short: Тип list — упорядоченная последовательность значений (элементов) в квадратных скобках. В отличие от строки, список
    можно изменять — заменять и добавлять элементы.
  example: temps = [12, 15, 9]; temps[0] — 12; temps.append(7) дописывает 7 в конец.
  introduced_in: prog1.control.3

- id: loop-variable
  term: переменная цикла
  en: loop variable
  short: Имя после for. Это обычное имя, которое перед каждой итерацией привязывается к очередному элементу. Присваивание
    ему в теле не меняет перебираемый список.
  example: В for t in [12, 15] имя t указывает сначала на 12, потом на 15.
  introduced_in: prog1.control.4

- id: accumulator
  term: накопитель
  en: accumulator
  short: Имя, которое используется в цикле, чтобы складывать или накапливать результат — сумму, количество, список. Начальное
    значение получает до цикла, обновляется в теле.
  example: total = 0, затем в цикле total += s; после цикла total — сумма всех s.
  introduced_in: prog1.control.5

- id: flag
  term: флаг
  en: flag
  short: Имя с логическим значением, которое отмечает, произошло ли событие, — например, нашёлся ли нужный элемент. До цикла
    получает начальное значение и переключается в цикле только в одну сторону.
  example: found = False до цикла; found = True и break, когда элемент найден.
  introduced_in: prog1.control.5

# ── intro1.history.02-perceptron

- id: layer
  term: слой
  en: layer
  short: Группа нейронов, которые работают параллельно и получают входы от предыдущего слоя. Ответы одного слоя идут на входы
    следующего; последний слой выдаёт ответ всей сети и называется выходным.
  introduced_in: intro1.history.2

- id: hidden-layer
  term: скрытый слой
  en: hidden layer
  short: Слой нейронной сети между входами и выходным слоем. В обучающих примерах его правильных ответов нет — что отвечать
    его нейронам, сеть находит сама.
  introduced_in: intro1.history.2
- id: backprop
  term: метод обратного распространения ошибки
  en: backpropagation, backprop
  short: Способ обучать многослойную сеть. Ошибку на выходе передают назад, слой за слоем, и каждый вес получает поправку
    по своей доле вины.
  introduced_in: intro1.history.4

# ── prog1.functions

- id: function
  term: функция
  en: function
  short: Именованный кусок программы — последовательность инструкций, которая может принимать аргументы и возвращать результат.
    Своя функция определяется инструкцией def, а выполняется при вызове.
  example: "def with_discount(price, percent):\n    return price - price * percent / 100"
  introduced_in: prog1.functions.1

- id: function-parameter
  term: параметр функции
  en: parameter
  short: Имя в скобках определения функции. При вызове оно привязывается к значению соответствующего аргумента — это новое
    имя для того же значения.
  example: В def with_discount(price, percent) параметры — price и percent.
  introduced_in: prog1.functions.1

- id: argument
  term: аргумент
  en: argument
  short: Значение, которое передают функции при вызове. Аргументы вычисляются до того, как начнёт выполняться тело функции.
  example: В with_discount(1200, 15) аргументы — 1200 и 15.
  introduced_in: prog1.functions.1

- id: return-value
  term: возвращаемое значение
  en: return value
  short: Значение, которое функция отдаёт в место вызова инструкцией return. Инструкция return сразу завершает вызов.
  example: После total = with_discount(1200, 15) имя total указывает на возвращаемое значение 1020.0.
  introduced_in: prog1.functions.1

- id: none
  term: None
  en: None
  short: Особое значение «ничего, результата нет», единственное значение типа NoneType. Его возвращает функция без return;
    в условии None ложно. Проверяют через is None.
  example: print("Привет") выводит текст и возвращает None.
  introduced_in: prog1.functions.1

- id: default-value
  term: значение по умолчанию
  en: default argument value
  short: Значение параметра, записанное в определении функции. Если аргумент для этого параметра не передали, параметр привязывается
    к этому значению. Вычисляется один раз, когда выполняется def; такие параметры пишут после остальных.
  example: def with_discount(price, percent=10) — вызов with_discount(1200) считает скидку 10%.
  introduced_in: prog1.functions.1

- id: keyword-argument
  term: именованный аргумент
  en: keyword argument
  short: Аргумент, переданный вместе с именем параметра — имя=значение. Сопоставляется по имени, поэтому порядок именованных
    аргументов неважен. Позиционные аргументы передают по порядку, без имени, и пишут первыми.
  example: print(n, end=" "); with_discount(percent=50, price=1200)
  introduced_in: prog1.functions.1

- id: local-variable
  term: локальная переменная (локальное имя)
  en: local variable
  short: Параметр или имя, которому где-либо в теле функции что-то присваивают (в том числе переменная цикла for), если оно
    не указано в инструкции global. Локально во всём теле, существует только во время вызова и не видно снаружи.
  example: 'В def f(price): cut = price / 10 локальные имена — price и cut.'
  introduced_in: prog1.functions.2

- id: global-variable
  term: глобальная переменная (глобальное имя)
  en: global variable
  short: Имя, заведённое в самой программе, вне функций, в том числе имя функции, созданное def. Функция может его читать;
    присвоить ему изнутри функции можно только после инструкции global — ею пользуются редко и осознанно.
  introduced_in: prog1.functions.2

- id: scope
  term: область видимости
  en: scope
  short: Часть программы, где имя доступно. Имя, которому где-либо в теле функции присваивают, локальное во всём теле и ищется
    только среди локальных; остальные имена Python ищет среди глобальных, потом среди встроенных.
  introduced_in: prog1.functions.2

- id: pure-function
  term: чистая функция
  en: pure function
  short: Функция, которая при одинаковых аргументах всегда возвращает одно и то же и ничего не делает, кроме возврата значения,
    — не печатает, не меняет переданные значения и глобальные имена. Читать имена, которые никто не меняет (функции, константы),
    чистоте не мешает.
  example: 'def tax(price): return price * 0.2'
  introduced_in: prog1.functions.2

- id: side-effect
  term: побочный эффект
  en: side effect
  short: Всё, что вызов функции делает, кроме возврата значения, — вывод на экран, изменение переданного списка, присваивание
    глобальному имени.
  example: print и list.append работают ради побочного эффекта и возвращают None.
  introduced_in: prog1.functions.2

- id: decomposition
  term: декомпозиция
  en: decomposition
  short: Разбиение задачи на самостоятельные части, каждую из которых можно понять, проверить и использовать повторно. В программе
    части — это функции.
  example: «Посчитать чек» → item_price, receipt_sum, apply_discount.
  introduced_in: prog1.functions.3

- id: docstring
  term: строка документации
  en: docstring
  short: 'Текст в тройных кавычках, первая инструкция тела функции. Описывает, что функция делает, принимает и возвращает.
    Её показывает help(), а комментарий # в теле функции — нет.'
  introduced_in: prog1.functions.3

- id: type-hint
  term: аннотация типов (type hints)
  en: type hints, type annotations
  short: 'Подпись ожидаемых типов параметров и результата функции — def f(line: str) -> int. Python при выполнении её не проверяет;
    это подсказка для человека, редактора кода и программ проверки.'
  example: 'def item_price(line: str) -> int:'
  introduced_in: prog1.functions.3

# ── prog1.collections

- id: slice
  term: срез
  en: slice
  short: Новая последовательность из части элементов списка, строки или кортежа — с индекса a до индекса b, не включая b,
    при желании с шагом k. Исходная последовательность не меняется; срез за границей ошибки не даёт.
  example: temps[1:3] — второй и третий элементы; temps[::-1] — список задом наперёд.
  introduced_in: prog1.collections.1

- id: tuple
  term: кортеж
  en: tuple
  short: Тип tuple — неизменяемая последовательность, в которой элементы нельзя заменить, добавить или удалить (но список
    внутри кортежа меняться может). Обычно хранит одну запись из нескольких полей, у каждого свой смысл. Кортеж задаёт запятая,
    а не скобки.
  example: birthday = (12, 4, 2008); кортеж из одного элемента — (5,).
  introduced_in: prog1.collections.1

- id: unpacking
  term: распаковка
  en: unpacking, sequence unpacking
  short: Присваивание нескольким именам сразу — каждое имя слева привязывается к своему элементу последовательности справа.
    Имён должно быть столько же, сколько элементов.
  example: day, month, year = (12, 4, 2008); a, b = b, a меняет местами значения имён a и b.
  introduced_in: prog1.collections.1

- id: alias
  term: псевдоним
  en: alias, aliasing
  short: Одно из нескольких имён, которые указывают на одно и то же значение. Изменение изменяемого значения через один псевдоним
    видно через все.
  example: после backup = marks имена backup и marks — псевдонимы одного списка.
  introduced_in: prog1.collections.2

- id: mutable
  term: изменяемое значение
  en: mutable
  short: Значение, содержимое которого можно поменять на месте, — список, словарь (о множествах — в теме «Множества»). Изменение
    видно через все имена, которые на него указывают.
  example: marks.append(2) меняет сам список marks.
  introduced_in: prog1.collections.2

- id: immutable
  term: неизменяемое значение
  en: immutable
  short: Значение, которое после создания изменить нельзя, — число, строка, кортеж, None. «Изменить» его можно, только собрав
    новое значение и привязав к нему имя. У кортежа нельзя заменить элементы, но изменяемый элемент внутри него (например,
    список) меняться может; кортеж, все элементы которого неизменяемы, не меняется никак.
  example: name += "ик" собирает новую строку, старая остаётся прежней.
  introduced_in: prog1.collections.2

- id: shallow-copy
  term: поверхностная копия
  en: shallow copy
  short: Новый список (или словарь) с теми же самыми элементами. Внешний список новый, но изменяемые элементы внутри — общие
    с оригиналом.
  example: marks.copy(), marks[:], list(marks).
  introduced_in: prog1.collections.2

- id: deep-copy
  term: глубокая копия
  en: deep copy
  short: Копия, в которой скопировано всё, в том числе вложенные списки и словари; ни одного общего изменяемого значения с
    оригиналом у неё нет. Делается функцией copy.deepcopy.
  example: backup = copy.deepcopy(table) — изменения backup[0][0] не затронут table.
  introduced_in: prog1.collections.2

- id: dict
  term: словарь
  en: dictionary, dict
  short: Тип dict — набор пар «ключ — значение», где по ключу быстро находится значение. Ключи уникальны, порядок добавления
    сохраняется; словарь изменяем.
  example: 'prices = {"хлеб": 45, "сыр": 320}; prices["хлеб"] — 45.'
  introduced_in: prog1.collections.3

- id: dict-key
  term: ключ словаря
  en: dictionary key
  short: То, по чему в словаре находят значение. Ключ — хешируемое значение (строка, число, кортеж из них); список ключом
    быть не может. Отсутствующий ключ в d[k] даёт KeyError. Не путать с ключом сортировки.
  example: 'в {"хлеб": 45} ключ — "хлеб", значение — 45.'
  introduced_in: prog1.collections.3

# ── prog1.collections

- id: set
  term: множество
  en: set
  short: Тип set — набор значений без повторов и без порядка. Индексов нет; in проверяет наличие почти мгновенно. Элементы
    — только хешируемые значения.
  example: set(["Аня", "Борис", "Аня"]) — множество из двух имён; пустое множество — set(), а {} — пустой словарь.
  introduced_in: prog1.collections.4

- id: hash
  term: хеш
  en: hash
  short: Число, которое Python вычисляет по значению, чтобы решить, где хранить его в множестве или словаре. У равных значений
    хеш одинаковый, поэтому найти значение можно сразу, без перебора.
  example: hash("сыр") — целое число; у двух равных строк оно одно и то же.
  introduced_in: prog1.collections.4

- id: hashable
  term: хешируемое значение
  en: hashable
  short: Значение, хеш которого не меняется, пока значение существует. Только такие значения бывают элементами множества и
    ключами словаря; среди встроенных это неизменяемые — числа, строки, кортежи из них.
  example: '{(1, 2), "сыр"} работает, а {[1, 2]} даёт TypeError: unhashable type: ''list''.'
  introduced_in: prog1.collections.4

- id: list-comprehension
  term: списковое включение
  en: list comprehension
  short: 'Короткая запись шаблона «пустой список, цикл, append» — [выражение for x in data if условие]. Результат — новый
    список; так же записывают включения словаря {k: v for …} и множества {x for …}.'
  example: '[int(p) for p in "89 45".split()] даёт [89, 45]; [t for t in temps if t < 0] — только морозные дни.'
  introduced_in: prog1.collections.5

- id: generator-expression
  term: генераторное выражение
  en: generator expression
  short: Включение без квадратных скобок — например, единственный аргумент sum, any или all. Не собирает список, а выдаёт
    значения по одному, по мере перебора; перебрать его можно только один раз.
  example: any(s == 0 for s in sales) — есть ли день с нулевой выручкой.
  introduced_in: prog1.collections.5

- id: higher-order-function
  term: функция высшего порядка
  en: higher-order function
  short: Функция, которая принимает другую функцию как аргумент или возвращает функцию. Функцию передают по имени, без скобок.
  example: sorted(words, key=len) — sorted получает функцию len и сама вызывает её для каждого слова.
  introduced_in: prog1.collections.6

- id: lambda
  term: lambda-выражение
  en: lambda, lambda expression
  short: 'Короткая запись функции без имени — lambda параметры: выражение. Тело — одно выражение, его значение возвращается
    без return. Удобна как аргумент; если функции нужно имя — def.'
  example: 'lambda p: p["score"] — функция, которая возвращает очки игрока.'
  introduced_in: prog1.collections.6

- id: sort-key
  term: ключ сортировки
  en: sort key, key function
  short: Значение, по которому сортировка сравнивает элемент. Его вычисляет функция из аргумента key — один раз для каждого
    элемента; в результат попадают сами элементы, не ключи. Не путать с ключом словаря.
  example: 'sorted(words, key=len) — ключ каждого слова его длина; key=lambda p: (-p["score"], p["name"]) — по очкам, затем
    по имени.'
  introduced_in: prog1.collections.6

- id: stable-sort
  term: устойчивая сортировка
  en: stable sort
  short: Сортировка, при которой элементы с равными ключами сохраняют исходный порядок. Сортировка в Python (sorted и sort)
    устойчива, в том числе с reverse=True.
  example: sorted(["чай", "сыр", "молоко"], key=len) — слово «чай» остаётся перед словом «сыр».
  introduced_in: prog1.collections.6
