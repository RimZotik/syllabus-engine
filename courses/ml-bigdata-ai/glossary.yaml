# Глоссарий курса. Поля: id, term, en (английский термин), decode (расшифровка/происхождение), short (1–2 предложения своими словами),
# example (необязательно), introduced_in (id темы, где термин введён). Правила — docs/content/style-guide.md, разделы 4 и 8.

- id: program
  term: программа
  en: program
  decode: от греч. prógramma — «объявление, предписание»
  short: Набор точных инструкций, который компьютер выполняет шаг за шагом.
  introduced_in: intro1.what.1

- id: algorithm
  term: алгоритм
  en: algorithm
  decode: от имени математика аль-Хорезми (IX век)
  short: Конечная последовательность понятных шагов, которая из входных данных получает результат. Рецепт — тоже алгоритм.
  example: «Если сумма покупки больше 5000 ₽ — скидка 10 %, иначе — без скидки».
  introduced_in: intro1.what.1

- id: ai
  term: искусственный интеллект
  en: artificial intelligence, AI
  decode: термин придумал Джон Маккарти в 1955 году
  short: Широкая область, которая учит компьютеры решать задачи, обычно требующие человеческого ума. Машинное обучение — самый успешный её способ сегодня.
  introduced_in: intro1.what.1

- id: ml
  term: машинное обучение
  en: machine learning, ML
  decode: выражение ввёл Артур Сэмюэл в 1959 году
  short: Способ создавать программы, которые находят закономерности в примерах сами, а не следуют правилам, написанным человеком.
  introduced_in: intro1.what.1

- id: data
  term: данные
  en: data
  decode: от лат. datum — «данное»
  short: Записанные факты о мире — числа, тексты, картинки, клики. Сырьё, из которого машинное обучение извлекает закономерности.
  introduced_in: intro1.what.2

- id: dataset
  term: датасет
  en: dataset, «набор данных»
  short: Набор примеров, собранных для одной задачи. Часто — таблица, где строка — объект, а столбцы — его признаки и ответ.
  introduced_in: intro1.what.2

- id: feature
  term: признак
  en: feature
  short: Одна измеримая характеристика объекта — площадь квартиры, возраст клиента, число слов в письме.
  introduced_in: intro1.what.2

- id: target
  term: целевая переменная
  en: target, label («метка»)
  short: То, что модель должна предсказать — цена, «спам или нет», диагноз. В обучающих примерах ответ известен.
  introduced_in: intro1.what.2

- id: model
  term: модель
  en: model
  short: Функция с настраиваемыми параметрами, которая по признакам объекта выдаёт предсказание.
  example: цена = a × площадь + b, где a и b — параметры.
  introduced_in: intro1.what.2

- id: parameter
  term: параметр модели
  en: parameter, weight («вес»)
  short: Число внутри модели, которое подбирается при обучении. У простой модели их два, у больших языковых моделей — сотни миллиардов.
  introduced_in: intro1.what.2

- id: training
  term: обучение
  en: training
  short: Подбор параметров модели так, чтобы её ошибки на известных примерах стали как можно меньше.
  introduced_in: intro1.what.2

- id: loss
  term: функция потерь
  en: loss function
  short: Число, которое показывает, насколько предсказание модели на одном объекте расходится с правильным ответом. Среднее потерь по обучающей выборке называют эмпирическим риском — его и уменьшает обучение.
  introduced_in: intro1.what.2

- id: prediction
  term: предсказание
  en: prediction, inference («вывод»)
  short: Ответ, который обученная модель выдаёт для нового объекта, ответ для которого заранее неизвестен.
  introduced_in: intro1.what.2

- id: generalization
  term: обобщение
  en: generalization
  short: Способность модели правильно отвечать на новых примерах, которых она не видела при обучении. Ради этого всё и делается.
  introduced_in: intro1.what.2

- id: overfitting
  term: переобучение
  en: overfitting
  short: Модель «зазубрила» обучающие примеры вместе со случайным шумом и плохо работает на новых данных.
  introduced_in: intro1.what.2

- id: classification
  term: классификация
  en: classification
  short: Задача выбрать для объекта один из заранее известных классов — «спам / не спам», «кошка / собака / птица».
  introduced_in: intro1.what.3

- id: regression
  term: регрессия
  en: regression
  decode: от лат. regressio — «возвращение»; название историческое, от работ Фрэнсиса Гальтона
  short: Задача предсказать число — цену, температуру, время доставки.
  introduced_in: intro1.what.3

- id: clustering
  term: кластеризация
  en: clustering, от cluster — «гроздь»
  short: Задача разбить объекты на группы похожих, когда правильных групп заранее никто не знает.
  introduced_in: intro1.what.3

- id: recommender
  term: рекомендательная система
  en: recommender system
  short: Система, которая для каждого пользователя подбирает и упорядочивает то, что ему, вероятно, понравится.
  introduced_in: intro1.what.3

- id: supervised
  term: обучение с учителем
  en: supervised learning
  short: Обучение на примерах, где для каждого объекта известен правильный ответ.
  introduced_in: intro1.what.3

- id: unsupervised
  term: обучение без учителя
  en: unsupervised learning
  short: Поиск структуры в данных без правильных ответов — например, группировка похожих объектов.
  introduced_in: intro1.what.3

- id: reinforcement
  term: обучение с подкреплением
  en: reinforcement learning
  short: Обучение через пробы и ошибки — агент действует, получает награду или штраф и постепенно учится действовать лучше.
  introduced_in: intro1.what.3

- id: generative
  term: генеративная модель
  en: generative model
  short: Модель, которая создаёт новые данные — текст, картинки, звук — похожие на те, на которых она училась.
  introduced_in: intro1.what.3

- id: knn
  term: метод k ближайших соседей
  en: k nearest neighbours, kNN
  short: Чтобы предсказать класс нового объекта, смотрим на k самых похожих известных примеров и выбираем самый частый у них класс.
  introduced_in: intro1.what.4

- id: hyperparameter
  term: гиперпараметр
  en: hyperparameter
  short: Настройка модели, которую выбирает человек до обучения (например, число соседей k). Параметры подбирает обучение, гиперпараметры — мы.
  introduced_in: intro1.what.4

- id: object
  term: объект
  en: object, sample, instance
  short: То, о чём модель делает предсказание, — квартира, письмо, клиент. В таблице данных это одна строка.
  introduced_in: intro1.what.2

- id: training-set
  term: обучающая выборка
  en: training set
  short: Часть данных с известными ответами, на которой модель обучается.
  introduced_in: intro1.what.2

- id: holdout
  term: отложенные данные
  en: hold-out set, test set
  short: Часть данных, которую заранее откладывают и не показывают модели при обучении, чтобы честно проверить её на новых примерах.
  introduced_in: intro1.what.2

- id: underfitting
  term: недообучение
  en: underfitting
  short: Модель слишком простая и плохо отвечает даже на обучающих примерах — она не уловила закономерность.
  introduced_in: intro1.what.2

- id: labeling
  term: разметка данных
  en: data labeling, annotation
  short: Расстановка правильных ответов для примеров — обычно людьми. Без разметки нельзя обучать с учителем.
  introduced_in: intro1.what.3

- id: agent
  term: агент
  en: agent
  short: В обучении с подкреплением — тот, кто действует в среде, получает награду или штраф и учится действовать лучше.
  introduced_in: intro1.what.3

- id: ranking
  term: ранжирование
  en: ranking
  short: Задача упорядочить объекты по тому, насколько они подходят запросу или конкретному человеку, — как выдача поисковика.
  introduced_in: intro1.what.3

# ── intro1.history

- id: turing-machine
  term: машина Тьюринга
  en: Turing machine
  decode: по имени Алана Тьюринга, описавшего её в 1936 году
  short: Мысленная модель вычисления по инструкции — лента с символами, головка, которая читает, пишет и сдвигается, и таблица
    правил. Принято считать, что на ней можно выполнить любой алгоритм.
  introduced_in: intro1.history.1

- id: turing-test
  term: тест Тьюринга
  en: Turing test, imitation game («игра в имитацию»)
  short: Проверка, в которой судья переписывается с человеком и машиной и пытается понять, кто из них машина. Проверяет только
    поведение в разговоре, а не понимание.
  introduced_in: intro1.history.1

- id: perceptron
  term: перцептрон
  en: perceptron
  decode: от лат. perceptio — «восприятие»; Фрэнк Розенблатт, 1958
  short: Простейшая обучаемая модель — складывает признаки с весами и сравнивает сумму с порогом; при ошибке веса сдвигаются
    к правильному ответу. Проводит между классами только прямую границу.
  introduced_in: intro1.history.2

- id: ai-winter
  term: зима искусственного интеллекта
  en: AI winter
  short: Период резкого спада денег и интереса к ИИ после завышенных ожиданий. Первая — в 1970-х, вторая — с конца 1980-х
    до середины 1990-х.
  introduced_in: intro1.history.2

- id: expert-system
  term: экспертная система
  en: expert system
  short: Программа, в которую записали знания специалистов в виде правил «если — то». Работала в узких задачах, но не училась
    и плохо масштабировалась.
  introduced_in: intro1.history.3

- id: boosting
  term: бустинг
  en: boosting, от boost — «усиливать»
  short: Способ собрать сильную модель из цепочки простых, где каждая следующая исправляет ошибки предыдущих. Один из главных
    методов для табличных данных.
  introduced_in: intro1.history.3

- id: neural-network
  term: нейронная сеть
  en: neural network, «нейросеть»
  short: Модель из многих простых «нейронов», собранных в слои, — выходы одного слоя идут на входы следующего. Обучается подбором
    весов по примерам.
  introduced_in: intro1.history.2

- id: deep-learning
  term: глубокое обучение
  en: deep learning
  short: Обучение нейросетей из многих слоёв, которые сами находят признаки — от простых (края на картинке) до сложных (целые
    объекты).
  introduced_in: intro1.history.4

- id: transformer
  term: трансформер
  en: transformer
  short: Архитектура нейросети на механизме внимания — каждый элемент (например, слово) учитывает все остальные сразу. Основа
    современных языковых моделей.
  introduced_in: intro1.history.4

- id: language-model
  term: языковая модель
  en: language model; large language model, LLM
  decode: LLM — large language model, «большая языковая модель»
  short: Модель, которая по началу текста предсказывает следующее слово. Большие языковые модели с миллиардами параметров
    лежат в основе чат-ассистентов.
  introduced_in: intro1.history.4

- id: gpu
  term: видеокарта (GPU)
  en: graphics processing unit, GPU
  decode: GPU — graphics processing unit, «графический процессор»
  short: Чип, который выполняет тысячи простых вычислений одновременно. Создан для игровой графики, стал главным инструментом
    для обучения нейросетей.
  introduced_in: intro1.history.5

# ── intro1.professions

- id: data-analyst
  term: аналитик данных
  en: data analyst
  short: Специалист, который отвечает на вопросы бизнеса цифрами — запросами к данным, отчётами и выводами о том, что произошло
    и почему.
  introduced_in: intro1.professions.1

- id: data-scientist
  term: дата-сайентист
  en: data scientist, DS
  synonyms:
  - специалист по данным
  short: Специалист, который превращает данные в выводы и модели — формулирует задачу, строит и проверяет модель, объясняет
    бизнесу, стоит ли её внедрять.
  introduced_in: intro1.professions.1

- id: ml-engineer
  term: ML-инженер
  en: machine learning engineer, MLE
  synonyms:
  - ML-разработчик
  short: Программист, который доводит модели до работы внутри продукта — надёжно, быстро и под нагрузкой.
  introduced_in: intro1.professions.1

- id: ai-engineer
  term: AI-инженер
  en: AI engineer
  synonyms:
  - LLM-инженер
  short: Инженер, который строит продукты на основе готовых больших языковых моделей — например, чат-ассистентов — и измеряет
    их качество.
  introduced_in: intro1.professions.1

- id: data-engineer
  term: инженер данных
  en: data engineer, DE
  synonyms:
  - дата-инженер
  short: Специалист, который строит и поддерживает регулярную доставку данных в хранилище, чтобы у всех остальных были свежие,
    правильные и удобные данные.
  introduced_in: intro1.professions.1

- id: mlops
  term: MLOps
  en: machine learning operations
  decode: ML + Ops (operations — «эксплуатация»), по аналогии с DevOps
  short: Практики и роль, которые автоматизируют жизнь моделей — обучение, выкатку, хранение версий и мониторинг.
  introduced_in: intro1.professions.1

- id: production
  term: продакшен
  en: production, prod
  synonyms:
  - прод
  - промышленная эксплуатация
  short: Рабочая среда, где программа или модель обслуживает настоящих пользователей, — в отличие от экспериментов на компьютере
    разработчика.
  introduced_in: intro1.professions.1

- id: baseline
  term: базовое решение
  en: baseline
  synonyms:
  - бейзлайн
  short: Самое простое разумное решение задачи — правило или тривиальная модель. С ним сравнивают все более сложные модели.
  example: «Завтра продадим столько же, сколько в этот же день неделю назад».
  introduced_in: intro1.professions.2

- id: metric
  term: метрика
  en: metric
  short: Число, по которому оценивают и сравнивают решения — долю верных ответов модели, выручку, число ушедших клиентов.
  introduced_in: intro1.professions.2

- id: monitoring
  term: мониторинг
  en: monitoring
  short: Постоянное наблюдение за работающей системой или моделью, чтобы вовремя заметить сбой или падение качества.
  introduced_in: intro1.professions.2

- id: code-review
  term: код-ревью
  en: code review
  synonyms:
  - ревью кода
  short: Чтение и проверка изменений кода коллегой перед тем, как они попадут в общий код.
  introduced_in: intro1.professions.3

# ── intro1.map

- id: prerequisite
  term: предпосылка
  en: prerequisite
  short: Тема или навык, без которых новую тему не понять. В учебном плане предпосылки раздела всегда стоят раньше него.
  introduced_in: intro1.map.2

- id: subject
  term: предмет
  en: subject
  short: Сквозная линия обучения, которая тянется через несколько курсов уровнями, — например, Программирование I–VI.
  introduced_in: intro1.map.3

- id: discipline
  term: дисциплина
  en: discipline
  short: Один уровень предмета на конкретном курсе — например, «Программирование III». Заканчивается экзаменом.
  introduced_in: intro1.map.3

- id: spaced-repetition
  term: интервальное повторение
  en: spaced repetition
  short: Повторение пройденного через растущие промежутки времени — сначала часто, потом всё реже. Так знания держатся в памяти
    при небольшой ежедневной нагрузке.
  introduced_in: intro1.map.3

# ── prog1.basics

- id: python
  term: Python
  en: Python
  decode: назван в честь британского комедийного шоу «Летающий цирк Монти Пайтона»; автор — Гвидо ван Россум, первая версия
    — 1991 год
  short: Язык программирования общего назначения, созданный так, чтобы код было легко читать. Широко используется в машинном
    обучении и анализе данных.
  introduced_in: prog1.basics.1

- id: test-case
  term: тест
  en: test case
  short: Одна автоматическая проверка программы — заранее подготовленный ввод (или вызов функции) вместе с ответом, который
    программа обязана выдать.
  example: «Ввод Аня — ожидаемый вывод Привет, Аня!» или assert square(3) == 9.
  introduced_in: prog1.basics.1

- id: value
  term: значение
  en: value
  short: Данные, с которыми работает программа, — число, строка, True/False и т. д. В сообщениях об ошибках и документации
    Python значение называют объектом; к «объекту» из машинного обучения (строке таблицы данных) это отношения не имеет.
  example: 5, 3.5, "кот", True.
  introduced_in: prog1.basics.2

- id: expression
  term: выражение
  en: expression
  short: Комбинация значений, имён, операций и вызовов функций, которую Python вычисляет, получая одно значение.
  example: price * count + 10
  introduced_in: prog1.basics.2

- id: variable
  term: переменная
  en: variable
  short: Имя, которое указывает на значение. Это ярлык, а не коробка — на одно значение могут указывать несколько имён.
  example: после price = 250 имя price указывает на число 250.
  introduced_in: prog1.basics.2

- id: assignment
  term: присваивание
  en: assignment
  short: Инструкция со знаком =, которая привязывает имя к значению. Сначала вычисляется правая часть, потом имя слева привязывается
    к результату.
  example: x = x + 1 — вычислить x + 1 и привязать имя x к результату.
  introduced_in: prog1.basics.2

- id: data-type
  term: тип данных
  en: data type
  short: Вид значения — целое число, дробное число, строка и т. д. Тип определяет, какие значения возможны и какие операции
    с ними разрешены. Узнать тип можно функцией type().
  example: type(5) — int, type("5") — str.
  introduced_in: prog1.basics.2

- id: int
  term: int (целое число)
  en: integer
  decode: сокращение от integer — «целое»
  short: Тип целых чисел в Python. Целые числа точные и не переполняются — растут, пока хватает памяти.
  example: 7, -12, 2 ** 100
  introduced_in: prog1.basics.3

- id: float
  term: float (число с плавающей точкой)
  en: floating-point number
  decode: от floating point — «плавающая точка»
  short: Тип дробных чисел в Python. Хранится в двоичном виде с ограниченной точностью, поэтому результаты вычислений бывают
    чуть неточными.
  example: 0.1 + 0.2 даёт 0.30000000000000004
  introduced_in: prog1.basics.3

- id: module
  term: модуль
  en: module
  short: Набор готового кода — функций и значений, — который подключают к программе инструкцией import.
  example: import math, затем math.sqrt(16)
  introduced_in: prog1.basics.3

- id: string
  term: строка
  en: string
  short: Тип str — неизменяемая последовательность символов, то есть текст. Записывается в одинарных или двойных кавычках.
  example: Строки "Привет", "" (пустая) и "42" (строка из цифр, а не число).
  introduced_in: prog1.basics.4

- id: index
  term: индекс
  en: index
  short: Номер элемента в последовательности. В Python нумерация начинается с 0; отрицательные индексы считают с конца, -1
    — последний элемент.
  example: s = "Python"; s[0] — "P", s[-1] — "n".
  introduced_in: prog1.basics.4

- id: f-string
  term: f-строка
  en: f-string, formatted string literal
  short: Строка с буквой f перед кавычками; выражения в фигурных скобках внутри неё вычисляются и подставляются в текст.
  example: 'f"Итого: {total:.2f} руб."'
  introduced_in: prog1.basics.4

- id: method
  term: метод
  en: method
  short: Функция, привязанная к значению определённого типа. Вызывается через точку после значения.
  example: '"кот".upper() даёт "КОТ".'
  introduced_in: prog1.basics.4

- id: syntax-error
  term: синтаксическая ошибка
  en: syntax error
  short: Ошибка в записи программы — нарушены правила языка (скобки, кавычки, двоеточия, отступы). Python находит её до запуска,
    поэтому программа не выполняется вовсе.
  example: 'print("Привет" — SyntaxError: ''('' was never closed'
  introduced_in: prog1.basics.5

- id: exception
  term: исключение
  en: exception
  short: Ошибка, возникшая во время выполнения программы, когда действие выполнить нельзя. У исключения есть тип (TypeError,
    ValueError, NameError…) и текст.
  example: int("abc") — ValueError.
  introduced_in: prog1.basics.5

- id: traceback
  term: traceback
  en: traceback
  decode: «обратная трассировка», или трассировка стека, — путь, который прошла программа до ошибки
  short: Сообщение Python об исключении. Читается снизу вверх — последняя строка содержит тип и текст ошибки, строки над ней
    — пары «файл — номер строки кода»; они показывают, где ошибку заметили и какие вызовы к этому месту привели.
  introduced_in: prog1.basics.5

# ── prog1.control

- id: if-statement
  term: условная инструкция
  en: if statement
  short: Инструкция if (с необязательными elif и else) — развилка в программе. Проверяет условия сверху вниз один раз и выполняет
    только первую ветвь с истинным условием.
  example: "if age < 14:\n    print(\"детский\")\nelse:\n    print(\"взрослый\")"
  introduced_in: prog1.control.1

- id: bool
  term: логическое значение
  en: boolean
  decode: тип bool назван в честь Джорджа Буля, английского математика XIX века, создателя алгебры логики
  short: Значение типа bool — True (истина) или False (ложь). Его дают сравнения и логические операции and, or, not.
  example: 5 > 3 даёт True, 2 + 2 == 5 даёт False.
  introduced_in: prog1.control.1

- id: truthiness
  term: истинность значения
  en: truth value
  short: То, как значение ведёт себя в условии. Из уже знакомых значений ложны False, None, ноль (0, 0.0), пустая строка и
    пустой список; то же правило распространяется на любые пустые коллекции. Остальные значения истинны.
  example: if name — ветвь выполнится, только если строка name не пустая; строка "0" истинна.
  introduced_in: prog1.control.1

- id: loop
  term: цикл
  en: loop
  short: Инструкция, которая повторяет блок строк кода — тело цикла. while повторяет, пока условие истинно; for — для каждого
    элемента последовательности (или другого перебираемого значения).
  example: 'for t in temps: print(t)'
  introduced_in: prog1.control.2

- id: iteration
  term: итерация
  en: iteration
  decode: от латинского iteratio — «повторение»
  short: Одно выполнение тела цикла. Словом «итерации» также называют сам процесс многократного повторения.
  example: Цикл for по списку из пяти элементов делает пять итераций.
  introduced_in: prog1.control.2

- id: off-by-one
  term: ошибка на единицу
  en: off-by-one error
  short: Ошибка на границе, из-за которой цикл или индекс промахивается на один шаг — лишняя или недостающая итерация, лишний
    или пропущенный элемент. Типичные причины — < вместо <= и забытое правило «конец range не включается».
  example: while i < 5 печатает 1–4 вместо 1–5; range(1, 10) не включает 10.
  introduced_in: prog1.control.2

- id: list
  term: список
  en: list
  short: Тип list — упорядоченная последовательность значений (элементов) в квадратных скобках. В отличие от строки, список
    можно изменять — заменять и добавлять элементы.
  example: temps = [12, 15, 9]; temps[0] — 12; temps.append(7) дописывает 7 в конец.
  introduced_in: prog1.control.3

- id: loop-variable
  term: переменная цикла
  en: loop variable
  short: Имя после for. Это обычное имя, которое перед каждой итерацией привязывается к очередному элементу. Присваивание
    ему в теле не меняет перебираемый список.
  example: В for t in [12, 15] имя t указывает сначала на 12, потом на 15.
  introduced_in: prog1.control.4

- id: accumulator
  term: накопитель
  en: accumulator
  short: Имя, которое используется в цикле, чтобы складывать или накапливать результат — сумму, количество, список. Начальное
    значение получает до цикла, обновляется в теле.
  example: total = 0, затем в цикле total += s; после цикла total — сумма всех s.
  introduced_in: prog1.control.5

- id: flag
  term: флаг
  en: flag
  short: Имя с логическим значением, которое отмечает, произошло ли событие, — например, нашёлся ли нужный элемент. До цикла
    получает начальное значение и переключается в цикле только в одну сторону.
  example: found = False до цикла; found = True и break, когда элемент найден.
  introduced_in: prog1.control.5

# ── intro1.history.02-perceptron

- id: layer
  term: слой
  en: layer
  short: Группа нейронов, которые работают параллельно и получают входы от предыдущего слоя. Ответы одного слоя идут на входы
    следующего; последний слой выдаёт ответ всей сети и называется выходным.
  introduced_in: intro1.history.2

- id: hidden-layer
  term: скрытый слой
  en: hidden layer
  short: Слой нейронной сети между входами и выходным слоем. В обучающих примерах его правильных ответов нет — что отвечать
    его нейронам, сеть находит сама.
  introduced_in: intro1.history.2
- id: backprop
  term: метод обратного распространения ошибки
  en: backpropagation, backprop
  short: Способ обучать многослойную сеть. Ошибку на выходе передают назад, слой за слоем, и каждый вес получает поправку
    по своей доле вины.
  introduced_in: intro1.history.4

# ── prog1.functions

- id: function
  term: функция
  en: function
  short: Именованный кусок программы — последовательность инструкций, которая может принимать аргументы и возвращать результат.
    Своя функция определяется инструкцией def, а выполняется при вызове.
  example: "def with_discount(price, percent):\n    return price - price * percent / 100"
  introduced_in: prog1.functions.1

- id: function-parameter
  term: параметр функции
  en: parameter
  short: Имя в скобках определения функции. При вызове оно привязывается к значению соответствующего аргумента — это новое
    имя для того же значения.
  example: В def with_discount(price, percent) параметры — price и percent.
  introduced_in: prog1.functions.1

- id: argument
  term: аргумент
  en: argument
  short: Значение, которое передают функции при вызове. Аргументы вычисляются до того, как начнёт выполняться тело функции.
  example: В with_discount(1200, 15) аргументы — 1200 и 15.
  introduced_in: prog1.functions.1

- id: return-value
  term: возвращаемое значение
  en: return value
  short: Значение, которое функция отдаёт в место вызова инструкцией return. Инструкция return сразу завершает вызов.
  example: После total = with_discount(1200, 15) имя total указывает на возвращаемое значение 1020.0.
  introduced_in: prog1.functions.1

- id: none
  term: None
  en: None
  short: Особое значение «ничего, результата нет», единственное значение типа NoneType. Его возвращает функция без return;
    в условии None ложно. Проверяют через is None.
  example: print("Привет") выводит текст и возвращает None.
  introduced_in: prog1.functions.1

- id: default-value
  term: значение по умолчанию
  en: default argument value
  short: Значение параметра, записанное в определении функции. Если аргумент для этого параметра не передали, параметр привязывается
    к этому значению. Вычисляется один раз, когда выполняется def; такие параметры пишут после остальных.
  example: def with_discount(price, percent=10) — вызов with_discount(1200) считает скидку 10%.
  introduced_in: prog1.functions.1

- id: keyword-argument
  term: именованный аргумент
  en: keyword argument
  short: Аргумент, переданный вместе с именем параметра — имя=значение. Сопоставляется по имени, поэтому порядок именованных
    аргументов неважен. Позиционные аргументы передают по порядку, без имени, и пишут первыми.
  example: print(n, end=" "); with_discount(percent=50, price=1200)
  introduced_in: prog1.functions.1

- id: local-variable
  term: локальная переменная (локальное имя)
  en: local variable
  short: Параметр или имя, которому где-либо в теле функции что-то присваивают (в том числе переменная цикла for), если оно
    не указано в инструкции global. Локально во всём теле, существует только во время вызова и не видно снаружи.
  example: 'В def f(price): cut = price / 10 локальные имена — price и cut.'
  introduced_in: prog1.functions.2

- id: global-variable
  term: глобальная переменная (глобальное имя)
  en: global variable
  short: Имя, заведённое в самой программе, вне функций, в том числе имя функции, созданное def. Функция может его читать;
    присвоить ему изнутри функции можно только после инструкции global — ею пользуются редко и осознанно.
  introduced_in: prog1.functions.2

- id: scope
  term: область видимости
  en: scope
  short: Часть программы, где имя доступно. Имя, которому где-либо в теле функции присваивают, локальное во всём теле и ищется
    только среди локальных; остальные имена Python ищет среди глобальных, потом среди встроенных.
  introduced_in: prog1.functions.2

- id: pure-function
  term: чистая функция
  en: pure function
  short: Функция, которая при одинаковых аргументах всегда возвращает одно и то же и ничего не делает, кроме возврата значения,
    — не печатает, не меняет переданные значения и глобальные имена. Читать имена, которые никто не меняет (функции, константы),
    чистоте не мешает.
  example: 'def tax(price): return price * 0.2'
  introduced_in: prog1.functions.2

- id: side-effect
  term: побочный эффект
  en: side effect
  short: Всё, что вызов функции делает, кроме возврата значения, — вывод на экран, изменение переданного списка, присваивание
    глобальному имени.
  example: print и list.append работают ради побочного эффекта и возвращают None.
  introduced_in: prog1.functions.2

- id: decomposition
  term: декомпозиция
  en: decomposition
  short: Разбиение задачи на самостоятельные части, каждую из которых можно понять, проверить и использовать повторно. В программе
    части — это функции.
  example: «Посчитать чек» → item_price, receipt_sum, apply_discount.
  introduced_in: prog1.functions.3

- id: docstring
  term: строка документации
  en: docstring
  short: 'Текст в тройных кавычках, первая инструкция тела функции. Описывает, что функция делает, принимает и возвращает.
    Её показывает help(), а комментарий # в теле функции — нет.'
  introduced_in: prog1.functions.3

- id: type-hint
  term: аннотация типов (type hints)
  en: type hints, type annotations
  short: 'Подпись ожидаемых типов параметров и результата функции — def f(line: str) -> int. Python при выполнении её не проверяет;
    это подсказка для человека, редактора кода и программ проверки.'
  example: 'def item_price(line: str) -> int:'
  introduced_in: prog1.functions.3

# ── prog1.collections

- id: slice
  term: срез
  en: slice
  short: Новая последовательность из части элементов списка, строки или кортежа — с индекса a до индекса b, не включая b,
    при желании с шагом k. Исходная последовательность не меняется; срез за границей ошибки не даёт.
  example: temps[1:3] — второй и третий элементы; temps[::-1] — список задом наперёд.
  introduced_in: prog1.collections.1

- id: tuple
  term: кортеж
  en: tuple
  short: Тип tuple — неизменяемая последовательность, в которой элементы нельзя заменить, добавить или удалить (но список
    внутри кортежа меняться может). Обычно хранит одну запись из нескольких полей, у каждого свой смысл. Кортеж задаёт запятая,
    а не скобки.
  example: birthday = (12, 4, 2008); кортеж из одного элемента — (5,).
  introduced_in: prog1.collections.1

- id: unpacking
  term: распаковка
  en: unpacking, sequence unpacking
  short: Присваивание нескольким именам сразу — каждое имя слева привязывается к своему элементу последовательности справа.
    Имён должно быть столько же, сколько элементов.
  example: day, month, year = (12, 4, 2008); a, b = b, a меняет местами значения имён a и b.
  introduced_in: prog1.collections.1

- id: alias
  term: псевдоним
  en: alias, aliasing
  short: Одно из нескольких имён, которые указывают на одно и то же значение. Изменение изменяемого значения через один псевдоним
    видно через все.
  example: после backup = marks имена backup и marks — псевдонимы одного списка.
  introduced_in: prog1.collections.2

- id: mutable
  term: изменяемое значение
  en: mutable
  short: Значение, содержимое которого можно поменять на месте, — список, словарь (о множествах — в теме «Множества»). Изменение
    видно через все имена, которые на него указывают.
  example: marks.append(2) меняет сам список marks.
  introduced_in: prog1.collections.2

- id: immutable
  term: неизменяемое значение
  en: immutable
  short: Значение, которое после создания изменить нельзя, — число, строка, кортеж, None. «Изменить» его можно, только собрав
    новое значение и привязав к нему имя. У кортежа нельзя заменить элементы, но изменяемый элемент внутри него (например,
    список) меняться может; кортеж, все элементы которого неизменяемы, не меняется никак.
  example: name += "ик" собирает новую строку, старая остаётся прежней.
  introduced_in: prog1.collections.2

- id: shallow-copy
  term: поверхностная копия
  en: shallow copy
  short: Новый список (или словарь) с теми же самыми элементами. Внешний список новый, но изменяемые элементы внутри — общие
    с оригиналом.
  example: marks.copy(), marks[:], list(marks).
  introduced_in: prog1.collections.2

- id: deep-copy
  term: глубокая копия
  en: deep copy
  short: Копия, в которой скопировано всё, в том числе вложенные списки и словари; ни одного общего изменяемого значения с
    оригиналом у неё нет. Делается функцией copy.deepcopy.
  example: backup = copy.deepcopy(table) — изменения backup[0][0] не затронут table.
  introduced_in: prog1.collections.2

- id: dict
  term: словарь
  en: dictionary, dict
  short: Тип dict — набор пар «ключ — значение», где по ключу быстро находится значение. Ключи уникальны, порядок добавления
    сохраняется; словарь изменяем.
  example: 'prices = {"хлеб": 45, "сыр": 320}; prices["хлеб"] — 45.'
  introduced_in: prog1.collections.3

- id: dict-key
  term: ключ словаря
  en: dictionary key
  short: То, по чему в словаре находят значение. Ключ — хешируемое значение (строка, число, кортеж из них); список ключом
    быть не может. Отсутствующий ключ в d[k] даёт KeyError. Не путать с ключом сортировки.
  example: 'в {"хлеб": 45} ключ — "хлеб", значение — 45.'
  introduced_in: prog1.collections.3

# ── prog1.collections

- id: set
  term: множество
  en: set
  short: Тип set — набор значений без повторов и без порядка. Индексов нет; in проверяет наличие почти мгновенно. Элементы
    — только хешируемые значения.
  example: set(["Аня", "Борис", "Аня"]) — множество из двух имён; пустое множество — set(), а {} — пустой словарь.
  introduced_in: prog1.collections.4

- id: hash
  term: хеш
  en: hash
  short: Число, которое Python вычисляет по значению, чтобы решить, где хранить его в множестве или словаре. У равных значений
    хеш одинаковый, поэтому найти значение можно сразу, без перебора.
  example: hash("сыр") — целое число; у двух равных строк оно одно и то же.
  introduced_in: prog1.collections.4

- id: hashable
  term: хешируемое значение
  en: hashable
  short: Значение, хеш которого не меняется, пока значение существует. Только такие значения бывают элементами множества и
    ключами словаря; среди встроенных это неизменяемые — числа, строки, кортежи из них.
  example: '{(1, 2), "сыр"} работает, а {[1, 2]} даёт TypeError: unhashable type: ''list''.'
  introduced_in: prog1.collections.4

- id: list-comprehension
  term: списковое включение
  en: list comprehension
  short: 'Короткая запись шаблона «пустой список, цикл, append» — [выражение for x in data if условие]. Результат — новый
    список; так же записывают включения словаря {k: v for …} и множества {x for …}.'
  example: '[int(p) for p in "89 45".split()] даёт [89, 45]; [t for t in temps if t < 0] — только морозные дни.'
  introduced_in: prog1.collections.5

- id: generator-expression
  term: генераторное выражение
  en: generator expression
  short: Включение без квадратных скобок — например, единственный аргумент sum, any или all. Не собирает список, а выдаёт
    значения по одному, по мере перебора; перебрать его можно только один раз.
  example: any(s == 0 for s in sales) — есть ли день с нулевой выручкой.
  introduced_in: prog1.collections.5

- id: higher-order-function
  term: функция высшего порядка
  en: higher-order function
  short: Функция, которая принимает другую функцию как аргумент или возвращает функцию. Функцию передают по имени, без скобок.
  example: sorted(words, key=len) — sorted получает функцию len и сама вызывает её для каждого слова.
  introduced_in: prog1.collections.6

- id: lambda
  term: lambda-выражение
  en: lambda, lambda expression
  short: 'Короткая запись функции без имени — lambda параметры: выражение. Тело — одно выражение, его значение возвращается
    без return. Удобна как аргумент; если функции нужно имя — def.'
  example: 'lambda p: p["score"] — функция, которая возвращает очки игрока.'
  introduced_in: prog1.collections.6

- id: sort-key
  term: ключ сортировки
  en: sort key, key function
  short: Значение, по которому сортировка сравнивает элемент. Его вычисляет функция из аргумента key — один раз для каждого
    элемента; в результат попадают сами элементы, не ключи. Не путать с ключом словаря.
  example: 'sorted(words, key=len) — ключ каждого слова его длина; key=lambda p: (-p["score"], p["name"]) — по очкам, затем
    по имени.'
  introduced_in: prog1.collections.6

- id: stable-sort
  term: устойчивая сортировка
  en: stable sort
  short: Сортировка, при которой элементы с равными ключами сохраняют исходный порядок. Сортировка в Python (sorted и sort)
    устойчива, в том числе с reverse=True.
  example: sorted(["чай", "сыр", "молоко"], key=len) — слово «чай» остаётся перед словом «сыр».
  introduced_in: prog1.collections.6

# ── prog1.errors

- id: exception-handling
  term: обработка исключений
  en: exception handling
  short: Запасной план на случай ошибки во время работы программы. Код, который может упасть, кладут в блок try, а что делать
    при исключении определённого типа — в блок except; остальные исключения идут дальше.
  example: "try:\n    n = int(text)\nexcept ValueError:\n    print(\"Нужно число\")"
  introduced_in: prog1.errors.1

- id: raise
  term: raise
  en: raise statement
  short: Инструкция, которая выбрасывает исключение. Функция прерывается в этом месте, а исключение идёт к тому, кто её вызвал.
    Так функция сообщает о неверных данных.
  example: raise ValueError("возраст должен быть от 0 до 150, а не 200")
  introduced_in: prog1.errors.1

- id: call-stack
  term: стек вызовов
  en: call stack
  short: Вызовы функций, которые начались, но ещё не закончились, в порядке «кто кого вызвал». Traceback — «трассировка стека»
    — перечисляет их от основной программы до вызова, где возникло исключение; последний вызов внизу.
  example: программа → report() → average() — три пары «файл — номер строки» в traceback.
  introduced_in: prog1.errors.2

- id: bug
  term: баг
  en: bug
  decode: от англ. bug — «жучок»; так инженеры называли неполадки в технике задолго до компьютеров
  short: Ошибка в программе, из-за которой она падает или выдаёт неверный результат.
  example: range(1, len(temps)) пропускает первый элемент списка.
  introduced_in: prog1.errors.2

- id: debugging
  term: отладка
  en: debugging
  short: Поиск и исправление ошибок в программе. Идёт по плану — воспроизвести ошибку, предположить причину, проверить предположение
    (print, assert, маленький вход), исправить и запустить снова.
  introduced_in: prog1.errors.2

- id: assert
  term: assert
  en: assert statement
  decode: англ. assert — «утверждать»
  short: Инструкция-проверка своего кода. Если условие истинно, ничего не происходит; если ложно — выбрасывается AssertionError
    с сообщением, написанным после запятой. Ключ запуска -O (python -O) отключает все assert.
  example: assert ticket_price(7) == 250, "семилетний платит 250"
  introduced_in: prog1.errors.2

- id: edge-case
  term: граничный случай
  en: edge case
  short: Вход на краю допустимого или на стыке групп входов, где функция меняет поведение, — ноль, пустой список, один элемент,
    значения по обе стороны порога, повторяющиеся значения. На них чаще всего и проявляются ошибки на единицу.
  example: для «с 7 до 17 лет — 250 рублей» граничные случаи — 6, 7, 17 и 18.
  introduced_in: prog1.errors.3

# ── prog1.text_files

- id: whitespace
  term: пробельные символы
  en: whitespace
  short: Символы, которые видны как пустое место, — пробел, табуляция \t, перевод строки \n, возврат каретки \r и несколько
    редких, например неразрывный пробел. split() без аргумента режет по любой их цепочке, strip() без аргумента убирает их
    с краёв.
  example: '"a \t b\n".split() даёт [''a'', ''b'']'
  introduced_in: prog1.text_files.1

- id: format-spec
  term: спецификация формата
  en: format specification
  short: Запись после двоеточия в фигурных скобках f-строки, которая задаёт вид значения — выравнивание (< > ^), ширину, разделитель
    тысяч, точность и тип (f, %, d). Меняет только вывод, не само значение.
  example: f"{1234.5:>10,.1f}" даёт "   1,234.5"
  introduced_in: prog1.text_files.1

- id: regex
  term: регулярное выражение
  en: regular expression (regex)
  short: 'Шаблон, описывающий форму текста: например, \d+ — «одна или больше цифр». В Python с ним работает модуль re — search,
    fullmatch, findall, sub.'
  example: re.findall(r"\d+", "3 шт. по 120 руб.") даёт ['3', '120']
  introduced_in: prog1.text_files.2

- id: raw-string
  term: сырая строка
  en: raw string
  short: Строка с буквой r перед кавычками, в которой обратная косая черта — обычный символ, а не начало особого сочетания.
    Так пишут шаблоны регулярных выражений; для путей Windows тоже годится, но сырая строка не может кончаться одиночной обратной
    чертой.
  example: len(r"\n") — 2, а len("\n") — 1
  introduced_in: prog1.text_files.2

- id: quantifier
  term: квантификатор
  en: quantifier
  short: Знак в регулярном выражении после символа или класса, задающий число повторений — + (один или больше), * (ноль или
    больше), ? (ноль или один), {n,m}. + и * жадные — захватывают как можно больше; +? и *? — как можно меньше.
  example: \d{6} — ровно шесть цифр
  introduced_in: prog1.text_files.2

- id: regex-group
  term: группа (в регулярном выражении)
  en: capturing group
  short: Часть шаблона в круглых скобках; её текст достают через group(n), а в строке замены sub — через \1, \2 и так далее.
    Группы нумеруются с 1 по открывающим скобкам.
  example: re.sub(r"(\d{4})-(\d{2})-(\d{2})", r"\3.\2.\1", "2024-05-17") даёт "17.05.2024"
  introduced_in: prog1.text_files.2

- id: file-object
  term: файловый объект
  en: file object
  short: Значение, которое возвращает open() и через которое программа читает и пишет файл — read(), write(), перебор строк
    файла в for. Открывают через with, чтобы файл закрылся сам.
  example: with open("marks.txt", encoding="utf-8") as f — здесь f файловый объект
  introduced_in: prog1.text_files.3

- id: code-point
  term: кодовая точка
  en: code point
  short: Номер символа в таблице Юникода — целое число от 0 до 1 114 111. Строка Python — последовательность кодовых точек;
    ord даёт номер символа, chr — символ по номеру.
  example: ord("я") — 1103, ord("ё") — 1105
  introduced_in: prog1.text_files.3

- id: encoding
  term: кодировка
  en: character encoding
  short: Правило перевода символов в байты и обратно. Файл читается верно, только если указана та кодировка, в которой его
    записали; иначе — кракозябры или UnicodeDecodeError.
  example: open("data.txt", encoding="utf-8")
  introduced_in: prog1.text_files.3

- id: utf-8
  term: UTF-8
  en: UTF-8
  decode: Unicode Transformation Format, 8-bit
  short: Самая распространённая кодировка Юникода; символ занимает от 1 до 4 байтов — латиница и цифры по 1 байту, кириллица
    по 2.
  example: len("привет".encode("utf-8")) — 12
  introduced_in: prog1.text_files.3

- id: csv
  term: CSV
  en: CSV
  decode: Comma-Separated Values — «значения, разделённые запятыми»
  short: Таблица обычным текстом — строка файла — это запись, поля через разделитель; поле с разделителем или кавычкой берут
    в кавычки (RFC 4180). Все поля читаются как строки. Разбирают модулем csv, а не split.
  example: город,магазин,сумма / Казань,"Ромашка, ИП",1200
  introduced_in: prog1.text_files.4

- id: json
  term: JSON
  en: JSON
  decode: JavaScript Object Notation — «запись объектов JavaScript»
  short: Текстовый формат обмена данными — объекты (в Python dict), массивы (list), строки в двойных кавычках, числа, true/false,
    null (None). Ключи объектов — только строки. Модуль json — loads/dumps, load/dump.
  example: '{"id": 17, "paid": true, "coupon": null}'
  introduced_in: prog1.text_files.4

- id: serialization
  term: сериализация
  en: serialization
  short: Перевод значения программы в текст или байты, чтобы сохранить его в файл или передать другой программе; обратный
    перевод — десериализация.
  example: 'json.dumps({"a": 1}) даёт строку {"a": 1}'
  introduced_in: prog1.text_files.4

- id: datetime
  term: date и datetime
  en: date, datetime
  short: Типы модуля datetime — date (год, месяц, день) и datetime (дата и время). Сравниваются по времени, знают календарь
    и високосные годы; разность двух значений — timedelta.
  example: date(2024, 5, 17).weekday() — 4 (пятница; понедельник — 0)
  introduced_in: prog1.text_files.5

- id: timedelta
  term: timedelta
  en: timedelta
  short: Тип промежутка времени — разность двух дат или моментов; его можно прибавить к дате. Хранит сутки, секунды и микросекунды;
    месяцев и лет в нём нет.
  example: date(2024, 2, 28) + timedelta(days=1) — 2024-02-29
  introduced_in: prog1.text_files.5

- id: iso-8601
  term: ISO 8601
  en: ISO 8601
  short: Международный стандарт записи даты и времени — от старшей единицы к младшей, ГГГГ-ММ-ДДTчч:мм:сс, смещение от UTC
    в конце (+03:00 или Z). Если все записи одного вида и с одним смещением, они сортируются верно даже как обычные строки.
  example: '2024-05-17T14:30:00+03:00'
  introduced_in: prog1.text_files.5

- id: utc
  term: UTC
  en: UTC
  decode: Coordinated Universal Time — всемирное координированное время
  short: Шкала времени, от которой отсчитывают часовые пояса (Москва — UTC+3). Моменты принято хранить и сравнивать в UTC,
    а в местное время переводить для показа.
  example: datetime.now(timezone.utc)
  introduced_in: prog1.text_files.5

- id: naive-datetime
  term: наивное время
  en: naive datetime
  short: Значение даты и времени без часового пояса (tzinfo — None). Что оно означает — местное время, UTC или другой пояс,
    — решает программа. С осведомлённым его нельзя сравнивать через < и вычитать — TypeError.
  example: datetime(2024, 5, 17, 14, 30)
  introduced_in: prog1.text_files.5

- id: aware-datetime
  term: осведомлённое время
  en: aware datetime
  short: Значение даты и времени с часовым поясом — знает смещение от UTC и поэтому обозначает один точный момент.
  example: datetime(2024, 5, 17, 14, 30, tzinfo=timezone(timedelta(hours=3)))
  introduced_in: prog1.text_files.5

# ── prog1.modules

- id: namespace
  term: пространство имён
  en: namespace
  short: Набор имён, каждое из которых связано со своим значением. У каждого модуля своё пространство глобальных имён, у каждого
    вызова функции — локальных, поэтому total в программе и shop.total не мешают друг другу.
  example: shop.total — имя total из пространства имён модуля shop.
  introduced_in: prog1.modules.1

- id: script
  term: скрипт
  en: script
  short: Файл с кодом на Python, который запускают как программу. У запущенного файла __name__ равно "__main__", у импортированного
    — имя модуля; код под if __name__ == "__main__" выполняется только при запуске.
  example: python temperature.py — temperature.py работает как скрипт; import temperature — как модуль.
  introduced_in: prog1.modules.1

- id: standard-library
  term: стандартная библиотека
  en: standard library
  short: Модули, которые поставляются вместе с Python и подключаются через import без установки — math, random, collections,
    csv, json, datetime, os и сотни других.
  example: from collections import Counter — Counter из стандартной библиотеки.
  introduced_in: prog1.modules.2

- id: pseudo-random
  term: псевдослучайные числа
  en: pseudo-random numbers
  short: Числа, которые выглядят случайными, но вычисляются формулой из внутреннего состояния генератора. При одинаковом начальном
    состоянии последовательность повторяется.
  example: модуль random даёт псевдослучайные числа; для паролей нужен модуль secrets.
  introduced_in: prog1.modules.2

- id: random-seed
  term: seed (сид)
  en: random seed
  synonyms:
  - сид
  - начальное значение генератора
  short: Число, которое задаёт начальное состояние генератора псевдослучайных чисел. Одинаковый seed — одинаковая последовательность,
    поэтому результаты можно повторить в проверках и опытах.
  example: после random.seed(42) три вызова random.randint(1, 6) всегда дают 6 1 1.
  introduced_in: prog1.modules.2

- id: environment-variable
  term: переменная окружения
  en: environment variable
  short: Именованная строка-настройка, которую программа получает от операционной системы при запуске. Через переменные окружения
    передают ключи доступа, адреса и режимы, чтобы не писать их в код.
  example: int(os.environ.get("SHOP_DISCOUNT", "0")) — скидка из окружения или 0.
  introduced_in: prog1.modules.2

- id: package
  term: пакет (дистрибутив)
  en: package (distribution package)
  short: Чужой код, упакованный для установки, — модули, номер версии и список зависимостей. Устанавливают командой pip install,
    после чего его модули подключаются через import.
  example: пакет scikit-learn устанавливают как scikit-learn, а подключают через import sklearn.
  introduced_in: prog1.modules.3

- id: pypi
  term: PyPI
  en: PyPI (Python Package Index)
  decode: Python Package Index — «каталог пакетов Python»
  short: Общий сайт pypi.org, куда авторы выкладывают пакеты Python и откуда их скачивает pip. Выложить пакет может любой,
    поэтому имя и автора проверяют перед установкой.
  example: python -m pip install requests скачивает requests с PyPI.
  introduced_in: prog1.modules.3

- id: pip
  term: pip
  en: pip
  short: Программа, которая устанавливает пакеты с PyPI вместе с их зависимостями в папку того Python, который её запустил.
  example: python -m pip install requests==2.32.3
  introduced_in: prog1.modules.3

- id: dependency
  term: зависимость
  en: dependency
  short: Пакет, без которого другой пакет или проект не работает. pip ставит зависимости сам; в файле зависимостей (requirements.txt)
    их перечисляют с версиями.
  example: requests зависит от urllib3, idna, certifi и charset-normalizer.
  introduced_in: prog1.modules.3

- id: virtual-environment
  term: виртуальное окружение
  en: virtual environment (venv)
  short: Отдельная папка проекта со своими пакетами; Python в ней не новый — окружение опирается на уже установленный. Пакеты
    разных окружений не мешают друг другу, поэтому у каждого проекта могут быть свои версии. Папку окружения другим не передают.
  example: python -m venv .venv создаёт окружение в папке .venv.
  introduced_in: prog1.modules.3

# ── infra1.machine

- id: cpu
  term: процессор (CPU)
  en: central processing unit, CPU
  decode: CPU — central processing unit, «центральное обрабатывающее устройство»
  short: Устройство, которое выполняет программы машинными инструкциями — по циклу «взять инструкцию из памяти, выполнить,
    перейти к следующей».
  introduced_in: infra1.machine.1

- id: cpu-core
  term: ядро процессора
  en: CPU core
  short: Самостоятельный исполнитель инструкций внутри процессора, со своими регистрами. Восемь ядер могут одновременно выполнять
    восемь последовательностей инструкций.
  introduced_in: infra1.machine.1

- id: ram
  term: оперативная память (ОЗУ, RAM)
  en: random access memory, RAM; main memory
  decode: ОЗУ — оперативное запоминающее устройство; RAM — random access memory, «память с произвольным доступом»
  short: Память, где находятся выполняемые программы и их данные. Быстрая, но стирается при выключении; место на диске её
    не увеличивает.
  example: Таблица на 20 ГБ не загрузится целиком в 16 ГБ памяти, сколько бы ни было места на диске.
  introduced_in: infra1.machine.1

- id: storage
  term: диск (накопитель)
  en: storage, disk (SSD, HDD)
  short: Устройство, которое хранит файлы, в том числе после выключения. Медленнее памяти — при одном обращении в тысячи раз
    и больше, при чтении подряд в разы.
  introduced_in: infra1.machine.1

- id: cache
  term: кэш
  en: cache
  short: Маленькая быстрая память в процессоре с копиями недавно использованных данных. В широком смысле — любая копия данных,
    сохранённая там, откуда их быстрее взять.
  introduced_in: infra1.machine.1

- id: operating-system
  term: операционная система (ОС)
  en: operating system, OS
  short: Программа, которая распоряжается процессором, памятью, файлами и устройствами и служит посредником между ними и остальными
    программами.
  example: Windows, Linux, macOS, Android; open и os.environ в Python работают через ОС.
  introduced_in: infra1.machine.1

- id: process
  term: процесс
  en: process
  short: Запущенная программа со своей памятью, открытыми файлами, окружением и номером PID. Одну программу можно запустить
    несколькими процессами.
  example: os.getpid() — номер своего процесса.
  introduced_in: infra1.machine.2

- id: thread
  term: поток
  en: thread
  short: Последовательность выполнения внутри процесса. Потоки одного процесса работают с общей памятью.
  introduced_in: infra1.machine.2

- id: context-switch
  term: переключение контекста
  en: context switch
  short: Замена потока на ядре — ОС сохраняет регистры остановленного потока и восстанавливает регистры следующего.
  introduced_in: infra1.machine.2

- id: scheduler
  term: планировщик
  en: scheduler
  short: Часть ОС, которая решает, какой поток получит ядро процессора следующим и на какой отрезок времени.
  introduced_in: infra1.machine.2

- id: bit
  term: бит
  en: bit
  decode: от binary digit — «двоичная цифра»
  short: Наименьшая единица информации — одно из двух значений, 0 или 1. n битов дают 2ⁿ значений.
  introduced_in: infra1.machine.3

- id: byte
  term: байт
  en: byte
  short: 8 битов — наименьшая порция данных со своим номером (адресом) в памяти; 256 значений, от 0 до 255.
  introduced_in: infra1.machine.3

- id: binary
  term: двоичная система
  en: binary
  short: Позиционная запись чисел с основанием 2 и цифрами 0 и 1; веса мест — 1, 2, 4, 8…
  example: 0b1011 == 11; bin(11) — строка '0b1011'
  introduced_in: infra1.machine.3

- id: hexadecimal
  term: шестнадцатеричная система (hex)
  en: hexadecimal, hex
  short: Запись чисел с основанием 16 и цифрами 0–9, A–F. Одна hex-цифра — 4 бита, байт — две hex-цифры.
  example: 0xC8 == 200; цвет
  introduced_in: infra1.machine.3

- id: bytes
  term: bytes
  en: bytes
  short: Тип Python — неизменяемая последовательность байтов, чисел от 0 до 255. Элемент bytes — число, а не символ.
  example: b"Hi"[0] — 72
  introduced_in: infra1.machine.3

- id: kibibyte
  term: кибибайт (КиБ)
  en: kibibyte, KiB
  short: 1024 байта. Килобайт по стандарту — 1000 байт; Windows пишет «ГБ», а считает гибибайты.
  example: Диск 1 ТБ = 10¹² байт ≈ 931 ГиБ.
  introduced_in: infra1.machine.3

- id: ascii
  term: ASCII
  en: ASCII
  decode: American Standard Code for Information Interchange — «американский стандартный код для обмена информацией»
  short: Таблица 1960-х на 128 символов (7 битов) — латиница, цифры, знаки и управляющие символы. Первая половина почти всех
    кодировок.
  introduced_in: infra1.machine.4

- id: code-page
  term: кодовая страница
  en: code page
  short: Однобайтовая кодировка — ASCII плюс свой алфавит в номерах 128–255. Один и тот же байт в разных страницах — разные
    буквы.
  example: cp1251, cp866, KOI8-R
  introduced_in: infra1.machine.4

- id: unicode
  term: Юникод
  en: Unicode
  short: Набор символов всех письменностей, где у каждого символа свой номер — кодовая точка U+…. Байты задаёт кодировка Юникода,
    например UTF-8.
  example: «я» — U+044F
  introduced_in: infra1.machine.4

- id: mojibake
  term: кракозябры
  en: mojibake
  short: Текст, прочитанный не той кодировкой, в которой записан. Байты целы, поэтому текст можно вернуть обратным путём.
  example: '"РїСЂРёРІРµС‚".encode("cp1251").decode("utf-8") — «привет»'
  introduced_in: infra1.machine.4

- id: bom
  term: BOM
  en: byte order mark, BOM
  decode: byte order mark — «метка порядка байтов»
  short: Символ U+FEFF в начале файла; в UTF-8 — байты EF BB BF. Его ставит, например, Excel; читают с encoding="utf-8-sig".
  introduced_in: infra1.machine.4

- id: line-ending
  term: конец строки (CRLF, LF)
  en: line ending, newline (CRLF, LF)
  short: Как в файле отмечен конец строки текста. Программы Windows обычно пишут два байта \r\n (CRLF), Linux и macOS — один
    \n (LF).
  introduced_in: infra1.machine.4

# ── infra1.shell

- id: terminal
  term: терминал
  en: terminal, terminal emulator
  short: Окно, которое показывает текст и передаёт нажатые клавиши программе внутри него. Команд сам не понимает — их читает
    оболочка.
  example: Windows Terminal, приложение «Терминал» в Ubuntu.
  introduced_in: infra1.shell.1

- id: shell
  term: оболочка
  en: shell
  short: Интерпретатор команд — программа, которая читает набранную строку, делит её на имя команды и аргументы и запускает
    нужную программу. В Linux обычно bash.
  example: bash, PowerShell, zsh.
  introduced_in: infra1.shell.1

- id: prompt
  term: приглашение
  en: prompt, shell prompt
  short: Текст перед курсором, которым оболочка показывает, что готова принять команду; обычно в нём пользователь, компьютер
    и текущая папка.
  example: student@forge:~$
  introduced_in: infra1.shell.1

- id: command-argument
  term: аргумент команды
  en: command-line argument
  short: Слово командной строки после имени команды. Оболочка делит строку по пробелам и передаёт программе аргументы как
    строки.
  example: В ls -l reports аргументы — -l и reports.
  introduced_in: infra1.shell.1

- id: command-option
  term: флаг (ключ, опция)
  en: option, flag
  short: Аргумент команды, начинающийся с минуса, который меняет её поведение. Короткие флаги можно склеивать, у многих есть
    длинная форма с двумя минусами.
  example: ls -la — то же, что ls -l -a; ls --all — то же, что ls -a.
  introduced_in: infra1.shell.1

- id: home-directory
  term: домашняя папка
  en: home directory
  short: Личная папка пользователя, /home/имя в Linux; оболочка понимает ~ как её путь.
  example: cd ~ и cd без аргументов ведут в /home/student.
  introduced_in: infra1.shell.1

- id: path
  term: путь
  en: path, pathname
  short: Строка, указывающая на файл или папку в дереве файловой системы, — имена, разделённые символом /.
  example: /home/student/reports/2026-05.csv
  introduced_in: infra1.shell.1

- id: absolute-path
  term: абсолютный путь
  en: absolute path
  short: Путь, который начинается с / и читается от корня файловой системы; указывает на одно и то же место, откуда бы его
    ни использовали.
  example: /etc/hosts
  introduced_in: infra1.shell.1

- id: relative-path
  term: относительный путь
  en: relative path
  short: Путь, который не начинается с / и отсчитывается от текущей папки процесса; . — сама эта папка, .. — папка выше.
  example: Из /home/student путь ../anna ведёт в /home/anna.
  introduced_in: infra1.shell.1

- id: working-directory
  term: текущая папка
  en: working directory, current directory
  short: Папка, связанная с процессом, от которой отсчитываются относительные пути. У каждого процесса своя; запущенная программа
    получает её от оболочки. Показывает pwd, меняет cd.
  example: open("marks.txt") ищет файл в текущей папке, а не рядом с .py.
  introduced_in: infra1.shell.1

- id: hidden-file
  term: скрытый файл
  en: hidden file, dotfile
  short: Файл или папка, чьё имя начинается с точки. ls без -a их не показывает, шаблон * их не выбирает; так обычно хранят
    настройки.
  example: .bashrc, .gitignore, .env
  introduced_in: infra1.shell.1

- id: glob
  term: шаблон имён файлов
  en: glob, wildcard
  short: Слово с * (любые символы), ? (один символ), которое оболочка до запуска команды заменяет списком подходящих имён
    по алфавиту. Без совпадений шаблон остаётся как есть.
  example: rm *.csv — rm получает уже готовый список CSV-файлов.
  introduced_in: infra1.shell.1

- id: quoting
  term: кавычки в оболочке
  en: quoting
  short: Способ передать слово команде как есть. Двойные кавычки собирают его в один аргумент и отключают шаблоны, но оставляют
    $; одинарные отключают всё; \ отключает особый смысл одного символа.
  example: cat "отчёт за май.txt" — один аргумент, а не три.
  introduced_in: infra1.shell.1

- id: text-editor
  term: текстовый редактор
  en: text editor
  short: Программа, которая меняет содержимое текстового файла и сохраняет ровно набранные символы, без оформления. В терминале
    — nano, vim.
  example: nano config.ini
  introduced_in: infra1.shell.2

- id: standard-stream
  term: стандартные потоки
  en: standard streams (stdin, stdout, stderr)
  short: Три потока данных, которые процесс получает при запуске — ввод (stdin, 0), вывод (stdout, 1) и поток ошибок (stderr,
    2). В терминале все подключены к клавиатуре и экрану. Не путать с потоком выполнения (thread).
  example: print пишет в stdout, трассировка Python — в stderr.
  introduced_in: infra1.shell.3

- id: redirection
  term: перенаправление
  en: redirection
  short: Подключение стандартного потока команды к файлу вместо терминала; его готовит оболочка до запуска команды. > сначала
    очищает файл, >> дописывает, < читает из файла, 2> — ошибки.
  example: python -m pip freeze > requirements.txt
  introduced_in: infra1.shell.3

- id: pipeline
  term: конвейер
  en: pipeline, pipe
  short: Цепочка команд через |, где stdout каждой подключён к stdin следующей. Команды работают одновременно, каждая своим
    процессом; ошибки в трубу не попадают.
  example: grep ERROR app.log | wc -l
  introduced_in: infra1.shell.3

- id: filter
  term: фильтр
  en: filter
  short: Команда, которая читает текст (из файла или stdin), преобразует его и печатает текст в stdout; поэтому её можно ставить
    в конвейер.
  example: grep, sort, uniq, wc, head, tail
  introduced_in: infra1.shell.3

# ── infra1.shell

- id: user-group
  term: группа
  en: group
  short: Именованный набор пользователей Linux. Через группу файл открывают сразу нескольким людям; у каждого пользователя
    есть основная группа и, возможно, дополнительные.
  example: id → groups=1000(student),27(sudo)
  introduced_in: infra1.shell.4

- id: file-permissions
  term: права доступа
  en: file permissions
  short: Девять битов rwx у файла или папки — чтение, запись, выполнение отдельно для владельца, группы и остальных. Процесс
    получает ровно одну тройку — первого подходящего класса.
  example: -rw-r----- (640) — владелец читает и меняет, группа читает, остальным нельзя
  introduced_in: infra1.shell.4

- id: file-owner
  term: владелец файла
  en: file owner
  short: Пользователь, которому принадлежит файл; к нему применяется первая тройка прав, и только он (или root) меняет права
    файла. Сменить владельца может только root — командой chown.
  example: sudo chown anna notes.txt
  introduced_in: infra1.shell.4

- id: root-user
  term: суперпользователь
  en: root, superuser
  synonyms:
  - root
  - рут
  short: Администратор Linux с номером пользователя 0, для которого проверки прав доступа к файлам не действуют.
  introduced_in: infra1.shell.4

- id: sudo
  term: sudo
  en: sudo (substitute user do)
  short: Команда, которая выполняет одну команду от имени root (или другого пользователя), если это разрешено. Спрашивает
    пароль того, кто её вызвал, а не root.
  example: echo port=8080 | sudo tee /etc/app.conf
  introduced_in: infra1.shell.4

- id: signal
  term: сигнал
  en: signal
  short: Уведомление процесса о событии, которое доставляет ОС. Процесс может обработать или игнорировать сигнал — кроме SIGKILL
    и SIGSTOP.
  example: Ctrl+C — SIGINT, kill PID — SIGTERM, kill -9 PID — SIGKILL
  introduced_in: infra1.shell.5

- id: background-job
  term: фоновое задание
  en: background job
  short: Команда, запущенная из оболочки со знаком & в конце, — оболочка не ждёт её окончания. Задания окна показывает jobs,
    возвращает на передний план fg.
  example: sleep 300 & → [1] 4100
  introduced_in: infra1.shell.5

- id: exit-status
  term: код возврата
  en: exit status, exit code
  short: Число 0–255, которым процесс при завершении сообщает родителю итог. 0 — успех, остальное — неудача; смерть от сигнала
    N даёт 128 + N. В bash код последней команды — $?.
  example: ls nope.txt; echo $? → 2
  introduced_in: infra1.shell.5

- id: shell-variable
  term: переменная оболочки
  en: shell variable
  short: Переменная, которая живёт только внутри процесса bash. Запущенные программы её не видят, пока она не помечена export
    и не стала переменной окружения.
  example: MODE=test (оболочка видит), export MODE (видят и дочерние процессы)
  introduced_in: infra1.shell.6

- id: path-variable
  term: PATH
  en: PATH
  short: Переменная окружения со списком папок через двоеточие. Команду без косой черты в имени оболочка ищет в этих папках
    слева направо и запускает первую находку.
  example: export PATH="$HOME/tools/bin:$PATH"
  introduced_in: infra1.shell.6

- id: bashrc
  term: ~/.bashrc
  en: .bashrc
  short: Скрытый файл в домашней папке, который bash выполняет при старте каждого окна терминала. Туда записывают постоянные
    настройки — export и сокращения команд.
  example: source ~/.bashrc — применить правку в уже открытом окне
  introduced_in: infra1.shell.6
