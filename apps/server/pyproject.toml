[project]
name = "forge-server"
version = "0.1.0"
description = "Forge ML platform server: progress, attempts, notes, course feedback, Claude status"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
