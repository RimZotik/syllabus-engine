# Глоссарий курса. Поля: id, term, en (английский термин), decode (расшифровка/происхождение), short (1–2 предложения своими словами),
# example (необязательно), introduced_in (id темы, где термин введён). Правила — docs/content/style-guide.md, разделы 4 и 8.

- id: program
  term: программа
  en: program
  decode: от греч. prógramma — «объявление, предписание»
  short: Набор точных инструкций, который компьютер выполняет шаг за шагом.
  introduced_in: intro1.what.1

- id: algorithm
  term: алгоритм
  en: algorithm
  decode: от имени математика аль-Хорезми (IX век)
  short: Конечная последовательность понятных шагов, которая из входных данных получает результат. Рецепт — тоже алгоритм.
  example: «Если сумма покупки больше 5000 ₽ — скидка 10 %, иначе — без скидки».
  introduced_in: intro1.what.1

- id: ai
  term: искусственный интеллект
  en: artificial intelligence, AI
  decode: термин придумал Джон Маккарти в 1955 году
  short: Широкая область, которая учит компьютеры решать задачи, обычно требующие человеческого ума. Машинное обучение — самый успешный её способ сегодня.
  introduced_in: intro1.what.1

- id: ml
  term: машинное обучение
  en: machine learning, ML
  decode: выражение ввёл Артур Самуэль в 1959 году
  short: Способ создавать программы, которые находят закономерности в примерах сами, а не следуют правилам, написанным человеком.
  introduced_in: intro1.what.1

- id: data
  term: данные
  en: data
  decode: от лат. datum — «данное»
  short: Записанные факты о мире — числа, тексты, картинки, клики. Сырьё, из которого машинное обучение извлекает закономерности.
  introduced_in: intro1.what.2

- id: dataset
  term: датасет
  en: dataset, «набор данных»
  short: Набор примеров, собранных для одной задачи. Часто — таблица, где строка — объект, а столбцы — его признаки и ответ.
  introduced_in: intro1.what.2

- id: feature
  term: признак
  en: feature
  short: Одна измеримая характеристика объекта — площадь квартиры, возраст клиента, число слов в письме.
  introduced_in: intro1.what.2

- id: target
  term: целевая переменная
  en: target, label («метка»)
  short: То, что модель должна предсказать — цена, «спам или нет», диагноз. В обучающих примерах ответ известен.
  introduced_in: intro1.what.2

- id: model
  term: модель
  en: model
  short: Функция с настраиваемыми параметрами, которая по признакам объекта выдаёт предсказание.
  example: цена = a × площадь + b, где a и b — параметры.
  introduced_in: intro1.what.2

- id: parameter
  term: параметр модели
  en: parameter, weight («вес»)
  short: Число внутри модели, которое подбирается при обучении. У простой модели их два, у больших языковых моделей — сотни миллиардов.
  introduced_in: intro1.what.2

- id: training
  term: обучение
  en: training
  short: Подбор параметров модели так, чтобы её ошибки на известных примерах стали как можно меньше.
  introduced_in: intro1.what.2

- id: loss
  term: функция потерь
  en: loss function
  short: Число, которое показывает, насколько предсказание модели на одном объекте расходится с правильным ответом. Среднее потерь по обучающей выборке называют эмпирическим риском — его и уменьшает обучение.
  introduced_in: intro1.what.2

- id: prediction
  term: предсказание
  en: prediction, inference («вывод»)
  short: Ответ, который обученная модель выдаёт для нового объекта, ответ для которого заранее неизвестен.
  introduced_in: intro1.what.2

- id: generalization
  term: обобщение
  en: generalization
  short: Способность модели правильно отвечать на новых примерах, которых она не видела при обучении. Ради этого всё и делается.
  introduced_in: intro1.what.2

- id: overfitting
  term: переобучение
  en: overfitting
  short: Модель «зазубрила» обучающие примеры вместе со случайным шумом и плохо работает на новых данных.
  introduced_in: intro1.what.2

- id: classification
  term: классификация
  en: classification
  short: Задача выбрать для объекта один из заранее известных классов — «спам / не спам», «кошка / собака / птица».
  introduced_in: intro1.what.3

- id: regression
  term: регрессия
  en: regression
  decode: от лат. regressio — «возвращение»; название историческое, от работ Фрэнсиса Гальтона
  short: Задача предсказать число — цену, температуру, время доставки.
  introduced_in: intro1.what.3

- id: clustering
  term: кластеризация
  en: clustering, от cluster — «гроздь»
  short: Задача разбить объекты на группы похожих, когда правильных групп заранее никто не знает.
  introduced_in: intro1.what.3

- id: recommender
  term: рекомендательная система
  en: recommender system
  short: Система, которая для каждого пользователя подбирает и упорядочивает то, что ему, вероятно, понравится.
  introduced_in: intro1.what.3

- id: supervised
  term: обучение с учителем
  en: supervised learning
  short: Обучение на примерах, где для каждого объекта известен правильный ответ.
  introduced_in: intro1.what.3

- id: unsupervised
  term: обучение без учителя
  en: unsupervised learning
  short: Поиск структуры в данных без правильных ответов — например, группировка похожих объектов.
  introduced_in: intro1.what.3

- id: reinforcement
  term: обучение с подкреплением
  en: reinforcement learning
  short: Обучение через пробы и ошибки — агент действует, получает награду или штраф и постепенно учится действовать лучше.
  introduced_in: intro1.what.3

- id: generative
  term: генеративная модель
  en: generative model
  short: Модель, которая создаёт новые данные — текст, картинки, звук — похожие на те, на которых она училась.
  introduced_in: intro1.what.3

- id: knn
  term: метод k ближайших соседей
  en: k nearest neighbours, kNN
  short: Чтобы предсказать класс нового объекта, смотрим на k самых похожих известных примеров и выбираем самый частый у них класс.
  introduced_in: intro1.what.4

- id: hyperparameter
  term: гиперпараметр
  en: hyperparameter
  short: Настройка модели, которую выбирает человек до обучения (например, число соседей k). Параметры подбирает обучение, гиперпараметры — мы.
  introduced_in: intro1.what.4
