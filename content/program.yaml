# Учебный план Forge ML — единственный источник правды о структуре обучения.
#
# Иерархия: Курс → Дисциплина → Раздел → Тема.
#   Предмет (subject) — сквозная линия обучения (Программирование, Алгоритмы, Линейная алгебра…).
#   Дисциплина — один уровень предмета на конкретном курсе: «Программирование III», «Алгоритмы V».
#   Уровень предмета не зависит от номера курса: предмет растёт, когда в нём появляются новые темы.
# Порядок в файле = порядок прохождения. Дисциплины внутри курса идут строго друг за другом.
#
# Поля раздела:
#   requires — разделы, на которые опирается этот (обязаны стоять РАНЬШЕ)
#   used_by  — для математики: где это пригодится (обязаны стоять ПОЗЖЕ)
#   why      — зачем это нужно, одной фразой
# Поля дисциплины: subject, level, title (тема уровня), hours, summary («что вас ждёт»), unlocks (открываемые библиотеки)
# Проверка и генерация документов: uv run --with pyyaml tools/program/build.py

program:
  title: Forge ML
  levels:
    - {id: course, title: Курс, gate: Переводной экзамен (письменная часть + устная защита у Claude) + курсовой проект}
    - {id: discipline, title: Дисциплина, gate: Экзамен по дисциплине (практика + устный опрос)}
    - {id: section, title: Раздел, gate: Контрольная (смешанные вопросы по всем темам раздела)}
    - {id: topic, title: Тема, gate: Встроенные проверки и практика темы}
  residual_check: в середине каждого курса, начиная со II, — проверка остаточных знаний по всем прошлым курсам

subjects:
  - {id: intro, title: Введение в специальность}
  - {id: infra, title: Инфраструктура}
  - {id: vcs, title: Контроль версий}
  - {id: prog, title: Программирование}
  - {id: math, title: Введение в высшую математику}
  - {id: algo, title: Алгоритмы и структуры данных}
  - {id: db, title: Базы данных}
  - {id: linalg, title: Линейная алгебра}
  - {id: calc, title: Математический анализ}
  - {id: prob, title: Теория вероятностей и математическая статистика}
  - {id: data, title: Анализ данных}
  - {id: optim, title: Методы оптимизации}
  - {id: ml, title: Машинное обучение}
  - {id: exp, title: Продуктовая аналитика и эксперименты}
  - {id: dl, title: Глубокое обучение}
  - {id: ai, title: Генеративный ИИ и агентные системы}
  - {id: de, title: Инженерия данных}
  - {id: mlops, title: Эксплуатация ML-систем (MLOps)}
  - {id: mlsd, title: Проектирование ML-систем}
  - {id: eng, title: Английский для разработчика}
  - {id: sec, title: Информационная безопасность и этика ИИ}
  - {id: practice, title: Практика}
  - {id: career, title: Профессиональная коммуникация и карьера}

math_subjects: [math, linalg, calc, prob, optim]

courses:

# ═══════════════════════════════════════════════════════════════════
- id: "0"
  title: Введение
  tagline: Что такое ИИ, машинное обучение и данные, откуда всё взялось и чем занимаются люди этих профессий
  project: null
  disciplines:

  - id: intro1
    subject: intro
    level: 1
    title: Введение в специальность
    hours: 10
    summary: Предисловие к курсу — без формул и кода. Картина профессии целиком, чтобы дальше было понятно, зачем каждая дисциплина.
    sections:
    - id: intro1.what
      title: ИИ, машинное обучение и данные простыми словами
      topics:
      - Программа по правилам против программы, которая учится на примерах
      - Модель, данные, обучение, предсказание — четыре главных слова
      - Где ML уже вокруг нас — рекомендации, поиск, переводчик, банковский скоринг, ассистенты
      - Живая демонстрация — модель учится на точках у вас на глазах
    - id: intro1.history
      title: Краткая история
      requires: [intro1.what]
      topics:
      - Тьюринг, машина Тьюринга как идея «вычисления» и вопрос «может ли машина мыслить» (1950)
      - Перцептрон Розенблатта (1958) и первая «зима» ИИ
      - Экспертные системы, статистическое обучение, бустинг
      - Возвращение нейросетей — ImageNet (2012), трансформеры (2017), ChatGPT (2022)
      - Почему всё это стало возможным — данные, вычисления, алгоритмы
    - id: intro1.professions
      title: Профессии и задачи
      requires: [intro1.history]
      topics:
      - Аналитик, дата-сайентист, ML-инженер, AI-инженер, инженер данных, MLOps — кто что делает
      - Типичные задачи бизнеса и как их решают
      - Рабочий день, команда, инструменты
    - id: intro1.map
      title: Карта знаний
      requires: [intro1.professions]
      topics:
      - Из чего состоит профессия — программирование, математика, данные, модели, инфраструктура
      - Почему порядок именно такой — от фундамента к моделям и продакшену
      - Предметы курса и их уровни — что ждёт на каждом курсе

# ═══════════════════════════════════════════════════════════════════
- id: I
  title: Фундамент
  tagline: Python, компьютер и терминал, Git, язык высшей математики, первые алгоритмы и SQL
  project: >-
    «Первый настоящий репозиторий»: консольная утилита на Python, которая читает CSV и SQLite-базу и отвечает на вопросы пользователя. Живёт на GitHub, история из веток и pull request'ов. Claude проверяет реальный репозиторий.
  disciplines:

  - id: prog1
    subject: prog
    level: 1
    title: Основы Python
    hours: 60
    summary: Язык целиком на базовом уровне — от переменных до модулей, прямо в браузере, без установки.
    sections:
    - id: prog1.basics
      title: Основы языка
      requires: [intro1.map]
      topics:
      - Переменные и типы; арифметика; ввод и вывод
      - Условия, логические операции; тернарный оператор (условное выражение)
      - Циклы while и for; range
    - id: prog1.functions
      title: Функции
      requires: [prog1.basics]
      topics:
      - Параметры, возвращаемое значение, значения по умолчанию; именованные аргументы
      - Область видимости; документирование; чистые функции
      - Функции как значения — передать функцию в функцию, key-функции и компараторы, lambda
      - Аннотации типов — основы
    - id: prog1.collections
      title: Коллекции
      requires: [prog1.functions]
      topics:
      - Списки, кортежи, срезы
      - Словари и множества
      - Изменяемость и ссылки — классические ловушки
      - Генераторы списков; сортировка с key
    - id: prog1.text_files
      title: Текст и файлы
      requires: [prog1.collections]
      topics:
      - Строки и форматирование; регулярные выражения
      - Файлы (with open — пока как готовая конструкция) и pathlib; CSV, JSON и YAML — что означают аббревиатуры и откуда форматы
      - Дата и время — datetime и часовые пояса
    - id: prog1.errors_modules
      title: Ошибки и модули
      requires: [prog1.text_files]
      topics:
      - Исключения — try, except, finally
      - Модули и импорт; стандартная библиотека; сторонние пакеты
      - Отладка — print и отладчик

  - id: infra1
    subject: infra
    level: 1
    title: Компьютер и командная строка
    hours: 18
    summary: Как устроен компьютер и как управлять им без мыши — в браузерном терминале и на своей виртуальной машине или сервере.
    sections:
    - id: infra1.machine
      title: Как устроен компьютер
      requires: [prog1.errors_modules]
      topics:
      - Процессор, память, диск; операционная система; программа, процесс, поток; как ОС делит процессор между программами
      - Биты и байты; двоичная и шестнадцатеричная системы
      - Кодировки текста (ASCII, Unicode, UTF-8) и почему «ломается» кириллица
    - id: infra1.shell
      title: Терминал Linux
      requires: [infra1.machine]
      topics:
      - Файловая система и пути; ls, cd, pwd, mkdir, cp, mv, rm, cat, less
      - Пайпы и перенаправление; grep, find, wc, sort, head, tail
      - Права доступа и владельцы; sudo
      - Процессы и сигналы — ps, top, kill
      - Переменные окружения и PATH
      - Редактирование файлов в терминале — nano
    - id: infra1.scripts
      title: Скрипты и окружение разработчика
      requires: [infra1.shell]
      topics:
      - Bash-скрипты — переменные, условия, циклы
      - Своя виртуальная машина — WSL или VirtualBox; SSH-клиент и первый вход на сервер
      - Установка программ и пакетные менеджеры
      - Редактор кода; изолированные окружения Python (uv, venv)

  - id: vcs1
    subject: vcs
    level: 1
    title: Git и GitHub
    hours: 15
    summary: История изменений, ветки и совместная работа — навык, без которого не пускают ни в один репозиторий.
    sections:
    - id: vcs1.local
      title: Git локально
      requires: [infra1.shell]
      topics:
      - Зачем контроль версий; init, add, commit
      - Рабочая папка, индекс, репозиторий
      - История, diff, .gitignore; отмена изменений — restore, reset, revert
    - id: vcs1.branches
      title: Ветки
      requires: [vcs1.local]
      topics:
      - Коммиты как граф; HEAD; branch и switch
      - Merge, fast-forward, конфликты
      - Rebase и stash
    - id: vcs1.remote
      title: GitHub
      requires: [vcs1.branches]
      topics:
      - remote, push, pull, fetch; SSH-ключ — создаём сами; асимметричные ключи — интуиция
      - Форк, pull request, ревью кода
      - Issues, метки, GitHub flow; теги и релизы
      - Свой профиль на GitHub и страница на GitHub Pages

  - id: math1
    subject: math
    level: 1
    title: Язык математики
    hours: 50
    summary: Вход в высшую математику — функции, логарифмы, тригонометрия, множества, суммы и умение читать формулы.
    sections:
    - id: math1.school
      title: Школьная база (диагностика)
      requires: [prog1.basics]
      used_by: [math1.numbers]
      why: Без дробей, степеней и уравнений дальше не сдвинуться — пройдёт быстро, если помните
      topics:
      - Диагностический тест — что можно пропустить
      - Дроби, проценты, пропорции; уравнения и системы
      - Координатная плоскость и график прямой
    - id: math1.numbers
      title: Числа, степени и логарифмы
      requires: [math1.school]
      used_by: [calc1.limits, prob2.info]
      why: Экспонента и логарифм — в каждой функции потерь; float — источник реальных багов
      topics:
      - Степени и корни; экспонента и число e; логарифм
      - Числа с плавающей точкой — почему 0.1 + 0.2 ≠ 0.3; переполнение
      - Остаток от деления и модульная арифметика
    - id: math1.functions
      title: Функции и графики
      requires: [math1.numbers]
      used_by: [algo1.complexity, ml1.logistic, dl1.perceptron]
      why: Модель — это функция; функция активации нейрона — тоже
      topics:
      - Что такое функция, выражение, формула; область определения
      - Линейная, квадратичная, степенная, показательная, логарифмическая
      - Преобразования графиков; сигмоида и ступенька — первые «функции активации»
    - id: math1.trig
      title: Тригонометрия и углы
      requires: [math1.functions]
      used_by: [linalg1.vectors, dl4.attention]
      why: Косинус угла — это мера похожести векторов; синусы кодируют позиции слов в трансформерах
      topics:
      - Единичная окружность; синус и косинус наглядно; полярные координаты
      - Угол между направлениями; периодические функции
    - id: math1.logic_sets
      title: Логика и множества
      requires: [math1.trig]
      used_by: [db1.model, db1.joins, prob1.basics]
      why: JOIN в SQL — операции над множествами; события в вероятности — тоже множества
      topics:
      - Высказывания и логические операции
      - Множества и операции над ними; диаграммы Эйлера–Венна
      - Декартово произведение и отношения
    - id: math1.graphs
      title: Графы
      requires: [math1.logic_sets]
      used_by: [algo3.graphs, dl1.backprop]
      why: Почти всё можно представить графом — от связей в соцсети до вычислений внутри нейросети
      topics:
      - Вершины и рёбра; ориентированные и взвешенные графы
      - Степени, пути, циклы, связность; деревья как особые графы
      - Где графы встречаются — дороги, ссылки, зависимости, коммиты Git
    - id: math1.sums
      title: Суммы и обозначения
      requires: [math1.logic_sets]
      used_by: [linalg1.vectors, prob1.descriptive, ml1.metrics]
      why: Почти каждая формула в ML записана через Σ
      topics:
      - Знаки Σ и Π, индексы; свойства сумм
    - id: math1.combinatorics
      title: Комбинаторика
      requires: [math1.sums]
      used_by: [prob1.basics]
      why: Основа подсчёта вероятностей
      topics:
      - Правила суммы и произведения; перестановки, сочетания
    - id: math1.proof
      title: Как читать математику
      requires: [math1.combinatorics]
      used_by: [linalg1.systems, calc1.limits]
      why: Без умения читать определения и доказательства дальше будет только заучивание
      topics:
      - Определение, теорема, доказательство
      - Прямое доказательство, от противного, индукция

  - id: algo1
    subject: algo
    level: 1
    title: Первые алгоритмы
    hours: 30
    summary: Что такое алгоритм, как оценить его скорость и как объяснить решение словами до того, как писать код.
    sections:
    - id: algo1.thinking
      title: Алгоритмическое мышление
      requires: [prog1.collections]
      topics:
      - Разбиение задачи на шаги; трассировка вручную
      - Как объяснять решение словами — формат «идея, шаги, сложность, крайние случаи»
    - id: algo1.complexity
      title: Сложность
      requires: [algo1.thinking, math1.functions]
      topics:
      - O-большое; время и память; сравнение на графиках встроенного плоттера
    - id: algo1.basic
      title: Простые алгоритмы
      requires: [algo1.complexity]
      topics:
      - Линейный поиск, максимум, подсчёт, разворот
      - Сортировки пузырьком, выбором, вставками
      - Бинарный поиск — первое знакомство
    - id: algo1.recursion
      title: Рекурсия
      requires: [algo1.basic]
      topics:
      - Стек вызовов — как функция вызывает сама себя
      - Рекурсия против цикла — когда что удобнее; почему наивные числа Фибоначчи медленные
      - Рекурсия в деле — обход вложенных папок, фракталы (ковёр Серпинского, дерево Пифагора)

  - id: db1
    subject: db
    level: 1
    title: SQL-запросы
    hours: 30
    summary: Язык запросов к базам данных — выборка, группировка и соединение таблиц, с визуализацией каждого запроса.
    sections:
    - id: db1.model
      title: Реляционная модель
      requires: [math1.logic_sets, prog1.collections]
      topics:
      - Таблицы, строки, столбцы, типы; что означают SQL и СУБД
      - Первичные и внешние ключи; связи один-ко-многим и многие-ко-многим
    - id: db1.select
      title: Выборка
      requires: [db1.model]
      topics:
      - SELECT, WHERE, ORDER BY, LIMIT; LIKE, IN, BETWEEN; CASE
      - NULL и трёхзначная логика
    - id: db1.aggregate
      title: Агрегация
      requires: [db1.select]
      topics:
      - Агрегатные функции; GROUP BY; HAVING; порядок выполнения запроса
    - id: db1.joins
      title: Соединения таблиц
      requires: [db1.aggregate, math1.logic_sets]
      topics:
      - INNER, LEFT, RIGHT, FULL, CROSS как операции над множествами
      - Self-join; ловушки — размножение строк, NULL после LEFT JOIN
    - id: db1.subqueries
      title: Подзапросы
      requires: [db1.joins]
      topics:
      - Подзапросы, EXISTS; UNION, INTERSECT, EXCEPT; введение в CTE
    - id: db1.modify
      title: Изменение данных
      requires: [db1.subqueries]
      topics:
      - CREATE TABLE и ограничения; INSERT, UPDATE, DELETE; транзакция (база)
      - SQLite из Python — модуль sqlite3

# ═══════════════════════════════════════════════════════════════════
- id: II
  title: Математика и первые данные
  tagline: ООП, линейная алгебра и первые инструменты данных, производные, вероятности
  project: >-
    «Своя научная библиотека»: Python-пакет с классом Matrix, решением систем, численной производной, градиентным спуском и вероятностными симуляциями. С тестами и сравнением точности и скорости с NumPy.
  disciplines:

  - id: prog2
    subject: prog
    level: 2
    title: Объектно-ориентированное программирование
    hours: 40
    summary: Классы и объекты, принципы хорошего кода и тесты — то, что отличает программиста от автора скриптов.
    sections:
    - id: prog2.oop
      title: Классы и объекты
      requires: [prog1.errors_modules]
      topics:
      - Класс, объект, атрибуты, методы; инкапсуляция
      - Наследование, переопределение методов, super(); композиция вместо наследования; полиморфизм
      - Магические методы — __repr__, __eq__, __add__, __matmul__, __getitem__
      - dataclasses
      - Знак @ перед функцией — что это такое; декораторы @property и @dataclass как пользоваться (устройство — в Программировании III)
    - id: prog2.principles
      title: Принципы проектирования
      requires: [prog2.oop]
      topics:
      - DRY, KISS, YAGNI
      - SOLID на примерах; закон Деметры
      - Именование, функции «делают одно», рефакторинг; запахи кода
    - id: prog2.testing
      title: Тестирование
      requires: [prog2.principles]
      topics:
      - Зачем тесты; пирамида тестов — модульные, интеграционные, сквозные
      - pytest, фикстуры, параметризация; заглушки и mock-объекты; покрытие
      - Разработка через тесты (TDD); исключения как часть интерфейса

  - id: linalg1
    subject: linalg
    level: 1
    title: Векторы и матрицы
    hours: 55
    unlocks: [NumPy]
    summary: Векторы как объекты и как смыслы, матрицы как преобразования, системы уравнений — и свой класс Matrix.
    sections:
    - id: linalg1.vectors
      title: Векторы
      requires: [math1.sums, math1.trig, prog2.oop]
      used_by: [ml1.baselines, dl3.embeddings, db4.vector]
      why: Любой объект в ML — вектор; «король − мужчина + женщина ≈ королева» — это арифметика векторов
      topics:
      - Вектор как стрелка и как список чисел; сложение и умножение на число
      - Длина и расстояние; нормы L1, L2, L∞
      - Скалярное произведение, угол, косинусная близость; неравенство Коши–Буняковского
      - Смысл как вектор — интуиция эмбеддингов слов
    - id: linalg1.matrices
      title: Матрицы
      requires: [linalg1.vectors]
      used_by: [dl1.perceptron, data1.viz]
      why: Слой нейросети — умножение на матрицу; график на экране — преобразование координат
      topics:
      - Матрица как таблица и как преобразование плоскости
      - Умножение матриц; почему AB ≠ BA; транспонирование
      - Свой класс Matrix
    - id: linalg1.systems
      title: Системы уравнений
      requires: [linalg1.matrices, math1.proof]
      used_by: [ml1.linear]
      why: Нормальное уравнение линейной регрессии — это система уравнений
      topics:
      - Метод Гаусса
      - Линейная зависимость, базис, размерность, ранг
      - Обратная матрица; определитель как изменение площади
    - id: linalg1.numpy_unlock
      title: Открытие NumPy
      requires: [linalg1.systems]
      topics:
      - ndarray против своего Matrix — сравнение результатов и скорости

  - id: data1
    subject: data
    level: 1
    title: Инструменты анализа данных
    hours: 45
    unlocks: [matplotlib, pandas]
    summary: Что такое анализ данных, NumPy изнутри, свой график и своя таблица — а затем matplotlib и pandas.
    sections:
    - id: data1.intro
      title: Что такое анализ данных
      requires: [linalg1.numpy_unlock]
      topics:
      - "Вопрос → данные → анализ → вывод → решение: как работает аналитик"
      - Откуда берутся данные и какими они бывают
      - Инструменты (NumPy, pandas, matplotlib) — не анализ, а его руки
    - id: data1.numpy
      title: NumPy изнутри
      requires: [data1.intro, prog2.testing]
      topics:
      - Jupyter-ноутбуки — как в них работают и чем они опасны
      - dtype, shape, strides, память; копии и представления
      - Индексация и маски; broadcasting; векторизация против циклов
      - Случайные числа и воспроизводимость
    - id: data1.viz
      title: Визуализация
      requires: [data1.numpy, linalg1.matrices]
      topics:
      - Как строится график — координаты, шкалы, оси; свой график в SVG
      - Открытие matplotlib; какой график для какой задачи; как графики обманывают
    - id: data1.tables
      title: Табличные данные
      requires: [data1.viz, db1.joins]
      topics:
      - Своя мини-таблица на словарях — фильтр, группировка, соединение
      - Открытие pandas — Series, DataFrame, groupby, merge, pivot; время

  - id: eng1
    subject: eng
    level: 1
    title: Словарь программиста
    hours: 8
    summary: Лексика ошибок, документации и интерфейсов — и откуда взялись слова log, backup, bug, deploy.
    sections:
    - id: eng1.vocab
      title: Словарь программиста
      requires: [prog1.errors_modules]
      topics:
      - Как устроено английское техническое слово — корни и происхождение (bug, log, backup, cache, deploy)
      - Сообщения об ошибках и предупреждениях — читаем без переводчика
      - Термины курса — карточки в ежедневном повторении

  - id: calc1
    subject: calc
    level: 1
    title: Производная и градиентный спуск
    hours: 45
    summary: Как функция меняется и как найти её минимум — главная идея обучения любой модели.
    sections:
    - id: calc1.limits
      title: Пределы
      requires: [math1.proof, math1.numbers]
      used_by: [calc1.derivative]
      why: Производная определяется через предел
      topics:
      - Последовательности и пределы; непрерывность
    - id: calc1.derivative
      title: Производная
      requires: [calc1.limits]
      used_by: [dl1.backprop]
      why: Обратное распространение ошибки — это цепное правило
      topics:
      - Производная — геометрический смысл (наклон касательной) и физический (скорость)
      - Правила дифференцирования; цепное правило
      - Вторая производная — ускорение и выпуклость; производные высших порядков
      - Численная производная в Python
    - id: calc1.optim
      title: Поиск минимума
      requires: [calc1.derivative]
      used_by: [ml1.linear]
      why: Обучение модели — это поиск минимума функции потерь
      topics:
      - Экстремумы и выпуклость
      - Градиентный спуск в одном измерении; скорость обучения
    - id: calc1.partial
      title: Функции нескольких переменных
      requires: [calc1.optim, linalg1.vectors]
      used_by: [calc2.matrix]
      why: У модели много параметров — нужен градиент
      topics:
      - Частные производные; градиент как вектор; градиентный спуск на плоскости

  - id: algo2
    subject: algo
    level: 2
    title: Базовые структуры и приёмы
    hours: 30
    summary: Хэш-таблицы, сортировки, два указателя, окно и стек — приёмы, которые решают половину задач собеседований.
    sections:
    - id: algo2.hashing
      title: Хэширование
      requires: [algo1.basic, prog2.oop]
      topics:
      - Хэш-функция; своя хэш-таблица; как устроены dict и set
      - Задачи на подсчёт и группировку
    - id: algo2.patterns
      title: Приёмы на массивах
      requires: [algo2.hashing]
      topics:
      - Два указателя; скользящее окно; префиксные суммы
    - id: algo2.sorting
      title: Эффективные сортировки и поиск
      requires: [algo2.patterns, algo1.recursion]
      topics:
      - Сортировка слиянием и быстрая; устойчивость; нижняя оценка
      - Бинарный поиск по ответу
    - id: algo2.linear
      title: Линейные структуры
      requires: [algo2.sorting]
      topics:
      - Стек, очередь, дек — свои реализации
      - Односвязный, двусвязный и кольцевой списки — свои реализации
      - Скобочные последовательности; монотонный стек

  - id: prob1
    subject: prob
    level: 1
    title: Вероятность и описательная статистика
    hours: 45
    summary: Как считать шансы, работать с неопределённостью и описывать данные числами — с симуляциями вместо заучивания.
    sections:
    - id: prob1.basics
      title: Вероятность
      requires: [math1.combinatorics, math1.logic_sets]
      used_by: [prob1.conditional]
      topics:
      - События и вероятность; симуляции Монте-Карло на Python
    - id: prob1.conditional
      title: Условная вероятность
      requires: [prob1.basics]
      used_by: [ml1.baselines, exp1.analysis]
      why: Наивный Байес и интерпретация тестов
      topics:
      - Условная вероятность и независимость; формула Байеса
    - id: prob1.rv
      title: Дискретные случайные величины
      requires: [prob1.conditional]
      used_by: [prob2.continuous]
      topics:
      - Бернулли, биномиальное, Пуассона, геометрическое
      - Матожидание и дисперсия
    - id: prob1.descriptive
      title: Описательная статистика
      requires: [prob1.rv, data1.viz]
      used_by: [data2.eda]
      topics:
      - Среднее, медиана, квантили, разброс; выбросы
      - Гистограмма и boxplot своими руками, затем в matplotlib

# ═══════════════════════════════════════════════════════════════════
- id: III
  title: Данные
  tagline: Инженерный Python, вторая ступень математики, аналитический SQL и подготовка данных
  project: >-
    «Данные от сырья до отчёта»: реальный датасет с Kaggle или публичного API → очистка → своя база → EDA-отчёт с графиками. Claude проверяет, что данные настоящие, и принимает устную защиту.
  disciplines:

  - id: prog3
    subject: prog
    level: 3
    title: Инженерный Python
    hours: 35
    summary: Генераторы, декораторы, типизация и упаковка — Python так, как пишут в командах.
    sections:
    - id: prog3.iter
      title: Итераторы и генераторы
      requires: [prog2.testing]
      topics:
      - Протокол итератора; yield; ленивые вычисления; itertools
    - id: prog3.functional
      title: Функции как объекты
      requires: [prog3.iter]
      topics:
      - Замыкания, functools; lambda — ограничения; декораторы; контекстные менеджеры
      - Как устроен декоратор изнутри — функция, которая принимает и возвращает функцию
    - id: prog3.quality
      title: Качество и упаковка
      requires: [prog3.functional, vcs1.remote]
      topics:
      - Аннотации типов и mypy; ruff; pre-commit
      - Пакет и pyproject.toml; логирование; CLI
      - Профилирование — где программа тратит время
      - ИИ-ассистенты в работе — как ставить задачу, проверять результат и когда не использовать
      - GitHub Actions — тесты и линтер на каждый pull request

  - id: linalg2
    subject: linalg
    level: 2
    title: Проекции и разложения
    hours: 35
    summary: Проекции, собственные векторы и SVD — математика регрессии, PCA, рекомендаций и LoRA.
    sections:
    - id: linalg2.geometry
      title: Ортогональность и проекции
      requires: [linalg1.numpy_unlock]
      used_by: [ml1.linear]
      why: Метод наименьших квадратов — это проекция
      topics:
      - Проекции; доказательство — проекция ближе всего
      - Ортонормированные базисы; QR-разложение
      - Метод наименьших квадратов
    - id: linalg2.eigen
      title: Собственные векторы и SVD
      requires: [linalg2.geometry]
      used_by: [ml3.unsupervised, ml3.recsys, ai1.finetune]
      why: PCA, рекомендательные системы и LoRA построены на SVD
      topics:
      - Смена базиса — матрица перехода
      - Собственные векторы и числа; диагонализация как смена базиса; симметричные матрицы
      - SVD и низкоранговое приближение
      - Обусловленность и численная устойчивость

  - id: db2
    subject: db
    level: 2
    title: Аналитический SQL
    hours: 25
    unlocks: [Polars, DuckDB]
    summary: Оконные функции, CTE и аналитика продукта — SQL уровня собеседования аналитика.
    sections:
    - id: db2.windows
      title: Оконные функции
      requires: [db1.modify]
      topics:
      - ROW_NUMBER, RANK, LAG, LEAD; скользящие агрегаты; рамки окна
    - id: db2.analytics
      title: Аналитические запросы
      requires: [db2.windows, algo1.recursion]
      topics:
      - CTE и рекурсивные CTE
      - Ретеншн, когорты, воронки, DAU/MAU
    - id: db2.olap
      title: Аналитические СУБД
      requires: [db2.analytics, prog3.iter, data1.tables]
      topics:
      - OLTP и OLAP; колоночное хранение — идея; формат Parquet
      - DuckDB — аналитика прямо по файлам
      - Polars — ленивые вычисления над таблицами; когда pandas мало

  - id: calc2
    subject: calc
    level: 2
    title: Многомерный анализ
    hours: 50
    summary: Градиенты по матрицам, интегралы и приближения — всё, что нужно для вывода обучения моделей и непрерывных вероятностей.
    sections:
    - id: calc2.matrix
      title: Матричное дифференцирование
      requires: [calc1.partial, linalg1.matrices]
      used_by: [ml1.logistic, dl1.backprop]
      why: Градиенты логистической регрессии и нейросети записываются в матричной форме
      topics:
      - Якобиан и гессиан
      - Производные по вектору и матрице; векторизованное цепное правило
    - id: calc2.integral
      title: Интеграл
      requires: [calc1.derivative]
      used_by: [prob2.continuous]
      why: Вероятность непрерывной величины — площадь под плотностью
      topics:
      - Интеграл как площадь и накопление; численное интегрирование
      - Формула Ньютона–Лейбница; кратные интегралы
    - id: calc2.taylor
      title: Приближения
      requires: [calc2.integral]
      used_by: [optim1.methods]
      why: Объясняет, почему работают оптимизаторы
      topics:
      - Линейное и квадратичное приближение; ряд Тейлора
    - id: calc2.numerical
      title: Вычислительная математика
      requires: [calc2.taylor, linalg1.systems]
      used_by: [optim1.methods, ml1.linear]
      why: Компьютер решает уравнения приближённо — надо понимать, где и как он ошибается
      topics:
      - Численное решение уравнений — деление пополам и метод Ньютона; погрешности
      - Итерационные методы для систем уравнений
      - Интерполяция и приближение функций

  - id: eng2
    subject: eng
    level: 2
    title: Чтение документации
    hours: 8
    summary: Быстро находить нужное в документации библиотек — по структуре и ключевым словам.
    sections:
    - id: eng2.vocab
      title: Чтение документации
      requires: [eng1.vocab]
      topics:
      - Структура справочника API — parameters, returns, raises, deprecated
      - Чтение README и руководств; поиск ответов на английском

  - id: algo3
    subject: algo
    level: 3
    title: Деревья и графы
    hours: 30
    summary: Иерархии и связи — деревья, кучи и графы, из которых построены поиск, рекомендации и маршруты.
    sections:
    - id: algo3.trees
      title: Деревья и кучи
      requires: [algo2.linear, algo1.recursion]
      topics:
      - Обходы деревьев; бинарное дерево поиска
      - Своя куча; очередь с приоритетом; top-k
    - id: algo3.graphs
      title: Графы
      requires: [algo3.trees, math1.graphs]
      topics:
      - Представление графов; BFS и DFS
      - Топологическая сортировка; Дейкстра; система непересекающихся множеств

  - id: prob2
    subject: prob
    level: 2
    title: Непрерывные величины и статистический вывод
    hours: 45
    unlocks: [SciPy]
    summary: Нормальное распределение, ЦПТ, правдоподобие, доверительные интервалы и проверка гипотез.
    sections:
    - id: prob2.continuous
      title: Непрерывные распределения
      requires: [prob1.descriptive, calc2.integral, linalg1.matrices]
      used_by: [prob2.limits]
      topics:
      - Плотность и функция распределения; нормальное, экспоненциальное
      - Ковариация и корреляция; многомерное нормальное
    - id: prob2.limits
      title: Предельные теоремы
      requires: [prob2.continuous]
      used_by: [exp1.analysis]
      why: Без ЦПТ не работает ни один A/B-тест
      topics:
      - Закон больших чисел; центральная предельная теорема (с симуляциями)
    - id: prob2.info
      title: Правдоподобие и информация
      requires: [prob2.limits]
      used_by: [ml1.logistic, dl1.training]
      why: Функции потерь выводятся из правдоподобия
      topics:
      - MLE и MAP; энтропия, кросс-энтропия, KL-дивергенция
      - Цепи Маркова — интуиция; сэмплирование — обратная функция, отбор с отклонением, идея MCMC
      - Бета-распределение и сопряжённые априорные — идея
    - id: prob2.inference
      title: Статистический вывод
      requires: [prob2.info, linalg2.geometry]
      used_by: [exp1.design]
      topics:
      - Выборка и стандартная ошибка; доверительные интервалы; бутстрап
      - Гипотезы, p-value, ошибки I и II рода, мощность; t-тест, хи-квадрат
      - Регрессия как статистическая модель; предпосылки МНК; корреляция и причинность
      - Распределения t, хи-квадрат и F; критерий Колмогорова–Смирнова

  - id: data2
    subject: data
    level: 2
    title: Сбор и подготовка данных
    hours: 40
    summary: Где брать данные, как их чистить и исследовать, как готовить признаки и расширять выборку.
    sections:
    - id: data2.sources
      title: Источники данных
      requires: [data1.tables]
      topics:
      - Клиент, сервер и API глазами пользователя — что это, откуда взялось (от RPC до REST); как устроен HTTP-запрос
      - HTML и DOM — основы для скрапинга
      - REST API — пагинация, лимиты, ключи доступа
      - Веб-скрапинг и его этика; Kaggle API
    - id: data2.cleaning
      title: Очистка
      requires: [data2.sources]
      topics:
      - Типы, дубликаты, категории; пропуски и стратегии; выбросы; проверки качества
    - id: data2.eda
      title: Разведочный анализ
      requires: [data2.cleaning, prob1.descriptive, prob2.continuous]
      topics:
      - Вопросы к данным; распределения, связи, срезы; отчёт EDA
      - Дашборды — основы BI-инструментов (Metabase или Superset)
    - id: data2.features
      title: Признаки
      requires: [data2.eda]
      topics:
      - Идея разделения на обучающую и тестовую части — и почему до любой обработки
      - Масштабирование и нормализация; кодирование категорий; даты и текст
      - Утечки данных на этапе подготовки
      - Разметка данных — как организовать и проверить качество; идея активного обучения
      - Мешок слов и n-граммы

  - id: db3
    subject: db
    level: 3
    title: Проектирование и устройство баз данных
    hours: 30
    unlocks: [SQLAlchemy]
    summary: Как спроектировать схему, почему запрос тормозит, что такое транзакция — и своё мини-ORM.
    sections:
    - id: db3.design
      title: Проектирование схемы
      requires: [db1.modify]
      topics:
      - Нормальные формы; денормализация и почему
      - База, схема, таблица; пользователи, роли и права (GRANT); резервные копии
    - id: db3.internals
      title: Устройство СУБД
      requires: [db3.design, algo3.trees]
      topics:
      - Индексы и B-дерево; EXPLAIN
      - Транзакции, уровни изоляции, ACID
    - id: db3.python
      title: Базы данных из Python
      requires: [db3.internals, prog3.quality, infra1.scripts]
      topics:
      - PostgreSQL — установка, psql, отличия от SQLite
      - Драйвер и SQL-инъекции
      - Своё мини-ORM — класс ↔ таблица
      - Открытие SQLAlchemy; миграции Alembic

  - id: practice1
    subject: practice
    level: 1
    title: Учебная практика
    hours: 20
    summary: Первые запросы «от заказчика» — найти ответ в данных и защитить его отчётом.
    sections:
    - id: practice1.cases
      title: Кейсы
      requires: [data2.features, db3.python]
      topics:
      - Аналитический запрос продакт-менеджера — SQL и отчёт
      - Исследование данных по просьбе заказчика — выводы и рекомендации

  - id: career1
    subject: career
    level: 1
    title: Первая стажировка
    hours: 6
    summary: Резюме, профиль на GitHub и календарь отборов на стажировки — чтобы подаваться вовремя, с Курса IV.
    sections:
    - id: career1.internship
      title: Стажировки
      requires: [practice1.cases]
      topics:
      - Как устроены отборы на стажировки в бигтехе и когда они проходят
      - Первое резюме и профиль GitHub; какие проекты показывать

# ═══════════════════════════════════════════════════════════════════
- id: IV
  title: Машинное обучение
  tagline: Классические модели, написанные сначала своими руками, свой сервер и эксперименты
  project: >-
    «Реальные данные и реальный эксперимент»: грязный предметный датасет с аудитом утечек, валидацией по времени и запиской для бизнеса + разбор настоящего A/B-датасета с проверкой SRM и CUPED + небольшая рекомендательная система.
  disciplines:

  - id: optim1
    subject: optim
    level: 1
    title: Методы оптимизации
    hours: 20
    summary: Почему градиентный спуск сходится, когда он медленный и чем его заменить — математика всех оптимизаторов.
    sections:
    - id: optim1.methods
      title: Безусловная оптимизация
      requires: [calc2.numerical, linalg2.eigen]
      used_by: [ml1.linear, dl1.training]
      why: Скорость и устойчивость обучения моделей объясняются здесь
      topics:
      - Выпуклость в многомерии; гессиан и положительная определённость
      - Обусловленность и скорость градиентного спуска (с доказательством на квадратичной функции)
      - Стохастический градиентный спуск; моментум; метод Ньютона и идея L-BFGS
      - Эвристический поиск — случайный поиск, имитация отжига, генетические алгоритмы (обзор)
    - id: optim1.constrained
      title: Условная оптимизация
      requires: [optim1.methods]
      used_by: [ml3.svm]
      why: На этом построен метод опорных векторов
      topics:
      - Множители Лагранжа; условия ККТ — интуиция; двойственность
      - Линейное программирование — постановка и идея симплекс-метода (обзор)

  - id: ml1
    subject: ml
    level: 1
    title: Основы и линейные модели
    hours: 50
    unlocks: [scikit-learn]
    summary: Постановка задачи, валидация, метрики и первые модели — от kNN до логистической регрессии, все с нуля.
    sections:
    - id: ml1.framing
      title: Постановка задачи
      requires: [data2.features, calc1.partial]
      topics:
      - Объекты, признаки, целевая переменная; модель, функция потерь, оптимизация
    - id: ml1.validation
      title: Валидация
      requires: [ml1.framing]
      topics:
      - Выборки и кросс-валидация (своя); переобучение; bias-variance
    - id: ml1.metrics
      title: Метрики
      requires: [ml1.validation]
      topics:
      - MSE, MAE, R²; precision, recall, F1, ROC-AUC, PR-AUC — свои реализации
      - Выбор метрики под бизнес
    - id: ml1.baselines
      title: Модели-ориентиры
      requires: [ml1.metrics]
      topics:
      - kNN — с нуля; наивный Байес — с нуля
    - id: ml1.linear
      title: Линейная регрессия
      requires: [ml1.baselines, linalg2.geometry, calc2.numerical, optim1.methods]
      topics:
      - Нормальное уравнение и градиентный спуск — с нуля; регуляризация L1 и L2
      - Субградиент — как оптимизировать L1
    - id: ml1.logistic
      title: Логистическая регрессия
      requires: [ml1.linear, prob2.info, calc2.matrix]
      topics:
      - Сигмоида; log-loss из правдоподобия; вывод градиента
      - Softmax и его градиент; устойчивый softmax (log-sum-exp)
      - Открытие scikit-learn — только для линейных моделей; остальные семейства открываются после своих реализаций

  - id: ml2
    subject: ml
    level: 2
    title: Деревья, ансамбли и практика
    hours: 45
    unlocks: [XGBoost, LightGBM, CatBoost]
    summary: Главный рабочий инструмент на табличных данных — бустинг, написанный сначала своими руками, и полный цикл задачи.
    sections:
    - id: ml2.trees
      title: Деревья и ансамбли
      requires: [ml1.logistic, algo3.trees]
      topics:
      - Дерево решений с нуля; бэггинг и случайный лес
      - Градиентный бустинг с нуля; промышленные бустинги и их отличия
    - id: ml2.practice
      title: Практика ML
      requires: [ml2.trees]
      topics:
      - Полный цикл — baseline, итерации, анализ ошибок
      - Утечки, дисбаланс и пересэмплирование (SMOTE), сдвиг распределений, калибровка
      - Подбор гиперпараметров; важность признаков перестановкой — с нуля, затем SHAP
      - Соревнования — схема валидации, ансамбли
      - Pipeline и ColumnTransformer; подбор гиперпараметров с Optuna
      - Сохранение и загрузка моделей; свой журнал экспериментов в JSON, затем MLflow
      - Ответственный ИИ — персональные данные, справедливость, лицензии данных

  - id: eng3
    subject: eng
    level: 3
    title: Научные статьи
    hours: 8
    summary: Как читать abstract, методы и выводы статьи — подготовка к трансформерам.
    sections:
    - id: eng3.vocab
      title: Научные статьи
      requires: [eng2.vocab]
      topics:
      - Структура научной статьи; типовые обороты
      - Чтение abstract и выводов; как не утонуть в формулах

  - id: algo4
    subject: algo
    level: 4
    title: Динамическое программирование и строки
    hours: 30
    summary: Задачи, которые решаются разбиением на подзадачи, и алгоритмы на строках — классика контестов.
    sections:
    - id: algo4.dp
      title: Динамическое программирование
      requires: [algo3.graphs]
      topics:
      - Мемоизация и таблица; рюкзак; наибольшая общая подпоследовательность; редакционное расстояние
    - id: algo4.strings
      title: Строки
      requires: [algo4.dp]
      topics:
      - Поиск подстроки — полиномиальный хэш, KMP; префиксное дерево
    - id: algo4.greedy
      title: Жадные алгоритмы
      requires: [algo4.strings]
      topics:
      - Когда жадность работает и как это доказать; интервалы

  - id: prog4
    subject: prog
    level: 4
    title: Сетевое программирование
    hours: 35
    unlocks: [FastAPI]
    summary: Как программы общаются по сети — свой HTTP-сервер на сокетах, REST API и свой MCP-сервер, к которому подключится Claude.
    sections:
    - id: prog4.network
      title: Сеть изнутри
      requires: [prog3.quality, data2.sources]
      topics:
      - IP-адреса, порты, DNS — минимум для программиста; клиент и сервер; сокеты; TCP
      - Протокол HTTP изнутри — пишем свой сервер, которому раньше только отправляли запросы
    - id: prog4.api
      title: Веб-API
      requires: [prog4.network, db3.python]
      topics:
      - REST; JSON-схемы и pydantic; открытие FastAPI
      - async и await — минимум для веб-сервера
      - Аутентификация — токены и ключи; хранение секретов
      - API поверх своей базы данных
    - id: prog4.mcp
      title: Протоколы для ИИ-инструментов
      requires: [prog4.api]
      topics:
      - JSON-RPC; что такое MCP — инструменты, ресурсы, транспорт
      - Свой MCP-сервер и подключение к нему Claude

  - id: infra2
    subject: infra
    level: 2
    title: Сети и серверы
    hours: 25
    summary: Настоящий сервер руками — SSH-ключи, пользователи, firewall, службы и домен, без «подключись за меня».
    sections:
    - id: infra2.network
      title: Сети
      requires: [prog4.network]
      topics:
      - Подсети и маршрутизация; TCP и UDP; записи DNS
      - Сертификаты и TLS — как работает HTTPS
    - id: infra2.server
      title: Свой сервер
      requires: [infra2.network, infra1.scripts, vcs1.remote]
      topics:
      - SSH — генерируем ключи сами, ssh config, вход без пароля
      - Пользователи и sudo; firewall; обновления
      - Службы systemd, логи, cron
    - id: infra2.publish
      title: Публикация сервиса
      requires: [infra2.server, prog4.api]
      topics:
      - Обратный прокси nginx; домен; TLS-сертификат
      - Выкладываем своё API на сервер вручную

  - id: ml3
    subject: ml
    level: 3
    title: Обучение без учителя и прикладные задачи
    hours: 45
    summary: Кластеры, PCA, опорные векторы, временные ряды и рекомендательные системы.
    sections:
    - id: ml3.svm
      title: Метод опорных векторов
      requires: [ml2.practice, optim1.constrained]
      topics:
      - Максимальный зазор; hinge loss; ядра
    - id: ml3.unsupervised
      title: Обучение без учителя
      requires: [ml1.validation, linalg2.eigen, prob2.info]
      topics:
      - K-Means с нуля; иерархическая кластеризация; DBSCAN; GMM и EM — идея; качество кластеров
      - PCA через SVD с нуля; t-SNE и UMAP (обзор); поиск аномалий
    - id: ml3.timeseries
      title: Временные ряды
      requires: [ml2.practice, data1.tables, prob2.inference]
      topics:
      - Тренд, сезонность, автокорреляция; ETS и ARIMA — интуиция
      - Стационарность; разбиение по времени
      - Бустинг на лагах; бэктестинг
    - id: ml3.recsys
      title: Рекомендательные системы и ранжирование
      requires: [ml3.unsupervised, linalg2.eigen, ml2.trees]
      topics:
      - Коллаборативная фильтрация; ALS — с нуля
      - Двухэтапная схема — кандидаты и ранжирование; холодный старт
      - Метрики ранжирования — NDCG, MAP, MRR

  - id: prob3
    subject: prob
    level: 3
    title: Байесовская статистика и обобщённые модели
    hours: 25
    summary: Байесовский взгляд на данные, обобщённые линейные модели и множественные сравнения — фундамент серьёзной аналитики.
    sections:
    - id: prob3.bayes
      title: Байесовский вывод
      requires: [prob2.info]
      used_by: [exp1.analysis]
      why: Байесовские A/B-тесты и бандиты
      topics:
      - Априорное и апостериорное; сопряжённые распределения
      - Байесовский A/B-тест
    - id: prob3.glm
      title: Обобщённые модели
      requires: [prob3.bayes, ml1.logistic]
      used_by: [exp1.causal]
      why: Причинный анализ и интерпретация эффектов
      topics:
      - Обобщённые линейные модели — логистическая и пуассоновская регрессии
      - Множественные сравнения — Бонферрони, Бенджамини–Хохберг
      - Причинные графы — основы

  - id: exp1
    subject: exp
    level: 1
    title: A/B-тесты и причинность
    hours: 35
    summary: Как доказать, что изменение в продукте сработало — дизайн, анализ и ловушки экспериментов.
    sections:
    - id: exp1.design
      title: Дизайн эксперимента
      requires: [prob2.inference, db2.analytics]
      topics:
      - Продуктовые метрики; размер выборки и мощность; рандомизация
    - id: exp1.analysis
      title: Анализ эксперимента
      requires: [exp1.design, prob3.bayes, calc2.taylor]
      topics:
      - t-тест, бутстрап, дельта-метод, CUPED; метрики-отношения
      - SRM и A/A-тесты; подглядывание; множественные метрики; бандиты
    - id: exp1.causal
      title: Причинность
      requires: [exp1.analysis, prob3.glm]
      topics:
      - Конфаундеры; uplift; разность разностей

  - id: practice2
    subject: practice
    level: 2
    title: Технологическая практика
    hours: 25
    summary: Задачи «от заказчика» на моделях и экспериментах — с нечётким условием, реальными данными и запиской вместо готового теста.
    sections:
    - id: practice2.cases
      title: Кейсы
      requires: [exp1.causal, infra2.publish, practice1.cases]
      topics:
      - Прогноз спроса для «ритейла» — временные ряды и бэктестинг
      - Модель оттока для «банка» — от данных до записки
      - Решение по A/B-тесту для «маркетплейса»
      - Тестовые задания с реальных отборов (take-home)

# ═══════════════════════════════════════════════════════════════════
- id: V
  title: Глубокое обучение и ИИ
  tagline: Параллельные вычисления и C изнутри, нейросети с нуля, трансформеры, векторные базы, LLM, RAG и агенты
  project: >-
    «Свой RAG-ассистент» — флагман портфолио: русскоязычный корпус, золотой набор из 100+ вопросов, сравнение BM25, векторного и гибридного поиска, таблица стоимости и задержек, публичное демо в контейнере.
  disciplines:

  - id: prog5
    subject: prog
    level: 5
    title: Параллельное и асинхронное программирование
    hours: 35
    summary: Потоки, процессы, asyncio — и язык C, чтобы понять, почему NumPy и GPU такие быстрые.
    sections:
    - id: prog5.concurrency
      title: Параллельность
      requires: [prog3.quality, infra1.machine]
      topics:
      - Планировщик ОС — переключение контекста, round-robin и приоритеты (обзор)
      - Процессы и потоки; GIL; multiprocessing и concurrent.futures
      - Когда параллелить, а когда оставить последовательную программу — накладные расходы, зависимости между шагами, примеры удачных и неудачных случаев
      - Синхронизация — блокировки, семафоры, очереди; гонки и взаимоблокировки
      - Общение между процессами — каналы, очереди сообщений
    - id: prog5.async
      title: Асинхронность
      requires: [prog5.concurrency]
      topics:
      - Цикл событий; async и await; асинхронный сервер
    - id: prog5.lowlevel
      title: Ниже Python
      requires: [prog5.async, data1.numpy]
      topics:
      - Как Python читает код — лексер, парсер, синтаксическое дерево (обзор)
      - Как выполняется Python — байткод, CPython
      - Основы C — память, указатели, массивы; вызов C из Python
      - Векторные инструкции и идея GPU-вычислений
      - Параллельный цикл на C с OpenMP — считаем π на нескольких ядрах

  - id: algo5
    subject: algo
    level: 5
    title: Алгоритмы для больших данных и поиска
    hours: 25
    summary: Как искать похожее среди миллионов объектов и считать по потоку, который не помещается в память.
    sections:
    - id: algo5.neighbors
      title: Поиск ближайших соседей
      requires: [algo4.greedy, linalg1.vectors]
      topics:
      - Точный поиск; KD-дерево; LSH; граф HNSW — идея
    - id: algo5.streaming
      title: Потоковые и вероятностные структуры
      requires: [algo5.neighbors, prob1.rv]
      topics:
      - Резервуарная выборка; фильтр Блума; HyperLogLog; Count-Min
    - id: algo5.parallel
      title: Параллельные алгоритмы
      requires: [algo5.streaming, prog5.concurrency]
      topics:
      - Параллельная префиксная сумма; шаблоны map и reduce; внешняя сортировка

  - id: infra3
    subject: infra
    level: 3
    title: Контейнеры
    hours: 20
    summary: Docker и Compose — упаковать сервис со всеми зависимостями и запустить где угодно одной командой.
    sections:
    - id: infra3.docker
      title: Docker
      requires: [infra2.publish]
      topics:
      - Образ и контейнер; Dockerfile и слои; тома и сети
    - id: infra3.compose
      title: Docker Compose
      requires: [infra3.docker]
      topics:
      - Многосервисные приложения; переменные окружения и секреты

  - id: dl1
    subject: dl
    level: 1
    title: Нейросети с нуля
    hours: 45
    unlocks: [PyTorch]
    summary: От одного нейрона до обученной сети — свой autograd и свои оптимизаторы, а затем PyTorch.
    sections:
    - id: dl1.perceptron
      title: Нейрон и перцептрон
      requires: [ml1.logistic, calc2.matrix]
      topics:
      - Нейрон, веса, функция активации; перцептрон Розенблатта
      - Многослойная сеть; визуализация разделяющей поверхности
    - id: dl1.backprop
      title: Обратное распространение
      requires: [dl1.perceptron, math1.graphs, calc1.derivative]
      topics:
      - Вычислительный граф; свой autograd; численная проверка градиентов
    - id: dl1.training
      title: Обучение сети
      requires: [dl1.backprop, optim1.methods]
      topics:
      - Функции потерь; экспоненциальное скользящее среднее; SGD, momentum, Adam — свои реализации
      - Инициализация; затухающие градиенты; устойчивые вычисления (log-sum-exp)
    - id: dl1.torch
      title: Открытие PyTorch и практика
      requires: [dl1.training, prog5.lowlevel]
      topics:
      - Тензоры, nn.Module, DataLoader, цикл обучения
      - Регуляризация, нормализация, отладка обучения; GPU и бесплатные Kaggle/Colab
      - Смешанная точность — float16, bfloat16, int8
    - id: dl1.hardware
      title: Железо для обучения
      requires: [dl1.torch, prog5.lowlevel]
      topics:
      - Почему нейросети учат на GPU и ускорителях, а не на CPU
      - Память — VRAM и HBM, пропускная способность; поместится ли модель в видеокарту
      - Обучение на нескольких видеокартах — идея DDP и FSDP; контрольные точки

  - id: dl2
    subject: dl
    level: 2
    title: Компьютерное зрение
    hours: 30
    summary: Свёртки своими руками, архитектуры CNN, аугментация изображений и генеративные модели.
    sections:
    - id: dl2.conv
      title: Свёрточные сети
      requires: [dl1.hardware]
      topics:
      - Свёртка с нуля; пулинг; от LeNet до ResNet
    - id: dl2.practice
      title: Практика зрения
      requires: [dl2.conv, data2.features]
      topics:
      - Аугментация изображений; transfer learning; детекция и сегментация (обзор)
    - id: dl2.generative
      title: Генеративные модели (обзор)
      requires: [dl2.practice]
      topics:
      - Автокодировщики и VAE; GAN; диффузия — идея

  - id: dl3
    subject: dl
    level: 3
    title: Тексты и эмбеддинги
    hours: 25
    summary: Как текст становится числами — токенизация, TF-IDF и эмбеддинги.
    sections:
    - id: dl3.text
      title: Текст как данные
      requires: [dl1.torch, prog1.text_files]
      topics:
      - Своя токенизация BPE; TF-IDF с нуля
      - Аугментация текстов
    - id: dl3.embeddings
      title: Эмбеддинги
      requires: [dl3.text]
      topics:
      - word2vec; «король − мужчина + женщина»; контрастивное обучение
      - RNN — коротко, и почему их заменили

  - id: dl4
    subject: dl
    level: 4
    title: Трансформеры
    hours: 35
    unlocks: [Hugging Face Transformers]
    summary: Как устроен трансформер — от механизма внимания до своего мини-GPT и чтения научных статей.
    sections:
    - id: dl4.attention
      title: Внимание и трансформер
      requires: [dl3.embeddings, ml1.logistic]
      topics:
      - Внимание с нуля; self-attention; multi-head; позиционное кодирование синусами
      - Свой мини-GPT на CPU; температура и сэмплирование
      - KV-кэш — почему генерация ускоряется
    - id: dl4.hf
      title: Открытие Hugging Face
      requires: [dl4.attention]
      topics:
      - BERT и GPT-семейства; дообучение классификатора; русскоязычные модели
      - Мультимодальные модели — CLIP, VLM, речь (обзор)
    - id: dl4.papers
      title: Как читать научные статьи
      requires: [dl4.hf, eng3.vocab]
      topics:
      - Чтение статьи в три прохода
      - Воспроизводим небольшую работу

  - id: eng4
    subject: eng
    level: 4
    title: Письменная коммуникация
    hours: 8
    summary: Описать проблему, задачу и решение по-английски — issue, pull request, README, письмо заказчику.
    sections:
    - id: eng4.vocab
      title: Письменная коммуникация
      requires: [eng3.vocab]
      topics:
      - Issue и pull request; описание бага
      - README и техническое письмо заказчику

  - id: db4
    subject: db
    level: 4
    title: Хранилища для ИИ
    hours: 20
    summary: Где хранить векторы, документы и кэш — векторные базы и нереляционные хранилища.
    sections:
    - id: db4.vector
      title: Векторные базы данных
      requires: [db3.python, algo5.neighbors, dl3.embeddings, infra3.compose]
      topics:
      - Хранение эмбеддингов; pgvector; Qdrant
      - Индексы HNSW и IVF; точность против скорости
    - id: db4.nosql
      title: Нереляционные хранилища
      requires: [db4.vector]
      topics:
      - Ключ-значение и кэш (Redis); документные базы; когда что выбирать

  - id: ai1
    subject: ai
    level: 1
    title: Большие языковые модели
    hours: 35
    unlocks: [PEFT, Ollama, vLLM]
    summary: Как из языковой модели получается ассистент и как работать с LLM как инженер — API, дообучение, оценка, запуск.
    sections:
    - id: ai1.usage
      title: LLM в работе
      requires: [dl4.hf]
      topics:
      - API, промптинг, структурированный вывод, вызов инструментов
    - id: ai1.pipeline
      title: Как делают ассистента
      requires: [ai1.usage, exp1.analysis]
      topics:
      - Основы обучения с подкреплением — среда, награда, MDP, Q-learning и policy gradient (интуиция)
      - Предобучение → дообучение на инструкциях (SFT) → RLHF и DPO
      - "Почему модель умная не только из-за числа параметров — данные, архитектура (смесь экспертов), дообучение и вычисления во время ответа: рассуждение, самопроверка, запуск тестов"
    - id: ai1.finetune
      title: Дообучение
      requires: [ai1.pipeline]
      topics:
      - LoRA — связь с низкоранговым приближением; когда дообучать, а когда хватит промпта
      - Квантование — как модель «сжимают» в 8 и 4 бита и что при этом теряется
      - Дистилляция — большая модель-учитель обучает маленькую на своих распределениях ответов, а не только на правильных метках
      - Практика — дообучаем небольшую открытую модель с LoRA на своей задаче
    - id: ai1.local
      title: Своя модель на своём компьютере
      requires: [ai1.finetune, dl1.hardware]
      topics:
      - Ollama — ставим небольшую открытую модель и общаемся с ней через API
      - Параметры генерации на практике — температура, top-p, длина ответа
      - Контекстное окно — сколько модель «помнит» и во что это обходится по памяти; нагрузка на видеокарту и процессор
    - id: ai1.eval
      title: Оценка и запуск
      requires: [ai1.local]
      topics:
      - Золотые наборы, регрессионные тесты, LLM как оценщик; трассировка
      - Инференс, vLLM, батчинг; русскоязычные LLM; стоимость и задержки

  - id: ai2
    subject: ai
    level: 2
    title: Поиск, RAG и агенты
    hours: 40
    unlocks: [LangChain, LlamaIndex, Gradio]
    summary: Свой поисковик, свой RAG и свой агент — сначала без фреймворков.
    sections:
    - id: ai2.search
      title: Информационный поиск
      requires: [ai1.eval, db4.vector]
      topics:
      - Инвертированный индекс; BM25 с нуля
      - Векторный и гибридный поиск; реранкинг; двухбашенные модели
    - id: ai2.rag
      title: RAG с нуля
      requires: [ai2.search]
      topics:
      - Чанкинг, эмбеддинги, хранилище, сборка контекста, ответ с цитатами
      - Оценка — recall@k, достоверность; анализ ошибок; фреймворки после своей реализации
      - Демо-интерфейс — сначала своя HTML-форма, затем Gradio или Streamlit
    - id: ai2.agents
      title: Агенты
      requires: [ai2.rag, prog4.mcp, db4.nosql]
      topics:
      - Цикл агента; инструменты через MCP; память и планирование
      - Промпт-инъекции, ограничения, стоимость, наблюдаемость
      - Оценка агентов — траектории и успешность задач; контекст-инжиниринг и кэширование промптов
      - Модели с рассуждением — когда за размышление стоит платить

  - id: sec1
    subject: sec
    level: 1
    title: Безопасность и этика ИИ
    hours: 15
    summary: Как не навредить — безопасность приложений и данных, законы о персональных данных и ответственный ИИ.
    sections:
    - id: sec1.security
      title: Безопасность приложений
      requires: [ai2.agents]
      topics:
      - Основы OWASP — инъекции, аутентификация, секреты
      - Цепочка поставок — зависимости и модели из интернета
      - Промпт-инъекции и утечки через LLM
    - id: sec1.ethics
      title: Данные, право и этика
      requires: [sec1.security]
      topics:
      - Персональные данные — 152-ФЗ, GDPR; обзор регулирования ИИ
      - Справедливость и смещения моделей; лицензии данных и моделей

  - id: practice3
    subject: practice
    level: 3
    title: Проектная практика
    hours: 30
    summary: Задачи как на работе — бриф заказчика, сроки, ревью кода и демонстрация результата.
    sections:
    - id: practice3.cases
      title: Кейсы
      requires: [sec1.ethics, practice2.cases]
      topics:
      - Классификатор обращений поддержки для «интернет-магазина»
      - Ассистент по базе знаний для «компании» — RAG в контейнере
      - Тестовые задания ML и AI-инженера с реальных отборов

# ═══════════════════════════════════════════════════════════════════
- id: VI
  title: Продакшен и большие данные
  tagline: Развёртывание, эксплуатация, большие данные, проектирование систем и выход на работу
  project: >-
    Дипломный проект: end-to-end система — пайплайн данных → модель → сервис в Docker и Kubernetes → CI → мониторинг. Живой деплой на своём сервере, дизайн-документ, постмортем инцидента, статья с разбором. Защита как ML System Design.
  disciplines:

  - id: prog6
    subject: prog
    level: 6
    title: Архитектура программ
    hours: 20
    summary: Как устроены большие кодовые базы — паттерны, слои, ревью кода, в том числе написанного ИИ.
    sections:
    - id: prog6.patterns
      title: Паттерны и архитектура
      requires: [prog5.lowlevel, practice3.cases]
      topics:
      - Паттерны проектирования, которые реально встречаются
      - Слоистая и чистая архитектура; зависимости между модулями
    - id: prog6.review
      title: Ревью и сопровождение
      requires: [prog6.patterns]
      topics:
      - Код-ревью, в том числе кода, написанного ИИ; документация; технический долг

  - id: algo6
    subject: algo
    level: 6
    title: Подготовка к алгоритмическим собеседованиям
    hours: 30
    summary: Все приёмы вперемешку, на время и с устным объяснением — как на настоящем отборе.
    sections:
    - id: algo6.contest
      title: Контесты и разборы
      requires: [algo5.parallel]
      topics:
      - Распознавание паттерна задачи; контесты на время
      - Устное объяснение решения и сложности
      - Разбор задач с реальных собеседований

  - id: infra4
    subject: infra
    level: 4
    title: Развёртывание и эксплуатация
    hours: 25
    summary: Сервис, который живёт сам — автоматический деплой, логи, метрики, бэкапы и реакция на сбои.
    sections:
    - id: infra4.cicd
      title: Автоматическое развёртывание
      requires: [infra3.compose, vcs1.remote, prog3.quality]
      topics:
      - CI/CD на GitHub Actions — от коммита до сервера
      - Секреты; переменные окружения; откаты
      - Реестр контейнеров
    - id: infra4.ops
      title: Эксплуатация
      requires: [infra4.cicd]
      topics:
      - Логи и метрики (Prometheus, Grafana); алерты
      - Бэкапы и восстановление; инциденты и постмортемы

  - id: infra5
    subject: infra
    level: 5
    title: Оркестрация и облака
    hours: 25
    summary: Kubernetes и облака — как запускают десятки сервисов и масштабируют их.
    sections:
    - id: infra5.k8s
      title: Kubernetes
      requires: [infra4.ops]
      topics:
      - Pod, Deployment, Service, ConfigMap; манифесты; масштабирование; Helm
    - id: infra5.hardware
      title: Серверы для ИИ
      requires: [infra5.k8s, dl1.hardware, ai1.eval]
      topics:
      - Серверы и стойки; связь между ускорителями
      - Аренда против покупки; стоимость обучения и инференса
    - id: infra5.cloud
      title: Облака
      requires: [infra5.k8s]
      topics:
      - Облачные сервисы; объектные хранилища (S3, MinIO); стоимость
      - Права доступа в облаке (IAM); аренда облачных GPU

  - id: mlops1
    subject: mlops
    level: 1
    title: ML-сервисы
    hours: 30
    summary: Модель как сервис — сервинг, тесты, трекинг экспериментов и версии данных.
    sections:
    - id: mlops1.serving
      title: Сервинг моделей
      requires: [infra5.cloud, dl1.torch]
      topics:
      - Сервис модели; батчинг, кэш, ONNX; нагрузочное тестирование
    - id: mlops1.tracking
      title: Эксперименты и версии
      requires: [mlops1.serving]
      topics:
      - MLflow — эксперименты и реестр моделей; DVC

  - id: de1
    subject: de
    level: 1
    title: Распределённые вычисления
    hours: 30
    unlocks: [Apache Spark]
    summary: Что делать, когда данные не помещаются в один компьютер — свой MapReduce, а затем Spark.
    sections:
    - id: de1.distributed
      title: Основы распределённых систем
      requires: [algo5.parallel, prog5.concurrency]
      topics:
      - Параллелизм и распределённость; репликация, партиционирование, CAP
      - Время в распределённых системах — часы Лэмпорта, согласованность
      - MapReduce своими руками
    - id: de1.spark
      title: Spark
      requires: [de1.distributed]
      topics:
      - DataFrame, ленивые вычисления, партиции, shuffle, Spark SQL

  - id: de2
    subject: de
    level: 2
    title: Хранилища и потоки данных
    hours: 30
    summary: Хранилища данных, потоки событий и оркестрация пайплайнов — работа инженера данных.
    sections:
    - id: de2.storage
      title: Хранилища данных
      requires: [de1.spark, db2.olap, db3.design]
      topics:
      - Data lake, DWH, lakehouse; звезда и SCD
      - ClickHouse — MergeTree, ключ сортировки, партиции, материализованные представления
    - id: de2.streaming
      title: Потоки
      requires: [de2.storage, infra3.compose]
      topics:
      - Kafka; события и окна
    - id: de2.orchestration
      title: Оркестрация и качество
      requires: [de2.streaming, infra3.compose]
      topics:
      - Airflow; dbt; проверки качества и контракты данных; feature store

  - id: mlops2
    subject: mlops
    level: 2
    title: Пайплайны и мониторинг моделей
    hours: 20
    summary: Модель, которая не деградирует незаметно — пайплайны обучения, дрейф и переобучение.
    sections:
    - id: mlops2.monitoring
      title: Пайплайны и мониторинг
      requires: [de2.orchestration, mlops1.tracking, infra4.ops, prob2.inference]
      topics:
      - Воспроизводимые пайплайны обучения
      - Дрейф данных (PSI, тест Колмогорова–Смирнова); мониторинг качества; переобучение

  - id: mlsd1
    subject: mlsd
    level: 1
    title: Проектирование ML-систем
    hours: 40
    summary: Как спроектировать систему с моделью внутри — формат секции ML System Design.
    sections:
    - id: mlsd1.method
      title: Метод
      requires: [mlops2.monitoring, ml3.recsys, ml3.timeseries, ai2.agents, exp1.causal, mlops1.serving]
      topics:
      - Требования, данные, метрики, модель, сервинг, мониторинг
      - Теория очередей — нагрузка, пропускная способность, закон Литтла
      - Оценка нагрузки, задержек и стоимости; дизайн-документ
    - id: mlsd1.cases
      title: Кейсы
      requires: [mlsd1.method]
      topics:
      - Рекомендации; поиск и ранжирование; антифрод; RAG-ассистент; прогноз спроса

  - id: practice4
    subject: practice
    level: 4
    title: Преддипломная практика
    hours: 40
    summary: Несколько недель «работы в команде» — задачи из трекера, ревью, дежурство и инцидент.
    sections:
    - id: practice4.job
      title: Симуляция работы
      requires: [mlsd1.cases]
      topics:
      - Задачи из трекера с приоритетами и сроками
      - Ревью кода «коллеги»; дежурство и разбор инцидента
      - Общение с «заказчиком» и презентация результата

  - id: eng5
    subject: eng
    level: 5
    title: Устная речь и собеседование
    hours: 8
    summary: Рассказать о своих проектах и пройти собеседование на английском.
    sections:
    - id: eng5.vocab
      title: Устная речь и собеседование
      requires: [eng4.vocab]
      topics:
      - Рассказ о своём проекте
      - Техническое собеседование на английском — пробные раунды

  - id: career2
    subject: career
    level: 2
    title: Выход на рынок
    hours: 20
    summary: Резюме, портфолио, собеседования и первые недели на работе.
    sections:
    - id: career2.communication
      title: Коммуникация
      requires: [practice4.job, career1.internship]
      topics:
      - Презентация результатов людям без технического бэкграунда
      - Технический текст — README, статья
    - id: career2.jobsearch
      title: Поиск работы
      requires: [career2.communication]
      topics:
      - Резюме и портфолио — финальная версия
      - Поведенческое интервью; разбор своих проектов вслух

graduation:
  title: Выпуск
  parts:
  - Государственный экзамен — мок-собеседование в формате бигтеха (контест, алгоритмы, ML-теория, вероятности и статистика, SQL, ML System Design устно с Claude)
  - Защита дипломного проекта

# Ключевые темы, для которых строятся деревья предпосылок (docs/dev/prerequisite-trees.md)
trees:
  - ai2.rag
  - ai2.agents
  - dl4.attention
  - dl1.backprop
  - db4.vector
  - ml2.trees
  - exp1.analysis
  - infra4.cicd
  - de1.spark
  - mlsd1.cases
