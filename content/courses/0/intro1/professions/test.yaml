title: Контрольная раздела «Профессии и задачи»
pass: 0.85
minutes: 30
questions:
- id: s-who-pipeline
  type: single
  q: Аналитики жалуются, что данные о заказах в хранилище приходят с опозданием на двое суток и с дублями. Кто должен это исправить?
  options:
  - Дата-сайентист
  - AI-инженер
  - Инженер данных
  - Продакт-менеджер
  answer: 2
  explain: Доставка и качество данных в хранилище — зона инженера данных.
- id: s-roles-match
  type: multi
  q: Выберите верные пары «роль — что она сдаёт как результат».
  options:
  - Аналитик данных — выводы, отчёты и итоги экспериментов
  - ML-инженер — модель, которая надёжно работает внутри продукта
  - MLOps-инженер — модели-прототипы в ноутбуках для руководства
  - AI-инженер — ассистент на основе готовой языковой модели с измеренным качеством
  answer:
  - 0
  - 1
  - 3
  explain: MLOps строит платформу для обучения, выкатки и мониторинга моделей, а не прототипы.
- id: s-ai-vs-ml
  type: single
  q: Чем работа AI-инженера чаще всего отличается от работы ML-инженера?
  options:
  - AI-инженер почти не пишет код и только подбирает запросы к модели, ML-инженер программирует
  - AI-инженер обучает языковые модели с нуля, ML-инженер берёт готовые модели и встраивает их
  - ML-инженер работает только с таблицами, AI-инженер — только с картинками и видео
  - AI-инженер строит продукт вокруг готовой языковой модели, ML-инженер внедряет модели, обученные в компании
  answer: 3
  explain: Граница размыта, но в центре работы AI-инженера — готовая языковая модель и система вокруг неё; обучать такую
    модель с нуля слишком дорого. Кода AI-инженер при этом пишет много.
  traps:
  - 1
- id: s-vacancy
  type: single
  q: 'Две вакансии называются «ML Engineer». В первой задачи такие: строить отчёты и считать метрики продаж. Во второй — выводить
    модели в продакшен и следить за их работой. Какой вывод разумнее всего?'
  options:
  - Первая вакансия — для новичков, вторая — для опытных ML-инженеров
  - Первая по сути о работе аналитика, вторая — ML-инженера; судить нужно по задачам
  - Раз название совпадает, это одна и та же работа, просто описанная разными словами
  - Выбирать стоит ту, где зарплата выше, — там больше работы с моделями
  answer: 1
  explain: Названия должностей у компаний разные; содержание работы видно по задачам. Аналитик — отдельная специализация,
    а не ступень перед ML-инженером.
- id: s-first-step
  type: single
  q: 'Владелец сети кофеен говорит: «Хочу ИИ, чтобы выручка росла». С чего правильно начать?'
  options:
  - Выбрать модель посложнее, чтобы она наверняка сработала
  - Собрать все доступные данные и обучить на них нейросеть
  - Выяснить, что предсказывать, что делать с прогнозом и как мерить успех
  - Сразу запустить A/B-тест и посмотреть, растёт ли выручка
  answer: 2
  explain: Сначала просьбу переводят в конкретный прогноз, действие по нему и метрику. Без этого непонятно, что строить и
    что тестировать.
- id: s-task-type
  type: single
  q: Онлайн-кинотеатр решает, в каком порядке показать пользователю фильмы на главной странице. К какому типу задач это относится
    и кто чаще всего её решает?
  options:
  - Кластеризация; аналитик данных
  - Ранжирование; дата-сайентисты и ML-инженеры
  - Регрессия; инженер данных
  - Генерация; AI-инженер
  answer: 1
  explain: Упорядочить объекты под человека — ранжирование (рекомендации). Модели строят и внедряют DS и ML-инженеры.
- id: s-no-ml
  type: single
  q: Сервис доставки решает, брать ли плату за доставку. Правило уже есть и всех устраивает — бесплатно от 1500 ₽. Нужна
    ли здесь модель?
  options:
  - Да, модель всегда лучше правила
  - Да, модель учтёт больше факторов, чем правило
  - Нет, правило известно, простое и точное
  - Нет, потому что машинное обучение не работает с деньгами
  answer: 2
  explain: Когда правило известно и просто, модель добавит только сложность и ошибки.
- id: s-baseline
  type: single
  q: Новая модель рекомендаций обгоняет правило «показывать самое популярное» на доли процента, а поддерживать её дорого.
    Какое решение разумно обсудить?
  options:
  - Оставить простое правило или проверить A/B-тестом, окупается ли модель
  - Внедрить модель — сложнее значит лучше
  - Отказаться от рекомендаций совсем
  - Сделать модель ещё сложнее, пока разрыв не станет большим
  answer: 0
  explain: Базовое решение — мерило. Если выигрыш мал, а стоимость велика, модель может не окупиться; проверяют это экспериментом.
- id: s-monitoring-owner
  type: multi
  q: Модель оценки заёмщиков через полгода стала ошибаться чаще. Выберите верные утверждения.
  options:
  - Вероятная причина — изменились клиенты или условия, то есть данные
  - Заметить это должен мониторинг, а не жалобы клиентов
  - Автоматическое переобучение и мониторинг — типичная зона MLOps или ML-инженера
  - Раз модель стала ошибаться, машинное обучение для оценки заёмщиков не подходит
  answer:
  - 0
  - 1
  - 2
  explain: Данные со временем меняются — это нормальная часть жизни модели. Падение качества ловят мониторингом и лечат переобучением.
  traps:
  - 3
- id: s-ab
  type: single
  q: Новая модель оттока точнее старой на отложенных данных. Как узнать, принесёт ли она пользу бизнесу?
  options:
  - Точнее на отложенных данных — значит, полезнее, проверять больше нечего
  - Спросить мнение дата-сайентиста, который её строил
  - Сравнить в A/B-тесте метрику бизнеса у групп, где работает старая и новая модель
  - Посмотреть, насколько модель сложнее старой
  answer: 2
  explain: Метрика модели и метрика бизнеса — разные вещи. Эффект на бизнес проверяют экспериментом — A/B-тестом.
- id: s-notebook
  type: single
  q: Вы нашли в ноутбуке удачное улучшение модели. Что сделать, чтобы оно оказалось в продукте?
  options:
  - Отправить ноутбук коллегам, чтобы они запускали его каждый день
  - Перенести код в общий проект, добавить тесты и открыть pull request на ревью
  - Скопировать ноутбук на сервер продукта
  - Записать результат в трекер, код переносить не обязательно
  answer: 1
  explain: Код для продукта живёт в общем проекте, с тестами и ревью; ноутбук — инструмент исследования.
- id: s-link-team
  type: multi
  q: 'Банк запускает чат-ассистента, который отвечает клиентам по документам банка. Кто из перечисленных, скорее всего, будет
    участвовать? Выберите все подходящие.'
  options:
  - AI-инженер — строит систему вокруг языковой модели и поиска по документам
  - Продакт-менеджер — решает, какие вопросы клиентов ассистент закрывает в первую очередь
  - Инженер данных — следит, чтобы актуальные документы регулярно попадали в систему
  - MLOps-инженер — обучает для ассистента собственную языковую модель с нуля
  answer:
  - 0
  - 1
  - 2
  explain: Даже продукт на готовой языковой модели делает команда — с продуктовой ролью, данными и инженерией. Обучать
    свою языковую модель с нуля для этого не нужно — берут готовую.
- id: s-open-path
  type: open
  q: 'Выберите одну задачу бизнеса — например, защиту от мошенников в банке или прогноз спроса в магазине. Пройдите путь: проблема → данные
    → модель → метрика → внедрение → мониторинг. Для каждого шага назовите, кто из специалистов за него в основном отвечает.'
  rubric:
  - задача конкретна, верно указан тип (классификация, регрессия, ранжирование и т. д.)
  - на каждом шаге сказано, что происходит (данные и правильные ответы, базовое решение, метрика модели и бизнеса, способ
    внедрения, причина для мониторинга)
  - роли распределены разумно — инженер данных на данных, DS на модели и метрике, ML-инженер на внедрении, MLOps или MLE
    на мониторинге, аналитик или A/B-тест на оценке пользы
  - засчитывается полностью, если пропущено не больше одного шага и роли не перепутаны
  wrong_answers:
  - мониторинг не нужен, если модель хорошо обучена
  - AI-инженер отвечает за все шаги любой задачи
  followups:
  - Какое базовое решение без ML вы бы попробовали первым?
  - Что изменится, если всё это делает один человек в стартапе?
  explain: Используйте путь задачи из второй темы и роли из первой.
- id: s-open-choose
  type: open
  q: Какая из шести профессий кажется вам сейчас самой интересной? Опишите, что этот специалист делает каждый день, какой
    результат сдаёт и с какими ролями сильнее всего взаимодействует. Затем назовите одну задачу, где правильный ответ этого
    специалиста — «модель не нужна».
  rubric:
  - верно описаны обязанности и результат выбранной роли
  - названы соседние роли и как они взаимодействуют (например, DS получает данные от инженера данных и передаёт модель ML-инженеру)
  - приведён реалистичный пример, где ML не нужно, с объяснением (простое правило, нет данных, нечем ответить на прогноз,
    базовое решение достаточно хорошо)
  wrong_answers:
  - описание роли совпадает с другой ролью (например, аналитик выкатывает модели в продакшен)
  - ML не нужно никогда, потому что модели ошибаются
  followups:
  - Чем день этого специалиста отличается от дня соседней роли?
  - Какую задачу в этой роли мог бы получить джуниор в первые месяцы?
  explain: Первая тема — роли и как они передают работу, вторая — когда ML не нужно, третья — рабочий день и задачи джуниора.
