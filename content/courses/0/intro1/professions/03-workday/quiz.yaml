title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: day-share
  type: single
  q: Из чего обычно складывается большая часть рабочего дня дата-сайентиста или ML-инженера?
  options:
  - Почти целиком из обучения моделей и подбора их настроек
  - Из работы с данными, кода, проверки результатов и общения с коллегами
  - В основном из чтения научных статей и пересказа их команде
  - Из подготовки презентаций и отчётов для руководства
  answer: 1
  explain: Обучение модели — небольшая часть дня. Основное время уходит на данные, код, проверки и согласование с командой.
- id: product-manager
  type: single
  q: Команда спорит, что делать в следующем спринте — ускорить поиск или улучшить рекомендации. Кто в продуктовой команде
    принимает такое решение?
  options:
  - Тимлид, потому что он руководит разработчиками
  - Самый опытный ML-инженер
  - Продакт-менеджер
  - Аналитик, потому что у него есть цифры
  answer: 2
  explain: Что делать и в каком порядке, решает продакт-менеджер. Аналитик даёт для этого цифры, тимлид отвечает за то, как
    команда это сделает.
- id: notebook-vs-prod
  type: multi
  q: Какие утверждения о ноутбуках и коде для продукта верны? Выберите все.
  options:
  - Ноутбук удобен, чтобы быстро пробовать идеи и смотреть на графики
  - Удачный эксперимент из ноутбука переносят в код общего проекта с тестами
  - Ноутбук легко запустить в любом порядке ячеек и получить тот же результат
  - Код, который работает в продукте каждый день, обычно не живёт в ноутбуке
  answer:
  - 0
  - 1
  - 3
  explain: Ячейки ноутбука запускают в произвольном порядке, поэтому результат часто невозможно повторить. Для продукта код
    переносят в общий проект.
  traps:
  - 2
- id: code-review
  type: single
  q: Что такое код-ревью?
  options:
  - Автоматическая проверка, что код запускается без ошибок
  - Проверка кода джуниора руководителем перед увольнением или повышением
  - Отчёт о том, сколько строк кода написал сотрудник
  - Чтение изменений кода коллегой перед тем, как они попадут в общий код
  answer: 3
  explain: Код-ревью — это когда код изучает кто-то кроме автора. Его проходят все, от джуниора до тимлида.
- id: pull-request
  type: single
  q: Вы закончили задачу в своей ветке Git. Что обычно делают дальше в команде?
  options:
  - Открывают pull request и ждут, пока коллега проверит изменения
  - Сразу копируют свои файлы в общую папку на сервере
  - Отправляют изменённые файлы коллегам в рабочий чат
  - Удаляют ветку, чтобы она не мешала остальным
  answer: 0
  explain: Pull request — просьба влить изменения в общий код. Изменения попадают туда только после того, как их проверит
    коллега.
- id: tracker
  type: single
  q: Зачем команде трекер задач?
  options:
  - Чтобы хранить в нём код проекта и историю его изменений
  - Чтобы у каждой задачи были описание, исполнитель, срок и статус, видные всей команде
  - Чтобы руководитель оценивал сотрудников по числу закрытых задач
  - Чтобы запускать в нём обучение моделей по расписанию
  answer: 1
  explain: Трекер делает работу видимой и общей. Код и история его изменений хранятся в Git, а не в трекере.
- id: experiments-log
  type: single
  q: Зачем записывать параметры и результаты каждого эксперимента с моделью?
  options:
  - Чтобы позже понять, какая версия модели была лучшей и почему, и повторить её
  - Этого требует только руководство для отчётности
  - Чтобы при следующем запуске модель обучалась быстрее
  - Записывать не нужно — лучшая модель всегда последняя
  answer: 0
  explain: Без записей через пару недель невозможно восстановить, что и с какими настройками давало лучший результат.
- id: junior-tasks
  type: multi
  q: Какие задачи типичны для джуниора в первые месяцы? Выберите все подходящие.
  options:
  - Проверить данные SQL-запросом и найти, почему цифры не сходятся
  - Самостоятельно выбрать стратегию развития ML в компании
  - Добавить признак в существующую модель и честно сравнить качество
  - Перенести код из ноутбука в общий проект и написать тесты
  answer:
  - 0
  - 2
  - 3
  explain: От джуниора ждут аккуратного решения понятных задач. Стратегию определяют старшие коллеги и руководство.
- id: ai-assistant
  type: single
  q: Как разумно пользоваться ИИ-ассистентом для программирования?
  options:
  - Принимать его код без проверки — он ошибается реже человека
  - Не пользоваться совсем — в компаниях это запрещено
  - Использовать как ускоритель, но понимать и проверять каждую строку, за которую отвечаете
  - Поручать ему задачи, в которых вы сами не разбираетесь, чтобы не тратить время
  answer: 2
  explain: Ассистент ошибается уверенно; заметить ошибку может только тот, кто понимает, что код должен делать.
- id: workday-open
  type: open
  q: 'Вы начинающий дата-сайентист. Модель, которую вы улучшали, после переноса кода из ноутбука в общий проект стала давать худшее
    качество, чем в ноутбуке. Опишите, что вы будете делать, к кому обратитесь и как сформулируете вопрос коллеге.'
  rubric:
  - сначала проверить самому — порядок ячеек в ноутбуке, данные, пути, случайность; сравнить шаги
  - обратиться к старшему коллеге или наставнику, не затягивая надолго
  - вопрос конкретный — что делали, что ожидали, что получили, что уже проверили
  - отметить задачу и проблему в трекере или на стендапе, честно сказать о сроках
  wrong_answers:
  - оставить код в ноутбуке, раз там работает
  - молча разбираться неделю, никому не говоря
  followups:
  - Почему результат в ноутбуке вообще мог оказаться неверным?
  - Как сделать так, чтобы эксперимент можно было повторить через месяц?
  explain: Сравните со страницами «Код, ноутбуки и ревью» и «Что на самом деле делает джуниор».
