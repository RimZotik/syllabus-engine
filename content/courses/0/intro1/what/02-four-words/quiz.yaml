title: Проверка темы
pass: 0.85
minutes: 15
questions:
  - id: object
    type: single
    q: В таблице проданных квартир что является одним объектом?
    options:
      - Столбец «Площадь»
      - Одна строка — одна квартира
      - Вся таблица
      - Цена
    answer: 1
    explain: Объект — то, о чём делается предсказание. В таблице это строка.

  - id: features
    type: multi
    q: Модель предсказывает цену квартиры. Что из этого — признаки?
    options:
      - Площадь
      - Цена
      - Этаж
      - Время до метро
    answer: [0, 2, 3]
    explain: Цена — целевая переменная, то, что предсказываем. Остальное — признаки.

  - id: target
    type: single
    q: Банк хочет предсказывать, вернёт ли клиент кредит. Что здесь целевая переменная?
    options:
      - Возраст клиента
      - Доход клиента
      - Вернул клиент кредит или нет
      - Сумма кредита
    answer: 2
    explain: Целевая переменная — то, что модель должна предсказать.

  - id: params
    type: single
    q: В модели «цена = a × площадь + b» что такое a и b?
    options:
      - Признаки
      - Параметры, которые подбираются при обучении
      - Правильные ответы
      - Объекты
    answer: 1
    explain: Параметры — «ручки» модели. Признак здесь — площадь.

  - id: training
    type: single
    q: Что значит «обучить модель»?
    options:
      - Написать для неё правила
      - Подобрать её параметры так, чтобы ошибка на обучающих примерах стала минимальной
      - Показать ей новые данные без ответов
      - Увеличить число признаков
    answer: 1
    explain: Обучение — это подбор параметров по примерам с известными ответами.

  - id: loss-square
    type: single
    q: Зачем при подсчёте ошибки разницу между предсказанием и ответом возводят в квадрат?
    options:
      - Чтобы число получилось больше
      - Чтобы ошибки в большую и в меньшую сторону не гасили друг друга
      - Так требует формула площади
      - Чтобы модель быстрее работала
    answer: 1
    explain: Без квадрата ошибка «+1 млн» и «−1 млн» в сумме дали бы ноль, как будто модель идеальна.

  - id: generalization
    type: single
    q: Когда модель можно назвать хорошей?
    options:
      - Когда она безошибочно отвечает на обучающих примерах
      - Когда она хорошо отвечает на новых данных, которых не видела при обучении
      - Когда у неё очень много параметров
      - Когда она обучалась очень долго
    answer: 1
    explain: Цель — обобщение, то есть качество на новых данных.

  - id: overfit-sign
    type: single
    q: Ошибка модели на обучающих данных — почти ноль, на отложенных — огромная. Это признак…
    options:
      - недообучения
      - переобучения
      - идеальной модели
      - нехватки признаков в отложенных данных
    answer: 1
    explain: Модель запомнила обучающие примеры, а не закономерность.

  - id: holdout
    type: multi
    q: Какие утверждения о проверке модели верны?
    options:
      - Модель проверяют на примерах, которые она не видела при обучении
      - Проверка на обучающих примерах честно показывает качество
      - Часть данных откладывают заранее и не показывают модели при обучении
      - Переобучение видно только на отложенных данных
    answer: [0, 2, 3]
    explain: На обучающих примерах переобученная модель выглядит отлично, поэтому нужны отложенные данные.

  - id: feature-choice
    type: single
    q: В данных о квартирах нет сведений о ремонте. Что это значит для модели?
    options:
      - Модель догадается о ремонте по цене
      - Модель не сможет учесть ремонт, потому что видит квартиру только через признаки
      - Ремонт не влияет на цену
      - Модель добавит этот признак сама
    answer: 1
    explain: Модель знает об объекте только то, что записано в признаках.

  - id: params-scale
    type: single
    q: Чем модель для распознавания кошек на фото принципиально похожа на модель цены квартиры?
    options:
      - Ничем, это совершенно разные вещи
      - Обе — формулы с параметрами, которые подбираются по примерам
      - У обеих ровно два параметра
      - Обе работают только с числами из таблиц
    answer: 1
    explain: Масштаб разный — миллионы параметров против двух, — но принцип тот же.

  - id: explain-overfit
    type: open
    q: Объясните, что такое переобучение, на примере, не связанном с компьютерами. Как его заметить у модели?
    rubric:
      - переобучение — запоминание конкретных примеров вместо общей закономерности
      - пример из жизни, где запоминание подводит на новом случае
      - заметить можно по разрыву между качеством на обучающих и на отложенных данных
    explain: Вспомните пример с двумя студентами и правило отложенных данных.
