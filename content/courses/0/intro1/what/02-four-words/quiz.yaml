title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: object
  type: single
  q: Таблица проданных квартир. Что в ней соответствует одному объекту?
  options:
  - Один столбец, например «Площадь»
  - Запись об одной конкретной квартире
  - Таблица целиком
  - Значение цены в каждой строке
  answer: 1
  explain: Объект — то, о чём делается предсказание. В таблице это строка.
- id: features
  type: multi
  q: Модель оценивает, сколько минут займёт поездка на такси. Что из этого — признаки?
  options:
  - Расстояние поездки
  - Длительность поездки
  - Час дня
  - Погода
  answer:
  - 0
  - 2
  - 3
  explain: Длительность — то, что предсказываем (целевая переменная). Остальное — признаки.
- id: target
  type: single
  q: Банк хочет предсказывать, вернёт ли клиент кредит. Что здесь целевая переменная?
  options:
  - Возраст клиента
  - Доход клиента
  - Вернул клиент кредит или нет
  - Сумма кредита
  answer: 2
  explain: Целевая переменная — то, что модель должна предсказать.
- id: training
  type: single
  q: Что происходит, когда модель «обучают»?
  options:
  - Для неё пишут набор условий
  - Числа внутри неё настраивают, пока она не станет реже ошибаться на известных примерах
  - Ей дают новые данные без ответов и смотрят, что получится
  - В таблицу добавляют как можно больше столбцов
  - Подбирают признаки так, чтобы ошибка на обучающих примерах стала минимальной
  answer: 1
  explain: Обучение — это подбор параметров по примерам с известными ответами.
  traps:
  - 4
- id: loss-square
  type: single
  q: Зачем при подсчёте ошибки разницу между предсказанием и ответом возводят в квадрат?
  options:
  - Чтобы итоговое число выглядело внушительнее
  - Иначе промахи вверх и вниз могли бы взаимно уничтожиться при сложении
  - Потому что площадь измеряется в квадратных метрах
  - Чтобы модель быстрее работала
  answer: 1
  explain: Без квадрата ошибки «+1 млн» и «−1 млн» в сумме дали бы ноль, как будто модель идеальна. А ещё квадрат сильнее
    штрафует большие промахи.
- id: generalization
  type: single
  q: Какую модель стоит считать хорошей?
  options:
  - Ту, что без единой ошибки повторяет ответы на обучающих примерах
  - Ту, что точно отвечает на случаях, которых не было среди примеров для обучения
  - Ту, у которой больше всего параметров
  - Ту, которую обучали дольше всех
  answer: 1
  explain: Цель — обобщение, то есть качество на новых данных.
- id: overfit-sign
  type: single
  q: Ошибка модели на обучающих данных — почти ноль, на отложенных — огромная. Это признак…
  options:
  - недообучения
  - переобучения
  - идеальной модели
  - того, что в отложенных данных слишком мало признаков
  answer: 1
  explain: Модель запомнила обучающие примеры, а не закономерность.
- id: holdout
  type: multi
  q: Какие утверждения о проверке модели верны?
  options:
  - Качество модели оценивают на случаях, которых она не видела
  - Чем ниже ошибка на обучающих примерах, тем модель гарантированно лучше
  - Часть собранных данных заранее прячут от модели до проверки
  - Зубрёжку выдаёт большая разница между ошибкой на «своих» и на «чужих» примерах
  answer:
  - 0
  - 2
  - 3
  explain: Маленькая ошибка на обучении может означать зубрёжку — поэтому нужны отложенные данные.
- id: feature-choice
  type: single
  q: В данных о квартирах нет сведений о ремонте. Что из этого следует?
  options:
  - Модель сама вычислит, был ли ремонт, по другим столбцам
  - Модель не сможет учесть ремонт — о квартире она знает только то, что записано в таблице
  - Ничего — ремонт на цену не влияет
  - Модель попросит добавить нужный столбец
  answer: 1
  explain: Модель знает об объекте только то, что записано в признаках.
- id: params-scale
  type: single
  q: 'Модель: цена = 0,15 × площадь + 0,5 (млн ₽). Какую цену она предскажет для квартиры 40 м²?'
  options:
  - 6,0 млн
  - 6,5 млн
  - 4,0 млн
  - 20,5 млн
  answer: 1
  explain: 0,15 × 40 = 6,0; плюс 0,5 — получается 6,5 млн ₽. Числа 0,15 и 0,5 — параметры модели, площадь — признак.
- id: param-vs-feature
  type: single
  q: В модели «цена = 0,15 × площадь + 0,5» что меняется при обучении, а что — нет?
  options:
  - Меняются 0,15 и 0,5; площадь берётся из данных
  - Меняется площадь; 0,15 и 0,5 постоянны
  - Меняется всё
  - Не меняется ничего
  answer: 0
  explain: Параметры подбирает обучение, а признаки — свойства конкретной квартиры.
- id: explain-overfit
  type: open
  q: Объясните, что такое переобучение, на примере, не связанном с компьютерами. Как его заметить у модели?
  rubric:
  - переобучение — запоминание конкретных примеров вместо общей закономерности
  - пример не про компьютеры обязателен; зубрёжка билетов засчитывается, только если сказано, что на новом вопросе следует
    провал
  - заметить можно по разрыву между качеством на обучающих и на отложенных данных
  wrong_answers:
  - переобучение — когда модель обучали слишком долго (без объяснения, почему это плохо)
  - заметить можно по маленькой ошибке на обучающих данных
  followups:
  - Почему нельзя проверять модель на тех же примерах, на которых она училась?
  - Что бы вы сделали, заметив переобучение?
  explain: Вспомните пример с двумя студентами и правило отложенных данных.
