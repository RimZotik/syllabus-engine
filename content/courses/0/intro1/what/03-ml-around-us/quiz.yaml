title: Проверка темы
pass: 0.85
minutes: 15
questions:
- id: task-type-churn
  type: single
  q: Мобильный оператор хочет понять, уйдёт ли абонент в следующем месяце. Тип задачи?
  options:
  - Классификация
  - Регрессия
  - Кластеризация
  - Генерация
  answer: 0
  explain: Два возможных класса — «уйдёт» и «останется».
- id: task-type-demand
  type: multi
  q: 'Интернет-магазин ставит две задачи: (А) купит ли клиент что-нибудь на этой неделе; (Б) сколько рублей он потратит. Выберите
    верные утверждения.'
  options:
  - А — классификация
  - Б — регрессия
  - А — регрессия, потому что речь о деньгах
  - Обе задачи можно решать обучением с учителем, если есть история покупок
  answer:
  - 0
  - 1
  - 3
  explain: 'Тип задачи определяется тем, что предсказывается: «да/нет» — класс, сумма — число.'
- id: task-type-feed
  type: single
  q: Соцсеть решает, в каком порядке показать пользователю посты в ленте. Тип задачи?
  options:
  - Регрессия
  - Кластеризация
  - Ранжирование
  - Генерация
  answer: 2
  explain: Нужно упорядочить объекты под конкретного человека.
- id: task-type-images
  type: single
  q: Сервис предсказывает, какую оценку от 1 до 5 звёзд пользователь поставит фильму. Как можно сформулировать эту задачу?
  options:
  - Только как генерацию
  - И как классификацию (5 классов), и как регрессию (число)
  - Только как кластеризацию
  - Это не задача машинного обучения
  answer: 1
  explain: 'Граница между типами не всегда жёсткая: если важен порядок звёзд, удобнее регрессия, если нет — классификация.'
- id: supervised-which
  type: multi
  q: Какие задачи обычно решают обучением с учителем?
  options:
  - Фильтр спама по размеченным письмам
  - Поиск групп похожих покупателей без заранее известных групп
  - Оценка цены квартиры по архиву продаж
  - Распознавание цифр по картинкам с подписанными ответами
  answer:
  - 0
  - 2
  - 3
  explain: Везде, кроме групп покупателей, правильные ответы известны заранее.
- id: unsupervised-def
  type: single
  q: Чем обучение без учителя отличается от обучения с учителем?
  options:
  - В нём нет данных
  - В данных нет правильных ответов — модель ищет структуру сама
  - Им занимается только преподаватель
  - Оно всегда точнее
  answer: 1
  explain: Без учителя — значит без меток, только объекты.
- id: rl-def
  type: single
  q: Что отличает обучение с подкреплением?
  options:
  - Агент действует в среде и учится по награде за свои действия
  - Модель учится на таблице с ответами
  - Модель группирует объекты
  - Модель не учится вовсе
  answer: 0
  explain: Проба, награда или штраф, улучшение поведения.
- id: labeling
  type: single
  q: Откуда чаще всего берутся правильные ответы для обучения с учителем?
  options:
  - Модель придумывает их сама
  - Их размечают люди или они накапливаются в реальных событиях
  - Они всегда есть в интернете
  - Их не бывает
  answer: 1
  explain: Разметка людьми или «естественные» ответы (например, вернул ли клиент кредит).
- id: antifraud
  type: single
  q: У банка есть история операций, где каждая помечена как «мошенничество» или «нет». Он хочет за доли секунды оценивать
    новые операции. Тип задачи и способ обучения?
  options:
  - Регрессия, без учителя
  - Классификация, с учителем
  - Генерация, с подкреплением
  - Кластеризация, с учителем
  answer: 1
  explain: Два класса и размеченная история — классификация с учителем.
- id: around-us
  type: multi
  q: В каких примерах из «одного дня» работает модель машинного обучения?
  options:
  - Разблокировка телефона по лицу
  - Подсчёт суммы чека по ценам товаров
  - Оценка времени в пути навигатором
  - Рекомендации на маркетплейсе
  answer:
  - 0
  - 2
  - 3
  explain: Сумму чека считает обычная программа по простому правилу.
- id: own-example
  type: open
  q: Придумайте задачу из своей жизни или работы, которую можно решить машинным обучением. Укажите тип задачи, что будет объектом,
    какие признаки и что модель предсказывает.
  rubric:
  - задача реалистична и действительно требует обучения, а не простых правил
  - тип задачи определён верно
  - названы объект, хотя бы два признака и целевая переменная
  - отклонить, если задача решается простым правилом или если ответ неизвестен даже в прошлых данных
  wrong_answers:
  - признаком назван сам ответ
  - задача — посчитать сумму или проценты по формуле
  followups:
  - Откуда возьмутся правильные ответы для обучения?
  - Какой признак, по-вашему, самый полезный и почему?
  explain: Ориентируйтесь на страницу «Какие бывают задачи» и на таблицу квартир из прошлой темы.
