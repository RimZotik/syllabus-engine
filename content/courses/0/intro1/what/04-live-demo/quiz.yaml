title: Проверка темы
pass: 0.85
minutes: 12
questions:
  - id: knn-idea
    type: single
    q: Как метод k ближайших соседей предсказывает класс нового объекта?
    options:
      - Вычисляет формулу с обученными параметрами
      - Выбирает самый частый класс среди k ближайших обучающих примеров
      - Выбирает случайный класс
      - Спрашивает человека
    answer: 1
    explain: «Скажи мне, кто твои соседи».

  - id: coords
    type: single
    q: Если точка на плоскости — это клиент, то что такое её координаты?
    options: [Целевая переменная, Признаки клиента, Параметры модели, Номер клиента]
    answer: 1
    explain: Координаты — признаки, например возраст и доход.

  - id: k-small
    type: single
    q: Что происходит, если взять k = 1?
    options:
      - Модель становится максимально устойчивой
      - Модель верит каждому отдельному примеру и легко переобучается на случайных точках
      - Модель перестаёт работать
      - Граница становится прямой линией
    answer: 1
    explain: Одна «чужая» точка создаёт вокруг себя целую область.

  - id: k-large
    type: single
    q: Что происходит, если k сделать очень большим?
    options:
      - Модель замечает мельчайшие детали
      - Модель всё сильнее усредняет и перестаёт замечать детали
      - Ничего не меняется
      - Модель начинает генерировать новые точки
    answer: 1
    explain: При огромном k почти любая точка получает самый частый класс во всём наборе.

  - id: hyperparam
    type: single
    q: Чем гиперпараметр отличается от параметра модели?
    options:
      - Ничем
      - Гиперпараметр выбирает человек до обучения, параметр подбирается в процессе обучения
      - Гиперпараметр — это признак
      - Гиперпараметр всегда больше параметра
    answer: 1
    explain: Число k задаём мы, а a и b в модели цены подбирает обучение.

  - id: lazy
    type: single
    q: Почему метод ближайших соседей называют «ленивым»?
    options:
      - Он медленно учится
      - Он ничего не вычисляет заранее и работает, только когда приходит новый объект
      - Он часто ошибается
      - Он не использует данные
    answer: 1
    explain: Всё «знание» — сами примеры; вычисления происходят при предсказании.

  - id: more-data
    type: multi
    q: Какие выводы можно сделать из демонстрации?
    options:
      - С двумя примерами модель почти ничего не знает о настоящей границе
      - Чем больше хороших примеров, тем точнее граница
      - Модели нужны правила, написанные человеком
      - Модель может найти извилистую границу, которую трудно описать правилом
    answer: [0, 1, 3]
    explain: Правила модели не нужны — она учится на точках.

  - id: modern-use
    type: single
    q: Где сегодня используется идея поиска ближайших соседей?
    options:
      - Только в учебниках
      - В поиске похожих товаров, песен и текстов, в RAG-ассистентах
      - Только в играх
      - Нигде, метод устарел
    answer: 1
    explain: Поиск похожих векторов — основа рекомендаций и RAG.

  - id: explain-tradeoff
    type: open
    q: Опишите, что вы наблюдали в демонстрации, меняя k от 1 до 9. Почему одинаково плохо и «верить каждому примеру», и «всё усреднять»?
    rubric:
      - при малом k модель реагирует на отдельные точки (островки), при большом граница сглаживается
      - малое k ведёт к переобучению на случайностях
      - большое k теряет детали настоящей закономерности
    explain: Вернитесь к странице «Что вы увидели».
