title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: rules-def
  type: single
  q: Чем обычная программа отличается от модели, обученной на примерах?
  options:
  - Обычная программа сама подстраивается под новые данные
  - Каждое правило обычной программы заранее придумал и записал человек
  - Обычная программа понимает смысл задачи, которую решает
  - Обычной программе тоже нужны примеры, просто их меньше
  answer: 1
  explain: Обычная программа выполняет правила, придуманные человеком; обученная — сама находит закономерность в примерах.
- id: algorithm
  type: multi
  q: Что из этого — алгоритмы? Выберите все.
  options:
  - 'Рецепт борща: «нарезать, обжарить, варить 40 минут»'
  - Таблица с ценами квартир
  - «Если сумма больше 5000 ₽, умножь на 0,9, иначе оставь как есть»
  - Фотография кошки
  - Инструкция по сборке шкафа
  answer:
  - 0
  - 2
  - 4
  explain: Алгоритм — последовательность шагов от входа к результату. Таблица и фото — это данные.
- id: when-ml
  type: multi
  q: В каких задачах машинное обучение обычно лучше правил? Выберите все подходящие.
  options:
  - Подсчёт стажа сотрудника по датам приёма и увольнения
  - Перевод голосового сообщения в текст
  - Выявление поддельных отзывов, которые всё время пишут по-новому
  - Расчёт стоимости доставки по таблице тарифов
  - Подбор музыки, которая понравится конкретному слушателю
  answer:
  - 1
  - 2
  - 4
  explain: Стаж и тарифы считаются по точным правилам. Речь, подделки и вкусы людей — задачи, где правила не сформулировать
    или они быстро устаревают.
- id: ml-input
  type: single
  q: Что чаще всего человек даёт компьютеру при машинном обучении вместо правил?
  options:
  - Готовую модель, которую обучил кто-то другой
  - Много случаев, для которых уже известен верный ответ
  - Подробную инструкцию, как решать задачу по шагам
  - Доступ в интернет, чтобы компьютер сам всё нашёл
  answer: 1
  explain: Обучение «с учителем» начинается с примеров, для которых ответ уже известен.
- id: ml-output
  type: single
  q: Что получается в результате обучения?
  options:
  - Таблица с новыми примерами и ответами
  - Модель, которая умеет отвечать на новые случаи, которых не было среди примеров
  - Набор условий «если — то», который составил инженер
  - Модель, которая знает ответы только для тех примеров, на которых училась
  answer: 1
  explain: Результат обучения — модель. Её ценность в том, что она отвечает на новых данных (хотя иногда и ошибается). Если
    бы она знала ответы только для обучающих примеров, она была бы бесполезна.
- id: ai-vs-ml
  type: single
  q: Как связаны искусственный интеллект и машинное обучение?
  options:
  - Это два названия одного и того же
  - Машинное обучение — один из подходов внутри ИИ, сегодня самый результативный
  - ИИ — небольшая часть машинного обучения, связанная с чат-ботами
  - ИИ — это только чат-ассистенты, а машинное обучение — всё остальное
  answer: 1
  explain: ИИ — широкая область, ML — её подход, в котором модели учатся на данных. Чат-ассистенты — лишь одно из применений.
- id: errors
  type: multi
  q: Какие утверждения о моделях машинного обучения верны?
  options:
  - Ошибки модели — нормальная часть подхода, а не поломка
  - В конечном счёте модель исполняется как обычный программный код
  - Решение модели всегда так же легко пояснить, как условие о скидке
  - На практике рядом с моделью ставят обычные проверки и ограничения
  - Хорошо обученной модели никакой дополнительный код не нужен
  - Модель никогда не ошибается — это заложено в саму идею обучения
  answer:
  - 0
  - 1
  - 3
  explain: Модель права «в большинстве случаев», поэтому её страхуют обычным кодом. Объяснить решение модели часто сложнее,
    чем правило.
  traps:
  - 5
- id: expert-systems
  type: single
  q: Почему экспертные системы 1970–80-х зашли в тупик?
  options:
  - Тогдашние компьютеры не умели проверять условия «если — то»
  - Правил требовалось всё больше, а на необычных случаях системы всё равно ломались
  - Эксперты не делились знаниями, и правила было не из чего составлять
  - Их вытеснили нейросети, которые уже в 1980-х работали лучше правил
  answer: 1
  explain: Правила хорошо работали в узких задачах, но не справлялись с разнообразием реального мира. Нейросети стали успешными
    гораздо позже.
- id: transfer-choice
  type: single
  q: Интернет-магазин хочет автоматически определять, что отзыв покупателя злой и требует срочного ответа. Отзывов тысячи,
    пишут их по-разному. Что разумнее?
  options:
  - Составить список грубых слов и помечать отзывы, где они встречаются
  - Обучить модель на отзывах, которые сотрудники уже пометили как «злой / обычный»
  - Ввести правило «больше трёх восклицательных знаков — значит злой»
  - 'Поручить это обычной программе: злость легко узнать по заглавным буквам'
  answer: 1
  explain: 'Правила здесь быстро ломаются: злость выражают тысячей способов. Есть размеченные примеры — значит, можно обучить
    модель.'
- id: explain-own-words
  type: open
  q: Объясните своими словами человеку, который не знает программирования, чем спам-фильтр на правилах отличается от спам-фильтра,
    обученного на примерах. Приведите один плюс и один минус каждого.
  rubric:
  - правила пишет человек, обученная модель находит закономерность в примерах сама
  - плюс правил — понятность или точность в простых случаях; минус — их становится слишком много и они устаревают
  - плюс обучения — подстраивается под новые приёмы при новых примерах; минус — иногда ошибается или решение трудно объяснить
  - засчитывается полностью, если названо различие и по одному плюсу и минусу каждого подхода
  wrong_answers:
  - обученная модель никогда не ошибается
  - модель сама пишет правила на Python
  followups:
  - Что вы сделаете, если спамеры придумали новый приём, — в каждом из подходов?
  - Где бы вы всё-таки оставили правило рядом с моделью?
  explain: Сравните с таблицей на странице «Учиться на примерах» и с разделом «Когда что выбирать».
