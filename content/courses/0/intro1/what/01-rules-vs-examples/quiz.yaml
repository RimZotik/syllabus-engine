title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: rules-def
  type: single
  q: Что отличает обычную программу?
  options:
  - Она сама находит закономерности в данных
  - Все правила в ней явно записал человек
  - Она работает только с числами
  - Она никогда не ошибается
  answer: 1
  explain: Обычная программа выполняет правила, придуманные человеком. Ошибаться она может — если ошибся автор правил.
- id: algorithm
  type: multi
  q: Что из этого — алгоритмы? Выберите все.
  options:
  - 'Рецепт борща: «нарезать, обжарить, варить 40 минут»'
  - Таблица с ценами квартир
  - «Если сумма больше 5000 ₽, умножь на 0,9, иначе оставь как есть»
  - Фотография кошки
  - Инструкция по сборке шкафа
  answer:
  - 0
  - 2
  - 4
  explain: Алгоритм — последовательность шагов от входа к результату. Таблица и фото — это данные.
- id: when-ml
  type: multi
  q: В каких задачах машинное обучение обычно лучше правил? Выберите все подходящие.
  options:
  - Расчёт налога по закону
  - Распознавание речи
  - Поиск мошеннических транзакций, приёмы которых постоянно меняются
  - Начисление скидки 10 % при сумме больше 5000 ₽
  - Определение, понравится ли человеку фильм
  answer:
  - 1
  - 2
  - 4
  explain: Налог и скидка описываются простыми точными правилами. Речь, мошенничество и вкусы людей — задачи, где правила
    не сформулировать или они быстро устаревают.
- id: ml-input
  type: single
  q: Что человек даёт компьютеру при машинном обучении вместо правил?
  options:
  - Готовую модель
  - Примеры с правильными ответами
  - Список запрещённых слов
  - Ничего — компьютер учится сам из интернета
  answer: 1
  explain: Обучение «с учителем» начинается с примеров, для которых ответ уже известен.
- id: ml-output
  type: single
  q: Что получается в результате обучения?
  options:
  - Новые данные
  - Модель, которая отвечает на новых примерах
  - Список правил, написанных человеком
  - Гарантия, что ошибок больше не будет
  answer: 1
  explain: Результат обучения — модель. Она применима к новым данным, но может ошибаться.
- id: ai-vs-ml
  type: single
  q: Как связаны искусственный интеллект и машинное обучение?
  options:
  - Это одно и то же
  - Машинное обучение — часть искусственного интеллекта и самый успешный сегодня его способ
  - Искусственный интеллект — часть машинного обучения
  - Они никак не связаны
  answer: 1
  explain: ИИ — широкая область, ML — её подход, в котором модели учатся на данных.
- id: errors
  type: multi
  q: Какие утверждения о моделях машинного обучения верны?
  options:
  - Модель иногда ошибается, и это заложено в саму идею
  - Внутри модели работает обычная программа
  - Модель всегда можно объяснить так же просто, как правило о скидке
  - В реальных системах модель окружают проверками и правилами
  answer:
  - 0
  - 1
  - 3
  explain: Модель находит закономерность «в большинстве случаев», поэтому её страхуют обычным кодом. Объяснить решение модели
    часто сложнее, чем правило.
- id: expert-systems
  type: single
  q: Почему экспертные системы 1970–80-х зашли в тупик?
  options:
  - Компьютеры тогда не умели выполнять условия «если — то»
  - Тысячи правил ломались на необычных случаях и требовали огромных усилий на поддержку
  - Врачи отказывались делиться знаниями
  - Их запретили законом
  answer: 1
  explain: Правила хорошо работали в узких задачах, но не справлялись с разнообразием реального мира.
- id: explain-own-words
  type: open
  q: Объясните своими словами человеку, который не знает программирования, чем спам-фильтр на правилах отличается от спам-фильтра,
    обученного на примерах. Приведите один плюс и один минус каждого.
  rubric:
  - правила пишет человек, обученная модель находит закономерность в примерах сама
  - плюс правил — понятность или точность в простых случаях; минус — их становится слишком много и они устаревают
  - плюс обучения — подстраивается под новые приёмы при новых примерах; минус — иногда ошибается или решение трудно объяснить
  - засчитывается полностью, если названо различие и по одному плюсу и минусу каждого подхода
  wrong_answers:
  - обученная модель никогда не ошибается
  - модель сама пишет правила на Python
  followups:
  - Что вы сделаете, если спамеры придумали новый приём, — в каждом из подходов?
  - Где бы вы всё-таки оставили правило рядом с моделью?
  explain: Сравните с таблицей на странице «Учиться на примерах» и с разделом «Когда что выбирать».
- id: transfer-choice
  type: single
  q: Интернет-магазин хочет автоматически определять, что отзыв покупателя злой и требует срочного ответа. Отзывов тысячи,
    пишут их по-разному. Что разумнее?
  options:
  - Список запрещённых слов
  - Обучить модель на отзывах, которые сотрудники уже пометили как «злой / обычный»
  - Правило «если в отзыве больше трёх восклицательных знаков»
  - Ничего — такие задачи компьютер решать не может
  answer: 1
  explain: 'Правила здесь быстро ломаются: злость выражают тысячей способов. Есть размеченные примеры — значит, можно обучить
    модель.'
