title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: es-def
  type: single
  q: Что лежит в основе экспертной системы?
  options:
  - Модель, которая подбирает веса по тысячам примеров
  - Огромная таблица всех случаев с готовыми ответами
  - Правила «если — то» со слов специалистов и механизм, который их применяет
  - Нейросеть, обученная на ответах экспертов
  answer: 2
  explain: Экспертная система — это правила, полученные от людей, и механизм вывода. Обучения на примерах в ней нет.
- id: es-worked
  type: single
  q: В каких задачах экспертные системы действительно приносили пользу?
  options:
  - В узких задачах, где знания специалистов удавалось чётко записать
  - В широких задачах вроде свободного разговора на любую тему
  - В распознавании лиц и речи по фотографиям и записям
  - В задачах, где правила постоянно и быстро меняются
  answer: 0
  explain: Выбор антибиотика или проверка состава заказа — узкие области с понятными правилами. Лица, речь и быстро меняющиеся
    задачи — как раз то, где правила не работают.
- id: es-limits
  type: multi
  q: Почему экспертные системы зашли в тупик? Выберите все верные причины.
  options:
  - Эксперты часто не могут разложить своё умение на явные правила
  - Системы ломались на случаях чуть за пределами своей области
  - Каждое изменение мира требовало ручной правки и проверки множества правил
  - Компьютеры 1980-х не умели выполнять условия «если — то»
  - Накопленный опыт сам по себе не улучшал систему
  answer:
  - 0
  - 1
  - 2
  - 4
  explain: 'Тупик — в самом подходе: знания трудно добыть, система хрупкая, поддержка ручная, обучения нет. Выполнять правила
    компьютеры умели прекрасно.'
- id: es-lesson
  type: single
  q: Какой главный вывод для машинного обучения следует из истории экспертных систем?
  options:
  - Знания специалистов в ИИ бесполезны
  - Экспертные системы проиграли только из-за медленных компьютеров
  - Любую задачу можно решить, если собрать достаточно экспертов
  - Где правил слишком много и они меняются, их лучше получать из данных
  answer: 3
  explain: Это тот же вывод, что и в первой теме курса. Знания экспертов полезны (например, при выборе признаков), но вручную
    правила не масштабируются.
- id: vc-idea
  type: single
  q: Какую главную мысль статистической теории обучения можно сказать без формул?
  options:
  - Чем сложнее модель, тем меньше примеров ей нужно
  - Чтобы сложная модель уловила закономерность, а не случайности, ей нужно больше примеров
  - Любая модель обобщает, если ошибка на обучающих примерах равна нулю
  - Обобщение зависит только от скорости компьютера
  answer: 1
  explain: Сложность модели нужно соизмерять с количеством данных — иначе получится переобучение.
  traps:
  - 0
- id: svm-choice
  type: single
  q: Два класса можно разделить многими прямыми без единой ошибки. Какую выберет метод опорных векторов?
  options:
  - Ту, что ближе всего к самой большой группе точек
  - Первую найденную — они всё равно одинаково хороши
  - Ту, от которой дальше всего до ближайших точек обоих классов
  - Ту, что делит все точки на две равные по числу группы
  answer: 2
  explain: Метод выбирает границу с самой широкой полосой — она даёт больше «запаса» для новых точек и лучше обобщает.
- id: svm-why-margin
  type: single
  q: Почему широкая полоса между границей и точками полезна?
  options:
  - Новая точка, немного непохожая на обучающие, реже окажется не на своей стороне
  - Модель с широкой полосой гораздо быстрее обучается
  - На обучающих примерах такая граница ошибается реже, чем узкая
  - Широкая полоса позволяет обойтись без примеров с ответами
  answer: 0
  explain: На обучающих примерах обе границы не ошибаются. Выигрыш — на новых данных, то есть в обобщении.
- id: boost-idea
  type: single
  q: Как устроен бустинг?
  options:
  - Одну большую модель обучают очень долго, пока ошибки не исчезнут
  - Много моделей обучают независимо на одних и тех же данных и выбирают лучшую
  - Простые модели обучают по очереди, и каждая сосредоточена на ошибках предыдущих
  - Модели обучают на разных задачах, а потом объединяют их знания
  answer: 2
  explain: Последовательность и работа над ошибками — суть бустинга. Ответ складывается из всех моделей цепочки.
- id: boost-gradient
  type: single
  q: 'Курьерская служба прогнозирует время доставки градиентным бустингом. Первая модель сказала 40 минут, на деле было 50.
    Что будет учиться предсказывать вторая модель?'
  options:
  - Снова время доставки, но на других заказах
  - Самый частый ответ среди прошлых доставок
  - Какая из двух моделей окажется точнее
  - Ошибку первой модели — недостающие 10 минут
  answer: 3
  explain: В градиентном бустинге каждая следующая модель предсказывает то, что предыдущие не смогли объяснить. Итог — сумма.
- id: boost-today
  type: single
  q: Какое утверждение о бустинге сегодня верно?
  options:
  - Это устаревший метод, который полностью вытеснили нейросети
  - Это один из главных инструментов для табличных данных — оценки кредитов, прогноза спроса
  - Его применяют в основном для генерации текста и картинок
  - Это разновидность экспертной системы с правилами от специалистов
  answer: 1
  explain: Бустинг не устарел — для таблиц он по-прежнему один из сильнейших методов.
- id: open-shift
  type: open
  q: Объясните, чем подход экспертных систем отличался от подхода статистического обучения и бустинга. Почему второй подход
    оказался живучее? Приведите пример задачи, которую сегодня решают бустингом.
  rubric:
  - экспертные системы — правила, записанные человеком со слов специалистов; статистическое обучение и бустинг — модели, обученные
    на примерах
  - причины тупика правил — трудно добыть знания, хрупкость, ручная поддержка, нет обучения
  - второй подход обновляется повторным обучением на новых данных и опирается на теорию обобщения
  - пример — табличная задача (оценка кредитов, прогноз спроса, поиск мошенничества)
  wrong_answers:
  - бустинг — это то же самое, что экспертная система
  - экспертные системы проиграли из-за медленных компьютеров
  followups:
  - Что делать экспертной системе и бустингу, если мошенники придумали новый приём?
  - Где знания экспертов всё-таки полезны при обучении модели?
  explain: Страницы «Вторая зима» и «Бустинг» этой темы.
