title: Проверка темы
pass: 0.85
minutes: 12
questions:
- id: pillar-sql
  type: single
  q: Нужно получить из базы компании все заказы за май вместе с городами покупателей. К какой опоре относится эта задача?
  options:
  - Данные
  - Модели
  - Инфраструктура
  - Математика
  answer: 0
  explain: Достать нужные строки из базы — работа с данными, обычно запросом на SQL.
- id: pillar-infra
  type: multi
  q: Какие из этих задач относятся к опоре «Инфраструктура»?
  options:
  - Запустить сервис с моделью на сервере, чтобы им пользовались клиенты
  - Следить, что сервис с моделью отвечает и не падает
  - Выбрать функцию потерь для новой модели
  - Удалить повторяющиеся записи из архива
  - Вовремя переобучить модель, которая начала устаревать
  answer:
  - 0
  - 1
  - 4
  explain: Функция потерь — вопрос моделей и математики, удаление дублей — подготовка данных. Запуск сервиса, наблюдение
    за ним и переобучение устаревшей модели — инфраструктура.
- id: why-math
  type: single
  q: Зачем при обучении модели нужна математика?
  options:
  - Она показывает, как изменится признак объекта, если чуть изменить параметр
  - Она хранит параметры модели между запусками
  - Она показывает, как изменится ошибка, если чуть изменить параметр
  - Она ускоряет ответы модели пользователям
  answer: 2
  explain: Обучение — подбор параметров, при котором ошибка как можно меньше. Математика говорит, в какую сторону повернуть
    ручку, чтобы ошибка уменьшилась. Признаки от параметров не зависят — они берутся из данных.
  traps:
  - 0
- id: pillar-code
  type: single
  q: Сервис ищет похожие товары и перебирает для этого все десять миллионов позиций — ответ идёт полминуты. Знания какой
    опоры помогут ускорить поиск прежде всего?
  options:
  - Математики
  - Инфраструктуры
  - Данных
  - Программирования
  answer: 3
  explain: Как искать быстро среди огромного числа объектов — вопрос алгоритмов, а алгоритмы — часть опоры «Программирование».
- id: honest-check
  type: single
  q: Модель почти не ошибается на обучающих примерах, но плохо оценивает квартиры, которых не видела. Что это значит?
  options:
  - Модель отличная — на обучающих примерах она почти не ошибается
  - Модель плохо обобщает, и честная проверка на новых данных это показала
  - Новые квартиры записаны с ошибками, модель тут ни при чём
  - Модели не хватает мощного сервера
  answer: 1
  explain: Модель хороша не на обучающих примерах, а на новых данных. Это и есть обобщение, а проверка на новых данных
    — главное в опоре «Модели».
- id: small-part
  type: single
  q: Какое утверждение о настоящей ML-системе верно?
  options:
  - Главное в ней — выбрать самую сложную модель, остальное второстепенно
  - Когда модель обучена и проверена, работа над системой закончена
  - Код самой модели — малая её часть, остальное — данные, проверки, запуск и наблюдение
  - Наблюдение за моделью нужно только крупным компаниям с большой нагрузкой
  answer: 2
  explain: Модель — небольшая часть системы. Без данных, проверок и инфраструктуры она не принесёт пользы.
- id: drift
  type: single
  q: Модель оценки квартир обучили два года назад. Код с тех пор не меняли, но ошибки растут. В чём наиболее вероятная причина?
  options:
  - Модель со временем изнашивается, как деталь машины
  - В коде сам собой появился баг
  - Рынок изменился, а модель помнит закономерности старых данных
  - Модель сама дообучилась на неправильных примерах
  answer: 2
  explain: Модель не меняется, но мир меняется. Поэтому за качеством следят и переобучают модель на свежих данных.
- id: garbage
  type: single
  q: В архиве половина цен записана в рублях, а половина — в тысячах рублей. Что будет, если обучить модель на таких данных как есть?
  options:
  - Модель сама заметит разницу и пересчитает цены
  - Обучение остановится с сообщением об ошибке
  - Модель пропустит строки, которые выглядят странно
  - Модель выучит эту путаницу и будет уверенно ошибаться
  answer: 3
  explain: Модель не знает, какие данные «правильные», — она учится на том, что ей дали. Мусор на входе — мусор на выходе.
- id: roles
  type: multi
  q: Какие утверждения о профессиях и опорах верны?
  options:
  - У инженера данных главный упор — на данные, код и инфраструктуру
  - ML-инженеру инфраструктура не нужна — модель запускают другие
  - Границы между профессиями размыты, поэтому полезно знать все пять опор
  - Аналитику данных статистика не нужна — достаточно SQL
  answer:
  - 0
  - 2
  explain: ML-инженер как раз доводит модель до работы у пользователей, а аналитику статистика нужна, чтобы делать
    выводы из данных.
- id: open-pillars
  type: open
  q: Выберите одну задачу компании, где нужна модель (например, «предсказывать время доставки в приложении»). Опишите, что
    понадобится от каждой из пяти опор, чтобы модель заработала у пользователей.
  rubric:
  - названы все пять опор — программирование, математика, данные, модели, инфраструктура
  - для каждой опоры указано конкретное действие, связанное именно с выбранной задачей
  - в данных упомянуто, откуда их взять и что их нужно подготовить
  - в инфраструктуре есть не только запуск, но и наблюдение за моделью или её переобучение
  wrong_answers:
  - достаточно обучить модель — остальное неважно
  - опоры перечислены общими словами без связи с задачей
  followups:
  - Какая из опор в вашей задаче, по-вашему, самая трудная и почему?
  - Что случится с вашей моделью через год, если за ней никто не будет следить?
  explain: Вернитесь к примеру с агентством недвижимости на первой странице темы и к таблице пяти опор.
