# Глоссарий курса. Поля: id, term, en (английский термин), decode (расшифровка/происхождение), short (1–2 предложения своими словами),
# example (необязательно), introduced_in (id темы, где термин введён). Правила — docs/content/style-guide.md, разделы 4 и 8.

- id: program
  term: программа
  en: program
  decode: от греч. prógramma — «объявление, предписание»
  short: Набор точных инструкций, который компьютер выполняет шаг за шагом.
  introduced_in: intro1.what.1

- id: algorithm
  term: алгоритм
  en: algorithm
  decode: от имени математика аль-Хорезми (IX век)
  short: Конечная последовательность понятных шагов, которая из входных данных получает результат. Рецепт — тоже алгоритм.
  example: «Если сумма покупки больше 5000 ₽ — скидка 10 %, иначе — без скидки».
  introduced_in: intro1.what.1

- id: ai
  term: искусственный интеллект
  en: artificial intelligence, AI
  decode: термин придумал Джон Маккарти в 1955 году
  short: Широкая область, которая учит компьютеры решать задачи, обычно требующие человеческого ума. Машинное обучение — самый успешный её способ сегодня.
  introduced_in: intro1.what.1

- id: ml
  term: машинное обучение
  en: machine learning, ML
  decode: выражение ввёл Артур Самуэль в 1959 году
  short: Способ создавать программы, которые находят закономерности в примерах сами, а не следуют правилам, написанным человеком.
  introduced_in: intro1.what.1

- id: data
  term: данные
  en: data
  decode: от лат. datum — «данное»
  short: Записанные факты о мире — числа, тексты, картинки, клики. Сырьё, из которого машинное обучение извлекает закономерности.
  introduced_in: intro1.what.2

- id: dataset
  term: датасет
  en: dataset, «набор данных»
  short: Набор примеров, собранных для одной задачи. Часто — таблица, где строка — объект, а столбцы — его признаки и ответ.
  introduced_in: intro1.what.2

- id: feature
  term: признак
  en: feature
  short: Одна измеримая характеристика объекта — площадь квартиры, возраст клиента, число слов в письме.
  introduced_in: intro1.what.2

- id: target
  term: целевая переменная
  en: target, label («метка»)
  short: То, что модель должна предсказать — цена, «спам или нет», диагноз. В обучающих примерах ответ известен.
  introduced_in: intro1.what.2

- id: model
  term: модель
  en: model
  short: Функция с настраиваемыми параметрами, которая по признакам объекта выдаёт предсказание.
  example: цена = a × площадь + b, где a и b — параметры.
  introduced_in: intro1.what.2

- id: parameter
  term: параметр модели
  en: parameter, weight («вес»)
  short: Число внутри модели, которое подбирается при обучении. У простой модели их два, у больших языковых моделей — сотни миллиардов.
  introduced_in: intro1.what.2

- id: training
  term: обучение
  en: training
  short: Подбор параметров модели так, чтобы её ошибки на известных примерах стали как можно меньше.
  introduced_in: intro1.what.2

- id: loss
  term: функция потерь
  en: loss function
  short: Число, которое показывает, насколько предсказание модели на одном объекте расходится с правильным ответом. Среднее потерь по обучающей выборке называют эмпирическим риском — его и уменьшает обучение.
  introduced_in: intro1.what.2

- id: prediction
  term: предсказание
  en: prediction, inference («вывод»)
  short: Ответ, который обученная модель выдаёт для нового объекта, ответ для которого заранее неизвестен.
  introduced_in: intro1.what.2

- id: generalization
  term: обобщение
  en: generalization
  short: Способность модели правильно отвечать на новых примерах, которых она не видела при обучении. Ради этого всё и делается.
  introduced_in: intro1.what.2

- id: overfitting
  term: переобучение
  en: overfitting
  short: Модель «зазубрила» обучающие примеры вместе со случайным шумом и плохо работает на новых данных.
  introduced_in: intro1.what.2

- id: classification
  term: классификация
  en: classification
  short: Задача выбрать для объекта один из заранее известных классов — «спам / не спам», «кошка / собака / птица».
  introduced_in: intro1.what.3

- id: regression
  term: регрессия
  en: regression
  decode: от лат. regressio — «возвращение»; название историческое, от работ Фрэнсиса Гальтона
  short: Задача предсказать число — цену, температуру, время доставки.
  introduced_in: intro1.what.3

- id: clustering
  term: кластеризация
  en: clustering, от cluster — «гроздь»
  short: Задача разбить объекты на группы похожих, когда правильных групп заранее никто не знает.
  introduced_in: intro1.what.3

- id: recommender
  term: рекомендательная система
  en: recommender system
  short: Система, которая для каждого пользователя подбирает и упорядочивает то, что ему, вероятно, понравится.
  introduced_in: intro1.what.3

- id: supervised
  term: обучение с учителем
  en: supervised learning
  short: Обучение на примерах, где для каждого объекта известен правильный ответ.
  introduced_in: intro1.what.3

- id: unsupervised
  term: обучение без учителя
  en: unsupervised learning
  short: Поиск структуры в данных без правильных ответов — например, группировка похожих объектов.
  introduced_in: intro1.what.3

- id: reinforcement
  term: обучение с подкреплением
  en: reinforcement learning
  short: Обучение через пробы и ошибки — агент действует, получает награду или штраф и постепенно учится действовать лучше.
  introduced_in: intro1.what.3

- id: generative
  term: генеративная модель
  en: generative model
  short: Модель, которая создаёт новые данные — текст, картинки, звук — похожие на те, на которых она училась.
  introduced_in: intro1.what.3

- id: knn
  term: метод k ближайших соседей
  en: k nearest neighbours, kNN
  short: Чтобы предсказать класс нового объекта, смотрим на k самых похожих известных примеров и выбираем самый частый у них класс.
  introduced_in: intro1.what.4

- id: hyperparameter
  term: гиперпараметр
  en: hyperparameter
  short: Настройка модели, которую выбирает человек до обучения (например, число соседей k). Параметры подбирает обучение, гиперпараметры — мы.
  introduced_in: intro1.what.4

- id: object
  term: объект
  en: object, sample, instance
  short: То, о чём модель делает предсказание, — квартира, письмо, клиент. В таблице данных это одна строка.
  introduced_in: intro1.what.2

- id: training-set
  term: обучающая выборка
  en: training set
  short: Часть данных с известными ответами, на которой модель обучается.
  introduced_in: intro1.what.2

- id: holdout
  term: отложенные данные
  en: hold-out set, test set
  short: Часть данных, которую заранее откладывают и не показывают модели при обучении, чтобы честно проверить её на новых примерах.
  introduced_in: intro1.what.2

- id: underfitting
  term: недообучение
  en: underfitting
  short: Модель слишком простая и плохо отвечает даже на обучающих примерах — она не уловила закономерность.
  introduced_in: intro1.what.2

- id: labeling
  term: разметка данных
  en: data labeling, annotation
  short: Расстановка правильных ответов для примеров — обычно людьми. Без разметки нельзя обучать с учителем.
  introduced_in: intro1.what.3

- id: agent
  term: агент
  en: agent
  short: В обучении с подкреплением — тот, кто действует в среде, получает награду или штраф и учится действовать лучше.
  introduced_in: intro1.what.3

- id: ranking
  term: ранжирование
  en: ranking
  short: Задача упорядочить объекты по тому, насколько они подходят запросу или конкретному человеку, — как выдача поисковика.
  introduced_in: intro1.what.3

# ── intro1.history

- id: turing-machine
  term: машина Тьюринга
  en: Turing machine
  decode: по имени Алана Тьюринга, описавшего её в 1936 году
  short: Мысленная модель вычисления по инструкции — лента с символами, головка, которая читает, пишет и сдвигается, и таблица
    правил. Принято считать, что на ней можно выполнить любой алгоритм.
  introduced_in: intro1.history.1

- id: turing-test
  term: тест Тьюринга
  en: Turing test, imitation game («игра в имитацию»)
  short: Проверка, в которой судья переписывается с человеком и машиной и пытается понять, кто из них машина. Проверяет только
    поведение в разговоре, а не понимание.
  introduced_in: intro1.history.1

- id: perceptron
  term: перцептрон
  en: perceptron
  decode: от лат. perceptio — «восприятие»; Фрэнк Розенблатт, 1958
  short: Простейшая обучаемая модель — складывает признаки с весами и сравнивает сумму с порогом; при ошибке веса сдвигаются
    к правильному ответу. Проводит между классами только прямую границу.
  introduced_in: intro1.history.2

- id: ai-winter
  term: зима искусственного интеллекта
  en: AI winter
  short: Период резкого спада денег и интереса к ИИ после завышенных ожиданий. Первая — в 1970-х, вторая — с конца 1980-х
    до середины 1990-х.
  introduced_in: intro1.history.2

- id: expert-system
  term: экспертная система
  en: expert system
  short: Программа, в которую записали знания специалистов в виде правил «если — то». Работала в узких задачах, но не училась
    и плохо масштабировалась.
  introduced_in: intro1.history.3

- id: boosting
  term: бустинг
  en: boosting, от boost — «усиливать»
  short: Способ собрать сильную модель из цепочки простых, где каждая следующая исправляет ошибки предыдущих. Один из главных
    методов для табличных данных.
  introduced_in: intro1.history.3

- id: neural-network
  term: нейронная сеть
  en: neural network, «нейросеть»
  short: Модель из многих простых «нейронов», собранных в слои, — выходы одного слоя идут на входы следующего. Обучается подбором
    весов по примерам.
  introduced_in: intro1.history.4

- id: deep-learning
  term: глубокое обучение
  en: deep learning
  short: Обучение нейросетей из многих слоёв, которые сами находят признаки — от простых (края на картинке) до сложных (целые
    объекты).
  introduced_in: intro1.history.4

- id: transformer
  term: трансформер
  en: transformer
  short: Архитектура нейросети на механизме внимания — каждый элемент (например, слово) учитывает все остальные сразу. Основа
    современных языковых моделей.
  introduced_in: intro1.history.4

- id: language-model
  term: языковая модель
  en: language model; large language model, LLM
  decode: LLM — large language model, «большая языковая модель»
  short: Модель, которая по началу текста предсказывает следующее слово. Большие языковые модели с миллиардами параметров
    лежат в основе чат-ассистентов.
  introduced_in: intro1.history.4

- id: gpu
  term: видеокарта (GPU)
  en: graphics processing unit, GPU
  decode: GPU — graphics processing unit, «графический процессор»
  short: Чип, который выполняет тысячи простых вычислений одновременно. Создан для игровой графики, стал главным инструментом
    для обучения нейросетей.
  introduced_in: intro1.history.5

# ── intro1.professions

- id: data-analyst
  term: аналитик данных
  en: data analyst
  short: Специалист, который отвечает на вопросы бизнеса цифрами — запросами к данным, отчётами и выводами о том, что произошло
    и почему.
  introduced_in: intro1.professions.1

- id: data-scientist
  term: дата-сайентист
  en: data scientist, DS
  synonyms:
  - специалист по данным
  short: Специалист, который превращает данные в выводы и модели — формулирует задачу, строит и проверяет модель, объясняет
    бизнесу, стоит ли её внедрять.
  introduced_in: intro1.professions.1

- id: ml-engineer
  term: ML-инженер
  en: machine learning engineer, MLE
  synonyms:
  - ML-разработчик
  short: Программист, который доводит модели до работы внутри продукта — надёжно, быстро и под нагрузкой.
  introduced_in: intro1.professions.1

- id: ai-engineer
  term: AI-инженер
  en: AI engineer
  synonyms:
  - LLM-инженер
  short: Инженер, который строит продукты на основе готовых больших языковых моделей — например, чат-ассистентов — и измеряет
    их качество.
  introduced_in: intro1.professions.1

- id: data-engineer
  term: инженер данных
  en: data engineer, DE
  synonyms:
  - дата-инженер
  short: Специалист, который строит и поддерживает регулярную доставку данных в хранилище, чтобы у всех остальных были свежие,
    правильные и удобные данные.
  introduced_in: intro1.professions.1

- id: mlops
  term: MLOps
  en: machine learning operations
  decode: ML + Ops (operations — «эксплуатация»), по аналогии с DevOps
  short: Практики и роль, которые автоматизируют жизнь моделей — обучение, выкатку, хранение версий и мониторинг.
  introduced_in: intro1.professions.1

- id: production
  term: продакшен
  en: production, prod
  synonyms:
  - прод
  - промышленная эксплуатация
  short: Рабочая среда, где программа или модель обслуживает настоящих пользователей, — в отличие от экспериментов на компьютере
    разработчика.
  introduced_in: intro1.professions.1

- id: baseline
  term: базовое решение
  en: baseline
  synonyms:
  - бейзлайн
  short: Самое простое разумное решение задачи — правило или тривиальная модель. С ним сравнивают все более сложные модели.
  example: «Завтра продадим столько же, сколько в этот же день неделю назад».
  introduced_in: intro1.professions.2

- id: metric
  term: метрика
  en: metric
  short: Число, по которому оценивают и сравнивают решения — долю верных ответов модели, выручку, число ушедших клиентов.
  introduced_in: intro1.professions.2

- id: monitoring
  term: мониторинг
  en: monitoring
  short: Постоянное наблюдение за работающей системой или моделью, чтобы вовремя заметить сбой или падение качества.
  introduced_in: intro1.professions.2

- id: code-review
  term: код-ревью
  en: code review
  synonyms:
  - ревью кода
  short: Чтение и проверка изменений кода коллегой перед тем, как они попадут в общий код.
  introduced_in: intro1.professions.3

# ── intro1.map

- id: prerequisite
  term: предпосылка
  en: prerequisite
  short: Тема или навык, без которых новую тему не понять. В учебном плане предпосылки раздела всегда стоят раньше него.
  introduced_in: intro1.map.2

- id: subject
  term: предмет
  en: subject
  short: Сквозная линия обучения, которая тянется через несколько курсов уровнями, — например, Программирование I–VI.
  introduced_in: intro1.map.3

- id: discipline
  term: дисциплина
  en: discipline
  short: Один уровень предмета на конкретном курсе — например, «Программирование III». Заканчивается экзаменом.
  introduced_in: intro1.map.3

- id: spaced-repetition
  term: интервальное повторение
  en: spaced repetition
  short: Повторение пройденного через растущие промежутки времени — сначала часто, потом всё реже. Так знания держатся в памяти
    при небольшой ежедневной нагрузке.
  introduced_in: intro1.map.3
