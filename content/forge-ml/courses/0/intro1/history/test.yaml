title: Контрольная раздела «Краткая история»
pass: 0.85
minutes: 30
questions:
- id: s-thread
  type: single
  q: Какая главная линия проходит через всю историю ИИ, рассказанную в разделе?
  options:
  - От правил, записанных человеком, — к моделям, которые подбирают параметры по данным
  - От обучения на примерах — к правилам, которые надёжно записывают эксперты
  - От огромных компьютеров — к маленьким, при тех же самых методах
  - От нейросетей — к экспертным системам как более надёжному подходу
  answer: 0
  explain: Машина Тьюринга, экспертные системы — правила от человека; перцептрон, бустинг, глубокие сети — обучение на данных.
- id: s-turing-test
  type: single
  q: Чат-бот поддержки так отвечает клиентам, что они в переписке не могут понять, человек это или программа. Что из этого
    следует?
  options:
  - Чат-бот по-настоящему понимает проблемы клиентов
  - Он хорошо справляется с игрой в имитацию — и только это
  - Чат-бот никогда не ошибается в ответах
  - Чат-бот работает по правилам, написанным экспертами
  answer: 1
  explain: Тест Тьюринга проверяет только неотличимость в разговоре, а не понимание и не безошибочность.
  traps:
  - 0
- id: s-child-machine
  type: single
  q: Какая идея Тьюринга 1950 года ближе всего к машинному обучению?
  options:
  - Любое вычисление можно разложить на шаги машины с лентой
  - Заменить вопрос «может ли машина мыслить» игрой в имитацию
  - Один компьютер может выполнить любую загруженную в него программу
  - Не вписывать знания вручную, а построить машину, которая учится
  answer: 3
  explain: Все варианты — идеи Тьюринга, но к обучению на примерах ведёт именно «машина-ребёнок».
- id: s-perceptron-ml
  type: multi
  q: Какие утверждения о перцептроне верны?
  options:
  - Его веса — это параметры модели, подбираемые по примерам
  - Он поправляет веса, когда ошибается на примере
  - Он может выучить любую закономерность, если дать достаточно примеров
  - Он проводит между классами только прямую границу
  answer:
  - 0
  - 1
  - 3
  explain: Перцептрон — настоящая обучаемая модель, но слишком простая. Исключающее ИЛИ он не выучит ни на каких данных.
- id: s-xor-new
  type: single
  q: 'Сигнализация должна срабатывать, только если открыта ровно одна из двух дверей: открыты обе или закрыты обе — молчать.
    Справится ли с этим один перцептрон?'
  options:
  - Да, если дать ему очень много примеров
  - Да, если подобрать подходящий порог
  - Нет, такие случаи нельзя разделить одной прямой
  - Нет, потому что у этой задачи нет правильных ответов
  answer: 2
  explain: Это та же задача, что с двумя выключателями. Нужна более сложная модель — например, сеть из нескольких слоёв.
- id: s-winters
  type: single
  q: Что общего у причин первой и второй «зимы» ИИ?
  options:
  - Обещания сильно опередили результаты, и финансирование урезали
  - Обе вызвала нехватка программистов, умеющих писать правила
  - Обе закончились, когда исследования ИИ запретили законом
  - Обе начались сразу после изобретения новых нейросетей
  answer: 0
  explain: Первая — после неоправданных надежд на перцептрон и ранние программы, вторая — после бума экспертных систем.
- id: s-expert-dead-end
  type: single
  q: Почему экспертные системы зашли в тупик?
  options:
  - Компьютеры того времени не умели выполнять правила «если — то»
  - Их запретили использовать в медицине и в бизнесе
  - Экспертов было слишком много, и их советы противоречили друг другу
  - Знания трудно превратить в правила, правил всё больше, а сама система не учится
  answer: 3
  explain: Ручные правила не масштабируются и не обновляются сами — отсюда переход к обучению на данных.
- id: s-generalization
  type: single
  q: Какой вопрос о моделях стал центральным для статистической теории обучения?
  options:
  - Как ускорить выполнение правил на компьютере
  - Как собрать знания экспертов в одну базу
  - Когда модель, обученная на примерах, будет верно отвечать на новых
  - Как заставить модель пройти тест Тьюринга
  answer: 2
  explain: Это вопрос об обобщении — главной цели машинного обучения из первого раздела.
- id: s-boosting
  type: single
  q: Магазин прогнозирует спрос несколькими простыми моделями. Каждая следующая учится на том, в чём ошиблись предыдущие,
    а прогноз — их общий итог. Как называется этот подход?
  options:
  - Экспертная система
  - Перцептрон
  - Трансформер
  - Бустинг
  answer: 3
  explain: Цепочка моделей, исправляющих ошибки друг друга, — бустинг.
- id: s-2012
  type: single
  q: Почему идея многослойных сетей, известная с 1980-х, принесла прорыв только в 2012 году?
  options:
  - В 2012 году впервые придумали обучать сети на примерах
  - Появились огромные размеченные наборы данных и обучение на видеокартах
  - Сети стали работать по правилам экспертов
  - Сети перестали проверять на новых данных
  answer: 1
  explain: Данные (ImageNet) и вычисления (видеокарты) — то, чего не хватало раньше.
- id: s-transformer
  type: single
  q: Что позволило трансформерам учиться на гораздо больших объёмах текста, чем прежние модели?
  options:
  - Он не учится на примерах, потому что правила грамматики в него заложены заранее
  - Он обрезает длинные тексты и обрабатывает только короткие фразы
  - Все слова обрабатываются одновременно и сразу учитывают друг друга, а не по одному
  - У него нет параметров, поэтому обучать почти ничего не нужно
  answer: 2
  explain: Механизм внимания и параллельная обработка хорошо ложатся на видеокарты и улавливают далёкие связи.
- id: s-lm-labels
  type: single
  q: Почему языковые модели могли учиться на огромной части текстов интернета, а ImageNet пришлось размечать людям?
  options:
  - Для языковой модели правильный ответ — следующее слово — уже есть в самом тексте
  - Тексты в интернете проверены экспертами, а картинки — нет
  - Языковым моделям вообще не нужны правильные ответы
  - Картинки нельзя хранить в компьютере без подписи
  answer: 0
  explain: Задача «предскажи следующее слово» берёт ответы из самого текста, а классу картинки нужен человек, который его назовёт.
- id: s-ingredients
  type: multi
  q: Какие утверждения о данных, вычислениях и алгоритмах верны?
  options:
  - Большой модели нужно много примеров, иначе она зазубрит обучающую выборку
  - Если данных очень много, их качество уже не важно
  - Видеокарты подошли для обучения, потому что делают тысячи простых вычислений одновременно
  - Без подходящих алгоритмов данные и видеокарты не дали бы прорыва
  answer:
  - 0
  - 2
  - 3
  explain: Модель перенимает ошибки и перекосы данных, поэтому качество данных важно при любом объёме.
- id: s-open-story
  type: open
  q: Расскажите историю ИИ из этого раздела как историю одной проблемы — по шагам «привычный мир, проблема, попытки, тупик,
    решение, новый мир». На каждом шаге назовите хотя бы один пример.
  rubric:
  - привычный мир — компьютер исполняет правила, написанные человеком (машина Тьюринга)
  - проблема — знания для «умной» машины слишком объёмны или не формулируются правилами
  - попытки и тупик — перцептрон (слишком простая модель), экспертные системы (правила не масштабируются), две зимы ИИ
  - решение — обучение на данных (статистическое обучение, бустинг, глубокие сети), ставшее возможным благодаря данным,
    вычислениям и алгоритмам
  - новый мир — распознавание картинок, языковые модели; названа цена (затраты, ошибки, вопросы к данным)
  wrong_answers:
  - нейросети придумали в 2012 году
  - экспертные системы проиграли из-за медленных компьютеров
  followups:
  - Какой шаг этой истории, по-вашему, мог бы повториться — например, новая «зима»?
  - Где в этой истории впервые появляется идея обучения на примерах?
  explain: Страница «История целиком» последней темы раздела.
- id: s-open-choose
  type: open
  q: 'Вам нужно решить две задачи: проверять, что сумма скидки посчитана по тарифу, и предсказывать, уйдёт ли клиент
    от банка, по таблице из 30 признаков. Какие подходы из истории ИИ вы бы выбрали для каждой и почему?'
  rubric:
  - для скидки — обычное правило в программе, потому что закономерность известна и точна
  - для ухода клиента — обучение на примерах; разумный выбор для таблицы — бустинг
  - объяснение опирается на уроки раздела — правила хороши, где они просты и точны; старые методы не умирают; выбор — инженерное
    решение под задачу
  wrong_answers:
  - для любой задачи нужна самая большая нейросеть
  - для ухода клиента лучше всего экспертная система
  followups:
  - Что изменится, если вместо таблицы у вас будут записи разговоров с клиентами?
  - Почему для скидки не нужно обучение?
  explain: Темы про бустинг и про три ингредиента, а также первая тема курса о выборе между правилами и обучением.
